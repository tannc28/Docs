# Da và mụn

Tài liệu này viết cho một người cụ thể: nam, 26 tuổi, sống ở Việt Nam nóng ẩm, mặt đang nổi nhiều mụn, đi xe máy đội mũ bảo hiểm, cạo râu, sắp tập tạ và có thể dùng whey. Người ấy không có ý định theo một quy trình mười bước. Mục tiêu là hiểu **vì sao mụn mọc** và biết **thứ gì thật sự trị được mụn**. Từ đó có một quy trình **hai, ba bước** mà vẫn đủ hiệu quả, kèm cách tự theo dõi xem quy trình ấy có tác dụng không.

<p class="doc-meta">Viết ngày 26/10/2026 · Ảnh minh hoạ đều có giấy phép mở, ghi công ở <a href="#credits">cuối tài liệu</a> · Đây là tài liệu kiến thức, không thay cho việc đi khám da liễu — nhất là khi mụn sưng to, đau, hay để lại sẹo.</p>

<p class="legend">Chấm màu nhỏ sau một câu là đường dẫn tới nguồn — bấm vào để xem: <span class="ev ev-high" title="Bằng chứng mạnh"></span> chắc chắn (hướng dẫn chính thức hoặc nhiều nghiên cứu lớn) · <span class="ev ev-mid" title="Bằng chứng vừa"></span> khá chắc · <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span> còn tranh cãi hoặc bằng chứng yếu · <span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span> lời khuyên thực hành của chính tài liệu này.</p>

<h2 id="short-version"><span class="num">0</span>Bản ngắn: tối nay bắt đầu từ đâu</h2>

Nếu chỉ đọc một trang, hãy đọc trang này. Phần còn lại là để giải thích **vì sao**.

| Lúc | Bước | Vì sao |
|---|---|---|
| Sáng | 1. Rửa mặt bằng sữa rửa mặt dịu | Bớt dầu mà da không khô rát — [§6.1](#cleansing) |
| Sáng | 2. Kem chống nắng không gây bít tắc (loại có kem dưỡng càng tốt) | Ngừa vết thâm sau mụn — [chương 8](#dark-marks) |
| Tối | 1. Rửa mặt | Như buổi sáng |
| Tối | 2. **Benzoyl peroxide 2,5–5%** — mua được ở nhà thuốc không cần đơn | Diệt vi khuẩn gây viêm — [§5.1](#bpo) |
| Tối | 3. Kem dưỡng mỏng nếu da khô | Giảm kích ứng — [§6.2](#moisturiser) |

Ba quy tắc đi kèm: **bắt đầu cách ngày** để da quen; **kiên nhẫn đủ 12 tuần** rồi mới kết luận; và **không nặn**.

Nếu sau 12 tuần vẫn không đỡ, hoặc có mụn sưng to, đau, hay đang để lại sẹo, hãy đi khám da liễu. Ở Việt Nam, những thuốc mạnh hơn đều là thuốc kê đơn ([chương 10](#doctor)).

d) đổ dầu vào chính cái ống ấy. Miệng ống trên mặt da chính là &quot;lỗ chân lông&quot;." loading="lazy"><figcaption>Mỗi sợi lông mọc từ một nang lông (follicle). Bên cạnh nang là một tuyến dầu (sebaceous gland) đổ dầu vào chính cái ống ấy. Miệng ống trên mặt da chính là "lỗ chân lông".</figcaption></figure>

Hãy hình dung mỗi lỗ chân lông là **một ống thoát nhỏ**, như ống thoát nước dưới bồn rửa bát. Dưới đáy ống mọc một sợi lông. Bên cạnh ống là tuyến bã nhờn (sebaceous gland), lúc nào cũng tiết dầu (sebum) vào lòng ống để giữ cho da mềm. Bình thường, dầu theo lòng ống chảy lên mặt da rồi tản đi. Tế bào chết ở thành ống cũng bong ra và trôi theo.

Mụn hay mọc nhất ở mặt, cổ, ngực và lưng<a class="ev ev-mid" href="#r-williams2012" title="Williams 2012 · Bằng chứng vừa"></a>.

<h2 id="how-acne-forms"><span class="num">2</span>Bốn chuyện cùng xảy ra mới thành một cái mụn</h2>

Vì sao mụn mọc? Không phải vì một nguyên nhân duy nhất. Cần bốn chuyện cùng xảy ra trong cùng một lỗ chân lông<a class="ev ev-mid" href="#r-williams2012" title="Williams 2012 · Bằng chứng vừa"></a>, giống hệt cách ống thoát bồn rửa bát bị tắc mỡ:

1. **Dầu nhiều hơn.** Hormone nam (androgen) khiến tuyến dầu tiết mạnh hơn, giống như đổ nhiều dầu mỡ xuống bồn rửa.
2. **Thành ống bám cặn.** Tế bào ở thành ống không bong ra trôi đi như bình thường mà dính vào nhau thành một cái nút, như cặn mỡ đông lại trong ống.
3. **Vi khuẩn sinh sôi trong chỗ tắc.** *Cutibacterium acnes* vốn sống trên da của mọi người. Gặp một cái ống bị bịt kín, đầy dầu, chúng sinh sôi nhanh.
4. **Cơ thể phản ứng viêm.** Hệ miễn dịch lao vào, và chỗ ấy đỏ lên, sưng, đau, có mủ.

Cũng vì vậy mà mỗi loại thuốc trị mụn nhắm vào một khâu khác nhau. **Kết hợp hai thuốc nhắm vào hai khâu** lại tốt hơn dùng một thứ ([chương 5](#actives)).

<h3 id="lesion-types"><span class="num">2.1</span>Đọc tên mụn trên mặt mình</h3>

Mụn trên mặt mình thuộc loại nào? Chỉ cần chia làm hai nhóm, vì bác sĩ cũng **đếm riêng từng nhóm**<a class="ev ev-high" href="#r-fdahngdnthnghimthuctrmn" title="FDA: hướng dẫn thử nghiệm thuốc trị mụn · Bằng chứng mạnh"></a>:

- **Mụn không viêm**, gồm **đầu trắng** (nốt nhỏ màu da, sờ thấy lợn cợn) và **đầu đen** (chấm đen ở miệng lỗ chân lông). Đây mới chỉ là "ống tắc", chưa viêm.
- **Mụn viêm**, gồm **sẩn** (nốt đỏ, hơi đau, không có mủ), **mụn mủ** (nốt đỏ có đầu trắng vàng), và **nốt, nang** (cục sưng to, sâu, đau, có thể kéo dài nhiều tuần).

Loại nốt, nang dễ để lại sẹo, nên gặp là đi khám sớm.

<details><summary>Đọc thêm: tên tiếng Anh của từng loại mụn</summary><div class="inner">

Mụn không viêm là comedone. Sẩn là papule, mụn mủ là pustule, nốt và nang là nodule và cyst. Đây là những tên bạn sẽ gặp trên nhãn thuốc và trong tài liệu da liễu.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: chấm điểm mặt mình</div>

Chọn một chỗ lần nào ánh sáng cũng như nhau (ví dụ cạnh cửa sổ vào buổi sáng), chụp ba ảnh: chính diện, nghiêng trái, nghiêng phải<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>. Rồi đếm riêng hai con số: **số mụn viêm** (đỏ, mủ, cục) và **số mụn không viêm** (đầu trắng, đầu đen) — đúng cách các thử nghiệm thuốc trị mụn vẫn đo<a class="ev ev-high" href="#r-fdahngdnthnghimthuctrmn" title="FDA: hướng dẫn thử nghiệm thuốc trị mụn · Bằng chứng mạnh"></a>. Hai tuần làm lại một lần. Thuốc có tác dụng khi **số mụn viêm giảm dần**, dù vài tuần đầu số mụn không viêm có thể chưa nhúc nhích<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

</div>

<h2 id="time-course"><span class="num">3</span>Vì sao trị mụn cần cả một mùa</h2>

Bôi thuốc bao lâu thì biết có tác dụng? Khoảng **12 tuần**. Hướng dẫn quốc gia của Anh (NICE) cũng chờ tới 12 tuần mới đánh giá một liệu trình<a class="ev ev-high" href="#r-nice2021iutr" title="NICE 2021 (điều trị) · Bằng chứng mạnh"></a>.

Vì sao lâu vậy? Thuốc trị mụn không "dập lửa" cái mụn đang có. Thuốc **thông ống từ gốc** để những cái mụn sắp tới không hình thành được. Nhãn của adapalene, một thuốc trị mụn phổ biến, ghi rõ có thể mất **tới ba tháng** mới thấy kết quả, và những tuần đầu mụn có thể trông như nặng hơn<a class="ev ev-high" href="#r-nhnfdadifferin01" title="Nhãn FDA: Differin 0,1% · Bằng chứng mạnh"></a>.

Hiện tượng "nặng hơn lúc đầu" hay được gọi là **purging**. Cách hiểu thực tế<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>:

- Vài tuần đầu nặng lên một chút rồi đỡ: chuyện thường.
- Da đỏ rát, bong tróc nhiều: đó là **kích ứng**, hãy giảm tần suất bôi.
- Nặng lên mãi sau sáu, tám tuần: thuốc không hợp, hãy hỏi bác sĩ.

**Ví dụ tính tay**<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>. Bạn bắt đầu bôi thuốc ngày 2/11. Tuần 1–2: da hơi khô, mụn chưa đổi. Tuần 3–4: vài nốt mới mọc, dễ nản. Tuần 6–8: so ảnh thì thấy số mụn viêm bắt đầu giảm rõ. Tuần 12 (khoảng 25/1): lúc để kết luận. Bỏ cuộc ở tuần 4 là bỏ đúng lúc thuốc sắp có tác dụng.

<details><summary>Đọc thêm: purging đã được nghiên cứu tới đâu</summary><div class="inner">

Nhãn thuốc có ghi hiện tượng nặng hơn lúc đầu, nhưng chưa nghiên cứu nào đo xem chuyện này hay gặp tới mức nào, kéo dài bao lâu<a class="ev ev-low" href="#r-nhnfdadifferin01-2" title="Nhãn FDA: Differin 0,1% · Bằng chứng yếu hoặc đang tranh cãi"></a>.

</div></details>

Nốt ngứa li ti ở ngực, lưng có phải mụn không? Có thể không. Có một loại nổi nốt trông rất giống mụn nhưng do **nấm men** *Malassezia* gây ra. Tên của nó là Malassezia folliculitis, dân gian gọi "mụn nấm".

Dấu hiệu nhận ra: **ngứa**, các nốt **nhỏ và đều nhau**, hay mọc ở **ngực, lưng, vai**, đôi khi ở trán. Mụn nấm hay gặp ở nam giới trẻ, và nặng thêm khi trời nóng, đổ mồ hôi. Chẳng hạn vào những tuần nóng nực, ngực và vai nổi lấm tấm những nốt đỏ đều nhau, ngứa<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

Vì là nấm, thuốc kháng sinh trị mụn **không có tác dụng**, trong khi thuốc kháng nấm thì có<a class="ev ev-mid" href="#r-green2022" title="Green 2022 · Bằng chứng vừa"></a>. Nhiều người đã dùng kháng sinh mãi không đỡ vì lý do này. Hãy để bác sĩ xác nhận đúng là nấm trước khi tự trị<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

<details><summary>Đọc thêm: thuốc kháng nấm không cần đơn</summary><div class="inner">

Một số thuốc kháng nấm bôi ngoài da như ketoconazole 2% hay selenium sulfide là thuốc không kê đơn ở Việt Nam<a class="ev ev-high" href="#r-thngt072017ttbyt" title="Thông tư 07/2017/TT-BYT · Bằng chứng mạnh"></a>.

</div></details>

Nếu nốt chỉ mọc ở **vùng râu** và sau mỗi lần cạo, có thể đó là **pseudofolliculitis barbae**. Sợi râu bị cạo quá sát, đầu sợi nhọn mọc cong rồi đâm ngược vào da, gây viêm. Các chuyên gia đồng thuận rằng bước đầu tiên là **đổi cách cạo**<a class="ev ev-mid" href="#r-alomary2026" title="Alomary 2026 · Bằng chứng vừa"></a>. Ví dụ: cạo xuôi chiều râu mọc, không kéo căng da khi cạo, không cạo đi cạo lại một chỗ, hoặc dùng tông-đơ để chừa lại một chút chân râu<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

<h3 id="perioral"><span class="num">4.3</span>Quanh miệng, quanh mũi, sau khi bôi kem "thần kỳ"</h3>

Những nốt nhỏ đỏ quanh miệng và cánh mũi, nhất là sau khi bôi một loại kem trộn hay kem có corticoid, có thể là **perioral dermatitis**. Nguyên nhân có bằng chứng rõ nhất là **lạm dụng corticoid bôi**<a class="ev ev-mid" href="#r-searle2021" title="Searle 2021 · Bằng chứng vừa"></a>. Đó là thêm một lý do để tránh "kem trị mụn cấp tốc" không rõ thành phần.

<h2 id="part-skin-2" class="part">Phần II — Thứ gì thật sự trị được mụn</h2>

<h2 id="actives"><span class="num">5</span>Các hoạt chất: chất nào lo khâu nào</h2>

Thuốc nào thật sự trị được mụn? Với mụn thường gặp, hai thứ nên biết trước tiên là benzoyl peroxide và retinoid bôi<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>. Nhớ lại bốn khâu của chiếc ống tắc: mỗi hoạt chất nhắm vào một hai khâu. Hướng dẫn của Viện Hàn lâm Da liễu Hoa Kỳ (AAD) xếp chúng theo mức chắc chắn<a class="ev ev-high" href="#r-aad2024" title="AAD 2024 · Bằng chứng mạnh"></a>:

| Hoạt chất | Nhắm vào khâu nào | Mức khuyến nghị | Ở Việt Nam |
|---|---|---|---|
| **Benzoyl peroxide** | Diệt vi khuẩn, bớt viêm | Mạnh | Không cần đơn (tới 10%) |
| **Retinoid bôi** (adapalene, tretinoin) | Thông ống, chống bám cặn | Mạnh | Thuốc kê đơn |
| Kháng sinh bôi, uống | Diệt vi khuẩn, bớt viêm | Mạnh — nhưng **luôn kèm benzoyl peroxide** | Thuốc kê đơn |
| Azelaic acid | Vi khuẩn, bám cặn, vết thâm | Có điều kiện | Thuốc kê đơn |
| Salicylic acid | Bong cặn ở lỗ chân lông | Có điều kiện | Không cần đơn |
| Isotretinoin uống | Cả bốn khâu | Mạnh, cho mụn nặng | Thuốc kê đơn, cần theo dõi |

<p class="src">Mức khuyến nghị theo AAD 2024; tình trạng kê đơn theo Thông tư 07/2017/TT-BYT về danh mục thuốc không kê đơn — chưa kiểm được các văn bản sửa đổi sau đó<a class="ev ev-high" href="#r-thngt072017ttbyt" title="Thông tư 07/2017/TT-BYT · Bằng chứng mạnh"></a>.</p>

<h3 id="bpo"><span class="num">5.1</span>Benzoyl peroxide — điểm bắt đầu không cần đơn</h3>

Không có đơn bác sĩ thì bắt đầu bằng gì? Bằng benzoyl peroxide, loại 2,5%.

Benzoyl peroxide là một chất oxy hoá. Chất này diệt vi khuẩn trong lỗ chân lông bằng phản ứng hoá học, giống như **mở toang cửa cho gió lùa** vào một căn phòng kín ẩm mốc<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>. Các hướng dẫn điều trị luôn ghép benzoyl peroxide với kháng sinh để **hạn chế vi khuẩn nhờn thuốc**<a class="ev ev-high" href="#r-williams2012" title="Williams 2012 · Bằng chứng mạnh"></a>. Tức là chất này làm được việc mà kháng sinh dùng một mình không làm được.

**Nồng độ cao không tốt hơn.** Trong một thử nghiệm, loại 2,5% trị mụn viêm tốt ngang loại 5% và 10%, mà ít gây khô rát hơn loại 10%<a class="ev ev-mid" href="#r-mills1986" title="Mills 1986 · Bằng chứng vừa"></a>.

Nhãn thuốc dặn hai điều<a class="ev ev-high" href="#r-nhnfdabenzoylperoxide" title="Nhãn FDA: benzoyl peroxide · Bằng chứng mạnh"></a>. Thứ nhất, thuốc **tẩy màu** tóc, khăn, vỏ gối, áo màu, nên hãy dùng khăn trắng. Thứ hai, nếu da rát, hãy bôi thưa đi hoặc dùng nồng độ thấp hơn.

<h3 id="retinoid"><span class="num">5.2</span>Adapalene — người thợ thông ống</h3>

Adapalene có đáng để đi khám lấy đơn không? Có, vì ghép với benzoyl peroxide thì mạnh hơn hẳn.

Retinoid như adapalene giúp tế bào ở thành ống **bong ra đều đặn** thay vì dính lại thành nút. Tức là thuốc chặn ngay từ khâu số 2, trước khi mụn kịp hình thành. Adapalene kết hợp với benzoyl peroxide hiệu quả hơn hẳn từng thứ riêng lẻ, mà không kích ứng hơn adapalene dùng một mình<a class="ev ev-high" href="#r-thiboutot2007" title="Thiboutot 2007 · Bằng chứng mạnh"></a>.

Ở Việt Nam, adapalene không có trong danh mục thuốc không kê đơn, tức là về mặt pháp lý phải có đơn của bác sĩ<a class="ev ev-high" href="#r-thngt072017ttbyt" title="Thông tư 07/2017/TT-BYT · Bằng chứng mạnh"></a>. Đó là một lý do thực tế để đi khám da liễu một lần: bác sĩ kê đúng loại kết hợp, đúng nồng độ cho da bạn<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

Khi mụn đã sạch, **cứ tiếp tục bôi adapalene** để giữ kết quả. Trong một thử nghiệm, 75% số người tiếp tục bôi giữ được kết quả, so với 54% ở những người ngưng thuốc<a class="ev ev-mid" href="#r-thiboutot2006" title="Thiboutot 2006 · Bằng chứng vừa"></a>.

<details><summary>Đọc thêm: NICE xếp thứ tự thế nào</summary><div class="inner">

Theo NICE, adapalene kết hợp benzoyl peroxide là lựa chọn đầu tay cho mọi mức độ mụn<a class="ev ev-high" href="#r-nice2021iutr" title="NICE 2021 (điều trị) · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="weak-actives"><span class="num">5.3</span>Những thứ được quảng cáo nhiều mà bằng chứng mỏng</h3>

Serum niacinamide, salicylic acid có đáng mua không? Đừng bỏ nhiều tiền vào chúng mà bỏ qua hai hoạt chất chính<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

Salicylic acid, niacinamide, kẽm, lưu huỳnh: tổng quan Cochrane đánh giá bằng chứng cho những chất này ở mức **thấp hoặc rất thấp**, và azelaic acid có lẽ kém benzoyl peroxide<a class="ev ev-high" href="#r-liu2020" title="Liu 2020 · Bằng chứng mạnh"></a>. Không phải chúng vô dụng. Chỉ là bằng chứng cho chúng mỏng hơn nhiều so với benzoyl peroxide và adapalene.

<details><summary>Đọc thêm: niacinamide và tinh dầu tràm trà</summary><div class="inner">

Niacinamide 4% từng ngang kháng sinh bôi trong một thử nghiệm nhỏ. Kết quả đáng chú ý nhưng chưa đủ chắc<a class="ev ev-low" href="#r-khodaeiani2013" title="Khodaeiani 2013 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

Tinh dầu tràm trà có tác dụng khiêm tốn trong những thử nghiệm nhỏ, chất lượng thấp<a class="ev ev-low" href="#r-ye2026" title="Ye 2026 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

</div></details>

<h2 id="basic-care"><span class="num">6</span>Chăm da nền — phần đơn giản nhất</h2>

<h3 id="cleansing"><span class="num">6.1</span>Rửa mặt hai lần là vừa</h3>

Rửa mặt mấy lần là đủ? Hai lần mỗi ngày. Trong một thử nghiệm nhỏ, rửa mặt **hai lần mỗi ngày** bằng sữa rửa mặt dịu cải thiện mụn không viêm. Rửa một lần thì mụn viêm nặng hơn, còn rửa bốn lần cũng không tốt hơn hai lần<a class="ev ev-mid" href="#r-choi2006" title="Choi 2006 · Bằng chứng vừa"></a>.

Nên chọn sữa rửa mặt nào? NICE khuyên dùng loại **không xà phòng, độ pH trung tính hoặc hơi axit**<a class="ev ev-high" href="#r-nice2021iutr" title="NICE 2021 (chăm da) · Bằng chứng mạnh"></a>.

Chà mạnh hay rửa liên tục cũng không "rửa trôi" được mụn. Mụn nằm sâu trong lòng ống, đâu phải bụi bám trên mặt<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

<h3 id="moisturiser"><span class="num">6.2</span>Kem dưỡng không phải đồ thừa</h3>

Da dầu có cần kem dưỡng không? Có, khi đang bôi thuốc trị mụn. Thuốc trị mụn hay gây khô, rát, và một lớp kem dưỡng giúp da chịu thuốc tốt hơn hẳn. Trong một thử nghiệm trên da người châu Á, nửa mặt có bôi kem dưỡng ít bị adapalene làm kích ứng hơn<a class="ev ev-mid" href="#r-matsunaga2013" title="Matsunaga 2013 · Bằng chứng vừa"></a>. Da chịu được thuốc thì bạn mới dùng đủ 12 tuần<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

Chọn loại mỏng, không chứa dầu. NICE khuyên tránh kem dưỡng và kem chống nắng gốc dầu<a class="ev ev-high" href="#r-nice2021iutr" title="NICE 2021 (chăm da) · Bằng chứng mạnh"></a>.

<h3 id="labels"><span class="num">6.3</span>Đọc nhãn: tin vào hoạt chất, đừng tin vào lời quảng cáo</h3>

Chữ **"non-comedogenic"** (không gây bít tắc lỗ chân lông) trên bao bì có đáng tin không? Không hẳn. Đó chỉ là **lời quảng cáo**, không phải chứng nhận. Ở Mỹ, cơ quan quản lý không duyệt trước các tuyên bố trên mỹ phẩm và không có danh sách tuyên bố được chấp thuận<a class="ev ev-high" href="#r-fdatuynbtrnmphm" title="FDA: tuyên bố trên mỹ phẩm · Bằng chứng mạnh"></a>.

Cách đọc nhãn hữu ích hơn<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>:

- Tìm **tên hoạt chất và nồng độ**, ví dụ "Benzoyl peroxide 2,5%".
- Với kem dưỡng và kem chống nắng, ưu tiên loại mỏng, dạng gel hoặc lotion.
- Thử trên một vùng nhỏ vài ngày trước khi bôi cả mặt. Chính nhãn benzoyl peroxide cũng khuyên thử trên vùng nhỏ ba ngày đầu<a class="ev ev-high" href="#r-nhnfdabenzoylperoxide" title="Nhãn FDA: benzoyl peroxide · Bằng chứng mạnh"></a>.

<h2 id="part-skin-3" class="part">Phần III — Thói quen và tác nhân</h2>

<h2 id="triggers"><span class="num">7</span>Điều gì khiến mụn nặng thêm — và điều gì chỉ là lời đồn</h2>

Có cần kiêng sữa, đồ ngọt, whey không? Không cần kiêng chung. Thứ đáng để ý trước là những gì cọ, đè lên da như quai mũ bảo hiểm, và việc nặn mụn<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

Bảng dưới xếp các tác nhân từ có bằng chứng tới chủ yếu là đồn đoán. Điểm chung: phần lớn chỉ là **tương quan**. Chúng có thể khiến mụn nặng thêm, nhưng tránh chúng không thay được thuốc.

| Tác nhân | Bằng chứng nói gì | Làm gì |
|---|---|---|
| **Ma sát, đè ép** — mũ bảo hiểm, quai mũ, khẩu trang | Đè, cọ, bít kín da gây mụn viêm mới ở da dễ nổi mụn<a class="ev ev-mid" href="#r-mills1975" title="Mills 1975 · Bằng chứng vừa"></a> | Lót vải mỏng sạch giữa quai mũ và da, giặt thường xuyên<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span> |
| **Nặn mụn** | Đi kèm sẹo nhiều hơn<a class="ev ev-low" href="#r-yan2025" title="Yan 2025 · Bằng chứng yếu hoặc đang tranh cãi"></a> | Không nặn; mụn to đau thì đi khám |
| **Đồ ăn đường bột nhanh** | Chế độ ăn ít đường bột tinh chế làm giảm mụn ở nam thanh niên trong một thử nghiệm — nhưng họ cũng giảm cân nên khó tách bạch<a class="ev ev-mid" href="#r-smith2007" title="Smith 2007 · Bằng chứng vừa"></a> | Hợp với kế hoạch ăn ở tài liệu sức khoẻ; đừng kỳ vọng nó thay thuốc |
| **Sữa** | Tương quan nhẹ, chủ yếu từ nghiên cứu quan sát<a class="ev ev-low" href="#r-juhl2018" title="Juhl 2018 · Bằng chứng yếu hoặc đang tranh cãi"></a>; NICE cho rằng chưa đủ bằng chứng cho chế độ ăn đặc biệt nào<a class="ev ev-high" href="#r-nice2021iutr" title="NICE 2021 (chăm da) · Bằng chứng mạnh"></a> | Không cần kiêng; nếu nghi ngờ, tự thử bớt bốn tuần và đếm mụn<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span> |
| **Whey** | Có báo cáo ca bệnh và nghiên cứu đối chứng gợi ý liên quan, nhưng thử nghiệm sáu tháng ở nam giới không thấy whey làm mụn nặng hơn<a class="ev ev-low" href="#r-wheyvmn2024" title="Whey và mụn (2024) · Bằng chứng yếu hoặc đang tranh cãi"></a> | Dùng được; theo dõi bằng ảnh nếu lo |
| **Căng thẳng** | Mụn nặng hơn mùa thi, đi cùng mức căng thẳng<a class="ev ev-low" href="#r-chiu2003" title="Chiu 2003 · Bằng chứng yếu hoặc đang tranh cãi"></a> | Thêm một lý do để ngủ đủ và tập đều |
| **Mồ hôi sau tập** | Tắm muộn sau tập không làm mụn thân nặng hơn trong một thử nghiệm nhỏ<a class="ev ev-low" href="#r-short2008" title="Short 2008 · Bằng chứng yếu hoặc đang tranh cãi"></a> | Rửa mặt khi tiện là đủ, không cần cuống quýt |

<details><summary>Đọc thêm: thiếu ngủ, nóng ẩm, hút thuốc</summary><div class="inner">

Thiếu ngủ và mụn có liên quan hai chiều, nhưng chưa có thử nghiệm chứng minh ngủ thêm thì đỡ mụn<a class="ev ev-low" href="#r-samaniego2025" title="Samaniego 2025 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

Nhiều người tự nhận mụn nặng hơn mùa hè<a class="ev ev-low" href="#r-narang2019" title="Narang 2019 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

Với hút thuốc, kết quả nghiên cứu mâu thuẫn<a class="ev ev-low" href="#r-htthucvmn2021" title="Hút thuốc và mụn (2021) · Bằng chứng yếu hoặc đang tranh cãi"></a>. Bỏ thuốc vì những lý do khác đã đủ.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: một tác nhân có đúng với bạn không</div>

Nghi ngờ thứ gì — sữa, whey, quai mũ — thì làm một thí nghiệm nhỏ<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>: giữ nguyên mọi thứ khác (cùng thuốc, cùng sữa rửa mặt), chỉ đổi đúng thứ đó trong **bốn tuần**, và đếm mụn viêm bằng ảnh như ở [§2.1](#lesion-types). Số mụn giảm rõ so với bốn tuần trước — thứ đó có lẽ đúng là thủ phạm với bạn. Không đổi gì — thì thôi, khỏi kiêng. Mỗi lần chỉ thử một thứ, vì đổi nhiều thứ cùng lúc thì không biết thứ nào có tác dụng.

Ví dụ<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>: mụn cứ mọc dọc đường quai mũ bảo hiểm dưới cằm. Bốn tuần, mỗi lần đi xe đều lót một miếng vải mỏng sạch giữa quai và da, giặt vải vài ngày một lần; thuốc và sữa rửa mặt giữ nguyên. Hết bốn tuần, so ảnh vùng cằm với ảnh trước đó: mụn viêm ở đó thưa hẳn thì cứ lót tiếp; vẫn y như cũ thì quai mũ không phải thủ phạm chính.

</div>

<h2 id="dark-marks"><span class="num">8</span>Vết thâm và sẹo: phần để lại lâu hơn cái mụn</h2>

<h3 id="pih"><span class="num">8.1</span>Vết thâm — vết ám khói sau một đám cháy nhỏ</h3>

Vết thâm sau mụn có tự mất không? Có, nhưng chậm, và bạn làm nó mờ nhanh hơn được.

Sau khi một cái mụn viêm lặn đi, da người châu Á hay để lại **một vết nâu**, gọi là **post-inflammatory hyperpigmentation** (PIH). Hãy hình dung chỗ viêm là một **đám cháy nhỏ**: lửa tắt rồi, nhưng vết ám khói vẫn còn đó. Trong một khảo sát ở nhiều nước châu Á, 58% người bị mụn có vết thâm. Hơn một nửa số đó kéo dài **ít nhất một năm**, và nhiều người thấy vết thâm còn khó chịu hơn cả mụn<a class="ev ev-mid" href="#r-abadcasintahan2016" title="Abad-Casintahan 2016 · Bằng chứng vừa"></a>.

Theo đồng thuận chuyên gia, có hai việc giúp vết thâm mờ nhanh hơn<a class="ev ev-mid" href="#r-auffret2025" title="Auffret 2025 · Bằng chứng vừa"></a>:

- **Kem chống nắng mỗi sáng**, phổ rộng, SPF50+, tốt nhất là loại có màu. Tia UV, và cả ánh sáng nhìn thấy, đều khiến vết thâm đậm thêm.
- **Trị mụn sớm và đều**, vì retinoid vừa trị mụn vừa giúp vết thâm mờ đi. Nhưng chính **kích ứng do thuốc** cũng có thể gây thâm. Đó là thêm một lý do để bắt đầu cách ngày và dùng kem dưỡng.

<h3 id="scars"><span class="num">8.2</span>Sẹo — vì sao không nên chờ</h3>

Cứ để mụn tự hết có sao không? Có: chờ càng lâu, nguy cơ để lại sẹo càng cao.

Sẹo lõm khác vết thâm. Vết thâm chỉ là màu, rồi sẽ mờ. Sẹo là **mất mô**, khó phục hồi. Mụn càng nặng và càng **chậm được trị đúng cách** thì sẹo càng nhiều, kể cả những nốt sẩn đỏ nông cũng có thể để lại sẹo<a class="ev ev-mid" href="#r-layton1994" title="Layton 1994 · Bằng chứng vừa"></a>.

Nặn mụn cũng đi kèm nhiều sẹo hơn<a class="ev ev-low" href="#r-yan2025" title="Yan 2025 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Muốn giữ da phẳng, hãy trị sớm và để tay khỏi mặt<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

<div class="callout data"><div class="ct">Tự kiểm tra: phân biệt thâm với sẹo</div>

Đứng trước gương, bật đèn điện thoại chiếu **xiên** qua mặt da<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>. Vết thâm thì phẳng — chỉ khác màu, đèn chiếu xiên không đổ bóng. Sẹo lõm thì đổ một **vũng bóng nhỏ**, vì da bị trũng xuống. Vết thâm cần kem chống nắng và thời gian; sẹo cần bác sĩ da liễu.

</div>

<h2 id="part-skin-4" class="part">Phần IV — Quy trình của bạn</h2>

<h2 id="routine"><span class="num">9</span>Hai bước sáng, hai ba bước tối</h2>

**Buổi sáng** (2 phút)<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>:

1. Rửa mặt bằng sữa rửa mặt dịu, nước mát, lau khô bằng khăn sạch.
2. Kem chống nắng phổ rộng, SPF50+, dạng mỏng, không dầu. Nếu da khô, chọn loại có sẵn kem dưỡng để gộp hai bước làm một.

**Buổi tối** (3 phút)<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>:

1. Rửa mặt.
2. Đợi da khô hẳn, bôi một lớp **mỏng** benzoyl peroxide 2,5–5% lên **cả vùng hay nổi mụn**. Đừng chỉ chấm lên từng nốt, vì thuốc còn ngăn mụn mới chứ không chỉ trị mụn cũ.
3. Nếu da khô rát, thêm kem dưỡng mỏng.

**Cách bắt đầu.** Tuần 1–2: bôi thuốc **cách ngày**, hoặc bôi rồi một giờ sau rửa đi. Đó là cách NICE khuyên để da quen dần<a class="ev ev-high" href="#r-nice2021iutr" title="NICE 2021 (điều trị) · Bằng chứng mạnh"></a>. Từ tuần 3, nếu da ổn thì bôi mỗi tối. Dùng khăn và vỏ gối trắng vì benzoyl peroxide tẩy màu vải<a class="ev ev-high" href="#r-nhnfdabenzoylperoxide" title="Nhãn FDA: benzoyl peroxide · Bằng chứng mạnh"></a>.

**Với lịch của bạn**<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>: gắn việc bôi thuốc vào thói quen tối sau khi tắm, ngay sau bước "rửa mặt". Đó là kiểu if-then plan ở [Nền tảng vận hành cuộc sống, §6.2](running-your-life.html#if-then): *"Khi tôi treo khăn tắm lên, tôi bôi thuốc."* Sau buổi tập: rửa mặt khi tiện. Đi xe máy thì lót một lớp vải mỏng giữa quai mũ và cằm.

**Ví dụ một tuần đầu**<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>. Chủ nhật: chụp ba ảnh, đếm mụn viêm, giả sử được 14 nốt. Thứ Hai, Tư, Sáu: bôi benzoyl peroxide 2,5%. Thứ Ba, Năm, Bảy: chỉ rửa mặt và kem dưỡng. Chủ nhật tuần sau: da hơi khô nhưng chưa rát, vậy từ tuần 3 bôi mỗi tối. Hai tuần chụp lại và đếm một lần. Tới tuần 12, nếu số mụn viêm từ 14 xuống còn vài nốt thì cứ tiếp tục. Nếu vẫn quanh 14 thì đi khám.

<h2 id="doctor"><span class="num">10</span>Khi nào đi khám da liễu</h2>

Khi nào thì tự trị không đủ nữa? Theo hướng dẫn NICE<a class="ev ev-high" href="#r-nice2021iutr" title="NICE 2021 (chuyển khám) · Bằng chứng mạnh"></a>, nên đi khám khi:

- có **mụn nốt, mụn nang**: cục sưng to, sâu, đau;
- mụn **đang để lại sẹo**, hoặc vết thâm kéo dài mãi;
- đã dùng đủ liệu trình 12 tuần mà không đỡ;
- mụn khiến bạn **buồn bực, mất tự tin kéo dài**. Lý do này cũng chính đáng như mọi lý do khác;
- không chắc đó có phải mụn không, ví dụ nghi là mụn nấm ([§4.1](#fungal-acne)).

Bác sĩ có những thứ mạnh hơn mà bạn không tự mua được: retinoid và các dạng kết hợp, kháng sinh uống, và isotretinoin cho mụn nặng. Kháng sinh luôn đi kèm benzoyl peroxide, không bao giờ dùng một mình<a class="ev ev-high" href="#r-nice2021iutr" title="NICE 2021 (điều trị) · Bằng chứng mạnh"></a>.

**Isotretinoin** rất hiệu quả nhưng phải có bác sĩ theo dõi. Đừng mua isotretinoin theo lời mách.

<details><summary>Đọc thêm: theo dõi khi dùng isotretinoin</summary><div class="inner">

Khi dùng isotretinoin, cần xét nghiệm mỡ máu và men gan trước và trong khi dùng, theo dõi tâm trạng, và không hiến máu trong thời gian điều trị<a class="ev ev-high" href="#r-nhnfdaisotretinoin" title="Nhãn FDA: isotretinoin · Bằng chứng mạnh"></a>.

</div></details>

<div class="recall">

**Câu hỏi nhớ lại**

<details><summary>Bốn chuyện nào cùng xảy ra thì thành một cái mụn?</summary><div class="inner">

Dầu nhiều hơn (do hormone), tế bào ở thành lỗ chân lông dính lại thành nút, vi khuẩn C. acnes sinh sôi trong chỗ tắc, và phản ứng viêm.

</div></details>

<details><summary>Vì sao benzoyl peroxide không làm vi khuẩn nhờn thuốc như kháng sinh?</summary><div class="inner">

Vì benzoyl peroxide diệt vi khuẩn bằng phản ứng oxy hoá, chứ không theo cách của kháng sinh. Vì thế các hướng dẫn luôn ghép benzoyl peroxide với kháng sinh để hạn chế vi khuẩn nhờn thuốc.

</div></details>

<details><summary>Nốt nhỏ, đều nhau, ngứa, ở ngực và lưng, uống kháng sinh không đỡ. Có thể là gì?</summary><div class="inner">

Malassezia folliculitis — "mụn nấm". Cần thuốc kháng nấm, và nên để bác sĩ xác nhận.

</div></details>

<details><summary>Sau bao lâu mới nên kết luận một loại thuốc trị mụn không tác dụng?</summary><div class="inner">

Khoảng 12 tuần. Vài tuần đầu mụn có thể trông như nặng hơn; hãy đánh giá bằng số mụn viêm trong những ảnh chụp định kỳ.

</div></details>

</div>

<h2 id="myths-skin"><span class="num">A</span>Phụ lục: những điều hay nghe về mụn</h2>

| Hay nghe | Thực tế |
|---|---|
| "Mụn là do mặt bẩn, phải rửa thật nhiều" | Mụn hình thành sâu trong lỗ chân lông; rửa hai lần mỗi ngày là đủ, rửa bốn lần không tốt hơn<a class="ev ev-mid" href="#r-choi2006" title="Choi 2006 · Bằng chứng vừa"></a> |
| "Thuốc nồng độ càng cao càng nhanh khỏi" | Benzoyl peroxide 2,5% hiệu quả ngang 10% mà ít rát hơn<a class="ev ev-mid" href="#r-mills1986" title="Mills 1986 · Bằng chứng vừa"></a> |
| "Bôi thuốc hai tuần không đỡ là thuốc dở" | Cần tới khoảng 12 tuần<a class="ev ev-high" href="#r-nhnfdadifferin01" title="Nhãn FDA: Differin 0,1% · Bằng chứng mạnh"></a> |
| "Da dầu thì không cần kem dưỡng" | Kem dưỡng giúp da chịu được thuốc trị mụn<a class="ev ev-mid" href="#r-matsunaga2013" title="Matsunaga 2013 · Bằng chứng vừa"></a> |
| "Chữ non-comedogenic là đã được kiểm định" | Chỉ là tuyên bố quảng cáo, không được duyệt trước<a class="ev ev-high" href="#r-fdatuynbtrnmphm" title="FDA: tuyên bố trên mỹ phẩm · Bằng chứng mạnh"></a> |
| "Kháng sinh là thuốc trị mụn mạnh nhất, cứ uống là khỏi" | Phải kê đơn, luôn kèm benzoyl peroxide, không dùng một mình<a class="ev ev-high" href="#r-nice2021iutr" title="NICE 2021 (điều trị) · Bằng chứng mạnh"></a> |
| "Ăn đồ ngọt, uống sữa là nổi mụn" | Có liên quan nhưng bằng chứng còn yếu; không đủ để kiêng chung cho mọi người<a class="ev ev-high" href="#r-nice2021iutr" title="NICE 2021 (chăm da) · Bằng chứng mạnh"></a> |
| "Mụn sẽ tự hết, cứ để đó" | Chậm trị đúng cách thì sẹo nhiều hơn<a class="ev ev-mid" href="#r-layton1994" title="Layton 1994 · Bằng chứng vừa"></a> |
