Về các con số IELTS: theo IELTS, band tổng 5.5–6.5 tương đương CEFR B2, còn 7–8 tương đương C1 ([IELTS: IELTS and the CEFR](#r-ieltscefr)); thang điểm của Cambridge đặt 6.5 ở ranh giới B2/C1 ([Cambridge: comparing scores to IELTS](#r-cambridgeielts)). Cambridge ước tính tổng cộng khoảng 350–400 giờ có hướng dẫn cho B1 và 500–600 giờ cho B2, nhưng nói rõ đó "chỉ là hướng dẫn" và là giờ học có giáo viên, không phải giờ tự học ([Cambridge GLH](#r-cambridge)). IELTS dẫn hai nghiên cứu cho thấy học viên thường mất ba tháng để tăng tối đa nửa band; người tăng nhiều nhất bắt đầu dưới 5.5 và học hơn 23 giờ mỗi tuần ([IELTS: how long](#r-ieltshowlong)). Band tổng là trung bình của bốn kỹ năng, nên một kỹ năng mạnh không kéo được ba kỹ năng yếu. Và không có nguồn đáng tin nào về số giờ cho người Việt học tiếng Anh — bảng giờ của FSI chỉ áp dụng cho người bản xứ tiếng Anh học ngoại ngữ ([FSI](#r-fsi)). Tốc độ của chính bạn, đo lại sau mỗi tám tuần, là con số đáng tin hơn mọi bảng chung.

<h3 id="learning-worked-example"><span class="num">13.3</span>Một buổi học ngắn, áp dụng cho bất kỳ môn nào</h3>

Một buổi 25 phút có thể chứa cả ba kỹ năng mạnh nhất <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Mười phút đầu là **retrieval**: tự trả lời trước khi xem đáp án — thẻ từ, hoặc câu hỏi tự đặt về bài hôm qua. Mười phút tiếp là **input mới** ở mức hiểu được phần lớn — một đoạn nghe có transcript, một mục tài liệu kỹ thuật. Năm phút cuối là **generation kèm feedback** — viết ba câu dùng đúng lỗi vừa bị sửa, hoặc viết ba dòng giải thích lại bằng lời của mình. Cấu trúc này dùng được cho tiếng Anh, lập trình, tài chính, hay bất kỳ kỹ năng nào.

Và một phép nhân đơn giản, không phải dự đoán: 25 phút × 5 ngày = 125 phút mỗi tuần; nếu đều đặn 52 tuần thì được khoảng 108 giờ mỗi năm (125 × 52 ÷ 60 = 108,3). Tiến bộ được đo bằng giờ. Ý định thì không đo được.

<h2 id="thinking-well"><span class="num">14</span>Tư duy tốt</h2>

<h3 id="no-thinking-muscle"><span class="num">14.1</span>Không có một "cơ bắp tư duy" chung</h3>

Chơi cờ, học nhạc, luyện working memory hay dùng ứng dụng "luyện não" làm bạn giỏi **chính việc đó**. Câu hỏi là chúng có làm bạn giỏi lên ở những việc khác không — far transfer — và câu trả lời phụ thuộc hoàn toàn vào việc so với ai:

```chart bar
chương trình,So với nhóm không làm gì,So với nhóm làm một hoạt động khác
Âm nhạc,0.25,0.03
Working memory,0.18,0.05
```

<p class="small muted">Hiệu ứng far transfer (độ lệch chuẩn). Nguồn: Sala & Gobet 2017, Curr Dir Psychol Sci 26(6):515–520; số liệu ở trẻ em.</p>

Khi nhóm đối chứng cũng được làm một hoạt động khác, hiệu ứng gần như biến mất ([Sala & Gobet 2017](#r-sala2017); [Simons 2016](#r-simons2016)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. "Lợi ích" ban đầu chủ yếu đến từ việc được làm *một việc gì đó*. Không có cơ bắp tư duy chung nào để luyện.

<h3 id="three-layers"><span class="num">14.2</span>Ba tầng của tư duy tốt</h3>

```mermaid
flowchart TB
  K["① Kiến thức nền của lĩnh vực"]
  D["② Thinking dispositions"]
  S["③ Chiến lược: consider the opposite,<br/>tìm cấu trúc sâu, dùng base rate"]
  K --> J["Phán đoán tốt"]
  D --> J
  S --> J
  F["④ Feedback có chấm điểm"] -->|"calibration"| J
```

1. **Kiến thức.** Kiện tướng cờ vua nhớ được khoảng 16 quân sau năm giây nhìn một thế cờ thật, người mới chơi khoảng 4 (nghiên cứu gốc chỉ có ba người chơi) — nhưng với thế cờ xếp ngẫu nhiên thì khác biệt gần như biến mất ([Chase & Simon 1973](#r-chase1973)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Chuyên gia không có trí nhớ tốt hơn; họ có vốn kiến thức đủ để "nhìn" ra các thế quen. Vì vậy critical thinking phụ thuộc vào kiến thức của chính lĩnh vực đó ([Willingham 2007](#r-willingham2007)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; dạy critical thinking có tác dụng khiêm tốn, g = 0,30, tốt hơn khi có đối thoại, vấn đề thực tế và mentoring ([Abrami 2015](#r-abrami2015)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.
2. **Thinking dispositions** — thói quen tư duy, khác với trí thông minh. Nhiều thiên kiến (anchoring, framing, myside, sunk cost, bỏ qua base rate) **không tương quan với IQ** ([Stanovich & West 2008](#r-stanovich2008)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Actively open-minded thinking — chủ động tìm bằng chứng đi ngược niềm tin của mình — dự báo độ chính xác, vì nó khiến người ta chịu tìm thêm thông tin ([Haran 2013](#r-haran2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.
3. **Chiến lược.** "Consider the opposite" — tự hỏi vì sao điều ngược lại có thể đúng — hiệu quả hơn lời dặn "hãy công bằng" ([Lord 1984](#r-lord1984)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.
4. **Feedback có chấm điểm** giúp hiệu chỉnh tất cả những điều trên. Dưới một giờ huấn luyện về xác suất cải thiện độ chính xác dự báo 6–11% ([Chang 2016](#r-chang2016)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; những người dự báo giỏi nhất cập nhật niềm tin thường xuyên và coi dự báo là một kỹ năng cần luyện ([Mellers 2015](#r-mellers2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; một trò chơi debiasing có feedback cá nhân giảm thiên kiến và vẫn còn tác dụng sau hai tháng ([Morewedge 2015](#r-morewedge2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

<h3 id="transfer"><span class="num">14.3</span>Transfer luyện được — nhưng phải có chủ đích</h3>

```chart bar
cách học,% giải được bài toán mới (trước khi có gợi ý)
Đọc 1 ví dụ,21
So sánh 2 ví dụ khác bề ngoài,45
```

<p class="small muted">Nguồn: Gick & Holyoak 1983, Cognitive Psychology 15(1):1–38.</p>

Khi người học đọc **hai** ví dụ khác nhau bề ngoài của cùng một nguyên lý rồi so sánh chúng, 45% giải được một bài toán mới trước khi có gợi ý, so với 21% khi chỉ đọc một ví dụ ([Gick & Holyoak 1983](#r-gick1983)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. "Tư duy toàn diện" không đến từ việc đọc nhiều chủ đề rời rạc, mà đến từ **so sánh cấu trúc giữa các lĩnh vực** và **chấm điểm phán đoán của chính mình**. Cuốn sách này cố ý làm như vậy: vòng lặp buổi tối, việc bỏ tập thể dục và việc tiết kiệm được phân tích bằng cùng một cấu trúc.

Có bốn thói quen nhỏ để đưa các bằng chứng trên vào đời sống. Mỗi đầu tuần, ghi ba đến năm dự đoán có xác suất về những việc trong tuần, cuối tuần chấm điểm bằng **Brier score** — (xác suất − kết quả)², với kết quả là 1 nếu sự việc xảy ra và 0 nếu không, càng thấp càng tốt. Dự đoán 70% rằng một việc sẽ xong trước thứ Sáu và nó xong thật cho điểm (0,7 − 1)² = 0,09; dự đoán 90% và nó không xong cho điểm (0,9 − 0)² = 0,81 — một dấu hiệu tự tin quá mức. Sau mỗi phần code hay tài liệu đọc ở công ty, viết một dòng "vì sao nó như vậy" — self-explanation ngay trong lĩnh vực của mình. Mỗi khi học một pattern mới, tìm thêm một ví dụ của nó ở một lĩnh vực khác. Và trước một quyết định lớn, viết ra lập luận mạnh nhất cho lựa chọn ngược lại.

<h3 id="personality"><span class="num">14.4</span>Con người có tự thay đổi được không</h3>

Có, nhưng chậm, và chỉ qua hành động. Các can thiệp làm thay đổi đặc điểm tính cách trung bình d = 0,37 trong khoảng 24 tuần, chủ yếu ở mẫu lâm sàng; nhưng riêng conscientiousness chỉ d = 0,19, và trong các thí nghiệm có nhóm đối chứng, thay đổi về conscientiousness chỉ d = 0,06, không có ý nghĩa thống kê; hiệu chỉnh small-study bias còn kéo hiệu ứng chung so với nhóm đối chứng từ 0,43 xuống 0,13, cũng không có ý nghĩa thống kê, dù các tác giả lưu ý ước lượng hiệu chỉnh này kém chính xác ([Roberts 2017](#r-roberts2017)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Với việc chủ động thay đổi tính cách, một kết quả đáng nhớ: **chấp nhận thử thách không dự báo thay đổi; hoàn thành thử thách thì có** ([Hudson 2019](#r-hudson2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Đó cũng là câu tóm tắt cả cuốn sách: bạn trở thành người làm những việc bạn đã thực sự làm — không phải những việc bạn đã định làm.

<div class="recall">

**Câu hỏi nhớ lại — Phần II (chương 11–14).**

<details><summary>Vì sao người thân yêu cần khung giờ cố định, nhưng nội dung lại nên để "thô"?</summary><div class="inner">

Mục tiêu không có phần thưởng rõ ràng sẽ luôn nhường thời gian cho mục tiêu có deadline; nhưng đặt giờ chính xác cho giải trí làm nó giống công việc và kém vui hơn (Tonietto & Malkoc 2016).

</div></details>

<details><summary>Thí nghiệm đăng ký quỹ hưu trí mặc định cho thấy hai điều gì về default?</summary><div class="inner">

Default làm tỷ lệ tham gia tăng từ 37% lên 86% (mức sàn), nhưng 76% người ở lại đúng mức mặc định 3% (mức trần) — nên mức tự động phải được chọn có chủ đích.

</div></details>

<details><summary>Đọc lại 4 lần và tự kiểm tra 3 lần: nhóm nào nhớ hơn sau một tuần, nhóm nào tự tin hơn?</summary><div class="inner">

Nhóm tự kiểm tra nhớ hơn (61% so với 40%); nhóm đọc lại lại tự tin hơn. Cảm giác trôi chảy là tín hiệu sai.

</div></details>

<details><summary>Làm sao để kiến thức chuyển được sang tình huống mới?</summary><div class="inner">

So sánh ít nhất hai ví dụ khác bề ngoài của cùng một nguyên lý (45% so với 21%), và dùng feedback có chấm điểm cho phán đoán của mình.

</div></details>

</div>


<h2 id="part-3" class="part">Phần III — Theo đuổi mục tiêu cả đời</h2>

<h2 id="goal-os"><span class="num">15</span>Mục tiêu là một feedback loop</h2>

Hai phần đầu giải thích vì sao một hành vi xảy ra hay không. Phần này trả lời một câu hỏi lớn hơn: làm sao theo đuổi **nhiều mục tiêu trong nhiều năm** — tiếng Anh hôm nay, sức khoẻ, các mối quan hệ, sự nghiệp, và cả những mục tiêu của tương lai mà bây giờ chưa biết — mà không kiệt sức, không mất phương hướng, và đổi hướng được khi cuộc sống thay đổi.

Mô hình làm nền cho phần này là control theory của Carver và Scheier: mỗi mục tiêu là một feedback loop. Bạn so trạng thái hiện tại với mục tiêu, thấy khoảng cách, hành động, rồi so lại.

```mermaid
flowchart LR
  G["Mục tiêu"] --> C{"So sánh"}
  P["Nhận biết hiện trạng<br/>(log, đo lường)"] --> C
  C -->|"① thấy khoảng cách"| A["Hành động"]
  A -->|"② tác động"| E["Thế giới thật"]
  E -->|"③ phản hồi"| P
  C -.->|"④ tốc độ thu hẹp khoảng cách"| F["Cảm xúc:<br/>nhanh → thoải mái, nới tay<br/>chậm → khó chịu, dồn sức"]
```

1. **Không có mũi tên ③ — không đo — thì vòng không vận hành.** Bạn hành động mà không biết mình đang ở đâu. Một mục tiêu không được đo thì không phải một feedback loop, mà chỉ là một mong ước.
2. **Cảm xúc theo dõi tốc độ, không theo dõi vị trí.** Theo Carver, cảm xúc là "tín hiệu sai số của một feedback loop quản lý tốc độ tiến bộ"; cảm xúc tích cực cho phép "coast" — nới tay — và khi có nhiều mục tiêu, cơ chế này giúp dời ưu tiên từ mục tiêu này sang mục tiêu khác theo từng lúc ([Carver 2015](#r-carver2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cùng đạt 50%, người có quỹ đạo đi lên có tâm trạng tốt hơn người có quỹ đạo đi xuống ([Lawrence, Carver & Scheier 2002](#r-lawrence2002)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.
3. **Người ta thật sự coast.** Sau khi tiến bộ hơn kỳ vọng ở một mục tiêu, nỗ lực dành cho nó giảm xuống và được chuyển sang mục tiêu khác ([Fulford 2010](#r-fulford2010); [Louro 2007](#r-louro2007)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Từ đó có ba hệ quả. Hãy đo **xu hướng** chứ không đo một điểm: một tuần tệ trong một tháng đang đi lên vẫn là một tháng tốt, và cảm xúc sẽ đánh giá sai nếu chỉ nhìn tuần đó. Coast là bình thường, không phải lười — đi trước kế hoạch ở một mục tiêu là tín hiệu để chuyển sức sang mục tiêu khác, miễn là bạn *thấy* được điều đó nhờ có ghi chép. Và mục tiêu nào quan trọng thì phải có cách đo.

<h2 id="choosing-goals"><span class="num">16</span>Chọn mục tiêu</h2>

<h3 id="goal-hierarchy"><span class="num">16.1</span>Mục tiêu có nhiều tầng</h3>

```mermaid
flowchart TB
  V["Giá trị<br/>sức khoẻ, yêu thương, hiểu biết, tự do…"] --> L["Mục tiêu dài hạn — nhiều năm<br/>vd: làm việc thoải mái bằng tiếng Anh"]
  L --> S["Mục tiêu quý<br/>vd: Listening từ band X lên X + 0.5"]
  S --> W["Hành vi tuần — đo được<br/>vd: 5 buổi retrieval, 3 giờ nghe"]
  W --> D["Minimum dose mỗi ngày<br/>vd: 15 thẻ từ"]
```

Tầng trên cho biết **lý do**, thứ giữ động lực qua nhiều năm. Tầng dưới cho biết **hành động**, thứ bạn làm hôm nay. Kế hoạch thường thất bại vì thiếu tầng dưới: "học tiếng Anh" là tầng trên, không chứa một ngày, một giờ hay một hành vi nào để làm. Tầng cuối cùng — minimum dose — là phiên bản nhỏ nhất của một việc, nhỏ tới mức làm được cả khi mệt, và làm xong nó thì tính là đã làm trong ngày. Chọn đơn vị "một quý" cho tầng giữa là một quy ước của cuốn sách này, không phải một phát hiện khoa học <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<h3 id="goal-filter"><span class="num">16.2</span>Ba câu hỏi trước khi cam kết</h3>

**Mình theo đuổi điều này vì quan tâm thật, hay vì áp lực và tội lỗi?** Những mục tiêu xuất phát từ giá trị và sự quan tâm của chính mình — self-concordant goals — được theo đuổi bền bỉ hơn, đạt được nhiều hơn, và khi đạt thì làm tăng well-being nhiều hơn ([Sheldon & Elliot 1999](#r-sheldon1999)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Qua các học kỳ, chúng tạo thành một vòng tích cực: đạt mục tiêu ở học kỳ đầu làm mục tiêu học kỳ sau "của mình" hơn, và lại đạt tốt hơn ([Sheldon & Houser-Marko 2001](#r-sheldon2001)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

**Nó xung đột hay hỗ trợ các mục tiêu khác?** Xung đột giữa các mục tiêu đi kèm well-being thấp hơn, còn các mục tiêu hỗ trợ nhau thì làm tăng sự dấn thân ([Riediger & Freund 2004](#r-riediger2004)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Những mục tiêu xung đột được *nghĩ tới* nhiều hơn nhưng lại ít được *làm* hơn ([Emmons & King 1988](#r-emmons1988)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — một dấu hiệu dễ nhận ra.

**Có cách nào phục vụ được nhiều mục tiêu cùng lúc không?** Khi nhiều mục tiêu cùng hoạt động, người ta tự nhiên chọn những hành động phục vụ tất cả — multifinal means ([Köpetz 2011](#r-kopetz2011)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Tập thể dục cùng người yêu phục vụ cả sức khoẻ lẫn quan hệ; đọc tài liệu kỹ thuật bằng tiếng Anh phục vụ cả nghề lẫn ngoại ngữ; nghe podcast khi đi bộ đi làm phục vụ cả vận động lẫn kỹ năng nghe. Một lưu ý nhỏ: hành động phục vụ càng nhiều mục tiêu thì càng *cảm thấy* kém hiệu quả cho từng mục tiêu ([Zhang, Fishbach & Kruglanski 2007](#r-zhang2007)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, nên khi làm, hãy giữ trong đầu một mục tiêu chính.

Để không bỏ quên điều gì, có thể soát mục tiêu theo sáu lĩnh vực của một cuộc đời — sức khoẻ, quan hệ, nghề và học, tiền, nghỉ ngơi và niềm vui, chăm sóc và đóng góp <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Đây là một công cụ soát, không phải kết quả nghiên cứu. Mỗi quý, lĩnh vực nào cũng nên có ít nhất một mức duy trì — không cần là một mục tiêu lớn.

<h2 id="portfolio"><span class="num">17</span>Một push goal, phần còn lại ở maintenance dose</h2>

```mermaid
flowchart LR
  subgraph Q["Một quý"]
    PG["Push goal<br/>if-then plan, khung giờ tốt nhất,<br/>đo hằng tuần"]
    M1["Maintenance dose<br/>sức khoẻ"]
    M2["Maintenance dose<br/>quan hệ"]
    M3["Maintenance dose<br/>tiền: default tự động"]
    M4["Maintenance dose<br/>kỹ năng thứ hai"]
  end
```

Nhiều phát hiện cùng dẫn tới một kết luận. Số hành vi được khuyến nghị cùng lúc ở mức **vừa phải** tạo ra nhiều thay đổi nhất — quan hệ có dạng đường cong, và đường cong càng dốc khi động lực thấp ([Wilson 2015](#r-wilson2015)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Viết if-then plan cho nhiều mục tiêu cùng lúc **phản tác dụng**, trong khi một kế hoạch duy nhất thì hiệu quả ([Dalton & Spiller 2012](#r-dalton2012); [Verhoeven 2013](#r-verhoeven2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Thay đổi nhiều hành vi lần lượt hay cùng lúc cho hiệu quả ngang nhau trong sáu thử nghiệm ngẫu nhiên ([James 2016](#r-james2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — tức là chọn theo sức của mình. Khi các mục tiêu có phần thưởng như nhau, thời gian dồn vào mục tiêu đang tụt sau nhất; nhưng khi một mục tiêu có phần thưởng riêng, nó **chiếm hết** thời gian ([Schmidt & DeShon 2007](#r-schmidt2007)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Một mục tiêu đang hoạt động còn đẩy các mục tiêu khác ra khỏi đầu — goal shielding ([Shah, Friedman & Kruglanski 2002](#r-shah2002)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — nên mục tiêu bị bỏ quên cứ thế lùi dần mà mình không nhận ra. Và tiến bộ ở một mục tiêu có thể khiến người ta tự "cho phép" mình làm điều đi ngược lại nó ([Fishbach & Dhar 2005](#r-fishbach2005)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Từ đó có một quy tắc cho cả danh mục mục tiêu <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Mỗi quý chỉ có **một push goal** — mục tiêu được dồn sức: nó nhận if-then plan chi tiết, khung giờ tốt nhất trong ngày, và được đo hằng tuần. Các mục tiêu còn lại ở **maintenance dose** — mức tối thiểu để không thụt lùi, với một kế hoạch cố định đơn giản như một khung giờ nhỏ hoặc một default tự động. Những mục tiêu không có phần thưởng từ bên ngoài — sức khoẻ, quan hệ, gia đình — được khung giờ cố định trên lịch, vì nếu không, công việc với deadline và sếp sẽ lấy hết thời gian của chúng, và goal shielding sẽ che đi sự bỏ quên. Khi một mục tiêu đi trước kế hoạch, hãy coast có chủ đích: chuyển phần sức dư sang mục tiêu đang tụt sau, thay vì "thưởng" cho mình bằng việc đi ngược mục tiêu.

<h2 id="plans-and-goal-types"><span class="num">18</span>Loại mục tiêu và cách lập kế hoạch</h2>

<h3 id="goal-types"><span class="num">18.1</span>Đặt mục tiêu ở tầng nào</h3>

Một meta-analysis trong thể thao so sánh ba loại mục tiêu:

```chart bar
loại mục tiêu,hiệu ứng (d)
Outcome goal (thắng giải),0.09
Performance goal (đạt thời gian X),0.44
Process goal (điều tập trung khi đang thực hiện),1.36
```

<p class="small muted">Nguồn: Williamson et al. 2022. Meta-analysis gồm 27 nghiên cứu, toàn bộ trong thể thao, phần lớn trong phòng thí nghiệm; mục tiêu kết quả chỉ có 2 nghiên cứu và không có ý nghĩa thống kê.</p>

Mục tiêu đặt ở tầng **quy trình** — điều mình tập trung làm ngay khi đang thực hiện kỹ năng, như "giữ khuỷu tay thẳng khi ném" — tạo hiệu ứng lớn hơn nhiều so với mục tiêu ở tầng **kết quả** cuối cùng ([Williamson 2022](#r-williamson2022)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Mở rộng ý đó sang những mục tiêu như "năm buổi retrieval mỗi tuần" thay cho "đạt IELTS 6.5" là suy luận của cuốn sách <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>, với một lý do dễ hiểu: kết quả phụ thuộc nhiều thứ ngoài tầm tay, còn quy trình là thứ mình làm được hôm nay. Với những kỹ năng phức tạp ở giai đoạn đầu, **learning goal** — mục tiêu về việc học cách làm, như "tìm ba chiến lược để bắt số liệu khi nghe" — tốt hơn cả outcome goal lẫn lời dặn "cố hết sức" ([Winters & Latham 1996](#r-winters1996)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Tổng kết 35 năm nghiên cứu về goal setting: mục tiêu cụ thể và khó tốt hơn "cố hết sức" ở nhiệm vụ đơn giản; với nhiệm vụ phức tạp, mục tiêu về việc học tốt hơn ([Locke & Latham 2002](#r-locke2002)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Nhưng đừng bỏ outcome goal: như chương sau sẽ cho thấy, muốn kết quả thay đổi thì vẫn phải theo dõi kết quả. Cần cả hai tầng.

<h3 id="planning-tools"><span class="num">18.2</span>Những công cụ lập kế hoạch có bằng chứng</h3>

**Implementation intention** — "khi [tình huống] thì tôi [hành động]" — là công cụ mạnh nhất, dành cho push goal ([Sheeran 2025](#r-sheeran2025)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. **Ngày và giờ cụ thể** biến ý định thành lịch: nhắc người ta ghi cả ngày và giờ đi tiêm phòng làm tỷ lệ tiêm tăng 4,2 điểm phần trăm so với mức nền 33,1% ([Milkman 2011](#r-milkman2011)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>, và hỏi cử tri về kế hoạch đi bầu cụ thể làm tỷ lệ đi bầu tăng 4,1 điểm phần trăm ([Nickerson & Rogers 2010](#r-nickerson2010)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

**Mental contrasting**, còn gọi là WOOP (Wish – Outcome – Obstacle – Plan), đi thêm một bước: hình dung điều mong muốn, rồi hình dung **trở ngại thật trong chính mình**, rồi lập kế hoạch vượt qua nó. Phương pháp này có hiệu ứng g = 0,28 ([Cross & Sheffield 2019](#r-cross2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, và khi kết hợp với implementation intention là g = 0,336 ([Wang 2021](#r-wang2021)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — dù các tác giả cảnh báo có thể có publication bias.

**Commitment device** là cách tự khoá lựa chọn tương lai khi đang tỉnh táo. Tài khoản tiết kiệm có khoá ở chương 12 là một ví dụ ([Ashraf, Karlan & Yin 2006](#r-ashraf2006)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; và những người có present bias mạnh nhất lại chính là những người chủ động tìm đến cam kết ([Augenblick 2015](#r-augenblick2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. **Temptation bundling** — chỉ cho phép mình hưởng một thứ yêu thích khi đang làm việc nên làm, như chỉ nghe podcast yêu thích lúc đi tập — làm tăng số lần đi tập lúc đầu rồi giảm dần ([Milkman, Minson & Volpp 2014](#r-milkman2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; một thử nghiệm lớn hơn (6.792 người) cho thấy tặng sách nói kèm lời khuyên chỉ nghe khi tập làm khả năng đi tập mỗi tuần tăng 10–14% so với nhóm không được gì, dù riêng lời khuyên chỉ thêm được một chút so với chỉ tặng sách nói ([Kirgios 2020](#r-kirgios2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. **Fresh start** — bắt đầu ở một mốc thời gian như thứ Hai, đầu tháng, sinh nhật — tận dụng việc người ta tự nhiên hăng hái theo đuổi mục tiêu hơn sau các mốc đó ([Dai 2014](#r-dai2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Và như chương 3 đã cho thấy, nối dự đoán với **những lần trước** của chính mình xoá được sai lệch lạc quan của planning fallacy ([Buehler 1994](#r-buehler1994)).

<h2 id="monitoring"><span class="num">19</span>Ghi lại, chia sẻ, và nhịp review</h2>

<h3 id="monitoring-evidence"><span class="num">19.1</span>Monitoring</h3>

Tổng hợp 138 thử nghiệm ngẫu nhiên với 19.951 người cho thấy theo dõi tiến độ làm tăng khả năng đạt mục tiêu, d = 0,40 ([Harkin 2016](#r-harkin2016)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Sau khi hiệu chỉnh publication bias, con số còn d = 0,19 — vẫn dương, nhưng nhỏ hơn con số thường được trích dẫn. Điều đáng chú ý hơn là *cách* theo dõi:

```chart bar
cách theo dõi,hiệu ứng (d)
Không ghi lại,0.29
Ghi lại,0.43
Giữ riêng cho mình,0.19
Báo cáo cho người khác,0.47
```

<p class="small muted">Nguồn: Harkin et al. 2016, Psych Bull 142(2):198–229; số liệu theo từng cách lấy từ accepted manuscript. Hai phép so sánh riêng: ghi lại hay không, và giữ riêng hay báo cáo cho người khác. Mức "công khai" (0,55) chỉ dựa trên 3 nghiên cứu nên không đưa vào.</p>

Ghi lại tốt hơn chỉ nhớ trong đầu; cho người khác thấy tốt hơn giữ riêng. Còn một quy luật nữa, gọi là matching: theo dõi **hành vi** tác động mạnh nhất lên chính hành vi (d = 0,79), còn theo dõi **kết quả** tác động mạnh nhất lên chính kết quả (d = 0,62). Vì vậy cần cả hai — ghi hành vi hằng ngày, và đo kết quả định kỳ. Sau một thất bại, đánh giá theo mục tiêu nhỏ giữ được tâm trạng tốt hơn đánh giá theo mục tiêu lớn ([Houser-Marko & Sheldon 2008](#r-housermarko2008)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Vì thế, kể tóm tắt tuần cho một người — người yêu, một người bạn — vừa là cách theo dõi mạnh nhất trong biểu đồ, vừa là dịp để gần nhau hơn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<h3 id="reviews"><span class="num">19.2</span>Nhịp review</h3>

Bằng chứng mạnh nhất về review đến từ công việc và huấn luyện: buổi debrief sau công việc nâng hiệu suất khoảng 25%, d = 0,67 ([Tannenbaum & Cerasoli 2013](#r-tannenbaum2013)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; after-action review cải thiện các tiêu chí đánh giá huấn luyện nói chung, d = 0,79 ([Keiser & Arthur 2021](#r-keiser2021)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; và review **cả thành công lẫn thất bại** tốt hơn chỉ review thất bại ([Ellis & Davidi 2005](#r-ellis2005)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cuốn sách chưa tìm thấy thử nghiệm nào đo trực tiếp việc một người tự review mỗi tuần cho mục tiêu cuộc sống; nhịp dưới đây là suy luận từ các bằng chứng đó <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

```mermaid
flowchart LR
  D["Mỗi ngày · 1 phút<br/>ghi hành vi"] --> W["Mỗi tuần · 20–30 phút<br/>đếm, xem tốc độ,<br/>một điều tốt, một điều chưa tốt,<br/>lịch tuần sau theo dữ liệu"]
  W --> M["Mỗi tháng<br/>một số đo kết quả<br/>cho push goal"]
  M --> Q["Mỗi quý<br/>giữ / thu nhỏ / bỏ;<br/>chọn push goal mới"]
  Q -.-> D
```

Ở nhịp ngày, chỉ cần ghi một dòng: minimum dose đã xong chưa, năng lượng thế nào, bối cảnh nào đã quyết định buổi tối. Ở nhịp tuần, đếm hành vi so với mục tiêu nhỏ, nhìn tốc độ (đi trước thì coast, tụt sau thì dồn sức hoặc sửa kế hoạch), ghi một điều đã suôn sẻ và một điều chưa, viết ghi chú "ready-to-resume" cho việc đang dở ([Leroy & Glomb 2018](#r-leroy2018)), lập lịch tuần sau theo dữ liệu tuần này thay vì theo mong muốn, và gửi tóm tắt cho một người. Ở nhịp tháng, đo một con số kết quả cho push goal — vì theo quy luật matching, theo dõi kết quả là cách tác động mạnh nhất lên kết quả. Ở nhịp quý, quyết định giữ, thu nhỏ hay bỏ từng mục tiêu theo tiêu chí đã viết từ đầu quý, và chọn push goal của quý sau.

Chỉ viết mục tiêu ra giấy thì không giúp được gì nhiều. Một thử nghiệm nhỏ với 85 sinh viên đang gặp khó cho thấy viết mục tiêu làm tăng điểm số ([Morisano 2010](#r-morisano2010)), nhưng thử nghiệm quy mô khoảng 1.400 sinh viên không thấy tác dụng nào ([Dobronyi, Oreopoulos & Petronijevic 2019](#r-dobronyi2019)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; huấn luyện đặt mục tiêu cũng không có tác dụng chính lên việc đạt mục tiêu sau đó ([Sheldon 2002](#r-sheldon2002)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Điều có cơ sở là viết ra **kèm** ngày giờ cụ thể, đo lường và review.

<h2 id="flexibility"><span class="num">20</span>Linh hoạt: biết buông và biết tìm mục tiêu mới</h2>

Cuộc sống sẽ thay đổi — công việc, nơi ở, người yêu, sức khoẻ, ưu tiên. Linh hoạt không có nghĩa là không có kế hoạch, mà là khả năng sửa kế hoạch một cách có nguyên tắc.

```chart bar
khả năng,tương quan với chất lượng sống (r)
Disengagement (buông mục tiêu),0.08
Re-engagement (gắn với mục tiêu mới),0.19
```

<p class="small muted">Nguồn: Barlow, Wrosch & McGrath 2020, meta-analysis 31 mẫu; tương quan, hiệu ứng nhỏ.</p>

Buông một mục tiêu không còn khả thi (disengagement) và gắn với một mục tiêu mới thay thế (re-engagement) là hai kỹ năng khác nhau, và **gắn với mục tiêu mới quan trọng hơn buông bỏ** ([Barlow, Wrosch & McGrath 2020](#r-barlow2020); [Wrosch 2003](#r-wrosch2003)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cùng meta-analysis có một chi tiết cần nhớ: ở những mẫu có nguy cơ trầm cảm, mối liên hệ bị **đảo ngược**: buông nhiều lại đi kèm nhiều triệu chứng trầm cảm hơn, chứ không ít hơn. Một suy luận thận trọng từ đó: quyết định buông nên được đưa ra ở buổi review, lúc bình tĩnh, chứ không phải vào buổi tối tệ nhất <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Ý tưởng psychological flexibility — khả năng điều chỉnh hành vi theo tình huống và giá trị, kể cả khi có cảm xúc khó chịu — được đề xuất như cốt lõi của sức khoẻ tâm thần ([Kashdan & Rottenberg 2010](#r-kashdan2010)), nhưng thang đo phổ biến nhất của khái niệm này lại tương quan rất cao với chính sự đau khổ mà nó muốn giải thích ([Doorley 2020](#r-doorley2020)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Và như chương 6 đã nói, duy trì một hành vi cần sự hài lòng với kết quả thật ([Rothman 2000](#r-rothman2000)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; người duy trì được việc vận động có self-efficacy và ý định cao hơn người bỏ cuộc ([Amireault 2013](#r-amireault2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

```mermaid
flowchart TB
  S["Mục tiêu đang chững lại"] --> Q1{"Tiêu chí viết từ<br/>đầu quý nói gì?"}
  Q1 -->|"vẫn đáng theo"| K["Giữ"]
  Q1 -->|"quá sức lúc này"| SH["Thu nhỏ về minimum dose"]
  Q1 -->|"không còn ý nghĩa"| D{"Đang trong giai đoạn<br/>tâm trạng xấu?"}
  D -->|"có"| SH
  D -->|"không"| B["Buông"]
  B --> R["Đặt ngay một mục tiêu thay thế<br/>(re-engagement), dù nhỏ"]
```

Hình trên tóm lại năm quy tắc linh hoạt <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Viết tiêu chí giữ, thu nhỏ hay bỏ **ngay lúc chọn mục tiêu**, khi còn tỉnh táo — không quyết định chuyện đó lúc đang chán. Thu nhỏ trước khi bỏ: minimum dose là "chế độ khẩn cấp" của mọi mục tiêu. Không bỏ nhiều mục tiêu cùng lúc khi đang buồn. Bỏ một mục tiêu thì đặt ngay một mục tiêu thay thế. Và khi cuộc sống thay đổi, làm lại phương pháp xây một tuần ở Phần IV thay vì cố nhét lịch cũ vào hoàn cảnh mới.

<h2 id="goal-myths"><span class="num">21</span>Các framework phổ biến</h2>

Nhiều công cụ đặt mục tiêu nổi tiếng có ít bằng chứng hơn danh tiếng của chúng.

**SMART** không dựa trên lý thuyết khoa học và không nhất quán với bằng chứng thực nghiệm khi được dùng như một bộ quy tắc ([Swann 2022](#r-swann2022)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; riêng phần "cụ thể và đo được" thì có hỗ trợ từ các nghiên cứu goal setting. **OKR** cho cá nhân chưa có nghiên cứu thực nghiệm nào; các thành phần của nó có hỗ trợ ở nơi khác. Cũng cần biết có một cuộc tranh luận nghiêm túc về mặt trái của mục tiêu — "goals gone wild": mục tiêu có thể khiến người ta tập trung quá hẹp, thậm chí gian lận ([Ordóñez 2009](#r-ordonez2009)) — và Locke cùng Latham đã phản biện lại ([Locke & Latham 2009](#r-locke2009)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. **"Systems, not goals"** sai nếu hiểu là bỏ hẳn mục tiêu, nhưng đúng một phần nếu hiểu là đặt mục tiêu ở tầng quy trình — như biểu đồ ở chương 18 — với điều kiện vẫn theo dõi kết quả. **Identity-based habits** dựa trên ý tưởng gọi tên bản thân để thay đổi hành vi; nghiên cứu nổi tiếng "be a voter" ([Bryan 2011](#r-bryan2011)) đã không lặp lại được trong một thử nghiệm thực địa lớn, với hiệu ứng ước lượng xấp xỉ 0 ([Gerber 2016](#r-gerber2016)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. **Ma trận Eisenhower** chưa từng được thử nghiệm, nhưng thiên kiến mà nó nhắm tới thì có thật: người ta chọn việc *có vẻ* gấp với lợi ích thấp thay vì việc quan trọng hơn — mere urgency effect ([Zhu, Yang & Hsee 2018](#r-zhu2018)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. **Time-blocking** chưa được thử nghiệm trực tiếp; gần nhất là bằng chứng về kế hoạch có ngày giờ cụ thể, và các nghiên cứu cho thấy kỹ năng quản lý thời gian tương quan r = 0,259 với hiệu suất công việc và 0,313 với well-being, chủ yếu là dữ liệu cắt ngang ([Aeon 2021](#r-aeon2021)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cuối cùng, nghiên cứu kinh điển cho rằng tự đặt deadline giúp chống trì hoãn (Ariely & Wertenbroch, 2002) đã bị **rút** vào tháng 9/2026, sau một replication thất bại và phân tích cho thấy dữ liệu có dấu hiệu bị sửa ([Retraction Watch 2026](#r-retractionwatch2026)).

<div class="recall">

**Câu hỏi nhớ lại — Phần III (chương 15–21).**

<details><summary>Theo control theory, cảm xúc theo dõi điều gì — vị trí hay tốc độ? Hệ quả cho việc đo lường là gì?</summary><div class="inner">

Tốc độ thu hẹp khoảng cách (Carver 2015). Vì vậy hãy đo xu hướng qua nhiều tuần, đừng đánh giá qua một điểm đơn lẻ.

</div></details>

<details><summary>Vì sao chỉ nên có một push goal mỗi quý?</summary><div class="inner">

Nhiều if-then plan cùng lúc phản tác dụng (Dalton & Spiller 2012), số mục tiêu vừa phải tạo nhiều thay đổi nhất (Wilson 2015), và mục tiêu có phần thưởng sẽ chiếm hết thời gian (Schmidt & DeShon 2007).

</div></details>

<details><summary>Theo dõi hành vi và theo dõi kết quả khác nhau thế nào (quy luật matching)?</summary><div class="inner">

Theo dõi hành vi tác động mạnh nhất lên hành vi (d = 0,79); theo dõi kết quả tác động mạnh nhất lên kết quả (0,62) (Harkin 2016). Cần cả hai.

</div></details>

<details><summary>Khi buông một mục tiêu, bước nào quan trọng hơn, và khi nào không nên buông?</summary><div class="inner">

Gắn với một mục tiêu thay thế (r = 0,19) quan trọng hơn bản thân việc buông (r = 0,08). Ở người có nguy cơ trầm cảm, buông nhiều lại đi kèm nhiều triệu chứng hơn (Barlow 2020) — nên quyết định buông ở buổi review lúc bình tĩnh, và thu nhỏ trước khi bỏ.

</div></details>

</div>


<h2 id="part-4" class="part">Phần IV — Từ nguyên lý đến một tuần</h2>

<h2 id="week-method"><span class="num">22</span>Phương pháp xây một tuần</h2>

Đây là phần sẽ được dùng nhiều nhất trong cuốn sách: tám bước để biến mọi nguyên lý ở trên thành một tuần cụ thể, làm lại mỗi khi lịch sống thay đổi. Thứ tự các bước có lý do: những gì bảo vệ **nền móng** — giấc ngủ, người thân yêu, hồi sức — được đặt *trước* những gì **tham vọng**. Nếu làm ngược lại, mục tiêu sẽ lấn hết chỗ của nền móng, và cả hệ thống sẽ đổ sau vài tuần.

```mermaid
flowchart TD
  S1["① Các khung cố định<br/>công việc, di chuyển"] --> S2["② Giấc ngủ<br/>giờ thức cố định 7 ngày"]
  S2 --> S3["③ Người thân yêu<br/>khung cố định, nội dung thô"]
  S3 --> S4["④ Hồi sức<br/>khoảng đệm sau giờ làm, rảnh thật"]
  S4 --> S5["⑤ Vận động<br/>tính theo tổng tuần"]
  S5 --> S6["⑥ Một push goal<br/>khung giờ ít tốn sức nhất + if-then"]
  S6 --> S7["⑦ Maintenance dose<br/>default tự động, khung nhỏ"]
  S7 --> S8["⑧ Đệm và review"]
  S8 --> RUN["Sống một tuần, ghi lại,<br/>review, chỉnh"]
  RUN -.->|"tuần sau"| S6
```

**① Các khung cố định.** Ghi lại những gì không đổi được: giờ làm, thời gian di chuyển, những nghĩa vụ cố định. Chỉ ghi sự thật, không ghi mong muốn — kế hoạch phải dựa trên dữ liệu thật, không dựa trên kịch bản tưởng tượng (chương 3).

**② Giấc ngủ.** Chọn *một* giờ thức dậy cho cả bảy ngày, lệch nhau không quá khoảng nửa tiếng. Giờ lên giường bằng giờ thức trừ đi ít nhất bảy tiếng ngủ, trừ thêm thời gian để chìm vào giấc. Giấc ngủ đứng thứ hai, trước mọi mục tiêu, vì thiếu ngủ làm hỏng mọi thứ còn lại mà mình không tự nhận ra (chương 10).

**③ Người thân yêu.** Đặt các **khung** cố định cho người yêu, bạn bè, gia đình — ngày nào, buổi nào — nhưng để **nội dung** thô. Quan hệ cần thời gian đều đặn; mục tiêu không có phần thưởng bên ngoài sẽ bị công việc lấn mất thời gian; và đặt giờ chính xác cho giải trí làm nó giống công việc (chương 11).

**④ Hồi sức.** Một khoảng đệm sau giờ làm để tâm trí gác công việc lại trước khi làm bất cứ điều gì khác, và ít nhất một khoảng rảnh **không mục đích** mỗi tuần. Detachment là trải nghiệm gắn mạnh nhất với việc bớt mệt, và thời gian rảnh có hình chữ U ngược — không phải càng ít càng tốt (chương 9, chương 11).

**⑤ Vận động.** Tính theo tổng tuần: khoảng 150 phút cường độ vừa (đi bộ nhanh cũng được tính), hai buổi tập sức mạnh ngắn, và đứng dậy giữa những lúc ngồi lâu. Mọi đợt vận động đều được tính (chương 12).

**⑥ Một push goal.** Đặt nó vào khung giờ **ít tốn sức nhất** trong ngày, viết một if-then plan, và định nghĩa minimum dose — phiên bản nhỏ nhất, làm xong thì tính là đã làm. Chi phí nỗ lực tăng dần trong ngày; một if-then plan thì hiệu quả, nhiều cái cùng lúc thì không (chương 4, chương 17).

**⑦ Maintenance dose.** Mỗi lĩnh vực còn lại nhận một default tự động (như chuyển tiền ngày nhận lương) hoặc một khung nhỏ cố định (chương 12, chương 17).

**⑧ Đệm và review.** Một khoảng trống mỗi tuần để bù cho những trục trặc — vì planning fallacy làm mọi thứ trễ hơn dự kiến — và 20–30 phút review cuối tuần, kèm một bản tóm tắt kể cho một người (chương 19).

Trước khi bắt đầu một tuần mới, nên tự hỏi vài câu <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Mỗi đêm có đủ bảy tiếng ngủ *cộng* thời gian để chìm vào giấc không, và giờ thức các ngày có lệch nhau quá nhiều không? Người yêu, gia đình, bạn bè mỗi người đã có ít nhất một khung chưa? Có ít nhất một khoảng rảnh không mục đích không? Tổng vận động đã đủ chưa? Có đúng một push goal, với một if-then plan có ngày giờ cụ thể không? Minimum dose của mỗi mục tiêu có đủ nhỏ để làm được cả khi mệt không? Kế hoạch có dựa trên dữ liệu tuần trước, hay dựa trên "mình nên làm được"? Nếu một câu trả lời là "không", sửa nó trước khi thêm bất cứ mục tiêu nào.

<h2 id="day-templates"><span class="num">23</span>Bốn kiểu ngày</h2>

Gần như mọi tuần đều được ghép từ bốn kiểu ngày. Các mốc giờ trong hình dưới là **minh hoạ** cho một người làm việc khoảng 08:30–18:30 <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>; điều quan trọng là *thứ tự* và *lý do* của các khối, không phải con số giờ.

<h3 id="day-evening"><span class="num">23.1</span>Ngày làm việc dài, học buổi tối</h3>

```mermaid
gantt
  title Buổi tối của một ngày làm việc dài (giờ minh hoạ)
  dateFormat HH:mm
  axisFormat %H:%M
  todayMarker off
  section Công việc
  Làm việc và di chuyển về               :crit, 17:00, 18:30
  section Buổi tối
  Khoảng đệm + hồi sức + người thân      :18:30, 19:45
  Minimum dose của push goal              :19:45, 20:10
  Tuỳ năng lượng — học thêm hoặc nghỉ    :20:10, 21:45
  Đèn mờ và không feed                    :21:45, 23:00
  Điện thoại ra khỏi phòng ngủ            :23:00, 23:59
```

Kiểu ngày này dành cho lúc giờ làm dài và không thể hay không muốn dậy sớm. Trước khi rời chỗ làm, ghi hai dòng "ready-to-resume" để tâm trí gác công việc lại, và trên đường về, nghe một thứ đã chọn sẵn. Về đến nhà, một cue cố định ở cửa — điện thoại vào chỗ sạc — rồi tắm, ăn, đi bộ ngắn, nói chuyện với người trong nhà; nếu giải trí thì chọn trước và có giờ kết thúc. Sau khoảng đệm ấy là minimum dose của push goal, vào lúc đồng hồ sinh học đang ở vùng tỉnh táo buổi tối. Sau đó là một khoảng tuỳ năng lượng: nếu còn sức thì làm thêm, nếu không thì nghỉ — và ghi lại rằng đó là một *quyết định*, không phải thất bại, để buổi tối không biến thành một bài kiểm tra ý chí. Từ khoảng ba tiếng trước giờ ngủ, đèn mờ và không feed; nửa tiếng trước giờ ngủ, điện thoại ra khỏi phòng.

<h3 id="day-morning"><span class="num">23.2</span>Ngày làm việc dài, học buổi sáng</h3>

```mermaid
gantt
  title Buổi sáng của một ngày học sớm (giờ minh hoạ)
  dateFormat HH:mm
  axisFormat %H:%M
  todayMarker off
  section Sáng
  Ngủ (cả giấc đã dời sớm hơn)            :done, 05:00, 06:00
  Việc nhẹ — ôn và lên kế hoạch           :06:00, 06:30
  Phần khó nhất của push goal             :06:30, 07:45
  Chuẩn bị đi làm                         :07:45, 08:30
  section Công việc
  Làm việc                                :crit, 08:30, 10:00
```

Kiểu ngày này đặt push goal vào lúc ít tốn sức nhất — trước khi ngày làm việc bắt đầu. Điều kiện bắt buộc là dời *cả* giấc ngủ sớm hơn, không bao giờ cắt bớt nó. Ngay khi dậy, ra ánh sáng ngoài trời. Nửa tiếng đầu dành cho việc nhẹ vì sleep inertia; phần còn lại dành cho việc khó nhất. Buổi tối nhẹ nhàng: hồi sức, người thân, ôn lại từ vựng — vì học từ buổi tối rồi đi ngủ là thứ tự tốt cho trí nhớ. Kiểu ngày này chỉ làm được nếu giờ ngủ giữ cố định: nếu lỡ lên giường muộn, thì cắt bớt buổi học sáng chứ không cắt bớt giấc ngủ.

<h3 id="day-light"><span class="num">23.3</span>Ngày làm ít, làm từ xa</h3>

Ngày làm ít giờ và không phải di chuyển là **cơ hội lớn nhất** trong tuần. Giữ giờ thức như mọi ngày để không làm lệch đồng hồ. Làm việc trước, để xong việc rồi tâm trí gác nó lại được. Sau đó là một buổi học sâu khoảng 90 phút cho push goal — loại việc không làm được trong 25 phút: một đoạn input dài, một project, một phần khó — và một buổi 60–90 phút cho mục tiêu thứ hai. Phần còn lại dành cho nghỉ ngơi thật, vận động, người thân. Không nên nhồi thêm: với một số kỹ năng, buổi học quá dài kém hiệu quả tính theo giờ ([Baddeley & Longman 1978](#r-baddeley1978)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, dù với trình độ tổng thể, dồn giờ có thể tốt hơn ([Serrano & Muñoz 2007](#r-serrano2007)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>; hai buổi 60–90 phút là điểm cân bằng mà cuốn sách đề xuất <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<h3 id="day-off"><span class="num">23.4</span>Ngày nghỉ</h3>

Ngày nghỉ vẫn giữ giờ thức — lệch tối đa khoảng nửa tiếng — để tránh social jetlag; nếu thiếu ngủ, một giấc trưa 10–20 phút trước 16:00 tốt hơn ngủ nướng. Người thân yêu đi trước: một hoạt động mới cùng người yêu, gặp bạn bè, thăm gia đình — khung cố định, nội dung thô. Vận động, nếu được thì cùng người khác. Một buổi học là tuỳ chọn, không bắt buộc. Và vào cuối ngày nghỉ cuối tuần, một **buổi lập kế hoạch lúc tỉnh táo** khoảng 20 phút: đọc lại ghi chép của tuần, lập kế hoạch tuần sau theo số buổi thực sự đã làm được, đặt giới hạn ứng dụng cho cả tuần ngay lúc này, chọn sẵn tài liệu cho từng buổi học, và ghi vài dự đoán cho tuần.

<h2 id="startup-template"><span class="num">24</span>Bắt đầu một thay đổi</h2>

Mọi thay đổi — một habit mới, một mục tiêu mới, một lịch sống mới — nên được bắt đầu theo cùng một khuôn, để biết điều gì thực sự có tác dụng <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>:

```mermaid
timeline
  title Năm tuần đầu của một thay đổi
  Tuần 0 : Chỉ đo, chưa đổi gì : Ghi lại mỗi ngày, lấy số liệu nền
  Tuần 1 : Bắt đầu ở một mốc thời gian : Đổi tình huống (cue, default) + minimum dose
  Tuần 2 : Thêm một thay đổi : vd hồi sức có chủ đích, giờ ngủ
  Tuần 3 : Thêm một thay đổi : vd buổi học sâu, chia sẻ tiến độ
  Tuần 4 : Không thêm gì : So với tuần 0 → giữ, sửa, bỏ
```

Mỗi bước có lý do. Tuần 0 chỉ đo, để có dữ liệu nền mà lập kế hoạch sát thực tế — nối dự đoán với những lần trước chính là cách sửa planning fallacy ([Buehler 1994](#r-buehler1994)). Tuần 1 bắt đầu ở một mốc thời gian như thứ Hai hay đầu tháng, tận dụng fresh start effect ([Dai 2014](#r-dai2014)). Mỗi tuần sau thêm đúng một thay đổi, để biết thay đổi nào có tác dụng và tránh quá tải nhiều kế hoạch cùng lúc ([Dalton & Spiller 2012](#r-dalton2012)). Tuần 4 không thêm gì, chỉ so sánh, để quyết định bằng dữ liệu thay vì cảm giác.

Có ba quy tắc giúp khuôn này trụ được qua những tuần tệ. Một ngày lỡ thì hôm sau quay lại minimum dose — lỡ một lần không ảnh hưởng đáng kể tới habit ([Lally 2010](#r-lally2010)), và thưởng cho việc quay lại là chương trình đứng đầu trong megastudy ([Milkman 2021](#r-milkman2021)). Một tuần tệ thì đổi tình huống, đừng cố gắng nhiều hơn (chương 5). Và mục tiêu nên có sẵn khoản dự phòng — "năm lần mỗi tuần, được phép trượt một" — thay vì một chuỗi tất cả hoặc không có gì ([Sharif & Shu 2021](#r-sharif2021)).

<h2 id="when-life-changes"><span class="num">25</span>Khi cuộc sống thay đổi</h2>

Kế hoạch nào rồi cũng cũ. Khi một thay đổi lớn xảy ra, câu hỏi không phải "làm sao giữ lịch cũ", mà là làm lại tám bước ở chương 22. Mỗi loại thay đổi có thứ phải giữ, thứ nên thu nhỏ, và thường kèm một cơ hội.

```mermaid
flowchart LR
  C["Cuộc sống thay đổi"] --> K["Giữ nguyên:<br/>giấc ngủ, khung người thân,<br/>minimum dose mỗi lĩnh vực"]
  C --> S["Thu nhỏ:<br/>push goal về minimum dose<br/>trong 2 tuần đầu"]
  C --> O["Tận dụng:<br/>dịp tạo habit mới"]
  K --> R["Làm lại 8 bước"]
  S --> R
  O --> R
```

Khi **đổi việc hoặc đổi giờ làm**, giữ giấc ngủ và khung người thân, đưa push goal về minimum dose trong hai tuần đầu — và nhận ra đây là dịp tốt nhất để tạo habit mới, vì can thiệp hiệu quả hơn ở người vừa đổi bối cảnh sống trong khoảng ba tháng ([Verplanken & Roy 2016](#r-verplanken2016)). Khi vào **mùa cao điểm công việc**, giữ giấc ngủ, một minimum dose cho mỗi lĩnh vực và một khung cho người thân; tạm dừng các buổi học dài và ghi lại ghi chú "ready-to-resume" cho từng mục tiêu tạm dừng ([Leroy & Glomb 2018](#r-leroy2018)). Khi **ốm hay kiệt sức**, mọi mục tiêu về không hoặc minimum dose, và điều đó không tính là đứt chuỗi. Khi **du lịch hay nghỉ lễ**, giữ giờ thức gần như cũ nếu được, học ở mức minimum dose hoặc nghỉ có chủ đích, và coi ngày trở về là một fresh start. Khi **chuyển nhà hay bắt đầu sống chung**, đó lại là giai đoạn habit discontinuity: thiết kế môi trường mới từ đầu — chỗ để điện thoại, góc học. Khi **người thân đổi lịch**, làm lại bước ③ trước, rồi mới tới bước ⑥ — giữ *số* khung, đổi *vị trí*. Khi **tâm trạng xấu kéo dài**, giữ giấc ngủ, vận động nhẹ và người thân; thu nhỏ mục tiêu thay vì bỏ hàng loạt — ở người có nguy cơ trầm cảm, buông nhiều lại đi kèm nhiều triệu chứng hơn ([Barlow 2020](#r-barlow2020)) — và nếu kéo dài, tìm hỗ trợ chuyên môn. Và khi **một mục tiêu đã đạt hoặc không còn ý nghĩa**, buông theo tiêu chí đã viết, rồi đặt ngay mục tiêu thay thế.

<div class="recall">

**Câu hỏi nhớ lại — Phần IV (chương 22–25).**

<details><summary>Trong tám bước xây một tuần, vì sao giấc ngủ và người thân yêu đứng trước push goal?</summary><div class="inner">

Vì nếu đặt mục tiêu tham vọng trước, nó sẽ lấn hết chỗ của nền móng; thiếu ngủ làm hỏng mọi thứ mà mình không tự nhận ra, và quan hệ không có khung cố định sẽ bị công việc lấn mất thời gian.

</div></details>

<details><summary>Vì sao tuần đầu tiên của một thay đổi chỉ đo mà không đổi gì?</summary><div class="inner">

Để có dữ liệu nền: nối dự đoán với những lần trước xoá được sai lệch của planning fallacy (Buehler 1994), và có số liệu để so sánh ở tuần 4.

</div></details>

<details><summary>Khi đổi việc, đâu là cơ hội?</summary><div class="inner">

Khoảng ba tháng đầu sau khi bối cảnh sống thay đổi là giai đoạn habit discontinuity — lúc can thiệp để tạo habit mới hiệu quả hơn (Verplanken & Roy 2016).

</div></details>

</div>


<h2 id="part-5" class="part">Phần V — Một ví dụ: cuộc sống hiện tại</h2>

<h2 id="example"><span class="num">26</span>Áp dụng phương pháp vào lịch hiện tại</h2>

Chương này là **một lần áp dụng** phương pháp ở chương 22 vào lịch sống tại thời điểm viết, ngày 22/10/2026. Khi lịch thay đổi — công việc, lịch của người yêu, nơi ở — đừng sửa từng ô ở đây; hãy làm lại tám bước. Các mốc giờ là đề xuất để bắt đầu, và ghi chép thật sẽ điều chỉnh chúng.

<h3 id="example-facts"><span class="num">26.1</span>Dữ kiện và kết quả tám bước</h3>

Lịch hiện tại: thứ Hai đến thứ Sáu ở ngoài nhà từ 08:00 đến 19:15, đã gồm thời gian dậy, ăn sáng và đi bộ khoảng 10 phút mỗi chiều; ngủ khoảng 00:00–08:00. Thứ Bảy xen kẽ: một tuần làm từ xa 3–4 tiếng việc nhẹ (các ngày 31/10, 14/11, 28/11, 12/12, 26/12…), tuần sau nghỉ (7/11, 21/11, 5/12, 19/12…). Chủ nhật luôn nghỉ. Thời gian với người yêu hiện thường vào tối thứ Tư, thứ Bảy và Chủ nhật. Các mục tiêu: tiếng Anh (IELTS), một kỹ năng kỹ thuật, vận động và sức khoẻ, đọc và tư duy, tiền và sự nghiệp. Tiếng Anh tự đánh giá ở mức B1: đọc khá, nghe yếu, nói và viết yếu.

Áp dụng tám bước vào các dữ kiện đó cho kết quả như sau. Các khung cố định là năm ngày làm và 3–4 tiếng của thứ Bảy làm từ xa. Về giấc ngủ có hai phương án: **phương án tối** giữ nguyên 00:00–08:00, tức tám tiếng trên giường; **phương án sáng** dời sang 22:30–06:00, tức bảy tiếng rưỡi trên giường, và phải dời dần (chương 26.3). Khung cho người thân là tối thứ Tư, thứ Bảy và Chủ nhật với người yêu, cộng một lần gọi hoặc thăm gia đình mỗi tuần. Hồi sức là khoảng 19:15–20:30 mỗi ngày làm, cộng một buổi chiều cuối tuần không mục đích. Vận động gồm đi bộ 20 phút mỗi ngày làm (đi nhanh thì được tính là cường độ vừa), leo cầu thang ở công ty vài lần mỗi ngày, và hai buổi tập sức mạnh ngắn vào thứ Bảy và Chủ nhật — nếu được thì tập cùng người yêu. Push goal của quý này là **tiếng Anh, ưu tiên kỹ năng nghe**, với minimum dose là buổi 25 phút ở chương 13. Các maintenance dose gồm một buổi kỹ thuật 60–90 phút vào thứ Bảy làm từ xa, một lệnh chuyển tiền tự động ngày nhận lương sang một tài khoản riêng, và hai thói quen tư duy nhỏ: ghi dự đoán đầu tuần, viết một dòng "vì sao" ở công ty. Đệm và review là 20–30 phút tối Chủ nhật, kèm một bản tóm tắt kể cho người yêu hoặc một người bạn.

<h3 id="example-weeks"><span class="num">26.2</span>Hai kiểu tuần</h3>

Vì thứ Bảy xen kẽ, có hai kiểu tuần. Trong bảng, những ô ghi *(sáng)* chỉ áp dụng nếu chọn phương án sáng, những ô ghi *(tối)* chỉ áp dụng nếu chọn phương án tối.

| Ngày | Sáng | Ban ngày | Tối | Người thân |
|---|---|---|---|---|
| Thứ Hai | *(sáng)* 06:00–08:00 tiếng Anh | Làm việc; đi bộ nghe tiếng Anh; ghi dự đoán tuần | Hồi sức → *(tối)* 25 phút tiếng Anh → rảnh | Gọi gia đình |
| Thứ Ba | *(sáng)* tiếng Anh | Làm việc; đi bộ nghe | Hồi sức → *(tối)* 25 phút → rảnh | — |
| Thứ Tư | *(sáng)* tiếng Anh | Làm việc; đi bộ nghe | **Tối với người yêu**, điện thoại cất đi | Người yêu |
| Thứ Năm | *(sáng)* tiếng Anh | Làm việc; đi bộ nghe | Hồi sức → *(tối)* 25 phút → rảnh | — |
| Thứ Sáu | *(sáng)* tiếng Anh | Làm việc; chấm điểm dự đoán | Hồi sức → *(tối)* 25 phút → rảnh | Bạn bè (tuỳ tuần) |
| Thứ Bảy làm từ xa | Giữ giờ thức → 3–4 tiếng việc | Học sâu tiếng Anh 90 phút · kỹ thuật 60–90 phút · tập sức mạnh | Rảnh | Người yêu |
| Thứ Bảy nghỉ | Giữ giờ thức | Ngày của người thân: người yêu, bạn bè, một hoạt động mới · tập sức mạnh | Rảnh | Người yêu, bạn bè |
| Chủ nhật | Giữ giờ thức | Gia đình · rảnh không mục đích · tập nếu thứ Bảy chưa tập | Review 20–30 phút + kế hoạch tuần | Người yêu, gia đình |

Hai phương án khác nhau ở những điểm sau:

| | Phương án tối | Phương án sáng |
|---|---|---|
| Ngủ | 00:00–08:00 (như hiện tại) | 22:30–06:00 |
| Học ngày làm | 25 phút, khoảng 20:30 | Gần 2 tiếng, 06:00–08:00 (nửa tiếng đầu việc nhẹ) |
| Chi phí nỗ lực lúc học | Cao, sau hơn 11 tiếng ngoài nhà | Thấp, chưa làm gì |
| Rủi ro chính | Feed lúc mệt; giờ ngủ lùi dần | Giờ ngủ lùi dần thành ra cắt bớt giấc ngủ; dời đồng hồ sinh học không thành |
| Buổi tối | 19:15–00:00 | 19:15–22:30 — tối thứ Tư với người yêu kết thúc sớm hơn |

Số giờ tiếng Anh mỗi tuần, chỉ là phép tính trên đề xuất: với phương án tối, 100 phút đi bộ (20 × 5) cộng 100 phút học tối (25 × 4, trừ tối thứ Tư) cộng trung bình 45 phút từ thứ Bảy làm từ xa (90 × ½, vì cách tuần) — tổng 245 phút, khoảng 4,1 giờ mỗi tuần. Với phương án sáng, 100 phút đi bộ cộng 600 phút buổi sáng (120 × 5) cộng 45 phút — tổng 745 phút, khoảng 12,4 giờ mỗi tuần, dù thực tế sẽ ít hơn vì sleep inertia và ăn sáng. Gợi ý <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>: bắt đầu bằng phương án tối vì nó ít thay đổi hơn, đo bốn tuần, rồi nếu buổi 25 phút đã thành nếp mà muốn nhiều giờ hơn, thử phương án sáng như một thí nghiệm riêng.

<h3 id="example-sleep-shift"><span class="num">26.3</span>Thí nghiệm dời giấc ngủ</h3>

Nếu chọn phương án sáng, đích là 22:30–06:00 chứ không phải 23:00–06:00, vì bảy tiếng trên giường cho ít hơn bảy tiếng ngủ. Tuần đầu giữ lịch cũ và chỉ ghi nhật ký ngủ: giờ lên giường, giờ ngủ được ước chừng, giờ dậy, mức tỉnh táo. Tuần thứ hai dậy 07:00 và tắt đèn 23:30 — một bước trung gian, chậm hơn tốc độ dời một tiếng mỗi ngày trong phòng thí nghiệm, vì ở nhà không có đèn chiếu sáng mạnh <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Từ tuần thứ ba, dậy 06:00 và tắt đèn 22:30. (Thử nghiệm của Facer-Childs nhảy thẳng tới đích và vẫn dời được khoảng hai tiếng trong ba tuần, nên cả hai cách đều có dữ liệu.)

Mỗi ngày, kể cả cuối tuần: giữ giờ thức cố định, lệch tối đa 15–30 phút — buổi sáng cuối tuần có thể dùng để đọc sách hay đi bộ; ra ánh sáng ngoài trời ngay sau khi dậy (khoảng 30 phút ánh sáng mạnh cho khoảng 75% tác dụng của hai tiếng trong một thí nghiệm có dùng kèm melatonin; [Crowley 2015](#r-crowley2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; uống cà phê trước 13:42 (22:30 trừ 8,8 tiếng); không uống rượu buổi tối; đèn mờ từ 19:30, tức ba tiếng trước giờ ngủ; và nếu thiếu ngủ, ngủ trưa 10–20 phút trước 16:00 thay vì ngủ nướng ([Facer-Childs 2019](#r-facerchilds2019); [Burgess 2003](#r-burgess2003); [Gardiner 2023](#r-gardiner2023)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Cần biết khi nào nên dừng lại <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>: nếu phần lớn các đêm trong tuần mất lâu hơn hẳn mới ngủ được, nghĩa là đang dời quá nhanh — giữ bước hiện tại thêm một tuần. Nếu nhật ký cho thấy ngủ dưới bảy tiếng ở phần lớn các đêm trong hai tuần, tắt đèn sớm hơn; nếu không ngủ được sớm hơn, lùi giờ thức 30 phút. Nếu sau ba tuần ở đích mà giờ ngủ được vẫn không sớm lên, kiểm tra lại ánh sáng buổi sáng và màn hình buổi tối; vẫn không được thì chấp nhận 23:00–06:30. Và luôn đánh giá bằng nhật ký, không bằng cảm giác "vẫn ổn", vì người thiếu ngủ không tự nhận ra ([Van Dongen 2003](#r-vandongen2003)).

<h3 id="example-ielts"><span class="num">26.5</span>Con đường IELTS</h3>

Câu hỏi "bao lâu thì đạt 6.5" không có câu trả lời đáng tin từ bên ngoài, vì mọi con số có nguồn ở chương 13 đều đo trên học viên học tập trung hoặc là giờ học có giáo viên. Câu trả lời đáng tin duy nhất đến từ chính số liệu của bạn, qua bốn bước. Trước hết, đo trình độ thật bằng một đề luyện chính thức (nguồn đề luyện miễn phí trên [ielts.org](https://ielts.org)): Listening và Reading tự chấm bằng đáp án; Writing và Speaking tự chấm theo band descriptors công khai — có thể nhờ AI đối chiếu, nhưng đó không phải điểm chính thức. Sau đó làm lại mỗi tám tuần: hai điểm đo cho bạn **tốc độ của riêng mình**, đúng như IELTS khuyên — ước lượng theo những người giống mình nhất ([IELTS: how long](#r-ieltshowlong)), và người giống bạn nhất là chính bạn. Phân bổ giờ theo chỗ hổng: nghe cần lượng input lớn (đi bộ, vừa đọc vừa nghe); nói và viết cần output kèm feedback ([Li 2010](#r-li2010)); đọc đang khá thì giữ ở maintenance dose — vì band tổng là trung bình bốn kỹ năng, kỹ năng yếu nhất kéo tổng xuống nhiều nhất. Cuối cùng, đặt mục tiêu theo tầng: outcome (band) đo mỗi tám tuần, process (số buổi, số giờ nghe) đo mỗi tuần, và learning goal cho từng kỹ năng mới.

<h2 id="part-6" class="part">Phần VI — Đo lường và tự kiểm chứng</h2>

<h2 id="measuring"><span class="num">27</span>Đo chính mình, và kiểm tra cuốn sách này</h2>

Một cuốn sách về hành vi chỉ có giá trị nếu người đọc kiểm tra được nó. Có hai thứ cần kiểm: các nghiên cứu có nói đúng như sách viết không, và chúng có đúng **với bạn** không.

<h3 id="the-log"><span class="num">27.1</span>Ghi chép hằng ngày</h3>

Feedback loop ở chương 15 cần một nguồn dữ liệu, và nguồn đơn giản nhất là một dòng ghi chép mỗi ngày, mất khoảng một phút. Một bảng tính đơn giản là đủ; tên cột nên bằng tiếng Anh để dễ xử lý về sau:

```text
date,day_type,energy_arrival,phone_min_evening,push_goal_min,minimum_done,movement_min,people,bedtime,wake,note
2026-10-26,office,2,95,0,no,20,,00:40,08:00,"về 19:15, ngồi sofa, mở TikTok 19:20"
2026-10-27,office,3,40,25,yes,20,,23:55,08:00,"điện thoại lên kệ, tắm trước"
```

Cột `energy_arrival` là mức năng lượng tự chấm từ 1 đến 5 lúc về nhà. Cột `phone_min_evening` lấy từ Digital Wellbeing trên Android (Settings → Digital Wellbeing & parental controls) hoặc Screen Time trên iOS (Settings → Screen Time) — số đo của máy, không phải ước lượng. Cột `minimum_done` — đã làm minimum dose của push goal chưa — là cột quan trọng nhất. Cột `people` ghi ngắn đã ở bên ai, làm gì. Và cột `note` viết bằng **trạng thái** (giờ, mức mệt, bối cảnh), không bằng tính cách. Một bảng như thế là một dạng experience sampling nhỏ — phương pháp ghi lại trải nghiệm ngay khi nó xảy ra, thay vì nhớ lại sau.

Sau bốn tuần, bảng ghi chép trả lời được những câu mà cảm giác không trả lời được. Năng lượng lúc về có quyết định việc làm minimum dose không — nếu những ngày năng lượng 2 vẫn làm được, việc làm cho bước bắt đầu bớt tốn sức đã có tác dụng. Các thay đổi với điện thoại có thật sự làm giảm số phút không, so giữa tuần 0 và các tuần sau. Giờ ngủ có lùi dần không, và giờ thức các ngày lệch nhau bao nhiêu. Người thân có bị lấn mất thời gian không. Và trong cột ghi chú của những ngày thất bại, bối cảnh nào lặp lại nhiều nhất — đó là mắt xích cần cắt tiếp theo.

<h3 id="self-check"><span class="num">27.2</span>Kiểm tra một nghiên cứu trong năm phút</h3>

Mỗi nguồn trong sách có một link ở phần Nguồn. Bấm vào và đọc **abstract** — các con số trong sách được lấy từ đó hoặc từ bản đầy đủ. Tìm tên bài trên [Google Scholar](https://scholar.google.com), bấm "Cited by" và tìm thêm các từ khoá replication hoặc meta-analysis: một kết quả nổi tiếng chưa chắc đã còn đúng, và ego depletion ở chương 4 là ví dụ rõ nhất. Kiểm tra xem bài có bị rút không trên [Retraction Watch Database](https://retractiondatabase.org), và xem thảo luận sau xuất bản trên [PubPeer](https://pubpeer.com). Cuối cùng, nhìn vào **thiết kế**: đây là thử nghiệm ngẫu nhiên hay chỉ là tương quan, bao nhiêu người tham gia, và họ là ai — sinh viên Mỹ, người lớn tuổi ở Anh — giống bạn đến đâu.

<h2 id="glossary"><span class="num">B</span>Phụ lục: glossary</h2>

Thuật ngữ được giữ nguyên tiếng Anh — đó là dạng bạn sẽ gặp lại khi đọc nghiên cứu hay tra cứu. Cột bên phải là phần giải thích, không phải bản dịch.

<dl class="gloss">
<dt>active-constructive responding</dt><dd>Cách phản hồi khi người khác kể tin vui: chú ý thật, hỏi thêm, vui cùng — thay vì thờ ơ hay kéo sang chuyện khác.</dd>
<dt>actively open-minded thinking</dt><dd>Thói quen chủ động tìm bằng chứng đi ngược niềm tin của chính mình, và sẵn sàng đổi ý khi bằng chứng đủ mạnh.</dd>
<dt>attention residue</dt><dd>Một phần sự chú ý còn mắc lại ở việc trước khi chuyển sang việc mới, làm việc mới kém đi.</dd>
<dt>autonomous / controlled motivation</dt><dd>Động lực xuất phát từ quan tâm và giá trị của chính mình / động lực xuất phát từ áp lực, phần thưởng, sự xấu hổ.</dd>
<dt>bedtime procrastination</dt><dd>Cứ lùi giờ đi ngủ dù không có lý do bên ngoài nào bắt phải thức.</dd>
<dt>blocking / interleaving</dt><dd>Học từng nhóm nội dung một cho xong rồi mới sang nhóm khác / trộn lẫn các nhóm trong cùng một buổi.</dd>
<dt>Brier score</dt><dd>Điểm đo độ chính xác của một dự đoán xác suất: (xác suất − kết quả)²; càng thấp càng tốt.</dd>
<dt>chronotype</dt><dd>Xu hướng tự nhiên của một người về giờ ngủ–thức: kiểu buổi sáng, buổi tối, hay trung tính.</dd>
<dt>circadian rhythm</dt><dd>Nhịp sinh học khoảng 24 giờ điều khiển giờ buồn ngủ, tỉnh táo, nhiệt độ cơ thể; được chỉnh chủ yếu bằng ánh sáng.</dd>
<dt>coast</dt><dd>Nới tay khỏi một mục tiêu khi nó đang đi trước kế hoạch, để dành sức cho mục tiêu khác.</dd>
<dt>commitment device</dt><dd>Một cách tự khoá lựa chọn tương lai khi đang tỉnh táo (tài khoản khoá, cam kết trước), để lúc mệt sau này mình không đổi ý được.</dd>
<dt>cue</dt><dd>Tín hiệu trong bối cảnh (nơi chốn, giờ giấc, đồ vật, việc vừa làm) kích hoạt một habit.</dd>
<dt>default</dt><dd>Lựa chọn xảy ra khi bạn không làm gì — thứ được cài sẵn. Phần lớn người giữ nguyên default.</dd>
<dt>default mode network</dt><dd>Mạng lưới các vùng não hoạt động mạnh khi không tập trung vào việc bên ngoài — lúc nghĩ ngợi, nhớ lại, nghĩ về bản thân.</dd>
<dt>disengagement / re-engagement</dt><dd>Buông một mục tiêu không còn khả thi / gắn bó lại với một mục tiêu mới thay thế. Hai kỹ năng khác nhau.</dd>
<dt>DLMO (dim light melatonin onset)</dt><dd>Thời điểm melatonin bắt đầu tăng trong điều kiện ánh sáng mờ buổi tối — số đo chuẩn cho vị trí đồng hồ sinh học của một người.</dd>
<dt>DRAMMA</dt><dd>Năm cơ chế qua đó thời gian rảnh giúp con người sống tốt hơn: detachment-recovery, autonomy, mastery, meaning, affiliation.</dd>
<dt>ego depletion</dt><dd>Giả thuyết cho rằng ý chí là một nguồn lực cạn dần khi dùng — không lặp lại được trong các thử nghiệm lớn.</dd>
<dt>experience sampling</dt><dd>Phương pháp ghi lại trải nghiệm ngay lúc nó xảy ra, nhiều lần trong ngày, thay vì nhớ lại sau.</dd>
<dt>far transfer</dt><dd>Luyện một việc rồi giỏi lên ở một việc khác hẳn. Bằng chứng cho thấy gần như không xảy ra một cách tự nhiên.</dd>
<dt>feedback loop</dt><dd>Chu trình: so trạng thái hiện tại với mục tiêu → hành động → đo lại → so lại. Không đo thì chu trình không vận hành.</dd>
<dt>fresh start effect</dt><dd>Xu hướng dễ bắt đầu thay đổi hơn ở các mốc thời gian (thứ 2, đầu tháng, sinh nhật).</dd>
<dt>goal shielding</dt><dd>Khi một mục tiêu đang chiếm sự chú ý, các mục tiêu khác bị đẩy ra khỏi đầu — nên dễ bị bỏ quên mà không nhận ra.</dd>
<dt>habit</dt><dd>Liên kết cue → response học qua lặp lại trong bối cảnh ổn định; diễn ra tự động, không cần mục tiêu hay ý chí.</dd>
<dt>habit discontinuity</dt><dd>Giai đoạn bối cảnh sống thay đổi (chuyển nhà, đổi việc) làm habit cũ yếu đi — dịp thuận lợi để tạo habit mới.</dd>
<dt>hot–cold empathy gap</dt><dd>Khi đang bình tĩnh, no, khoẻ ("cold"), ta đánh giá thấp việc mệt, đói, thèm ("hot") sẽ chi phối hành vi của chính mình đến mức nào.</dd>
<dt>implementation intention</dt><dd>Kế hoạch dạng "Khi [tình huống] thì tôi [hành động]", gắn hành động vào một cue cụ thể.</dd>
<dt>incentive salience (wanting) vs liking</dt><dd>"Muốn" — sức hút thúc đẩy hành động, do dopamine — khác với "thích" — khoái cảm khi nhận được. Có thể muốn mạnh mà thích ít.</dd>
<dt>intention–behaviour gap</dt><dd>Khoảng cách giữa điều mình định làm và điều mình thực sự làm.</dd>
<dt>intermittent reinforcement</dt><dd>Phần thưởng đến không đều, không đoán trước được — kiểu này làm hành vi rất khó dừng.</dd>
<dt>learning / process / outcome goal</dt><dd>Mục tiêu về việc học cách làm / về điều mình tập trung làm khi đang thực hiện kỹ năng (nghiên cứu gốc trong thể thao; sách mở rộng sang những hành vi mình kiểm soát được) / về kết quả cuối cùng.</dd>
<dt>maintenance dose</dt><dd>Mức tối thiểu để một mục tiêu không thụt lùi trong lúc bạn dồn sức cho mục tiêu khác (thuật ngữ dùng trong tài liệu này).</dd>
<dt>mastery (recovery)</dt><dd>Trải nghiệm học hay làm được điều mới có thử thách vừa phải ngoài giờ làm — một cách hồi sức.</dd>
<dt>melanopic EDI</dt><dd>Đơn vị đo ánh sáng theo mức nó tác động lên tế bào cảm quang điều khiển đồng hồ sinh học, khác với độ sáng mắt cảm nhận.</dd>
<dt>mental contrasting (WOOP)</dt><dd>Hình dung điều mong muốn, rồi hình dung trở ngại thật trong chính mình, rồi lập kế hoạch vượt trở ngại.</dd>
<dt>minimum dose</dt><dd>Phiên bản nhỏ nhất của một việc, nhỏ tới mức làm được cả khi mệt; làm xong cái này thì tính là "đã làm" trong ngày (thuật ngữ dùng trong tài liệu này).</dd>
<dt>mood repair</dt><dd>Hành động nhằm làm mình dễ chịu hơn ngay lập tức — động cơ thật đằng sau phần lớn sự trì hoãn.</dd>
<dt>multifinal means</dt><dd>Một hành động phục vụ được nhiều mục tiêu cùng lúc (vd: tập thể dục cùng người yêu).</dd>
<dt>opportunity cost</dt><dd>Thứ mất đi khi dùng sự tập trung cho việc này thay vì việc khác — lý thuyết giải thích cảm giác "tốn sức".</dd>
<dt>phubbing</dt><dd>Dùng điện thoại trong lúc đang ở cạnh người khác, khiến họ cảm thấy bị lơ đi.</dd>
<dt>planning fallacy</dt><dd>Xu hướng dự đoán thời gian và công sức quá lạc quan vì dựa vào kịch bản tưởng tượng thay vì kinh nghiệm cũ.</dd>
<dt>present bias</dt><dd>Xu hướng đánh giá phần thưởng có ngay cao hơn hẳn phần thưởng đến sau, mạnh nhất với các việc tốn công sức.</dd>
<dt>progress monitoring</dt><dd>Thường xuyên so tình trạng hiện tại với mục tiêu — tốt nhất là ghi lại và cho người khác thấy.</dd>
<dt>psychological detachment</dt><dd>Tâm trí thật sự rời khỏi công việc ngoài giờ làm — không làm, không nghĩ về việc.</dd>
<dt>psychological flexibility</dt><dd>Khả năng điều chỉnh hành vi theo tình huống và giá trị của mình, kể cả khi có cảm xúc khó chịu; cách đo hiện còn tranh cãi.</dd>
<dt>push goal</dt><dd>Mục tiêu được dồn sức trong một quý: có if-then plan chi tiết, khung giờ tốt nhất, đo hằng tuần (thuật ngữ dùng trong tài liệu này).</dd>
<dt>restraint bias</dt><dd>Tự tin quá mức vào khả năng kiềm chế, dẫn tới để mình ở gần cám dỗ hơn.</dd>
<dt>retrieval practice</dt><dd>Tự nhớ lại thông tin mà không nhìn tài liệu (flashcard, tự kiểm tra) — giúp nhớ lâu hơn đọc lại.</dd>
<dt>reward prediction error</dt><dd>Chênh lệch giữa phần thưởng mong đợi và phần thưởng thật — thứ mà neuron dopamine báo hiệu.</dd>
<dt>self-compassion</dt><dd>Đối xử với chính mình như với một người bạn khi thất bại: thừa nhận thất bại, không chối bỏ, không tự dằn vặt.</dd>
<dt>self-concordance</dt><dd>Mức một mục tiêu xuất phát từ giá trị và sự quan tâm thật của mình, thay vì từ áp lực hay tội lỗi.</dd>
<dt>self-efficacy</dt><dd>Niềm tin rằng mình làm được một việc cụ thể; tăng nhờ những lần làm được, giảm qua thất bại lặp lại.</dd>
<dt>situation modification</dt><dd>Thay đổi môi trường trước khi cám dỗ xuất hiện, để không phải cưỡng lại nó.</dd>
<dt>sleep inertia</dt><dd>Trạng thái lờ đờ ngay sau khi thức dậy; tệ nhất trong 15–30 phút đầu.</dd>
<dt>social jetlag</dt><dd>Lệch giờ ngủ giữa ngày làm và ngày nghỉ, giống như mỗi cuối tuần bay sang một múi giờ khác.</dd>
<dt>spacing effect</dt><dd>Chia việc học thành nhiều lần cách quãng giúp nhớ lâu hơn dồn vào một lần.</dd>
<dt>task aversiveness</dt><dd>Mức độ khó chịu, nhàm chán hay đáng sợ của một việc — yếu tố gắn mạnh với trì hoãn.</dd>
<dt>temptation bundling</dt><dd>Chỉ cho phép mình hưởng một thứ thích (podcast, phim) khi đang làm việc nên làm.</dd>
<dt>thinking dispositions</dt><dd>Thói quen và xu hướng tư duy (chịu nghi ngờ mình, chịu tìm thêm thông tin) — khác với trí thông minh.</dd>
<dt>time affluence</dt><dd>Cảm giác mình có đủ thời gian — gắn với well-being, khác với số giờ rảnh thật.</dd>
<dt>VILPA</dt><dd>Những đợt vận động mạnh rất ngắn (1–2 phút) xen trong sinh hoạt hằng ngày, như leo cầu thang nhanh.</dd>
<dt>VTA (ventral tegmental area)</dt><dd>Vùng não giữa chứa nhiều neuron dopamine, liên quan tới phần thưởng và động lực.</dd>
</dl>
