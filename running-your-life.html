# Nền tảng vận hành cuộc sống

Cuốn sổ tay này bắt đầu từ một câu hỏi rất đời thường — *vì sao về nhà lúc 19:15, đã có kế hoạch học, mà vẫn lướt điện thoại tới hết ngày?* — và đi xuống tận cơ chế bên dưới: não tính chi phí của nỗ lực thế nào, habit vận hành ra sao, vì sao kế hoạch viết lúc tỉnh táo lại thua lúc mệt, điều gì thật sự giúp con người hồi sức, quan hệ và sức khoẻ đóng vai trò gì, và làm sao theo đuổi nhiều mục tiêu trong nhiều năm mà không kiệt sức, không mất phương hướng. Phần lớn nội dung là nền tảng chung, đúng với bất kỳ ai ở bất kỳ giai đoạn nào. Cuộc sống hiện tại của bạn chỉ xuất hiện ở gần cuối, như một ví dụ áp dụng — vì lịch sống sẽ đổi, còn nguyên lý thì không.

<h2 id="how-to-read"><span class="num">0</span>Cách đọc cuốn sách này</h2>

Sách có sáu phần, và thứ tự của chúng có lý do. Phần I giải thích **cơ chế** — vì sao con người hành xử như vậy — bởi không hiểu cơ chế thì mọi lời khuyên chỉ là mẹo vặt, gặp hoàn cảnh mới là không dùng được. Phần II nói về những **nền móng** mà mọi mục tiêu dựa vào: người thân yêu, cơ thể, tiền bạc, cách học và cách tư duy. Phần III dùng tất cả để xây một **hệ thống theo đuổi mục tiêu** dùng được cả đời: chọn mục tiêu, giữ, đo, và biết lúc nào nên buông. Phần IV biến hệ thống ấy thành một **phương pháp xây một tuần** mà bạn làm lại mỗi khi cuộc sống thay đổi. Phần V áp dụng thử phương pháp vào lịch hiện tại của bạn. Phần VI nói về việc **đo lường và tự kiểm chứng** — để bạn không phải tin cuốn sách này, mà tự thấy nó đúng hay sai với chính mình. Cuối mỗi phần có vài câu hỏi nhớ lại: hãy trả lời trong đầu trước khi mở đáp án — đó chính là retrieval practice ở chương 13, áp dụng cho chính cuốn sách.

```mermaid
flowchart LR
  P1["Phần I<br/>Cơ chế"] --> P2["Phần II<br/>Nền móng"]
  P2 --> P3["Phần III<br/>Theo đuổi mục tiêu"]
  P3 --> P4["Phần IV<br/>Xây một tuần"]
  P4 --> P5["Phần V<br/>Ví dụ: lịch hiện tại"]
  P5 -.->|"cuộc sống thay đổi"| P4
  P4 --> P6["Phần VI<br/>Đo và tự kiểm chứng"]
  P6 -.->|"dữ liệu sửa kế hoạch"| P4
```

Lần đầu, hãy đọc tuần tự. Về sau, cuốn sách được dùng theo cách khác: khi gặp một vấn đề cụ thể (trì hoãn, mất ngủ, bỏ tập, quan hệ căng thẳng), mở đúng chương cơ chế của nó; khi lịch sống thay đổi, mở Phần IV.

<h2 id="principles"><span class="num">1</span>Mười hai nguyên lý</h2>

Nếu chỉ nhớ một trang, hãy nhớ trang này. Mỗi nguyên lý được giải thích kỹ ở chương tương ứng.

```mermaid
mindmap
  root((Vận hành<br/>cuộc sống))
    Thiết kế tình huống
      1 Hành vi do tình huống
      4 Habit = bối cảnh → phản ứng
      5 Default thắng quyết định
    Chi phí và cảm xúc
      2 Lập kế hoạch cho lúc mệt
      3 Bắt đầu cho dễ
      6 Né tránh là sửa tâm trạng
    Nền móng
      7 Ngủ và hồi sức
      8 Người thân yêu
    Hệ thống mục tiêu
      9 Một mục tiêu mỗi quý
      10 Ghi lại và chia sẻ
      11 Buông và tìm mục tiêu mới
    Kết quả
      12 Bạn là những gì đã làm
```

Mười hai nguyên lý gom thành năm nhóm. Ba nhóm đầu nói về **một khoảnh khắc lựa chọn**; nhóm thứ tư nói về **nhiều tháng, nhiều năm**; nhóm cuối là hệ quả của tất cả.

1. **Hành vi phụ thuộc vào tình huống lúc chọn nhiều hơn vào ý định lúc lập kế hoạch.** Người có self-control tốt ít phải cưỡng lại hơn — họ gặp ít cám dỗ hơn ([chương 5](#self-control)).
2. **Người lập kế hoạch và người thực hiện ở hai trạng thái khác nhau.** Hãy lập kế hoạch cho chính mình lúc đang mệt, và dựa trên những lần trước ([chương 3](#cold-and-hot)).
3. **Nỗ lực có chi phí, và chi phí đó tăng dần trong ngày.** Thay vì chờ có năng lượng, hãy làm cho việc bắt đầu bớt tốn sức ([chương 4](#fatigue)).
4. **Habit là liên kết giữa bối cảnh và phản ứng.** Lặp lại trong bối cảnh ổn định thì nó hình thành; lỡ một lần không sao; quay lại nhanh mới là điều quan trọng ([chương 6](#habits)).
5. **Default thắng quyết định.** Thứ được cài sẵn thường trở thành hành vi thật ([chương 12](#body-money)).
6. **Né tránh là để sửa tâm trạng.** Làm cho bước đầu tiên dễ chịu, và đọc thất bại như dữ liệu chứ không như bản án ([chương 8](#mood-and-shame)).
7. **Hồi sức là một phần của hiệu suất** — giấc ngủ, việc gác hẳn công việc lại, nghỉ ngơi thật sự ([chương 9](#recovery), [chương 10](#sleep)).
8. **Những người thân yêu là trụ cột của cuộc sống**, không phải thứ chỉ dành cho thời gian còn dư ([chương 11](#people)).
9. **Dồn sức cho một mục tiêu mỗi quý**, giữ các mục tiêu khác ở mức tối thiểu ([chương 17](#portfolio)).
10. **Ghi lại tiến độ và chia sẻ với một người** ([chương 19](#monitoring)).
11. **Linh hoạt nghĩa là biết buông và biết gắn với mục tiêu mới** — buông một mục tiêu phải đi kèm một mục tiêu thay thế ([chương 20](#flexibility)).
12. **Bạn trở thành những gì bạn đã thực sự làm**, không phải những gì bạn đã định làm ([chương 14](#thinking-well)).

<div class="callout why"><div class="ct">Bản chất, trong một đoạn</div>

Con người không phải một cỗ máy cứ dùng ý chí là làm đúng kế hoạch. Ở mỗi khoảnh khắc, não chọn hành động có lợi nhất — lợi ích kỳ vọng trừ đi chi phí — *trong tình huống trước mặt*, với trạng thái cơ thể lúc đó. Kế hoạch chỉ thắng khi nó đã thay đổi được tình huống, chi phí, hoặc phần thưởng **trước** thời điểm chọn. Gần như mọi kỹ thuật trong cuốn sách này quy về ba việc: đổi tình huống, làm cho việc bắt đầu bớt tốn sức, và để phần thưởng đến sớm hơn.

</div>


<h2 id="part-1" class="part">Phần I — Con người vận hành thế nào</h2>

<h2 id="the-loop"><span class="num">2</span>Một buổi tối điển hình</h2>

Hãy bắt đầu bằng một tình huống rất quen thuộc với người đi làm. Buổi sáng, bạn quyết định tối nay sẽ học một tiếng. Bạn về nhà lúc 19:15, ngồi xuống, cầm điện thoại "xem một chút", và khi ngẩng lên thì đã gần nửa đêm. Hôm sau bạn tự trách, đặt kế hoạch lớn hơn để bù, và vòng ấy lại bắt đầu.

Điều quan trọng nhất cần thấy là: đây không phải một lỗi đơn lẻ, mà là một **feedback loop** — mắt xích này kéo theo mắt xích sau, nên vòng càng lặp càng khó thoát. Hình dưới vẽ đủ tám mắt xích.

```mermaid
flowchart TD
  A["Cả ngày làm việc<br/>dùng executive control liên tục"] -->|"① chi phí nỗ lực tăng"| B["Buổi tối: lựa chọn nghiêng về<br/>thưởng ngay, ít công sức"]
  B -->|"② cue: về nhà, ngồi xuống,<br/>điện thoại trong tay"| C["Mở feed<br/>(habit tự diễn ra)"]
  C -->|"③ wanting, không cần liking;<br/>không có điểm dừng"| D["Lướt lâu hơn định"]
  D -->|"④ mệt + chán tăng,<br/>thêm cảm giác tội lỗi"| E["Không hồi sức được"]
  E -->|"⑤ 'giờ của riêng mình'<br/>kéo sang đêm"| F["Ngủ muộn"]
  F -->|"⑥ thiếu ngủ mà không nhận ra"| A
  E -->|"⑦ 'lại mất một ngày'<br/>— tự kết tội mình"| G["Self-efficacy giảm"]
  G -->|"⑧ việc học thành đáng sợ hơn;<br/>kế hoạch bù to hơn"| B
```

Đi qua từng mắt xích:

1. **Chi phí nỗ lực tăng.** Sau hơn sáu tiếng làm những việc đòi hỏi kiểm soát nhận thức, người ta chọn bốc đồng hơn và vùng lateral prefrontal cortex hoạt động yếu hơn — hiệu ứng chỉ xuất hiện ở nhóm làm việc khó ([Blain 2016](#r-blain2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Buổi tối, mọi việc đòi hỏi cố gắng đều tốn sức hơn buổi sáng.
2. **Bối cảnh kích hoạt habit.** Trong hai nghiên cứu nhật ký theo giờ với sinh viên, khoảng một phần ba đến một nửa số hành vi được ghi lại (35% và 43%) là những việc làm gần như mỗi ngày, thường ở cùng một chỗ ([Wood 2002](#r-wood2002)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Về nhà, ngồi xuống ghế, điện thoại trong tay — đó là một bối cảnh như vậy.
3. **Feed tạo ra "muốn" mà không cần "thích".** Dopamine mã hoá reward prediction error và động lực muốn, không phải khoái cảm ([Schultz 1997](#r-schultz1997); [Berridge 1998](#r-berridge1998)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Cuộn vô hạn và autoplay xoá luôn điểm dừng tự nhiên.
4. **Mệt và chán tăng sau khi dùng.** Người ta cầm điện thoại khi mệt hoặc chán — và mệt, chán lại *tăng* sau khi dùng ([Dora 2021](#r-dora2021)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Nếu tự coi việc xem là trì hoãn, cảm giác tội lỗi còn xoá nốt tác dụng thư giãn ([Reinecke 2014](#r-reinecke2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.
5. **"Giờ của riêng mình" kéo sang đêm.** Bedtime procrastination — cứ lùi giờ đi ngủ dù không có lý do gì bắt phải thức — có thật và đi kèm ngủ thiếu ([Kroese 2014](#r-kroese2014)); nhóm hay trì hoãn giờ ngủ dùng điện thoại nhiều hơn khoảng 61 phút mỗi ngày trong ba tiếng trước khi ngủ ([Chung 2020](#r-chung2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.
6. **Thiếu ngủ mà không biết.** Chỉ cho nằm giường sáu tiếng mỗi đêm trong hai tuần làm suy giảm sự tỉnh táo và trí nhớ làm việc ngang với một đêm thức trắng, bốn tiếng thì ngang với hai đêm, trong khi người ngủ thiếu phần lớn không nhận ra ([Van Dongen 2003](#r-vandongen2003)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Sáng hôm sau, mọi việc đã tốn sức hơn ngay từ đầu.
7. **Sáng hôm sau đổ lỗi cho tính cách.** Khi không còn mệt, người ta giải thích hành vi hôm qua bằng tính cách và bỏ qua trạng thái mệt ([Nordgren 2006](#r-nordgren2006)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Thất bại lặp lại làm giảm self-efficacy — niềm tin rằng mình làm được việc đó ([Bandura 1977](#r-bandura1977)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.
8. **Self-efficacy thấp làm trì hoãn nặng hơn.** Trong meta-analysis lớn nhất về trì hoãn, self-efficacy tương quan r = −,38 với trì hoãn ([Steel 2007](#r-steel2007)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Vòng bên trong khép lại.

Bài học của chương này không nằm ở buổi tối hay chiếc điện thoại, mà ở cách nhìn: một vấn đề lặp đi lặp lại hầu như luôn là một vòng như thế, và mắt xích nào cũng có thể cắt. Cắt ở **môi trường** — mắt xích ② (bối cảnh) và ⑤ (giờ ngủ) — là đỡ tốn sức nhất, vì không đòi hỏi ý chí lúc đang mệt. Cùng cấu trúc ấy xuất hiện ở việc bỏ tập thể dục, chi tiêu bốc đồng, hay trì hoãn một việc khó ở công ty. Gặp vấn đề lặp lại, hãy **vẽ vòng của nó** trước khi tìm giải pháp. Các chương còn lại của Phần I lần lượt mổ xẻ từng mắt xích.

<h2 id="cold-and-hot"><span class="num">3</span>Người lập kế hoạch và người thực hiện</h2>

Câu "lúc lập kế hoạch một kiểu, đi làm về thì mệt rồi" mô tả đúng một hiện tượng có tên trong tâm lý học: **hot–cold empathy gap**. Khi đang ở trạng thái "cold" — no, khoẻ, không có cám dỗ trước mặt — người ta đánh giá thấp việc trạng thái "hot" — mệt, đói, thèm, cám dỗ ngay trước mặt — sẽ chi phối hành vi của mình đến mức nào. Không chỉ vậy, họ còn *quên* luôn mình từng bị chi phối ra sao ([Loewenstein 1996](#r-loewenstein1996); [Loewenstein 2005](#r-loewenstein2005)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

```mermaid
flowchart TB
  subgraph COLD["08:00 — trạng thái cold"]
    P["Viết kế hoạch:<br/>'tối nay học 2 tiếng'"]
  end
  subgraph HOT["19:15 — trạng thái hot"]
    X["Thực hiện:<br/>mệt, cám dỗ trước mặt"]
  end
  P -->|"① dự đoán mình của tối nay<br/>giống mình của bây giờ"| X
  X -->|"② hành vi khác dự đoán"| R["Kế hoạch thất bại"]
  R -->|"③ sáng hôm sau quên mất<br/>mình đã mệt thế nào"| P
```

Bằng chứng rõ nhất đến từ một thí nghiệm rất đời thường: 200 nhân viên ở các công ty, bệnh viện và cửa hàng tại Amsterdam chọn trước món ăn vặt cho một tuần sau. Trong số người chọn trước món lành mạnh, **62–82% đổi sang món không lành mạnh** khi đến lúc ăn thật; chiều ngược lại chỉ 0–8% ([Read & van Leeuwen 1998](#r-read1998)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. "Mình của tương lai" thường trông có kỷ luật hơn mình của hiện tại.

Bốn hiện tượng khác có cùng một gốc. **Present bias**: phần thưởng có ngay được phóng đại so với phần thưởng đến sau, và thiên lệch này mạnh với *công sức* hơn là với tiền bạc ([Laibson 1997](#r-laibson1997); [Augenblick 2015](#r-augenblick2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Một mô hình kinh tế học phân biệt người "naive" — tin rằng ngày mai mình sẽ làm, nên cứ dời mãi những việc có chi phí phải trả trước — với người "sophisticated", biết trước rằng ngày mai mình cũng sẽ lại dời nên làm sớm hơn, và nhờ đó trì hoãn ít hơn ([O'Donoghue & Rabin 1999](#r-odonoghue1999)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; đây là mô hình lý thuyết, chưa phải kết quả đo được. **Restraint bias**: người tự tin vào khả năng kiềm chế lại hay để mình ở gần cám dỗ hơn, nên thua nhiều hơn ([Nordgren 2009](#r-nordgren2009)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. **Planning fallacy**: dự đoán thời gian dựa trên kịch bản tưởng tượng (74% suy nghĩ khi lập kế hoạch) thay vì kinh nghiệm cũ (7%); sinh viên dự định viết luận văn trong 33,9 ngày, thực tế mất trung bình 55,5 ngày — còn dài hơn cả dự đoán "tệ nhất" của chính họ là 48,6 ngày, dù chênh lệch này không có ý nghĩa thống kê ([Buehler 1994](#r-buehler1994)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Và **intention–behaviour gap**: một thay đổi ý định cỡ d = 0,66 chỉ kéo theo thay đổi hành vi cỡ d = 0,36 ([Webb & Sheeran 2006](#r-webb2006)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

Tin tốt nằm ngay trong nghiên cứu planning fallacy: sai lệch lạc quan **biến mất** khi người ta được yêu cầu nối dự đoán với những lần trước của chính mình; chỉ nhớ lại quá khứ mà không nối với dự đoán thì không đủ ([Buehler 1994](#r-buehler1994), Study 4). Từ đó có hai quy tắc dùng cho mọi kế hoạch. Thứ nhất, lập kế hoạch theo **dữ liệu thật của những lần gần nhất**, không theo "mình nên làm được gì". Thứ hai, **thiết kế cho trạng thái hot**: việc dành cho lúc mệt phải nhỏ, rõ, và đã chuẩn bị sẵn.

<h3 id="tmt-worked-example"><span class="num">3.1</span>Ví dụ tính tay: phương trình trì hoãn</h3>

Steel tổng hợp nghiên cứu về trì hoãn thành Temporal Motivation Theory ([Steel 2007](#r-steel2007)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — một khung để suy nghĩ hơn là một định luật đo được:

$$\text{Utility} = \frac{E \times V}{\Gamma \times D}$$

Trong đó E là expectancy (mình tin làm được đến đâu), V là value (giá trị cảm nhận), Γ là impulsiveness (mức nhạy với trì hoãn, gần như cố định với mỗi người) và D là delay (bao lâu nữa mới thấy phần thưởng). Vì Γ giống nhau ở mọi lựa chọn của cùng một người, chỉ cần so E × V / D. Các con số dưới đây là minh hoạ, đặt ra để thấy *hướng* của từng đòn bẩy:

| Lựa chọn lúc mệt | E | V | D | E × V / D |
|---|---|---|---|---|
| "Học IELTS 2 tiếng" | 0,3 — nhiều năm chưa xong | 9 — rất quan trọng | 100 — thưởng sau nhiều tháng | **0,027** |
| Lướt TikTok | 1,0 — chắc chắn làm được | 3 — vui vừa | 1 — thưởng ngay | **3** |
| "Ôn 15 thẻ từ + nghe một đoạn podcast mình thích" | 0,95 — quá nhỏ để thất bại | 4 — vui ngay, có tiến bộ | 1 — vui ngay khi nghe | **3,8** |

Lựa chọn thứ ba thắng "học IELTS" không phải vì quan trọng hơn — giá trị của nó thấp hơn — mà vì nó nhỏ tới mức gần như chắc chắn làm được (E tăng) và có phần thưởng ngay trong lúc làm (D giảm). Nó còn thắng được cả TikTok vì đoạn podcast mình thích đưa phần thưởng vào ngay bên trong việc, khiến V nhỉnh hơn. Công thức này áp dụng cho mọi mục tiêu, từ tập thể dục đến tiết kiệm: **thu nhỏ việc lại, và đưa phần thưởng vào ngay bên trong việc**.

<h2 id="fatigue"><span class="num">4</span>Mệt mỏi và chi phí của nỗ lực</h2>

Hình ảnh quen thuộc nhất về ý chí là một bình xăng: dùng nhiều thì cạn, phải nghỉ hoặc "nạp" lại. Trong tâm lý học, ý tưởng này có tên là ego depletion, và nó từng rất nổi tiếng. Nhưng khi được kiểm tra lại một cách nghiêm ngặt — nhiều phòng thí nghiệm, kế hoạch phân tích đăng ký trước — hiệu ứng gần như biến mất: 23 phòng thí nghiệm, N = 2.141, d = 0,04 ([Hagger 2016](#r-hagger2016)); 36 phòng thí nghiệm, N = 3.531, d = 0,06 ([Vohs 2021](#r-vohs2021)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

Vậy cảm giác mệt cuối ngày là gì? Cảm giác ấy có thật, chỉ là cơ chế khác.

```mermaid
flowchart TB
  subgraph OLD["Mô hình cũ: bình xăng (không lặp lại được)"]
    O1["Dùng ý chí"] --> O2["Bình cạn"] --> O3["Hết khả năng"]
  end
  subgraph NEW["Mô hình được ủng hộ hơn: chi phí cơ hội"]
    N1["Việc đòi hỏi tập trung"] --> N2{"Não so sánh:<br/>giá trị việc này<br/>vs mọi việc khác"}
    N2 -->|"chi phí cảm nhận > phần thưởng"| N3["Cảm giác 'tốn sức',<br/>muốn đổi sang việc dễ"]
    N2 -->|"việc nhỏ, phần thưởng gần"| N4["Vẫn làm được"]
  end
```

Theo opportunity cost model, cảm giác "tốn sức" là kết quả của một phép tính chi phí – lợi ích trong não: dùng sự tập trung cho việc này nghĩa là không dùng nó cho việc khác ([Kurzban 2013](#r-kurzban2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Người ta buông khi chi phí cảm nhận vượt quá phần thưởng dự đoán ([Boksem & Tops 2008](#r-boksem2008)). Sau một thời gian dài kiểm soát bản thân, động lực và sự chú ý dịch dần từ "phải làm" sang "muốn làm, thưởng ngay" ([Inzlicht & Schmeichel 2012](#r-inzlicht2012)). Hệ quả đo được ở hành vi: sau hơn sáu tiếng làm việc khó, người ta chọn phương án thưởng sớm, ít công hơn ([Blain 2016](#r-blain2016); [Wiehler 2022](#r-wiehler2022)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Còn lời giải thích sinh hoá mà Wiehler đề xuất — glutamate tích tụ ở vùng prefrontal — thì vẫn đang bị phản biện và chưa được lặp lại ([Embrey & Inzlicht 2025](#r-embrey2025)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>.

Hai mô hình này không chỉ khác nhau trên lý thuyết; chúng dẫn tới hai cách làm khác hẳn. Nếu mệt là bình cạn, giải pháp là "nạp lại" hoặc "chịu khó hơn". Nếu mệt là chi phí tăng, giải pháp là **làm cho việc bắt đầu bớt tốn sức**: việc đã được chọn sẵn, tài liệu đã mở sẵn, bước đầu tiên nhỏ tới mức gần như không tốn gì. Bạn không cần *cảm thấy* có năng lượng; bạn cần việc đủ nhẹ để bắt đầu. Và việc khó nhất nên được đặt vào lúc mọi thứ còn nhẹ nhàng — trước khi một ngày làm việc khiến chúng nặng nề hơn.

<h3 id="body-clock"><span class="num">4.1</span>Đồng hồ sinh học không chống lại bạn lúc tối</h3>

Một niềm tin phổ biến là buổi tối cơ thể đã "hết giờ". Thực ra, circadian rhythm — nhịp sinh học khoảng 24 giờ — phát tín hiệu tỉnh táo **mạnh nhất vào buổi tối**, tạo ra một vùng mà các nhà nghiên cứu gọi là "forbidden zone" cho giấc ngủ, quanh 20:00–22:00 ([Lavie 1986](#r-lavie1986)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Điểm thấp nhất của nhịp này rơi vào đầu giờ chiều, kể cả khi không ăn trưa ([Monk 2005](#r-monk2005)). Giấc ngủ được điều khiển bởi hai lực cùng lúc: áp lực ngủ tích luỹ theo số giờ thức, và đồng hồ sinh học ([Borbély 2016](#r-borbely2016)). Nghĩa là mệt lúc tối chủ yếu là mệt do công việc, không phải cơ thể hết khả năng.

Còn câu hỏi "mình là người buổi sáng hay buổi tối"? Phần lớn người trẻ thuộc kiểu buổi tối hoặc trung tính ([May 1993](#r-may1993)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Nhưng ý tưởng "làm việc đúng giờ cao điểm của chronotype thì tốt hơn" — synchrony effect — chỉ xuất hiện trong 29 trên 64 nghiên cứu ở người 18–45 tuổi ([Chauhan 2025](#r-chauhan2025)), và một thử nghiệm với 446 người không thấy hiệu ứng bền vững ([Rey-Mermet & Rothen 2023](#r-reymermet2023)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Một nghiên cứu cho thấy habit buổi sáng hình thành nhanh hơn, nhưng mẫu chỉ có 48 người nên kết quả rất mong manh ([Fournier 2017](#r-fournier2017)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Không có lý do vững để ép mình thành "người buổi sáng". Lý do tốt để học buổi sáng là một lý do khác: lúc đó mọi việc chưa trở nên nặng nề sau một ngày làm việc. Và muốn có thời gian buổi sáng thì phải dời *cả* giấc ngủ sớm hơn, không bao giờ cắt bớt nó ([chương 10](#sleep)).

Vài niềm tin khác về năng lượng cũng không còn đúng. "Ăn đồ ngọt để lấy lại ý chí" dựa trên những nghiên cứu có giá trị bằng chứng yếu, và meta-analysis không thấy glucose có tác dụng đồng nhất ([Vadillo 2016](#r-vadillo2016); [Orquin & Kurzban 2016](#r-orquin2016)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Câu chuyện "thẩm phán đói xử nặng hơn", thường được dùng làm bằng chứng cho decision fatigue, có thể được tái tạo hoàn toàn như một artifact thống kê ([Glöckner 2016](#r-glockner2016)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Tập thể dục cũng không làm bạn thông minh hơn ngay lập tức — tác động tức thì lên nhận thức rất nhỏ, g = 0,097 ([Chang 2012](#r-chang2012)) — nhưng lại làm tăng *cảm giác có năng lượng* một cách đáng tin cậy ([Wender 2022](#r-wender2022)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>, và tập buổi tối không làm hại giấc ngủ, trừ khi tập nặng và kết thúc trong vòng một tiếng trước giờ ngủ ([Stutz 2019](#r-stutz2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

<h2 id="self-control"><span class="num">5</span>Self-control là thiết kế tình huống</h2>

Phát hiện quan trọng nhất về self-control đi ngược trực giác. Trong một nghiên cứu theo dõi 205 người qua 7.827 lần báo cáo về ham muốn trong ngày, những người có self-control cao **báo cáo ít xung đột giữa ham muốn và mục tiêu hơn** ([Hofmann 2012](#r-hofmann2012)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Nói cách khác, họ ít phải đấu tranh với bản thân hơn. Một nghiên cứu khác cho thấy nỗ lực tự kiểm soát trong khoảnh khắc **không liên quan** tới việc đạt mục tiêu cuối học kỳ; điều dự báo thất bại là *tần suất gặp cám dỗ* ([Milyavskaya & Inzlicht 2017](#r-milyavskaya2017)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Tổng hợp 102 nghiên cứu với 32.648 người cho thấy self-control gắn mạnh với hành vi **tự động** hơn là hành vi phải cố gắng ([de Ridder 2012](#r-deridder2012)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>, và self-control tác động qua habit ([Galla & Duckworth 2015](#r-galla2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Khi được thử nghiệm ngoài đời, chiến lược **thay đổi tình huống** giúp sinh viên đạt mục tiêu học tập tốt hơn chiến lược cố kìm phản ứng ([Duckworth 2016](#r-duckworth2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Duckworth, Milkman và Laibson xếp các chiến lược self-control theo thời điểm can thiệp, từ sớm nhất đến muộn nhất ([Duckworth 2018](#r-duckworth2018)):

```mermaid
flowchart TB
  S1["① Situation selection<br/>không bước vào tình huống có cám dỗ"] --> S2["② Situation modification<br/>đổi môi trường trước mặt"]
  S2 --> S3["③ Attentional deployment<br/>hướng sự chú ý sang chỗ khác"]
  S3 --> S4["④ Cognitive change<br/>nhìn tình huống theo cách khác"]
  S4 --> S5["⑤ Response modulation<br/>cám dỗ đã trong tay, cố kìm lại"]
  S1 -.- C1["chi phí lúc mệt: gần như 0"]
  S5 -.- C5["chi phí lúc mệt: cao nhất"]
```

Lấy chiếc điện thoại buổi tối làm ví dụ. Ở bước ①, bạn không ngồi xuống sofa ngay khi về mà đi thẳng vào phòng tắm. Ở bước ②, điện thoại được cắm sạc ở một chỗ cố định ngoài tầm tay, ứng dụng feed đã đăng xuất. Ở bước ③, sách và tai nghe đã đặt sẵn trên bàn. Ở bước ④, bạn tự nói "chỉ 15 thẻ thôi". Đến bước ⑤, điện thoại đã ở trong tay, TikTok đã mở, và bạn cố tắt nó — đây là bước tốn kém nhất, và cũng thường là bước duy nhất người ta dùng. Cùng một thang ấy áp dụng cho tiền bạc: không mở ứng dụng mua sắm (①), cài chuyển tiền tiết kiệm tự động ngày nhận lương (②), gỡ thẻ khỏi ví điện tử (③), nghĩ "món này bằng ba giờ làm việc" (④), và cuối cùng là đứng trước món đồ cố không mua (⑤).

Hệ quả là một cách nhìn mới về thất bại: mỗi lần bạn phải "cố gắng" ở bước ⑤, đó là dấu hiệu một bước sớm hơn đã không được thiết kế. Câu hỏi đúng không phải "sao mình yếu thế", mà là **"bước nào sớm hơn mình chưa làm?"**

<h2 id="habits"><span class="num">6</span>Habit</h2>

Habit là một liên kết giữa **bối cảnh và phản ứng**, được học qua lặp lại. Khi đã hình thành, chỉ cần nhận ra bối cảnh là phản ứng tự diễn ra, không cần đi qua mục tiêu hay quyết định ([Wood & Neal 2007](#r-wood2007); [Wood & Rünger 2016](#r-wood2016)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

```mermaid
flowchart LR
  C["Cue<br/>bối cảnh: nơi chốn, giờ,<br/>đồ vật, việc vừa làm"] -->|"① nhận ra"| R["Response<br/>hành vi tự diễn ra"]
  R -->|"② lặp lại trong<br/>cùng bối cảnh"| L["Liên kết cue → response<br/>mạnh dần"]
  L -->|"③ lần sau diễn ra<br/>nhanh hơn, ít suy nghĩ hơn"| C
```

Thí nghiệm minh hoạ rõ nhất: những người quen ăn bỏng ngô ở rạp chiếu phim **ăn bỏng ngô ôi nhiều như bỏng ngô mới** — nhưng chỉ khi ở trong rạp ([Neal 2011](#r-neal2011)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Họ không thích bỏng ôi; bối cảnh đã quyết định thay họ. Khi năng lực kiểm soát thấp, như lúc mệt, người ta còn **rơi về habit nhiều hơn — cả habit tốt lẫn xấu** ([Neal, Wood & Drolet 2013](#r-neal2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Vì vậy lúc mệt bạn sẽ làm habit mạnh nhất của bối cảnh đó. Câu hỏi không phải "làm sao cưỡng lại", mà là: *habit mặc định của bối cảnh này là gì, và làm sao thay nó?* Đó là lý do một mục tiêu như "học tiếng Anh" không đủ; thứ cần có là "*khi cởi giày ở cửa* → *cắm sạc điện thoại ở chỗ cố định* → *mở thẻ từ*".

<h3 id="habit-timeline"><span class="num">6.1</span>Mất bao lâu, và lỡ một ngày có sao không</h3>

Con số "21 ngày để hình thành thói quen" chỉ là con số truyền miệng, không có cơ sở. Nghiên cứu theo dõi thực tế cho thấy thời gian để một hành vi trở nên tự động dao động từ **18 đến 254 ngày** tuỳ người ([Lally 2010](#r-lally2010)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; một phân tích trên hàng triệu lượt quan sát cho thấy habit tập gym mất hàng tháng, còn habit rửa tay của nhân viên bệnh viện mất vài tuần ([Buyalskaya 2023](#r-buyalskaya2023)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cùng nghiên cứu của Lally có một câu đáng nhớ nguyên văn: *"Missing one opportunity to perform the behaviour did not materially affect the habit formation process."* Lỡ một lần không làm hỏng gì cả. Và trong một megastudy với 61.293 hội viên phòng gym thử 54 chương trình bốn tuần khuyến khích đi tập, chương trình đứng đầu là **thưởng nhỏ cho việc quay lại sau một buổi bị lỡ** — dù chỉ 8% chương trình còn tạo khác biệt đo được sau khi kết thúc ([Milkman 2021](#r-milkman2021)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Điều đáng chú ý không kém: dự đoán của các chuyên gia về cách nào hiệu quả gần như không tương quan với kết quả thật (r = 0,02) — trực giác, kể cả của chuyên gia, không phải chỗ dựa tốt.

Ba yếu tố khác làm habit hình thành nhanh và bền hơn. Niềm vui và động lực nội tại khiến mỗi lần lặp tạo ra nhiều "độ tự động" hơn ([Judah 2018](#r-judah2018)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Sự đơn giản và đều đặn dự báo việc hình thành habit tập luyện — cụ thể là ít nhất bốn buổi mỗi tuần trong sáu tuần ([Kaushal & Rhodes 2015](#r-kaushal2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Và những giai đoạn bối cảnh sống thay đổi — chuyển nhà, đổi việc — là cơ hội tốt để tạo habit mới: can thiệp hiệu quả hơn ở người vừa chuyển nhà, trong khoảng ba tháng đầu ([Verplanken & Roy 2016](#r-verplanken2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Thứ giữ cho một habit tồn tại khác với thứ giúp bắt đầu nó. Bắt đầu dựa vào kỳ vọng về kết quả; duy trì dựa vào **sự hài lòng với kết quả thật đã nhận được** ([Rothman 2000](#r-rothman2000)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Tổng hợp 100 lý thuyết về việc duy trì hành vi gom lại năm nhóm yếu tố: động cơ, khả năng tự điều chỉnh, nguồn lực, habit, và môi trường xã hội ([Kwasnicka 2016](#r-kwasnicka2016)).

<h3 id="if-then"><span class="num">6.2</span>If-then plan</h3>

Implementation intention là một kế hoạch viết dưới dạng **"Khi [tình huống] thì tôi [hành động]"** — gắn hành động vào một cue cụ thể thay vì vào ý định chung chung. Tổng hợp 642 phép thử cho hiệu ứng từ d = 0,27 tới 0,66; mạnh hơn khi đúng dạng if-then, khi động lực cao, và khi kế hoạch được nhẩm lại ([Sheeran 2025](#r-sheeran2025)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Nhưng công cụ này có ba giới hạn quan trọng.

Thứ nhất, if-then plan giúp giảm hút thuốc ở người có habit hút yếu hoặc vừa, nhưng không ở người có habit mạnh ([Webb 2009](#r-webb2009)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Với habit mạnh, chiến lược duy nhất thấy hiệu quả là **theo dõi cảnh giác** — chủ động để ý và tự nhắc "đừng làm"; né tác nhân kích hoạt ngay lúc đó thì giúp với cám dỗ nhưng không giúp với habit mạnh ([Quinn 2010](#r-quinn2010)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cách bền hơn là đổi hẳn bối cảnh từ trước, nhất là khi bối cảnh sống đang thay đổi ([Verplanken & Roy 2016](#r-verplanken2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Thứ hai, **viết if-then plan cho nhiều mục tiêu cùng lúc lại phản tác dụng**: lợi ích không mở rộng sang nhiều mục tiêu ([Dalton & Spiller 2012](#r-dalton2012); [Verhoeven 2013](#r-verhoeven2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Thứ ba, **ngày và giờ cụ thể** mới tạo ra khác biệt: trong một thử nghiệm với 3.272 nhân viên, nhắc ghi cả ngày *và* giờ đi tiêm phòng làm tỷ lệ tiêm tăng 4,2 điểm phần trăm, còn chỉ ghi ngày thì không có tác dụng rõ ([Milkman 2011](#r-milkman2011)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

So sánh ba cách viết cùng một ý định:

| Cách viết | Câu | Vì sao |
|---|---|---|
| Sai | "Tối nay tôi sẽ học tiếng Anh." | Chỉ là mục tiêu, không có cue |
| Yếu | "Khi về nhà tôi sẽ không lướt TikTok." | Chỉ cấm, không có hành động thay thế |
| Đúng | "Khi tôi cởi giày ở cửa, tôi cắm điện thoại vào sạc trên kệ giày và mở app thẻ từ trên laptop." | Cue cụ thể dẫn tới hành động cụ thể, và cue cũ (điện thoại trong tay) bị gỡ |


<h2 id="the-feed"><span class="num">7</span>Feed và sự chú ý</h2>

<h3 id="dopamine"><span class="num">7.1</span>Wanting không phải liking</h3>

Câu "dopamine là hormone hạnh phúc" là một trong những hiểu lầm phổ biến nhất. Các neuron dopamine báo hiệu **reward prediction error** — chênh lệch giữa phần thưởng mình mong đợi và phần thưởng thật sự nhận được ([Schultz 1997](#r-schultz1997)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Và dopamine cần cho **wanting** — sức hút thúc đẩy mình tìm tới một thứ — chứ không cần cho **liking**, khoái cảm khi nhận được nó: chuột bị mất tới 99% dopamine vẫn có phản ứng thích thú bình thường khi nếm vị ngọt ([Berridge & Robinson 1998](#r-berridge1998); [Berridge & Kringelbach 2015](#r-berridge2015)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

```mermaid
flowchart LR
  F["Video tiếp theo:<br/>có thể hay, không chắc"] -->|"① dự đoán không chắc chắn"| W["Wanting<br/>(dopamine) tăng"]
  W -->|"② vuốt tiếp"| V["Video thật:<br/>thường chỉ hơi hay"]
  V -->|"③ liking thấp,<br/>nhưng sai số dự đoán vẫn còn"| F
```

Một feed gồm toàn những thứ *có thể* hay nhưng *không chắc* liên tục tạo ra sai số dự đoán, nên liên tục tạo ra wanting — kể cả khi từng video chỉ hơi hay. Đó là lý do người ta có thể lướt một tiếng mà không thấy vui.

<h3 id="no-stopping-point"><span class="num">7.2</span>Không có điểm dừng, và được cá nhân hoá</h3>

Cuộn vô hạn và autoplay xoá đi những điểm dừng tự nhiên, còn việc thỉnh thoảng gặp một thứ thật hay là một dạng intermittent reinforcement — phần thưởng đến không đều, khiến hành vi khó dừng. Đây là phân tích thiết kế, chưa được đo trực tiếp trên feed thật ([Montag 2019](#r-montag2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Điều đã được đo: tắt autoplay trên Netflix làm giảm thời gian xem mỗi ngày và độ dài mỗi phiên ([Schaffner 2025](#r-schaffner2025)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Và video TikTok được cá nhân hoá kích hoạt default mode network và VTA — một vùng chứa nhiều neuron dopamine — mạnh hơn video không cá nhân hoá ([Su 2021](#r-su2021)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Kết quả này cho thấy cá nhân hoá thay đổi hoạt động não, chứ **không** chứng minh "não bị hỏng".

<h3 id="feed-evidence"><span class="num">7.3</span>Feed có hại đến mức nào</h3>

Có hai loại bằng chứng, và chúng nói hai điều khác nhau. Nghiên cứu tương quan trên 355.358 thanh thiếu niên cho thấy việc dùng công nghệ giải thích **tối đa 0,4%** sự khác biệt về well-being ([Orben & Przybylski 2019](#r-orben2019)) <span class="ev ev-high" title="Bằng chứng mạnh"></span> — tức là feed không phải chất độc. Nhưng các thử nghiệm ngẫu nhiên cho thấy một điều khác. Khi người dùng được cho cơ hội đặt giới hạn thời gian, **78%** chọn đặt giới hạn ràng buộc; giới hạn giảm thời gian dùng 22 phút mỗi ngày, và mô hình của các tác giả ước tính **31%** thời gian dùng mạng xã hội đến từ vấn đề tự kiểm soát — phần mà chính người dùng không muốn ([Allcott 2022](#r-allcott2022)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Tắt Facebook bốn tuần giải phóng 60 phút mỗi ngày, tăng well-being 0,09 độ lệch chuẩn, và sau thí nghiệm người ta vẫn dùng ít hơn khoảng 11 phút mỗi ngày (22%) ([Allcott 2020](#r-allcott2020)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Giới hạn 10 phút mỗi nền tảng mỗi ngày trong ba tuần làm giảm cảm giác cô đơn và trầm cảm ở sinh viên ([Hunt 2018](#r-hunt2018)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Hiểu cho đúng: vấn đề của feed là **thời gian và thứ tự** — feed chiếm đúng những khoảng trống hiếm hoi trong ngày, và một phần ba lượng dùng là thứ người dùng không muốn. Hai kết quả quan trọng nhất cho việc thiết kế cuộc sống là: người ta *muốn* bị ràng buộc khi được đề nghị lúc tỉnh táo, và mức dùng giảm **kéo dài cả sau khi** can thiệp kết thúc.

<h3 id="feed-interventions"><span class="num">7.4</span>Điều gì giúp cắt được vòng này</h3>

Can thiệp mạnh nhất là **quyết định lúc tỉnh táo, ràng buộc lúc mệt**: đặt giới hạn thời gian vào một lúc bình tĩnh (ví dụ tối Chủ nhật) và không cho mình gỡ ra dễ dàng ([Allcott 2022](#r-allcott2022)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Xoá ứng dụng hoặc đăng xuất tạo ra nhiều friction nhất — thêm bất tiện trước khi mở — gần với việc tắt hẳn tài khoản ([Allcott 2020](#r-allcott2020)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Một ứng dụng chèn thêm một bước chờ trước khi mở mạng xã hội, kèm lựa chọn "thôi" dễ bấm, làm 36% lần định mở bị bỏ và tổng số lần mở giảm 57%; đáng chú ý là một thông điệp "hãy suy nghĩ lại" đơn thuần thì *không* có tác dụng ([Grüning 2023](#r-gruning2023)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — nghiên cứu này không có nhóm đối chứng ngẫu nhiên, và một đồng tác giả là người tạo ra ứng dụng. Chuyển màn hình sang grayscale giảm 37,9 phút mỗi ngày nhưng **không** giảm thời gian xem video ([Holte & Ferraro 2023](#r-holte2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, nên gần như vô dụng với short video. Và dùng điện thoại sau khi tắt đèn đi ngủ đi kèm giấc ngủ kém và mệt mỏi hôm sau ([Exelmans 2016](#r-exelmans2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — lý do để điện thoại ở ngoài phòng ngủ.

<h3 id="boredom"><span class="num">7.5</span>Boredom là một tín hiệu</h3>

Theo mô hình MAC, boredom xuất hiện khi có lệch giữa yêu cầu của việc đang làm và nguồn lực chú ý mình đang có, hoặc lệch giữa việc đang làm và điều mình coi trọng ([Westgate & Wilson 2018](#r-westgate2018)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Sau một ngày làm việc dài, cả hai kiểu lệch đều có sẵn. Ngồi một mình với suy nghĩ 15 phút khó chịu đến mức 12 trên 18 nam và 6 trên 24 nữ tự cho mình bị giật điện thay vì chỉ ngồi yên ([Wilson 2014](#r-wilson2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Nhưng cầm điện thoại lên không sửa được tín hiệu đó — mệt và chán còn tăng sau khi dùng ([Dora 2021](#r-dora2021)). Hệ quả cho thiết kế: thứ thay thế feed lúc mệt phải vừa **ít đòi hỏi** (khớp với nguồn lực đang thấp), vừa **gắn với điều mình coi trọng** (khớp với giá trị).

Vài điều nghe nhiều nhưng không còn đúng: "dopamine detox" — không có thử nghiệm nào đo dopamine trước và sau một đợt "detox", dù phần hành vi (dùng ít đi) thì có bằng chứng; "dùng thụ động có hại, dùng chủ động thì tốt" — một nghiên cứu ủng hộ ([Verduyn 2015](#r-verduyn2015)) nhưng tổng quan 40 nghiên cứu phần lớn không ủng hộ ([Valkenburg 2022](#r-valkenburg2022)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>; "chỉ cần điện thoại nằm trên bàn là đầu óc bị hút năng lực" — một replication đăng ký trước đã thất bại ([Ruiz Pardo & Minda 2022](#r-ruizpardo2022)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>; và "kính chặn ánh sáng xanh chữa mất ngủ" — Cochrane đánh giá bằng chứng ở mức chắc chắn rất thấp ([Singh 2023](#r-singh2023)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, vì điều quan trọng là độ sáng chứ không phải màu.

<h2 id="mood-and-shame"><span class="num">8</span>Cảm xúc, trì hoãn và thất bại lặp lại</h2>

<h3 id="not-laziness"><span class="num">8.1</span>Trì hoãn không phải do thiếu ý định</h3>

Trong meta-analysis lớn nhất về trì hoãn, người hay trì hoãn **có ý định làm việc như mọi người** — tương quan giữa ý định và trì hoãn gần bằng 0 (r = −,03) ([Steel 2007](#r-steel2007)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Cái khác là khoảng cách giữa ý định và hành động, và khoảng cách đó **càng lớn khi kế hoạch được đặt càng xa**. Biểu đồ dưới cho thấy những gì thực sự đi cùng trì hoãn:

```chart hbar
yếu tố,r
Conscientiousness,-0.62
Self-control,-0.58
Distractibility,0.45
Impulsiveness,0.41
Task aversiveness,0.40
Self-efficacy,-0.38
Organization,-0.36
Neuroticism,0.24
Ý định làm việc,-0.03
Perfectionism,-0.03
```

<p class="small muted">Tương quan với trì hoãn. Nguồn: Steel 2007, Psych Bull 133(1):65–94, bảng 2–5 bản preprint của tác giả. Đây là tương quan, không phải nhân quả.</p>

Hai thanh cuối, gần bằng 0, là tin tốt: trì hoãn không phải do thiếu ý muốn, cũng không phải do cầu toàn. Những thanh dài lại là những thứ mình có thể thay đổi: task aversiveness (mức độ khó chịu của việc), distractibility (mức dễ bị xao nhãng), và self-efficacy.

<h3 id="mood-repair"><span class="num">8.2</span>Thực chất là để sửa tâm trạng</h3>

Trì hoãn được mô tả tốt nhất như việc **ưu tiên mood repair ngắn hạn** — làm mình dễ chịu ngay — hơn mục tiêu dài hạn ([Sirois & Pychyl 2013](#r-sirois2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Thí nghiệm then chốt: khi những người đang buồn được cho tin rằng tâm trạng của họ đã bị "đóng băng" — làm gì cũng không thay đổi được — thì xu hướng trì hoãn vô bổ **biến mất** ([Tice 2001](#r-tice2001)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Người ta không trì hoãn vì lười; họ trì hoãn vì *kỳ vọng* việc đó sẽ làm mình dễ chịu hơn. Và cái giá phải trả về sau: sinh viên hay trì hoãn ít căng thẳng hơn vào đầu học kỳ, nhưng căng thẳng và ốm nhiều hơn vào cuối kỳ, điểm thấp hơn ([Tice & Baumeister 1997](#r-tice1997)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

```mermaid
flowchart LR
  T["Việc cần làm<br/>gợi cảm giác khó chịu"] -->|"① muốn hết khó chịu"| A["Né sang việc dễ chịu<br/>(feed, việc vặt)"]
  A -->|"② nhẹ nhõm ngay"| R["Nhẹ nhõm<br/>= phần thưởng"]
  R -->|"③ củng cố việc né"| T
  R -.->|"④ việc vẫn còn đó,<br/>giờ còn đáng sợ hơn"| T
```

Đây cũng là lý do một mục tiêu theo đuổi nhiều năm mà chưa đạt càng lúc càng khó bắt đầu. Sau nhiều năm, mở sách không chỉ là mở sách — nó gợi lại "bao năm rồi mà vẫn vậy". Cảm giác đó làm task aversiveness tăng (r = ,40 với trì hoãn), và chính cảm giác khó chịu ấy là thứ feed hứa hẹn sẽ sửa. Vì vậy bước đầu tiên của một việc phải **tự nó dễ chịu** — nếu không, bạn đang yêu cầu bộ não chọn khó chịu thay vì dễ chịu, vào lúc nó mệt nhất.

<h3 id="repeated-failure"><span class="num">8.3</span>Coi thất bại là dữ liệu</h3>

Thất bại lặp lại hạ thấp self-efficacy, đặc biệt là những thất bại sớm; còn thất bại sau đó được vượt qua thì lại làm tăng sự bền bỉ ([Bandura 1977](#r-bandura1977)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Bản cập nhật năm 2016 của thuyết learned helplessness còn đảo lại cách hiểu cũ: thụ động là phản ứng **mặc định** của cơ thể trước điều tồi tệ kéo dài, còn điều được *học* là cảm giác kiểm soát ([Maier & Seligman 2016](#r-maier2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — bằng chứng chủ yếu từ động vật. Muốn thoát khỏi thụ động, con người cần những lần nhỏ cảm thấy "mình điều khiển được".

Khi không còn mệt, người ta có xu hướng giải thích hành vi hôm trước bằng tính cách và bỏ qua trạng thái mệt ([Nordgren 2006](#r-nordgren2006)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Mục tiêu kiểu "tất cả hoặc không có gì" làm một lần lỡ thành thất bại toàn bộ; mục tiêu có sẵn một khoản "dự phòng" (emergency reserves) giúp người ta giữ cam kết sau thất bại ([Sharif & Shu 2021](#r-sharif2021)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Mục tiêu dạng "muốn làm" đi kèm ít cảm giác bị cám dỗ hơn, còn mục tiêu dạng "phải làm" đi kèm cảm giác cám dỗ và trở ngại nhiều hơn ([Milyavskaya 2015](#r-milyavskaya2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; động lực xuất phát từ quan tâm thật của mình liên quan tới tiến bộ, động lực xuất phát từ áp lực thì không ([Koestner 2008](#r-koestner2008)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Sau một thất bại, đánh giá theo mục tiêu nhỏ — "tuần này làm được 3 trên 5 buổi" — giữ tâm trạng và kỳ vọng tốt hơn đánh giá theo mục tiêu lớn — "vẫn chưa giỏi tiếng Anh" ([Houser-Marko & Sheldon 2008](#r-housermarko2008)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Và điều nhiều người không tin: **self-compassion** — đối xử với chính mình như với một người bạn khi thất bại — làm *tăng* động lực sửa sai, không làm mình lười đi. Người được hướng dẫn tự trắc ẩn sau một bài kiểm tra thất bại đã dành nhiều thời gian ôn tập hơn ([Breines & Chen 2012](#r-breines2012)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; self-compassion tương quan r = −,31 với trì hoãn ([Sirois 2014](#r-sirois2014)); và sinh viên tự tha thứ cho việc trì hoãn trước kỳ thi đầu ít trì hoãn hơn trước kỳ thi sau ([Wohl 2010](#r-wohl2010)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Một cách thực hành đơn giản: khi một ngày bị mất, thay vì "mình lại thất bại", hãy ghi một dòng **giải thích bằng trạng thái** — "về 19:15, mệt 2/5, điện thoại trong tay, mở TikTok lúc 19:20". Câu đầu là một bản án. Câu sau là một bug report, và bug report thì sửa được: đổi cue, đổi giờ, đổi việc. Nếu trì hoãn nặng tới mức ảnh hưởng công việc hay sức khoẻ, liệu pháp nhận thức – hành vi (CBT) có bằng chứng từ thử nghiệm ngẫu nhiên, g = 0,55 ([Rozental 2018](#r-rozental2018)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

<h2 id="recovery"><span class="num">9</span>Hồi sức sau giờ làm</h2>

Recovery — hồi sức — là quá trình bù lại những hao mòn mà công việc gây ra, và chỉ xảy ra khi những gì đã phải dùng trong lúc làm việc được nghỉ ngơi. Thang đo chuẩn trong lĩnh vực này tách ra bốn trải nghiệm giúp hồi sức ([Sonnentag & Fritz 2007](#r-sonnentag2007)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>:

```mermaid
flowchart LR
  W["Hao mòn<br/>sau giờ làm"] --> D["Psychological detachment<br/>tâm trí rời công việc"]
  W --> R["Relaxation<br/>thả lỏng, ít kích thích"]
  W --> M["Mastery<br/>học/làm được điều mới"]
  W --> C["Control<br/>tự quyết thời gian của mình"]
  D -->|"① mạnh nhất với mệt thấp"| E["Sáng hôm sau<br/>còn năng lượng"]
  R --> E
  M --> E
  C -->|"② mạnh nhất với vigor"| E
```

1. **Psychological detachment** — tâm trí thật sự rời khỏi công việc — là trải nghiệm gắn mạnh nhất với mệt mỏi thấp: r = −0,42 qua 17 mẫu với 12.510 người ([Wendsche 2017](#r-wendsche2017)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Khối lượng công việc càng lớn thì càng khó detach ([Sonnentag & Fritz 2015](#r-sonnentag2015)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.
2. **Control** — cảm giác tự quyết định mình dùng thời gian thế nào — gắn mạnh nhất với vigor, cảm giác tràn đầy sinh lực ([Bennett 2018](#r-bennett2018)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

Feed cho một phần detachment, gần như không cho relaxation (feed kích thích liên tục), không cho mastery, và chỉ cho *cảm giác* control — thực tế thì thuật toán quyết định thay bạn. Ngược lại, **mastery** là một trải nghiệm giúp hồi sức chứ không phải một việc tiêu hao, với điều kiện nó khác việc ban ngày và có chút niềm vui: nội dung "có ý nghĩa" gắn với mastery, còn nội dung giải trí gắn với relaxation và detachment ([Rieger 2014](#r-rieger2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Một đoạn podcast tiếng Anh về chủ đề mình thích có thể vừa là detachment vừa là mastery; một bài ngữ pháp khô khốc sau một ngày dài thì không.

Giải trí cũng giúp hồi sức thật. Nhưng khi một người đang kiệt sức coi việc mình xem là "trì hoãn", **cảm giác tội lỗi triệt tiêu tác dụng hồi sức** ([Reinecke 2014](#r-reinecke2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Hệ quả rất cụ thể: nếu nghỉ, hãy *chọn* nghỉ — có giờ kết thúc, không tự trách. Một tập phim chọn trước, xem hết rồi tắt, giúp hồi sức tốt hơn một tiếng lướt feed vừa xem vừa áy náy.

Những hoạt động có bằng chứng giúp hồi sức: các hoạt động ít đòi hỏi, mang tính xã hội hoặc thể chất dự báo sức sống sáng hôm sau, còn việc nhà và việc công ty buổi tối thì không ([ten Brummelhuis & Bakker 2012](#r-tenbrummelhuis2012)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; đi bộ 10–15 phút làm tăng cảm giác tỉnh táo và cảm xúc tích cực ([Ekkekakis 2000](#r-ekkekakis2000)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; tập luyện đều đặn làm giảm mệt và tăng năng lượng qua 81 thử nghiệm ngẫu nhiên ([Wender 2022](#r-wender2022)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; những lần nghỉ ngắn trong giờ làm tăng sức sống và giảm mệt ([Albulescu 2022](#r-albulescu2022)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Ngược lại, dùng điện thoại cho công việc lúc khuya dẫn tới ngủ kém và sáng hôm sau cạn kiệt ([Lanaj 2014](#r-lanaj2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Một thói quen nhỏ giúp detach: trước khi rời chỗ làm, ghi hai dòng về việc đang dở và bước tiếp theo. Kế hoạch "ready-to-resume" như vậy làm giảm attention residue — phần chú ý còn mắc lại ở việc cũ ([Leroy & Glomb 2018](#r-leroy2018)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Và nếu được đi bộ đi làm, hãy coi đó là một tài sản: đi bộ đi kèm ít căng thẳng hơn, còn thời gian đi làm càng dài thì mức hài lòng với thời gian rảnh càng thấp ([Clark 2020](#r-clark2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Một giả thuyết đáng ghi nhận nhưng chưa có nghiên cứu trực tiếp: sau một ngày làm việc bị người khác điều khiển, người ta thèm được tự quyết, nên thức khuya để "giành lại" thời gian — hiện tượng mạng xã hội gọi là revenge bedtime procrastination <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Bằng chứng gần nhất là control gắn mạnh nhất với vigor ([Bennett 2018](#r-bennett2018)). Hệ quả thiết kế vẫn đứng được: cho mình cảm giác tự quyết **sớm** trong buổi tối, để không phải đòi nó lúc một giờ sáng.

<h2 id="sleep"><span class="num">10</span>Giấc ngủ</h2>

<h3 id="sleep-basics"><span class="num">10.1</span>Ngủ bao nhiêu, và cái giá của thiếu ngủ</h3>

Đồng thuận của các hiệp hội y học giấc ngủ Mỹ là người trưởng thành nên ngủ **7 tiếng trở lên** mỗi đêm, đều đặn ([Watson 2015](#r-watson2015)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Một chi tiết dễ bỏ sót: đó là thời gian *ngủ được*, không phải thời gian *nằm trên giường*. Nằm đúng 7 tiếng sẽ cho ít hơn 7 tiếng ngủ, nên khi thiết kế lịch, khoảng thời gian trên giường phải dài hơn 7 tiếng.

Thiếu ngủ nguy hiểm ở chỗ người ta không tự nhận ra mình đang thiếu. Trong thí nghiệm của Van Dongen, người chỉ được nằm giường 6 tiếng mỗi đêm trong 14 ngày bị suy giảm sự tỉnh táo và trí nhớ làm việc ngang với một đêm thức trắng, còn 4 tiếng thì ngang với hai đêm; cảm giác buồn ngủ của họ chỉ tăng ở mấy ngày đầu rồi gần như đứng yên, trong khi hiệu suất tiếp tục giảm ([Van Dongen 2003](#r-vandongen2003)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. "Mình thấy vẫn ổn" vì vậy không phải bằng chứng là mình ổn.

Giấc ngủ cũng là lúc việc học được hoàn tất. Ngủ sau khi học giúp nhớ từ mới, g = 0,50 qua 25 nghiên cứu ([Schimke 2021](#r-schimke2021)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; từ học lúc 20:00 được tích hợp vào vốn từ sau một đêm ngủ, còn từ học lúc 08:00 phải chờ 24 giờ ([Dumay & Gaskell 2007](#r-dumay2007)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Hai chất ảnh hưởng mạnh tới giấc ngủ: caffeine — một ly cà phê khoảng 107 mg nên cách giờ ngủ ít nhất 8,8 tiếng, và caffeine nói chung làm tổng thời gian ngủ giảm 45 phút ([Gardiner 2023](#r-gardiner2023)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; và rượu — kể cả liều thấp, tới 0,5 g mỗi kg cân nặng (với người 60 kg là khoảng 30 g, tức hơn hai lon bia 330 ml loại 5%), cũng làm rối giấc REM ([Gardiner 2025](#r-gardiner2025)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Về ánh sáng, đồng thuận chuyên gia khuyến nghị ánh sáng mờ từ ba tiếng trước giờ ngủ, ban ngày đủ sáng, và phòng ngủ thật tối ([Brown 2022](#r-brown2022)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

<h3 id="sleep-regularity"><span class="num">10.2</span>Đều đặn quan trọng như lượng ngủ</h3>

Sinh viên ngủ thất thường có đồng hồ sinh học muộn hơn khoảng hai tiếng rưỡi so với người ngủ đều: thời điểm melatonin bắt đầu tăng (DLMO) là 00:08 so với 21:32 ([Phillips 2017](#r-phillips2017)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Trên 60.977 người trong UK Biobank, nhóm ngủ đều đặn có nguy cơ tử vong thấp hơn 20%–48% so với nhóm thất thường nhất ([Windred 2024](#r-windred2024)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — một kết quả quan sát, trên người lớn tuổi. Social jetlag — chênh lệch giờ ngủ giữa ngày làm và ngày nghỉ, như thể mỗi cuối tuần bay sang một múi giờ khác — mạnh nhất ở người dưới 25 tuổi ([Wittmann 2006](#r-wittmann2006)), dù chính tác giả của khái niệm thừa nhận nó "có thể quá đơn giản" ([Roenneberg 2019](#r-roenneberg2019)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>.

Ngủ bù cuối tuần không bù được như người ta nghĩ: trong một thử nghiệm, người tham gia ngủ thêm khoảng 1,1 tiếng vào cuối tuần nhưng vẫn bị rối loạn chuyển hoá, và đồng hồ sinh học bị đẩy muộn ([Depner 2019](#r-depner2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — dù một nghiên cứu cohort lớn không thấy tăng tử vong ở kiểu "ngủ ngắn trong tuần, dài cuối tuần" ([Åkerstedt 2019](#r-akerstedt2019)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Dậy muộn ba tiếng liên tục hai tuần làm đồng hồ lùi 2,4 tiếng ([Burgess & Eastman 2006](#r-burgess2006)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Bài học chung: **giờ thức dậy là điểm cố định giữ nhịp** cả tuần.

<h3 id="sleep-shift"><span class="num">10.3</span>Dời giấc ngủ sớm hơn</h3>

```mermaid
flowchart LR
  W["① Giờ thức cố định<br/>cả 7 ngày"] -->|"quyết định lúc nào<br/>ánh sáng sáng tới mắt"| L1
  L1["② Ánh sáng buổi sáng<br/>(sau điểm nhiệt độ<br/>cơ thể thấp nhất)"] -->|"kéo đồng hồ SỚM hơn"| C(("Đồng hồ<br/>sinh học"))
  L2["③ Ánh sáng buổi tối,<br/>màn hình sáng"] -->|"đẩy đồng hồ MUỘN hơn"| C
```

1. **Giờ thức cố định** là điểm bắt đầu, vì nó quyết định lúc nào ánh sáng buổi sáng tới mắt.
2. **Ánh sáng là yếu tố điều chỉnh chính.** Ánh sáng sau điểm nhiệt độ cơ thể thấp nhất (tức buổi sáng) kéo đồng hồ sớm hơn ([Khalsa 2003](#r-khalsa2003)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; một tiếng ánh sáng mạnh đã cho khoảng 40% tác dụng của 6,7 tiếng ([St Hilaire 2012](#r-sthilaire2012)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.
3. **Ánh sáng buổi tối** đẩy đồng hồ theo hướng ngược lại — vì vậy đèn mờ buổi tối không phải chuyện thẩm mỹ.

Đồng hồ không dời nhanh được. Dời giấc ngủ một tiếng mỗi ngày trong ba ngày: dưới ánh sáng mờ đồng hồ chỉ dịch 0,6 tiếng, dưới ánh sáng mạnh liên tục dịch 2,1 tiếng ([Burgess 2003](#r-burgess2003)); dời hai tiếng mỗi ngày thì quá nhanh, người tham gia khó ngủ ([Eastman 2005](#r-eastman2005)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Nhưng việc này làm được ngoài đời: những người "cú đêm" dời được khoảng hai tiếng trong ba tuần với một bộ quy tắc đơn giản — giờ thức cố định (lệch tối đa 15–30 phút) kể cả cuối tuần, ra ánh sáng ngoài trời buổi sáng, caffeine trước 15:00, ngủ trưa trước 16:00 ([Facer-Childs 2019](#r-facerchilds2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, dù mẫu nghiên cứu nhỏ.

Dậy sớm còn có một chi phí riêng: sleep inertia, trạng thái lờ đờ ngay sau khi thức. Nó tệ nhất trong 15–30 phút đầu ([Hilditch & McHill 2019](#r-hilditch2019)), thường không kéo dài quá 30 phút nếu không thiếu ngủ nặng ([Tassi & Muzet 2000](#r-tassi2000)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, và chưa có bằng chứng rõ cho mẹo nào — cà phê, tắm — xoá được nó. Vì vậy nửa tiếng đầu của một buổi học sáng sớm nên dành cho việc nhẹ. Nếu thiếu ngủ, một giấc ngủ trưa ngắn tốt hơn ngủ nướng: trong một thí nghiệm, ngủ trưa 10 phút cho hiệu quả tốt nhất, còn 30 phút gây lờ đờ trước khi có lợi ([Brooks & Lack 2006](#r-brooks2006)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Còn "sleep hygiene" thì sao? Tổng quan cho thấy tác dụng trực tiếp của từng thành phần trên dân số chung phần lớn chưa được kiểm định ([Irish 2015](#r-irish2015)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Những phần có bằng chứng riêng là ánh sáng, caffeine, rượu, giờ thức cố định, và điện thoại trên giường. Những lời khuyên như "uống sữa ấm" không nằm trong danh sách đó.

<div class="recall">

**Câu hỏi nhớ lại — Phần I (chương 2–10).** Trả lời trong đầu trước, rồi mới mở đáp án.

<details><summary>Vì sao "cố gắng hơn" lúc tối thường thất bại, và nên làm gì thay thế?</summary><div class="inner">

Vì chi phí nỗ lực tăng dần trong ngày và lựa chọn buổi tối nghiêng về thưởng ngay (chương 4); kế hoạch được viết lúc "cold" nên đánh giá thấp trạng thái "hot" (chương 3). Thay vào đó: làm cho việc bắt đầu bớt tốn sức (việc nhỏ, chuẩn bị sẵn) và đổi tình huống từ sớm (chương 5).

</div></details>

<details><summary>Người có self-control tốt khác người khác ở điểm nào?</summary><div class="inner">

Họ gặp ít cám dỗ hơn, ít phải cưỡng lại hơn, và dựa nhiều vào habit (Hofmann 2012; Milyavskaya & Inzlicht 2017; de Ridder 2012; Galla & Duckworth 2015).

</div></details>

<details><summary>Lỡ một ngày có làm hỏng việc hình thành habit không? Can thiệp nào mạnh nhất trong megastudy?</summary><div class="inner">

Không — lỡ một lần không ảnh hưởng đáng kể (Lally 2010). Trong megastudy 54 chương trình, cách hiệu quả nhất là thưởng nhỏ cho việc quay lại sau một buổi bị lỡ (Milkman 2021).

</div></details>

<details><summary>Dopamine mã hoá điều gì, và vì sao điều đó giải thích việc lướt mà không vui?</summary><div class="inner">

Dopamine mã hoá reward prediction error và wanting, không phải liking. Feed liên tục tạo dự đoán không chắc chắn nên liên tục tạo wanting, dù từng video chỉ hơi hay.

</div></details>

<details><summary>Trì hoãn thực chất là để làm gì?</summary><div class="inner">

Để sửa tâm trạng ngay (mood repair). Khi tin rằng tâm trạng không đổi được, trì hoãn vô bổ biến mất (Tice 2001).

</div></details>

<details><summary>Vì sao ngủ bù cuối tuần không phải giải pháp, và điểm cố định giữ nhịp giấc ngủ là gì?</summary><div class="inner">

Ngủ bù không ngăn được rối loạn chuyển hoá và đẩy đồng hồ sinh học muộn (Depner 2019). Điểm cố định là giờ thức dậy cả 7 ngày, vì nó quyết định lúc nào ánh sáng buổi sáng tới mắt.

</div></details>

</div>


<h2 id="part-2" class="part">Phần II — Những nền móng</h2>

<h2 id="people"><span class="num">11</span>Những người thân yêu</h2>

Khi lập kế hoạch tự cải thiện, người ta rất dễ chỉ dành cho người yêu, bạn bè, gia đình phần thời gian còn dư. Bằng chứng cho thấy điều ngược lại: quan hệ là một trong những yếu tố gắn chặt nhất với sức khoẻ và với chất lượng từng ngày — và quan hệ **cần thời gian đều đặn**, không thể chỉ sống nhờ thời gian thừa.

<h3 id="people-health"><span class="num">11.1</span>Quan hệ và sức khoẻ</h3>

Một meta-analysis gồm 148 nghiên cứu với 308.849 người cho thấy người có quan hệ xã hội mạnh có khả năng sống sót cao hơn rõ rệt (OR = 1,50); khi quan hệ được đo bằng các thước đo tổng hợp nhiều mặt — tình trạng hôn nhân, quy mô mạng lưới, mức tham gia nhóm — con số là OR = 1,91 ([Holt-Lunstad 2010](#r-holtlunstad2010)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Các tác giả đặt mức này ngang với những yếu tố nguy cơ quen thuộc như hút thuốc và uống rượu. Một tổng hợp khác cho thấy cô lập xã hội, cô đơn và sống một mình đều đi kèm nguy cơ tử vong cao hơn, và mối liên hệ mạnh hơn ở những mẫu có tuổi trung bình dưới 65 ([Holt-Lunstad 2015](#r-holtlunstad2015)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Cần hiểu cho đúng: đây là dữ liệu quan sát, và chính các tác giả viết rằng quan hệ nhân quả "không dễ xác lập". Nghiên cứu Harvard nổi tiếng về đời người cũng là quan sát, theo dõi 237 sinh viên và 332 thanh niên nội thành từ thập niên 1930 ([Vaillant & Mukamal 2001](#r-vaillant2001)); ở các cặp vợ chồng tuổi 80 trong nghiên cứu đó, những ngày có nhiều thời gian bên người khác đi kèm cảm giác hạnh phúc hơn, và sự hài lòng trong hôn nhân làm dịu tác động của những ngày sức khoẻ kém ([Waldinger & Schulz 2010](#r-waldinger2010)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

<h3 id="people-daily"><span class="num">11.2</span>Trong từng ngày</h3>

Khi 909 phụ nữ đi làm được yêu cầu kể lại ngày hôm trước và chấm cảm xúc tích cực cho từng hoạt động, kết quả xếp hạng rất rõ:

```chart hbar
hoạt động,cảm xúc tích cực (0–6)
Intimate relations,5.10
Socializing,4.59
Relaxing,4.42
Working,3.62
Commuting,3.45
```

<p class="small muted">5 trong 16 hoạt động. Nguồn: Kahneman et al. 2004, Science 306:1776–1780, Day Reconstruction Method. Theo người cùng hoạt động: bạn bè 4,36, họ hàng 4,17, vợ/chồng/người yêu 4,11, sếp 3,52. Một mẫu thuận tiện, chỉ gồm phụ nữ.</p>

Làm việc — phần chiếm nhiều giờ nhất trong ngày (6,9 giờ) — và đi lại (1,6 giờ) nằm ở cuối bảng ([Kahneman 2004](#r-kahneman2004)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Những giờ dễ chịu nhất thường **nằm ngoài giờ làm, và ở cùng người khác**. Một kế hoạch tự học chiếm hết những giờ đó là đem giờ tốt nhất đổi lấy giờ bình thường.

<h3 id="people-partner"><span class="num">11.3</span>Quan hệ tình cảm</h3>

```mermaid
flowchart LR
  S["Stress từ công việc<br/>hoặc kế hoạch quá tải"] -->|"① tâm trạng xấu"| M["Ít kiên nhẫn,<br/>ít chú ý"]
  M -->|"② cùng tối đó"| B["Giận, thu mình<br/>với người yêu"]
  S -->|"③ lấy mất thời gian<br/>và sự chú ý"| T["Ít việc nuôi<br/>sự gần gũi"]
  B --> Q["Chất lượng<br/>quan hệ giảm"]
  T --> Q
```

1. **Stress từ bên ngoài ảnh hưởng tới chuyện hai người.** Tổng quan 115 nghiên cứu dọc về hôn nhân cho thấy stress dự báo hôn nhân kém hài lòng và kém bền hơn theo thời gian, và đề xuất rằng stress tác động qua chính cách hai người đối xử với nhau — mô hình vulnerability–stress–adaptation ([Karney & Bradbury 1995](#r-karney1995)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; stress lấy đi thời gian và sự chú ý khỏi những việc nuôi sự gần gũi ([Neff & Karney 2009](#r-neff2009); [Neff & Karney 2017](#r-neff2017)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Một kế hoạch học quá tải cũng là một nguồn stress như vậy — có thể làm hại quan hệ dù lịch trông vẫn còn trống <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.
2. **Bực bội ở công ty dễ bị mang về nhà ngay tối đó.** Theo dõi nhật ký 43 cặp vợ chồng: những ngày có tương tác tiêu cực ở chỗ làm, cả hai đều giận dữ và thu mình hơn với nhau, một phần qua trung gian là tâm trạng xấu ([Story & Repetti 2006](#r-story2006)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Vì vậy nên có một khoảng đệm ngắn sau giờ làm trước khi nói chuyện quan trọng.
3. **Thời gian bị lấy mất.** Cùng cơ chế ở mũi tên ③ — và đây là lý do người thân yêu cần khung thời gian cố định (chương 17).

Có ba điều giữ cho quan hệ tốt mà gần như không tốn thêm giờ. Thứ nhất, **cách đáp lại tin vui quan trọng hơn cách đáp lại tin buồn**: active-constructive responding — chú tâm, hỏi thêm, vui cùng khi người kia kể chuyện tốt — dự báo chất lượng quan hệ và khả năng chia tay sau hai tháng rõ hơn cách người ta phản ứng với tin xấu ([Gable 2004](#r-gable2004); [Gable 2006](#r-gable2006)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Thứ hai, **cất điện thoại khi ở cạnh nhau**: phubbing — dùng điện thoại khi đang ở cạnh người kia — đi kèm mức hài lòng thấp hơn và xung đột cao hơn qua 52 nghiên cứu với 19.698 người ([Ni 2025](#r-ni2025); [Roberts & David 2016](#r-roberts2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, dù phần lớn là dữ liệu cắt ngang. Thứ ba, **làm điều mới lạ cùng nhau**: bảy phút làm một việc mới lạ trong phòng thí nghiệm đã tăng chất lượng quan hệ ([Aron 2000](#r-aron2000)), và một thử nghiệm với 101 cặp đôi dành 90 phút mỗi tuần cho hoạt động mới lạ trong bốn tuần cho kết quả tương tự ([Coulter & Malouff 2013](#r-coulter2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — dù chưa có replication độc lập. Thêm một điều: khả năng gác công việc lại khi về nhà của hai người gắn với nhau ([Hahn & Dormann 2013](#r-hahn2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, nên đó là thói quen của cả hai chứ không của riêng ai.

Vài điều phổ biến về tình yêu không còn đúng. "Tỷ lệ 5 tương tác tích cực trên 1 tiêu cực dự đoán ly hôn với độ chính xác trên 90%" đến từ một mẫu 73 cặp; khi kiểm tra chéo, độ chính xác giảm mạnh ([Heyman & Slep 2001](#r-heyman2001)), và các phát hiện chính không lặp lại được ([Kim, Capaldi & Crosby 2007](#r-kim2007)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. "Tỷ lệ tích cực 2,9013 là ngưỡng hưng thịnh" đã bị bác bỏ về mặt toán học ([Brown, Sokal & Friedman 2013](#r-brown2013)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Và thời gian với người yêu không *tự động* là thời gian vui nhất — trong dữ liệu ở trên, bạn đời đứng sau bạn bè; *làm gì cùng nhau* mới là điều quyết định.

<h3 id="people-friends"><span class="num">11.4</span>Bạn bè, gia đình, và việc chăm sóc người khác</h3>

Số giờ ở cùng nhau dự báo độ thân của một tình bạn, và thời gian **giải trí** cùng nhau dự báo mạnh hơn thời gian làm việc cùng nhau ([Hall 2019](#r-hall2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. (Các con số kiểu "bao nhiêu giờ để thành bạn thân" lan truyền trên báo chí không khớp nhau nên ở đây không dùng.) Tình bạn **phai nhanh hơn quan hệ họ hàng** khi liên lạc và hoạt động chung giảm đi ([Roberts & Dunbar 2011](#r-roberts2011)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>: gia đình vẫn bền khi lâu không gặp, còn bạn bè thì cần liên lạc đều. Con số "150 người" của Dunbar như một giới hạn cứng cũng không vững — phân tích lại cho khoảng tin cậy từ 4 tới 520, và các tác giả kết luận chỉ ra một con số cụ thể là vô ích ([Lindenfors 2021](#r-lindenfors2021)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>.

Chăm sóc người khác cũng là chăm sóc chính mình, ở mức vừa phải. Hành vi giúp đỡ tương quan với well-being r = 0,13 qua 201 nghiên cứu với 198.213 người, và **giúp trực tiếp, không qua tổ chức** (informal helping) gắn với lợi ích nhiều hơn giúp qua tổ chức ([Hui 2020](#r-hui2020)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Những hành động tử tế làm tăng well-being của chính người làm, δ = 0,28, dù các nghiên cứu còn nhỏ và chỉ đo tác dụng ngắn hạn ([Curry 2018](#r-curry2018)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Tiêu tiền cho người khác có làm mình vui hơn không? Replication đăng ký trước cho kết quả lẫn lộn: một thí nghiệm lặp lại được, một không, một có nhưng nhỏ ([Aknin 2020](#r-aknin2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Và một kết quả lạ nhưng đáng nhớ: **cho đi thời gian làm người ta cảm thấy mình có nhiều thời gian hơn** — hơn cả việc dùng thời gian đó cho bản thân, hay được tặng thêm giờ rảnh ([Mogilner 2012](#r-mogilner2012)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

<h3 id="people-leisure"><span class="num">11.5</span>Thời gian rảnh</h3>

Thời gian rảnh giúp con người sống tốt hơn qua năm cơ chế, gọi tắt là DRAMMA: detachment-recovery, autonomy, mastery, meaning và affiliation ([Newman, Tay & Diener 2014](#r-newman2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Nhưng nhiều hơn không phải lúc nào cũng tốt hơn: quan hệ giữa lượng thời gian rảnh và well-being có hình chữ U ngược — quá ít hay quá nhiều đều kém, và mặt trái của quá nhiều giảm đi khi một phần thời gian được dùng cho việc có ích ([Sharif, Mogilner & Hershfield 2021](#r-sharif2021b)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cảm giác dư dả thời gian (time affluence) gắn với well-being, độc lập với mức giàu vật chất ([Kasser & Sheldon 2009](#r-kasser2009)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, và bỏ tiền thuê người làm việc vặt để có thêm thời gian làm tăng cảm xúc tích cực ([Whillans 2017](#r-whillans2017)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Xung đột giữa công việc và gia đình, theo cả hai chiều, đều đi kèm kết quả xấu ở cả công việc, gia đình lẫn sức khoẻ ([Amstad 2011](#r-amstad2011)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

Có một phát hiện đặc biệt quan trọng cho người thích lập kế hoạch: **đặt giờ chính xác cho giải trí làm nó giống công việc hơn và ít vui hơn**; lên lịch "thô" — biết là chiều Chủ nhật sẽ đi chơi, nhưng không định trước giờ — xoá được hiệu ứng này ([Tonietto & Malkoc 2016](#r-tonietto2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Một khoảng rảnh kết thúc bằng một việc phải làm cũng *cảm thấy* ngắn hơn ([Tonietto, Malkoc & Nowlis 2019](#r-tonietto2019)).

<div class="callout why"><div class="ct">Ý chính của chương</div>

Người thân yêu cần **khung giờ cố định** trong tuần, vì mục tiêu không có phần thưởng rõ ràng sẽ luôn nhường thời gian cho mục tiêu có deadline. Nhưng **nội dung** của khung đó nên để thô. Những cách quan tâm dễ nhất lại không tốn giờ: cất điện thoại, chú tâm khi người kia kể chuyện vui, một tin nhắn hỏi thăm. Và đừng lấp kín mọi khoảng trống bằng mục tiêu.

</div>

<h2 id="body-money"><span class="num">12</span>Cơ thể và tiền bạc</h2>

Cơ thể và tiền có chung một cấu trúc: lợi ích đến **rất chậm và vô hình**, còn chi phí đến **ngay lập tức**. Theo phương trình ở chương 3, đây là loại mục tiêu có D lớn nhất, nên ý chí gần như luôn thua. Giải pháp chung cho cả hai là **đưa quyết định ra khỏi khoảnh khắc**: cài sẵn một default, thu nhỏ việc tới mức gần như không thể thất bại, và tính theo tổng tuần thay vì từng ngày hoàn hảo.

<h3 id="body"><span class="num">12.1</span>Vận động</h3>

Hướng dẫn của WHO năm 2020 cho người trưởng thành là "at least 150–300 min of moderate-intensity aerobic physical activity, or at least 75–150 min of vigorous-intensity … throughout the week", cùng với "muscle-strengthening activities at moderate or greater intensity that involve all major muscle groups on 2 or more days a week" ([Bull 2020](#r-bull2020)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Hai điểm trong hướng dẫn này đặc biệt có ích cho người bận rộn: **mọi đợt vận động đều được tính, dài bao nhiêu cũng được** — yêu cầu tối thiểu 10 phút mỗi đợt trước đây đã bị bỏ — và "some physical activity is better than none". Thay thời gian ngồi bằng vận động cường độ bất kỳ, kể cả nhẹ, cũng có lợi.

Các nghiên cứu về liều lượng cho cùng một hình dạng: lợi ích tăng nhanh ở đoạn đầu rồi chững lại. Nguy cơ tử vong giảm dần tới khoảng 8.000–10.000 bước mỗi ngày ở người dưới 60 tuổi, rồi đi ngang ([Paluch 2022](#r-paluch2022)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; khi đã tính số bước, cường độ bước không còn tạo khác biệt ([Saint-Maurice 2020](#r-saintmaurice2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Tập sức mạnh gắn với nguy cơ thấp hơn 10–17%, và lợi ích lớn nhất nằm quanh 30–60 phút mỗi tuần ([Momma 2022](#r-momma2022)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — hai buổi ngắn mỗi tuần đã ở vùng đó. Vài đợt vận động mạnh rất ngắn xen trong ngày — khoảng ba lần mỗi ngày, mỗi lần một đến hai phút, như leo cầu thang nhanh — gắn với nguy cơ tử vong thấp hơn rõ rệt ở người không tập thể dục ([Stamatakis 2022](#r-stamatakis2022)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; leo 60 bậc thang ba lần mỗi ngày, ba ngày mỗi tuần trong sáu tuần làm tăng sức bền tim phổi, dù mức tăng khiêm tốn ([Jenkins 2019](#r-jenkins2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Dồn vận động vào cuối tuần cũng cho lợi ích gần bằng tập đều ([O'Donovan 2017](#r-odonovan2017)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Vận động còn giúp thật cho tâm trạng: tổng hợp 97 bài tổng quan với 1.039 thử nghiệm cho thấy vận động giảm triệu chứng trầm cảm và lo âu, dù phần lớn các bài tổng quan có chất lượng thấp ([Singh 2023](#r-singh2023b)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; với người được chẩn đoán trầm cảm (major depressive disorder), đi bộ hoặc chạy, yoga và tập sức mạnh đều có tác dụng, dù độ tin cậy của bằng chứng còn thấp ([Noetel 2024](#r-noetel2024)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Đang điều trị thì bàn với bác sĩ, đừng tự bỏ thuốc. Ngồi lâu cũng có cách khắc phục đơn giản: ngắt quãng việc ngồi cải thiện đường huyết và insulin trong các thử nghiệm ngắn hạn ([Loh 2020](#r-loh2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Điều gì giúp người ta tập lâu dài? Sự thích thú tương quan r = 0,42 với mức vận động ([Rhodes 2009](#r-rhodes2009)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, tập cùng người khác có tác dụng nhỏ đến vừa ([Carron 1996](#r-carron1996)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, và sự đều đặn, đơn giản dự báo habit ([Kaushal & Rhodes 2015](#r-kaushal2015)). Vì thế tập cùng người yêu hay bạn bè là một công đôi việc: vừa vận động, vừa vun đắp quan hệ.

<h3 id="money"><span class="num">12.2</span>Tiền bạc</h3>

Phần lớn con người tiết kiệm một cách thụ động: trong 41 triệu quan sát ở Đan Mạch, 85% là "passive savers" — không phản ứng với ưu đãi thuế, nhưng bị chi phối mạnh bởi khoản đóng góp tự động được cài sẵn cho họ ([Chetty 2014](#r-chetty2014)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Thí nghiệm tự nhiên nổi tiếng nhất về default cho thấy rõ điều đó:

```chart bar
nhóm nhân viên mới,% tham gia quỹ hưu trí
Phải tự đăng ký,37
Được đăng ký sẵn (default),86
```

<p class="small muted">Nguồn: Madrian & Shea 2001, QJE; số liệu trong bản working paper của NBER. 76% người được đăng ký sẵn ở lại đúng mức đóng mặc định 3%.</p>

Khi việc tham gia là mặc định, tỷ lệ tham gia tăng từ 37% lên 86% — nhưng 76% ở lại đúng mức đóng mặc định 3% ([Madrian & Shea 2001](#r-madrian2001)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Default vừa là mức sàn vừa là mức trần: nó quyết định bạn có tiết kiệm không, và cũng quyết định bạn tiết kiệm bao nhiêu. Vì vậy mức tự động phải được chọn có chủ đích.

```mermaid
flowchart LR
  P["Ngày nhận lương"] -->|"① tự động, không cần quyết định"| S["Tài khoản riêng<br/>có tên mục đích"]
  P --> A["Tài khoản tiêu dùng"]
  A -->|"② chỉ tiêu phần còn lại"| X["Chi tiêu tháng"]
  R["Lần tăng lương sau"] -->|"③ cam kết từ bây giờ:<br/>một phần vào tiết kiệm"| S
```

1. **Chuyển tự động ngày nhận lương** sang một tài khoản riêng: không cần quyết định lại mỗi tháng.
2. **Tách và đặt tên tài khoản** — "Quỹ dự phòng", "Học tập" — làm tiền khó tiêu hơn: chia tiền vào hai tài khoản làm tăng tiết kiệm ([Soman & Cheema 2011](#r-soman2011); [Thaler 1999](#r-thaler1999)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Một tài khoản có khoá, khó rút, còn mạnh hơn: trong một thử nghiệm ngẫu nhiên, số dư tăng 81 điểm phần trăm so với nhóm đối chứng sau 12 tháng ([Ashraf, Karlan & Yin 2006](#r-ashraf2006)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.
3. **Cam kết trước cho lần tăng lương sau**: chương trình Save More Tomorrow đưa tỷ lệ tiết kiệm từ 3,5% lên 13,6% sau 40 tháng ([Thaler & Benartzi 2004](#r-thaler2004)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Một quỹ dự phòng rút được ngay không chỉ để phòng thân: lượng tiền sẵn có trong tài khoản gắn với cảm giác ổn định tài chính, và qua đó với mức hài lòng cuộc sống, độc lập với thu nhập ([Ruberton 2016](#r-ruberton2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Về sự nghiệp, bằng chứng mỏng hơn nhiều người nghĩ. Job crafting — chủ động thay đổi nhiệm vụ, quan hệ và cách nhìn về công việc của mình ([Wrzesniewski & Dutton 2001](#r-wrzesniewski2001)) — cho hiệu ứng nhỏ trong các can thiệp ([Oprea 2019](#r-oprea2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Deliberate practice giải thích 26% khác biệt thành tích trong các trò chơi như cờ, 21% trong âm nhạc, 18% trong thể thao, 4% trong giáo dục và dưới 1% trong các nghề nghiệp ([Macnamara 2014](#r-macnamara2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; năm 2018 bài này có một bản đính chính mà cuốn sách chưa đọc được. Quy tắc "70% học qua công việc" cũng có cơ sở yếu ([Clardy 2018](#r-clardy2018)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Không có công thức sự nghiệp nào được chứng minh; điều áp dụng được là phần chung của cuốn sách — chọn mục tiêu học có chủ đích, đo, review, và chủ động định hình công việc của mình.

<h2 id="learning"><span class="num">13</span>Học</h2>

<h3 id="retrieval"><span class="num">13.1</span>Nhớ lâu nhờ tự nhớ lại</h3>

Có lẽ đây là thí nghiệm quan trọng nhất của khoa học về học tập. Sinh viên học một đoạn văn theo ba cách, rồi được kiểm tra sau một tuần:

```chart bar
cách học,% nhớ được sau 1 tuần
Đọc 4 lần,40
Đọc 3 lần + tự kiểm tra 1 lần,56
Đọc 1 lần + tự kiểm tra 3 lần,61
```

<p class="small muted">Nguồn: Roediger & Karpicke 2006, Psych Sci 17(3):249–255, thí nghiệm 2. "Tự kiểm tra" = tự nhớ lại mà không nhìn tài liệu.</p>

Nhóm đọc bốn lần đã đọc đoạn văn trung bình 14,2 lần, nhóm tự kiểm tra chỉ 3,4 lần — vậy mà nhóm đọc nhớ **ít nhất**, và lại **tự tin nhất** ([Roediger & Karpicke 2006](#r-roediger2006)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Cảm giác "trôi chảy" khi đọc lại là một tín hiệu sai về việc mình đã học được bao nhiêu. Tổng hợp các nghiên cứu xác nhận: retrieval practice — tự kiểm tra, flashcard trả lời trước khi lật — có hiệu quả cao, g = 0,51 so với đọc lại ([Dunlosky 2013](#r-dunlosky2013); [Adesope 2017](#r-adesope2017)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; còn đọc lại, highlight và tóm tắt có hiệu quả thấp ([Dunlosky 2013](#r-dunlosky2013)).

Kỹ thuật mạnh thứ hai là **giãn cách**:

```chart bar
cách phân bổ,% nhớ được
Dồn một lần (massed),36.7
Chia nhiều lần (spaced),47.3
```

<p class="small muted">Nguồn: Cepeda et al. 2006, Psych Bull 132(3):354–380, trung bình qua 271 so sánh.</p>

Cùng một lượng thời gian, chia ra nhiều lần cách quãng cho kết quả tốt hơn dồn một lần ([Cepeda 2006](#r-cepeda2006)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>, và hiệu ứng này ở mức vừa đến lớn trong học ngoại ngữ ([Kim & Webb 2022](#r-kim2022)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Khoảng cách tối ưu tuỳ thuộc vào việc bạn cần nhớ bao lâu: khoảng 20–40% thời gian cần nhớ nếu cần nhớ một tuần, và 5–10% nếu cần nhớ một năm ([Cepeda 2008](#r-cepeda2008)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Ba kỹ thuật khác cũng có bằng chứng tốt: tự giải thích vì sao (self-explanation, g = ,55; [Bisra 2018](#r-bisra2018)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>, tự tạo ra câu trả lời thay vì đọc nó (generation effect; [Bertsch 2007](#r-bertsch2007)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>, và trộn lẫn các dạng bài (interleaving, g = 0,42) — trừ khi học từ vựng, khi đó học từng nhóm một lại tốt hơn ([Brunmair & Richter 2019](#r-brunmair2019)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Về độ dài buổi học, bằng chứng chia hai: để giữ kiến thức cụ thể thì buổi ngắn đều đặn tốt hơn ([Baddeley & Longman 1978](#r-baddeley1978)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, nhưng với trình độ tổng thể trong một khoá học, dồn giờ có thể tốt hơn ([Serrano & Muñoz 2007](#r-serrano2007)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>.

<h3 id="english"><span class="num">13.2</span>Tiếng Anh: người trưởng thành học thế nào</h3>

Tuổi không phải là rào cản. Người lớn thực ra tiến bộ **nhanh nhất ở giai đoạn đầu** khi học một ngôn ngữ mới ([Snow & Hoefnagel-Höhle 1978](#r-snow1978)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Nghiên cứu nổi tiếng về "mốc 17,4 tuổi" với 669.498 người nói về khả năng đạt **ngữ pháp như người bản xứ**, không phải khả năng sử dụng thành thạo ([Hartshorne 2018](#r-hartshorne2018)), và chính mốc đó đang bị phản biện qua những lần phân tích lại ([van der Slik 2022](#r-vanderslik2022)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Không nghiên cứu nào nói một người 26 tuổi không thể đạt trình độ làm việc.

Thứ người lớn cần là **lượng input lớn ở mức hiểu được phần lớn**. Để hiểu 98% từ trong một văn bản, cần khoảng 8.000–9.000 word family với văn viết và 6.000–7.000 với văn nói ([Nation 2006](#r-nation2006)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; nhưng "ngưỡng 98%" không lặp lại được — mức hiểu tăng gần như tuyến tính theo tỷ lệ từ mình biết ([Kremmel 2023](#r-kremmel2023)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Nghĩa là không có vạch "đủ rồi mới bắt đầu được"; mỗi từ thêm vào đều giúp. Extensive reading có tác dụng, mạnh nhất ở người lớn ([Jeon & Day 2016](#r-jeon2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, và vừa đọc vừa nghe cho tiến bộ nghe ổn định nhất ([Chang & Millett 2014](#r-chang2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Nhưng input là cần mà chưa đủ: dạy tường minh và corrective feedback — được sửa lỗi — có tác dụng đo được và bền ([Norris & Ortega 2000](#r-norris2000); [Li 2010](#r-li2010)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Nói và viết cần **output kèm feedback**; đọc nhiều không tự kéo chúng lên.

Riêng với người Việt có một điểm đáng chú ý. Những đuôi gần như không thêm nghĩa — -s số nhiều, -s ngôi thứ ba, -ed — cần được *chú ý có chủ đích* thì mới vào được ([Schmidt 1990](#r-schmidt1990)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>, vì tiếng Việt không đánh dấu chúng. Trong lời nói tự nhiên, người Việt trưởng thành bỏ -s sau phụ âm 50,7% số lần ([Disney & Le 2024](#r-disney2024)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Chép những lỗi được sửa thành thẻ ôn là cách biến feedback thành retrieval practice.
