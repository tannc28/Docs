# Nền tảng vận hành cuộc sống

Buổi tối, bạn đi làm về tới nhà. Sáng nay bạn đã tự hứa tối sẽ học một tiếng. Bạn ngồi xuống ghế, mở điện thoại "xem một chút", và khi ngẩng lên thì đồng hồ đã gần nửa đêm. Cuốn sách này bắt đầu từ đúng khoảnh khắc ấy rồi đào xuống tận gốc. Vì sao kế hoạch viết lúc tỉnh táo cứ thua lúc mệt? Điều gì thật sự giúp mình hồi sức? Làm sao theo đuổi nhiều mục tiêu suốt nhiều năm mà không kiệt sức? Phần lớn nội dung là nền tảng chung, đúng với bất kỳ ai, ở bất kỳ giai đoạn nào. Cuộc sống hiện tại của bạn chỉ xuất hiện ở gần cuối, như một ví dụ áp dụng: lịch sống rồi sẽ đổi, còn nguyên lý thì vẫn vậy.

<p class="legend">Chấm màu nhỏ sau một câu là đường dẫn tới nguồn — bấm vào để xem: <span class="ev ev-high" title="Bằng chứng mạnh"></span> chắc chắn (nhiều nghiên cứu lớn hoặc hướng dẫn chính thức) · <span class="ev ev-mid" title="Bằng chứng vừa"></span> khá chắc (ít nghiên cứu hơn, hoặc chỉ là tương quan) · <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span> còn tranh cãi · <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span> suy luận hoặc lời khuyên của chính cuốn sách này. Mỗi chương có một ô "Tự kiểm tra" để bạn thấy cơ chế ấy trong tuần của chính mình. Cuối nhiều mục có một ô "Đọc thêm" gập lại, chứa con số chính xác và các nghiên cứu phụ; đọc lần đầu có thể bỏ qua.</p>

<h2 id="how-to-read"><span class="num">0</span>Cách đọc cuốn sách này</h2>

Nên đọc cuốn sách này thế nào? Lần đầu, hãy đọc từ đầu tới cuối, vì các phần sau dựng trên phần trước. Về sau, cứ coi sách như sổ tra cứu: gặp chuyện gì thì mở đúng chương giải thích chuyện ấy.

Hãy nghĩ tới một chiếc xe hay chết máy. Người thợ giỏi không thay bừa từng món phụ tùng; anh ấy mở máy ra xem, hiểu nó hoạt động ra sao rồi mới sửa. Cuốn sách đi đúng trình tự ấy, chia làm sáu phần.

Phần I là lúc **mở máy ra xem**: vì sao con người hành xử như vậy. Không hiểu cơ chế thì mọi lời khuyên chỉ là mẹo vặt, gặp hoàn cảnh mới là bó tay.

Phần II nói về những **nền móng** mà mục tiêu nào cũng dựa vào: người thân yêu, cơ thể, tiền bạc, cách học và cách tư duy. Phần III dùng tất cả những điều ấy để dựng một **hệ thống theo đuổi mục tiêu** dùng được cả đời: chọn mục tiêu, bám mục tiêu, đo tiến độ, và biết lúc nào nên buông.

Phần IV biến hệ thống ấy thành **cách xây một tuần**, làm lại mỗi khi cuộc sống thay đổi. Phần V thử cách ấy trên lịch hiện tại của bạn. Phần VI nói về **đo lường và tự kiểm chứng**: bạn không cần tin cuốn sách, mà tự xem điều sách nói có đúng với mình hay không.

Cuối mỗi phần có vài câu hỏi nhớ lại. Hãy trả lời trong đầu trước khi mở đáp án — đó chính là retrieval practice ở chương 13, dùng ngay cho cuốn sách này.

```mermaid
flowchart LR
  P1["Phần I<br/>Cơ chế"] -->|"① hiểu vì sao"| P2["Phần II<br/>Nền móng"]
  P2 -->|"② đứng vững"| P3["Phần III<br/>Theo đuổi mục tiêu"]
  P3 -->|"③ đưa vào lịch"| P4["Phần IV<br/>Xây một tuần"]
  P4 -->|"④ thử trên lịch thật"| P5["Phần V<br/>Ví dụ: lịch hiện tại"]
  P5 -.->|"⑤ cuộc sống thay đổi"| P4
  P4 -->|"⑥ đo kết quả"| P6["Phần VI<br/>Đo và tự kiểm chứng"]
  P6 -.->|"⑦ dữ liệu sửa kế hoạch"| P4
```

Khi tra cứu: gặp chuyện cụ thể như trì hoãn, mất ngủ, bỏ tập hay quan hệ căng thẳng thì mở chương giải thích chuyện ấy. Lịch sống thay đổi thì mở Phần IV.

<div class="callout data"><div class="ct">Tự kiểm tra: chọn một vấn đề để đọc cùng</div>

Trước khi đọc tiếp, hãy ghi vào ghi chú điện thoại **một** chuyện cứ lặp đi lặp lại trong tuần, kèm lần gần nhất chuyện ấy xảy ra — ví dụ "tối thứ Ba, đi làm về, định đọc sách, lướt điện thoại tới gần nửa đêm". Đọc tới chương nào, hãy tự hỏi chương ấy giải thích được mắt xích nào trong đúng chuyện đó <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Nếu đọc hết Phần I mà vẫn chưa chỉ ra được mắt xích nào, thì hoặc chuyện ấy thuộc về một chương khác, hoặc bạn ghi còn quá chung chung <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="principles"><span class="num">1</span>Mười hai nguyên lý</h2>

Nếu chỉ nhớ một trang, hãy nhớ trang này. Chương ghi bên cạnh mỗi nguyên lý sẽ giải thích kỹ.

```mermaid
mindmap
  root((Vận hành<br/>cuộc sống))
    Thiết kế tình huống
      1 Hành vi do tình huống
      4 Habit = bối cảnh → phản ứng
      5 Default thắng quyết định
    Chi phí và cảm xúc
      2 Lập kế hoạch cho lúc mệt
      3 Bắt đầu cho dễ
      6 Né tránh để dễ chịu ngay
    Nền móng
      7 Ngủ và hồi sức
      8 Người thân yêu
    Hệ thống mục tiêu
      9 Một mục tiêu mỗi quý
      10 Ghi lại và chia sẻ
      11 Buông và tìm mục tiêu mới
    Kết quả
      12 Bạn là những gì đã làm
```

Mười hai nguyên lý chia làm năm nhóm. Ba nhóm đầu nói về **một khoảnh khắc lựa chọn**, chẳng hạn lúc vừa đi làm về, ngồi xuống chiếc ghế ấy; nhóm thứ tư nói về **nhiều tháng, nhiều năm**; nhóm cuối là kết quả của tất cả.

1. **Hành vi phụ thuộc vào tình huống lúc chọn nhiều hơn vào ý định lúc lập kế hoạch.** Người có self-control tốt không phải người giỏi cưỡng lại hơn, mà là người ít phải cưỡng lại hơn, vì họ ít gặp cám dỗ hơn ([chương 5](#self-control)).
2. **Người lập kế hoạch và người thực hiện ở hai trạng thái khác nhau.** Hãy lập kế hoạch cho chính mình lúc đang mệt, dựa vào những lần trước chứ không dựa vào mong muốn ([chương 3](#cold-and-hot)).
3. **Nỗ lực có chi phí, và chi phí đó tăng dần trong ngày.** Đừng chờ tới lúc có năng lượng; hãy làm cho việc bắt đầu bớt tốn sức ([chương 4](#fatigue)).
4. **Habit là lối mòn từ một bối cảnh tới một phản ứng.** Đi mãi trong cùng một bối cảnh thì lối mòn hằn sâu dần; lỡ một lần không sao, quay lại nhanh mới là điều quan trọng ([chương 6](#habits)).
5. **Default thắng quyết định.** Cái gì được cài sẵn thì thường thành việc mình thật sự làm ([chương 12](#body-money)).
6. **Né tránh là để thấy dễ chịu ngay.** Hãy làm cho bước đầu tiên dễ chịu, và coi thất bại là dữ liệu chứ không phải bản án ([chương 8](#mood-and-shame)).
7. **Hồi sức là một phần của làm việc hiệu quả** — ngủ đủ, gác hẳn công việc sang một bên, nghỉ cho ra nghỉ ([chương 9](#recovery), [chương 10](#sleep)).
8. **Người thân yêu là trụ cột của cuộc sống**, không phải thứ chỉ dành cho lúc còn thừa thời gian ([chương 11](#people)).
9. **Mỗi quý dồn sức cho một mục tiêu**, các mục tiêu khác chỉ giữ ở mức tối thiểu ([chương 17](#portfolio)).
10. **Ghi lại tiến độ và chia sẻ với một người** ([chương 19](#monitoring)).
11. **Linh hoạt là biết buông và biết tìm mục tiêu mới** — buông mục tiêu nào thì phải có mục tiêu khác thay vào ([chương 20](#flexibility)).
12. **Bạn là những gì mình đã thực sự làm**, không phải những gì mình từng định làm ([chương 14](#thinking-well)).

<div class="callout data"><div class="ct">Tự kiểm tra: nguyên lý nào đang vắng mặt</div>

Mở lại tuần vừa rồi — lịch, thời gian dùng màn hình, sao kê ngân hàng — và tìm một ngày không như ý. Đọc lại mười hai nguyên lý, đánh dấu những nguyên lý giải thích được ngày đó <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Nếu tuần nào cũng đánh dấu cùng một số, chẳng hạn số 1 hay số 2, thì chương của nguyên lý ấy là chương bạn nên đọc kỹ nhất <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<div class="callout why"><div class="ct">Bản chất, trong một đoạn</div>

Con người không phải cỗ máy, cứ có ý chí là làm đúng kế hoạch. Hãy hình dung mỗi lần lựa chọn là một lần đặt lên bàn cân: một đĩa là lợi ích mình chờ đợi, đĩa kia là công sức phải bỏ ra. Cái cân ấy đặt *ngay trong tình huống trước mặt*, với cơ thể đang mệt hay khoẻ đúng lúc đó, và não chọn bên nào nặng hơn. Muốn kế hoạch thắng, bạn phải thay đổi tình huống, công sức hoặc phần thưởng **từ trước**, khi chưa tới lúc cân. Gần như mọi kỹ thuật trong cuốn sách này quy về ba việc: đổi tình huống, làm cho việc bắt đầu bớt tốn sức, và để phần thưởng đến sớm hơn.

</div>


<h2 id="part-1" class="part">Phần I — Con người vận hành thế nào</h2>

<h2 id="the-loop"><span class="num">2</span>Một buổi tối điển hình: một vòng lặp, không phải một lỗi</h2>

Tối nào cũng định học mà rồi lại lướt điện thoại tới nửa đêm — có phải tại mình thiếu kỷ luật? Phần lớn là không. Đó là một vòng lặp, mắt xích trước kéo mắt xích sau, và chỗ cắt đỡ tốn sức nhất là lúc vừa về tới nhà, khi điện thoại còn nằm trong túi.

Cảnh này chắc bạn đã quá quen. Buổi sáng, bạn quyết định tối nay sẽ học một tiếng. Tối đi làm về, bạn ngồi xuống, cầm điện thoại "xem một chút", và khi ngẩng lên thì đã gần nửa đêm. Hôm sau bạn tự trách, đặt một kế hoạch lớn hơn để bù, rồi mọi chuyện lại lặp lại từ đầu.

Hãy nghĩ tới một ngã tư giờ tan tầm. Một xe chen vào giữa ngã tư thì kẹt lại, xe hướng khác phải dừng, thế là lại có thêm người chen lên cho kịp, ngã tư càng tắc. Chẳng ai cố tình gây kẹt, ai cũng chỉ muốn đi nhanh hơn một chút, vậy mà cả ngã tư đứng im. Buổi tối của bạn cũng là một **feedback loop** như thế: càng lặp lại càng khó thoát. Hình dưới vẽ đủ tám mắt xích.

```mermaid
flowchart TD
  A["Cả ngày làm việc<br/>dùng executive control liên tục"] -->|"① việc gì cũng thấy tốn sức hơn"| B["Buổi tối: lựa chọn nghiêng về<br/>thưởng ngay, ít công sức"]
  B -->|"② cue: về nhà, ngồi xuống,<br/>điện thoại trong tay"| C["Mở feed<br/>(habit tự diễn ra)"]
  C -->|"③ wanting, không cần liking;<br/>không có điểm dừng"| D["Lướt lâu hơn định"]
  D -->|"④ mệt + chán tăng,<br/>thêm cảm giác tội lỗi"| E["Không hồi sức được"]
  E -->|"⑤ 'giờ của riêng mình'<br/>kéo sang đêm"| F["Ngủ muộn"]
  F -->|"⑥ thiếu ngủ mà không nhận ra"| A
  E -->|"⑦ 'lại mất một ngày'<br/>— tự kết tội mình"| G["Self-efficacy giảm"]
  G -->|"⑧ việc học thành đáng sợ hơn;<br/>kế hoạch bù to hơn"| B
```

Đi qua từng mắt xích:

1. **Chi phí nỗ lực tăng.** Sau hơn sáu tiếng làm những việc phải tập trung, người ta chọn bốc đồng hơn <a class="ev ev-mid" href="#r-blain2016" title="Blain 2016 · Bằng chứng vừa"></a>. Tới tối, việc gì cần cố gắng cũng nặng nề hơn buổi sáng.
2. **Bối cảnh kích hoạt habit.** Khoảng một phần ba đến một nửa những gì ta làm mỗi ngày là việc lặp lại gần như hằng ngày, thường ở cùng một chỗ <a class="ev ev-mid" href="#r-wood2002" title="Wood 2002 · Bằng chứng vừa"></a>. Về nhà, ngồi xuống ghế, điện thoại trong tay — chính là một bối cảnh như thế.
3. **Feed tạo ra "muốn" mà không cần "thích".** Dopamine thúc mình đi tìm phần thưởng, chứ không lo phần khoái cảm <a class="ev ev-high" href="#r-schultz1997" title="Schultz 1997 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-berridge1998" title="Berridge 1998 · Bằng chứng mạnh"></a>. Cuộn vô hạn và autoplay lại xoá luôn chỗ dừng tự nhiên.
4. **Mệt và chán tăng sau khi dùng.** Người ta cầm điện thoại lên khi mệt hoặc chán, vậy mà dùng xong lại mệt và chán hơn <a class="ev ev-mid" href="#r-dora2021" title="Dora 2021 · Bằng chứng vừa"></a>.
5. **"Giờ của riêng mình" kéo sang đêm.** Cứ lùi giờ đi ngủ dù chẳng có lý do gì phải thức là chuyện có thật, và đi kèm ngủ thiếu <a class="ev ev-mid" href="#r-kroese2014" title="Kroese 2014 · Bằng chứng vừa"></a>.
6. **Thiếu ngủ mà không biết.** Ngủ thiếu nhiều ngày liền làm đầu óc kém đi rõ rệt, mà phần lớn người thiếu ngủ không nhận ra <a class="ev ev-mid" href="#r-vandongen2003" title="Van Dongen 2003 · Bằng chứng vừa"></a>; chương 10 kể kỹ thí nghiệm này. Thế là sáng hôm sau, việc gì cũng nặng nề ngay từ đầu.
7. **Sáng hôm sau đổ lỗi cho tính cách.** Khi hết mệt, người ta giải thích chuyện hôm qua bằng tính cách và quên mất mình đã mệt ra sao <a class="ev ev-mid" href="#r-nordgren2006" title="Nordgren 2006 · Bằng chứng vừa"></a>. Mỗi lần như vậy, self-efficacy — niềm tin "mình làm được việc này", chẳng hạn "mình nghe hiểu được tập podcast này" — lại mòn thêm một chút <a class="ev ev-high" href="#r-bandura1977" title="Bandura 1977 · Bằng chứng mạnh"></a>.
8. **Tin vào mình ít đi thì trì hoãn nhiều hơn.** Người càng ít tin vào khả năng của mình càng hay trì hoãn, và đây là một trong những mối liên hệ rõ nhất về trì hoãn <a class="ev ev-high" href="#r-steel2007" title="Steel 2007 · Bằng chứng mạnh"></a>. Vòng bên trong khép lại.

**Đi qua một tối thứ Ba, từng bước.** Đây là một buổi tối minh hoạ, ghép từ các mắt xích ở trên <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

1. *Tình huống.* Cả ngày đi làm, tối mới về tới nhà, người rã rời. Kế hoạch ghi trong điện thoại từ sáng: "21:00–22:00 nghe tiếng Anh".
2. *Cơ chế dự đoán gì.* Sau cả ngày tập trung, việc gì cần cố gắng cũng đang rất nặng (①). Ghế sofa và chiếc điện thoại trong túi là một cue quen (②). Không có gì chặn lại thì vòng ấy sẽ diễn ra như mọi tối.
3. *Chuyện thật sự xảy ra.* Vừa về đã mở TikTok "trong lúc chờ cơm chín". 21:00 vẫn đang lướt, vì chẳng video nào là chỗ để dừng (③). 23:30 tắt máy, người còn mệt hơn lúc mới về (④), và 00:30 mới đi ngủ (⑤).
4. *Hệ quả.* Sáng thứ Tư bạn dậy với sáu tiếng ngủ (⑥) và nghĩ "mình đúng là không có kỷ luật" (⑦). Tối thứ Tư bạn đặt kế hoạch "học bù hai tiếng" — kế hoạch khó hơn hôm qua, đúng lúc mình yếu hơn hôm qua (⑧).

Nhìn như vậy, chỗ cắt đỡ tốn sức nhất hiện ra khá rõ: không phải 21:00, lúc phải gồng mình tắt điện thoại, mà là lúc vừa về tới nhà, khi điện thoại còn nằm trong túi.

Điều đáng giữ lại từ chương này là cách nhìn. Chuyện gì cứ lặp đi lặp lại thì hầu như luôn là một vòng như thế, và mắt xích nào cũng cắt được. Gặp một ngã tư hay tắc, chẳng ai giải quyết bằng cách khuyên từng người "cố nhường nhau"; người ta lắp đèn tín hiệu, kẻ vạch, phân làn, tức là sửa *cấu trúc*. Buổi tối cũng vậy: cắt ở **môi trường**, tức mắt xích ② (bối cảnh) và ⑤ (giờ ngủ), là đỡ tốn sức nhất, vì không đòi ý chí đúng lúc bạn đang mệt.

Vòng như thế có ở khắp nơi. Bỏ tập: mệt nên bỏ một buổi, bỏ rồi thấy mình "đâu phải người tập thể dục", buổi sau càng khó trải thảm ra. Tiêu tiền bốc đồng: căng thẳng nên mua, mua xong áy náy, áy náy lại muốn tìm thứ gì cho dễ chịu. Gặp chuyện lặp lại, hãy **vẽ cái vòng ấy** ra giấy trước khi tìm cách giải <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Các chương còn lại của Phần I lần lượt mổ xẻ từng mắt xích.

<div class="callout data"><div class="ct">Tự kiểm tra: vẽ vòng buổi tối của bạn</div>

Năm tối đi làm tới, mỗi tối ghi một dòng vào ghi chú điện thoại: giờ về, mệt mấy điểm từ 1 đến 5, thứ đầu tiên bạn cầm lên, giờ đặt điện thoại xuống, giờ đi ngủ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Cuối tuần đọc lại năm dòng ấy. Nếu từ ba tối trở lên thứ đầu tiên bạn cầm là điện thoại, vòng của bạn bắt đầu ở mắt xích ②, và đó là chỗ nên cắt trước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Nếu giờ đi ngủ cứ lùi dần quá nửa đêm, hãy để ý cả mắt xích ⑤ và ⑥ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<details><summary>Đọc thêm: các nghiên cứu sau từng mắt xích</summary><div class="inner">

Mắt xích ①: trong nghiên cứu của Blain, vùng lateral prefrontal cortex cũng hoạt động yếu đi. Hiệu ứng chỉ thấy ở nhóm làm việc khó; nhóm làm việc dễ thì không <a class="ev ev-mid" href="#r-blain2016" title="Blain 2016 · Bằng chứng vừa"></a>.

Mắt xích ②: con số một phần ba đến một nửa đến từ hai nghiên cứu cho sinh viên ghi nhật ký từng giờ, lần lượt là 35% và 43% số hành vi <a class="ev ev-mid" href="#r-wood2002" title="Wood 2002 · Bằng chứng vừa"></a>.

Mắt xích ④: nếu còn tự coi việc xem là trì hoãn, cảm giác tội lỗi lấy nốt chút thư giãn còn lại <a class="ev ev-mid" href="#r-reinecke2014" title="Reinecke 2014 · Bằng chứng vừa"></a>. Chương 9 nói kỹ hơn.

Mắt xích ⑤: hiện tượng này có tên là bedtime procrastination. Trong ba tiếng trước khi ngủ, người hay lùi giờ ngủ dùng điện thoại nhiều hơn khoảng 61 phút mỗi ngày <a class="ev ev-mid" href="#r-chung2020" title="Chung 2020 · Bằng chứng vừa"></a>.

</div></details>

<h2 id="cold-and-hot"><span class="num">3</span>Người lập kế hoạch và người thực hiện</h2>

Sáng định tối học hai tiếng, tới tối lại chẳng làm nổi mười phút — sao kế hoạch cứ hỏng? Vì người viết kế hoạch lúc tỉnh táo không hình dung được mình lúc mệt sẽ ra sao. Cách sửa là lập kế hoạch theo số liệu của những lần trước, không theo mong muốn.

Ai từng đi chợ lúc bụng đói đều biết cảnh này: túi đồ đầy những thứ mà lúc no bạn chẳng đời nào mua. Bạn vẫn là bạn, chỉ khác trạng thái. Tâm lý học gọi khoảng cách ấy là **hot–cold empathy gap**.

Lúc "cold" — no, khoẻ, không có cám dỗ trước mặt — người ta không hình dung nổi lúc "hot" sẽ bị lấn át tới mức nào. "Hot" là khi mệt, đói, thèm, cám dỗ ngay trong tay. Tệ hơn, qua rồi họ còn *quên* luôn mình từng bị lấn át ra sao <a class="ev ev-high" href="#r-loewenstein1996" title="Loewenstein 1996 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-loewenstein2005" title="Loewenstein 2005 · Bằng chứng mạnh"></a>. Người viết kế hoạch lúc sáng sớm và người làm theo lúc tối mịt gần như là hai người khác nhau. Người thứ nhất cứ giao việc cho người thứ hai mà chẳng hỏi ý.

```mermaid
flowchart TB
  subgraph COLD["Buổi sáng — trạng thái cold"]
    P["Viết kế hoạch:<br/>'tối nay học 2 tiếng'"]
  end
  subgraph HOT["Buổi tối — trạng thái hot"]
    X["Thực hiện:<br/>mệt, cám dỗ trước mặt"]
  end
  P -->|"① dự đoán mình của tối nay<br/>giống mình của bây giờ"| X
  X -->|"② hành vi khác dự đoán"| R["Kế hoạch thất bại"]
  R -->|"③ sáng hôm sau quên mất<br/>mình đã mệt thế nào"| P
```

Bằng chứng rõ nhất đến từ một thí nghiệm rất đời thường. Nhân viên văn phòng, bệnh viện, cửa hàng chọn trước món ăn vặt mà một tuần sau họ sẽ nhận. Phần lớn người chọn trước món lành mạnh đã đổi sang món không lành mạnh khi đến lúc ăn thật; chiều ngược lại thì gần như không ai đổi <a class="ev ev-mid" href="#r-read1998" title="Read &amp; van Leeuwen 1998 · Bằng chứng vừa"></a>. Nhìn từ xa, "mình của tuần sau" lúc nào cũng kỷ luật hơn mình của hôm nay.

Nhà nào cũng gặp hiện tượng thứ hai: định dọn nhà đón Tết trong một ngày, rốt cuộc mất trọn ba ngày <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Đó là **planning fallacy**. Lúc ước lượng, ta hình dung một kịch bản suôn sẻ thay vì nhìn lại những lần trước <a class="ev ev-high" href="#r-buehler1994" title="Buehler 1994 · Bằng chứng mạnh"></a>.

Tin tốt nằm ngay trong nghiên cứu ấy. Sự lạc quan quá mức **biến mất** khi người ta phải nối dự đoán với những lần trước của chính mình: "lần trước việc tương tự mất bao lâu, lần này có gì khác?". Chỉ nhớ lại quá khứ thôi thì chưa đủ; con số cũ phải đi vào phép ước lượng (<a class="ev ev-high" href="#r-buehler1994" title="Buehler 1994 · Bằng chứng mạnh"></a>, Study 4). Người nội trợ khéo làm đúng việc này khi tính tiền sắm Tết: mở sổ xem năm ngoái đã tiêu hết bao nhiêu, chứ không ước theo cảm giác <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

Từ đó có hai quy tắc cho mọi kế hoạch. Thứ nhất, lập kế hoạch theo **số liệu thật của những lần gần nhất**, không theo "lẽ ra mình phải làm được". Nếu bốn tối thứ Ba vừa rồi bạn học được trung bình 15 phút, kế hoạch thứ Ba tới là 15 phút, không phải 2 tiếng. Thứ hai, **thiết kế cho trạng thái hot**: việc dành cho lúc mệt phải nhỏ, rõ ràng, và chuẩn bị sẵn — sách mở sẵn trên bàn, tai nghe để sẵn cạnh chỗ ngồi.

**Ví dụ: lấy số liệu thật thay cho mong muốn.** Một tuần minh hoạ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>:

1. *Tình huống.* Sáng Chủ nhật, ngồi uống cà phê, đầu óc thảnh thơi, bạn viết kế hoạch tuần: tối nào cũng nghe tiếng Anh một tiếng, tổng năm tiếng.
2. *Cơ chế dự đoán gì.* Bạn đang "cold" nên tưởng "mình của tối thứ Năm" cũng giống mình lúc ngồi cà phê sáng Chủ nhật. Vì planning fallacy, bạn nghĩ tới một tuần suôn sẻ chứ không nghĩ tới tuần trước.
3. *Kết quả nếu làm theo cảm giác.* Thứ Hai được 40 phút, thứ Ba 0, thứ Tư đi ăn sinh nhật bạn nên 0, thứ Năm 15 phút, thứ Sáu 0. Tổng cộng 55 phút trên năm tiếng dự định, kèm cảm giác thất bại suốt cả tuần.
4. *Làm lại theo số liệu.* Sáng Chủ nhật tuần sau, bạn mở ghi chép tuần trước: các tối đi làm, trung bình chưa tới 15 phút. Kế hoạch mới: 15 phút vào tối thứ Hai, Ba, Năm, nghe ngay sau bữa tối, bỏ hẳn tối thứ Tư vì tối ấy thường có hẹn.
5. *Kết quả.* Ba buổi 15 phút là 45 phút — chưa hơn tuần trước là bao, nhưng lần này bạn *làm được đúng kế hoạch*. Nhờ vậy self-efficacy bắt đầu đi lên thay vì đi xuống, và tới tuần sau mới là lúc nâng lên 20 phút.

<div class="callout data"><div class="ct">Tự kiểm tra: đo khoảng cách cold–hot của chính mình</div>

Trong một tuần, mỗi sáng ghi một con số: tối nay mình sẽ làm việc X trong bao nhiêu phút. Tối ghi con số thật bên cạnh <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Chủ nhật, lấy tổng thật chia cho tổng dự định. Nếu kết quả dưới một nửa, bạn đang viết kế hoạch cho "mình lúc buổi sáng"; tuần sau hãy dự định đúng bằng mức thật trung bình <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Nếu kết quả gần bằng một, bạn đang lập kế hoạch tốt — mỗi lần tăng đừng quá 20–30% <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<details><summary>Đọc thêm: các con số, và ba hiện tượng cùng gốc</summary><div class="inner">

Thí nghiệm món ăn vặt có 200 nhân viên ở các công ty, bệnh viện và cửa hàng tại Amsterdam. Trong số người chọn trước món lành mạnh, 62–82% đổi sang món không lành mạnh khi đến lúc ăn; chiều ngược lại chỉ 0–8% <a class="ev ev-mid" href="#r-read1998" title="Read &amp; van Leeuwen 1998 · Bằng chứng vừa"></a>.

Trong nghiên cứu kinh điển về planning fallacy, 74% suy nghĩ lúc lập kế hoạch là về kịch bản tưởng tượng, chỉ 7% là về kinh nghiệm cũ <a class="ev ev-high" href="#r-buehler1994" title="Buehler 1994 · Bằng chứng mạnh"></a>. Sinh viên dự định viết xong luận văn trong khoảng 34 ngày, thực tế mất trung bình 55,5 ngày. Con số ấy còn lâu hơn cả mức "tệ nhất" mà chính họ đoán, khoảng 49 ngày. Dù vậy, khoảng chênh giữa mức tệ nhất và thực tế nhỏ tới mức có thể chỉ do ngẫu nhiên.

**Present bias**: thứ có ngay trông to hơn thứ đến sau. Thiên lệch này mạnh với công sức hơn với tiền: chuyện phải bỏ công ra, người ta đẩy sang "để mai" dễ hơn nhiều so với chuyện tiền bạc <a class="ev ev-mid" href="#r-laibson1997" title="Laibson 1997 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-augenblick2015" title="Augenblick 2015 · Bằng chứng vừa"></a>. Một mô hình kinh tế học chia người ta làm hai kiểu. Người "naive" tin rằng mai mình sẽ làm, nên cứ dời mãi những việc phải chịu khổ trước. Người "sophisticated" biết trước rằng mai mình cũng sẽ muốn dời, nên làm sớm hơn và ít trì hoãn hơn <a class="ev ev-mid" href="#r-odonoghue1999" title="O&#x27;Donoghue &amp; Rabin 1999 · Bằng chứng vừa"></a>. Đây mới là mô hình lý thuyết, chưa phải kết quả đo được. Ý đáng giữ: biết trước mình sẽ yếu lòng là một lợi thế.

**Restraint bias**: tự tin quá mức vào sức kiềm chế. Người tin mình giỏi cưỡng lại thì lại hay để mình ở gần cám dỗ hơn, và vì thế thua nhiều hơn <a class="ev ev-mid" href="#r-nordgren2009" title="Nordgren 2009 · Bằng chứng vừa"></a>. Câu "để điện thoại cạnh giường cũng được, mình không mở đâu" chính là restraint bias đang lên tiếng.

**Intention–behaviour gap**: khoảng cách giữa ý định và hành động. Tổng hợp các thử nghiệm cho thấy khi ý định tăng lên khá nhiều, hành vi chỉ nhích theo được chừng một nửa <a class="ev ev-high" href="#r-webb2006" title="Webb &amp; Sheeran 2006 · Bằng chứng mạnh"></a>. Muốn thật lòng vẫn chưa đủ để làm thật.

</div></details>

<h3 id="tmt-worked-example"><span class="num">3.1</span>Ví dụ: ba đòn bẩy của động lực</h3>

Tối về người mệt rã rời, vì sao TikTok thắng việc học, và làm sao để việc học thắng lại? Việc học thua vì nó vừa khó tin là làm được, vừa phải chờ rất lâu mới thấy thưởng. Thu nhỏ việc lại và đặt phần thưởng vào ngay trong việc là lật được thế cờ.

Steel gom các nghiên cứu về trì hoãn thành một khung gọn: **một việc kéo bạn mạnh khi bạn chắc mình làm được, khi việc ấy đáng giá với bạn, và khi phần thưởng đến sớm** <a class="ev ev-mid" href="#r-steel2007" title="Steel 2007 · Bằng chứng vừa"></a>. Như vậy có ba đòn bẩy:

- **Chắc làm được không?** Việc càng chắc thành công, sức kéo càng lớn. Việc theo đuổi nhiều năm chưa xong sẽ gợi lên một câu hỏi ngầm: "lần này thì có gì khác?"
- **Có đáng không?** Mình coi trọng việc này đến đâu, hoặc việc này vui đến đâu.
- **Bao lâu mới thấy thưởng?** Lúc mệt, đây là đòn bẩy mạnh nhất. Phần thưởng xa vài tháng gần như chẳng kéo được ai; phần thưởng có ngay thì kéo rất mạnh.

Đặt ba lựa chọn quen thuộc cạnh nhau:

| Lựa chọn lúc mệt | Chắc làm được? | Có đáng không? | Bao lâu thấy thưởng? | Sức hút lúc tối về mệt |
|---|---|---|---|---|
| "Học IELTS 2 tiếng" | Thấp — nhiều năm chưa xong | Rất cao — rất quan trọng | Rất lâu — sau nhiều tháng | **Yếu nhất**: giá trị lớn bị hai đòn bẩy kia đè bẹp |
| Lướt TikTok | Chắc chắn | Vừa phải — vui vừa | Ngay lập tức | **Mạnh** |
| "Ôn 15 thẻ từ + nghe một đoạn podcast mình thích" | Gần như chắc chắn — nhỏ tới mức khó thất bại | Vừa, nhỉnh hơn TikTok — vui ngay, lại có tiến bộ | Ngay lập tức — vui ngay khi nghe | **Mạnh nhất** |

Lựa chọn thứ ba thắng "học IELTS" không phải vì quan trọng hơn; thật ra còn kém quan trọng hơn. Lựa chọn ấy thắng vì hai đòn bẩy kia đứng về phía mình: nhỏ tới mức gần như chắc chắn làm được, và có phần thưởng ngay trong lúc làm. Thậm chí lựa chọn ấy còn nhỉnh hơn cả TikTok, vì đoạn podcast mình thích đặt niềm vui vào ngay bên trong việc học <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Còn "học IELTS 2 tiếng" dù giá trị lớn nhất vẫn thua xa: giá trị ấy không bù nổi chuyện vừa khó tin là làm được, vừa phải chờ hàng tháng mới thấy kết quả.

**Làm thử với mục tiêu nghe tiếng Anh.** Giả sử kế hoạch tối nay là "luyện nghe 1 tiếng" <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>:

1. *Chắc làm được không?* Một tiếng vào buổi tối sau cả ngày làm việc — nhìn lại mấy tuần qua thì câu trả lời là "hiếm khi". Thu nhỏ lại: một tập podcast 10–15 phút.
2. *Có đáng không?* Bài nghe trong sách luyện thi thì quan trọng nhưng khô khan. Hãy chọn một podcast về chủ đề bạn vốn tò mò — chẳng hạn chuyện du lịch, ẩm thực hay bóng đá — để cái hay nằm cả ở nội dung chứ không chỉ ở tiếng Anh.
3. *Bao lâu mới thấy thưởng?* Điểm IELTS thì còn xa mấy tháng. Phần thưởng gần hơn: câu chuyện hay ngay trong tập nghe, và mỗi tối một dòng ghi "đã nghe tập 12", nhìn chuỗi ngày dài dần ra.
4. *Kết quả.* Kế hoạch mới là "ăn tối xong, đeo tai nghe, nghe tiếp tập đang dở". Xét cả ba đòn bẩy, kế hoạch này gần TikTok hơn nhiều so với "luyện nghe 1 tiếng".

Bài học này dùng được cho mọi mục tiêu, từ tập thể dục đến tiết kiệm: **thu nhỏ việc lại, và đặt phần thưởng vào ngay bên trong việc** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Muốn tập thể dục: "trải thảm tập bodyweight 10 phút, vừa tập vừa nghe tiếp tập podcast đang dở" thay vì "tối nay tập đủ một tiếng". Muốn tiết kiệm: nhìn số dư tiết kiệm tăng ngay hôm nhận lương thay vì chờ "cuối năm sẽ có một khoản".

<details><summary>Đọc thêm: khung này từ đâu ra</summary><div class="inner">

Steel gọi khung này là Temporal Motivation Theory <a class="ev ev-mid" href="#r-steel2007" title="Steel 2007 · Bằng chứng vừa"></a>. Đây là một khung để suy nghĩ hơn là một định luật đo được. Khung còn một yếu tố thứ tư: mức bốc đồng của mỗi người. Mức này gần như cố định và tác động lên mọi lựa chọn như nhau, nên khi so các lựa chọn của cùng một người thì có thể gác sang một bên.

</div></details>

<h2 id="fatigue"><span class="num">4</span>Mệt mỏi và chi phí của nỗ lực</h2>

Tối về mệt rã rời — có phải ý chí đã cạn như một bình xăng? Không hẳn. Sức vẫn còn, chỉ là não thấy việc gì cần cố gắng cũng *thiệt* hơn những việc dễ chịu, nên cách giải không phải "nạp lại" mà là làm cho việc bắt đầu bớt tốn sức.

Hình ảnh bình xăng từng rất nổi tiếng trong tâm lý học: dùng ý chí nhiều thì cạn, phải nghỉ hoặc "đổ thêm". Nhưng khi hàng chục phòng thí nghiệm cùng làm lại một thí nghiệm, với cách phân tích đăng ký từ trước, hiệu ứng gần như bằng 0 <a class="ev ev-high" href="#r-vohs2021" title="Vohs 2021 · Bằng chứng mạnh"></a>. Cảm giác mệt cuối ngày vẫn có thật; chỉ là cơ chế đằng sau thì khác.

Hãy nghĩ tới một bác tài taxi cuối ca. Xe vẫn còn xăng, nhưng một cuốc đi xa lúc 22 giờ bỗng thấy "không bõ", vì bác đang so cuốc ấy với việc về nhà ăn cơm, nằm nghỉ. Bình xăng chưa cạn. Cái thay đổi là chạy thêm một cuốc giờ trông *thiệt* hơn những việc khác bác có thể làm.

```mermaid
flowchart TB
  subgraph OLD["Mô hình cũ: bình xăng (không lặp lại được)"]
    O1["Dùng ý chí"] --> O2["Bình cạn"] --> O3["Hết khả năng"]
  end
  subgraph NEW["Mô hình được ủng hộ hơn: chi phí cơ hội"]
    N1["Việc đòi hỏi tập trung"] -->|"① cân lại"| N2{"Não so sánh:<br/>giá trị việc này<br/>vs mọi việc khác"}
    N2 -->|"② chi phí cảm nhận > phần thưởng"| N3["Cảm giác 'tốn sức',<br/>muốn đổi sang việc dễ"]
    N2 -->|"③ việc nhỏ, phần thưởng gần"| N4["Vẫn làm được"]
  end
```

Não bạn cũng cân như bác tài. Cảm giác "tốn sức" là kết quả của một phép cân: dồn sự tập trung cho việc này nghĩa là bỏ lỡ những việc khác <a class="ev ev-mid" href="#r-kurzban2013" title="Kurzban 2013 · Bằng chứng vừa"></a>. Tới tối, như mắt xích ① ở chương 2, đĩa cân đã nghiêng hẳn về những việc dễ và có thưởng ngay.

Hai cách hiểu này dẫn tới hai cách làm khác hẳn. Nếu mệt là bình cạn, cách giải là "nạp lại" hoặc "chịu khó hơn". Nếu mệt là việc gì cũng thấy nặng hơn, cách giải là **làm cho việc bắt đầu bớt tốn sức**: việc đã chọn sẵn, tài liệu đã mở sẵn, bước đầu tiên nhỏ tới mức gần như không tốn gì. Bạn không cần *cảm thấy* mình có năng lượng; bạn cần một việc đủ nhẹ để bắt tay vào.

Áp vào tuần của bạn: tối thứ Năm sau một ngày dài làm lụng, đừng hỏi "mình còn sức không", vì câu trả lời bao giờ cũng là không. Hãy hỏi "việc nhỏ nhất mình làm được ngay bây giờ là gì?". Còn việc khó nhất trong ngày, như học một bài mới khó hay ngồi tính lại chi tiêu cả tháng, nên xếp vào lúc mọi thứ còn nhẹ, trước khi cả ngày làm việc khiến việc gì cũng nặng thêm.

**Ví dụ: một tối thứ Năm sau buổi chiều kèm em ôn thi** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

1. *Tình huống.* Chiều nay bạn ngồi hai tiếng kèm đứa em họ ôn thi vào lớp 10, giảng đi giảng lại một bài hình. Tối về tới phòng, kế hoạch là đọc một chương mới trong cuốn sách đang đọc dở.
2. *Cơ chế dự đoán gì.* Sau cả ngày dồn sự tập trung, phép cân trong não nghiêng hẳn về những việc có thưởng ngay. Đọc một chương mới, phải hiểu từ đầu, lúc này trông nặng nề vô cùng.
3. *Cách nghĩ "bình xăng".* "Mình hết pin rồi, nghỉ đã, chín giờ học." Tới chín giờ, việc ấy còn nặng hơn; thế là trôi sang ngày mai.
4. *Cách nghĩ "phép cân".* Không hỏi "mình còn sức không", mà làm cho bước đầu nhẹ đi: tối qua bạn đã để sẵn cuốn sách mở đúng trang, kèm một dòng ghi chú "đọc lại hai trang cuối, chưa cần đọc mới". Mười phút đầu chỉ là đọc lại thứ đã quen.
5. *Kết quả.* Đọc lại hai trang nhẹ hơn hẳn mở chương mới. Nhiều tối bạn sẽ dừng ở đó, và thế cũng được. Có những tối đã vào guồng, bạn đọc thêm được vài trang.

<div class="callout data"><div class="ct">Tự kiểm tra: sáng và tối, cùng một việc</div>

Chọn một việc 15 phút, chẳng hạn ôn 20 thẻ từ. Trong một tuần, mỗi ngày làm việc ấy hai lần: một lần buổi sáng, lúc ăn sáng; một lần buổi tối, sau khi đi làm hoặc đi học về. Làm xong mỗi lần, chấm mức "tốn sức" từ 1 đến 5 <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Nếu việc y hệt mà điểm buổi tối cao hơn rõ rệt, bạn đang tận mắt thấy công sức nặng dần trong ngày, bằng chính số liệu của mình <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Thêm một bước nữa: tối nào đã để sẵn tài liệu từ hôm trước thì đánh dấu, rồi so điểm những tối ấy với những tối không chuẩn bị <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<details><summary>Đọc thêm: ego depletion và mô hình chi phí cơ hội</summary><div class="inner">

Mô hình bình xăng có tên là ego depletion. Lần kiểm tra lại thứ nhất có 23 phòng thí nghiệm với hơn 2.000 người <a class="ev ev-high" href="#r-hagger2016" title="Hagger 2016 · Bằng chứng mạnh"></a>. Lần thứ hai có 36 phòng thí nghiệm với hơn 3.500 người <a class="ev ev-high" href="#r-vohs2021" title="Vohs 2021 · Bằng chứng mạnh"></a>.

Cách giải thích bằng phép cân có tên là opportunity cost model <a class="ev ev-mid" href="#r-kurzban2013" title="Kurzban 2013 · Bằng chứng vừa"></a>. Người ta buông khi chi phí cảm nhận vượt quá phần thưởng mình chờ đợi <a class="ev ev-mid" href="#r-boksem2008" title="Boksem &amp; Tops 2008 · Bằng chứng vừa"></a>. Sau một thời gian dài phải tự kiểm soát, động lực và sự chú ý trôi dần từ "phải làm" sang "muốn làm, có thưởng ngay" <a class="ev ev-mid" href="#r-inzlicht2012" title="Inzlicht &amp; Schmeichel 2012 · Bằng chứng vừa"></a>.

Điều đo được trên hành vi: sau hơn sáu tiếng làm việc khó, người ta chọn phương án có thưởng sớm và ít tốn công hơn <a class="ev ev-mid" href="#r-blain2016" title="Blain 2016 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-wiehler2022" title="Wiehler 2022 · Bằng chứng vừa"></a>. Wiehler còn đưa ra một lời giải thích sinh hoá: một chất tên glutamate tích tụ ở vùng prefrontal. Lời giải thích này vẫn đang bị phản biện, và chưa ai lặp lại được <a class="ev ev-low" href="#r-embrey2025" title="Embrey &amp; Inzlicht 2025 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

</div></details>

<h3 id="body-clock"><span class="num">4.1</span>Đồng hồ sinh học không chống lại bạn lúc tối</h3>

Tới tối, cơ thể đã "hết giờ" chưa? Chưa: đồng hồ sinh học giữ bạn tỉnh táo nhất vào buổi tối, nên mệt lúc tối chủ yếu do cả ngày làm việc. Cũng không có lý do chắc chắn nào để ép mình thành "người buổi sáng".

Circadian rhythm là nhịp sinh học khoảng 24 giờ của cơ thể. Nhịp này phát tín hiệu tỉnh táo **mạnh nhất vào buổi tối**, quanh 20:00–22:00; lúc ấy muốn ngủ cũng khó <a class="ev ev-mid" href="#r-lavie1986" title="Lavie 1986 · Bằng chứng vừa"></a>. Vậy quãng 20:00–22:00 của bạn không phải lúc cơ thể đòi đi ngủ.

Hai lực cùng lúc điều khiển giấc ngủ <a class="ev ev-mid" href="#r-borbely2016" title="Borbély 2016 · Bằng chứng vừa"></a>. Lực thứ nhất là áp lực ngủ, dâng dần theo số giờ thức, như nước dâng trong bể. Lực thứ hai là đồng hồ sinh học, như anh bảo vệ giữ cổng, chưa tới giờ thì nhất định không mở: anh giữ cho bạn tỉnh tới khuya rồi mới cho giấc ngủ vào. Nghĩa là mệt lúc tối chủ yếu do công việc trong ngày, chứ không phải cơ thể đã hết khả năng.

Còn câu hỏi "mình là người buổi sáng hay buổi tối"? Ý tưởng làm việc đúng giờ cao điểm của mình thì hiệu quả hơn nghe rất hợp lý. Nhưng một thử nghiệm lớn không thấy hiệu ứng nào bền vững <a class="ev ev-low" href="#r-reymermet2023" title="Rey-Mermet &amp; Rothen 2023 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Nếu học buổi sáng thì là vì một lý do khác: lúc ấy chưa có cả ngày làm việc đè lên, việc gì cũng còn nhẹ. Và muốn có thời gian buổi sáng thì phải dời *cả* giấc ngủ lên sớm, đừng bao giờ cắt bớt giờ ngủ ([chương 10](#sleep)).

Muốn có thêm sức vào buổi tối, tập thể dục là cách có bằng chứng: tập luyện làm tăng *cảm giác có năng lượng* một cách đáng tin cậy <a class="ev ev-high" href="#r-wender2022" title="Wender 2022 · Bằng chứng mạnh"></a>.

Tập buổi tối cũng không hại giấc ngủ, trừ khi tập nặng và kết thúc trong vòng một tiếng trước giờ ngủ <a class="ev ev-mid" href="#r-stutz2019" title="Stutz 2019 · Bằng chứng vừa"></a>. Nếu bạn thường ngủ quanh nửa đêm, mười lăm phút bodyweight lúc 21:00 hoàn toàn ổn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<details><summary>Đọc thêm: chronotype và vài niềm tin về năng lượng</summary><div class="inner">

Quãng tỉnh táo buổi tối được các nhà nghiên cứu gọi là "forbidden zone" của giấc ngủ <a class="ev ev-mid" href="#r-lavie1986" title="Lavie 1986 · Bằng chứng vừa"></a>. Điểm trũng của nhịp sinh học rơi vào đầu giờ chiều, kể cả khi bỏ bữa trưa <a class="ev ev-mid" href="#r-monk2005" title="Monk 2005 · Bằng chứng vừa"></a>. Cơn buồn ngủ lúc 14 giờ không phải tại bát cơm.

Phần lớn người trẻ thuộc kiểu buổi tối hoặc trung tính <a class="ev ev-mid" href="#r-may1993" title="May 1993 · Bằng chứng vừa"></a>. Ý tưởng làm việc đúng giờ cao điểm của chronotype có tên là synchrony effect. Hiệu ứng này chỉ thấy trong 29 trên 64 nghiên cứu ở người 18–45 tuổi, tức chưa tới một nửa <a class="ev ev-low" href="#r-chauhan2025" title="Chauhan 2025 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Thử nghiệm của Rey-Mermet & Rothen có 446 người <a class="ev ev-low" href="#r-reymermet2023" title="Rey-Mermet &amp; Rothen 2023 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Một nghiên cứu cho thấy habit buổi sáng hình thành nhanh hơn, nhưng chỉ có 48 người tham gia nên kết quả rất mong manh <a class="ev ev-low" href="#r-fournier2017" title="Fournier 2017 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

"Ăn đồ ngọt để lấy lại ý chí" dựa trên những nghiên cứu có bằng chứng yếu. Gom các nghiên cứu lại thì không thấy glucose có tác dụng đồng nhất <a class="ev ev-low" href="#r-vadillo2016" title="Vadillo 2016 · Bằng chứng yếu hoặc đang tranh cãi"></a><a class="ev ev-low" href="#r-orquin2016" title="Orquin &amp; Kurzban 2016 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

Câu chuyện "thẩm phán đói thì xử nặng hơn" thường được kể để minh hoạ decision fatigue. Hoá ra kết quả ấy có thể bắt nguồn hoàn toàn từ cách sắp xếp dữ liệu, tức một artifact thống kê, không phải do đói <a class="ev ev-low" href="#r-glockner2016" title="Glöckner 2016 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

Tập thể dục không làm bạn thông minh hơn ngay lập tức: tác động tức thì lên nhận thức rất nhỏ <a class="ev ev-high" href="#r-chang2012" title="Chang 2012 · Bằng chứng mạnh"></a>.

</div></details>

<h2 id="self-control"><span class="num">5</span>Self-control là thiết kế tình huống</h2>

Người kỷ luật có giỏi cưỡng lại cám dỗ hơn mình không? Thường là không: họ ít phải cưỡng lại hơn, vì đã sắp xếp để ít gặp cám dỗ. Self-control tốt phần lớn là thiết kế tình huống từ trước, chứ không phải gồng mình đúng lúc.

Bạn đoán xem: hai người cùng muốn bớt ăn bánh ngọt. Một người rất giỏi kìm lòng khi đĩa bánh ở ngay trước mặt. Người kia chẳng giỏi kìm lòng gì, nhưng không bao giờ mua bánh về nhà. Sau một tháng, ai ăn ít bánh hơn?

Gần như chắc chắn là người thứ hai. Một nghiên cứu hỏi người tham gia nhiều lần mỗi ngày về những ham muốn họ đang có. Hoá ra người có self-control cao lại **ít phải giằng co giữa ham muốn và mục tiêu hơn** <a class="ev ev-mid" href="#r-hofmann2012" title="Hofmann 2012 · Bằng chứng vừa"></a>. Họ không thắng nhiều trận hơn; họ đánh ít trận hơn.

Điều này cũng đúng khi đem ra thử ngoài đời. Sinh viên được dạy cách **thay đổi tình huống** đạt mục tiêu học tập tốt hơn sinh viên được dạy cách cố kìm lòng <a class="ev ev-mid" href="#r-duckworth2016" title="Duckworth 2016 · Bằng chứng vừa"></a>.

Ông bà mình nói "nước đến chân mới nhảy": đợi nước ngập tới cửa mới cuống cuồng kê đồ thì vất vả mà chưa chắc kịp, còn kê đồ lên cao từ lúc trời chưa mưa thì nhàn. Duckworth, Milkman và Laibson xếp các chiến lược self-control theo đúng lẽ ấy, từ lúc can thiệp sớm nhất đến muộn nhất <a class="ev ev-high" href="#r-duckworth2018" title="Duckworth 2018 · Bằng chứng mạnh"></a>:

```mermaid
flowchart TB
  S1["① Situation selection<br/>không bước vào tình huống có cám dỗ"] --> S2["② Situation modification<br/>đổi môi trường trước mặt"]
  S2 --> S3["③ Attentional deployment<br/>hướng sự chú ý sang chỗ khác"]
  S3 --> S4["④ Cognitive change<br/>nhìn tình huống theo cách khác"]
  S4 --> S5["⑤ Response modulation<br/>cám dỗ đã trong tay, cố kìm lại"]
  S1 -.- C1["chi phí lúc mệt: gần như 0"]
  S5 -.- C5["chi phí lúc mệt: cao nhất"]
```

Lấy chiếc điện thoại buổi tối làm ví dụ. Bước ①: về tới nhà, bạn không ngồi xuống sofa mà đi thẳng vào phòng tắm. Bước ②: bạn cắm sạc điện thoại ở một chỗ cố định ngoài tầm tay, ứng dụng feed thì đã đăng xuất. Bước ③: sách và tai nghe đặt sẵn trên bàn, đập vào mắt đầu tiên. Bước ④: bạn tự nhủ "chỉ 15 thẻ thôi". Tới bước ⑤, điện thoại đã trong tay, TikTok đã mở, và bạn cố tắt đi. Đây là bước tốn sức nhất, mà lại thường là bước duy nhất người ta dùng.

Từ đây có một cách nhìn mới về thất bại. Mỗi lần bạn phải "gồng" ở bước ⑤ là một lần báo hiệu rằng có một bước sớm hơn mình chưa chuẩn bị. Câu nên hỏi không phải "sao mình yếu thế", mà là **"bước nào sớm hơn mình chưa làm?"**

**Ví dụ: ngày nhận lương, đi qua các bước** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

1. *Tình huống.* Lương về tài khoản lúc 10 giờ sáng. Bạn muốn tháng nào cũng để dành được một phần, nhưng mấy tháng gần đây cứ cuối tháng là hết sạch.
2. *Cơ chế dự đoán gì.* Nếu chỉ trông vào bước ⑤, cả tháng bạn sẽ phải thắng hàng chục trận nhỏ — mỗi lần lướt Shopee lúc 23 giờ là một trận, mà lúc ấy bạn đang mệt.
3. *Bạn làm gì.* Bước ②: cài lệnh tự chuyển một khoản sang tài khoản tiết kiệm ngay trong ngày nhận lương, trước khi bạn kịp nhìn thấy số dư. Bước ③: gỡ thẻ đã lưu khỏi ứng dụng mua sắm. Bước ①: tắt thông báo khuyến mãi để ứng dụng thôi gọi mời bạn vào.
4. *Kết quả.* Những trận ở bước ⑤ thưa hẳn: muốn mua gì cũng phải mở ứng dụng, nhập lại số thẻ, và thấy số dư đã vơi. Còn khoản tiết kiệm thì đã nằm yên một chỗ từ ngày nhận lương, chẳng phải đánh trận nào.

<div class="callout data"><div class="ct">Tự kiểm tra: mỗi lần phải gồng là một bước bị thiếu</div>

Tuần này, mỗi khi phải cố cưỡng lại điều gì — tắt TikTok, không mua món đồ, không ăn thêm gói mì lúc 23 giờ — hãy ghi một dòng: chuyện gì, lúc mấy giờ, và lẽ ra bước nào sớm hơn (① đến ④) đã chặn được <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Chủ nhật đọc lại. Cám dỗ nào xuất hiện từ ba lần trở lên thì đó là chỗ đáng sửa môi trường nhất cho tuần tới <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Nếu ghi chú gần như trống, có thể môi trường của bạn đã khá ổn — hoặc bạn chưa để ý đủ; thử thêm một tuần nữa <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<details><summary>Đọc thêm: các nghiên cứu về self-control</summary><div class="inner">

Nghiên cứu của Hofmann theo dõi 205 người, với tổng cộng hơn 7.800 lần trả lời <a class="ev ev-mid" href="#r-hofmann2012" title="Hofmann 2012 · Bằng chứng vừa"></a>.

Một nghiên cứu khác cho thấy việc cố kìm mình trong từng khoảnh khắc không liên quan tới chuyện cuối học kỳ có đạt mục tiêu hay không. Thứ báo trước thất bại là mình gặp cám dỗ thường xuyên đến đâu <a class="ev ev-mid" href="#r-milyavskaya2017" title="Milyavskaya &amp; Inzlicht 2017 · Bằng chứng vừa"></a>.

Tổng hợp 102 nghiên cứu với hơn 32.000 người cho thấy self-control gắn với những hành vi tự động rõ hơn nhiều so với những hành vi phải gồng mình <a class="ev ev-high" href="#r-deridder2012" title="de Ridder 2012 · Bằng chứng mạnh"></a>. Self-control phát huy tác dụng chủ yếu qua habit <a class="ev ev-mid" href="#r-galla2015" title="Galla &amp; Duckworth 2015 · Bằng chứng vừa"></a>.

</div></details>

Habit là gì, và vì sao lúc mệt mình cứ làm theo cái cũ? Habit là một lối mòn từ một bối cảnh tới một phản ứng; lúc mệt, bạn sẽ đi theo lối mòn rõ nhất của bối cảnh ấy. Vì vậy việc mới phải chen vào đúng chỗ cue cũ, chứ không xếp vào một giờ khác.

Hồi mới tập đi xe máy, động tác nào bạn cũng phải nghĩ: vặn ga bao nhiêu, bóp phanh lúc nào, nhìn gương trước khi rẽ ra sao. Vài tháng sau, bạn vừa đi vừa nghĩ chuyện nhà, về tới nhà mà chẳng nhớ mình đã rẽ ở những ngã tư nào. Đó là habit.

Lối mòn ấy hình thành qua lặp lại, đúng như câu "đi mãi thì thành đường". Khi lối đã rõ, chỉ cần nhận ra bối cảnh là phản ứng tự diễn ra, chẳng cần nghĩ tới mục tiêu hay đưa ra quyết định nào <a class="ev ev-high" href="#r-wood2007" title="Wood &amp; Neal 2007 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-wood2016" title="Wood &amp; Rünger 2016 · Bằng chứng mạnh"></a>.

```mermaid
flowchart LR
  C["Cue<br/>bối cảnh: nơi chốn, giờ,<br/>đồ vật, việc vừa làm"] -->|"① nhận ra"| R["Response<br/>hành vi tự diễn ra"]
  R -->|"② lặp lại trong<br/>cùng bối cảnh"| L["Liên kết cue → response<br/>mạnh dần"]
  L -->|"③ lần sau diễn ra<br/>nhanh hơn, ít suy nghĩ hơn"| C
```

Thí nghiệm cho thấy rõ nhất: người quen ăn bỏng ngô ở rạp chiếu phim **ăn bỏng ngô ôi nhiều y như bỏng ngô mới**, nhưng chỉ khi ngồi trong rạp <a class="ev ev-mid" href="#r-neal2011" title="Neal 2011 · Bằng chứng vừa"></a>. Họ chẳng thích gì bỏng ôi; bối cảnh đã quyết định thay họ.

Lúc mệt, người ta còn **dựa vào habit nhiều hơn — cả habit tốt lẫn habit xấu** <a class="ev ev-mid" href="#r-neal2013" title="Neal, Wood &amp; Drolet 2013 · Bằng chứng vừa"></a>. Vì vậy câu cần hỏi không phải "làm sao cưỡng lại", mà là: *ở bối cảnh này mình quen làm gì, và thay bằng việc gì?* Một mục tiêu như "học tiếng Anh" là chưa đủ. Cần có một chuỗi gắn vào bối cảnh: "*khi cởi giày ở cửa* → *cắm sạc điện thoại ở chỗ cố định* → *mở thẻ từ*". Tin tốt là habit tốt cũng bền y như vậy: một khi "về nhà là mở thẻ từ" đã thành lối mòn, ngày mệt nhất bạn vẫn sẽ mở.

**Ví dụ: hai tuần đầu của một chuỗi habit mới** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

1. *Tình huống.* Bối cảnh lúc vừa về tới nhà hiện có một lối mòn rất rõ: cởi giày → ngồi sofa → mở TikTok.
2. *Cơ chế dự đoán gì.* Lúc mệt, bạn sẽ đi theo lối mòn rõ nhất. Muốn thắng thì phải mở lối mới ngay từ *đúng chỗ* cue cũ, chứ không phải xếp vào một giờ khác.
3. *Bạn làm gì.* Đặt cục sạc trên kệ giày. Chuỗi mới: cởi giày → cắm điện thoại vào sạc ở đó → mở laptop đã mở sẵn app thẻ từ → ôn 15 thẻ.
4. *Diễn biến.* Mấy ngày đầu bạn phải tự nhắc, có hôm quên, cầm điện thoại vào tới sofa mới sực nhớ. Thứ Tư đi ăn với bạn bè, về muộn, bỏ hẳn. Thứ Năm làm lại như chưa có gì xảy ra.
5. *Kết quả.* Sang tuần thứ hai, có những tối bạn cắm sạc xong mới nhận ra mình đã làm mà không cần nghĩ. Đó là dấu hiệu đầu tiên của lối mòn mới — còn mờ, cần thêm nhiều tuần nữa mới rõ.

<div class="callout data"><div class="ct">Tự kiểm tra: ở bối cảnh quen, bạn đang làm gì theo habit</div>

Chọn một bối cảnh lặp lại mỗi ngày: lúc vừa về tới nhà, lúc ngồi vào bàn ăn sáng, hay lúc nằm lên giường. Ba ngày liền, ghi lại *việc đầu tiên* bạn làm trong 30 giây đầu ở bối cảnh đó <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Nếu cả ba ngày giống nhau, đó là habit mặc định của bối cảnh ấy, và habit này sẽ thắng mọi kế hoạch, trừ khi bạn thay bằng một chuỗi mới gắn đúng vào cue ấy <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Khi đã bắt đầu chuỗi mới, mỗi tuần tự chấm câu "tuần này mình làm mà không cần nghĩ" từ 1 đến 5 — con số nhích dần lên qua nhiều tuần mới là tiến bộ thật, đừng chỉ đếm chuỗi ngày liên tiếp <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h3 id="habit-timeline"><span class="num">6.1</span>Mất bao lâu, và lỡ một ngày có sao không</h3>

Mất bao lâu thì một việc thành habit, và lỡ một ngày có làm hỏng hết không? Thường là vài tháng chứ không phải 21 ngày; và lỡ một ngày không sao cả. Điều quyết định là quay lại thật nhanh sau lần lỡ.

Con số "21 ngày" chỉ là truyền miệng. Khi theo dõi người thật, thời gian để một hành vi thành tự động dao động từ **18 đến 254 ngày**, tức từ vài tuần đến hơn tám tháng <a class="ev ev-mid" href="#r-lally2010" title="Lally 2010 · Bằng chứng vừa"></a>. Việc càng phức tạp, càng ít lặp lại thì càng lâu. Vậy nếu sau một tháng nghe podcast mà vẫn phải tự nhắc, bạn chưa thất bại; bạn mới đi được một đoạn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

Trong nghiên cứu của Lally có một câu đáng nhớ nguyên văn: *"Missing one opportunity to perform the behaviour did not materially affect the habit formation process."* Lỡ một lần chẳng làm hỏng gì. Lối mòn không mất vì một ngày không đi; chỉ khi bỏ hẳn thì cỏ mới mọc lại.

Điều thật sự quan trọng là quay lại. Một megastudy với hàng chục nghìn hội viên phòng gym cùng lúc thử 54 chương trình khuyến khích đi tập. Đứng đầu là chương trình **thưởng nhỏ cho việc quay lại sau một buổi bị lỡ** <a class="ev ev-high" href="#r-milkman2021" title="Milkman 2021 · Bằng chứng mạnh"></a>. Với bạn, điều đó nghĩa là: lỡ tối thứ Tư thì việc duy nhất cần làm là tối thứ Năm làm lại, không bù, không tự trách <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

Giữ một habit lại cần thứ khác với lúc bắt đầu. Bắt đầu nhờ kỳ vọng vào kết quả; duy trì nhờ **hài lòng với kết quả thật mình đã nhận được** <a class="ev ev-mid" href="#r-rothman2000" title="Rothman 2000 · Bằng chứng vừa"></a>. Bạn có thể bắt đầu tập bodyweight ở nhà vì muốn bớt mỡ bụng. Nhưng bạn sẽ chỉ tập tiếp nếu thật sự thấy điều gì đó tốt lên: hít đất được nhiều cái hơn, leo cầu thang đỡ hụt hơi hơn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<details><summary>Đọc thêm: các con số về habit</summary><div class="inner">

Một phân tích trên hàng triệu lượt quan sát cho thấy habit đi tập gym mất hàng tháng, còn habit rửa tay của nhân viên bệnh viện chỉ mất vài tuần <a class="ev ev-mid" href="#r-buyalskaya2023" title="Buyalskaya 2023 · Bằng chứng vừa"></a>.

Megastudy của Milkman có 61.293 hội viên, mỗi chương trình kéo dài bốn tuần. Khi các chương trình đã kết thúc, chỉ 8% trong số đó còn để lại khác biệt đo được. Chuyên gia đoán cách nào hiệu quả thì gần như chẳng khớp với kết quả thật <a class="ev ev-high" href="#r-milkman2021" title="Milkman 2021 · Bằng chứng mạnh"></a>. Trực giác, kể cả của chuyên gia, không phải chỗ dựa tốt, nên cuốn sách này cứ quay về số liệu.

Thích việc ấy thì mỗi lần lặp lại, lối mòn càng hằn sâu <a class="ev ev-mid" href="#r-judah2018" title="Judah 2018 · Bằng chứng vừa"></a>. Với habit tập luyện, mốc đáng chú ý là ít nhất bốn buổi mỗi tuần trong sáu tuần <a class="ev ev-mid" href="#r-kaushal2015" title="Kaushal &amp; Rhodes 2015 · Bằng chứng vừa"></a>.

Những giai đoạn cuộc sống thay đổi, như chuyển nhà hay đổi việc, là dịp tốt để tạo habit mới, vì lối mòn cũ đã bị cắt ngang sẵn. Can thiệp có hiệu quả hơn ở người vừa chuyển nhà, trong khoảng ba tháng đầu <a class="ev ev-mid" href="#r-verplanken2016" title="Verplanken &amp; Roy 2016 · Bằng chứng vừa"></a>. Nếu sắp chuyển chỗ ở hay đổi việc, hãy coi tuần đầu tiên là thời điểm vàng để gây dựng habit mới.

Tổng hợp 100 lý thuyết về việc duy trì hành vi quy về được năm nhóm yếu tố: động cơ, khả năng tự điều chỉnh, nguồn lực, habit, và môi trường xã hội <a class="ev ev-mid" href="#r-kwasnicka2016" title="Kwasnicka 2016 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="if-then"><span class="num">6.2</span>If-then plan</h3>

Viết kế hoạch theo kiểu "khi… thì…" có thật sự giúp không? Có, và khá rõ, nếu kế hoạch gắn vào một cue cụ thể có ngày giờ, và chỉ cho một mục tiêu mỗi lần. Nhưng gặp habit mạnh thì công cụ này yếu thế.

Implementation intention, hay if-then plan, là một kế hoạch viết theo dạng **"Khi [tình huống] thì tôi [hành động]"**. Kế hoạch ấy gắn hành động vào một cue cụ thể thay vì vào một ý định chung chung. Giống lời mẹ dặn hồi nhỏ "nồi cơm sôi thì bớt lửa": tới lúc nghe tiếng sôi, tay tự vặn bếp, chẳng cần ai nhắc. Tổng hợp các nghiên cứu cho thấy cách này có tác dụng rõ, và mạnh hơn khi bạn nhẩm lại kế hoạch vài lần <a class="ev ev-high" href="#r-sheeran2025" title="Sheeran 2025 · Bằng chứng mạnh"></a>.

Giới hạn thứ nhất: **gặp habit mạnh thì yếu thế**. If-then plan giúp bớt hút thuốc ở người có habit hút yếu hoặc vừa, nhưng không giúp được người có habit mạnh <a class="ev ev-mid" href="#r-webb2009" title="Webb 2009 · Bằng chứng vừa"></a>. Với một habit thật mạnh như "về nhà là mở TikTok", cách bền hơn là đổi hẳn bối cảnh từ trước, như chương 5 và chương 6 đã nói.

Giới hạn thứ hai: **viết cho nhiều mục tiêu cùng lúc lại phản tác dụng**. Thêm mục tiêu không làm lợi ích nhân lên <a class="ev ev-mid" href="#r-dalton2012" title="Dalton &amp; Spiller 2012 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-verhoeven2013" title="Verhoeven 2013 · Bằng chứng vừa"></a>. Năm kế hoạch "khi… thì…" cho năm mục tiêu thường kém hơn một kế hoạch cho một mục tiêu.

Giới hạn thứ ba: phải có **ngày và giờ cụ thể** mới tạo ra khác biệt. Trong một thử nghiệm ở công ty, nhắc nhân viên ghi cả ngày *và* giờ sẽ đi tiêm phòng thì nhiều người đi tiêm hơn; chỉ ghi ngày thì không có tác dụng rõ <a class="ev ev-high" href="#r-milkman2011" title="Milkman 2011 · Bằng chứng mạnh"></a>. "Cuối tuần tập thể dục" vẫn còn mơ hồ; "Chủ nhật 9 giờ sáng, ăn sáng xong là trải thảm ra tập" mới là một cue.

**Ví dụ: viết lại một kế hoạch cuối tuần** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Ý định ban đầu: "cuối tuần sẽ luyện nghe". Soát qua ba giới hạn ở trên: chỉ một mục tiêu (luyện nghe, không kèm thêm "tập thể dục, đọc sách, dọn nhà"), có ngày và giờ cụ thể, và gắn vào một cue sẵn có. Kết quả: "Sáng Chủ nhật, ăn sáng xong lúc 9 giờ, tôi đeo tai nghe và nghe một tập podcast trước khi mở điện thoại." Tối Chủ nhật nhìn lại: nếu ăn sáng xong mà tai nghe lại không ở gần, lần sau để sẵn tai nghe ngay chỗ ngồi ăn.

So sánh ba cách viết cùng một ý định:

| Cách viết | Câu | Vì sao |
|---|---|---|
| Sai | "Tối nay tôi sẽ học tiếng Anh." | Chỉ là mục tiêu, không có cue |
| Yếu | "Khi về nhà tôi sẽ không lướt TikTok." | Chỉ cấm, không có hành động thay thế |
| Đúng | "Khi cởi giày ở cửa, tôi cắm điện thoại vào sạc trên kệ giày và mở app thẻ từ trên laptop." | Cue cụ thể dẫn tới hành động cụ thể, và cue cũ (điện thoại trong tay) được gỡ bỏ |

<details><summary>Đọc thêm: if-then plan và habit mạnh</summary><div class="inner">

Tổng hợp của Sheeran gồm 642 phép thử. Tác dụng ở mức từ vừa phải đến khá mạnh; mạnh hơn khi viết đúng dạng "khi… thì…", khi động lực cao, và khi nhẩm lại kế hoạch vài lần <a class="ev ev-high" href="#r-sheeran2025" title="Sheeran 2025 · Bằng chứng mạnh"></a>.

Với habit mạnh, chiến lược duy nhất thấy có hiệu quả là vigilant monitoring: chủ động để ý và tự nhắc "đừng làm". Còn né thứ kích hoạt ngay lúc ấy thì giúp được với cám dỗ, nhưng không giúp được với habit mạnh <a class="ev ev-mid" href="#r-quinn2010" title="Quinn 2010 · Bằng chứng vừa"></a>. Cách bền hơn là đổi hẳn bối cảnh từ trước, nhất là khi bối cảnh sống đang thay đổi <a class="ev ev-mid" href="#r-verplanken2016" title="Verplanken &amp; Roy 2016 · Bằng chứng vừa"></a>.

Thử nghiệm tiêm phòng có 3.272 nhân viên. Ghi cả ngày và giờ làm tỷ lệ tiêm tăng 4,2 điểm phần trăm <a class="ev ev-high" href="#r-milkman2011" title="Milkman 2011 · Bằng chứng mạnh"></a>.

</div></details>


<h2 id="the-feed"><span class="num">7</span>Feed và sự chú ý</h2>

<h3 id="dopamine"><span class="num">7.1</span>Wanting không phải liking</h3>

Sao lướt cả tiếng mà chẳng thấy vui, vậy mà vẫn không dừng được? Vì trong não, "muốn" và "thích" là hai mạch riêng. Feed khơi mạch "muốn" liên tục, kể cả khi mạch "thích" gần như chẳng nhận được gì.

Bạn đã bao giờ mở tủ lạnh, nhìn một lượt, đóng lại, rồi năm phút sau lại mở ra, dù biết thừa trong đó chẳng có gì mới? Bạn không đói, cũng chẳng thèm món gì cụ thể. Bạn chỉ *muốn* mở. Cái cảm giác muốn mà không biết mình muốn gì ấy chính là chìa khoá để hiểu chiếc điện thoại buổi tối.

"Dopamine là hormone hạnh phúc" là một trong những hiểu lầm phổ biến nhất. Dopamine cần cho **wanting**, tức lực thôi thúc mình đi tìm một thứ. Nó không cần cho **liking**, tức khoái cảm khi có được thứ ấy. Chuột gần như mất hết dopamine vẫn tỏ ra thích thú bình thường khi nếm vị ngọt; chúng chỉ không còn chủ động đi tìm nữa <a class="ev ev-high" href="#r-berridge1998" title="Berridge &amp; Robinson 1998 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-berridge2015" title="Berridge &amp; Kringelbach 2015 · Bằng chứng mạnh"></a>.

Dopamine còn làm một việc nữa: báo độ chênh giữa phần thưởng mình đoán sẽ nhận và phần thưởng thật sự nhận được <a class="ev ev-high" href="#r-schultz1997" title="Schultz 1997 · Bằng chứng mạnh"></a>. Phần thưởng càng khó đoán, độ chênh ấy càng hay xuất hiện.

```mermaid
flowchart LR
  F["Video tiếp theo:<br/>có thể hay, không chắc"] -->|"① dự đoán không chắc chắn"| W["Wanting<br/>(dopamine) tăng"]
  W -->|"② vuốt tiếp"| V["Video thật:<br/>thường chỉ hơi hay"]
  V -->|"③ liking thấp,<br/>nhưng sai số dự đoán vẫn còn"| F
```

Giờ hãy nhìn feed bằng con mắt ấy. Mỗi lần vuốt giống như bật nắp một chai nước ngọt khuyến mãi: có khi trúng thưởng, còn phần lớn là "chúc bạn may mắn lần sau". Chính vì *không chắc* nên wanting cứ liên tục được khơi lên, kể cả khi từng video chỉ hơi hay. Vì thế người ta có thể lướt cả tiếng mà chẳng thấy vui, rồi đặt điện thoại xuống với cảm giác trống rỗng. Suốt tiếng đồng hồ ấy, mạch "muốn" hoạt động hết cỡ, còn mạch "thích" gần như chẳng nhận được gì.

<div class="callout data"><div class="ct">Tự kiểm tra: muốn và thích có đi cùng nhau không</div>

Lần tới mở TikTok hay Reels buổi tối, hãy chấm 10 video đầu tiên: mỗi video thích mấy điểm, từ 1 đến 5, ghi nhanh vào ghi chú <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Rồi tự hỏi: lúc này mình muốn vuốt tiếp tới mức nào, cũng từ 1 đến 5. Nếu phần lớn video chỉ được 2–3 điểm mà mức muốn vuốt vẫn là 4–5, bạn đang tận mắt thấy wanting tách khỏi liking <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Bản thân việc dừng lại chấm điểm cũng là một điểm dừng nhỏ — để ý xem hôm đó bạn có thoát ra sớm hơn mọi khi không <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<details><summary>Đọc thêm: dopamine</summary><div class="inner">

Độ chênh mà dopamine báo hiệu có tên là reward prediction error <a class="ev ev-high" href="#r-schultz1997" title="Schultz 1997 · Bằng chứng mạnh"></a>. Trong các thí nghiệm của Berridge, chuột mất tới 99% dopamine <a class="ev ev-high" href="#r-berridge1998" title="Berridge &amp; Robinson 1998 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-berridge2015" title="Berridge &amp; Kringelbach 2015 · Bằng chứng mạnh"></a>. Muốn và thích là hai mạch khác nhau trong não, và hai mạch này có thể lệch nhau rất xa.

</div></details>

<h3 id="no-stopping-point"><span class="num">7.2</span>Không có điểm dừng, và được cá nhân hoá</h3>

Vì sao gập sách thì dễ mà dừng lướt thì khó? Vì feed xoá hết những điểm dừng tự nhiên. Trả lại điểm dừng là người ta tự dừng sớm hơn.

Đọc sách, bạn có cuối chương để gập lại. Xem phim, bạn có đoạn chữ chạy lúc hết tập. Những điểm dừng ấy là lúc mình kịp tự hỏi "có xem tiếp không?". Cuộn vô hạn và autoplay xoá đúng những chỗ đó. Thêm nữa, thỉnh thoảng mới vớ được một video thật hay là kiểu **intermittent reinforcement**: phần thưởng đến thất thường như mua vé số, thỉnh thoảng trúng một lần là đủ khiến người ta mua mãi, rất khó dừng tay <a class="ev ev-mid" href="#r-montag2019" title="Montag 2019 · Bằng chứng vừa"></a>.

Điểm dừng quan trọng tới mức nào thì đã đo được. Tắt autoplay trên Netflix thì cả thời gian xem mỗi ngày lẫn độ dài mỗi lần xem đều giảm <a class="ev ev-mid" href="#r-schaffner2025" title="Schaffner 2025 · Bằng chứng vừa"></a>. Với bạn, tắt autoplay trên YouTube và các app video là việc mất một phút mà dùng được mãi <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

Feed còn được may đo cho riêng bạn. Video TikTok cá nhân hoá khiến não phản ứng mạnh hơn video không cá nhân hoá <a class="ev ev-mid" href="#r-su2021" title="Su 2021 · Bằng chứng vừa"></a>. Điều này **không** có nghĩa là "não bị hỏng". Feed không phá hỏng não bạn; chỉ là feed được may đo rất khéo để giữ chân bạn.

<details><summary>Đọc thêm: các nghiên cứu về điểm dừng và cá nhân hoá</summary><div class="inner">

Phần intermittent reinforcement là phân tích dựa trên cách thiết kế, chưa ai đo trực tiếp trên feed thật <a class="ev ev-mid" href="#r-montag2019" title="Montag 2019 · Bằng chứng vừa"></a>.

Trong nghiên cứu của Su, video cá nhân hoá kích hoạt default mode network và VTA, một vùng chứa nhiều neuron dopamine, mạnh hơn video không cá nhân hoá <a class="ev ev-mid" href="#r-su2021" title="Su 2021 · Bằng chứng vừa"></a>. Kết quả này cho thấy não phản ứng khác đi trước nội dung cá nhân hoá, chứ không chứng minh não bị tổn hại.

</div></details>

<h3 id="feed-evidence"><span class="num">7.3</span>Feed có hại đến mức nào</h3>

Feed có thật sự hại không? Không như thuốc độc. Cái hại nằm ở chỗ feed chiếm mất thời gian, và gần một phần ba thời gian ấy là phần chính bạn cũng không muốn cho đi.

Các khảo sát rất lớn cho thấy mức dùng công nghệ gần như không giải thích được vì sao người này hạnh phúc hơn người kia <a class="ev ev-high" href="#r-orben2019" title="Orben &amp; Przybylski 2019 · Bằng chứng mạnh"></a>. Người dùng nhiều không vì thế mà khổ hơn hẳn người dùng ít.

Thử nghiệm thật thì kể một câu chuyện khác. Khi được mời tự đặt giới hạn thời gian, phần lớn người dùng chọn tự trói tay mình. Theo ước tính của các tác giả, khoảng **31%** thời gian dùng mạng xã hội, gần một phần ba, đến từ chuyện không kiểm soát được bản thân: phần mà chính người dùng không muốn <a class="ev ev-high" href="#r-allcott2022" title="Allcott 2022 · Bằng chứng mạnh"></a>.

Một thử nghiệm khác cho người tham gia tắt Facebook bốn tuần. Họ có thêm thời gian, well-being nhích lên một chút, và **cả sau khi thí nghiệm kết thúc** họ vẫn dùng ít hơn trước <a class="ev ev-high" href="#r-allcott2020" title="Allcott 2020 · Bằng chứng mạnh"></a>. Nghĩa là một lần cắt có thể để lại thói quen mới, không chỉ tác dụng tạm thời.

Hiểu cho đúng thì vấn đề của feed nằm ở **thời gian và thứ tự**. Feed giống một vị khách không mời, đến đúng vào quãng giờ hiếm hoi bạn để dành cho việc quan trọng: chẳng hại ai, nhưng chiếm mất chỗ. Mà lúc tỉnh táo, chính người ta lại *muốn* được ràng buộc.

<details><summary>Đọc thêm: các con số về tác hại của feed</summary><div class="inner">

Khảo sát của Orben & Przybylski có 355.358 thanh thiếu niên. Mức dùng công nghệ chỉ giải thích được tối đa 0,4% sự khác biệt về well-being giữa người này với người khác <a class="ev ev-high" href="#r-orben2019" title="Orben &amp; Przybylski 2019 · Bằng chứng mạnh"></a>.

Trong thử nghiệm của Allcott năm 2022, 78% người dùng chọn một giới hạn ràng buộc. Giới hạn ấy cắt được 22 phút mỗi ngày <a class="ev ev-high" href="#r-allcott2022" title="Allcott 2022 · Bằng chứng mạnh"></a>.

Trong thử nghiệm tắt Facebook, người tham gia có thêm 60 phút mỗi ngày. Sau khi thí nghiệm kết thúc, họ vẫn dùng ít hơn khoảng 11 phút mỗi ngày, tức 22% <a class="ev ev-high" href="#r-allcott2020" title="Allcott 2020 · Bằng chứng mạnh"></a>.

Ở sinh viên, giới hạn mỗi nền tảng 10 phút mỗi ngày trong ba tuần làm giảm cảm giác cô đơn và trầm cảm <a class="ev ev-mid" href="#r-hunt2018" title="Hunt 2018 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="feed-interventions"><span class="num">7.4</span>Điều gì giúp cắt được vòng này</h3>

Cách nào thật sự giúp bớt lướt? Quyết định lúc tỉnh táo, ràng buộc cho lúc mệt: đặt giới hạn hoặc đăng xuất từ một tối thư thái, và đừng để mình dễ dàng gỡ ra.

Dân nhậu khôn ngoan có một mẹo ai cũng biết: trước khi ngồi vào bàn, đưa chìa khoá xe cho một người không uống giữ. Lúc tỉnh, mình biết rõ sau vài ly mình sẽ tự tin "vẫn lái được". Nên mình không trông vào ý chí lúc say; mình trông vào cái chìa khoá đã nằm trong túi người khác từ trước.

Cách mạnh nhất để trị feed cũng vậy. Đặt giới hạn thời gian vào một lúc thư thái, chẳng hạn tối Chủ nhật, và đừng để mình dễ dàng gỡ ra <a class="ev ev-high" href="#r-allcott2022" title="Allcott 2022 · Bằng chứng mạnh"></a>.

Mạnh hơn nữa là xoá ứng dụng hoặc đăng xuất. Cách này tạo ra nhiều **friction** nhất, tức thêm phiền phức trước khi mở, và hiệu quả gần bằng khoá hẳn tài khoản <a class="ev ev-high" href="#r-allcott2020" title="Allcott 2020 · Bằng chứng mạnh"></a>.

Friction nhỏ cũng có tác dụng, miễn là một khoảng dừng thật chứ không chỉ là một lời nhắc. Một ứng dụng bắt chờ thêm vài giây trước khi mở mạng xã hội, kèm nút "thôi" dễ bấm, làm số lần mở giảm hẳn. Còn chỉ hiện một thông điệp "hãy suy nghĩ lại" thì *không* có tác dụng <a class="ev ev-mid" href="#r-gruning2023" title="Grüning 2023 · Bằng chứng vừa"></a>.

Còn một sợi dây chẳng tốn gì: để cục sạc ngoài phòng ngủ. Dùng điện thoại sau khi đã tắt đèn đi ngủ thường đi kèm giấc ngủ kém và hôm sau mệt mỏi <a class="ev ev-mid" href="#r-exelmans2016" title="Exelmans 2016 · Bằng chứng vừa"></a>.

**Ví dụ: buộc dây từ tối Chủ nhật** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

1. *Tình huống.* 21:00 Chủ nhật, vừa ăn tối cùng gia đình xong, bạn đang thư thái — một lúc "cold" hiếm hoi trong tuần.
2. *Bạn làm gì.* Đặt giới hạn 30 phút mỗi ngày cho TikTok trong cài đặt điện thoại, rồi nhờ một người trong nhà đặt mật khẩu gia hạn, để tối thứ Ba bạn không tự gỡ được. Đăng xuất Facebook trên điện thoại, chỉ dùng trên máy tính ở nhà.
3. *Cơ chế dự đoán gì.* Tối thứ Ba vừa đi làm về, "mình lúc mệt" vẫn sẽ muốn mở app — wanting không biến mất. Nhưng giờ mỗi lần mở phải qua thêm một bước, và tới phút thứ 30 có một điểm dừng mà bạn không mặc cả được.
4. *Kết quả.* Bạn vẫn lướt, nhưng 30 phút chứ không phải ba tiếng. Tối Chủ nhật tuần sau, xem lại báo cáo thời gian sử dụng, bạn mới quyết định giữ hay nới giới hạn — lại đúng vào một lúc tỉnh táo.

<div class="callout data"><div class="ct">Tự kiểm tra: một tuần tự buộc dây</div>

Tuần này cứ dùng như bình thường, rồi ghi lại tổng thời gian dùng mạng xã hội trong phần Screen Time hoặc Digital Wellbeing <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Tối Chủ nhật, chọn *một* cách ràng buộc — giới hạn có mật khẩu do người khác giữ, đăng xuất, hoặc cắm sạc ngoài phòng ngủ — và giữ nguyên bảy ngày <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Chủ nhật sau, so hai con số. Nếu thời gian giảm mà bạn không thấy mình bỏ lỡ gì đáng kể, phần cắt đi chính là phần "không muốn" mà nghiên cứu nói tới; còn nếu thấy thiếu thật, hãy nới đúng chỗ thiếu thay vì bỏ hẳn cách ràng buộc <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<details><summary>Đọc thêm: friction nhỏ và grayscale</summary><div class="inner">

Trong nghiên cứu về ứng dụng bắt chờ vài giây, 36% số lần định mở bị bỏ ngang, và tổng số lần mở giảm 57% <a class="ev ev-mid" href="#r-gruning2023" title="Grüning 2023 · Bằng chứng vừa"></a>. Cần dè dặt với kết quả này: nghiên cứu không có nhóm đối chứng ngẫu nhiên, và một đồng tác giả chính là người làm ra ứng dụng.

Chuyển màn hình sang grayscale cắt được gần 38 phút mỗi ngày nhưng không giảm thời gian xem video <a class="ev ev-mid" href="#r-holte2020" title="Holte &amp; Ferraro 2023 · Bằng chứng vừa"></a>. Vì thế cách này gần như vô dụng với short video, thứ níu người ta bằng chuyển động chứ không phải bằng màu sắc.

</div></details>

<h3 id="boredom"><span class="num">7.5</span>Boredom là một tín hiệu</h3>

Tối ngồi vào học mà thấy chán ngay — có phải mình lười? Không: chán là một đèn báo. Đèn ấy nói rằng việc trước mặt không vừa với sức chú ý lúc này, hoặc chẳng gắn gì với điều mình coi trọng. Cầm điện thoại lên chỉ che đèn đi, không sửa được chỗ hỏng.

Boredom giống đèn báo trên đồng hồ xe máy: bản thân cái đèn không hỏng, nó báo có chỗ đang trục trặc. Chán xuất hiện khi việc đang làm quá khó hoặc quá dễ so với sức chú ý mình đang có, hoặc khi việc ấy chẳng liên quan gì tới điều mình coi trọng <a class="ev ev-mid" href="#r-westgate2018" title="Westgate &amp; Wilson 2018 · Bằng chứng vừa"></a>. Sau một ngày làm việc dài, cả hai kiểu lệch đều có đủ: sức chú ý đã cạn, còn việc trước mặt thì chẳng thấy có ý nghĩa.

Tín hiệu ấy khó chịu hơn ta tưởng. Trong một thí nghiệm, người tham gia phải ngồi một mình với suy nghĩ của mình 15 phút, bên cạnh có sẵn một nút tự giật điện nhẹ. Khá nhiều người, nhất là nam giới, đã bấm thay vì chỉ ngồi yên <a class="ev ev-mid" href="#r-wilson2014" title="Wilson 2014 · Bằng chứng vừa"></a>.

Nhưng cầm điện thoại lên không làm đèn báo tắt: dùng xong, mệt và chán còn tăng <a class="ev ev-mid" href="#r-dora2021" title="Dora 2021 · Bằng chứng vừa"></a>. Chẳng khác gì dán băng dính đen lên đèn báo hết xăng.

Vậy thứ thay cho feed lúc mệt phải vừa **nhẹ nhàng**, vừa sức chú ý đang thấp, vừa **gắn với điều mình coi trọng**. Một đoạn podcast tiếng Anh về chủ đề mình mê đạt cả hai; một bài ngữ pháp khô khốc chỉ đạt một <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

Áp vào một tối của bạn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>: 20:30, bạn ngồi xuống định làm bài nghe trong sách luyện thi và thấy chán ngay. Đèn báo đang nói gì? Sau ngày làm việc, sức chú ý đã xuống thấp, còn bài nghe đòi tập trung cao — lệch thứ nhất. Bài lại nói về một chủ đề bạn chẳng quan tâm — lệch thứ hai. Rút điện thoại ra chỉ là dán băng dính lên đèn. Đổi sang một tập podcast dễ hơn về chủ đề bạn mê là gỡ *cả hai* chỗ lệch cùng lúc. Còn bài trong sách luyện thi thì để dành cho một buổi sáng cuối tuần, khi sức chú ý còn đầy.

<details><summary>Đọc thêm: mô hình MAC và vài niềm tin không còn đúng</summary><div class="inner">

Cách giải thích chán ở trên là mô hình MAC <a class="ev ev-mid" href="#r-westgate2018" title="Westgate &amp; Wilson 2018 · Bằng chứng vừa"></a>. Trong thí nghiệm tự giật điện, 12 trên 18 người nam và 6 trên 24 người nữ đã bấm <a class="ev ev-mid" href="#r-wilson2014" title="Wilson 2014 · Bằng chứng vừa"></a>.

"Dopamine detox": chưa có thử nghiệm nào đo dopamine trước và sau một đợt "detox", dù phần hành vi, tức dùng ít đi, thì có bằng chứng.

"Dùng thụ động thì hại, dùng chủ động thì tốt": một nghiên cứu ủng hộ <a class="ev ev-low" href="#r-verduyn2015" title="Verduyn 2015 · Bằng chứng yếu hoặc đang tranh cãi"></a> nhưng tổng quan 40 nghiên cứu phần lớn không ủng hộ <a class="ev ev-low" href="#r-valkenburg2022" title="Valkenburg 2022 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

"Chỉ cần điện thoại nằm trên bàn là đầu óc đã kém đi": một lần làm lại thí nghiệm, có đăng ký trước, đã không ra kết quả ấy <a class="ev ev-low" href="#r-ruizpardo2022" title="Ruiz Pardo &amp; Minda 2022 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

"Kính chặn ánh sáng xanh chữa mất ngủ": Cochrane đánh giá bằng chứng ở mức chắc chắn rất thấp <a class="ev ev-mid" href="#r-singh2023" title="Singh 2023 · Bằng chứng vừa"></a>, vì điều quan trọng là độ sáng chứ không phải màu.

</div></details>

<h2 id="mood-and-shame"><span class="num">8</span>Cảm xúc, trì hoãn và thất bại lặp lại</h2>

<h3 id="not-laziness"><span class="num">8.1</span>Trì hoãn không phải do thiếu ý định</h3>

Trì hoãn có phải do lười, do mình không đủ muốn? Không. Người hay trì hoãn muốn làm việc y như mọi người; chỗ khác là khoảng cách giữa muốn và làm.

Nếu trì hoãn là do lười, người hay trì hoãn hẳn phải ít muốn làm việc hơn. Nhưng trong meta-analysis lớn nhất về trì hoãn, giữa ý định làm việc và trì hoãn gần như không có liên hệ gì <a class="ev ev-high" href="#r-steel2007" title="Steel 2007 · Bằng chứng mạnh"></a>. Khoảng cách giữa muốn và làm **càng rộng khi kế hoạch hẹn càng xa**. Hứa "tuần sau bắt đầu" thì nhẹ nhõm hơn nhiều so với "tối nay bắt đầu", và cũng vì thế mà dễ nuốt lời hơn nhiều.

Vậy điều gì đi cùng trì hoãn? Cũng nghiên cứu ấy cho thấy những thứ đi cùng khá rõ lại đều thay đổi được: việc gây khó chịu tới đâu, xung quanh có lắm thứ gây xao nhãng không, và mình tin vào khả năng của mình tới đâu <a class="ev ev-high" href="#r-steel2007" title="Steel 2007 · Bằng chứng mạnh"></a>. Một điều nhiều người bất ngờ: trì hoãn cũng gần như không liên quan tới tính cầu toàn.

Vậy thay vì tự hỏi "sao mình lười thế", hãy hỏi ba câu: việc này khó chịu ở đâu, cái gì đang kéo mình đi, và mình có tin là làm được không <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Hai mục tiếp theo đi vào câu thứ nhất và câu thứ ba; chương 5 và chương 7 đã nói về câu thứ hai.

<details><summary>Đọc thêm: bức tranh ba tầng của trì hoãn</summary><div class="inner">

Meta-analysis của Steel xếp các yếu tố đi cùng trì hoãn thành ba tầng <a class="ev ev-high" href="#r-steel2007" title="Steel 2007 · Bằng chứng mạnh"></a>:

- Đi cùng rõ nhất: tính chu đáo, ngăn nắp (conscientiousness) thấp và self-control thấp.
- Đi cùng khá rõ: dễ bị xao nhãng (distractibility), bốc đồng (impulsiveness), việc gây khó chịu (task aversiveness), self-efficacy thấp, kém tổ chức.
- Gần như không liên quan: ý định làm việc, và perfectionism.

Đây là tương quan, không phải nhân quả.

</div></details>

<h3 id="mood-repair"><span class="num">8.2</span>Thực chất là để thấy dễ chịu ngay</h3>

Vậy trì hoãn để làm gì? Để thấy dễ chịu ngay: né một việc khó chịu là được nhẹ nhõm tức thì, còn cái giá thì trả sau. Vì vậy bước đầu tiên của một việc phải tự thân dễ chịu.

Giới nghiên cứu gọi chuyện này là **mood repair**: đặt việc làm mình dễ chịu ngay lên trên mục tiêu dài hạn <a class="ev ev-mid" href="#r-sirois2013" title="Sirois &amp; Pychyl 2013 · Bằng chứng vừa"></a>. Nghe hơi trừu tượng, nên hãy xem thí nghiệm then chốt.

Bạn đoán xem: các nhà nghiên cứu khiến một số người rơi vào tâm trạng tồi, rồi xem họ có bỏ dở việc cần làm để chơi mấy trò vặt vô bổ hay không. Một phần trong số đó được dẫn dắt để tin rằng tâm trạng của mình đã bị "đóng băng", làm gì cũng không vui lên được. Nhóm nào trì hoãn nhiều hơn?

Câu trả lời: ở nhóm tin tâm trạng đã "đóng băng", xu hướng trì hoãn vô bổ **biến mất** <a class="ev ev-mid" href="#r-tice2001" title="Tice 2001 · Bằng chứng vừa"></a>. Khi trò vặt không còn hứa hẹn giúp mình dễ chịu hơn, người ta chẳng còn lý do gì để chơi. Họ không trì hoãn vì lười; họ trì hoãn vì *mong* rằng né đi sẽ dễ chịu hơn.

Cái giá thì đến sau. Sinh viên hay trì hoãn đầu học kỳ ít căng thẳng hơn, nhưng tới cuối kỳ lại căng thẳng hơn, ốm nhiều hơn, điểm thấp hơn <a class="ev ev-mid" href="#r-tice1997" title="Tice &amp; Baumeister 1997 · Bằng chứng vừa"></a>. Giống như vay nóng: hôm nay nhẹ người, mai sau trả lãi nặng.

```mermaid
flowchart LR
  T["Việc cần làm<br/>gợi cảm giác khó chịu"] -->|"① muốn hết khó chịu"| A["Né sang việc dễ chịu<br/>(feed, việc vặt)"]
  A -->|"② nhẹ nhõm ngay"| R["Nhẹ nhõm<br/>= phần thưởng"]
  R -->|"③ củng cố việc né"| T
  R -.->|"④ việc vẫn còn đó,<br/>giờ còn đáng sợ hơn"| T
```

Cũng vì thế mà một mục tiêu theo đuổi nhiều năm chưa đạt lại càng lúc càng khó bắt đầu. Sau ngần ấy năm, mở sách IELTS không còn đơn giản là mở sách; nó còn gợi lại câu "bao năm rồi mà vẫn vậy". Cảm giác khó chịu ấy chính là thứ feed hứa sẽ xoá đi. Vì vậy bước đầu tiên của một việc phải **tự thân dễ chịu**. Nếu không, bạn đang đòi bộ não chọn khó chịu thay vì dễ chịu, đúng vào lúc não mệt nhất. Mở đầu buổi học bằng một video tiếng Anh mình thích, thay vì bằng bài kiểm tra từ vựng, là một cách như thế <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

**Ví dụ: buổi học tiếng Anh sau nhiều năm** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

1. *Tình huống.* Bạn học tiếng Anh đã nhiều năm, học rồi bỏ, bỏ rồi lại học. Tối nay, sách luyện nghe nằm trên bàn.
2. *Cơ chế dự đoán gì.* Mở sách là một cảm giác nặng trĩu kéo tới: "bao năm rồi mà nghe vẫn chưa ổn". Não thấy ngay một lối thoát nhanh — TikTok — hứa xoá cảm giác ấy trong vài giây.
3. *Cách cũ.* "Lướt năm phút cho thoải mái rồi học." Cảm giác nặng tan đi thật — và chính sự nhẹ nhõm ấy là phần thưởng củng cố việc né. Tới 22:00, sách vẫn nằm đó, còn cảm giác nặng thì dày thêm một lớp.
4. *Cách mới.* Đổi bước đầu tiên: chưa mở sách, mà mở một video tiếng Anh năm phút về chủ đề bạn thích, không phụ đề tiếng Việt. Không có gì để "thua", không có điểm số.
5. *Kết quả.* Bước đầu đã dễ chịu sẵn, nên chẳng còn cảm giác khó chịu nào cần né. Sau năm phút, chuyển sang bài nghe khó hơn cũng bớt nặng nề hẳn — và nếu tối đó chỉ dừng ở video, bạn vẫn có thêm một lần "làm được".

<h3 id="repeated-failure"><span class="num">8.3</span>Coi thất bại là dữ liệu</h3>

Thất bại mãi một mục tiêu thì nên nhìn lại thế nào? Hãy ghi mỗi ngày trôi mất thành một tờ bệnh án chứ không phải một bản án, và đối xử với mình như với một người bạn vừa vấp ngã. Cách nhìn ấy giúp bạn quay lại nhanh hơn chứ không làm bạn dễ dãi đi.

Thất bại lặp đi lặp lại kéo self-efficacy xuống, nhất là những thất bại đến sớm. Còn thất bại mà sau đó mình vượt qua được thì lại khiến mình bền bỉ hơn <a class="ev ev-high" href="#r-bandura1977" title="Bandura 1977 · Bằng chứng mạnh"></a>. Như đứa trẻ tập đi: ngã rồi tự đứng dậy được thì lần sau dám bước tiếp, còn ngã mãi mà chẳng đứng lên nổi thì thôi không bước nữa. Vì vậy điều bạn cần là những lần nhỏ thấy "mình làm được".

Cách đặt mục tiêu cũng quyết định một lần lỡ nặng hay nhẹ. Mục tiêu kiểu "được ăn cả, ngã về không" biến một lần lỡ thành thất bại hoàn toàn. Còn mục tiêu có sẵn vài ngày dự phòng, chẳng hạn "học mỗi ngày, mỗi tuần được bỏ hai ngày", giúp người ta giữ cam kết sau khi lỡ <a class="ev ev-mid" href="#r-sharif2021" title="Sharif &amp; Shu 2021 · Bằng chứng vừa"></a>.

Còn một điều nhiều người không tin: **self-compassion**, tức đối xử với chính mình lúc thất bại như với một người bạn, làm *tăng* động lực sửa sai chứ không khiến mình lười đi. Hãy nghĩ xem bạn sẽ nói gì với một người bạn vừa thi trượt bằng lái xe máy lần đầu. Chắc chắn không phải "mày vô dụng thật", mà là "ai mà chẳng có lần, xem lại trượt ở vòng số 8 hay ở đâu đã" <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Sau một bài kiểm tra làm kém, người được hướng dẫn thực hành self-compassion đã dành nhiều thời gian ôn tập hơn <a class="ev ev-mid" href="#r-breines2012" title="Breines &amp; Chen 2012 · Bằng chứng vừa"></a>.

Một cách thực hành đơn giản: khi một ngày trôi mất, thay vì nghĩ "mình lại thất bại", hãy ghi một dòng **giải thích bằng hoàn cảnh lúc đó**: "đi làm về, mệt 2/5, điện thoại trong tay, năm phút sau đã mở TikTok". Câu đầu là một bản án. Câu sau giống một tờ bệnh án, mà bệnh án thì chữa được: đổi cue, đổi giờ, đổi việc. Bác sĩ giỏi không mắng bệnh nhân vì bị ốm, vì biết mắng thì lần sau người ta ngại kể thật. Với chính mình, bạn cũng nên ghi chép theo cách ấy <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

**Ví dụ: viết bệnh án cho một ngày trôi mất** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Thứ Năm, kế hoạch 15 phút nghe, kết quả 0. Bản án sẽ là: "Mình lười, chắc chẳng bao giờ giỏi tiếng Anh được." Còn bệnh án thì như sau: *Triệu chứng:* không nghe. *Bối cảnh:* tan làm muộn, kẹt xe, về tới nhà đã gần tám giờ, mệt 4/5. *Điều xảy ra:* mở Facebook xem tin nhắn nhóm gia đình, ở lại 90 phút. *Nguyên nhân gần nhất:* tin nhắn nhóm là cue kéo vào feed. *Cách chữa:* hôm nào về muộn, kế hoạch hạ xuống 5 phút; nghe xong rồi mới mở tin nhắn nhóm. *Tuần này:* 3 trên 5 buổi — vẫn là một tuần có tiến bộ. Đọc bản án xong, bạn chỉ thấy tệ thêm; đọc bệnh án xong, bạn biết tối thứ Năm tới phải làm gì khác đi.

Nếu trì hoãn nặng tới mức ảnh hưởng công việc hay sức khoẻ, CBT (cognitive behavioural therapy — liệu pháp nhận thức – hành vi) đã qua thử nghiệm ngẫu nhiên và cho hiệu quả khá rõ <a class="ev ev-high" href="#r-rozental2018" title="Rozental 2018 · Bằng chứng mạnh"></a>.

<div class="callout data"><div class="ct">Tự kiểm tra: ngay trước khi né, bạn cảm thấy gì</div>

Tuần này, mỗi khi bắt gặp mình đang né một việc — mở feed thay vì mở sách, lau nhà thay vì ôn bài — hãy ghi đúng một từ cho cảm giác ngay trước lúc né: chán, sợ, ngợp, xấu hổ, mệt <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Cuối tuần đếm lại. Nếu một cảm giác chiếm phần lớn, đó là thứ mà bước đầu tiên của việc ấy cần xoa dịu: ngợp thì thu nhỏ việc, xấu hổ thì bắt đầu từ chỗ dễ thắng, chán thì thêm thứ mình thích vào <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Và mỗi ngày trôi mất, hãy viết một tờ bệnh án thay vì một bản án, rồi để ý xem hôm sau bắt đầu lại có dễ hơn không <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<details><summary>Đọc thêm: thêm về thất bại, mục tiêu và self-compassion</summary><div class="inner">
