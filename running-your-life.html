Bản cập nhật năm 2016 của thuyết learned helplessness lật ngược cách hiểu cũ. Thụ động là phản ứng mặc định của cơ thể trước điều tồi tệ kéo dài, còn thứ phải học là cảm giác mình kiểm soát được <a class="ev ev-mid" href="#r-maier2016" title="Maier &amp; Seligman 2016 · Bằng chứng vừa"></a>. Bằng chứng chủ yếu đến từ động vật.

Khi đã hết mệt, người ta có xu hướng giải thích hành vi hôm trước bằng tính cách và bỏ qua trạng thái mệt <a class="ev ev-mid" href="#r-nordgren2006" title="Nordgren 2006 · Bằng chứng vừa"></a>. Những ngày dự phòng trong nghiên cứu của Sharif & Shu có tên là emergency reserves <a class="ev ev-mid" href="#r-sharif2021" title="Sharif &amp; Shu 2021 · Bằng chứng vừa"></a>.

Mục tiêu kiểu "muốn làm" ít gặp cám dỗ hơn, còn mục tiêu kiểu "phải làm" gặp nhiều cám dỗ và trở ngại hơn <a class="ev ev-mid" href="#r-milyavskaya2015" title="Milyavskaya 2015 · Bằng chứng vừa"></a>. Động lực xuất phát từ sự quan tâm thật của mình gắn với tiến bộ, còn động lực xuất phát từ áp lực thì không <a class="ev ev-mid" href="#r-koestner2008" title="Koestner 2008 · Bằng chứng vừa"></a>. Sau một thất bại, tự chấm theo mục tiêu nhỏ, như "tuần này làm được 3 trên 5 buổi", giữ được tâm trạng và niềm tin tốt hơn chấm theo mục tiêu lớn, như "vẫn chưa giỏi tiếng Anh" <a class="ev ev-mid" href="#r-housermarko2008" title="Houser-Marko &amp; Sheldon 2008 · Bằng chứng vừa"></a>.

Người tử tế với bản thân hơn cũng ít trì hoãn hơn <a class="ev ev-mid" href="#r-sirois2014" title="Sirois 2014 · Bằng chứng vừa"></a>. Sinh viên tự tha thứ cho việc trì hoãn trước kỳ thi đầu thì ít trì hoãn hơn trước kỳ thi sau <a class="ev ev-mid" href="#r-wohl2010" title="Wohl 2010 · Bằng chứng vừa"></a>.

</div></details>

<h2 id="recovery"><span class="num">9</span>Hồi sức sau giờ làm</h2>

Về nhà nghỉ cả tối mà sáng hôm sau vẫn mệt — nghỉ thế nào mới thật sự hồi sức? Đầu óc phải thật sự rời khỏi công việc, và bạn phải được tự chọn cách nghỉ mà không áy náy. Một tiếng lướt feed vừa xem vừa trả lời tin nhắn công việc thì không đạt điều nào.

Điện thoại cắm sạc mà vẫn chơi game nặng thì pin lên rất chậm, có khi còn tụt. Hồi sức sau giờ làm cũng thế: không phải cứ rời chỗ làm là đang nghỉ. Thang đo chuẩn của lĩnh vực này chia ra bốn trải nghiệm giúp hồi sức: đầu óc rời khỏi công việc, thả lỏng, học được điều gì mới ngoài công việc, và tự quyết thời gian của mình <a class="ev ev-high" href="#r-sonnentag2007" title="Sonnentag &amp; Fritz 2007 · Bằng chứng mạnh"></a>. Feed chỉ cho được một phần cái thứ nhất, và chỉ cho *cảm giác* tự quyết, vì thuật toán đã chọn thay bạn video tiếp theo <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

Trong bốn trải nghiệm ấy, **detachment**, tức đầu óc thật sự rời khỏi công việc, thôi nghĩ tới việc còn dở hay một lời trách lúc chiều, gắn chặt nhất với việc bớt mệt <a class="ev ev-high" href="#r-wendsche2017" title="Wendsche 2017 · Bằng chứng mạnh"></a>. Một tối đầu óc vẫn còn vướng tin nhắn công việc thì chưa phải tối được nghỉ.

Một thói quen nhỏ giúp đầu óc rời khỏi công việc: trước khi về, ghi hai dòng về việc đang dở và bước tiếp theo, giống kẹp một mẩu giấy vào trang sách đang đọc dở, ghi "mai đọc tiếp từ đây". Kế hoạch "ready-to-resume" như vậy giúp phần chú ý còn vướng lại ở việc cũ buông ra <a class="ev ev-mid" href="#r-leroy2018" title="Leroy &amp; Glomb 2018 · Bằng chứng vừa"></a>. Não yên tâm vì đã đánh dấu chỗ dừng, nên chịu buông.

Giải trí cũng giúp hồi sức thật. Nhưng khi một người đang kiệt sức tự coi việc mình xem là "trì hoãn", **cảm giác tội lỗi sẽ xoá sạch tác dụng hồi sức** <a class="ev ev-mid" href="#r-reinecke2014" title="Reinecke 2014 · Bằng chứng vừa"></a>. Cùng một tập phim, xem với tâm thế "mình đáng được nghỉ" thì hồi sức, xem với tâm thế "lẽ ra mình phải học" thì không. Vậy đã nghỉ thì hãy *chủ động chọn* nghỉ: có giờ kết thúc, không tự trách. Một tập phim chọn từ trước, xem hết rồi tắt, giúp hồi sức tốt hơn một tiếng lướt feed vừa xem vừa áy náy.

Hoạt động nhẹ nhàng, có người khác cùng làm hoặc có vận động, báo trước một buổi sáng hôm sau nhiều sinh lực. Còn việc nhà và việc mang về nhà làm buổi tối thì không <a class="ev ev-mid" href="#r-tenbrummelhuis2012" title="ten Brummelhuis &amp; Bakker 2012 · Bằng chứng vừa"></a>. Một buổi tối đi ăn, đi dạo với bạn bè hay người thân đáng giá hơn bạn nghĩ.

Cuối cùng là cảm giác tự quyết. Trong bốn trải nghiệm, **control**, tức cảm giác tự quyết mình dùng thời gian thế nào, gắn chặt nhất với cảm giác tràn đầy sinh lực <a class="ev ev-high" href="#r-bennett2018" title="Bennett 2018 · Bằng chứng mạnh"></a>. Từ đó có một giả thuyết đáng để ý, dù chưa có nghiên cứu trực tiếp. Sau cả ngày bị công việc và yêu cầu của người khác dắt đi, người ta thèm được tự quyết, nên thức khuya để "giành lại" thời gian của mình; mạng xã hội gọi hiện tượng này là revenge bedtime procrastination <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Cách làm rút ra vẫn còn đúng: cho mình được tự quyết **ngay từ đầu buổi tối**, như tự chọn nấu món gì, tự chọn đi dạo đường nào, để khỏi phải giành lại lúc một giờ sáng.

**Ví dụ: hai buổi tối, hai buổi sáng hôm sau** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

1. *Thứ Hai.* Đi làm về, vừa ăn tối vừa xem điện thoại, lướt tới 23:00, giữa chừng trả lời hai tin nhắn công việc. Soi theo bốn trải nghiệm: detachment thấp (vẫn vướng tin nhắn công việc), thả lỏng được rất ít, chẳng học được gì mới, còn tự quyết thì chỉ là cảm giác. Sáng thứ Ba: dậy người nặng trịch.
2. *Thứ Tư.* Trước khi rời chỗ làm, bạn ghi hai dòng "việc đang dở – bước tiếp theo". Tối đi ăn bún chả với một người bạn, đi dạo một vòng, điện thoại để im lặng; về nhà xem một tập phim đã chọn từ trước, xem hết thì tắt. Detachment cao, thả lỏng thật, và control là thật vì chính bạn tự chọn. Sáng thứ Năm: người nhẹ hẳn.
3. *Bài học.* Cùng là "nghỉ", nhưng chỉ tối thứ Tư thật sự trả lại sức — mà chẳng đòi bạn phải làm gì "có ích" cả.

<div class="callout data"><div class="ct">Tự kiểm tra: buổi tối nào thật sự hồi sức</div>

Hai tuần liền, trước khi ngủ, chấm nhanh bốn điểm từ 1 đến 5: tối nay mình dứt ra khỏi công việc được tới đâu (detachment), thả lỏng tới đâu, có học hay làm được gì mới không, và có tự quyết thời gian của mình không <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Sáng hôm sau chấm thêm một điểm: năng lượng lúc thức dậy. Hết hai tuần, xếp các buổi tối theo năng lượng sáng hôm sau, rồi xem những tối tốt nhất có điểm gì chung <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Nếu điểm detachment đi cùng năng lượng rõ nhất, việc nên làm trước tiên là ghi chú "ready-to-resume" trước khi rời chỗ làm và tắt thông báo công việc vào buổi tối <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<details><summary>Đọc thêm: bốn trải nghiệm hồi sức và các nghiên cứu khác</summary><div class="inner">

Bốn trải nghiệm trong thang đo của Sonnentag & Fritz có tên tiếng Anh là psychological detachment, relaxation, mastery và control <a class="ev ev-high" href="#r-sonnentag2007" title="Sonnentag &amp; Fritz 2007 · Bằng chứng mạnh"></a>.

Mối liên hệ giữa detachment và bớt mệt khá mạnh, thấy qua 17 mẫu với hơn 12.000 người <a class="ev ev-high" href="#r-wendsche2017" title="Wendsche 2017 · Bằng chứng mạnh"></a>. Nhưng việc càng ngập đầu thì đầu óc càng khó dứt ra <a class="ev ev-high" href="#r-sonnentag2015" title="Sonnentag &amp; Fritz 2015 · Bằng chứng mạnh"></a>: đúng lúc cần nghỉ nhất lại là lúc khó nghỉ nhất.

Mastery giúp hồi sức chứ không làm hao sức, miễn là việc ấy khác việc ban ngày và có chút niềm vui. Nội dung "có ý nghĩa" gắn với mastery, còn nội dung giải trí gắn với relaxation và detachment <a class="ev ev-mid" href="#r-rieger2014" title="Rieger 2014 · Bằng chứng vừa"></a>. Một đoạn podcast tiếng Anh về chủ đề mình thích có thể vừa cho detachment vừa cho mastery; một bài ngữ pháp khô khốc sau một ngày dài thì không.

Phần chú ý còn vướng lại ở việc cũ có tên là attention residue <a class="ev ev-mid" href="#r-leroy2018" title="Leroy &amp; Glomb 2018 · Bằng chứng vừa"></a>.

Đi bộ 10–15 phút làm tăng cảm giác tỉnh táo và tâm trạng tích cực <a class="ev ev-mid" href="#r-ekkekakis2000" title="Ekkekakis 2000 · Bằng chứng vừa"></a>. Tập luyện đều đặn làm giảm mệt và tăng năng lượng, qua 81 thử nghiệm ngẫu nhiên <a class="ev ev-high" href="#r-wender2022" title="Wender 2022 · Bằng chứng mạnh"></a>. Những lần nghỉ ngắn trong giờ làm tăng sức sống và giảm mệt <a class="ev ev-mid" href="#r-albulescu2022" title="Albulescu 2022 · Bằng chứng vừa"></a>.

Khuya còn dùng điện thoại làm việc thì ngủ kém và sáng hôm sau kiệt sức <a class="ev ev-mid" href="#r-lanaj2014" title="Lanaj 2014 · Bằng chứng vừa"></a>. Trả lời một tin nhắn công việc lúc 23 giờ tốn của bạn nhiều hơn năm phút gõ phím.

Nếu bạn đi bộ được một quãng mỗi lượt đi làm và về nhà, quãng ấy là thứ đáng quý: đi bộ đi làm đi kèm ít căng thẳng hơn, còn đường đi làm càng dài thì người ta càng ít hài lòng với thời gian rảnh của mình <a class="ev ev-mid" href="#r-clark2020" title="Clark 2020 · Bằng chứng vừa"></a>.

</div></details>

<h2 id="sleep"><span class="num">10</span>Giấc ngủ</h2>

<h3 id="sleep-basics"><span class="num">10.1</span>Ngủ bao nhiêu, và cái giá của thiếu ngủ</h3>

Ngủ bao nhiêu là đủ, và thiếu một chút thì sao? Người trưởng thành cần **7 tiếng ngủ được trở lên** mỗi đêm, nên thời gian nằm trên giường phải dài hơn 7 tiếng. Thiếu ngủ kéo dài làm đầu óc kém đi rõ rệt mà bạn không tự nhận ra.

Đó là đồng thuận của các hiệp hội y học giấc ngủ Mỹ: 7 tiếng trở lên, đều đặn <a class="ev ev-high" href="#r-watson2015" title="Watson 2015 · Bằng chứng mạnh"></a>. Một chi tiết dễ bỏ sót: đó là thời gian *ngủ được*, không phải thời gian *nằm trên giường*. Cũng như ngồi vào bàn học một tiếng chưa chắc đã học được một tiếng, nằm đúng 7 tiếng sẽ ngủ được ít hơn 7 tiếng, vì mất vài phút mới thiếp đi, lại thêm những lần trở giấc. Chẳng hạn nằm từ 00:00 tới 08:00 là tám tiếng trên giường, dư ra một tiếng cho lúc thiếp đi và những lần trở giấc <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

Thiếu ngủ nguy hiểm ở chỗ người ta không tự nhận ra mình đang thiếu, giống người say rượu cứ khăng khăng "tôi vẫn lái được". Trong thí nghiệm của Van Dongen, người chỉ được nằm giường 6 tiếng mỗi đêm trong hai tuần tụt sự tỉnh táo và trí nhớ làm việc xuống ngang người thức trắng một đêm. Vậy mà cảm giác buồn ngủ của họ chỉ tăng trong mấy ngày đầu rồi gần như chững lại <a class="ev ev-mid" href="#r-vandongen2003" title="Van Dongen 2003 · Bằng chứng vừa"></a>. Vì thế "mình thấy vẫn ổn" không chứng minh được là mình ổn: chính cái thước đo bên trong cũng đã lệch theo.

Giấc ngủ cũng là lúc những gì vừa học được cất vào trí nhớ, giống người bán hàng cuối ngày mới ngồi vào sổ những gì đã bán. Ngủ sau khi học giúp nhớ từ mới rõ rệt <a class="ev ev-high" href="#r-schimke2021" title="Schimke 2021 · Bằng chứng mạnh"></a>. Tối học từ mới rồi đi ngủ đúng giờ là một cặp rất ăn ý.

Còn một việc nhỏ mà chỉnh được ngay: giờ uống cà phê. Một ly cà phê nên uống cách giờ ngủ ít nhất 8,8 tiếng <a class="ev ev-high" href="#r-gardiner2023" title="Gardiner 2023 · Bằng chứng mạnh"></a>. Ngủ lúc 23:00 thì ly cuối nên trước khoảng 14:00; ngủ lúc 00:00 thì trước khoảng 15:00 <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<details><summary>Đọc thêm: thiếu ngủ, trí nhớ, caffeine, rượu và ánh sáng</summary><div class="inner">

Thí nghiệm của Van Dongen kéo dài 14 ngày. Nhóm chỉ được nằm giường 4 tiếng mỗi đêm tụt xuống ngang người thức trắng hai đêm. Trong khi cảm giác buồn ngủ chững lại, khả năng làm việc vẫn tiếp tục đi xuống <a class="ev ev-mid" href="#r-vandongen2003" title="Van Dongen 2003 · Bằng chứng vừa"></a>.

Kết quả về giấc ngủ và từ mới đến từ 25 nghiên cứu <a class="ev ev-high" href="#r-schimke2021" title="Schimke 2021 · Bằng chứng mạnh"></a>. Từ học lúc 20:00 đã nhập vào vốn từ sau một đêm ngủ, còn từ học lúc 08:00 phải đợi tới 24 giờ sau <a class="ev ev-mid" href="#r-dumay2007" title="Dumay &amp; Gaskell 2007 · Bằng chứng vừa"></a>.

Mốc 8,8 tiếng tính cho một ly cà phê khoảng 107 mg. Caffeine nói chung làm tổng thời gian ngủ giảm 45 phút <a class="ev ev-high" href="#r-gardiner2023" title="Gardiner 2023 · Bằng chứng mạnh"></a>.

Rượu, kể cả liều thấp tới 0,5 g mỗi kg cân nặng, cũng làm rối giấc REM <a class="ev ev-high" href="#r-gardiner2025" title="Gardiner 2025 · Bằng chứng mạnh"></a>. Với một người 64 kg, mức ấy là khoảng 32 g, tức gần hai lon rưỡi bia 330 ml loại 5%.

Về ánh sáng, các chuyên gia thống nhất khuyên: đèn mờ từ ba tiếng trước giờ ngủ, ban ngày đủ sáng, và phòng ngủ thật tối <a class="ev ev-mid" href="#r-brown2022" title="Brown 2022 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="sleep-regularity"><span class="num">10.2</span>Đều đặn quan trọng như lượng ngủ</h3>

Cuối tuần ngủ bù có sao không? Có. Giờ ngủ lệch giữa ngày làm và ngày nghỉ đẩy đồng hồ sinh học muộn đi, và ngủ bù không bù lại được. Cách giữ nhịp là cố định giờ thức dậy cả bảy ngày.

Ai từng đi Hàn Quốc hay Nhật về đều biết cảm giác lệch múi giờ mấy ngày đầu. Chẳng ai tuần nào cũng bay đi bay về như vậy, nhưng rất nhiều người ngủ như vậy: cuối tuần dịch giờ ngủ muộn đi vài tiếng, thứ Hai lại kéo về. Chênh lệch giờ ngủ giữa ngày làm và ngày nghỉ có tên là **social jetlag**, và nặng nhất ở người dưới 25 tuổi <a class="ev ev-mid" href="#r-wittmann2006" title="Wittmann 2006 · Bằng chứng vừa"></a>.

Giờ ngủ thất thường để lại dấu vết đo được. Sinh viên ngủ thất thường có đồng hồ sinh học muộn hơn người ngủ đều khoảng hai tiếng rưỡi <a class="ev ev-mid" href="#r-phillips2017" title="Phillips 2017 · Bằng chứng vừa"></a>. Nghĩa là dù cùng lên giường lúc 23:00, cơ thể người ngủ thất thường vẫn đang ở "buổi chiều".

Ngủ bù cuối tuần không bù được như người ta vẫn nghĩ. Trong một thử nghiệm, người tham gia ngủ thêm khoảng một tiếng vào cuối tuần nhưng vẫn bị rối loạn chuyển hoá, và đồng hồ sinh học còn bị đẩy muộn thêm <a class="ev ev-mid" href="#r-depner2019" title="Depner 2019 · Bằng chứng vừa"></a>.

Bài học chung: **giờ thức dậy là điểm cố định giữ nhịp** cho cả tuần. Giờ đi ngủ có thể xê dịch chút ít; giờ dậy thì giữ nguyên, kể cả Chủ nhật.

<details><summary>Đọc thêm: các con số về giờ ngủ thất thường</summary><div class="inner">

Chính tác giả của khái niệm social jetlag thừa nhận khái niệm này "có thể quá đơn giản" <a class="ev ev-low" href="#r-roenneberg2019" title="Roenneberg 2019 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

Trong nghiên cứu của Phillips, cơ thể nhóm ngủ thất thường bắt đầu tiết melatonin, tín hiệu "chuẩn bị ngủ", lúc 00:08, so với 21:32 ở nhóm ngủ đều <a class="ev ev-mid" href="#r-phillips2017" title="Phillips 2017 · Bằng chứng vừa"></a>.

Trên 60.977 người trong UK Biobank, nhóm ngủ đều đặn có nguy cơ tử vong thấp hơn 20%–48% so với nhóm thất thường nhất <a class="ev ev-mid" href="#r-windred2024" title="Windred 2024 · Bằng chứng vừa"></a>. Đây là kết quả quan sát, trên người lớn tuổi, nên chưa nói được đâu là nhân, đâu là quả.

Trong thử nghiệm của Depner, phần ngủ thêm cuối tuần là khoảng 1,1 tiếng <a class="ev ev-mid" href="#r-depner2019" title="Depner 2019 · Bằng chứng vừa"></a>. Một nghiên cứu cohort lớn không thấy tăng tử vong ở kiểu "ngủ ngắn trong tuần, dài cuối tuần" <a class="ev ev-low" href="#r-akerstedt2019" title="Åkerstedt 2019 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

Hai tuần liền dậy muộn ba tiếng thì đồng hồ lùi 2,4 tiếng <a class="ev ev-mid" href="#r-burgess2006" title="Burgess &amp; Eastman 2006 · Bằng chứng vừa"></a>, gần như bạn đã tự chuyển sang múi giờ khác.

</div></details>

<h3 id="sleep-shift"><span class="num">10.3</span>Dời giấc ngủ sớm hơn</h3>

Muốn dậy sớm để học thì dời giấc ngủ thế nào? Giữ giờ dậy cố định, ra ánh sáng ngoài trời buổi sáng, để đèn mờ buổi tối, và dời dần từng chút qua vài tuần. Đừng bao giờ dời bằng cách cắt bớt giờ ngủ.

Đồng hồ sinh học giống một chiếc đồng hồ cơ hơi chạy lệch, còn ánh sáng là ngón tay chỉnh kim. Chỉnh vào buổi sáng thì kim nhích lên sớm; chỉnh vào buổi tối thì kim lùi lại.

```mermaid
flowchart LR
  W["① Giờ thức cố định<br/>cả 7 ngày"] -->|"quyết định lúc nào<br/>ánh sáng sáng tới mắt"| L1
  L1["② Ánh sáng buổi sáng<br/>(sau điểm nhiệt độ<br/>cơ thể thấp nhất)"] -->|"kéo đồng hồ SỚM hơn"| C(("Đồng hồ<br/>sinh học"))
  L2["③ Ánh sáng buổi tối,<br/>màn hình sáng"] -->|"đẩy đồng hồ MUỘN hơn"| C
```

1. **Giờ thức cố định** là điểm bắt đầu, vì giờ thức quyết định lúc nào ánh sáng buổi sáng chạm tới mắt.
2. **Ánh sáng là thứ chỉnh đồng hồ chính.** Ánh sáng buổi sáng kéo đồng hồ sớm hơn <a class="ev ev-high" href="#r-khalsa2003" title="Khalsa 2003 · Bằng chứng mạnh"></a>, và không cần nhiều: một tiếng ánh sáng mạnh đã cho khoảng 40% tác dụng của gần bảy tiếng liền <a class="ev ev-high" href="#r-sthilaire2012" title="St Hilaire 2012 · Bằng chứng mạnh"></a>. Mười phút đi bộ ngoài trời mỗi sáng, chẳng hạn ra chợ mua đồ ăn sáng, đã là một liều ánh sáng đáng kể <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.
3. **Ánh sáng buổi tối** đẩy đồng hồ theo hướng ngược lại. Vì vậy tối để đèn mờ không phải chuyện cho đẹp.

Đồng hồ không dời nhanh được, nhưng dời dần thì làm được. Những người "cú đêm" đã dời được khoảng hai tiếng trong ba tuần nhờ vài quy tắc đơn giản <a class="ev ev-mid" href="#r-facerchilds2019" title="Facer-Childs 2019 · Bằng chứng vừa"></a>. Đó là giờ thức cố định, chỉ lệch 15–30 phút, kể cả cuối tuần; ra ánh sáng ngoài trời buổi sáng; caffeine trước 15:00; ngủ trưa trước 16:00.

Dậy sớm còn kèm một cái khó riêng: **sleep inertia**, trạng thái lờ đờ ngay sau khi thức, như chiếc xe máy sáng mùa đông phải nổ máy một lúc mới chạy ngọt. Lờ đờ nhất là 15–30 phút đầu <a class="ev ev-mid" href="#r-hilditch2019" title="Hilditch &amp; McHill 2019 · Bằng chứng vừa"></a>. Vì vậy nửa tiếng đầu của một buổi học sáng sớm nên dành cho việc nhẹ: ôn lại thẻ từ cũ, chưa vội học bài mới.

**Ví dụ: dời giờ thức sớm một tiếng để có buổi học sáng** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

1. *Tình huống.* Giả sử bạn đang ngủ khoảng 00:00–08:00, cuối tuần dễ ngủ muộn hơn. Bạn muốn có 30–60 phút buổi sáng để nghe tiếng Anh trước khi đi làm.
2. *Cơ chế dự đoán gì.* Chỉ đặt báo thức 06:00 mà vẫn ngủ lúc 00:00 tức là cắt bớt giấc ngủ — đúng cái bẫy "thấy vẫn ổn" trong thí nghiệm của Van Dongen. Còn nếu cuối tuần ngủ nướng, tuần nào đồng hồ sinh học cũng lại bị đẩy muộn.
3. *Bạn làm gì.* Tuần 1: cố định giờ dậy 07:30 cả bảy ngày, cuối tuần cũng vậy; dậy xong ra ngoài trời đi bộ 15 phút; tối bật đèn vàng mờ; nếu uống cà phê thì ly cuối trước 13:30. Tuần 2: dậy 07:00. Tuần 3: dậy 06:30. Tuần 4: 06:00. Giờ đi ngủ sẽ tự sớm lên theo, vì bạn buồn ngủ sớm hơn — đừng ép.
4. *Kết quả mong đợi.* Sau chừng ba, bốn tuần, bạn ngủ quanh 22:30 và dậy 06:00 mà không thấy thiếu ngủ. 15 phút đầu sau khi dậy vẫn lờ đờ, nên buổi học sáng mở đầu bằng ôn thẻ từ cũ, rồi mới tới bài nghe mới.

<div class="callout data"><div class="ct">Tự kiểm tra: đo social jetlag của bạn</div>

Hai tuần liền, mỗi sáng ghi giờ lên giường và giờ thức dậy <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Tính điểm giữa giấc ngủ (ví dụ ngủ 00:00, dậy 08:00 thì điểm giữa là 04:00) cho ngày đi làm và cho ngày nghỉ, rồi lấy hai con số trừ cho nhau <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Nếu chênh từ một tiếng trở lên, cuối tuần nào cơ thể bạn cũng đang "bay sang múi giờ khác", và việc nên làm trước tiên là kéo giờ dậy cuối tuần về gần giờ dậy ngày thường. Kèm theo đó, mỗi sáng chấm độ tỉnh táo lúc 10:00 từ 1 đến 5 — nếu thứ Hai lúc nào cũng tệ nhất tuần, đó là dấu vết của social jetlag <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<details><summary>Đọc thêm: các con số về dời đồng hồ, sleep inertia và sleep hygiene</summary><div class="inner">

Ánh sáng chỉ kéo đồng hồ sớm hơn khi đến sau điểm nhiệt độ cơ thể thấp nhất, tức vào buổi sáng <a class="ev ev-high" href="#r-khalsa2003" title="Khalsa 2003 · Bằng chứng mạnh"></a>. Một tiếng ánh sáng mạnh cho khoảng 40% tác dụng của 6,7 tiếng <a class="ev ev-high" href="#r-sthilaire2012" title="St Hilaire 2012 · Bằng chứng mạnh"></a>.

Thử dời giấc ngủ sớm một tiếng mỗi ngày trong ba ngày: dưới ánh sáng mờ, đồng hồ chỉ dịch được 0,6 tiếng; dưới ánh sáng mạnh liên tục thì dịch được 2,1 tiếng <a class="ev ev-mid" href="#r-burgess2003" title="Burgess 2003 · Bằng chứng vừa"></a>. Dời hai tiếng mỗi ngày thì quá nhanh, người tham gia khó ngủ <a class="ev ev-mid" href="#r-eastman2005" title="Eastman 2005 · Bằng chứng vừa"></a>. Nghiên cứu của Facer-Childs còn ít người tham gia <a class="ev ev-mid" href="#r-facerchilds2019" title="Facer-Childs 2019 · Bằng chứng vừa"></a>.

Sleep inertia thường không kéo dài quá 30 phút nếu không thiếu ngủ nặng <a class="ev ev-mid" href="#r-tassi2000" title="Tassi &amp; Muzet 2000 · Bằng chứng vừa"></a>. Chưa có bằng chứng rõ rằng mẹo nào, như cà phê hay tắm, giúp tỉnh ngay được <a class="ev ev-mid" href="#r-hilditch2019" title="Hilditch &amp; McHill 2019 · Bằng chứng vừa"></a>. Nếu thiếu ngủ, một giấc ngủ trưa ngắn tốt hơn ngủ nướng: trong một thí nghiệm, ngủ trưa 10 phút cho hiệu quả tốt nhất, còn 30 phút thì gây lờ đờ một lúc trước khi có lợi <a class="ev ev-mid" href="#r-brooks2006" title="Brooks &amp; Lack 2006 · Bằng chứng vừa"></a>.

Còn "sleep hygiene"? Tổng quan cho thấy phần lớn các lời khuyên, xét riêng từng cái trên người bình thường, chưa được kiểm chứng <a class="ev ev-low" href="#r-irish2015" title="Irish 2015 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Những phần có bằng chứng riêng là ánh sáng, caffeine, rượu, giờ thức cố định, và điện thoại trên giường. Những lời khuyên như "uống sữa ấm" không nằm trong danh sách đó.

</div></details>

<div class="recall">

**Câu hỏi nhớ lại — Phần I (chương 2–10).** Trả lời trong đầu trước, rồi mới mở đáp án.

<details><summary>Vì sao "cố gắng hơn" lúc tối thường thất bại, và nên làm gì thay thế?</summary><div class="inner">

Vì càng về cuối ngày, việc gì cần cố gắng cũng càng nặng, và lựa chọn buổi tối nghiêng về thứ có thưởng ngay — như bác tài cuối ca thấy cuốc xa "không bõ" (chương 4); còn kế hoạch thì viết lúc "cold" nên coi nhẹ trạng thái "hot" (chương 3). Thay vào đó: làm cho việc bắt đầu bớt tốn sức (việc nhỏ, chuẩn bị sẵn, có phần thưởng ngay bên trong) và đổi tình huống từ sớm (chương 5).

</div></details>

<details><summary>Người có self-control tốt khác người khác ở điểm nào?</summary><div class="inner">

Họ không thắng nhiều trận hơn mà đánh ít trận hơn: ít gặp cám dỗ, ít phải cưỡng lại, và dựa nhiều vào habit (Hofmann 2012; Milyavskaya & Inzlicht 2017; de Ridder 2012; Galla & Duckworth 2015).

</div></details>

<details><summary>Lỡ một ngày có làm hỏng việc hình thành habit không? Can thiệp nào mạnh nhất trong megastudy?</summary><div class="inner">

Không — lỡ một lần không ảnh hưởng đáng kể (Lally 2010). Trong megastudy 54 chương trình, cách hiệu quả nhất là thưởng nhỏ cho việc quay lại sau một buổi bị lỡ (Milkman 2021).

</div></details>

<details><summary>Dopamine lo phần "muốn" hay phần "thích", và vì sao điều đó giải thích việc lướt mà không vui?</summary><div class="inner">

Dopamine lo phần "muốn" (wanting), không lo phần "thích" (liking); nó còn báo độ chênh giữa phần thưởng đoán trước và phần thưởng thật. Feed như một dãy nắp chai khuyến mãi: lần nào cũng không chắc có trúng hay không, nên wanting cứ liên tục được khơi lên, dù từng video chỉ hơi hay.

</div></details>

<details><summary>Trì hoãn thực chất là để làm gì?</summary><div class="inner">

Để thấy dễ chịu ngay (mood repair). Khi người ta tin rằng tâm trạng của mình đã "đóng băng", không đổi được, thì trì hoãn vô bổ biến mất (Tice 2001).

</div></details>

<details><summary>Vì sao ngủ bù cuối tuần không phải giải pháp, và điểm cố định giữ nhịp giấc ngủ là gì?</summary><div class="inner">

Ngủ bù không ngăn được rối loạn chuyển hoá và còn đẩy đồng hồ sinh học muộn hơn (Depner 2019). Điểm cố định là giờ thức dậy cả 7 ngày, vì giờ thức quyết định lúc nào ánh sáng buổi sáng tới mắt.

</div></details>

</div>


<h2 id="part-2" class="part">Phần II — Những nền móng</h2>

<h2 id="people"><span class="num">11</span>Những người thân yêu</h2>

Một tối trong tuần, bạn vừa đi làm về. Trên lịch có dòng "8 giờ tới 9 giờ: luyện nghe tiếng Anh". Người yêu nhắn: "Tối nay đi ăn bún chả không?". Bạn trả lời "Để cuối tuần nhé", rồi cuối tuần lại vướng việc khác. Không phải bạn coi nhẹ người kia. Chỉ là buổi học có giờ giấc, có mục tiêu, có cảm giác "phải làm". Còn một bữa tối với người thân thì lúc nào cũng có vẻ dời được.

Khi lập kế hoạch tự cải thiện, người ta rất dễ chỉ để phần thời gian còn dư cho người yêu, bạn bè, gia đình. Bằng chứng lại cho thấy điều ngược lại. Quan hệ là một trong những yếu tố gắn chặt nhất với sức khoẻ, và với việc một ngày trôi qua dễ chịu hay nặng nề. Quan hệ cũng **cần thời gian đều đặn**, không thể chỉ sống nhờ những giờ thừa ra.

<h3 id="people-health"><span class="num">11.1</span>Quan hệ có thật sự ảnh hưởng tới sức khoẻ?</h3>

Quan hệ có ảnh hưởng tới sức khoẻ không, hay chỉ là chuyện tình cảm? Có, và ở mức ngang với những thứ bạn vẫn coi là chuyện sức khoẻ thật sự, như hút thuốc hay uống rượu.

Hãy hình dung hai người cùng tuổi, cùng thu nhập, cùng chế độ ăn. Người thứ nhất có vài người bạn hay rủ đi đâu đó, có gia đình hỏi han, có một nhóm chơi cầu lông mỗi tuần. Người thứ hai đi làm về là đóng cửa phòng. Qua nhiều năm, người thứ nhất có khả năng sống sót cao hơn khoảng 50%. Đó là kết quả gộp từ 148 nghiên cứu, và các tác giả đặt mức này ngang với hút thuốc và uống rượu <a class="ev ev-high" href="#r-holtlunstad2010" title="Holt-Lunstad 2010 · Bằng chứng mạnh"></a>.

Đừng nghĩ chuyện này chỉ dành cho người già. Cô lập xã hội, cô đơn và sống một mình đều đi kèm nguy cơ tử vong cao hơn, và mối liên hệ còn mạnh hơn ở những nhóm có tuổi trung bình dưới 65 <a class="ev ev-high" href="#r-holtlunstad2015" title="Holt-Lunstad 2015 · Bằng chứng mạnh"></a>. Tức là đúng với lứa tuổi của bạn bây giờ.

Điều này có nghĩa gì với bạn? Quan hệ không phải món ăn chơi, ăn xong cơm rồi mới tới lượt. Quan hệ đứng cùng hàng với ngủ đủ và vận động: những trụ cột của sức khoẻ lâu dài.

<details><summary>Đọc thêm: các con số và giới hạn của dữ liệu</summary><div class="inner">

Meta-analysis năm 2010 gom 148 nghiên cứu với 308.849 người. Khi quan hệ được đo kỹ hơn, gộp nhiều mặt cùng lúc như tình trạng hôn nhân, số người quen, mức tham gia các nhóm, thì khả năng sống sót gần như gấp đôi <a class="ev ev-high" href="#r-holtlunstad2010" title="Holt-Lunstad 2010 · Bằng chứng mạnh"></a>.

Đây là dữ liệu quan sát: người ta đếm và theo dõi, chứ không chia ngẫu nhiên ai được có bạn, ai phải sống một mình. Có thể người khoẻ sẵn thì dễ giữ quan hệ hơn. Chính các tác giả viết rằng quan hệ nhân quả "không dễ xác lập".

Nghiên cứu Harvard nổi tiếng về đời người cũng là quan sát. Họ theo dõi 237 sinh viên và 332 thanh niên nội thành từ thập niên 1930 tới tận tuổi già <a class="ev ev-mid" href="#r-vaillant2001" title="Vaillant &amp; Mukamal 2001 · Bằng chứng vừa"></a>. Khi những người này đã ở tuổi 80 và sống cùng vợ hoặc chồng, những ngày họ ở bên người khác nhiều hơn cũng là những ngày họ thấy vui hơn. Với người hài lòng về hôn nhân, một ngày ốm mệt không kéo tâm trạng xuống nhiều như ở người không hài lòng <a class="ev ev-mid" href="#r-waldinger2010" title="Waldinger &amp; Schulz 2010 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="people-daily"><span class="num">11.2</span>Giờ nào trong ngày dễ chịu nhất?</h3>

Giờ nào trong ngày của bạn dễ chịu nhất? Gần như chắc chắn là một giờ nằm ngoài giờ làm, và có người khác ở cùng.

Thử tua lại ngày hôm qua như xem lại một đoạn video, rồi chấm điểm từng cảnh: chen nhau trong dòng xe sáng, ngồi làm việc, ăn trưa, buổi tối ăn cơm và nói chuyện với người nhà. Các nhà nghiên cứu làm đúng như vậy với 909 phụ nữ đi làm. Mỗi người kể lại ngày hôm trước theo từng đoạn, rồi chấm mức cảm xúc tích cực cho từng hoạt động:

```chart hbar
hoạt động,cảm xúc tích cực (0–6)
Intimate relations,5.10
Socializing,4.59
Relaxing,4.42
Working,3.62
Commuting,3.45
```

<p class="small muted">5 trong 16 hoạt động. Nguồn: Kahneman et al. 2004, Science 306:1776–1780, Day Reconstruction Method.</p>

Làm việc và đi lại chiếm nhiều giờ nhất trong ngày, và cả hai nằm ở cuối bảng <a class="ev ev-mid" href="#r-kahneman2004" title="Kahneman 2004 · Bằng chứng vừa"></a>. Những giờ dễ chịu nhất **nằm ngoài giờ làm, và ở cùng người khác**.

Với người đi làm cả ngày, kết quả này rất thực tế. Buổi tối và cuối tuần là chỗ duy nhất còn lại cho những giờ dễ chịu nhất. Lấp kín chỗ đó bằng kế hoạch tự học là đem những giờ quý nhất đi đổi lấy những giờ bình thường <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<details><summary>Đọc thêm: chi tiết của nghiên cứu</summary><div class="inner">

Trong một ngày, làm việc chiếm 6,9 giờ, đi lại chiếm 1,6 giờ <a class="ev ev-mid" href="#r-kahneman2004" title="Kahneman 2004 · Bằng chứng vừa"></a>. Chấm theo người cùng hoạt động: bạn bè 4,36, họ hàng 4,17, vợ/chồng/người yêu 4,11, sếp 3,52. Đây là một mẫu thuận tiện, chỉ gồm phụ nữ.

</div></details>

<h3 id="people-partner"><span class="num">11.3</span>Giữ quan hệ tình cảm mà không cần thêm giờ</h3>

Bận học, bận làm, làm sao giữ cho quan hệ tốt mà không phải cắt bớt kế hoạch? Bạn cần chặn stress công việc lại trước cửa nhà, và dùng ba cách quan tâm gần như không tốn thêm giờ nào.

Bạn có một ngày tệ: sáng kẹt xe gần một tiếng, trưa bị trách oan một chuyện, chiều về gặp mưa ướt hết áo. Tối đó, người yêu kể chuyện trong ngày, và bạn trả lời cộc lốc <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Chẳng ai cố ý làm gì sai, vậy mà buổi tối vẫn mất vui. Sơ đồ dưới đây cho thấy stress bên ngoài len vào chuyện hai người theo hai đường:

```mermaid
flowchart LR
  S["Stress từ công việc<br/>hoặc kế hoạch quá tải"] -->|"① tâm trạng xấu"| M["Ít kiên nhẫn,<br/>ít chú ý"]
  M -->|"② cùng tối đó"| B["Giận, thu mình<br/>với người yêu"]
  S -->|"③ lấy mất thời gian<br/>và sự chú ý"| T["Ít việc nuôi<br/>sự gần gũi"]
  B --> Q["Chất lượng<br/>quan hệ giảm"]
  T --> Q
```

1. **Bực bội ở chỗ làm dễ theo bạn về nhà ngay tối đó** (mũi tên ① và ②). Một nghiên cứu cho 43 cặp vợ chồng ghi nhật ký mỗi ngày. Những ngày có va chạm ở chỗ làm, cả hai đều dễ nổi nóng và thu mình hơn khi về với nhau, một phần vì tâm trạng xấu mang theo từ chỗ làm <a class="ev ev-mid" href="#r-story2006" title="Story &amp; Repetti 2006 · Bằng chứng vừa"></a>. Vì vậy, đi làm về nên có một khoảng đệm ngắn trước khi bàn chuyện quan trọng: tắm, thay đồ, hay ngồi yên mười phút.
2. **Stress lấy mất thời gian và sự chú ý** (mũi tên ③), những thứ lẽ ra dành cho việc vun đắp sự gần gũi <a class="ev ev-mid" href="#r-neff2009" title="Neff &amp; Karney 2009 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-neff2017" title="Neff &amp; Karney 2017 · Bằng chứng vừa"></a>. Một kế hoạch học quá tải cũng là một nguồn stress như thế. Nó có thể làm hại quan hệ ngay cả khi trên lịch vẫn còn chỗ trống <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Đây cũng là lý do người thân yêu cần khung thời gian cố định trong tuần ([chương 17](#portfolio)).

Giờ đến ba cách quan tâm gần như không tốn thêm giờ.

**Thứ nhất, cách bạn đáp lại tin vui quan trọng hơn cách bạn đáp lại tin buồn.** Giả sử người yêu chạy về khoe: "Mình vừa thi đậu bằng lái xe!". Có bốn kiểu đáp lại <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>:

<div class="tbl"><table>
<thead><tr><th></th><th>Tích cực</th><th>Tiêu cực</th></tr></thead>
<tbody>
<tr><td><b>Chủ động</b></td><td>"Thật à? Thi có khó không, kể nghe đi!" — <b>active-constructive</b></td><td>"Có bằng rồi lại đòi mua xe mới chứ gì."</td></tr>
<tr><td><b>Thụ động</b></td><td>"Ừ, hay đấy." (mắt vẫn nhìn điện thoại)</td><td>"Ờ. Mà tối nay ăn gì?"</td></tr>
</tbody></table></div>

Chỉ ô đầu tiên mới vun đắp được quan hệ: chú tâm, hỏi thêm, vui cùng. Kiểu đáp lại này dự báo chất lượng quan hệ, và cả khả năng chia tay sau hai tháng, rõ hơn cách người ta phản ứng khi người kia gặp chuyện buồn <a class="ev ev-mid" href="#r-gable2004" title="Gable 2004 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-gable2006" title="Gable 2006 · Bằng chứng vừa"></a>.

**Một ví dụ đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** Tối cuối tuần, hai người hẹn đi ăn. Chiều nay bạn vừa to tiếng với chủ nhà trọ về tiền điện, và lúc dắt xe ra khỏi nhà, đầu vẫn còn nóng.

- *Tình huống.* Hai người vừa ngồi xuống quán, người yêu kể: "Sáng nay mình chạy được trọn năm cây số, lần đầu tiên đấy".
- *Cơ chế dự đoán gì.* Cục tức từ chiều đang chực theo bạn vào buổi tối, đúng mũi tên ① và ② ở sơ đồ trên. Phản xạ dễ nhất là buông một câu "Ừ, hay đấy", rồi quay sang kể chuyện cãi nhau với chủ nhà trọ.
- *Bạn làm gì.* Trước khi đi, bạn tắm rồi ngồi yên vài phút cho đầu óc nguội dần. Tới quán, điện thoại để yên trong túi. Khi người kia kể, bạn hỏi thêm hai câu: "Chạy ở đâu thế?" và "Đoạn nào mệt nhất?". Chuyện chủ nhà trọ để sau, nếu còn muốn kể.
- *Kết quả cần để ý.* Câu chuyện của người kia dài ra, và chuyện tiền điện không chiếm mất buổi tối. Không phải lần nào cũng được như vậy. Điều đáng làm là ghi lại xem những tối bạn làm thế có khác những tối không làm hay không.

**Thứ hai, cất điện thoại khi ở cạnh nhau.** Phubbing là cầm điện thoại lướt trong lúc đang ngồi với người kia. Thói quen này đi kèm mức hài lòng thấp hơn và nhiều xung đột hơn <a class="ev ev-mid" href="#r-ni2025" title="Ni 2025 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-roberts2016" title="Roberts &amp; David 2016 · Bằng chứng vừa"></a>. Trong ba việc, đây là việc dễ làm nhất.

**Thứ ba, cùng nhau làm một điều mới.** Trong một thử nghiệm với 101 cặp đôi, mỗi tuần dành 90 phút cho một hoạt động mới lạ, làm trong bốn tuần, đã nâng chất lượng quan hệ <a class="ev ev-mid" href="#r-coulter2013" title="Coulter &amp; Malouff 2013 · Bằng chứng vừa"></a>. Chín mươi phút vừa bằng một buổi tối. Thử một quán ăn chưa từng tới, sáng Chủ nhật chở nhau bằng xe máy ra ngoại thành, hay cùng nấu một món chưa nấu bao giờ. Đó không phải "thời gian chơi" lấy bớt từ kế hoạch, mà chính là lúc quan hệ được vun đắp <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<details><summary>Đọc thêm: thêm nghiên cứu, và vài điều người ta hay nói sai về tình yêu</summary><div class="inner">

Tổng quan 115 nghiên cứu theo dõi các cặp vợ chồng qua nhiều năm cho thấy stress dự báo hôn nhân kém hài lòng và kém bền hơn. Các tác giả đề xuất rằng stress không tự làm hỏng hôn nhân, mà tác động qua chính cách hai người đối xử với nhau. Đó là mô hình vulnerability–stress–adaptation <a class="ev ev-mid" href="#r-karney1995" title="Karney &amp; Bradbury 1995 · Bằng chứng vừa"></a>.

Số liệu về phubbing đến từ 52 nghiên cứu với gần 20.000 người <a class="ev ev-mid" href="#r-ni2025" title="Ni 2025 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-roberts2016" title="Roberts &amp; David 2016 · Bằng chứng vừa"></a>. Phần lớn chỉ chụp một thời điểm, nên chưa chắc điện thoại là nguyên nhân.

Trong phòng thí nghiệm, bảy phút làm một việc mới lạ cùng nhau đã nâng chất lượng quan hệ <a class="ev ev-mid" href="#r-aron2000" title="Aron 2000 · Bằng chứng vừa"></a>. Kết quả về hoạt động mới lạ chưa được nhóm độc lập nào lặp lại.

Khả năng gác công việc lại khi về nhà của hai người gắn với nhau <a class="ev ev-mid" href="#r-hahn2013" title="Hahn &amp; Dormann 2013 · Bằng chứng vừa"></a>. Một người cứ ôm việc về nhà làm tới khuya thì người kia cũng khó nghỉ cho thật. Vì vậy đây là thói quen của cả hai chứ không của riêng ai.

Câu "tỷ lệ 5 tương tác tích cực trên 1 tiêu cực dự đoán ly hôn chính xác trên 90%" đến từ một mẫu chỉ 73 cặp. Khi đem kiểm tra chéo, độ chính xác giảm mạnh <a class="ev ev-mid" href="#r-heyman2001" title="Heyman &amp; Slep 2001 · Bằng chứng vừa"></a>, và các phát hiện chính không lặp lại được <a class="ev ev-low" href="#r-kim2007" title="Kim, Capaldi &amp; Crosby 2007 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Con số "tỷ lệ tích cực 2,9013 là ngưỡng hưng thịnh" về sau được chỉ ra là sai về mặt toán học <a class="ev ev-high" href="#r-brown2013" title="Brown, Sokal &amp; Friedman 2013 · Bằng chứng mạnh"></a>.

Thời gian bên người yêu cũng không *tự động* là thời gian vui nhất: trong bảng ở mục 11.2, người yêu còn đứng sau bạn bè. *Cùng nhau làm gì* mới là điều quyết định.

</div></details>

<h3 id="people-friends"><span class="num">11.4</span>Bạn bè, gia đình, và việc chăm sóc người khác</h3>

Lâu không gặp thì tình bạn có phai không, và bỏ thời gian giúp người khác có đáng không? Tình bạn phai nhanh hơn tình thân, nên phải chủ động hẹn. Còn giúp người khác thì có lợi cho chính bạn, ở mức vừa phải.

Nghĩ về người bạn thân nhất hồi đại học. Nếu đã hai năm hai người không gặp, có lẽ giờ nói chuyện sẽ hơi gượng. Còn ông chú ở quê, ba năm mới gặp một lần vào dịp Tết, thì vẫn là ông chú như cũ. Nghiên cứu xác nhận cảm giác đó: khi liên lạc và hoạt động chung thưa dần, tình bạn **phai nhanh hơn quan hệ họ hàng** <a class="ev ev-mid" href="#r-roberts2011" title="Roberts &amp; Dunbar 2011 · Bằng chứng vừa"></a>. Họ hàng có sẵn những dịp tụ họp như Tết, đám giỗ, đám cưới. Tình bạn thì chỉ sống nhờ những lần chính hai người chủ động hẹn nhau <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

Hẹn nhau để làm gì? Số giờ ở cùng nhau dự báo độ thân của một tình bạn, và giờ **chơi** cùng nhau dự báo mạnh hơn giờ làm việc cùng nhau <a class="ev ev-mid" href="#r-hall2019" title="Hall 2019 · Bằng chứng vừa"></a>. Một buổi đánh cầu lông với bạn cũ là đúng loại giờ đó <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

Giúp người khác cũng là chăm sóc chính mình. Người hay giúp đỡ người khác có well-being cao hơn một chút. Mối liên hệ có thật nhưng nhỏ, và **giúp trực tiếp** gắn với lợi ích nhiều hơn giúp qua một tổ chức <a class="ev ev-high" href="#r-hui2020" title="Hui 2020 · Bằng chứng mạnh"></a>. Giúp trực tiếp (informal helping) là những việc như chở bạn ra sân bay, trông con giúp hàng xóm.

Và một kết quả nghe ngược đời nhưng đáng nhớ: **cho đi thời gian khiến người ta cảm thấy mình có nhiều thời gian hơn**. Cảm giác đó còn rõ hơn cả khi dùng chính khoảng đó cho bản thân, hay khi được tặng thêm giờ rảnh <a class="ev ev-mid" href="#r-mogilner2012" title="Mogilner 2012 · Bằng chứng vừa"></a>. Một buổi chiều giúp bạn chuyển nhà có thể để lại cảm giác "tuần này mình vẫn dư dả" hơn một buổi chiều nằm lướt điện thoại.

<details><summary>Đọc thêm: các con số về tình bạn và việc cho đi</summary><div class="inner">

Báo chí hay trích các con số kiểu "cần bao nhiêu giờ để thành bạn thân". Những con số đó không khớp nhau nên ở đây không dùng <a class="ev ev-mid" href="#r-hall2019" title="Hall 2019 · Bằng chứng vừa"></a>.

Con số "150 người" của Dunbar hay được nhắc như giới hạn cứng số bạn bè một người giữ được, nhưng không có cơ sở chắc. Khi phân tích lại, con số hợp lý có thể nằm ở bất kỳ đâu từ 4 tới 520. Các tác giả kết luận rằng cố chỉ ra một con số cụ thể là vô ích <a class="ev ev-low" href="#r-lindenfors2021" title="Lindenfors 2021 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

Kết quả về việc giúp đỡ gộp từ 201 nghiên cứu với gần 200.000 người <a class="ev ev-high" href="#r-hui2020" title="Hui 2020 · Bằng chứng mạnh"></a>.

Làm những việc tử tế cũng nâng well-being của chính người làm ở mức nhỏ đến vừa. Các nghiên cứu còn nhỏ và chỉ đo tác dụng ngắn hạn <a class="ev ev-mid" href="#r-curry2018" title="Curry 2018 · Bằng chứng vừa"></a>.

Tiêu tiền cho người khác có làm mình vui hơn không? Khi các nhà nghiên cứu đăng ký trước rồi làm lại, kết quả lẫn lộn: một thí nghiệm lặp lại được, một không, một có nhưng nhỏ <a class="ev ev-mid" href="#r-aknin2020" title="Aknin 2020 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="people-leisure"><span class="num">11.5</span>Thời gian rảnh: đủ, và để thô</h3>

Thời gian rảnh có phải là lãng phí, và có nên xếp nó vào lịch cho chặt? Không lãng phí, nhưng cũng không phải càng nhiều càng tốt. Và khi xếp vào lịch thì nên để thô, đừng định giờ chính xác.

Thời gian rảnh có tác dụng thật, chứ không chỉ là khoảng trống giữa hai việc. Trong lúc rảnh, đầu óc rời khỏi công việc để hồi sức, bạn được tự chọn mình làm gì, thấy mình giỏi lên ở một thứ, làm điều mình thấy có ý nghĩa, và gắn bó với người khác <a class="ev ev-mid" href="#r-newman2014" title="Newman, Tay &amp; Diener 2014 · Bằng chứng vừa"></a>. Một buổi đánh cầu lông với bạn bè có đủ cả năm điều đó.

Nhưng nhiều hơn không phải lúc nào cũng tốt hơn. Nhớ lại một kỳ nghỉ Tết dài: mấy ngày đầu ngủ nướng, ăn uống, gặp họ hàng, sướng. Gần hết kỳ nghỉ thì bắt đầu thấy trống trải, lướt điện thoại mãi mà không vui. Dữ liệu lớn cho thấy đúng hình dạng đó. Quá ít thời gian rảnh thì kiệt sức, quá nhiều thì well-being bắt đầu đi xuống. Đoạn đi xuống nhẹ hẳn khi một phần thời gian rảnh được dùng vào việc có ích <a class="ev ev-mid" href="#r-sharif2021b" title="Sharif, Mogilner &amp; Hershfield 2021 · Bằng chứng vừa"></a>.

Phát hiện quan trọng nhất cho người thích lập kế hoạch nằm ở cách ghi lịch. So sánh hai dòng:

- "Chủ nhật 15h00–17h00: cà phê với nhóm bạn"
- "Chiều Chủ nhật: cà phê với nhóm bạn"

Ghi như dòng thứ nhất, buổi cà phê hoá giống một việc phải làm cho xong và kém vui hơn. **Giải trí mà hẹn giờ chính xác thì hoá giống công việc.** Lên lịch "thô" như dòng thứ hai thì xoá được hiệu ứng này: biết là chiều đó sẽ đi, nhưng không định giờ bắt đầu, giờ kết thúc <a class="ev ev-mid" href="#r-tonietto2016" title="Tonietto &amp; Malkoc 2016 · Bằng chứng vừa"></a>.

<details><summary>Đọc thêm: DRAMMA, cảm giác dư dả thời gian, và chuyện công việc lấn sang gia đình</summary><div class="inner">

Năm tác dụng của thời gian rảnh được gọi tắt là DRAMMA: detachment-recovery (đầu óc rời công việc và hồi sức), autonomy (tự chọn làm gì), mastery (thấy mình giỏi lên), meaning (làm điều có ý nghĩa), affiliation (gắn bó với người khác) <a class="ev ev-mid" href="#r-newman2014" title="Newman, Tay &amp; Diener 2014 · Bằng chứng vừa"></a>. Quan hệ giữa lượng thời gian rảnh và well-being có hình chữ U ngược <a class="ev ev-mid" href="#r-sharif2021b" title="Sharif, Mogilner &amp; Hershfield 2021 · Bằng chứng vừa"></a>.

Một khoảng rảnh mà ngay sau đó là một việc phải làm cũng *cảm thấy* ngắn hơn thực tế <a class="ev ev-mid" href="#r-tonietto2019" title="Tonietto, Malkoc &amp; Nowlis 2019 · Bằng chứng vừa"></a>. Một tiếng rảnh trước giờ hẹn khám răng lúc 15h trôi nhanh hơn một tiếng rảnh không có gì chờ phía sau.

Cảm giác dư dả thời gian (time affluence) gắn với well-being, bất kể người đó giàu hay nghèo <a class="ev ev-mid" href="#r-kasser2009" title="Kasser &amp; Sheldon 2009 · Bằng chứng vừa"></a>.

Bỏ tiền thuê người làm việc vặt để mua lại thời gian làm tăng cảm xúc tích cực <a class="ev ev-mid" href="#r-whillans2017" title="Whillans 2017 · Bằng chứng vừa"></a>. Ví dụ: gọi dịch vụ dọn nhà để có thêm buổi sáng Chủ nhật.

Khi công việc lấn sang gia đình, hay gia đình lấn sang công việc, cả công việc, gia đình lẫn sức khoẻ đều đi xuống <a class="ev ev-high" href="#r-amstad2011" title="Amstad 2011 · Bằng chứng mạnh"></a>.

</div></details>

<div class="callout why"><div class="ct">Ý chính của chương</div>

Người thân yêu cần **khung giờ cố định** trong tuần, vì mục tiêu không có phần thưởng rõ ràng sẽ luôn phải nhường chỗ cho mục tiêu có deadline. Nhưng **làm gì** trong khung đó thì nên để thô. Những cách quan tâm dễ nhất lại không tốn thêm giờ: cất điện thoại, chú tâm khi người kia kể chuyện vui, một tin nhắn hỏi thăm. Và đừng lấp kín mọi khoảng trống bằng mục tiêu.

</div>

<div class="callout data"><div class="ct">Tự kiểm tra: tin vui và chiếc điện thoại</div>

Trong một tuần, mỗi lần người yêu hay bạn bè kể một tin vui, ghi một dòng vào ghi chú trên điện thoại: bạn đã đáp theo ô nào trong bảng bốn ô ở [§11.3](#people-partner), và lúc đó điện thoại đang ở đâu. Tối thứ Tư, thử để điện thoại trong túi suốt bữa ăn, rồi so với tối thứ Bảy để điện thoại trên bàn: tối nào hai người nói chuyện lâu hơn? Nếu phần lớn các dòng rơi vào ô "Ừ, hay đấy" và lúc đó điện thoại đang trên tay, thì chỗ cần sửa không phải là thêm giờ, mà là cách có mặt trong những giờ đã có <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="body-money"><span class="num">12</span>Cơ thể và tiền bạc</h2>

Tập thể dục và tiết kiệm trông chẳng liên quan gì tới nhau, nhưng cả hai giống nhau ở một điểm. Hôm nay bỏ một buổi tập, cơ thể không thay đổi gì. Hôm nay tiêu thêm 500 nghìn, tài khoản cũng chẳng khác là bao. Lợi ích của cả hai đến **rất chậm và vô hình**, còn cái giá như mỏi người, tiếc tiền thì đến **ngay lập tức**.

Nhớ lại người lập kế hoạch và người thực hiện ở [chương 3](#cold-and-hot): phần thưởng càng xa thì đến lúc phải quyết định càng ít sức hút. Cơ thể và tiền là hai mục tiêu có phần thưởng xa nhất. Nếu để ý chí quyết định mỗi ngày thì ý chí gần như luôn thua. Cách giải chung cho cả hai là **đưa quyết định ra khỏi khoảnh khắc**.

Hãy nghĩ tới chuyện đặt báo thức. Bạn không đợi tới 8h sáng mới quyết có dậy hay không. Bạn quyết từ tối hôm trước, lúc còn tỉnh táo, rồi để cái đồng hồ lo phần còn lại. Với cơ thể và tiền cũng vậy: cài sẵn một default lúc đầu óc còn tỉnh, như bộ đồ tập để sẵn cạnh giường, lệnh chuyển tiền tự động đúng ngày lương về. Lúc mệt sẽ không còn gì phải quyết. Rồi thu nhỏ việc tới mức gần như không thể thất bại, và tính theo tổng cả tuần thay vì đòi từng ngày phải hoàn hảo <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<h3 id="body"><span class="num">12.1</span>Vận động: tính theo tổng tuần</h3>

Đi làm cả ngày, về tới nhà đã tối, phải tập bao nhiêu mới đủ? Ít hơn bạn nghĩ, vì mọi đợt vận động đều được tính, kể cả quãng đi bộ ra chợ. Cộng theo tổng tuần, bạn đã đi được gần hết chặng đường.

Theo hướng dẫn năm 2020 của WHO, mỗi tuần một người trưởng thành nên có ít nhất 150–300 phút vận động vừa, như đi bộ nhanh hay đạp xe thong thả. Cộng thêm từ 2 ngày mỗi tuần tập sức mạnh, tác động tới tất cả các nhóm cơ lớn <a class="ev ev-high" href="#r-bull2020" title="Bull 2020 · Bằng chứng mạnh"></a>. Điểm có ích nhất cho người bận rộn: **mọi đợt vận động đều được tính, dài bao nhiêu cũng được**. WHO đã bỏ yêu cầu cũ "mỗi đợt tối thiểu 10 phút".

Lợi ích của vận động giống ăn cơm lúc đói. Bát đầu tiên thay đổi nhiều nhất, sang bát thứ ba thì mỗi bát thêm chẳng khác là bao. Tập sức mạnh là ví dụ rõ: người có tập có nguy cơ tử vong thấp hơn, và lợi ích lớn nhất nằm quanh 30–60 phút mỗi tuần <a class="ev ev-mid" href="#r-momma2022" title="Momma 2022 · Bằng chứng vừa"></a>. Hai buổi ngắn mỗi tuần đã chạm vùng đó.

Bạn cũng không cần rải đều. Ai chỉ có thời gian tập vào thứ Bảy, Chủ nhật vẫn nhận được lợi ích gần bằng người tập rải đều <a class="ev ev-mid" href="#r-odonovan2017" title="O&#x27;Donovan 2017 · Bằng chứng vừa"></a>. Với người đi làm cả tuần, đó là tin tốt: ngày thường là chỗ cho quãng đi bộ, cuối tuần là chỗ cho buổi tập.

Thử cộng theo tổng tuần <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Mười phút đi bộ nhanh buổi sáng và mười phút buổi tối, như đi bộ ra chợ hay ra bến xe buýt, đã là 20 phút mỗi ngày × 5 ngày = 100 phút. Thêm một buổi đi bộ dài hay đánh cầu lông 60 phút vào Chủ nhật: 160 phút, đã nằm trong khoảng 150–300 phút của WHO. Hai buổi tập sức mạnh 20 phút ở nhà vào thứ Bảy và Chủ nhật (hít đất, squat, plank, sau này thêm tạ đơn): 40 phút, đúng vùng 30–60 phút có lợi nhiều nhất. Không có ngày nào phải "tập thật nặng". Tuần nào lỡ một buổi thì tổng vẫn còn gần đủ.

Điều gì giúp bạn tập được lâu dài? Không phải kỷ luật thép, mà là mức thích thú với việc tập. Mức thích thú có liên hệ khá rõ với lượng vận động thực tế <a class="ev ev-mid" href="#r-rhodes2009" title="Rhodes 2009 · Bằng chứng vừa"></a>. Vì vậy buổi Chủ nhật nên là thứ bạn thích, tốt nhất là đi cùng người yêu hay bạn bè: một công đôi việc, vừa vận động, vừa vun đắp quan hệ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<details><summary>Đọc thêm: liều lượng, những đợt rất ngắn, và tâm trạng</summary><div class="inner">

Hướng dẫn WHO còn cho phép thay 150–300 phút vận động vừa bằng 75–150 phút vận động mạnh, như chạy hay đá bóng. Buổi tập sức mạnh nên ở mức vừa trở lên. Hướng dẫn nhấn mạnh "some physical activity is better than none": thay thời gian ngồi bằng vận động ở bất kỳ cường độ nào, kể cả nhẹ, cũng có lợi <a class="ev ev-high" href="#r-bull2020" title="Bull 2020 · Bằng chứng mạnh"></a>.

Người có tập sức mạnh có nguy cơ tử vong thấp hơn 10–17% <a class="ev ev-mid" href="#r-momma2022" title="Momma 2022 · Bằng chứng vừa"></a>.

Ở người dưới 60 tuổi, nguy cơ tử vong giảm dần cho tới khoảng 8.000–10.000 bước mỗi ngày rồi đi ngang <a class="ev ev-mid" href="#r-paluch2022" title="Paluch 2022 · Bằng chứng vừa"></a>. Khi đã tính số bước, đi nhanh hay đi chậm không còn tạo khác biệt <a class="ev ev-mid" href="#r-saintmaurice2020" title="Saint-Maurice 2020 · Bằng chứng vừa"></a>.

Ở người không tập thể dục, khoảng ba đợt vận động mạnh mỗi ngày, mỗi đợt một đến hai phút như leo cầu thang thật nhanh, gắn với nguy cơ tử vong thấp hơn rõ rệt <a class="ev ev-mid" href="#r-stamatakis2022" title="Stamatakis 2022 · Bằng chứng vừa"></a>. Leo 60 bậc thang ba lần mỗi ngày, ba ngày mỗi tuần, trong sáu tuần làm tăng sức bền tim phổi, dù mức tăng khiêm tốn <a class="ev ev-mid" href="#r-jenkins2019" title="Jenkins 2019 · Bằng chứng vừa"></a>. Đi cầu thang bộ thay thang máy ở chung cư là một cách dùng kết quả này <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

Một tổng hợp từ 97 bài tổng quan, gộp hơn 1.000 thử nghiệm, cho thấy vận động giảm triệu chứng trầm cảm và lo âu. Phần lớn các bài tổng quan đó chất lượng còn thấp <a class="ev ev-mid" href="#r-singh2023b" title="Singh 2023 · Bằng chứng vừa"></a>.

Với người đã được chẩn đoán trầm cảm (major depressive disorder), đi bộ hay chạy, yoga và tập sức mạnh đều có tác dụng, dù bằng chứng chưa thật chắc <a class="ev ev-mid" href="#r-noetel2024" title="Noetel 2024 · Bằng chứng vừa"></a>. Nếu đang điều trị thì bàn với bác sĩ, đừng tự bỏ thuốc.

Đứng dậy đi lại xen giữa những quãng ngồi lâu giúp cải thiện đường huyết và insulin trong các thử nghiệm ngắn hạn <a class="ev ev-mid" href="#r-loh2020" title="Loh 2020 · Bằng chứng vừa"></a>.

Tập cùng người khác giúp duy trì việc tập ở mức nhỏ đến vừa <a class="ev ev-mid" href="#r-carron1996" title="Carron 1996 · Bằng chứng vừa"></a>. Một lịch tập đều đặn, đơn giản dễ thành habit <a class="ev ev-mid" href="#r-kaushal2015" title="Kaushal &amp; Rhodes 2015 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="money"><span class="num">12.2</span>Tiền bạc: cài sẵn một lần</h3>

Lương về rồi hết, làm sao tiết kiệm mà không phải gồng ý chí mỗi tháng? Cài một lệnh chuyển tự động vào đúng ngày lương về, một lần duy nhất. Từ đó việc tiết kiệm không còn là quyết định của từng tháng.

Phần lớn chúng ta không thật sự "quyết định" tiết kiệm. Ở Đan Mạch, các nhà kinh tế thấy 85% người dân là "passive savers", tức người tiết kiệm thụ động. Ưu đãi thuế hầu như không lay chuyển được họ. Nhưng một khoản đóng góp tự động cài sẵn thì quyết định gần như toàn bộ việc họ tiết kiệm bao nhiêu <a class="ev ev-high" href="#r-chetty2014" title="Chetty 2014 · Bằng chứng mạnh"></a>.

Thí nghiệm tự nhiên nổi tiếng nhất về default cho thấy điều đó rất rõ:

```chart bar
nhóm nhân viên mới,% tham gia quỹ hưu trí
Phải tự đăng ký,37
Được đăng ký sẵn (default),86
```

<p class="small muted">Nguồn: Madrian & Shea 2001, QJE; số liệu trong bản working paper của NBER.</p>

Một công ty đổi đúng một ô trong mẫu đơn: từ "đánh dấu nếu muốn tham gia" thành "đánh dấu nếu không muốn tham gia". Tỷ lệ tham gia quỹ hưu trí nhảy từ 37% lên 86%. Nhưng có một mặt trái: 76% người được đăng ký sẵn cứ thế ở lại đúng mức đóng mặc định 3%, dù mức đó thấp <a class="ev ev-high" href="#r-madrian2001" title="Madrian &amp; Shea 2001 · Bằng chứng mạnh"></a>. Default vừa là sàn vừa là trần. Nó quyết định bạn có tiết kiệm hay không, và quyết định luôn cả bạn tiết kiệm bao nhiêu. Vì vậy phải chọn mức tự động có chủ đích, ngay từ đầu.

Áp vào lương hằng tháng của bạn, cơ chế này gồm ba bước:

```mermaid
flowchart LR
  P["Ngày nhận lương"] -->|"① tự động, không cần quyết định"| S["Tài khoản riêng<br/>có tên mục đích"]
  P --> A["Tài khoản tiêu dùng"]
  A -->|"② chỉ tiêu phần còn lại"| X["Chi tiêu tháng"]
  R["Lần tăng lương sau"] -->|"③ cam kết từ bây giờ:<br/>một phần vào tiết kiệm"| S
```

1. **Đặt lệnh chuyển tự động vào ngày nhận lương** sang một tài khoản riêng. Tiền đã sang tài khoản kia trước khi bạn kịp nhìn thấy, nên tháng nào cũng không phải quyết lại.
2. **Tách và đặt tên tài khoản**, như "Quỹ dự phòng", "Học tập". Một khoản tiền có tên khó tiêu hơn hẳn. Chỉ cần chia tiền ra hai tài khoản là người ta đã tiết kiệm được nhiều hơn <a class="ev ev-mid" href="#r-soman2011" title="Soman &amp; Cheema 2011 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-thaler1999" title="Thaler 1999 · Bằng chứng vừa"></a>.
3. **Cam kết trước cho lần tăng lương sau.** Hứa bỏ tiền ra bây giờ thì đau. Hứa bỏ ra một phần số tiền *chưa có* thì gần như không đau. Chương trình Save More Tomorrow dựa đúng vào điều đó và đưa tỷ lệ tiết kiệm từ 3,5% lên 13,6% <a class="ev ev-mid" href="#r-thaler2004" title="Thaler &amp; Benartzi 2004 · Bằng chứng vừa"></a>.

**Một ngày lương, đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.**

- *Tình huống.* Lương về vào buổi sáng. Tối hôm đó bạn đi làm về, mệt, và trong giỏ hàng có một chiếc tai nghe đang giảm giá.
- *Cơ chế dự đoán gì.* Nếu khoản tiết kiệm phải chờ bạn tự chuyển "khi nào nhớ", khoản đó phải đọ sức trực tiếp với chiếc tai nghe, thứ có ngay trong tay, vào đúng lúc bạn đuối sức nhất. Cuối tháng, khoản tiết kiệm thành "phần còn lại".
- *Bạn làm gì.* Một lần duy nhất, vào một sáng Chủ nhật tỉnh táo, bạn cài lệnh chuyển tự động một khoản cố định sang tài khoản tên "Quỹ dự phòng", thực hiện đúng ngày lương về. Bạn chọn con số có chủ đích, vì như thí nghiệm quỹ hưu trí cho thấy, người ta thường giữ nguyên con số mặc định mãi.
- *Kết quả.* Sáng ngày lương, tiền đã đi trước khi bạn kịp mở app mua sắm. Mua hay không mua tai nghe vẫn là quyết định của bạn, nhưng giờ quyết định đó chỉ đụng tới tài khoản tiêu dùng.

Một quỹ dự phòng rút được ngay không chỉ để phòng thân. Xe máy hỏng giữa tuần hay phải đi khám răng bất ngờ, có sẵn tiền thì đó chỉ là chuyện phiền, chứ không thành chuyện cuống cuồng. Lượng tiền sẵn có trong tài khoản gắn với cảm giác ổn định tài chính, và qua đó với mức hài lòng cuộc sống, bất kể thu nhập cao hay thấp <a class="ev ev-mid" href="#r-ruberton2016" title="Ruberton 2016 · Bằng chứng vừa"></a>.

Còn sự nghiệp thì sao? Bằng chứng mỏng hơn nhiều người nghĩ, và chưa có công thức nào được chứng minh. Điều áp dụng được là phần chung của cả cuốn sách: chọn mục tiêu học có chủ đích, đo, review, và chủ động định hình công việc của mình.

<details><summary>Đọc thêm: thêm về tiết kiệm, và bằng chứng về sự nghiệp</summary><div class="inner">

Kết quả ở Đan Mạch đến từ 41 triệu quan sát <a class="ev ev-high" href="#r-chetty2014" title="Chetty 2014 · Bằng chứng mạnh"></a>.

Một tài khoản có khoá, khó rút, còn mạnh hơn tài khoản chỉ có tên. Trong một thử nghiệm ngẫu nhiên, sau 12 tháng, số dư của nhóm có tài khoản khoá tăng hơn nhóm đối chứng 81 điểm phần trăm <a class="ev ev-high" href="#r-ashraf2006" title="Ashraf, Karlan &amp; Yin 2006 · Bằng chứng mạnh"></a>.

Save More Tomorrow đạt mức 13,6% sau 40 tháng <a class="ev ev-mid" href="#r-thaler2004" title="Thaler &amp; Benartzi 2004 · Bằng chứng vừa"></a>.

Job crafting là chủ động thay đổi nhiệm vụ, các mối quan hệ và cách mình nhìn công việc <a class="ev ev-mid" href="#r-wrzesniewski2001" title="Wrzesniewski &amp; Dutton 2001 · Bằng chứng vừa"></a>. Khi đem ra thử nghiệm, cách này chỉ cho hiệu ứng nhỏ <a class="ev ev-mid" href="#r-oprea2019" title="Oprea 2019 · Bằng chứng vừa"></a>.

Deliberate practice là luyện tập có chủ đích, nhắm vào điểm yếu, có feedback. Nó giải thích được 26% khác biệt thành tích trong các trò chơi như cờ, 21% trong âm nhạc, 18% trong thể thao, 4% trong giáo dục và chưa tới 1% trong các nghề nghiệp <a class="ev ev-mid" href="#r-macnamara2014" title="Macnamara 2014 · Bằng chứng vừa"></a>. Nói cách khác, ở chỗ làm, số giờ luyện tập chỉ là một phần rất nhỏ của câu chuyện. Năm 2018 bài này có một bản đính chính mà cuốn sách chưa đọc được.

Quy tắc "70% kỹ năng học được qua công việc" cũng có cơ sở yếu <a class="ev ev-low" href="#r-clardy2018" title="Clardy 2018 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: tiền và cơ thể khi bạn không quyết định gì</div>

Mở app ngân hàng, xem ba kỳ lương gần nhất: ngày lương về, tiền tự đi đâu mà không cần bạn bấm gì, và số dư còn bao nhiêu vào ngày trước kỳ lương kế tiếp. Nếu không có lệnh tự động nào và số dư lần nào cũng gần về không, thì default của bạn đang là "tiết kiệm phần còn lại", tức gần như không tiết kiệm. Với vận động, xem số bước trong app sức khoẻ của điện thoại cho bảy ngày qua và cộng số phút đi bộ nhanh theo tổng tuần, đừng chấm từng ngày. Nếu tổng dưới 150 phút, thứ dễ thêm nhất thường là quãng đi bộ sẵn có mỗi chiều chứ không phải một buổi tập mới <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="learning"><span class="num">13</span>Học</h2>

<h3 id="retrieval"><span class="num">13.1</span>Nhớ lâu nhờ tự nhớ lại</h3>

Đọc lại ghi chú mấy lượt mà tuần sau vẫn quên, vì sao? Vì đọc lại chỉ làm chữ trông quen mắt, chứ không luyện việc tự lôi kiến thức ra. Hãy tự hỏi mình trước khi nhìn đáp án, và ôn cách quãng vài ngày.

Hai cách để thuộc đường tới nhà một người bạn mới: ngồi sau xe để bạn ấy chở tới năm lần, hoặc nghe chỉ đường một lần rồi tự chạy xe tới. Cách thứ nhất nhẹ nhàng hơn nhiều, đến lần thứ năm thì nhìn đâu cũng thấy quen. Nhưng tuần sau, người từng tự cầm lái mới là người tìm được đường.

Có lẽ đây là thí nghiệm quan trọng nhất của khoa học về học tập. Sinh viên học một đoạn văn theo ba cách, rồi một tuần sau làm bài kiểm tra:

```chart bar
cách học,% nhớ được sau 1 tuần
Đọc 4 lần,40
Đọc 3 lần + tự kiểm tra 1 lần,56
Đọc 1 lần + tự kiểm tra 3 lần,61
```

<p class="small muted">Nguồn: Roediger & Karpicke 2006, Psych Sci 17(3):249–255, thí nghiệm 2. "Tự kiểm tra" = tự nhớ lại mà không nhìn tài liệu.</p>

Nhóm chỉ đọc nhớ **ít nhất**, nhưng lại **tự tin nhất** <a class="ev ev-high" href="#r-roediger2006" title="Roediger &amp; Karpicke 2006 · Bằng chứng mạnh"></a>. Khi đọc lại, mắt gặp lại những chữ quen, và cái quen đó cho cảm giác "mình biết rồi". Nhưng nhận ra một thứ khi nó nằm ngay trước mặt khác hẳn với tự lôi nó ra khi trang giấy đã gấp lại. Bài kiểm tra, buổi phỏng vấn hay lúc cần dùng thật chỉ đòi việc thứ hai. Cảm giác trôi chảy ấy đánh lừa người học: tưởng mình đã thuộc nên dừng sớm.

Tự nhớ lại thì khó chịu hơn, phải vấp, phải cố lôi ra. Nhưng mỗi lần cố như vậy là thêm một lần đi trên lối mòn dẫn tới ký ức đó. Như Lỗ Tấn viết, trên mặt đất vốn làm gì có đường, người ta đi mãi thì thành đường. Cách học này có tên là retrieval practice: tự kiểm tra, dùng flashcard, trả lời trước khi lật.

**Một ví dụ đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** Một buổi tối trong tuần. Tuần này bạn gặp 20 từ tiếng Anh mới trong cuốn truyện đang đọc.

- *Cách quen tay.* Mở danh sách, đọc lại từ và nghĩa ba lượt. Mất mười phút, và cảm giác rất ổn: từ nào nhìn cũng quen.
- *Cơ chế dự đoán gì.* Cái quen đó là quen *mặt chữ*. Tuần sau, nghe chữ "reluctant" trong một bộ phim, bạn biết mình đã gặp nó, nhưng nghĩa không bật ra kịp.
- *Cách làm theo retrieval.* Che cột nghĩa, nhìn từ và tự nói nghĩa ra trước khi lật. Từ nào sai thì xếp xuống cuối, hỏi lại. Cũng mười phút, nhưng khó chịu hơn: lượt đầu có khi chỉ nhớ được một nửa.
- *Kết quả cần nhìn.* Thứ Ba tuần sau, tự kiểm tra lại cả 20 từ. Cách thứ hai cho cảm giác tệ hơn lúc học, và đó chính là điều thí nghiệm ở trên dự đoán: cảm giác lúc học và kết quả sau một tuần đi ngược nhau.

Kỹ thuật mạnh thứ hai là **giãn cách** (spacing). Tưới cây một xô nước một lần thì nước tràn ra ngoài. Chia xô đó ra tưới nhiều ngày thì đất ngấm hết. Trí nhớ cũng vậy:

```chart bar
cách phân bổ,% nhớ được
Dồn một lần (massed),36.7
Chia nhiều lần (spaced),47.3
```

<p class="small muted">Nguồn: Cepeda et al. 2006, Psych Bull 132(3):354–380, trung bình qua 271 so sánh.</p>

Cùng một lượng thời gian, chia ra nhiều lần cách quãng cho kết quả tốt hơn dồn vào một lần <a class="ev ev-high" href="#r-cepeda2006" title="Cepeda 2006 · Bằng chứng mạnh"></a>. Nên cách bao lâu thì tuỳ vào việc bạn cần nhớ trong bao lâu. Cần nhớ một tuần thì ôn lại sau khoảng hai, ba ngày. Cần nhớ cả năm thì cách nhau chừng ba tuần tới một tháng <a class="ev ev-high" href="#r-cepeda2008" title="Cepeda 2008 · Bằng chứng mạnh"></a>.

<details><summary>Đọc thêm: các con số, và ba kỹ thuật khác có bằng chứng tốt</summary><div class="inner">

Trong thí nghiệm của Roediger & Karpicke, nhóm chỉ đọc đã lướt qua đoạn văn trung bình 14,2 lần, nhóm tự kiểm tra chỉ 3,4 lần <a class="ev ev-high" href="#r-roediger2006" title="Roediger &amp; Karpicke 2006 · Bằng chứng mạnh"></a>.

Tổng hợp nhiều nghiên cứu xác nhận rằng retrieval practice hiệu quả rõ rệt hơn đọc lại <a class="ev ev-high" href="#r-dunlosky2013" title="Dunlosky 2013 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-adesope2017" title="Adesope 2017 · Bằng chứng mạnh"></a>. Còn đọc lại, highlight và tóm tắt, những cách học phổ biến nhất, lại nằm trong nhóm hiệu quả thấp <a class="ev ev-high" href="#r-dunlosky2013" title="Dunlosky 2013 · Bằng chứng mạnh"></a>.

Trong học ngoại ngữ, hiệu ứng giãn cách ở mức vừa đến lớn <a class="ev ev-high" href="#r-kim2022" title="Kim &amp; Webb 2022 · Bằng chứng mạnh"></a>.

Quy tắc chính xác: khoảng cách tốt nhất vào chừng 20–40% thời gian cần nhớ nếu chỉ cần nhớ một tuần, và 5–10% nếu cần nhớ một năm <a class="ev ev-high" href="#r-cepeda2008" title="Cepeda 2008 · Bằng chứng mạnh"></a>. Các con số ngày ở trên là quy đổi từ quy tắc này.

**Self-explanation**: tự giải thích *vì sao* một điều đúng, thay vì chỉ ghi nhận rằng nó đúng. Hiệu quả ở mức vừa, khá chắc <a class="ev ev-high" href="#r-bisra2018" title="Bisra 2018 · Bằng chứng mạnh"></a>.

**Generation effect**: tự nghĩ ra câu trả lời trước khi đọc đáp án, kể cả khi đoán sai <a class="ev ev-high" href="#r-bertsch2007" title="Bertsch 2007 · Bằng chứng mạnh"></a>.

**Interleaving**: trộn lẫn các dạng bài thay vì làm hết dạng này rồi mới sang dạng khác. Hiệu quả ở mức nhỏ đến vừa. Riêng khi học từ vựng thì học xong từng nhóm một lại tốt hơn <a class="ev ev-high" href="#r-brunmair2019" title="Brunmair &amp; Richter 2019 · Bằng chứng mạnh"></a>.

Về độ dài buổi học, bằng chứng chia hai phía. Để giữ những kiến thức cụ thể, buổi ngắn đều đặn tốt hơn <a class="ev ev-mid" href="#r-baddeley1978" title="Baddeley &amp; Longman 1978 · Bằng chứng vừa"></a>. Nhưng nếu tính trình độ tổng thể sau cả một khoá học, dồn nhiều giờ có thể lại tốt hơn <a class="ev ev-low" href="#r-serrano2007" title="Serrano &amp; Muñoz 2007 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

</div></details>

<h3 id="english"><span class="num">13.2</span>Học tiếng Anh khi đã trưởng thành: thứ gì thật sự kéo bạn lên</h3>

Năm năm học mà nghe vẫn chưa ổn, có phải đã trễ? Không. Người lớn thậm chí tiến bộ nhanh hơn trẻ con ở giai đoạn đầu <a class="ev ev-mid" href="#r-snow1978" title="Snow &amp; Hoefnagel-Höhle 1978 · Bằng chứng vừa"></a>. Cái mốc "phải học trước 17 tuổi" bạn hay nghe chỉ nói về việc dùng ngữ pháp y hệt người bản xứ <a class="ev ev-low" href="#r-hartshorne2018" title="Hartshorne 2018 · Bằng chứng yếu hoặc đang tranh cãi"></a>, không phải về việc dùng tiếng Anh tốt trong đời sống hằng ngày.

Thứ kéo bạn lên chia thành ba việc, ứng với ba loại kỹ năng.

**Nghe và đọc: tập bơi ở chỗ nước tới ngực.** Bạn tiến bộ nhanh nhất khi nghe và đọc thật nhiều những thứ mình hiểu được phần lớn. Chỗ quá nông thì không học thêm được gì, chỗ ngập đầu thì chỉ lo chới với. Vừa đọc vừa nghe là cách giúp kỹ năng nghe tiến bộ ổn định nhất <a class="ev ev-mid" href="#r-chang2014" title="Chang &amp; Millett 2014 · Bằng chứng vừa"></a>. Cách làm: một tập podcast ngắn, nghe lần đầu có transcript, lần hai bỏ transcript. Nếu lần hai vẫn bắt được ý chính, độ khó đang vừa. Nếu mất hút ngay câu đầu, chọn tập dễ hơn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

**Nói và viết: xem video dạy bơi không làm bạn bơi được.** Nói và viết là kỹ năng *tạo ra*, nên phải tự làm và có người sửa cho. Đọc nhiều không tự kéo chúng lên. Được chỉ ra lỗi và cách sửa, tức corrective feedback, có tác dụng đo được và bền <a class="ev ev-mid" href="#r-norris2000" title="Norris &amp; Ortega 2000 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-li2010" title="Li 2010 · Bằng chứng vừa"></a>. Viết vài câu kể về ngày hôm nay, nhờ người hoặc công cụ sửa, là đủ để bắt đầu <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

**Cái bẫy riêng của người Việt: đuôi -s và -ed.** Tiếng Việt không có những đuôi này: "hai con mèo", "hôm qua anh ấy đi" đều không đổi hình dạng từ. Đọc "three cats" thì não hiểu nghĩa từ chữ "three" rồi bỏ qua chữ -s. Vì những đuôi gần như không thêm nghĩa, bạn phải *chủ động để ý* thì mới tiếp thu được <a class="ev ev-low" href="#r-schmidt1990" title="Schmidt 1990 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Cách gỡ là nối hai việc ở trên lại với nhau. Mỗi lỗi được sửa thì chép thành một thẻ ôn: mặt trước "Yesterday he ___ (cook) dinner", mặt sau "cooked". Feedback biến thành retrieval practice, và lần sau câu đúng tự bật ra.

**Còn IELTS?** Band tổng là trung bình của bốn kỹ năng, nên một kỹ năng mạnh không kéo được ba kỹ năng yếu. Đọc 8.0 mà nói 5.5 thì band tổng vẫn bị kéo xuống. Cũng không có bảng chung đáng tin nào cho biết bạn cần bao nhiêu giờ. Con số đáng tin nhất là tốc độ của chính bạn: làm một đề thử bây giờ, tám tuần sau làm lại <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<details><summary>Đọc thêm: tuổi, các con số về từ vựng và IELTS</summary><div class="inner">

Nghiên cứu về "mốc 17,4 tuổi" có gần 670.000 người tham gia <a class="ev ev-low" href="#r-hartshorne2018" title="Hartshorne 2018 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Chính cái mốc đó cũng đang bị phản biện khi người khác phân tích lại dữ liệu <a class="ev ev-low" href="#r-vanderslik2022" title="van der Slik 2022 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Không nghiên cứu nào nói người bắt đầu học khi đã trưởng thành thì không thể đạt trình độ dùng được trong đời sống và công việc.

Để hiểu 98% số từ trong một văn bản, cần biết khoảng 8.000–9.000 word family với văn viết, và 6.000–7.000 với văn nói <a class="ev ev-mid" href="#r-nation2006" title="Nation 2006 · Bằng chứng vừa"></a>. Một word family là một từ gốc cùng các biến thể của nó, như *decide, decision, decisive*.

"Ngưỡng 98%" không lặp lại được trong nghiên cứu sau: mức hiểu tăng gần như đều theo tỷ lệ từ mình biết <a class="ev ev-mid" href="#r-kremmel2023" title="Kremmel 2023 · Bằng chứng vừa"></a>. Nghĩa là không có vạch "phải đủ từ rồi mới bắt đầu đọc được". Mỗi từ học thêm đều giúp một chút.

Extensive reading, tức đọc nhiều, đọc dễ, đọc cho vui, có tác dụng, mạnh nhất ở người lớn <a class="ev ev-mid" href="#r-jeon2016" title="Jeon &amp; Day 2016 · Bằng chứng vừa"></a>.

Người Việt trưởng thành bỏ âm -s sau phụ âm khoảng một nửa số lần (50,7%) <a class="ev ev-mid" href="#r-disney2024" title="Disney &amp; Le 2024 · Bằng chứng vừa"></a>.

Theo IELTS, band tổng 5.5–6.5 tương đương CEFR B2, còn 7–8 tương đương C1 <a class="ev ev-mid" href="#r-ieltscefr" title="IELTS: IELTS and the CEFR · Bằng chứng vừa"></a>. Thang điểm của Cambridge đặt 6.5 ở ranh giới B2/C1 <a class="ev ev-mid" href="#r-cambridgeielts" title="Cambridge: comparing scores to IELTS · Bằng chứng vừa"></a>.

Cambridge ước tính tổng cộng khoảng 350–400 giờ có hướng dẫn để tới B1 và 500–600 giờ để tới B2. Họ nói rõ đó "chỉ là hướng dẫn", và là giờ học có giáo viên, không phải giờ tự học <a class="ev ev-mid" href="#r-cambridge" title="Cambridge GLH · Bằng chứng vừa"></a>.

IELTS dẫn hai nghiên cứu cho thấy học viên thường mất ba tháng để tăng tối đa nửa band. Người tăng nhiều nhất bắt đầu dưới 5.5 và học hơn 23 giờ mỗi tuần <a class="ev ev-mid" href="#r-ieltshowlong" title="IELTS: how long · Bằng chứng vừa"></a>.

Không có nguồn đáng tin nào về số giờ riêng cho người Việt học tiếng Anh. Bảng giờ của FSI hay được trích chỉ áp dụng cho người bản xứ tiếng Anh học ngoại ngữ <a class="ev ev-mid" href="#r-fsi" title="FSI · Bằng chứng vừa"></a>.

</div></details>

<h3 id="learning-worked-example"><span class="num">13.3</span>Một buổi học ngắn, áp dụng cho bất kỳ môn nào</h3>

Tối chỉ còn 25 phút thì học thế nào cho đáng? Chia 25 phút thành ba phần: tự nhớ lại bài cũ, nạp một ít bài mới, rồi tự viết ra và nhờ người sửa <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

- **Mười phút đầu: tự nhớ lại.** Tự trả lời trước khi xem đáp án, bằng thẻ từ hoặc câu hỏi tự đặt về bài hôm qua.
- **Mười phút tiếp: input mới**, ở mức hiểu được phần lớn. Một đoạn nghe có transcript, hay một trang sách.
- **Năm phút cuối: tự viết ra, có người sửa.** Viết ba câu dùng đúng chỗ vừa bị sửa, hoặc viết ba dòng giải thích lại bằng lời của mình.

Cấu trúc này dùng được cho tiếng Anh, chơi đàn, quản lý chi tiêu, hay bất kỳ kỹ năng nào. Ví dụ với tiếng Anh: tự nói lại năm từ hôm qua rồi lật thẻ, nghe một đoạn podcast ba phút có transcript, viết ba câu có -s ngôi thứ ba rồi nhờ người hoặc công cụ sửa. Với cây đàn guitar: tự bấm lại ba hợp âm hôm qua mà không nhìn sách, học tiếp một hợp âm mới, rồi đàn thử một đoạn cho người biết đàn nghe và chỉ chỗ sai <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

Và một phép nhân đơn giản, không phải dự đoán. 25 phút × 5 ngày = 125 phút mỗi tuần. Đều đặn 52 tuần thì được khoảng 108 giờ mỗi năm, vì 125 × 52 ÷ 60 = 108,3. Tiến bộ được đo bằng giờ thực sự ngồi học. Ý định thì không đo được.

<div class="callout data"><div class="ct">Tự kiểm tra: đọc lại hay tự hỏi</div>

Tuần này, chia 20 từ mới làm hai nhóm 10 từ. Nhóm A chỉ đọc lại mỗi tối. Nhóm B chỉ tự hỏi: che nghĩa, nói ra, rồi mới lật, và hỏi lại sau hai, ba ngày. Tối Chủ nhật, trước khi kiểm tra, ghi lại cảm giác: nhóm nào bạn *thấy* chắc hơn. Thứ Ba tuần sau, tự kiểm tra cả 20 từ. Nếu nhóm B nhớ nhiều hơn mà hôm Chủ nhật bạn lại thấy nhóm A chắc hơn, bạn vừa tận mắt thấy cảm giác trôi chảy đánh lừa mình thế nào. Nếu hai nhóm ngang nhau, thử lại với từ khó hơn hoặc kiểm tra muộn hơn trước khi kết luận <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="thinking-well"><span class="num">14</span>Tư duy tốt</h2>

<h3 id="no-thinking-muscle"><span class="num">14.1</span>Không có một "cơ bắp tư duy" chung</h3>

Chơi cờ, học nhạc hay chơi app "luyện não" có làm bạn thông minh hơn nói chung không? Không. Chúng làm bạn giỏi lên ở chính việc đó, và gần như dừng ở đó.

Tập tạ thì tay khoẻ lên, và tay khoẻ thì xách gì cũng nhẹ hơn. Nhiều người tưởng đầu óc cũng thế: luyện working memory (khả năng giữ vài thông tin trong đầu cùng lúc, như nhớ một số điện thoại vừa nghe trong lúc bấm máy) hay chơi cờ sẽ làm một "cơ tư duy" chung khoẻ lên, rồi cơ đó giúp mình ở mọi việc khác. Các nhà nghiên cứu gọi kiểu lợi ích lan sang việc khác đó là far transfer. Câu trả lời phụ thuộc hoàn toàn vào việc đem so với ai:

```chart bar
chương trình,So với nhóm không làm gì,So với nhóm làm một hoạt động khác
Âm nhạc,0.25,0.03
Working memory,0.18,0.05
```

<p class="small muted">Độ lớn hiệu ứng far transfer, tính bằng độ lệch chuẩn: 0,2 được xem là nhỏ, còn quanh 0,05 thì gần như bằng không. Nguồn: Sala & Gobet 2017, Curr Dir Psychol Sci 26(6):515–520; số liệu ở trẻ em.</p>

So với nhóm ngồi yên không làm gì, học nhạc hay luyện working memory có vẻ giúp được một chút. Nhưng khi nhóm đối chứng cũng được làm một hoạt động khác, như chơi một trò chơi hay học vẽ, thì hiệu ứng gần như biến mất <a class="ev ev-high" href="#r-sala2017" title="Sala &amp; Gobet 2017 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-simons2016" title="Simons 2016 · Bằng chứng mạnh"></a>. "Lợi ích" ban đầu chủ yếu đến từ chỗ người tham gia có *việc gì đó* để làm, có người quan tâm, có hứng khởi. Không có một cơ bắp tư duy chung nào để luyện.

<h3 id="three-layers"><span class="num">14.2</span>Ba tầng của tư duy tốt</h3>

Nếu không có cơ tư duy chung, thì người "suy nghĩ giỏi" có gì mà người khác không có? Họ có kiến thức của lĩnh vực, có thói quen nghi ngờ ấn tượng đầu, và có vài chiến lược cụ thể. Thêm một thứ thứ tư giúp mài sắc cả ba: feedback có chấm điểm.

```mermaid
flowchart TB
  K["① Kiến thức nền của lĩnh vực"]
  D["② Thinking dispositions"]
  S["③ Chiến lược: consider the opposite,<br/>tìm cấu trúc sâu, dùng base rate"]
  K --> J["Phán đoán tốt"]
  D --> J
  S --> J
  F["④ Feedback có chấm điểm"] -->|"calibration"| J
```

1. **Kiến thức.** Cho một kiện tướng cờ vua nhìn một thế cờ thật trong năm giây rồi xếp lại: họ nhớ khoảng 16 quân, người mới chơi chỉ khoảng 4. Nhưng nếu các quân được xếp ngẫu nhiên, không theo ván cờ nào, thì khác biệt gần như biến mất <a class="ev ev-mid" href="#r-chase1973" title="Chase &amp; Simon 1973 · Bằng chứng vừa"></a>. Kiện tướng không có trí nhớ tốt hơn, họ có đủ kiến thức để "nhìn" ra những thế quen. Một người mẹ nấu ăn mấy chục năm cũng thế <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Nếm một thìa canh là biết ngay "thiếu tí mắm, dư tí đường", còn người mới vào bếp chỉ thấy "hơi lạ lạ". Đưa cho mẹ một món Âu chưa từng nấu, lợi thế đó co lại rất nhiều.
2. **Thinking dispositions**, tức thói quen tư duy, khác với trí thông minh. Nhiều thiên kiến quen thuộc, như sunk cost (tiếc công đã bỏ ra nên cố theo một hướng sai), **không liên quan gì tới IQ** <a class="ev ev-high" href="#r-stanovich2008" title="Stanovich &amp; West 2008 · Bằng chứng mạnh"></a>. Người thông minh mắc chúng không kém ai. Thứ giúp được là thói quen, không phải đầu óc nhanh.
3. **Chiến lược.** "Consider the opposite", tức tự hỏi vì sao điều ngược lại có thể đúng, hiệu quả hơn lời dặn "hãy công bằng, khách quan" <a class="ev ev-mid" href="#r-lord1984" title="Lord 1984 · Bằng chứng vừa"></a>. Lời dặn chung chung không cho đầu óc biết phải làm gì. Một câu hỏi cụ thể thì có.
4. **Feedback có chấm điểm** giúp hiệu chỉnh cả ba điều trên, giống như có đáp án để tự chấm bài cho phán đoán của mình. Chưa tới một giờ huấn luyện về xác suất đã cải thiện độ chính xác dự báo 6–11% <a class="ev ev-high" href="#r-chang2016" title="Chang 2016 · Bằng chứng mạnh"></a>.

**Consider the opposite khi mua một chiếc xe máy cũ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** Bạn đang xem một chiếc xe máy cũ đăng bán trên mạng: xe đẹp, giá mềm, và ấn tượng đầu tiên là "ổn, chốt thôi".

- *Cơ chế dự đoán gì.* Ấn tượng đầu kéo sự chú ý về những chỗ khớp với nó. Lời tự dặn "xem cho kỹ vào" không chỉ ra phải nhìn vào đâu.
- *Bạn làm gì.* Trước khi trả tiền, viết một dòng trả lời câu hỏi: "Nếu tháng sau mình hối hận vì mua chiếc xe này, thì nhiều khả năng lý do là gì?". Câu trả lời có thể là "xe từng bị ngập nước", hoặc "giấy tờ không chính chủ".
- *Kết quả.* Bạn có đúng một chỗ cụ thể để kiểm tra, và một câu hỏi cụ thể để hỏi người bán. Nếu chỗ đó ổn, bạn mua với lý do rõ ràng hơn. Nếu không, bạn vừa bắt được một vấn đề mà lời dặn chung chung đã để lọt.

<details><summary>Đọc thêm: thêm về kiến thức, thiên kiến và người dự báo giỏi</summary><div class="inner">

Nghiên cứu gốc về trí nhớ thế cờ chỉ có ba người chơi <a class="ev ev-mid" href="#r-chase1973" title="Chase &amp; Simon 1973 · Bằng chứng vừa"></a>.

Critical thinking phụ thuộc vào kiến thức của chính lĩnh vực đang nghĩ <a class="ev ev-mid" href="#r-willingham2007" title="Willingham 2007 · Bằng chứng vừa"></a>. Dạy critical thinking như một môn riêng chỉ có tác dụng khiêm tốn, và tốt hơn khi có đối thoại, có vấn đề thực tế và có người hướng dẫn kèm cặp <a class="ev ev-high" href="#r-abrami2015" title="Abrami 2015 · Bằng chứng mạnh"></a>.

Những thiên kiến không liên quan tới IQ gồm anchoring (bị con số đầu tiên neo lại), framing (đổi cách nói là đổi quyết định), myside (chỉ thấy lý lẽ phe mình), sunk cost và bỏ qua base rate <a class="ev ev-high" href="#r-stanovich2008" title="Stanovich &amp; West 2008 · Bằng chứng mạnh"></a>.

Actively open-minded thinking là chủ động đi tìm bằng chứng ngược với điều mình đang tin. Người có thói quen này phán đoán chính xác hơn, vì họ chịu tìm thêm thông tin trước khi chốt <a class="ev ev-mid" href="#r-haran2013" title="Haran 2013 · Bằng chứng vừa"></a>.

Những người dự báo giỏi nhất thường xuyên cập nhật niềm tin và coi dự báo là một kỹ năng cần luyện <a class="ev ev-mid" href="#r-mellers2015" title="Mellers 2015 · Bằng chứng vừa"></a>. Một trò chơi debiasing có feedback cho từng người giảm được thiên kiến, và tác dụng vẫn còn sau hai tháng <a class="ev ev-mid" href="#r-morewedge2015" title="Morewedge 2015 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="transfer"><span class="num">14.3</span>Transfer luyện được, nhưng phải có chủ đích</h3>

Làm sao để thứ học ở chỗ này dùng được ở chỗ khác? Đặt hai ví dụ khác bề ngoài cạnh nhau và tìm điểm chung. Rồi chấm điểm phán đoán của chính mình.

Trong bếp, bạn để chai nước mắm, hũ muối ngay cạnh bếp, còn bao gạo thì cất dưới gầm tủ. Rồi một hôm để ý tiệm tạp hoá đầu ngõ bày mì gói, nước ngọt sát cửa, còn hàng ít người mua thì để tít trong góc. Rồi thấy chính mình treo chìa khoá xe ngay cạnh cửa ra vào. Chợt nhận ra cả ba là một ý: thứ hay dùng thì để gần tay, nhưng chỗ gần tay có hạn nên phải chọn thứ gì được để ở đó <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Từ lúc đó, bước vào một căn bếp hay một cửa hàng lạ, bạn tự hỏi "thứ hay dùng nhất để ở đâu, và họ chọn thế nào?". Đó là transfer: một ý mang được sang chỗ mới.

```chart bar
cách học,% giải được bài toán mới (trước khi có gợi ý)
Đọc 1 ví dụ,21
So sánh 2 ví dụ khác bề ngoài,45
```

<p class="small muted">Nguồn: Gick & Holyoak 1983, Cognitive Psychology 15(1):1–38.</p>

Khi người học đọc **hai** ví dụ trông khác nhau nhưng cùng một nguyên lý rồi so sánh chúng, 45% giải được một bài toán mới trước khi có gợi ý. Khi chỉ đọc một ví dụ, con số này là 21% <a class="ev ev-high" href="#r-gick1983" title="Gick &amp; Holyoak 1983 · Bằng chứng mạnh"></a>. Một ví dụ thì đầu óc nhớ cả những chi tiết bề ngoài. Hai ví dụ khác bề ngoài thì phần giống nhau lộ ra, và phần đó mới là nguyên lý. Cuốn sách này cố ý làm như vậy: vòng lặp buổi tối, việc bỏ tập thể dục và việc tiết kiệm đều được phân tích bằng cùng một cấu trúc.

Thói quen thứ hai là **dự đoán và chấm điểm** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Mỗi đầu tuần, ghi ba đến năm dự đoán kèm xác suất về những việc trong tuần. Cuối tuần chấm điểm bằng **Brier score**: lấy xác suất mình đã nói trừ đi kết quả thật, rồi bình phương lên. Kết quả thật là 1 nếu việc xảy ra, 0 nếu không. Điểm càng thấp càng tốt. Bạn nói 70% là tuần này sẽ nấu cơm ở nhà ít nhất bốn tối, và bạn làm được thật: (0,7 − 1)² = 0,09, khá tốt. Bạn nói 90% mà không làm được: (0,9 − 0)² = 0,81, rất tệ, dấu hiệu của tự tin quá mức.

**Một tuần chấm Brier score, đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** Sáng thứ Hai, bạn ghi ba dự đoán:

1. "Chủ nhật này mình về ăn cơm với bố mẹ" — 80%.
2. "Mình học đủ bốn buổi 25 phút trong tuần" — 70%.
3. "Cả năm tối trong tuần mình đi ngủ trước 23 giờ" — 50%.
