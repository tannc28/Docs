Trong một thí nghiệm có dùng kèm melatonin, khoảng 30 phút ánh sáng mạnh đã cho khoảng 75% tác dụng của hai tiếng <a class="ev ev-mid" href="#r-crowley2015" title="Crowley 2015 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="example-first-weeks"><span class="num">26.4</span>Mười tuần đầu</h3>

Mười tuần tới, tuần nào làm gì? Tuần 0 bắt đầu từ 26/10 và chỉ đo. Từ đó mỗi tuần thêm đúng một thay đổi, theo khuôn ở [chương 24](#startup-template):

| Tuần | Ngày | Thứ Bảy | Thay đổi duy nhất của tuần |
|---|---|---|---|
| 0 | 26/10–1/11 | làm từ xa | Chỉ đo: ghi chép mỗi tối, thời gian dùng điện thoại, nhật ký ngủ · thứ Bảy 31/10 làm một đề IELTS chẩn đoán |
| 1 | 2/11–8/11 | nghỉ | Thứ Hai và đầu tháng — fresh start: cue ở cửa, điện thoại lên kệ, đăng xuất TikTok, giới hạn ứng dụng, buổi 25 phút; cài chuyển tiền tự động |
| 2 | 9/11–15/11 | làm từ xa | Hồi sức có chủ đích 19:15–20:30; điện thoại ra khỏi phòng ngủ; buổi học sâu đầu tiên |
| 3 | 16/11–22/11 | nghỉ | Vận động: hai buổi tập sức mạnh và leo cầu thang; một hoạt động mới cùng người yêu |
| 4 | 23/11–29/11 | làm từ xa | Không thêm gì — so với tuần 0; quyết định có thử phương án sáng không |
| 5 | 30/11–6/12 | nghỉ | Nếu thử: dời ngủ bước 1 · nếu không: bắt đầu ghi dự đoán tuần |
| 6 | 7/12–13/12 | làm từ xa | Nếu thử: dời ngủ bước 2 · nếu không: so sánh hai ví dụ trong buổi kỹ thuật |
| 7 | 14/12–20/12 | nghỉ | Chia sẻ tóm tắt tuần với một người |
| 8 | 21/12–27/12 | làm từ xa | Thứ Bảy 26/12: làm lại đề IELTS, tám tuần sau lần đầu → tính tốc độ |
| 9 | 28/12–3/1 | — | Review quý: giữ, thu nhỏ hay bỏ; chọn push goal cho quý 1/2027; thứ Sáu 1/1/2027 là một mốc fresh start |

Nhìn vào cột cuối, có thể thấy một nhịp. Tuần 1 dồn nhiều thứ vào một thay đổi duy nhất là "đổi tình huống buổi tối", vì tất cả đều phục vụ đúng khoảnh khắc 19:15 ở cửa nhà. Các tuần sau, mỗi tuần chỉ chạm một mảng: hồi sức, vận động, giấc ngủ, chia sẻ. Nhờ vậy, tuần nào có gì thay đổi thì còn lần ra được vì sao <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<h3 id="example-ielts"><span class="num">26.5</span>Con đường IELTS</h3>

Bao lâu thì đạt IELTS 6.5? Không ai bên ngoài trả lời đáng tin được, vì mọi con số có nguồn ở [chương 13](#learning) đều đo trên học viên học tập trung, hoặc là giờ học có giáo viên. Câu trả lời đáng tin duy nhất đến từ chính số liệu của bạn.

Hỏi câu đó cũng giống hỏi "đi xe máy từ nhà tôi lên trung tâm mất bao lâu" mà không ai biết nhà bạn ở đâu, đường hôm đó có kẹt không. Có bốn bước để tự tìm ra con số của mình.

1. **Đo trình độ thật** bằng một đề luyện chính thức (nguồn đề luyện miễn phí trên [ielts.org](https://ielts.org)). Listening và Reading tự chấm bằng đáp án. Writing và Speaking tự chấm theo band descriptors công khai. Có thể nhờ AI đối chiếu, nhưng đó không phải điểm chính thức.
2. **Làm lại mỗi tám tuần.** Hai điểm đo cho bạn **tốc độ của riêng mình**. IELTS cũng khuyên ước lượng theo những người giống mình nhất <a class="ev ev-mid" href="#r-ieltshowlong" title="IELTS: how long · Bằng chứng vừa"></a>, và người giống bạn nhất là chính bạn.
3. **Phân bổ giờ theo chỗ hổng.** Nghe cần lượng input lớn, như lúc đi bộ hay vừa đọc vừa nghe. Nói và viết cần output kèm feedback <a class="ev ev-mid" href="#r-li2010" title="Li 2010 · Bằng chứng vừa"></a>. Đọc đang khá thì giữ ở maintenance dose. Lý do: band tổng là trung bình bốn kỹ năng, nên kỹ năng yếu nhất kéo tổng xuống nhiều nhất. Nửa band thêm vào ở chỗ đang yếu thường dễ lấy hơn nửa band thêm vào ở chỗ đã khá <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.
4. **Đặt mục tiêu theo tầng.** Outcome (band) đo mỗi tám tuần, process (số buổi, số giờ nghe) đo mỗi tuần, và learning goal cho từng kỹ năng mới.

**Từ hai lần đo tới một tốc độ, đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** Các con số dưới đây chỉ để minh hoạ cách tính, không phải dự đoán.

1. *Thứ Bảy 31/10, đề chẩn đoán.* Giả sử Listening tự chấm được 5.0, Reading 6.0.
2. *Tám tuần ở giữa.* Bảng ghi chép cho biết tổng số giờ nghe thực sự đã làm — giả sử 30 giờ.
3. *Thứ Bảy 26/12, làm lại.* Giả sử Listening lên 5.5, Reading vẫn 6.0.
4. *Đọc kết quả.* Với cách học và lịch hiện tại, Listening tăng nửa band sau khoảng 30 giờ nghe trong tám tuần. Đó là tốc độ của chính bạn, con số duy nhất dùng được để ước lượng quý sau. Reading đứng yên cũng là điều đã tính trước, vì kỹ năng này đang ở maintenance dose.
5. *Quyết định ở review quý.* Nếu tốc độ chấp nhận được, giữ nguyên. Nếu muốn nhanh hơn, câu hỏi tiếp theo là có thêm giờ được không. Đó chính là lúc cân nhắc thí nghiệm phương án sáng ở [§26.3](#example-sleep-shift).

<div class="callout data"><div class="ct">Tự kiểm tra: tuần 0 bắt đầu từ 26/10</div>

Tuần 26/10–1/11 không đổi gì cả, chỉ ghi: mỗi tối một dòng theo mẫu ở [§27.1](#the-log), cộng thời gian dùng điện thoại lấy từ máy, cộng nhật ký ngủ. Thứ Bảy 31/10 làm đề chẩn đoán. Tối Chủ nhật 1/11, đọc lại bảy dòng và trả lời ba câu: mấy tối làm được minimum dose, giờ lên giường trung bình là mấy giờ, và tối thứ Tư với người yêu có giữ được không. Nếu ít hơn ba tối làm được minimum dose, tuần 1 chỉ nên đổi tình huống ở cửa nhà như bảng mười tuần, đừng thêm gì khác. Nếu giờ lên giường trung bình đã muộn hơn 00:00, hãy lo giấc ngủ trước cả tiếng Anh <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="part-6" class="part">Phần VI — Đo lường và tự kiểm chứng</h2>

<h2 id="measuring"><span class="num">27</span>Đo chính mình, và kiểm tra cuốn sách này</h2>

Làm sao biết cuốn sách này đúng, và đúng với bạn? Bằng hai việc: một dòng ghi chép mỗi ngày, và năm phút tự kiểm một nghiên cứu khi nghi ngờ.

Một cuốn sách về hành vi chỉ có giá trị khi người đọc kiểm tra lại được. Nó giống đi chợ mua bưởi: người bán bảo "ngọt lắm", nhưng người mua quen vẫn xin bổ thử một múi <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Có hai điều cần kiểm: các nghiên cứu có nói đúng như sách viết không, và kết quả của chúng có đúng **với bạn** không.

<h3 id="the-log"><span class="num">27.1</span>Ghi chép hằng ngày</h3>

Ghi gì mỗi ngày, và ghi thế nào cho đỡ tốn công? Một dòng trong bảng tính, mất khoảng một phút, ghi trạng thái chứ không ghi lời tự trách.

Feedback loop ở [chương 15](#goal-os) cần một cảm biến, và cảm biến đơn giản nhất là dòng ghi chép đó. Nó giống cuốn sổ chi tiêu trong nhà: không ghi thì cuối tháng hụt tiền chỉ còn biết đoán tiền đã đi đâu <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Một bảng tính đơn giản là đủ. Tên cột nên bằng tiếng Anh để dễ xử lý về sau:

```text
date,day_type,energy_arrival,phone_min_evening,push_goal_min,minimum_done,movement_min,people,bedtime,wake,note
2026-10-26,workday,2,95,0,no,20,,00:40,08:00,"về 19:00, ngồi sofa, mở TikTok 19:05"
2026-10-27,workday,3,40,25,yes,20,,23:55,08:00,"điện thoại lên kệ, tắm trước"
```

Ý nghĩa từng cột:

- **energy_arrival**: mức năng lượng tự chấm từ 1 đến 5 lúc về tới nhà.
- **phone_min_evening**: số phút dùng điện thoại buổi tối, lấy từ Digital Wellbeing trên Android (Settings → Digital Wellbeing & parental controls) hoặc Screen Time trên iOS (Settings → Screen Time). Đây là số đo của máy, không phải ước lượng.
- **minimum_done**: đã làm minimum dose của push goal chưa. Đây là cột quan trọng nhất.
- **people**: ghi ngắn đã ở bên ai, làm gì.
- **note**: viết bằng **trạng thái** như giờ, mức mệt, bối cảnh, không bằng tính cách. "Về 19:00, ngồi sofa, mở TikTok 19:05" thì dùng được. "Mình lười quá" thì không cho biết gì để sửa.

Một bảng như thế là một dạng experience sampling nhỏ: ghi lại trải nghiệm ngay khi nó vừa xảy ra, thay vì nhớ lại sau, khi trí nhớ đã kịp tô vẽ lại mọi thứ.

Sau bốn tuần, bảng ghi chép trả lời được những câu mà cảm giác không trả lời được.

- Năng lượng lúc về có quyết định chuyện làm minimum dose không? Nếu những ngày năng lượng 2 vẫn làm được, thì những thay đổi giúp bước bắt đầu đỡ tốn sức đang có tác dụng.
- Sau các thay đổi với điện thoại, số phút có thật sự giảm không, so giữa tuần 0 và các tuần sau?
- Giờ ngủ có lùi dần không, và giờ thức các ngày lệch nhau bao nhiêu?
- Thời gian dành cho người thân có bị lấn mất không?
- Trong cột ghi chú của những ngày thất bại, bối cảnh nào lặp lại nhiều nhất? Đó là mắt xích cần cắt tiếp theo.

**Đọc bốn tuần ghi chép, đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** Giả sử sau bốn tuần bạn có 20 dòng của ngày làm.

1. *Lọc những ngày minimum_done = no.* Giả sử có 6 ngày.
2. *Đọc cột note của 6 ngày đó.* Bốn dòng có chữ "sofa" hoặc "nằm nghỉ chút", hai dòng ghi "về sau 20:00".
3. *So với energy_arrival.* Những ngày "sofa" có năng lượng 2–3, tức không phải mệt nhất. Những ngày về muộn mới là năng lượng 1.
4. *Kết luận.* Mắt xích cần cắt tiếp theo là cái sofa lúc vừa về tới nhà. Đó là chuyện của tình huống, không phải "thiếu ý chí". Còn những ngày về muộn thì hạ mục tiêu tối đó xuống minimum dose ngay từ đầu.
5. *Thay đổi của tuần sau.* Đúng một thứ: ngồi vào bàn ngay sau khi tắm, không đi ngang qua sofa.

<h3 id="self-check"><span class="num">27.2</span>Kiểm tra một nghiên cứu trong năm phút</h3>

Gặp một câu "nghiên cứu cho thấy…" mà bạn nghi ngờ, kiểm tra thế nào? Làm như khi mua một chiếc xe máy cũ: đừng tin lời rao "chính chủ, đi giữ gìn", hãy xem tận mắt giấy tờ và máy móc <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Năm phút là đủ cho bốn bước.

1. **Đọc abstract.** Mỗi nguồn trong sách có một link ở phần Nguồn. Bấm vào và đọc abstract. Các con số trong sách được lấy từ đó hoặc từ bản đầy đủ.
2. **Xem ai đã kiểm lại.** Tìm tên bài trên [Google Scholar](https://scholar.google.com), bấm "Cited by" và tìm thêm các từ khoá replication hoặc meta-analysis. Một kết quả nổi tiếng chưa chắc đã còn đúng, và ego depletion ở [chương 4](#fatigue) là ví dụ rõ nhất.
3. **Xem bài có bị rút không** trên [Retraction Watch Database](https://retractiondatabase.org), và đọc thảo luận sau khi bài được đăng trên [PubPeer](https://pubpeer.com).
4. **Nhìn vào thiết kế.** Đây là thử nghiệm ngẫu nhiên hay chỉ là tương quan? Bao nhiêu người tham gia? Họ là ai, sinh viên Mỹ hay người lớn tuổi ở Anh, và giống bạn đến đâu?

**Năm phút với một nghiên cứu trong sách, đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** Lấy câu "giải trí mà hẹn giờ chính xác thì kém vui hơn" ở [§11.5](#people-leisure).

1. *Abstract.* Bấm link nguồn Tonietto & Malkoc 2016 ở phần Nguồn, đọc abstract: kết quả có đúng như sách viết không, và "lên lịch thô" có thật sự xoá được hiệu ứng không.
2. *Ai đã kiểm lại.* Gõ tên bài vào Google Scholar, bấm "Cited by", tìm thêm chữ replication.
3. *Có bị rút không.* Tra tên bài trên Retraction Watch Database và PubPeer.
4. *Thiết kế.* Đây là thí nghiệm hay khảo sát? Người tham gia là ai, giống bạn tới đâu?

Nếu cả bốn bước đều ổn, bạn có thêm lý do để tin câu đó. Còn câu đó có đúng với *bạn* hay không thì chỉ ghi chép mới trả lời được.

<div class="callout data"><div class="ct">Tự kiểm tra: một nghiên cứu, một tuần</div>

Chọn một khuyến nghị trong sách mà bạn nghi ngờ nhất, kiểm tra theo bốn bước trên, rồi thử nó một tuần trong đời mình, ghi kết quả vào cột note. Ví dụ với lịch giải trí: thứ Bảy này hẹn người yêu kiểu "chiều đi cà phê", Chủ nhật hẹn "15:00–17:00 đi cà phê", tối mỗi hôm chấm mức vui từ 1 đến 5. Một tuần không chứng minh được gì về con người nói chung. Nhưng nếu kết quả của bạn đi ngược hẳn với nghiên cứu nhiều tuần liền, thì với bạn, dữ liệu của chính mình đáng tin hơn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="glossary"><span class="num">B</span>Phụ lục: glossary</h2>

Thuật ngữ được giữ nguyên tiếng Anh — đó là dạng bạn sẽ gặp lại khi đọc nghiên cứu hay tra cứu. Bên dưới mỗi thuật ngữ là lời giải thích, chứ không phải bản dịch, và khi có thể thì kèm một hình ảnh đời thường.

<dl class="gloss">
<dt>active-constructive responding</dt><dd>Cách đáp lại khi người khác kể tin vui: chú ý thật, hỏi thêm, vui cùng. Người yêu khoe vừa thi đậu bằng lái xe, bạn hỏi "Thật à? Thi có khó không, kể nghe đi!" thay vì "Ừ, hay đấy" mà mắt vẫn dán vào điện thoại.</dd>
<dt>actively open-minded thinking</dt><dd>Thói quen chủ động đi tìm bằng chứng ngược với điều mình đang tin, và sẵn sàng đổi ý khi bằng chứng đủ mạnh — như nấu xong món mới thì hỏi cả nhà "chỗ nào chưa ngon?", chứ không chỉ chờ nghe khen.</dd>
<dt>attention residue</dt><dd>Một phần sự chú ý còn mắc lại ở việc cũ khi đã chuyển sang việc mới, nên làm việc mới kém đi. Vừa cãi nhau qua điện thoại xong, ngồi vào bàn học mà đầu vẫn nghĩ về cuộc cãi nhau.</dd>
<dt>autonomous / controlled motivation</dt><dd>Động lực đến từ sự quan tâm và giá trị của chính mình / động lực đến từ áp lực, phần thưởng hay sự xấu hổ. Học tiếng Anh vì muốn đọc sách gốc, so với học vì "ai cũng có IELTS rồi".</dd>
<dt>bedtime procrastination</dt><dd>Cứ lùi giờ đi ngủ dù chẳng có lý do bên ngoài nào bắt phải thức: "xem thêm một video nữa thôi" lúc 0h30.</dd>
<dt>blocking / interleaving</dt><dd>Học hết một dạng rồi mới sang dạng khác / trộn lẫn các dạng trong cùng một buổi. Trộn lẫn thường cho kết quả tốt hơn, trừ khi học từ vựng.</dd>
<dt>Brier score</dt><dd>Điểm chấm một dự đoán có xác suất: lấy xác suất mình nói trừ kết quả thật (1 nếu xảy ra, 0 nếu không), rồi bình phương lên. Càng thấp càng tốt. Nói 90% chắc chắn mà sai thì bị phạt rất nặng.</dd>
<dt>chronotype</dt><dd>Xu hướng tự nhiên của một người về giờ ngủ và giờ thức: kiểu tự nhiên dậy sớm, kiểu "cú đêm", hay ở giữa.</dd>
<dt>circadian rhythm</dt><dd>Nhịp sinh học khoảng 24 giờ quyết định lúc nào buồn ngủ, lúc nào tỉnh táo, nhiệt độ cơ thể lên xuống ra sao. Ánh sáng là thứ chỉnh nhịp này mạnh nhất: mỗi ngày, ánh sáng lại vặn kim đồng hồ sinh học về cho đúng giờ.</dd>
<dt>coast</dt><dd>Nới tay khỏi một mục tiêu khi nó đang đi trước kế hoạch, để dành sức cho mục tiêu khác — như xe đang xuống dốc thì nhả ga.</dd>
<dt>commitment device</dt><dd>Một cách tự khoá lựa chọn tương lai khi đang tỉnh táo (tài khoản tiết kiệm có khoá, cam kết trước), để lúc mệt sau này không đổi ý được. Như đưa thẻ ATM cho mẹ giữ để khỏi tiêu lung tung.</dd>
<dt>cue</dt><dd>Tín hiệu trong bối cảnh — nơi chốn, giờ giấc, đồ vật, việc vừa làm — kích hoạt một habit. Ngồi xuống sofa là tay tự với lấy điện thoại: sofa chính là cue.</dd>
<dt>default</dt><dd>Điều xảy ra khi bạn không làm gì — thứ đã được cài sẵn. Phần lớn người giữ nguyên default, nên chọn default là chọn luôn hành vi.</dd>
<dt>default mode network</dt><dd>Mạng lưới các vùng não hoạt động mạnh khi không tập trung vào việc bên ngoài — lúc thả hồn, nhớ lại chuyện cũ, nghĩ về bản thân, như khi đứng dưới vòi sen.</dd>
<dt>disengagement / re-engagement</dt><dd>Buông một mục tiêu không còn khả thi / gắn với một mục tiêu mới thay thế. Hai kỹ năng khác nhau: bỏ marathon vì đau gối là disengagement, chuyển sang bơi ngay tuần đó là re-engagement.</dd>
<dt>DLMO (dim light melatonin onset)</dt><dd>Thời điểm melatonin bắt đầu tăng khi ánh sáng buổi tối mờ đi — số đo chuẩn để biết đồng hồ sinh học của một người đang chỉ mấy giờ.</dd>
<dt>DRAMMA</dt><dd>Năm cơ chế giúp thời gian rảnh làm cuộc sống tốt hơn: detachment-recovery (đầu óc rời công việc và hồi sức), autonomy (tự chọn mình làm gì), mastery (thấy mình giỏi lên), meaning (làm điều có ý nghĩa), affiliation (gắn bó với người khác).</dd>
<dt>ego depletion</dt><dd>Giả thuyết cho rằng ý chí như bình xăng, dùng nhiều thì cạn. Khi đem làm lại trong các thử nghiệm lớn, hiệu ứng gần như biến mất.</dd>
<dt>experience sampling</dt><dd>Phương pháp ghi lại trải nghiệm ngay lúc nó xảy ra, nhiều lần trong ngày, thay vì nhớ lại sau — khi trí nhớ đã kịp tô vẽ lại.</dd>
<dt>far transfer</dt><dd>Luyện một việc rồi giỏi lên ở một việc khác hẳn: chơi cờ rồi giỏi toán, chơi game luyện não rồi làm việc sắc sảo hơn. Bằng chứng cho thấy gần như không tự xảy ra.</dd>
<dt>feedback loop</dt><dd>Vòng lặp: so hiện trạng với mục tiêu → hành động → đo lại → so lại, như cái điều hoà đo nhiệt độ phòng rồi chạy mạnh hay nhẹ. Không đo thì vòng lặp bị đứt.</dd>
<dt>fresh start effect</dt><dd>Xu hướng dễ bắt đầu thay đổi hơn ở các mốc thời gian — thứ Hai, đầu tháng, sinh nhật, năm mới — như được lật sang một trang mới.</dd>
<dt>goal shielding</dt><dd>Khi một mục tiêu đang chiếm sự chú ý, các mục tiêu khác bị đẩy ra khỏi đầu. Đang lao vào ôn thi thì việc gọi về nhà không bị gạch bỏ — việc đó chỉ lặng lẽ biến khỏi đầu.</dd>
<dt>habit</dt><dd>Liên kết cue → response học được qua lặp lại trong một bối cảnh ổn định; diễn ra tự động, không cần mục tiêu hay ý chí. Như tay tự gõ mật khẩu mà không cần nghĩ.</dd>
<dt>habit discontinuity</dt><dd>Giai đoạn bối cảnh sống thay đổi — chuyển nhà, đổi việc — habit cũ mất những cue quen thuộc nên yếu đi. Đây là dịp thuận lợi để tạo habit mới.</dd>
<dt>hot–cold empathy gap</dt><dd>Khi đang bình tĩnh, no, khoẻ ("cold"), ta đánh giá thấp việc mệt, đói, thèm ("hot") sẽ chi phối mình đến mức nào. Lập kế hoạch học lúc 10h sáng Chủ nhật, quên mất con người mình lúc 21h tối thứ Năm.</dd>
<dt>implementation intention</dt><dd>Kế hoạch dạng "Khi [tình huống] thì tôi [hành động]", gắn hành động vào một cue cụ thể: "Khi rửa bát xong, mình mở app thẻ từ ngay tại bàn ăn".</dd>
<dt>incentive salience (wanting) vs liking</dt><dd>"Muốn" — sức hút thúc mình hành động, do dopamine điều khiển — khác với "thích" — khoái cảm khi thật sự nhận được. Có thể muốn lướt tiếp rất mạnh mà lướt xong chẳng thấy vui.</dd>
<dt>intention–behaviour gap</dt><dd>Khoảng cách giữa điều mình định làm và điều mình thật sự làm — giữa "tối nay học" lúc 9h sáng và cái sofa lúc vừa về tới nhà.</dd>
<dt>intermittent reinforcement</dt><dd>Phần thưởng đến không đều, không đoán trước được, như cào vé số hay lướt feed: lần tiếp theo biết đâu lại trúng. Với kiểu thưởng này, hành vi rất khó dừng.</dd>
<dt>learning / process / outcome goal</dt><dd>Mục tiêu về việc học cách làm / về điều mình tập trung làm khi đang thực hiện kỹ năng (nghiên cứu gốc trong thể thao; sách mở rộng sang những hành vi mình kiểm soát được) / về kết quả cuối cùng. "Tìm ba chiến lược bắt số liệu khi nghe" / "năm buổi retrieval mỗi tuần" / "IELTS 6.5".</dd>
<dt>maintenance dose</dt><dd>Mức tối thiểu để một mục tiêu không thụt lùi trong lúc bạn dồn sức cho mục tiêu khác — như năm có con thi đại học, cả nhà vẫn đi chợ nấu cơm, đóng tiền điện nước ở mức vừa đủ (thuật ngữ dùng trong tài liệu này).</dd>
<dt>mastery (recovery)</dt><dd>Trải nghiệm học hay làm được một điều mới, có thử thách vừa phải, ngoài giờ làm — một cách hồi sức. Lần đầu nấu được món khó, hay đánh cầu lông lên tay.</dd>
<dt>melanopic EDI</dt><dd>Đơn vị đo ánh sáng theo mức nó tác động lên những tế bào cảm quang điều khiển đồng hồ sinh học — khác với độ sáng mắt cảm nhận. Hai bóng đèn trông sáng như nhau vẫn có thể tác động lên đồng hồ khác nhau.</dd>
<dt>mental contrasting (WOOP)</dt><dd>Hình dung điều mong muốn, rồi hình dung trở ngại thật nằm trong chính mình, rồi lập kế hoạch vượt đúng trở ngại đó. "Muốn tự tin nói tiếng Anh khi đi du lịch — nhưng mình sợ nói sai rồi bị cười — nên khi muốn im lặng, mình hỏi một câu ngắn đã chuẩn bị trước".</dd>
<dt>minimum dose</dt><dd>Phiên bản nhỏ nhất của một việc, nhỏ tới mức làm được cả vào tối mệt nhất tuần; làm xong thì tính là "đã làm" trong ngày (thuật ngữ dùng trong tài liệu này). Ví dụ: 15 thẻ từ.</dd>
<dt>mood repair</dt><dd>Hành động để thấy dễ chịu hơn ngay lập tức — động cơ thật đằng sau phần lớn sự trì hoãn. Mở TikTok khi bài tập trông nặng nề không phải vì lười, mà vì muốn thoát cảm giác khó chịu.</dd>
<dt>multifinal means</dt><dd>Một hành động phục vụ được nhiều mục tiêu cùng lúc: tập thể dục cùng người yêu, nghe podcast tiếng Anh khi đi bộ buổi tối.</dd>
<dt>opportunity cost</dt><dd>Thứ mất đi khi dùng sự tập trung cho việc này thay vì việc khác. Một lý thuyết dùng nó để giải thích cảm giác "tốn sức": não báo rằng sự tập trung này đang không được dùng cho những việc khác.</dd>
<dt>phubbing</dt><dd>Cầm điện thoại lướt trong lúc đang ngồi với người khác, khiến họ cảm thấy bị bỏ rơi.</dd>
<dt>planning fallacy</dt><dd>Xu hướng dự đoán thời gian và công sức quá lạc quan, vì dựa vào kịch bản tưởng tượng thay vì kinh nghiệm cũ. Dọn nhà đón Tết ước "một buổi sáng là xong" rồi cũng kéo dài hết cả ngày.</dd>
<dt>present bias</dt><dd>Xu hướng coi trọng phần thưởng có ngay hơn hẳn phần thưởng đến sau, mạnh nhất với các việc tốn công. Một tập phim tối nay nặng ký hơn band IELTS năm sau.</dd>
<dt>progress monitoring</dt><dd>Thường xuyên so tình trạng hiện tại với mục tiêu — tốt nhất là ghi lại, và cho người khác thấy.</dd>
<dt>psychological detachment</dt><dd>Đầu óc thật sự rời khỏi công việc ngoài giờ làm: không làm việc, và cũng không nghĩ về việc.</dd>
<dt>psychological flexibility</dt><dd>Khả năng điều chỉnh hành vi theo tình huống và theo giá trị của mình, kể cả khi đang có cảm xúc khó chịu. Cách đo khái niệm này hiện còn tranh cãi.</dd>
<dt>push goal</dt><dd>Mục tiêu được dồn sức trong một quý: có if-then plan chi tiết, khung giờ tốt nhất, đo hằng tuần — như kỳ thi đại học mà cả nhà dồn sức trong năm đó (thuật ngữ dùng trong tài liệu này).</dd>
<dt>restraint bias</dt><dd>Tự tin quá mức vào khả năng kiềm chế, nên để mình ở gần cám dỗ hơn. "Mình cứ để điện thoại cạnh bàn học, mình không đụng vào đâu."</dd>
<dt>retrieval practice</dt><dd>Tự nhớ lại thông tin mà không nhìn tài liệu — flashcard, tự kiểm tra — như tự chạy xe tới nhà bạn thay vì ngồi sau để người khác chở. Giúp nhớ lâu hơn hẳn đọc lại.</dd>
<dt>reward prediction error</dt><dd>Chênh lệch giữa phần thưởng mình đoán trước và phần thưởng thật nhận được — thứ mà neuron dopamine báo hiệu. Bất ngờ được thưởng thì tín hiệu bùng lên; được đúng như đoán thì gần như im.</dd>
<dt>self-compassion</dt><dd>Đối xử với chính mình khi thất bại như đối xử với một người bạn: thừa nhận thất bại, không chối bỏ, nhưng cũng không tự dằn vặt.</dd>
<dt>self-concordance</dt><dd>Mức độ một mục tiêu xuất phát từ giá trị và sự quan tâm thật của mình, thay vì từ áp lực hay cảm giác tội lỗi.</dd>
<dt>self-efficacy</dt><dd>Niềm tin rằng mình làm được một việc cụ thể. Tăng lên qua những lần làm được, giảm đi qua những lần thất bại lặp lại.</dd>
<dt>situation modification</dt><dd>Thay đổi môi trường trước khi cám dỗ xuất hiện, để khỏi phải cưỡng lại nó: điện thoại lên kệ ở cửa, chứ không phải cầm trên tay rồi cố không mở.</dd>
<dt>sleep inertia</dt><dd>Cơn lờ đờ ngay sau khi thức dậy, như chiếc xe máy để qua đêm lạnh, phải nổ máy một lúc mới chạy ngọt; tệ nhất trong 15–30 phút đầu.</dd>
<dt>social jetlag</dt><dd>Lệch giờ ngủ giữa ngày làm và ngày nghỉ, giống như mỗi cuối tuần bay sang một múi giờ khác rồi sáng thứ Hai bay về.</dd>
<dt>spacing effect</dt><dd>Chia việc học ra nhiều lần cách quãng giúp nhớ lâu hơn dồn vào một lần — như tưới cây mỗi ngày một ít thay vì dội cả xô một lúc.</dd>
<dt>task aversiveness</dt><dd>Mức độ khó chịu, nhàm chán hay đáng sợ của một việc — yếu tố gắn chặt với trì hoãn. Như căn bếp bừa bộn sau bữa giỗ, nhìn vào mà không biết bắt đầu dọn từ đâu.</dd>
<dt>temptation bundling</dt><dd>Chỉ cho phép mình hưởng một thứ yêu thích (podcast, phim) khi đang làm việc nên làm — podcast hay nhất chỉ nghe lúc đang tập.</dd>
<dt>thinking dispositions</dt><dd>Thói quen và xu hướng tư duy — chịu nghi ngờ chính mình, chịu tìm thêm thông tin trước khi chốt — khác với trí thông minh. Nhiều thiên kiến không hề liên quan tới IQ.</dd>
<dt>time affluence</dt><dd>Cảm giác mình có đủ thời gian — gắn với well-being, và khác với số giờ rảnh thật. Hai người cùng có hai giờ rảnh, một người thấy thong thả, người kia thấy như có ai đuổi sau lưng.</dd>
<dt>VILPA</dt><dd>Những đợt vận động mạnh rất ngắn (1–2 phút) xen trong sinh hoạt hằng ngày, như leo cầu thang thật nhanh lên nhà.</dd>
<dt>VTA (ventral tegmental area)</dt><dd>Một vùng ở não giữa chứa nhiều neuron dopamine, liên quan tới phần thưởng và động lực.</dd>
</dl>
