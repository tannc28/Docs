Tối Chủ nhật, chấm điểm. Về ăn cơm với bố mẹ thật: (0,8 − 1)² = 0,04. Chỉ học được ba buổi: (0,7 − 0)² = 0,49. Có hai tối ngủ muộn: (0,5 − 0)² = 0,25. Trung bình là 0,26. Con số quan trọng không phải điểm trung bình, mà là chỗ bị phạt nặng nhất. Bạn khá chuẩn khi đoán những việc đã hẹn với gia đình, nhưng lạc quan quá mức về những buổi tối của chính mình. Bốn tuần sau, nếu các dự đoán về buổi tối vẫn bị phạt nặng nhất, đó là dữ liệu để hạ mục tiêu tối xuống ba buổi, thay vì tự hứa "tuần sau cố hơn".

Ba thói quen nhỏ nữa đi cùng hướng <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>:

- **Một dòng "vì sao".** Sau mỗi bài báo hay chương sách vừa đọc, viết một dòng "vì sao điều đó lại như vậy".
- **Một ví dụ thứ hai.** Mỗi khi học một mẹo hay một nguyên lý mới, tìm thêm một ví dụ của nó ở một chỗ khác hẳn.
- **Lập luận cho phe kia.** Trước một quyết định lớn, viết ra lập luận mạnh nhất cho lựa chọn ngược lại.

<h3 id="personality"><span class="num">14.4</span>Con người có tự thay đổi được không</h3>

Mình có tự đổi tính được không? Được, nhưng chậm, và chỉ qua những việc thật sự làm, không qua những việc định làm.

Tính cách đổi theo kiểu nước chảy đá mòn: không một sớm một chiều, mà qua rất nhiều lần làm đi làm lại. Tổng hợp các can thiệp, phần lớn là trị liệu tâm lý cho người đang có vấn đề sức khoẻ tâm thần, cho thấy tính cách thay đổi ở mức vừa phải trong khoảng 24 tuần. Riêng conscientiousness, tức tính chu đáo, kỷ luật, làm việc đến nơi đến chốn, chỉ thay đổi ít <a class="ev ev-mid" href="#r-roberts2017" title="Roberts 2017 · Bằng chứng vừa"></a>.

Với những người chủ động muốn thay đổi tính cách của mình, có một kết quả đáng nhớ: **nhận thử thách không dự báo được thay đổi, hoàn thành thử thách thì có** <a class="ev ev-mid" href="#r-hudson2019" title="Hudson 2019 · Bằng chứng vừa"></a>. Người nói "tuần này mình sẽ chủ động bắt chuyện với ba người lạ" không đổi gì cả. Người thật sự bắt chuyện với ba người thì có.

Đó cũng là câu tóm tắt cả cuốn sách: bạn trở thành người làm những việc bạn đã thực sự làm, không phải những việc bạn đã định làm.

<details><summary>Đọc thêm: con số 24 tuần cần đọc kỹ</summary><div class="inner">

Trong các thí nghiệm có nhóm đối chứng, thay đổi về conscientiousness gần như bằng không. Khi hiệu chỉnh cho việc các nghiên cứu nhỏ hay cho kết quả đẹp hơn thực tế, hiệu ứng chung so với nhóm đối chứng còn chưa tới một phần ba và không còn chắc chắn. Chính các tác giả lưu ý phép hiệu chỉnh này kém chính xác <a class="ev ev-mid" href="#r-roberts2017" title="Roberts 2017 · Bằng chứng vừa"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: phán đoán của bạn có lệch không</div>

Trong bốn tuần, mỗi sáng thứ Hai ghi ba đến năm dự đoán kèm xác suất, tối Chủ nhật chấm Brier score như ví dụ trên, và ghi thêm mỗi dự đoán thuộc loại nào: công việc, học, ngủ, người thân. Sau bốn tuần, gom các dự đoán bạn từng nói 80–90%. Nếu chúng chỉ đúng khoảng một nửa, bạn đang tự tin quá mức ở loại việc đó. Thêm một thử nghiệm nhỏ: năm lần tới định mua một món đồ đắt tiền, viết một dòng "nếu mình hối hận vì món này thì lý do sẽ là gì" trước khi trả tiền, và đếm xem có bao nhiêu lần dòng đó dẫn bạn tới một điều đáng kiểm tra <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<div class="recall">

**Câu hỏi nhớ lại — Phần II (chương 11–14).**

<details><summary>Vì sao người thân yêu cần khung giờ cố định, nhưng nội dung lại nên để "thô"?</summary><div class="inner">

Mục tiêu không có phần thưởng rõ ràng sẽ luôn nhường chỗ cho mục tiêu có deadline, nên cần khung cố định. Nhưng giải trí mà hẹn giờ chính xác thì hoá giống công việc và kém vui hơn; "chiều Chủ nhật đi cà phê" tốt hơn "15h–17h đi cà phê" (Tonietto & Malkoc 2016).

</div></details>

<details><summary>Thí nghiệm đăng ký quỹ hưu trí mặc định cho thấy hai điều gì về default?</summary><div class="inner">

Default làm tỷ lệ tham gia tăng từ 37% lên 86% (mức sàn), nhưng 76% người ở lại đúng mức mặc định 3% (mức trần) — nên mức tự động phải được chọn có chủ đích.

Nhóm tự kiểm tra nhớ hơn (61% so với 40%); nhóm đọc lại lại tự tin hơn. Chữ quen mắt cho cảm giác trôi chảy, và cảm giác đó là tín hiệu sai.

<h2 id="part-3" class="part">Phần III — Theo đuổi mục tiêu cả đời</h2>

<h2 id="goal-os"><span class="num">15</span>Mục tiêu là một feedback loop</h2>

Theo đuổi nhiều mục tiêu trong nhiều năm mà không kiệt sức thì bắt đầu từ đâu? Từ việc cho mỗi mục tiêu một cách đo, rồi nhìn xu hướng qua nhiều tuần thay vì phán xét từng tuần một. Hai phần đầu giải thích vì sao một hành vi xảy ra hay không. Phần này lo chuyện dài hơi hơn: tiếng Anh, sức khoẻ, các mối quan hệ, sự nghiệp, và cả những mục tiêu tương lai bây giờ chưa biết.

Hãy nghĩ tới cái điều hoà trong phòng. Bạn đặt 26 độ. Cảm biến đo nhiệt độ thật, so với 26, thấy phòng đang 30 thì chạy mạnh, gần tới 26 thì chạy nhẹ lại, rồi cứ thế đo và so tiếp. Mất cảm biến thì điều hoà chạy mò: lúc rét run, lúc nóng hầm.

Control theory của Carver và Scheier, mô hình làm nền cho cả phần này, cho rằng mục tiêu nào cũng vận hành y như vậy. Bạn so hiện trạng với mục tiêu, thấy khoảng cách, hành động, rồi đo và so lại. Đó là một feedback loop.

```mermaid
flowchart LR
  G["Mục tiêu"] --> C{"So sánh"}
  P["Nhận biết hiện trạng<br/>(ghi chép, đo lường)"] --> C
  C -->|"① thấy khoảng cách"| A["Hành động"]
  A -->|"② tác động"| E["Thế giới thật"]
  E -->|"③ phản hồi"| P
  C -.->|"④ tốc độ thu hẹp khoảng cách"| F["Cảm xúc:<br/>nhanh → thoải mái, nới tay<br/>chậm → khó chịu, dồn sức"]
```

1. **Thiếu mũi tên ③, tức là không đo, thì vòng lặp bị đứt.** Bạn hành động mà không biết mình đang ở đâu, như cái điều hoà mất cảm biến. Mục tiêu không đo thì không phải feedback loop, mà chỉ là một mong ước.
2. **Cảm xúc theo dõi tốc độ, không theo dõi vị trí.** Hình dung bạn đang đi taxi ra sân bay. Còn 10 km nhưng xe chạy vèo vèo thì bạn ngồi thảnh thơi. Còn 3 km mà kẹt cứng thì bạn sốt ruột. Bạn lo không phải vì đường còn xa hay gần, mà vì xe đang đi nhanh hay chậm. Theo Carver, cảm xúc chính là "tín hiệu sai số" của một vòng chuyên theo dõi tốc độ tiến bộ <a class="ev ev-mid" href="#r-carver2015" title="Carver 2015 · Bằng chứng vừa"></a>.
3. **Khi đang tiến nhanh, người ta thật sự nới tay**, tức là coast. Một mục tiêu đang đi nhanh hơn dự kiến thì người ta tự giảm sức cho nó và chuyển sang mục tiêu khác <a class="ev ev-mid" href="#r-fulford2010" title="Fulford 2010 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-louro2007" title="Louro 2007 · Bằng chứng vừa"></a>.

Từ đó có ba hệ quả. Thứ nhất, hãy đo **xu hướng** chứ đừng đo một điểm. Một tuần tệ trong một tháng đang đi lên vẫn là một tháng tốt, và nếu chỉ nhìn tuần đó thì cảm xúc sẽ phán sai. Thứ hai, coast là bình thường, không phải lười. Đi trước kế hoạch ở một mục tiêu là tín hiệu để chuyển sức sang mục tiêu khác, miễn là bạn *thấy* được điều đó nhờ có ghi chép. Thứ ba, mục tiêu nào quan trọng thì phải có cách đo.

**Một tháng nhìn qua feedback loop, đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** Push goal là nghe tiếng Anh, mục tiêu là bốn buổi mỗi tuần. Bốn tuần ghi được: 2, 3, 4, rồi 2 buổi.

- *Cảm xúc nói gì.* Tối Chủ nhật tuần thứ tư, nhìn con số 2, bạn thấy chán: "lại bỏ rồi". Cảm xúc đang so với tốc độ của tuần trước (4 buổi), nên mới báo động.
- *Xu hướng nói gì.* Trung bình bốn tuần là 2,75 buổi, và ba tuần đầu đi lên đều. Dòng ghi chú của tuần thứ tư: "mưa ngập, kẹt xe, về muộn ba tối".
- *Bạn làm gì.* Không đổi mục tiêu, không tự trách. Tuần sau giữ nguyên bốn buổi, và xem con số có quay lại 3–4 không.
- *Mặt ngược lại.* Nếu cùng tháng đó vận động vượt mục tiêu ba tuần liền, đó là tín hiệu để coast: bớt một buổi đi bộ dài, dồn thời gian đó sang nghe. Bạn chỉ thấy được điều này vì có ghi chép.

<details><summary>Đọc thêm: cảm xúc và tốc độ tiến bộ</summary><div class="inner">

Theo Carver, khi đang tiến nhanh, cảm xúc tích cực cho phép mình "coast", nới tay một chút. Khi có nhiều mục tiêu, cơ chế này giúp dời sự chú ý từ mục tiêu này sang mục tiêu khác theo từng lúc <a class="ev ev-mid" href="#r-carver2015" title="Carver 2015 · Bằng chứng vừa"></a>.

Hai người cùng đang ở mức 50% chặng đường: người vừa đi lên từ 30% thấy phấn chấn hơn hẳn người vừa tụt xuống từ 70% <a class="ev ev-mid" href="#r-lawrence2002" title="Lawrence, Carver &amp; Scheier 2002 · Bằng chứng vừa"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: mỗi mục tiêu có cảm biến chưa</div>

Viết ra các mục tiêu hiện có, chẳng hạn tiếng Anh, sức khoẻ, tiền, gia đình, một sở thích. Cạnh mỗi cái, ghi đúng một con số bạn sẽ nhìn vào mỗi tối Chủ nhật, như số buổi nghe, số phút đi bộ, số tiền đã tự chuyển. Mục tiêu nào không nghĩ ra được con số nào thì đó vẫn đang là một mong ước, chưa phải feedback loop. Sau bốn tuần, so tâm trạng tối Chủ nhật với đường xu hướng. Nếu có tuần bạn thấy rất tệ mà xu hướng vẫn đi lên, thì cảm xúc đang phản ứng với tốc độ của riêng tuần đó, không phải với vị trí thật của bạn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="choosing-goals"><span class="num">16</span>Chọn mục tiêu</h2>

<h3 id="goal-hierarchy"><span class="num">16.1</span>Mục tiêu có nhiều tầng</h3>

Vì sao "học tiếng Anh" cứ nằm mãi trên giấy mà không bắt đầu? Vì đó mới là tầng trên cùng của một mục tiêu. Nó còn thiếu tầng dưới: một việc cụ thể để làm hôm nay.

Nếu bạn từng ghi "dọn nhà" vào danh sách việc cuối tuần rồi thấy dòng đó nằm yên ở đó mấy tuần liền, bạn đã hiểu chuyện này <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Dòng đó không sai, chỉ là nó chưa được chia nhỏ. Không ai đứng giữa nhà sáng Chủ nhật mà "dọn nhà" được. Người ta chỉ lau được cái bếp, gấp được chồng quần áo, đổ được túi rác. Mục tiêu cuộc sống cũng có tầng như vậy:

```mermaid
flowchart TB
  V["Giá trị<br/>sức khoẻ, yêu thương, hiểu biết, tự do…"] --> L["Mục tiêu dài hạn — nhiều năm<br/>vd: dùng tiếng Anh thoải mái"]
  L --> S["Mục tiêu quý<br/>vd: Listening từ band X lên X + 0.5"]
  S --> W["Hành vi tuần — đo được<br/>vd: 5 buổi retrieval, 3 giờ nghe"]
  W --> D["Minimum dose mỗi ngày<br/>vd: 15 thẻ từ"]
```

Tầng trên cho biết **lý do**, thứ giữ động lực qua nhiều năm. Tầng dưới cho biết **hành động**, thứ bạn làm hôm nay. Kế hoạch thường hỏng vì thiếu tầng dưới. "Học tiếng Anh" là tầng trên, không chứa một ngày, một giờ hay một việc cụ thể nào để làm.

Tầng cuối cùng là minimum dose: phiên bản nhỏ nhất của một việc. Nó nhỏ tới mức làm được cả vào buổi tối mệt nhất tuần, như 15 thẻ từ, và làm xong là coi như hôm đó đã làm. Chọn "một quý" cho tầng giữa là quy ước của cuốn sách này, không phải một phát hiện khoa học <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<h3 id="goal-filter"><span class="num">16.2</span>Ba câu hỏi trước khi cam kết</h3>

Có nên nhận thêm một mục tiêu mới không? Trước khi nhận, hỏi ba câu: mình muốn nó thật hay vì áp lực, nó có giành giờ với mục tiêu khác không, và có cách nào làm một việc mà phục vụ được cả hai không.

**Câu một: mình theo đuổi điều này vì quan tâm thật, hay vì áp lực và cảm giác tội lỗi?** So hai người cùng học tiếng Anh. Một người học vì muốn đọc được sách gốc và tự hỏi đường, gọi món khi đi du lịch nước ngoài. Người kia học vì "ai cũng có IELTS rồi, mình không có thì xấu hổ". Người thứ nhất thường đi xa hơn. Những mục tiêu xuất phát từ giá trị và sự quan tâm của chính mình gọi là self-concordant goals. Chúng được theo đuổi bền bỉ hơn, đạt được nhiều hơn, và đạt được rồi thì người ta cũng hạnh phúc hơn <a class="ev ev-mid" href="#r-sheldon1999" title="Sheldon &amp; Elliot 1999 · Bằng chứng vừa"></a>.

**Câu hai: nó xung đột hay hỗ trợ các mục tiêu khác?** "Tối nào cũng học hai tiếng" và "dành nhiều thời gian hơn cho người yêu" kéo nhau về hai phía. Có một dấu hiệu dễ nhận ra: những mục tiêu xung đột được *nghĩ tới* nhiều hơn nhưng lại ít được *làm* hơn <a class="ev ev-mid" href="#r-emmons1988" title="Emmons &amp; King 1988 · Bằng chứng vừa"></a>. Nếu bạn cứ nghĩ mãi về một việc mà mãi không làm, hãy xem nó đang giằng co với mục tiêu nào.

**Câu ba: có cách nào phục vụ nhiều mục tiêu cùng lúc không?** Khi nhiều mục tiêu cùng có mặt trong đầu, người ta tự nhiên chọn những hành động phục vụ được tất cả, gọi là multifinal means <a class="ev ev-mid" href="#r-kopetz2011" title="Köpetz 2011 · Bằng chứng vừa"></a>. Tập thể dục cùng người yêu phục vụ cả sức khoẻ lẫn quan hệ. Xem video dạy nấu ăn bằng tiếng Anh phục vụ cả sở thích lẫn ngoại ngữ. Nghe podcast khi đi bộ buổi tối phục vụ cả vận động lẫn kỹ năng nghe.

Một lưu ý nhỏ cho câu ba. Hành động phục vụ càng nhiều mục tiêu thì càng *cảm thấy* kém hiệu quả cho từng mục tiêu, như quán cơm bán đủ món: tiện, nhưng món nào cũng có vẻ không ngon bằng quán chuyên <a class="ev ev-mid" href="#r-zhang2007" title="Zhang, Fishbach &amp; Kruglanski 2007 · Bằng chứng vừa"></a>. Vì vậy lúc làm, hãy giữ trong đầu một mục tiêu chính.

Để không bỏ quên điều gì, có thể soát mục tiêu theo sáu lĩnh vực của một cuộc đời: sức khoẻ, quan hệ, nghề và học, tiền, nghỉ ngơi và niềm vui, chăm sóc và đóng góp <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Đây là một công cụ để soát, không phải kết quả nghiên cứu. Mỗi quý, lĩnh vực nào cũng nên có ít nhất một mức duy trì, không cần là một mục tiêu lớn.

**Cho một mục tiêu đi qua ba câu hỏi <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** Giả sử bạn đang cân nhắc thêm "học đàn guitar" trong quý này.

1. *Vì quan tâm hay vì áp lực?* Bạn hỏi lại mình: muốn học vì thật sự thích, muốn Tết này đàn hát cho cả nhà nghe, hay vì tuần trước thấy bạn bè đăng video đàn hát và sợ mình kém cạnh? Nếu câu trả lời thật là cái thứ hai, mục tiêu này dễ thành thứ được nghĩ tới nhiều mà làm ít.
2. *Xung đột hay hỗ trợ?* Các buổi tối trong tuần đã dành cho push goal tiếng Anh. Thêm một buổi tập đàn vào tối thì hai mục tiêu giành nhau đúng một khung giờ.
3. *Có cách nào phục vụ cả hai?* Có: học đàn qua video hướng dẫn bằng tiếng Anh, vào một buổi 60–90 phút sáng thứ Bảy. Một hành động, hai mục tiêu. Lúc học, bạn tự nhắc mục tiêu chính của buổi đó là cây đàn.

Kết quả: bạn nhận mục tiêu này, nhưng ở mức maintenance dose, và không lấy mất tối nào của tiếng Anh.

<details><summary>Đọc thêm: vòng tốt của mục tiêu "của mình", và cái giá của xung đột</summary><div class="inner">

Qua các học kỳ, self-concordant goals còn nối thành một vòng tốt. Đạt được mục tiêu ở học kỳ đầu thì sang học kỳ sau, người ta thấy mục tiêu mới "của mình" hơn, và rồi lại đạt tốt hơn <a class="ev ev-mid" href="#r-sheldon2001" title="Sheldon &amp; Houser-Marko 2001 · Bằng chứng vừa"></a>.

Xung đột giữa các mục tiêu đi kèm well-being thấp hơn, còn các mục tiêu hỗ trợ nhau thì khiến người ta dấn thân hơn <a class="ev ev-mid" href="#r-riediger2004" title="Riediger &amp; Freund 2004 · Bằng chứng vừa"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: mục tiêu nào chỉ nằm trong đầu</div>

Liệt kê các mục tiêu bạn đang có. Cạnh mỗi cái, ghi hai con số cho hai tuần vừa qua: số lần bạn *nghĩ* tới nó (ước chừng cũng được) và số lần bạn thật sự *làm* nó. Mục tiêu nào nghĩ nhiều mà làm gần như không, hãy xem nó đang giành giờ với mục tiêu nào, và có cách nào gộp hai cái vào một hành động không. Cuối cùng soát qua sáu lĩnh vực ở trên: lĩnh vực nào không có nổi một mức duy trì, đó là chỗ đang bị bỏ quên <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="portfolio"><span class="num">17</span>Một push goal, phần còn lại ở maintenance dose</h2>

Muốn tiến bộ ở cả năm mục tiêu, có nên đẩy tất cả cùng lúc? Không. Mỗi quý chỉ dồn sức cho một mục tiêu, gọi là push goal. Những mục tiêu còn lại giữ ở mức tối thiểu để không thụt lùi, gọi là maintenance dose.

Nhà có con thi đại học năm nay <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Cả nhà dồn sức cho kỳ thi: bữa ăn, giờ giấc, tiền học thêm. Những việc khác không bị bỏ mặc: vẫn đi chợ nấu cơm, vẫn đóng tiền điện nước, vẫn về quê ngày giỗ, chỉ ở mức vừa đủ để nhà cửa không rối tung. Nhà nào năm đó vừa lo thi, vừa sửa nhà, vừa đổi chỗ làm thì thường việc gì cũng dở dang. Cuộc sống của một người cũng nên vận hành theo kiểu đó, và bốn phát hiện cùng dẫn tới đúng kết luận ấy.

**Ít mà vừa sức thì đổi được nhiều nhất.** Khi người ta được khuyên thay đổi nhiều hành vi cùng lúc, một số lượng **vừa phải** tạo ra nhiều thay đổi nhất. Quá ít hay quá nhiều đều kém, và người càng ít động lực thì càng dễ quá tải <a class="ev ev-high" href="#r-wilson2015" title="Wilson 2015 · Bằng chứng mạnh"></a>.

**Nhiều if-then plan cùng lúc phản tác dụng.** Một kế hoạch duy nhất thì hiệu quả, nhưng viết kế hoạch cho nhiều mục tiêu một lượt lại cho kết quả tệ hơn <a class="ev ev-mid" href="#r-dalton2012" title="Dalton &amp; Spiller 2012 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-verhoeven2013" title="Verhoeven 2013 · Bằng chứng vừa"></a>.

**Mục tiêu có "thưởng" nuốt hết thời gian.** Khi các mục tiêu ngang hàng, người ta tự dồn thời gian vào mục tiêu đang tụt sau nhất. Nhưng khi một mục tiêu có phần thưởng riêng, như một hạn chót hay một người đang chờ kết quả, mục tiêu đó **chiếm sạch** thời gian <a class="ev ev-mid" href="#r-schmidt2007" title="Schmidt &amp; DeShon 2007 · Bằng chứng vừa"></a>. Đó là lý do tuần nào có việc gấp phải xong thì tuần đó chẳng ai nhớ gọi điện về nhà.

**Mục tiêu bị bỏ quên không biến mất ồn ào.** Khi đang dồn sức luyện nghe tiếng Anh, việc gọi về nhà hay tập thể dục không hề bị gạch bỏ. Chúng chỉ lặng lẽ biến khỏi đầu <a class="ev ev-mid" href="#r-shah2002" title="Shah, Friedman &amp; Kruglanski 2002 · Bằng chứng vừa"></a>. Vì thế mục tiêu bị bỏ quên cứ lùi dần mà mình không nhận ra.

Từ đó có một quy tắc cho cả danh mục mục tiêu <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Push goal được dồn sức: có if-then plan chi tiết, chiếm khung giờ tốt nhất trong ngày, và đo hằng tuần. Các mục tiêu còn lại ở maintenance dose, với một kế hoạch cố định thật đơn giản: một khung giờ nhỏ, hoặc một default tự động như lệnh chuyển tiền ngày lương về. Những mục tiêu không có phần thưởng từ bên ngoài, như sức khoẻ, quan hệ, gia đình, cần giữ khung giờ cố định trên lịch. Nếu không, những việc có hạn chót và có người chờ sẽ lấy hết thời gian của chúng, mà mình cũng chẳng nhận ra. Khi một mục tiêu đi trước kế hoạch, hãy coast có chủ đích: chuyển phần sức dư sang mục tiêu đang tụt sau.

**Một tuần chuyển nhà, đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.**

- *Tình huống.* Thứ Hai, bạn biết phải dọn sang chỗ ở mới trước thứ Bảy. Lịch tuần có một buổi tối hẹn với người yêu, bốn buổi nghe tiếng Anh, và cuộc gọi về nhà tối thứ Hai.
- *Cơ chế dự đoán gì.* Chuyển nhà có hạn chót và có chủ nhà đang chờ lấy lại phòng, nên nó sẽ hút hết thời gian. Cuộc gọi về nhà và buổi đi bộ sẽ không bị ai huỷ, chúng chỉ lặng lẽ biến khỏi đầu. Chủ nhật, dọn xong, bạn dễ "thưởng" cho mình một ngày bỏ hết mọi mục tiêu.
- *Bạn làm gì.* Ngay sáng thứ Hai, lúc lên kế hoạch tuần, hạ push goal xuống minimum dose: mỗi tối 15 thẻ từ thay cho 25 phút. Buổi tối hẹn với người yêu giữ nguyên, rủ người kia cùng đi mua đồ cho chỗ ở mới. Cuộc gọi về nhà chuyển sang lúc ngồi nghỉ giữa hai đợt khuân đồ.
- *Kết quả.* Hết tuần, nhà đã dọn xong, và không mục tiêu nào về số không. Tuần sau quay lại mức cũ dễ hơn nhiều so với làm lại từ đầu.

<details><summary>Đọc thêm: lần lượt hay cùng lúc, goal shielding, và cái bẫy "tự thưởng"</summary><div class="inner">

Trong sáu thử nghiệm ngẫu nhiên, thay đổi nhiều hành vi lần lượt hay cùng lúc cho kết quả ngang nhau <a class="ev ev-mid" href="#r-james2016" title="James 2016 · Bằng chứng vừa"></a>. Tức là chọn theo sức của mình, miễn vừa sức.

Hiện tượng mục tiêu đang theo đuổi che khuất các mục tiêu khác gọi là goal shielding <a class="ev ev-mid" href="#r-shah2002" title="Shah, Friedman &amp; Kruglanski 2002 · Bằng chứng vừa"></a>.

Tiến bộ ở một mục tiêu có thể khiến người ta tự cho phép mình làm điều đi ngược lại chính nó <a class="ev ev-mid" href="#r-fishbach2005" title="Fishbach &amp; Dhar 2005 · Bằng chứng vừa"></a>. Vừa tập xong một buổi nặng, ly trà sữa full topping bỗng thấy hợp lý hẳn. Vì vậy phần sức dư nên chuyển sang mục tiêu khác, thay vì "thưởng" cho mình bằng việc đi ngược mục tiêu.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: bạn thật sự có mấy push goal</div>

Nhìn lại lịch và ghi chép của hai tuần vừa qua. Đếm xem có bao nhiêu mục tiêu được bạn đối xử như push goal: có kế hoạch chi tiết, chiếm khung giờ tốt nhất. Nếu là ba, bốn cái, nhiều khả năng không cái nào thật sự được dồn sức. Rồi xem những mục tiêu không có deadline, như vận động, gọi về nhà, tối với người yêu, trong tuần bận nhất có được giờ nào không. Nếu tuần bận nào chúng cũng về số không, chúng cần một khung cố định trên lịch, chứ không phải thêm quyết tâm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="plans-and-goal-types"><span class="num">18</span>Loại mục tiêu và cách lập kế hoạch</h2>

<h3 id="goal-types"><span class="num">18.1</span>Đặt mục tiêu ở tầng nào</h3>

Nên đặt mục tiêu là "IELTS 6.5" hay "năm buổi nghe mỗi tuần"? Hằng ngày, hãy lái bằng mục tiêu quy trình, tức điều bạn làm được ngay hôm nay. Mục tiêu kết quả vẫn giữ, nhưng chỉ để đo định kỳ.

Hình dung một cầu thủ bóng đá đặt bóng lên chấm phạt đền. Anh ta có thể nghĩ tới một trong ba điều: "phải thắng trận này" (kết quả), "phải sút vào 8 trên 10 quả" (thành tích), hoặc "đặt chân trụ sát bóng, mắt nhìn góc đã chọn" (quy trình). Điều thứ ba nghe nhỏ nhất, nhưng là điều duy nhất anh ta thật sự điều khiển được ngay lúc đó.

Một meta-analysis trong thể thao so sánh đúng ba loại mục tiêu này. Mục tiêu **kết quả** như thắng giải gần như không có tác dụng. Mục tiêu **thành tích** như đạt thời gian X có tác dụng vừa phải. Còn mục tiêu **quy trình**, tức điều mình tập trung làm ngay khi đang thực hiện kỹ năng, có tác dụng lớn hơn hẳn cả hai <a class="ev ev-mid" href="#r-williamson2022" title="Williamson 2022 · Bằng chứng vừa"></a>.

Mở rộng ý đó sang những mục tiêu như "năm buổi retrieval mỗi tuần" thay cho "đạt IELTS 6.5" là suy luận của cuốn sách <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Lý do dễ hiểu: kết quả phụ thuộc nhiều thứ ngoài tầm tay, như đề hôm đó khó hay dễ, giám khảo khó tính hay không. Còn quy trình là thứ mình làm được ngay hôm nay.

Với kỹ năng phức tạp mà bạn mới bắt đầu, có một loại mục tiêu còn tốt hơn: **learning goal**, mục tiêu về việc học *cách* làm. Ví dụ: "tìm ba chiến lược để bắt được số liệu khi nghe". Loại này tốt hơn cả mục tiêu kết quả lẫn lời dặn "cố hết sức" <a class="ev ev-mid" href="#r-winters1996" title="Winters &amp; Latham 1996 · Bằng chứng vừa"></a>.

Nhưng đừng vứt mục tiêu kết quả đi. Như chương sau sẽ cho thấy, muốn kết quả thay đổi thì vẫn phải theo dõi kết quả. Cầu thủ kia nghĩ về chân trụ khi sút, nhưng sau trận vẫn xem lại tỷ lệ sút vào. Cần cả hai tầng.

<details><summary>Đọc thêm: giới hạn của meta-analysis, và tổng kết goal setting</summary><div class="inner">

Con số trong thể thao cần đọc với chút dè dặt. Cả 27 nghiên cứu đều trong thể thao, phần lớn làm trong phòng thí nghiệm, và phần mục tiêu kết quả chỉ dựa trên hai nghiên cứu <a class="ev ev-mid" href="#r-williamson2022" title="Williamson 2022 · Bằng chứng vừa"></a>.

Tổng kết 35 năm nghiên cứu về goal setting cũng nói vậy. Với việc đơn giản, mục tiêu cụ thể và khó tốt hơn "cố hết sức". Với việc phức tạp, mục tiêu về việc học tốt hơn <a class="ev ev-high" href="#r-locke2002" title="Locke &amp; Latham 2002 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="planning-tools"><span class="num">18.2</span>Những công cụ lập kế hoạch có bằng chứng</h3>

Có công cụ lập kế hoạch nào thật sự có tác dụng không? Có hai cái nên dùng cho push goal: một câu "khi… thì…" gắn với ngày giờ cụ thể, và WOOP để nhắm đúng vào trở ngại trong chính mình.

**Implementation intention** là kế hoạch dạng "khi [tình huống] thì tôi [hành động]". Đây là công cụ mạnh nhất, nên dành cho push goal <a class="ev ev-high" href="#r-sheeran2025" title="Sheeran 2025 · Bằng chứng mạnh"></a>. "Khi ăn tối xong và rửa bát xong, mình mở app thẻ từ ngay tại bàn ăn" mạnh hơn nhiều so với "tối nay sẽ học".

**Ghi ngày và giờ cụ thể** biến ý định thành lịch hẹn. Chỉ cần nhắc người ta tự ghi ngày giờ sẽ đi tiêm phòng, tỷ lệ tiêm đã tăng 4,2 điểm phần trăm so với mức nền 33,1% <a class="ev ev-high" href="#r-milkman2011" title="Milkman 2011 · Bằng chứng mạnh"></a>. Mấy điểm phần trăm nghe thì nhỏ, nhưng công sức bỏ ra chỉ là một dòng ghi chú.

**WOOP** (Wish – Outcome – Obstacle – Plan) đi thêm một bước. Bạn hình dung điều mong muốn ("nói tiếng Anh tự tin khi đi du lịch"), hình dung kết quả đẹp nhất, rồi hình dung **trở ngại thật nằm trong chính mình** ("mình sợ nói sai rồi bị cười"). Cuối cùng lập kế hoạch cho đúng trở ngại đó: "khi muốn im lặng, mình sẽ hỏi một câu ngắn đã chuẩn bị trước". Phương pháp này có tác dụng nhỏ nhưng đều <a class="ev ev-mid" href="#r-cross2019" title="Cross &amp; Sheffield 2019 · Bằng chứng vừa"></a>.

**WOOP cho một buổi tối, đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.**

- *Wish.* "Nghe hiểu được một podcast tiếng Anh mà không cần mở transcript."
- *Outcome.* Hình dung kết quả tốt nhất: nghe trọn một tập, hiểu được ý chính, và kể lại được cho người nhà nghe.
- *Obstacle, trở ngại trong chính mình.* Không phải "không có thời gian". Trở ngại thật là: đi làm về tới nhà, mệt, ngồi xuống sofa là tay mở TikTok.
- *Plan.* "Khi bước vào cửa, mình đặt điện thoại lên kệ sạc. Khi ăn tối xong, mình mở đoạn nghe đã chọn sẵn từ Chủ nhật, ngồi ở bàn chứ không ngồi sofa."

Khác biệt so với một lời hứa "tối nay học" nằm ở dòng Obstacle. Kế hoạch nhắm đúng vào lúc vừa về tới nhà và ngồi xuống sofa, chỗ buổi tối hay trượt khỏi dự định.

<details><summary>Đọc thêm: thêm bằng chứng, và ba công cụ nhỏ khác</summary><div class="inner">

Hỏi cử tri về kế hoạch đi bầu cụ thể, như mấy giờ, từ đâu đi, làm tỷ lệ đi bầu tăng 4,1 điểm phần trăm <a class="ev ev-high" href="#r-nickerson2010" title="Nickerson &amp; Rogers 2010 · Bằng chứng mạnh"></a>.

WOOP còn có tên là mental contrasting. Khi kết hợp với implementation intention, tác dụng nhỉnh hơn một chút <a class="ev ev-mid" href="#r-wang2021" title="Wang 2021 · Bằng chứng vừa"></a>. Các tác giả cảnh báo có thể những nghiên cứu không ra kết quả đã không được công bố.

**Commitment device** là cách tự khoá lựa chọn tương lai khi đang tỉnh táo, như đưa thẻ ATM cho mẹ giữ để khỏi tiêu lung tung. Tài khoản tiết kiệm có khoá ở [chương 12](#body-money) là một ví dụ <a class="ev ev-high" href="#r-ashraf2006" title="Ashraf, Karlan &amp; Yin 2006 · Bằng chứng mạnh"></a>. Những người có present bias mạnh nhất, tức dễ bị cái trước mắt kéo đi nhất, lại chính là những người chủ động tìm đến cam kết <a class="ev ev-mid" href="#r-augenblick2015" title="Augenblick 2015 · Bằng chứng vừa"></a>. Họ biết mình yếu ở đâu.

**Temptation bundling** là gói một thứ mình thích vào việc mình nên làm, như chỉ cho phép mình nghe podcast yêu thích lúc đang tập. Với cách này, số lần đi tập tăng lúc đầu rồi giảm dần <a class="ev ev-mid" href="#r-milkman2014" title="Milkman, Minson &amp; Volpp 2014 · Bằng chứng vừa"></a>. Một thử nghiệm lớn hơn với 6.792 người cho thấy: được tặng sách nói kèm lời khuyên chỉ nghe khi tập, khả năng mỗi tuần có đi tập tăng 10–14% so với nhóm không được gì. Riêng lời khuyên "chỉ nghe khi tập" chỉ thêm được một chút so với việc tặng sách nói không thôi <a class="ev ev-mid" href="#r-kirgios2020" title="Kirgios 2020 · Bằng chứng vừa"></a>.

**Fresh start** là bắt đầu ở một mốc thời gian: thứ Hai, đầu tháng, sinh nhật, sau Tết. Qua các mốc đó, người ta tự nhiên hăng hái theo đuổi mục tiêu hơn, như thể vừa lật sang một trang mới <a class="ev ev-mid" href="#r-dai2014" title="Dai 2014 · Bằng chứng vừa"></a>.

Như [chương 3](#cold-and-hot) đã cho thấy, khi dự đoán một việc mất bao lâu, nhìn lại **những lần trước** của chính mình xoá được sự lạc quan quá đà của planning fallacy <a class="ev ev-high" href="#r-buehler1994" title="Buehler 1994 · Bằng chứng mạnh"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: mục tiêu của bạn đang ở tầng nào</div>

Viết ra các mục tiêu tuần này. Cạnh mỗi cái, đánh dấu nó là kết quả ("IELTS 6.5"), thành tích ("làm đề được 30/40") hay quy trình ("bốn buổi nghe, mỗi buổi tự nói lại ý chính"). Viết lại mỗi mục tiêu kết quả thành một mục tiêu quy trình kèm một if-then có giờ cụ thể. Cuối tuần, đếm xem bao nhiêu mục tiêu quy trình đã làm được, so với tỷ lệ của những tuần bạn chỉ ghi mục tiêu kết quả. Nếu chênh rõ, đó là tầng mục tiêu hợp với bạn lúc này. Band thì vẫn đo, nhưng mỗi tám tuần <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="monitoring"><span class="num">19</span>Ghi lại, chia sẻ, và nhịp review</h2>

<h3 id="monitoring-evidence"><span class="num">19.1</span>Monitoring</h3>

Ghi chép tiến độ có đáng công không, và nên ghi gì? Có, và cách ghi quan trọng hơn bạn nghĩ. Ghi ra giấy hay app, kể cho một người, và theo dõi cả việc mình làm lẫn kết quả nó mang lại.

Giảm cân mà không bao giờ bước lên cân thì giống đi xe máy ban đêm không bật đèn: xe vẫn đi, nhưng chẳng biết mình đang lệch về đâu. Tổng hợp 138 thử nghiệm ngẫu nhiên cho thấy theo dõi tiến độ, tức monitoring, giúp tăng khả năng đạt mục tiêu ở mức vừa phải <a class="ev ev-high" href="#r-harkin2016" title="Harkin 2016 · Bằng chứng mạnh"></a>.

Đáng chú ý hơn là *cách* theo dõi. Cũng tổng hợp đó cho thấy hai điều. Ghi lại ra giấy hay vào app có tác dụng rõ hơn chỉ nhớ trong đầu. Và báo cho người khác biết tiến độ của mình có tác dụng mạnh gấp hơn hai lần so với giữ riêng cho mình.

Còn một quy luật nữa, gọi là matching. Theo dõi **hành vi** tác động mạnh nhất lên chính hành vi, còn theo dõi **kết quả** tác động mạnh nhất lên chính kết quả. Đếm số buổi học mỗi tuần giúp bạn học đều. Làm bài nghe thử mỗi tháng giúp điểm nghe đi lên. Vì vậy cần cả hai: ghi hành vi hằng ngày, và đo kết quả định kỳ.

Sau một tuần không như ý, hãy nhìn lại theo mục tiêu nhỏ ("tuần này mình đạt 3 trên 5 buổi"). Cách nhìn đó giữ tâm trạng tốt hơn nhìn theo mục tiêu lớn ("mình vẫn còn xa IELTS 6.5 quá") <a class="ev ev-mid" href="#r-housermarko2008" title="Houser-Marko &amp; Sheldon 2008 · Bằng chứng vừa"></a>. Gộp mấy điều trên lại: kể tóm tắt tuần cho một người, như người yêu hay một người bạn, vừa là cách theo dõi mạnh nhất, vừa là một dịp để gần nhau hơn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<details><summary>Đọc thêm: con số thật của monitoring</summary><div class="inner">

Tổng hợp của Harkin gồm 138 thử nghiệm với gần 20.000 người. Khi hiệu chỉnh cho việc những nghiên cứu không ra kết quả thường không được công bố, tác dụng chỉ còn khoảng một nửa. Tác dụng vẫn có thật, nhưng nhỏ hơn con số hay được trích <a class="ev ev-high" href="#r-harkin2016" title="Harkin 2016 · Bằng chứng mạnh"></a>. Cả hai tác động của quy luật matching đều khá lớn.

</div></details>

<h3 id="reviews"><span class="num">19.2</span>Nhịp review</h3>

Review bao lâu một lần, và review những gì? Mỗi ngày một dòng, mỗi tuần 20–30 phút vào tối Chủ nhật, mỗi tháng một con số kết quả, mỗi quý một lần chọn lại mục tiêu.

Hãy nghĩ tới một đội bóng đá phong trào <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Đá xong, cả đội ngồi lại quán nước ven sân, hỏi nhau hôm nay chỗ nào ổn, chỗ nào hỏng, trận sau đổi gì. Bằng chứng mạnh nhất về review đến từ đúng những buổi như vậy trong công việc và huấn luyện. Một buổi debrief sau công việc nâng hiệu suất khoảng 25% <a class="ev ev-high" href="#r-tannenbaum2013" title="Tannenbaum &amp; Cerasoli 2013 · Bằng chứng mạnh"></a>. Chưa có thử nghiệm nào đo trực tiếp việc tự review cho mục tiêu cuộc sống, nên nhịp dưới đây là suy luận từ các bằng chứng đó <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

```mermaid
flowchart LR
  D["Mỗi ngày · 1 phút<br/>ghi hành vi"] --> W["Mỗi tuần · 20–30 phút<br/>đếm, xem tốc độ,<br/>một điều tốt, một điều chưa tốt,<br/>lịch tuần sau theo dữ liệu"]
  W --> M["Mỗi tháng<br/>một số đo kết quả<br/>cho push goal"]
  M --> Q["Mỗi quý<br/>giữ / thu nhỏ / bỏ;<br/>chọn push goal mới"]
  Q -.-> D
```

**Mỗi ngày**, chỉ cần một dòng: minimum dose đã xong chưa, năng lượng thế nào, và điều gì đã quyết định buổi tối hôm đó. Ví dụ: "về muộn vì kẹt xe", "ăn xong nằm luôn lên giường với điện thoại".

**Mỗi tuần**, đếm hành vi so với mục tiêu nhỏ và nhìn tốc độ: đi trước thì coast, tụt sau thì dồn sức hoặc sửa kế hoạch. Ghi một điều đã suôn sẻ và một điều chưa, vì nhìn lại **cả thành công lẫn thất bại** tốt hơn chỉ mổ xẻ thất bại <a class="ev ev-mid" href="#r-ellis2005" title="Ellis &amp; Davidi 2005 · Bằng chứng vừa"></a>. Với việc đang dở, viết một ghi chú "ready-to-resume": làm tới đâu, bước tiếp theo là gì. Ghi chú đó giúp đầu óc buông được việc ra <a class="ev ev-mid" href="#r-leroy2018" title="Leroy &amp; Glomb 2018 · Bằng chứng vừa"></a>. Lập lịch tuần sau theo dữ liệu tuần này chứ không theo mong muốn, rồi gửi tóm tắt cho một người.

**Mỗi tháng**, đo một con số kết quả cho push goal, như một bài nghe thử hay một lần cân. Theo quy luật matching, theo dõi kết quả là cách tác động mạnh nhất lên kết quả.

**Mỗi quý**, quyết định giữ, thu nhỏ hay bỏ từng mục tiêu theo tiêu chí đã viết từ đầu quý, và chọn push goal cho quý sau.

**Một buổi review tối Chủ nhật, đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** 20:00, 25 phút, mở bảng ghi chép tuần.

1. *Đếm.* Nghe tiếng Anh: 3 trên 4 buổi. Đi bộ: 4 trên 5 ngày. Tập sức mạnh: 1 trên 2 buổi. Chuyển tiền tự động: đã thực hiện.
2. *Nhìn tốc độ.* Nghe tiếng Anh đã ba tuần ở mức 3 buổi: ổn định nhưng chưa đạt. Vận động đi đúng kế hoạch.
3. *Một điều suôn sẻ, một điều chưa.* Suôn sẻ: hai tối để điện thoại lên kệ ngay khi vào cửa thì cả hai tối đều học. Chưa: tối thứ Năm về 20:00, bỏ học.
4. *Lịch tuần sau theo dữ liệu.* Thứ Năm thường về muộn, nên đổi buổi thứ Năm thành minimum dose 15 thẻ từ. Giữ bốn buổi ở các tối còn lại.
5. *Gửi tóm tắt.* Ba dòng gửi người yêu: "Tuần này 3/4 buổi nghe, đi bộ đều. Phát hiện: điện thoại lên kệ là học được. Tuần sau thứ Năm làm nhẹ."

Chỉ viết mục tiêu ra giấy thì không giúp được gì nhiều. Khi làm lại với khoảng 1.400 sinh viên, việc viết mục tiêu không cho tác dụng nào <a class="ev ev-high" href="#r-dobronyi2019" title="Dobronyi, Oreopoulos &amp; Petronijevic 2019 · Bằng chứng mạnh"></a>. Một tờ giấy ghi mục tiêu dán trên tường thì chẳng thay đổi được gì. Điều có cơ sở là viết ra **kèm** ngày giờ cụ thể, có đo, và có review.

<details><summary>Đọc thêm: thêm bằng chứng về review và về việc viết mục tiêu</summary><div class="inner">

After-action review là kiểu rút kinh nghiệm sau mỗi đợt huấn luyện của quân đội. Cách này cải thiện rõ rệt kết quả huấn luyện nói chung <a class="ev ev-high" href="#r-keiser2021" title="Keiser &amp; Arthur 2021 · Bằng chứng mạnh"></a>.

Cuốn sách chưa tìm thấy thử nghiệm nào đo trực tiếp việc một người tự review mỗi tuần cho mục tiêu cuộc sống.

Kết quả "viết mục tiêu giúp ích" ban đầu đến từ một thử nghiệm nhỏ với 85 sinh viên đang gặp khó, cho thấy viết mục tiêu làm tăng điểm số <a class="ev ev-low" href="#r-morisano2010" title="Morisano 2010 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Bản làm lại với khoảng 1.400 sinh viên ở trên chính là phép thử cho kết quả đó.

Huấn luyện cách đặt mục tiêu cũng không giúp người ta đạt mục tiêu nhiều hơn sau đó <a class="ev ev-mid" href="#r-sheldon2002" title="Sheldon 2002 · Bằng chứng vừa"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: kể cho một người có làm bạn đều hơn không</div>

Bốn tuần tới, mỗi tối Chủ nhật gửi cho người yêu hoặc một người bạn đúng ba dòng: con số của push goal, một điều suôn sẻ, một điều sẽ đổi. So số buổi học của bốn tuần đó với bốn tuần trước, khi bạn giữ riêng cho mình. Nếu con số tăng, thì phần "cho người khác thấy" đang có tác dụng với bạn. Nếu không đổi, xem lại phần "lịch tuần sau theo dữ liệu": có thể bạn có ghi, có kể, nhưng lịch vẫn lập theo mong muốn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="flexibility"><span class="num">20</span>Linh hoạt: biết buông và biết tìm mục tiêu mới</h2>

Khi một mục tiêu không còn khả thi, nên cố hay nên bỏ? Bỏ cũng được, miễn là ngay sau đó bạn gắn với một mục tiêu mới. Và đừng bao giờ quyết bỏ vào buổi tối tệ nhất tuần.

Bạn đặt mục tiêu chạy marathon cuối năm. Tháng thứ ba, đầu gối bắt đầu đau, bác sĩ bảo nghỉ chạy dài. Có ba kiểu người ở chỗ này. Người thứ nhất cố chạy tiếp, chấn thương nặng hơn. Người thứ hai bỏ chạy, rồi bỏ luôn vận động, và cả năm sau không tập gì. Người thứ ba bỏ marathon, nhưng ngay tuần đó chuyển sang bơi hai buổi một tuần. Người thứ ba không kiên trì hơn ai. Anh ta chỉ có hai kỹ năng mà hai người kia không có.

Kỹ năng thứ nhất là buông một mục tiêu không còn khả thi, gọi là disengagement. Kỹ năng thứ hai là gắn với một mục tiêu mới thay thế, gọi là re-engagement. Cả hai đều chỉ liên hệ nhẹ với chất lượng sống, nhưng **gắn với mục tiêu mới quan trọng hơn hẳn buông bỏ**: mối liên hệ với chất lượng sống mạnh hơn gấp đôi <a class="ev ev-mid" href="#r-barlow2020" title="Barlow, Wrosch &amp; McGrath 2020 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-wrosch2003" title="Wrosch 2003 · Bằng chứng vừa"></a>.

Cùng nghiên cứu đó có một chi tiết cần nhớ. Ở những người có nguy cơ trầm cảm, mối liên hệ bị **đảo ngược**: buông nhiều lại đi kèm nhiều triệu chứng trầm cảm hơn, chứ không ít hơn. Một suy luận thận trọng từ đó: quyết định buông nên đưa ra ở buổi review, lúc bình tĩnh <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Buổi tối nằm thẫn thờ sau một ngày tồi tệ, mọi mục tiêu đều trông vô nghĩa. Đó là lúc tệ nhất để quyết định bỏ cái nào.

```mermaid
flowchart TB
  S["Mục tiêu đang chững lại"] --> Q1{"Tiêu chí viết từ<br/>đầu quý nói gì?"}
  Q1 -->|"vẫn đáng theo"| K["Giữ"]
  Q1 -->|"quá sức lúc này"| SH["Thu nhỏ về minimum dose"]
  Q1 -->|"không còn ý nghĩa"| D{"Đang trong giai đoạn<br/>tâm trạng xấu?"}
  D -->|"có"| SH
  D -->|"không"| B["Buông"]
  B --> R["Đặt ngay một mục tiêu thay thế<br/>(re-engagement), dù nhỏ"]
```

Hình trên tóm lại năm quy tắc linh hoạt <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>:

- Viết tiêu chí giữ, thu nhỏ hay bỏ **ngay lúc chọn mục tiêu**, khi còn tỉnh táo. Đừng quyết chuyện đó lúc đang chán.
- Thu nhỏ trước khi bỏ. Minimum dose là "chế độ khẩn cấp" của mọi mục tiêu. Tháng bận nhất năm, 15 thẻ từ mỗi ngày vẫn giữ cho tiếng Anh không rơi rụng hết.
- Không bỏ nhiều mục tiêu cùng lúc khi đang buồn.
- Bỏ một mục tiêu thì đặt ngay một mục tiêu thay thế, như người thứ ba chuyển từ chạy sang bơi.
- Khi cuộc sống thay đổi, làm lại [phương pháp xây một tuần](#week-method) ở Phần IV thay vì cố nhét lịch cũ vào hoàn cảnh mới.

**Đi qua sơ đồ với một mục tiêu đang chững <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** Cuối tháng 11, buổi tập đàn sáng thứ Bảy đã bị bỏ ba lần liền vì phải về quê phụ việc nhà. Tối thứ Năm, sau một ngày mệt, bạn nghĩ: "Thôi bỏ hẳn cái này cho xong".

- *Ô thứ nhất: tiêu chí viết từ đầu quý nói gì?* Tiêu chí ghi "bỏ nếu không còn thấy thích; thu nhỏ nếu thiếu giờ". Lý do lần này là thiếu giờ, không phải hết thích.
- *Nhánh "quá sức lúc này".* Thu nhỏ: thay buổi 60–90 phút bằng 20 phút ôn hợp âm vào sáng Chủ nhật.
- *Không quyết định vào tối thứ Năm.* Ý định bỏ đến đúng vào buổi tối tệ nhất tuần, mà loại quyết định này nên để tới buổi review Chủ nhật.

Kết quả: mục tiêu vẫn còn, ở mức nhỏ. Nếu tháng sau việc nhà nhẹ bớt, bạn đưa nó về mức cũ mà không phải làm lại từ đầu.

<details><summary>Đọc thêm: psychological flexibility, và điều giữ một hành vi ở lại</summary><div class="inner">

Psychological flexibility là khả năng điều chỉnh hành vi theo tình huống và theo giá trị của mình, kể cả khi đang có cảm xúc khó chịu. Ý tưởng này được đề xuất như cốt lõi của sức khoẻ tâm thần <a class="ev ev-low" href="#r-kashdan2010" title="Kashdan &amp; Rottenberg 2010 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Nhưng thang đo phổ biến nhất của khái niệm này lại gần như trùng với chính sự đau khổ mà nó muốn giải thích, giống như đo "mức hay buồn" để giải thích "vì sao buồn" <a class="ev ev-low" href="#r-doorley2020" title="Doorley 2020 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

Như [chương 6](#habits) đã nói, muốn duy trì một hành vi thì phải hài lòng với kết quả thật mà hành vi đó mang lại <a class="ev ev-mid" href="#r-rothman2000" title="Rothman 2000 · Bằng chứng vừa"></a>.

Người duy trì được việc vận động có niềm tin vào khả năng của mình (self-efficacy) và ý định cao hơn người bỏ cuộc <a class="ev ev-mid" href="#r-amireault2013" title="Amireault 2013 · Bằng chứng vừa"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: muốn buông vào lúc nào</div>

Trong một tháng, mỗi lần bạn có ý nghĩ muốn bỏ một mục tiêu, ghi một dòng: giờ nào, ngày nào, năng lượng từ 1 đến 5, và lý do bạn nghĩ ra. Cuối tháng đọc lại. Nếu phần lớn các dòng rơi vào tối ngày làm với năng lượng 1–2, thì ý muốn buông đang đến từ tâm trạng chứ không phải từ dữ liệu, và quyết định nên để dành cho buổi review. Nếu một mục tiêu vẫn bị muốn bỏ cả vào sáng Chủ nhật lúc tỉnh táo, đó mới là dấu hiệu đáng xem xét. Khi đó, nhớ đặt ngay một mục tiêu thay thế <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="goal-myths"><span class="num">21</span>Các framework phổ biến</h2>

SMART, OKR, "systems, not goals", identity-based habits: cái nào đáng dùng? Không cái nào có bằng chứng mạnh như lời quảng cáo. Phần dùng được thường chính là những gì các chương trước đã nói: cụ thể, đo được, có ngày giờ, có review.

**SMART** không dựa trên lý thuyết khoa học nào. Khi dùng như một bộ quy tắc, nó không khớp với bằng chứng thực nghiệm <a class="ev ev-mid" href="#r-swann2022" title="Swann 2022 · Bằng chứng vừa"></a>. Riêng phần "cụ thể và đo được" thì có hỗ trợ từ các nghiên cứu goal setting. **OKR** dùng cho cá nhân chưa có nghiên cứu thực nghiệm nào. Các thành phần của nó, như mục tiêu cụ thể và đo lường, thì có hỗ trợ ở nơi khác.

**Identity-based habits** dựa trên ý tưởng gọi tên bản thân để thay đổi hành vi: "mình là người đọc sách" thay vì "mình muốn đọc sách". Nghiên cứu nổi tiếng nhất cho ý tưởng này đã không lặp lại được trong một thử nghiệm thực địa lớn, với tác dụng gần như bằng không <a class="ev ev-high" href="#r-gerber2016" title="Gerber 2016 · Bằng chứng mạnh"></a>.

**"Systems, not goals"** sai nếu hiểu là bỏ hẳn mục tiêu. Nó đúng một phần nếu hiểu là đặt mục tiêu ở tầng quy trình, như cầu thủ nghĩ về chân trụ ở [§18.1](#goal-types), với điều kiện vẫn theo dõi kết quả.

**Ma trận Eisenhower** chưa từng được thử nghiệm, nhưng thiên kiến mà nó nhắm tới thì có thật. Người ta hay chọn việc *trông có vẻ* gấp mà lợi ích thấp, như trả lời ngay một tin nhắn trong nhóm Zalo, thay vì việc quan trọng hơn. Hiện tượng này gọi là mere urgency effect <a class="ev ev-mid" href="#r-zhu2018" title="Zhu, Yang &amp; Hsee 2018 · Bằng chứng vừa"></a>.

**Mere urgency trong một buổi sáng, đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** 08:00 sáng Chủ nhật, bạn ngồi xuống định xem lại chi tiêu cả tháng và lập ngân sách tháng sau, việc quan trọng nhất tuần.

- *Tình huống.* Điện thoại báo bốn tin nhắn mới trong nhóm Zalo gia đình, một cái có chữ "gấp". Thật ra nó chỉ hỏi ai còn giữ ảnh đám cưới năm ngoái, chậm một tiếng cũng không ai sao.
- *Cơ chế dự đoán gì.* Việc *trông* gấp, có hạn chót gần, kéo sự chú ý dù lợi ích thấp. Trả lời xong cái đầu tiên, bạn trả lời luôn ba cái còn lại, lướt thêm một lúc, rồi đã tới giờ đi chợ.
- *Bạn làm gì.* Bật chế độ không làm phiền từ 08:00 tới 09:30, mở tin nhắn một lần lúc 09:30.
- *Kết quả.* Bản ngân sách có trọn 90 phút liền. Tin nhắn "gấp" được trả lời trễ một tiếng rưỡi, và chẳng có chuyện gì xảy ra.

<details><summary>Đọc thêm: mặt trái của mục tiêu, time-blocking, và một nghiên cứu bị rút</summary><div class="inner">

Nghiên cứu identity-based habits nổi tiếng nhất hỏi "bạn có muốn *là một cử tri*" thay vì "bạn có muốn *đi bầu*" <a class="ev ev-low" href="#r-bryan2011" title="Bryan 2011 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Bản làm lại trên thực địa cho tác dụng gần như bằng không <a class="ev ev-high" href="#r-gerber2016" title="Gerber 2016 · Bằng chứng mạnh"></a>.

Có một cuộc tranh luận nghiêm túc về mặt trái của chính việc đặt mục tiêu, gọi là "goals gone wild". Mục tiêu có thể khiến người ta nhìn quá hẹp, thậm chí gian lận để đạt chỉ tiêu <a class="ev ev-low" href="#r-ordonez2009" title="Ordóñez 2009 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Locke và Latham đã phản biện lại <a class="ev ev-low" href="#r-locke2009" title="Locke &amp; Latham 2009 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Ai từng thấy một trường chạy theo chỉ tiêu "trăm phần trăm học sinh khá giỏi" sẽ hiểu nỗi lo này.

**Time-blocking** chưa được thử nghiệm trực tiếp. Gần nhất là bằng chứng về kế hoạch có ngày giờ cụ thể ở [§18.2](#planning-tools). Các nghiên cứu cho thấy người quản lý thời gian tốt hơn thường làm việc hiệu quả hơn ở mức vừa phải, và có well-being cao hơn rõ hơn một chút. Nhưng đó chủ yếu là dữ liệu chụp một thời điểm, nên chưa nói được cái nào dẫn tới cái nào <a class="ev ev-mid" href="#r-aeon2021" title="Aeon 2021 · Bằng chứng vừa"></a>.

Nghiên cứu kinh điển cho rằng tự đặt deadline giúp chống trì hoãn (Ariely & Wertenbroch, 2002) đã bị **rút** vào tháng 9/2026. Lý do là một lần làm lại thất bại và một phân tích cho thấy dữ liệu có dấu hiệu bị sửa <a class="ev ev-mid" href="#r-retractionwatch2026" title="Retraction Watch 2026 · Bằng chứng vừa"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: một ngày bị việc "gấp" kéo đi mấy lần</div>

Chọn một ngày nghỉ bình thường. Mỗi lần bạn bỏ dở việc đang làm để xử lý một thứ có vẻ gấp, như một tin nhắn, một cuộc gọi hay một thông báo, gạch một vạch lên mảnh giấy dán cạnh tủ lạnh. Cuối ngày, đánh dấu vạch nào thật sự không chờ được tới một tiếng sau. Nếu phần lớn các vạch đều chờ được, thì thiên kiến mà ma trận Eisenhower nhắm tới đang có mặt trong ngày của bạn, và một khung bật chế độ không làm phiền vào buổi sáng đáng thử trong một tuần <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<div class="recall">

**Câu hỏi nhớ lại — Phần III (chương 15–21).**

<details><summary>Theo control theory, cảm xúc theo dõi điều gì — vị trí hay tốc độ? Hệ quả cho việc đo lường là gì?</summary><div class="inner">

Tốc độ thu hẹp khoảng cách, như người ngồi taxi lo vì xe kẹt chứ không vì đường còn xa (Carver 2015). Vì vậy hãy đo xu hướng qua nhiều tuần, đừng đánh giá qua một điểm đơn lẻ.

</div></details>

<details><summary>Vì sao chỉ nên có một push goal mỗi quý?</summary><div class="inner">

Nhiều if-then plan cùng lúc phản tác dụng (Dalton & Spiller 2012), số mục tiêu vừa phải tạo nhiều thay đổi nhất (Wilson 2015), và mục tiêu có phần thưởng sẽ chiếm hết thời gian (Schmidt & DeShon 2007).

</div></details>

<details><summary>Theo dõi hành vi và theo dõi kết quả khác nhau thế nào (quy luật matching)?</summary><div class="inner">

Theo dõi hành vi tác động mạnh nhất lên hành vi; theo dõi kết quả tác động mạnh nhất lên kết quả (Harkin 2016). Cần cả hai: ghi hành vi hằng ngày, đo kết quả hằng tháng.

</div></details>

<details><summary>Khi buông một mục tiêu, bước nào quan trọng hơn, và khi nào không nên buông?</summary><div class="inner">

Gắn với một mục tiêu thay thế quan trọng hơn bản thân việc buông — mối liên hệ mạnh hơn gấp đôi. Ở người có nguy cơ trầm cảm, buông nhiều lại đi kèm nhiều triệu chứng hơn (Barlow 2020) — nên quyết định buông ở buổi review lúc bình tĩnh, và thu nhỏ trước khi bỏ.

</div></details>

</div>


<h2 id="part-4" class="part">Phần IV — Từ nguyên lý đến một tuần</h2>

<h2 id="week-method"><span class="num">22</span>Phương pháp xây một tuần</h2>

Có cả một cuốn sách nguyên lý rồi, xếp chúng vào một tuần thế nào? Đặt nền móng vào lịch trước: giấc ngủ, người thân yêu, hồi sức, vận động. Mục tiêu tham vọng vào sau, ở chỗ còn lại.

Xếp đồ vào vali trước một chuyến đi xa, người có kinh nghiệm bỏ đồ to vào trước, như giày, áo khoác, túi đồ vệ sinh. Rồi mới nhét tất, sạc điện thoại vào các khe còn lại. Làm ngược lại thì vali đầy tất mà đôi giày không còn chỗ. Một tuần cũng vậy.

Đây là phần bạn sẽ dùng tới nhiều nhất trong cuốn sách: tám bước để biến mọi nguyên lý ở trên thành một tuần cụ thể, và làm lại mỗi khi lịch sống thay đổi. Thứ tự các bước có lý do. Làm ngược lại thì mục tiêu sẽ lấn hết chỗ của nền móng, và chỉ vài tuần sau là mọi thứ đổ sập.

```mermaid
flowchart TD
  S1["① Các khung cố định<br/>công việc, di chuyển"] --> S2["② Giấc ngủ<br/>giờ thức cố định 7 ngày"]
  S2 --> S3["③ Người thân yêu<br/>khung cố định, nội dung thô"]
  S3 --> S4["④ Hồi sức<br/>khoảng đệm sau giờ làm, rảnh thật"]
  S4 --> S5["⑤ Vận động<br/>tính theo tổng tuần"]
  S5 --> S6["⑥ Một push goal<br/>khung giờ ít tốn sức nhất + if-then"]
  S6 --> S7["⑦ Maintenance dose<br/>default tự động, khung nhỏ"]
  S7 --> S8["⑧ Đệm và review"]
  S8 --> RUN["Sống một tuần, ghi lại,<br/>review, chỉnh"]
  RUN -.->|"tuần sau"| S6
```

**① Các khung cố định.** Ghi lại những gì không đổi được: giờ làm, thời gian di chuyển, những nghĩa vụ cố định. Chỉ ghi sự thật, không ghi mong muốn. Nếu tuần trước ngày nào bạn cũng về tới nhà lúc 7 giờ tối, thì ghi 7 giờ, đừng ghi "6 giờ nếu hôm đó được về sớm". Kế hoạch phải dựa trên dữ liệu thật, không dựa trên kịch bản tưởng tượng ([chương 3](#cold-and-hot)).

**② Giấc ngủ.** Chọn *một* giờ thức dậy cho cả bảy ngày, các ngày lệch nhau không quá khoảng nửa tiếng. Giờ lên giường bằng giờ thức trừ đi ít nhất bảy tiếng ngủ, trừ thêm thời gian để chìm vào giấc. Giấc ngủ đứng thứ hai, trước mọi mục tiêu, vì thiếu ngủ thì mọi thứ còn lại đều hỏng theo mà mình không tự nhận ra ([chương 10](#sleep)). Nó giống chiếc xe máy non hơi bánh: xe vẫn chạy, nhưng đi đâu cũng ì và tốn xăng, mà người lái quen dần nên chẳng nhận ra <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

**③ Người thân yêu.** Đặt các **khung** cố định cho người yêu, bạn bè, gia đình, tức ngày nào, buổi nào. Nhưng để **nội dung** thô: "một tối giữa tuần với người yêu", chứ không phải "19h00–21h30 ăn lẩu ở quán X". Không có khung cố định thì công việc sẽ lấn mất chỗ, còn hẹn giờ chính xác thì giải trí hoá giống công việc ([chương 11](#people)).

**④ Hồi sức.** Một khoảng đệm sau giờ làm để đầu óc gác công việc lại trước khi làm bất cứ điều gì khác. Thêm mỗi tuần ít nhất một khoảng rảnh **không mục đích**. Thật sự rời đầu óc khỏi công việc là trải nghiệm gắn chặt nhất với việc bớt mệt. Còn cắt bớt thời gian rảnh thì không phải lúc nào cũng tốt ([chương 9](#recovery), [chương 11](#people)).

**⑤ Vận động.** Tính theo tổng tuần: khoảng 150 phút cường độ vừa (đi bộ nhanh cũng được tính), hai buổi tập sức mạnh ngắn, và đứng dậy đi lại giữa những quãng ngồi lâu. Mọi đợt vận động đều được tính, kể cả năm phút leo cầu thang ([chương 12](#body-money)).

**⑥ Một push goal.** Đặt push goal vào khung giờ **ít tốn sức nhất** trong ngày, viết một if-then plan, và định ra minimum dose. Càng về cuối ngày, cùng một việc càng tốn sức, nên một bài tập làm lúc 7h sáng nhẹ hơn hẳn lúc 22h. Và một if-then plan thì hiệu quả, nhiều cái cùng lúc thì không ([chương 4](#fatigue), [chương 17](#portfolio)).

**⑦ Maintenance dose.** Mỗi lĩnh vực còn lại nhận một default tự động, như lệnh chuyển tiền ngày nhận lương, hoặc một khung nhỏ cố định ([chương 12](#body-money), [chương 17](#portfolio)).

**⑧ Đệm và review.** Một khoảng trống mỗi tuần để bù cho những trục trặc, vì planning fallacy khiến việc gì cũng trễ hơn dự kiến. Thêm 20–30 phút review cuối tuần, kèm một bản tóm tắt kể cho một người ([chương 19](#monitoring)). Một tuần không có chỗ đệm giống ngày mùng Hai Tết đi chúc Tết xếp kín từ nhà này sang nhà khác: chỉ cần nhà đầu tiên giữ lại ăn thêm nửa tiếng là cả buổi chiều trễ theo <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

Trước khi bắt đầu một tuần mới, đem bản nháp soát lại theo đúng thứ tự tám bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Giấc ngủ có đủ bảy tiếng *cộng* thời gian chìm vào giấc không? Mỗi người thân đã có một khung chưa? Có một khoảng rảnh không mục đích nào không? Có đúng một push goal, với minimum dose đủ nhỏ để làm được cả khi mệt không? Và kế hoạch dựa trên dữ liệu tuần trước, hay dựa trên "mình nên làm được"? Chỉ cần một câu trả lời là "không", hãy sửa chỗ đó trước khi thêm bất cứ mục tiêu nào.

**Soát một bản nháp tuần, đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** Tối Chủ nhật, bạn phác ra tuần sau: "Tối nào cũng học tiếng Anh một tiếng, sáng thứ Bảy chạy bộ, Chủ nhật tập đàn cả buổi chiều". Đem bản nháp qua từng câu hỏi:

1. *Giấc ngủ.* Học một tiếng từ 21:30 tới 22:30 rồi còn tắm, còn lướt, trong khi tuần trước giờ lên giường trung bình đã quá nửa đêm. Bản nháp này đẩy giờ ngủ muộn thêm.
2. *Người thân.* "Tối nào cũng học" đè lên buổi tối đã hẹn với người yêu. Gạch tối đó.
3. *Rảnh không mục đích.* Chiều Chủ nhật đã thành "tập đàn cả buổi", không còn khoảng nào để không làm gì.
4. *Dữ liệu tuần trước.* Tuần trước học được 2 buổi, không phải 5. Một bản kế hoạch năm buổi một tiếng là kịch bản tưởng tượng.
5. *Minimum dose.* Chưa có. Thêm: 15 thẻ từ là đủ tính một ngày.

Bản sửa: bốn buổi 25 phút (trừ tối đã hẹn), minimum dose 15 thẻ từ, tập đàn thu lại thành một buổi 60–90 phút sáng thứ Bảy, chiều Chủ nhật để trống. Nhìn thì khiêm tốn hơn bản nháp, nhưng bản này mới có cơ trụ được tới thứ Năm.

<div class="callout data"><div class="ct">Tự kiểm tra: tuần này bạn xếp vali theo thứ tự nào</div>

Mở lịch tuần tới và tô màu: giấc ngủ, người thân, hồi sức, vận động một màu; mục tiêu tham vọng một màu khác. Rồi hỏi: khối nào được đặt vào lịch trước? Nếu các khối học đã chiếm chỗ và giấc ngủ chỉ là "phần còn lại sau khi học xong", bạn đang xếp tất trước giày. Cuối tuần, đếm số tối bạn đi ngủ muộn hơn giờ đã định. Nếu những tối đó trùng với những tối có khối học dài, thì thứ tự xếp đang sai, không phải ý chí của bạn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="day-templates"><span class="num">23</span>Bốn kiểu ngày</h2>

Có cần lên lịch riêng cho từng ngày không? Không cần: gần như mọi tuần đều ghép từ bốn kiểu ngày, giống như mấy món cơ bản trong bếp, thịt, trứng, rau, xoay vòng ra đủ bữa. Các mốc giờ dưới đây là **minh hoạ** cho một người làm việc khoảng 08:30–18:30 <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Điều quan trọng là *thứ tự* và *lý do* của các khối, không phải con số giờ.

<h3 id="day-evening"><span class="num">23.1</span>Ngày làm việc dài, học buổi tối</h3>

Làm tới tối mịt thì học vào lúc nào? Sau một khoảng đệm ngắn ở nhà, không phải ngay khi bước vào cửa. Và chỉ bắt buộc phần minimum dose, phần còn lại tuỳ sức.

```mermaid
gantt
  title Buổi tối của một ngày làm việc dài (giờ minh hoạ)
  dateFormat HH:mm
  axisFormat %H:%M
  todayMarker off
  section Công việc
  Làm việc và di chuyển về               :crit, 17:00, 18:30
  section Buổi tối
  Khoảng đệm + hồi sức + người thân      :18:30, 19:45
  Minimum dose của push goal              :19:45, 20:10
  Tuỳ năng lượng — học thêm hoặc nghỉ    :20:10, 21:45
  Đèn mờ và không feed                    :21:45, 23:00
  Điện thoại ra khỏi phòng ngủ            :23:00, 23:59
```

Kiểu ngày này dành cho những lúc giờ làm dài và không thể, hay không muốn, dậy sớm. Thử theo một buổi tối như vậy từ đầu tới cuối.

Lúc sắp tan làm, bạn ghi hai dòng "ready-to-resume" vào sổ tay: việc đang làm tới đâu, sáng mai bắt đầu từ bước nào. Có hai dòng đó, đầu óc mới gác được công việc lại, thay vì cứ lởn vởn nghĩ tiếp trên đường về. Trên đường về, bạn nghe một thứ đã chọn sẵn từ trước, chứ không mở app ra rồi lướt tìm.

Về tới cửa là một cue cố định: điện thoại cắm vào chỗ sạc ngay lối vào. Rồi tắm, ăn, nhắn tin hay gọi điện cho người yêu, cho gia đình. Nếu muốn xem gì đó để giải trí thì chọn trước và có giờ kết thúc: một tập phim, không phải "xem tới khi buồn ngủ".

Sau khoảng đệm ấy mới tới minimum dose của push goal, vào lúc đồng hồ sinh học đang ở vùng tỉnh táo buổi tối. Rồi tới một khoảng tuỳ năng lượng: còn sức thì làm thêm, hết sức thì nghỉ. Hãy ghi lại rằng nghỉ là một *quyết định*, không phải thất bại, để buổi tối không biến thành một bài kiểm tra ý chí. Từ khoảng ba tiếng trước giờ ngủ, đèn trong nhà dịu xuống và không mở feed. Nửa tiếng trước giờ ngủ, điện thoại ra khỏi phòng.

<h3 id="day-morning"><span class="num">23.2</span>Ngày làm việc dài, học buổi sáng</h3>

Có nên dậy sớm để học không? Nên, nếu bạn dời được *cả* giấc ngủ sớm lên. Đừng bao giờ cắt bớt giấc ngủ để lấy giờ học.

Kiểu ngày này đặt push goal vào lúc ít tốn sức nhất: trước khi ngày làm việc bắt đầu, khi chưa có việc vặt hay tin nhắn nào kịp lấy mất sức. Một buổi sáng minh hoạ trông như sau. Dậy lúc 06:00, nửa tiếng đầu làm việc nhẹ như ôn lại thẻ từ, xem kế hoạch trong ngày. Từ 06:30 tới 07:45 làm phần khó nhất của push goal. 07:45 chuẩn bị đi làm, 08:30 bắt đầu làm việc.

Dậy 6h thì phải ngủ sớm tương ứng. Ngay khi dậy, ra ánh sáng ngoài trời. Nửa tiếng đầu dành cho việc nhẹ vì sleep inertia, cơn lờ đờ ngay sau khi thức ([§10.3](#sleep-shift)). Phần còn lại dành cho việc khó nhất. Buổi tối thì nhẹ nhàng: hồi sức, người thân, ôn lại từ vựng, vì học từ vào buổi tối rồi đi ngủ là thứ tự tốt cho trí nhớ. Lỡ lên giường muộn thì cắt bớt buổi học sáng, chứ không cắt bớt giấc ngủ.

<h3 id="day-light"><span class="num">23.3</span>Ngày làm ít, không phải đi lại</h3>

Ngày làm ít giờ, không phải đi lại thì dùng thế nào? Đây là **cơ hội lớn nhất** trong tuần cho những việc cần ngồi lâu. Nhưng đừng nhồi quá hai buổi học.

Ngày như vậy giống buổi chiều hiếm hoi cả nhà đi vắng, khi cuối cùng cũng ngồi được vào việc cần tập trung lâu <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>. Giữ giờ thức như mọi ngày để không làm lệch đồng hồ sinh học. Làm việc trước, để xong việc là gác hẳn công việc sang một bên. Sau đó là một buổi học sâu khoảng 90 phút cho push goal, loại việc không làm được trong 25 phút: một đoạn input dài, một bài tập lớn, một phần khó. Thêm một buổi 60–90 phút cho mục tiêu thứ hai. Phần còn lại dành cho nghỉ ngơi thật, vận động, người thân.

Vì sao chỉ hai buổi? Với một số kỹ năng, buổi học quá dài kém hiệu quả nếu tính theo từng giờ bỏ ra <a class="ev ev-mid" href="#r-baddeley1978" title="Baddeley &amp; Longman 1978 · Bằng chứng vừa"></a>. Hai buổi 60–90 phút là điểm cân bằng mà cuốn sách đề xuất <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<details><summary>Đọc thêm: bằng chứng về độ dài buổi học chia hai phía</summary><div class="inner">

Nếu tính trình độ tổng thể sau cả một khoá học, dồn nhiều giờ có thể lại tốt hơn <a class="ev ev-low" href="#r-serrano2007" title="Serrano &amp; Muñoz 2007 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

</div></details>

<h3 id="day-off"><span class="num">23.4</span>Ngày nghỉ</h3>

Ngày nghỉ có được ngủ bù không? Giữ giờ thức như ngày thường, lệch tối đa khoảng nửa tiếng. Nếu thiếu ngủ, một giấc trưa 10–20 phút trước 16:00 tốt hơn ngủ nướng.

Ngủ nướng tới trưa Chủ nhật chẳng khác gì bay sang một múi giờ khác rồi sáng thứ Hai bay về. Cơ thể bị lệch giờ dù bạn không đi đâu cả, gọi là social jetlag.

Người thân yêu đi trước: một hoạt động mới cùng người yêu, gặp bạn bè, thăm gia đình, với khung cố định và nội dung thô. Vận động, nếu được thì cùng người khác. Một buổi học là tuỳ chọn, không bắt buộc.

Cuối ngày nghỉ cuối tuần là **buổi lập kế hoạch lúc tỉnh táo**, khoảng 20 phút. Đọc lại ghi chép của tuần, lập kế hoạch tuần sau theo số buổi thực sự đã làm được, đặt giới hạn ứng dụng cho cả tuần ngay lúc này. Chọn sẵn tài liệu cho từng buổi học, và ghi vài dự đoán cho tuần. Đây là lúc "người lập kế hoạch" làm việc. Nhờ vậy, vào những buổi tối mệt trong tuần, "người thực hiện" chỉ việc làm theo, không còn gì phải quyết.

<div class="callout data"><div class="ct">Tự kiểm tra: từ lúc về nhà tới lần mở điện thoại đầu tiên</div>

Trong một tuần, mỗi tối ngày làm ghi hai mốc giờ: lúc bước vào cửa, và lúc bạn mở feed lần đầu (Digital Wellbeing hoặc Screen Time cho biết giờ mở ứng dụng). Ba tối đầu cứ sống như bình thường. Hai tối sau thử cue cố định: điện thoại cắm sạc ở lối vào, tắm trước. Nếu ở những tối bình thường khoảng cách giữa hai mốc chỉ vài phút, còn ở những tối có cue thì kéo dài ra hoặc không có lần mở nào trước buổi học, thì khoảng đệm ở cửa chính là chỗ quyết định cả buổi tối <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="startup-template"><span class="num">24</span>Bắt đầu một thay đổi</h2>

Bắt đầu một thay đổi thế nào để biết cái gì thật sự có tác dụng? Tuần đầu chỉ đo, sau đó mỗi tuần thêm đúng một thay đổi. Tới tuần thứ tư thì dừng lại so sánh.

Lần đầu nấu một nồi canh, người có kinh nghiệm nêm từng thứ một. Cùng lúc thêm mắm, thêm đường, thêm muối mà canh ngon lên thì không biết nhờ cái nào. Canh dở đi thì cũng không biết tại cái nào. Thay đổi trong cuộc sống cũng vậy. Một habit mới, một mục tiêu mới, một lịch sống mới đều nên bắt đầu theo cùng một khuôn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>:

```mermaid
timeline
  title Năm tuần đầu của một thay đổi
  Tuần 0 : Chỉ đo, chưa đổi gì : Ghi lại mỗi ngày, lấy số liệu nền
  Tuần 1 : Bắt đầu ở một mốc thời gian : Đổi tình huống (cue, default) + minimum dose
  Tuần 2 : Thêm một thay đổi : vd hồi sức có chủ đích, giờ ngủ
  Tuần 3 : Thêm một thay đổi : vd buổi học sâu, chia sẻ tiến độ
  Tuần 4 : Không thêm gì : So với tuần 0 → giữ, sửa, bỏ
```

Mỗi bước có lý do của nó.

- **Tuần 0 chỉ đo**, giống như bước lên cân trước khi bắt đầu ăn kiêng. Không có số liệu nền thì không biết sau này mình đã tiến bộ hay chỉ tưởng vậy. Lập kế hoạch dựa trên những lần trước của chính mình cũng là cách sửa planning fallacy <a class="ev ev-high" href="#r-buehler1994" title="Buehler 1994 · Bằng chứng mạnh"></a>.
- **Tuần 1 bắt đầu ở một mốc thời gian** như thứ Hai hay đầu tháng. Mốc đó cho cảm giác được lật sang trang mới, gọi là fresh start effect <a class="ev ev-mid" href="#r-dai2014" title="Dai 2014 · Bằng chứng vừa"></a>.
- **Mỗi tuần sau thêm đúng một thay đổi**, để biết thay đổi nào có tác dụng, và tránh quá tải nhiều kế hoạch cùng lúc <a class="ev ev-mid" href="#r-dalton2012" title="Dalton &amp; Spiller 2012 · Bằng chứng vừa"></a>.
- **Tuần 4 không thêm gì**, chỉ so sánh với tuần 0, để quyết định giữ, sửa hay bỏ bằng dữ liệu thay vì cảm giác.

Có ba quy tắc giúp khuôn này trụ được qua những tuần tệ.

**Lỡ một ngày thì hôm sau quay lại minimum dose.** Lỡ một lần không ảnh hưởng đáng kể tới việc hình thành habit <a class="ev ev-mid" href="#r-lally2010" title="Lally 2010 · Bằng chứng vừa"></a>.

**Một tuần tệ thì đổi tình huống**, đừng cố gắng nhiều hơn ([chương 5](#self-control)).

**Mục tiêu nên có sẵn khoản dự phòng**, như "năm lần mỗi tuần, được phép trượt một". Đừng đặt một chuỗi kiểu được ăn cả ngã về không, chỉ một lần lỡ là cả chuỗi sụp <a class="ev ev-mid" href="#r-sharif2021" title="Sharif &amp; Shu 2021 · Bằng chứng vừa"></a>.

**Bốn tuần đầu của một thay đổi, đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** Thay đổi bạn muốn: bớt lướt điện thoại buổi tối để có chỗ cho buổi nghe tiếng Anh.

- *Tuần 0.* Không đổi gì, chỉ ghi. Giả sử bảng ghi chép cho thấy trung bình 95 phút điện thoại mỗi tối, và minimum dose làm được 1 trên 5 tối.
- *Tuần 1, bắt đầu từ thứ Hai.* Đổi tình huống: điện thoại cắm sạc ở cửa, đăng xuất TikTok, minimum dose 15 thẻ từ. Chỉ thế thôi.
- *Tuần 2.* Thêm đúng một thứ: điện thoại ra khỏi phòng ngủ.
- *Tuần 3.* Thêm đúng một thứ: gửi tóm tắt tuần cho người yêu.
- *Tuần 4.* Không thêm gì. So với tuần 0: nếu số phút điện thoại giảm rõ và minimum dose lên 4 trên 5 tối, giữ cả gói. Nếu số phút giảm mà minimum dose không tăng, thì chỗ tắc không nằm ở điện thoại. Xem cột ghi chú để tìm.

Vì mỗi tuần chỉ thêm một thứ, nếu tuần 2 bỗng tốt hẳn lên, bạn biết công lao thuộc về cái gì.

<details><summary>Đọc thêm: chương trình nào giúp người ta tập đều nhất</summary><div class="inner">

Trong một megastudy so sánh hàng chục chương trình khuyến khích đi tập, chương trình đứng đầu là chương trình thưởng cho việc *quay lại* sau khi lỡ <a class="ev ev-high" href="#r-milkman2021" title="Milkman 2021 · Bằng chứng mạnh"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: con số nào sẽ nói thay bạn ở tuần 4</div>

Trước khi bắt đầu bất kỳ thay đổi nào, viết ra đúng một con số bạn sẽ so giữa tuần 0 và tuần 4, như số phút điện thoại, số buổi minimum dose, giờ lên giường trung bình. Viết luôn ngưỡng nào thì giữ, ngưỡng nào thì sửa. Viết trước, khi chưa có kết quả. Nếu tới tuần 4 bạn thấy mình muốn đổi con số hay đổi ngưỡng cho "đẹp" hơn, đó là dấu hiệu đang quyết định bằng cảm giác chứ không bằng dữ liệu <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<h2 id="when-life-changes"><span class="num">25</span>Khi cuộc sống thay đổi</h2>

Lịch sống vừa đảo lộn, nên cố giữ kế hoạch cũ hay làm lại? Làm lại tám bước ở [chương 22](#week-method). Mỗi lần như vậy, hỏi ba câu: giữ gì, thu nhỏ gì, và cơ hội nằm ở đâu.

Một kế hoạch tuần giống con đường quen đi làm: rất ổn, cho tới hôm khu đó rào đường làm metro. Kế hoạch nào rồi cũng cũ. Thứ phải giữ nguyên thường là giấc ngủ, khung người thân và minimum dose của mỗi lĩnh vực. Thứ nên thu nhỏ thường là push goal, đưa về minimum dose trong vài tuần đầu. Và thay đổi lớn thường kèm theo một cơ hội.

Cơ hội rõ nhất đến khi đổi việc hoặc đổi chỗ ở. Khi bối cảnh sống vừa đổi, các habit cũ mất đi những cue quen thuộc. Trong khoảng ba tháng sau đó, can thiệp để tạo habit mới hiệu quả hơn <a class="ev ev-mid" href="#r-verplanken2016" title="Verplanken &amp; Roy 2016 · Bằng chứng vừa"></a>. Giai đoạn này gọi là habit discontinuity, tức các habit cũ đứt mạch. Căn nhà mới chưa có cái sofa quen để "ăn tối xong là nằm lướt điện thoại", nên bạn được viết habit lên một trang giấy trắng <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

Cách xử lý từng loại thay đổi <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>:

- **Đổi việc hoặc đổi giờ làm.** Giữ giấc ngủ và khung người thân, đưa push goal về minimum dose trong hai tuần đầu, và dùng ba tháng đầu để tạo habit mới.
- **Mùa cao điểm công việc.** Giữ giấc ngủ, một minimum dose cho mỗi lĩnh vực và một khung cho người thân. Tạm dừng các buổi học dài, và viết ghi chú "ready-to-resume" cho từng mục tiêu tạm dừng <a class="ev ev-mid" href="#r-leroy2018" title="Leroy &amp; Glomb 2018 · Bằng chứng vừa"></a>, như kẹp tờ giấy đánh dấu vào trang sách đang đọc dở.
- **Ốm hay kiệt sức.** Mọi mục tiêu về không hoặc về minimum dose, và điều đó không tính là đứt chuỗi.
- **Du lịch hay nghỉ lễ.** Giữ giờ thức gần như cũ nếu được, học ở mức minimum dose hoặc nghỉ có chủ đích, và coi ngày trở về là một fresh start.
- **Chuyển nhà hay bắt đầu sống chung.** Đây cũng là giai đoạn habit discontinuity. Hãy thiết kế môi trường mới từ đầu, như chỗ để điện thoại, góc học, trước khi thói quen cũ kịp dọn vào theo.
- **Người thân đổi lịch.** Làm lại bước ③ trước, rồi mới tới bước ⑥. Giữ *số* khung, đổi *vị trí* khung.
- **Tâm trạng xấu kéo dài.** Giữ giấc ngủ, vận động nhẹ và người thân. Thu nhỏ mục tiêu thay vì bỏ hàng loạt, vì ở người có nguy cơ trầm cảm, buông nhiều lại đi kèm nhiều triệu chứng hơn <a class="ev ev-mid" href="#r-barlow2020" title="Barlow 2020 · Bằng chứng vừa"></a>. Nếu kéo dài, hãy tìm hỗ trợ chuyên môn.
- **Một mục tiêu đã đạt hoặc không còn ý nghĩa.** Buông theo tiêu chí đã viết từ trước, rồi đặt ngay một mục tiêu thay thế.

**Một mùa cao điểm, đi từng bước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.** Tháng Chạp, việc cuối năm dồn dập, ba tuần liền về nhà sau 8 giờ tối.

1. *Giữ nguyên.* Giờ thức như cũ, buổi tối hẹn với người yêu (có thể ngắn hơn), một cuộc gọi về nhà mỗi tuần.
2. *Thu nhỏ.* Push goal về 15 thẻ từ mỗi tối. Buổi tập đàn sáng thứ Bảy tạm dừng, kèm một ghi chú "ready-to-resume": đang tập tới bài nào, bước tiếp theo là gì.
3. *Không tính là thất bại.* Ba tuần này vẫn ghi chép đều, nhưng mục tiêu tuần đặt lại theo mức đã thu nhỏ.
4. *Khi mùa cao điểm qua.* Thứ Hai đầu tiên sau đó là một fresh start: mở ghi chú ready-to-resume, đưa push goal về bốn buổi.

<div class="callout data"><div class="ct">Tự kiểm tra: những thay đổi đã thấy trước</div>

Mở lịch ba tháng tới và đánh dấu những thay đổi đã biết trước: mùa cao điểm ở chỗ làm, Tết, một chuyến đi, một lần đổi lịch của người yêu. Cạnh mỗi cái, viết sẵn ba dòng: giữ gì, thu nhỏ gì, và cơ hội là gì. Khi thay đổi tới, so cách bạn thật sự xử lý với ba dòng đã viết. Nếu lần nào bạn cũng bỏ hết rồi bắt đầu lại từ đầu, phần "thu nhỏ" chưa đủ nhỏ để trụ được qua tuần bận <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

</div>

<div class="recall">

**Câu hỏi nhớ lại — Phần IV (chương 22–25).**

<details><summary>Trong tám bước xây một tuần, vì sao giấc ngủ và người thân yêu đứng trước push goal?</summary><div class="inner">

Như xếp vali: đồ to vào trước. Đặt mục tiêu tham vọng vào trước thì mục tiêu sẽ lấn hết chỗ của nền móng; thiếu ngủ thì mọi thứ hỏng theo mà mình không tự nhận ra, và quan hệ không có khung cố định sẽ bị công việc lấn mất thời gian.

</div></details>

<details><summary>Vì sao tuần đầu tiên của một thay đổi chỉ đo mà không đổi gì?</summary><div class="inner">

Để có dữ liệu nền, như bước lên cân trước khi bắt đầu ăn kiêng: lập kế hoạch dựa trên những lần trước của chính mình xoá được sai lệch của planning fallacy (Buehler 1994), và có số liệu để so sánh ở tuần 4.

</div></details>

<details><summary>Khi đổi việc, đâu là cơ hội?</summary><div class="inner">

Khoảng ba tháng đầu sau khi bối cảnh sống thay đổi là giai đoạn habit discontinuity — lúc can thiệp để tạo habit mới hiệu quả hơn (Verplanken & Roy 2016).

</div></details>

</div>


<h2 id="part-5" class="part">Phần V — Một ví dụ: cuộc sống hiện tại</h2>

<h2 id="example"><span class="num">26</span>Áp dụng phương pháp vào lịch hiện tại</h2>

Áp phương pháp vào lịch thật của bạn thì một tuần trông thế nào? Chương này trả lời bằng chính lịch sống tại thời điểm viết, ngày 22/10/2026. Đọc công thức nấu ăn khác với đứng bếp nấu thật một lần, và đây là lần đứng bếp đó: **một lần áp dụng** phương pháp ở [chương 22](#week-method).

Khi lịch thay đổi, như công việc, lịch của người yêu, nơi ở, đừng sửa từng ô ở đây. Hãy làm lại tám bước. Các mốc giờ chỉ là đề xuất để bắt đầu, và ghi chép thật sẽ cho biết cần chỉnh chỗ nào.

<h3 id="example-facts"><span class="num">26.1</span>Dữ kiện và kết quả tám bước</h3>

Tám bước cho ra kết quả gì với lịch hiện tại? Một push goal là nghe tiếng Anh, giấc ngủ có hai phương án để chọn, và người yêu giữ nguyên ba buổi mỗi tuần. Bắt đầu bằng sự thật, không bằng mong muốn.

**Lịch hiện tại.** Thứ Hai đến thứ Sáu ở ngoài nhà từ 08:00 đến 19:15, đã gồm thời gian dậy, ăn sáng và đi bộ khoảng 10 phút mỗi chiều. Ngủ khoảng 00:00–08:00. Thứ Bảy xen kẽ: một tuần làm từ xa 3–4 tiếng việc nhẹ (các ngày 31/10, 14/11, 28/11, 12/12, 26/12…), tuần sau nghỉ (7/11, 21/11, 5/12, 19/12…). Chủ nhật luôn nghỉ. Thời gian với người yêu hiện thường vào tối thứ Tư, thứ Bảy và Chủ nhật.

**Các mục tiêu.** Tiếng Anh (IELTS), một kỹ năng kỹ thuật, vận động và sức khoẻ, đọc và tư duy, tiền và sự nghiệp. Tiếng Anh tự đánh giá ở mức B1: đọc khá, nghe yếu, nói và viết yếu.

Cho các dữ kiện đó đi qua tám bước, ta được kết quả sau.

- **① Các khung cố định:** năm ngày làm, và 3–4 tiếng của thứ Bảy làm từ xa.
- **② Giấc ngủ:** có hai phương án. **Phương án tối** giữ nguyên 00:00–08:00, tức tám tiếng trên giường. **Phương án sáng** dời sang 22:30–06:00, tức bảy tiếng rưỡi trên giường, và phải dời dần ([§26.3](#example-sleep-shift)).
- **③ Người thân:** tối thứ Tư, thứ Bảy và Chủ nhật với người yêu, cộng một lần gọi hoặc thăm gia đình mỗi tuần.
- **④ Hồi sức:** khoảng 19:15–20:30 mỗi ngày làm, cộng một buổi chiều cuối tuần không mục đích.
- **⑤ Vận động:** đi bộ 20 phút mỗi ngày làm (đi nhanh thì được tính là cường độ vừa), leo cầu thang ở công ty vài lần mỗi ngày, và hai buổi tập sức mạnh ngắn vào thứ Bảy và Chủ nhật. Nếu được thì tập cùng người yêu.
- **⑥ Push goal của quý này:** **tiếng Anh, ưu tiên kỹ năng nghe**, với minimum dose là buổi 25 phút ở [§13.3](#learning-worked-example).
- **⑦ Maintenance dose:** một buổi kỹ thuật 60–90 phút vào thứ Bảy làm từ xa, một lệnh chuyển tiền tự động ngày nhận lương sang một tài khoản riêng, và hai thói quen tư duy nhỏ: ghi dự đoán đầu tuần, viết một dòng "vì sao" ở công ty.
- **⑧ Đệm và review:** 20–30 phút tối Chủ nhật, kèm một bản tóm tắt kể cho người yêu hoặc một người bạn.

Để thấy những con số này đổi được gì, hãy hình dung một tối thứ Hai bình thường lúc này. 19:15 về tới nhà, ngồi xuống sofa, 19:20 TikTok đã mở, giống dòng ghi chép mẫu ở [§27.1](#the-log). Với lịch mới, 19:15 vẫn là 19:15. Chỉ khác ở chỗ vừa bước vào cửa, điện thoại đã nằm trên kệ chứ không còn nằm trong tay <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.

<h3 id="example-weeks"><span class="num">26.2</span>Hai kiểu tuần</h3>

Nên chọn học buổi tối hay buổi sáng? Bắt đầu bằng phương án tối vì phải thay đổi ít hơn, đo bốn tuần, rồi mới tính chuyện thử phương án sáng.

Vì thứ Bảy xen kẽ, có hai kiểu tuần. Trong bảng, những ô ghi *(sáng)* chỉ áp dụng nếu chọn phương án sáng, những ô ghi *(tối)* chỉ áp dụng nếu chọn phương án tối.

| Ngày | Sáng | Ban ngày | Tối | Người thân |
|---|---|---|---|---|
| Thứ Hai | *(sáng)* 06:00–08:00 tiếng Anh | Làm việc; đi bộ nghe tiếng Anh; ghi dự đoán tuần | Hồi sức → *(tối)* 25 phút tiếng Anh → rảnh | Gọi gia đình |
| Thứ Ba | *(sáng)* tiếng Anh | Làm việc; đi bộ nghe | Hồi sức → *(tối)* 25 phút → rảnh | — |
| Thứ Tư | *(sáng)* tiếng Anh | Làm việc; đi bộ nghe | **Tối với người yêu**, điện thoại cất đi | Người yêu |
| Thứ Năm | *(sáng)* tiếng Anh | Làm việc; đi bộ nghe | Hồi sức → *(tối)* 25 phút → rảnh | — |
| Thứ Sáu | *(sáng)* tiếng Anh | Làm việc; chấm điểm dự đoán | Hồi sức → *(tối)* 25 phút → rảnh | Bạn bè (tuỳ tuần) |
| Thứ Bảy làm từ xa | Giữ giờ thức → 3–4 tiếng việc | Học sâu tiếng Anh 90 phút · kỹ thuật 60–90 phút · tập sức mạnh | Rảnh | Người yêu |
| Thứ Bảy nghỉ | Giữ giờ thức | Ngày của người thân: người yêu, bạn bè, một hoạt động mới · tập sức mạnh | Rảnh | Người yêu, bạn bè |
| Chủ nhật | Giữ giờ thức | Gia đình · rảnh không mục đích · tập nếu thứ Bảy chưa tập | Review 20–30 phút + kế hoạch tuần | Người yêu, gia đình |

Hai phương án khác nhau ở những điểm sau:

| | Phương án tối | Phương án sáng |
|---|---|---|
| Ngủ | 00:00–08:00 (như hiện tại) | 22:30–06:00 |
| Học ngày làm | 25 phút, khoảng 20:30 | Gần 2 tiếng, 06:00–08:00 (nửa tiếng đầu việc nhẹ) |
| Độ tốn sức lúc học | Nhiều, sau hơn 11 tiếng ngoài nhà | Ít, vì chưa làm gì |
| Rủi ro chính | Feed lúc mệt; giờ ngủ lùi dần | Giờ ngủ lùi dần thành ra cắt bớt giấc ngủ; dời đồng hồ sinh học không thành |
| Buổi tối | 19:15–00:00 | 19:15–22:30 — tối thứ Tư với người yêu kết thúc sớm hơn |

Có thể hình dung hai phương án như hai đường đi làm. Phương án tối là đường quen, không phải nghĩ, nhưng phải đi lúc người đã mỏi sau hơn 11 tiếng ngoài nhà. Phương án sáng là một đường mới thoáng hơn, đi lúc người còn khoẻ, nhưng phải mất vài tuần mới quen, tức là dời cả giấc ngủ. Nếu tập đi đường mới không thành thì người chịu thiệt là giấc ngủ.

Số giờ tiếng Anh mỗi tuần, tính trên đề xuất chứ chưa phải số thật:

- **Phương án tối:** 100 phút đi bộ (20 × 5), cộng 100 phút học tối (25 × 4, trừ tối thứ Tư), cộng trung bình 45 phút từ thứ Bảy làm từ xa (90 × ½, vì cách tuần). Tổng 245 phút, khoảng 4,1 giờ mỗi tuần.
- **Phương án sáng:** 100 phút đi bộ, cộng 600 phút buổi sáng (120 × 5), cộng 45 phút. Tổng 745 phút, khoảng 12,4 giờ mỗi tuần, dù thực tế sẽ ít hơn vì sleep inertia và ăn sáng.

Gợi ý <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>: bắt đầu bằng phương án tối vì phải thay đổi ít hơn, và đo bốn tuần. Nếu buổi 25 phút đã thành nếp mà muốn nhiều giờ hơn, thử phương án sáng như một thí nghiệm riêng. Đổi một thứ mỗi lần, như nêm từng thứ một vào nồi canh ở [chương 24](#startup-template).

<h3 id="example-sleep-shift"><span class="num">26.3</span>Thí nghiệm dời giấc ngủ</h3>

Nếu chọn phương án sáng, dời giấc ngủ thế nào cho thành? Dời từng bước trong ba tuần, giữ giờ thức cố định cả cuối tuần, và đánh giá bằng nhật ký ngủ chứ không bằng cảm giác.

Dời đồng hồ sinh học giống tập cho một đứa trẻ đi ngủ sớm hơn. Mỗi tối lùi sớm một chút thì được, còn bắt lên giường sớm hẳn hai tiếng thì chỉ nằm trằn trọc.

Đích là 22:30–06:00 chứ không phải 23:00–06:00. Lý do: bảy tiếng nằm trên giường cho ít hơn bảy tiếng ngủ, vì còn phải trừ lúc trằn trọc chờ giấc. Lộ trình gồm ba chặng:

- **Tuần đầu:** giữ lịch cũ và chỉ ghi nhật ký ngủ: giờ lên giường, giờ ngủ được ước chừng, giờ dậy, mức tỉnh táo.
- **Tuần thứ hai:** dậy 07:00 và tắt đèn 23:30. Đây là một bước trung gian, chậm hơn tốc độ dời một tiếng mỗi ngày trong phòng thí nghiệm, vì ở nhà không có đèn chiếu sáng mạnh như ở đó <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>.
- **Từ tuần thứ ba:** dậy 06:00 và tắt đèn 22:30.

Mỗi ngày, kể cả cuối tuần, giữ một bộ quy tắc <a class="ev ev-mid" href="#r-facerchilds2019" title="Facer-Childs 2019 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-burgess2003" title="Burgess 2003 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-gardiner2023" title="Gardiner 2023 · Bằng chứng vừa"></a>:

- Giữ giờ thức cố định, lệch tối đa 15–30 phút. Buổi sáng cuối tuần có thể dùng để đọc sách hay đi bộ.
- Ra ánh sáng ngoài trời ngay sau khi dậy. Không cần đứng cả buổi: khoảng 30 phút đã cho phần lớn tác dụng <a class="ev ev-mid" href="#r-crowley2015" title="Crowley 2015 · Bằng chứng vừa"></a>.
- Uống cà phê trước 13:42, tức 22:30 trừ đi 8,8 tiếng, khoảng cách tối thiểu giữa ly cà phê và giờ ngủ.
- Không uống rượu buổi tối.
- Đèn mờ từ 19:30, tức ba tiếng trước giờ ngủ.
- Nếu thiếu ngủ, ngủ trưa 10–20 phút trước 16:00 thay vì ngủ nướng.

Cũng cần biết khi nào nên dừng lại <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế"></span>:

- Nếu phần lớn các đêm trong tuần mất lâu hơn hẳn mới ngủ được, nghĩa là đang dời quá nhanh. Giữ bước hiện tại thêm một tuần.
- Nếu nhật ký cho thấy ngủ dưới bảy tiếng ở phần lớn các đêm trong hai tuần, tắt đèn sớm hơn. Nếu không ngủ được sớm hơn, lùi giờ thức 30 phút.
- Nếu sau ba tuần ở đích mà giờ ngủ được vẫn không sớm lên, kiểm tra lại ánh sáng buổi sáng và màn hình buổi tối. Vẫn không được thì chấp nhận 23:00–06:30.

Và luôn đánh giá bằng nhật ký, không bằng cảm giác "vẫn ổn". Người thiếu ngủ không tự nhận ra mình đang thiếu ngủ, giống người say tự thấy mình vẫn lái xe được <a class="ev ev-mid" href="#r-vandongen2003" title="Van Dongen 2003 · Bằng chứng vừa"></a>.

<details><summary>Đọc thêm: nhảy thẳng tới đích, và bao nhiêu ánh sáng là đủ</summary><div class="inner">

Thử nghiệm của Facer-Childs nhảy thẳng tới đích và vẫn dời được khoảng hai tiếng trong ba tuần, nên cả hai cách đều có dữ liệu <a class="ev ev-mid" href="#r-facerchilds2019" title="Facer-Childs 2019 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-burgess2003" title="Burgess 2003 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-gardiner2023" title="Gardiner 2023 · Bằng chứng vừa"></a>.
