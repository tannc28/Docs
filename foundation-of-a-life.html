<details><summary>Đọc thêm: quỹ chủ động, chi phí săn lợi nhuận</summary><div class="inner">

Cộng tất cả các quỹ cổ phiếu quản lý chủ động ở Mỹ lại thì gần như chính là cả thị trường. Nghĩa là trước phí, tính trung bình, họ chỉ đạt đúng mức thị trường. Sau khi trừ chi phí quản lý cao, nhà đầu tư nhận được ít hơn đúng bằng phần chi phí ấy, và rất ít quỹ kiếm đủ để bù chi phí <a class="ev ev-high" href="#r-fama2010" title="Fama &amp; French 2010 · Bằng chứng mạnh"></a>.

Giai đoạn 1980–2006, nhà đầu tư Mỹ mỗi năm tốn 0,67% giá trị thị trường cho việc săn lợi nhuận vượt trội. Một nhà đầu tư điển hình sẽ được thêm 0,67 điểm phần trăm mỗi năm nếu chuyển sang danh mục thụ động bám theo thị trường <a class="ev ev-high" href="#r-french2008" title="French 2008 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="money-learning"><span class="num">10.5</span>Học về tiền có ích</h3>

Học về tài chính có đáng thời gian không? Có. Một tổng hợp lớn các thí nghiệm ngẫu nhiên cho thấy giáo dục tài chính cải thiện thật cả hiểu biết lẫn hành vi về tiền. Mức cải thiện ngang với giáo dục ở các lĩnh vực khác <a class="ev ev-high" href="#r-kaiser2022" title="Kaiser 2022 · Bằng chứng mạnh"></a>. Đọc chương này cũng là một phần nhỏ của việc học ấy.

<details><summary>Đọc thêm: từ kết luận bi quan tới kết luận mới</summary><div class="inner">

Một thời gian dài, người ta tin giáo dục tài chính gần như vô dụng, dựa trên một meta-analysis có kết luận bi quan <a class="ev ev-mid" href="#r-fernandes2014" title="Fernandes, Lynch &amp; Netemeyer 2014 · Bằng chứng vừa"></a>. Tổng hợp mới hơn của Kaiser gồm 76 thí nghiệm ngẫu nhiên với hơn 160.000 người. Các tác giả gọi mức cải thiện là "có ý nghĩa kinh tế", và kết quả vẫn còn đúng sau khi hiệu chỉnh publication bias <a class="ev ev-high" href="#r-kaiser2022" title="Kaiser 2022 · Bằng chứng mạnh"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: bức ảnh tài chính của bạn</div>

Dành ba mươi phút vào một tối thứ Bảy để ghi ra ba con số. Một: bạn đang có bao nhiêu *khoản* nợ không có tài sản bảo đảm — đếm số khoản, không chỉ tổng tiền. Hai: số tiền sẵn có chia cho chi tiêu một tháng, tức quỹ dự phòng đủ dùng bao nhiêu tháng. Ba: nếu đang có quỹ đầu tư, phí quản lý mỗi năm là bao nhiêu phần trăm (thường ghi trong bản cáo bạch hoặc trên app). Cách đọc <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: có từ hai khoản nợ trở lên thì việc đầu tiên là đóng hẳn một khoản; quỹ dự phòng chưa đủ ba tháng thì cài lệnh chuyển tự động trước khi nghĩ tới đầu tư; phí trên 1% mỗi năm thì đặt nó cạnh bảng ở trên và tự hỏi ba mươi năm nữa khoản phí ấy lấy đi bao nhiêu.

</div>

<div class="recall">

**Câu hỏi nhớ lại — Phần III.**

<details><summary>Hai loại well-being là gì, và mỗi loại gắn với những gì?</summary><div class="inner">

Emotional well-being là "chuyện từng ngày": chất lượng cảm xúc từng giờ, gắn mạnh với sức khoẻ, sự cô đơn, việc chăm sóc người khác. Life evaluation là "bản tổng kết cuối năm": đánh giá cuộc sống khi nhìn lại, gắn chặt với thu nhập và học vấn (Kahneman & Deaton 2010).

</div></details>

<details><summary>"Tiền không mua được hạnh phúc quá một mức" — đúng không?</summary><div class="inner">

Với phần lớn mọi người là không: mỗi lần thu nhập gấp đôi thì hạnh phúc thêm một nấc; hiện tượng chững lại chỉ thấy ở nhóm kém hạnh phúc nhất (Killingsworth, Kahneman & Mellers 2023). Nhưng mất một khoản thu nhập đau hơn được thêm đúng khoản đó (Boyce 2013).

</div></details>

<details><summary>Ba nhu cầu nền theo self-determination theory?</summary><div class="inner">

Tự chủ, năng lực, gắn kết — ba chân của một cái kiềng (Ryan & Deci 2000).

</div></details>

<details><summary>Vì sao người ta chọn lặp lại lần nhúng tay vào nước lạnh dài hơn?</summary><div class="inner">

Vì lần đó kết thúc nhẹ hơn. Ký ức chấm điểm theo khoảnh khắc tệ nhất và khoảnh khắc cuối, gần như bỏ qua độ dài (peak–end rule, Kahneman 1993).

</div></details>

<details><summary>Năm tác động chi phối và lá chắn tương ứng?</summary><div class="inner">

Mục tiêu ngoại tại → mục tiêu nội tại; so sánh lên → thước đo của chính mình; đám đông và quyền uy → tách "đúng hay sai" khỏi "ai nói", có người phản biện; kỹ thuật thao túng → nhận ra kiểu thao túng (inoculation); thiết kế giành chú ý → friction và default.

</div></details>

<details><summary>Uống ít rượu có tốt cho sức khoẻ không?</summary><div class="inner">

Không có bằng chứng: niềm tin cũ đến từ việc so với một nhóm "không uống" có lẫn người bỏ rượu vì bệnh. Sau khi hiệu chỉnh, uống ít không giảm nguy cơ tử vong so với người chưa từng uống, và uống nhiều làm tăng (Zhao 2023).

</div></details>

<details><summary>Vì sao một khác biệt phí khoảng 1–1,5 điểm phần trăm mỗi năm lại lớn?</summary><div class="inner">

Vì lãi kép, mà trực giác của ta lại ước lượng tăng trưởng kép như tăng đều (exponential growth bias, Stango & Zinman 2009). Phí ăn mất cả phần lãi mà số tiền ấy lẽ ra sinh ra về sau; qua vài chục năm, phí nhỏ ăn mất một phần lớn kết quả — trong ví dụ của chương là khoảng một phần tư.

</div></details>

</div>


<h2 id="part-4" class="part">Phần IV — Hướng đi</h2>

<h2 id="goals"><span class="num">11</span>Mục tiêu</h2>

Ngày 1 tháng 1, rất nhiều người viết ra "năm nay học IELTS 7.0", "năm nay giảm 5 kg". Đến giữa tháng 2, phần lớn những dòng ấy đã nằm im trong một cuốn sổ không ai mở lại. Họ không thiếu mong muốn. Họ có điểm đến, nhưng không có đường đi.

Một mục tiêu giống câu "Tết này về quê": cần thiết, nhưng nói xong thì vé xe vẫn chưa mua, đồ đạc vẫn chưa xếp <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Cách làm dưới đây ghép từ những phát hiện vững nhất về việc đặt, giữ và buông mục tiêu. Từng bước có bằng chứng riêng; còn việc ghép chúng thành một vòng là lựa chọn của cuốn sách <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

```mermaid
flowchart LR
  A["① Chọn: vì sao<br/>mình muốn điều này?"] --> B["② Ít mục tiêu cùng lúc,<br/>một mục tiêu trọng tâm"]
  B --> C["③ Đặt ở tầng quy trình:<br/>hành vi mình kiểm soát"]
  C --> D["④ Gắn vào tình huống:<br/>if-then, chuẩn bị sẵn"]
  D --> E["⑤ Ghi lại và<br/>chia sẻ tiến độ"]
  E --> F["⑥ Review đều đặn:<br/>cả thành công lẫn thất bại"]
  F -->|"còn hợp"| C
  F -->|"không còn khả thi"| G["⑦ Buông, và<br/>gắn với mục tiêu thay thế"]
  G --> A
```

<h3 id="choose-goals"><span class="num">11.1</span>Chọn mục tiêu nào, và bao nhiêu</h3>

Nên chọn mục tiêu nào, và ôm bao nhiêu cái cùng lúc? Chọn mục tiêu mình thật sự muốn, không phải mục tiêu mình bị ép. Và mỗi giai đoạn chỉ dồn sức cho một mục tiêu trọng tâm.

**Câu hỏi đầu tiên là "vì sao".** Hai người cùng học tiếng Anh. Người thứ nhất học vì mê xem phim không phụ đề. Người thứ hai học vì công ty bắt phải có chứng chỉ trước cuối năm. Cùng giáo trình, cùng một giờ mỗi tối, nhưng sang tháng thứ ba, người thứ nhất thường vẫn ngồi vào bàn, còn người thứ hai đã có cả chục lý do để nghỉ. Những mục tiêu xuất phát từ giá trị và mối quan tâm thật của mình, gọi là **self-concordant goals**, được theo đuổi bền bỉ hơn và đạt được nhiều hơn <a class="ev ev-mid" href="#r-sheldon1999" title="Sheldon &amp; Elliot 1999 · Bằng chứng vừa"></a>.

**Mấu chốt nằm ở cám dỗ.** Với mục tiêu kiểu "muốn làm", người ta ít thấy bị cám dỗ hơn; với mục tiêu kiểu "phải làm", cám dỗ và trở ngại hiện ra nhiều hơn <a class="ev ev-mid" href="#r-milyavskaya2015" title="Milyavskaya 2015 · Bằng chứng vừa"></a>. Người học vì thích không phải vật lộn với Netflix mỗi tối nhiều như người học vì bị ép. Đây chính là chân tự chủ trong ba nhu cầu nền ở [chương 7](#needs).

**Câu hỏi thứ hai là "bao nhiêu".** Đứng bếp một mình mà bắc cùng lúc năm nồi thì cứ chạy qua chạy lại suốt, nồi nào cũng dễ cháy <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Con người cũng vậy: đổi một số **vừa phải** hành vi cùng lúc thì thay đổi được nhiều nhất, còn khi động lực thấp, ôm nhiều càng hại <a class="ev ev-high" href="#r-wilson2015" title="Wilson 2015 · Bằng chứng mạnh"></a>. Một quy tắc dễ áp dụng <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: mỗi giai đoạn vài tháng, chọn **một mục tiêu trọng tâm** để dồn phần lớn sức lực. Các mục tiêu còn lại giữ ở "mức duy trì", tức mức tối thiểu để không thụt lùi.

Áp vào kế hoạch vài tháng tới <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Hỏi "vì sao" muốn nghe tiếng Anh giỏi. Nếu câu trả lời là "vì ai cũng bảo thời nay phải giỏi tiếng Anh", đó là mục tiêu "phải làm", và vào những tối mệt, cám dỗ sẽ thắng. Nếu câu trả lời là "vì mình muốn tự đi du lịch nước ngoài, hỏi đường, gọi món mà không phải đoán ý", đó là thứ bạn thật sự quan tâm. Viết câu ấy lên đầu trang ghi chú học tiếng Anh. Rồi hỏi "bao nhiêu": nghe tiếng Anh là trọng tâm; tập thể dục giữ ở hai buổi cuối tuần; chuyện tiền giữ ở lệnh chuyển tiết kiệm tự động đã cài sẵn. Vào một buổi tối mệt mỏi, bạn chỉ phải giữ một lời hứa, chứ không phải ba.

<details><summary>Đọc thêm: vòng xoáy đi lên và những mục tiêu giẫm chân nhau</summary><div class="inner">

Mục tiêu self-concordant còn giúp well-being tăng nhiều hơn khi đạt được <a class="ev ev-mid" href="#r-sheldon1999" title="Sheldon &amp; Elliot 1999 · Bằng chứng vừa"></a>. Qua các học kỳ, chúng tạo thành một vòng xoáy đi lên: đạt được thì vui hơn, vui hơn thì chọn được những mục tiêu hợp mình hơn <a class="ev ev-mid" href="#r-sheldon2001" title="Sheldon &amp; Houser-Marko 2001 · Bằng chứng vừa"></a>.

Động lực tự thân đi kèm tiến bộ thật, còn động lực đến từ áp lực thì không <a class="ev ev-mid" href="#r-koestner2008" title="Koestner 2008 · Bằng chứng vừa"></a>.

Những mục tiêu giẫm chân nhau, như muốn tập buổi tối mà cũng muốn học thêm buổi tối, đi kèm well-being thấp hơn. Những mục tiêu đỡ cho nhau thì đi kèm sự dấn thân nhiều hơn <a class="ev ev-mid" href="#r-riediger2004" title="Riediger &amp; Freund 2004 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="process-goals"><span class="num">11.2</span>Đặt mục tiêu ở tầng quy trình</h3>

Đặt mục tiêu "IELTS 7.0" có sai không? Không sai, nhưng mục tiêu ấy chỉ cho biết hướng đi. Thứ giúp bạn tiến lên mỗi tối là mục tiêu ở tầng quy trình: việc cụ thể bạn làm được ngay hôm nay.

Một cầu thủ đặt bóng lên chấm phạt đền. Anh có thể nghĩ "phải thắng trận này", "mùa này phải ghi thật nhiều bàn", hoặc "đặt chân trụ sát bóng, mắt nhìn bóng lúc sút". Chỉ ý nghĩ cuối cùng là thứ anh làm được ngay trong vài giây tới. Một meta-analysis trong thể thao so ba tầng mục tiêu như thế:

```chart bar
loại mục tiêu,độ lớn hiệu ứng (càng cao càng mạnh)
Kết quả cuối cùng (thắng giải),0.09
Mốc thành tích (đạt thời gian X),0.44
Quy trình (điều tập trung khi đang thực hiện),1.36
```

<p class="src">Nguồn: Williamson et al. 2022. Meta-analysis gồm 27 nghiên cứu, toàn bộ trong thể thao, phần lớn trong phòng thí nghiệm; mục tiêu kết quả chỉ có 2 nghiên cứu và không phân biệt được với con số không.</p>

Mục tiêu kết quả gần như không giúp gì. Mục tiêu mốc thành tích giúp ở mức vừa. Còn **mục tiêu quy trình**, tức điều mình tập trung làm ngay khi đang thực hiện kỹ năng, mạnh hơn hẳn cả hai <a class="ev ev-mid" href="#r-williamson2022" title="Williamson 2022 · Bằng chứng vừa"></a>. Đem ý đó sang đời thường là suy luận của cuốn sách <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: kết quả phụ thuộc nhiều thứ ngoài tầm tay, còn quy trình là thứ mình làm được hôm nay. Chuyện giảm cân cũng thế: "giảm 5 kg" là kết quả, "bữa tối ăn một bát cơm thay vì hai" là quy trình.

Biến mục tiêu nghe thành quy trình <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Kết quả: "xem hiểu gần hết một bộ phim không phụ đề". Đúng hướng, nhưng tối nay bạn chưa thể *làm* điều đó. Mốc: "ba tháng nữa nghe một tập podcast quen mà chép đúng phần lớn các câu". Rõ hơn, nhưng vẫn xa. Quy trình: "bốn tối mỗi tuần, ba mươi phút sau bữa cơm: nghe một đoạn năm phút, chép lại, so với transcript, gạch dưới chỗ nghe sai". Cái cuối cùng làm được ngay tối nay, và kiểm được bằng một dấu tích. Mỗi tối chỉ còn một câu hỏi, đã làm đủ ba mươi phút chưa, thay vì câu hỏi mù mờ "mình đã giỏi chưa".

<details><summary>Đọc thêm: mục tiêu cụ thể và mục tiêu học</summary><div class="inner">

Một mục tiêu cụ thể và đủ khó mang lại kết quả tốt hơn lời dặn chung chung "cố gắng hết sức". Riêng với những việc phức tạp, mới mẻ, mục tiêu **học**, tức tìm ra cách làm, tốt hơn mục tiêu thành tích <a class="ev ev-high" href="#r-locke2002" title="Locke &amp; Latham 2002 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="monitoring"><span class="num">11.3</span>Ghi lại và chia sẻ</h3>

Ghi lại tiến độ có thật sự giúp không? Có, nhất là khi viết ra giấy và kể cho người khác nghe. Kể cho người khác có tác dụng mạnh hơn gấp đôi so với giữ riêng cho mình.

Hình dung hai người cùng bắt đầu chạy bộ. Một người chạy rồi thôi; người kia ghi mỗi buổi chạy lên một ứng dụng, nơi vài người bạn nhìn thấy. Người thứ hai chẳng có phép màu nào, chỉ có một dấu vết và vài ánh mắt nhìn vào dấu vết ấy. Theo dõi tiến độ giúp người ta đạt mục tiêu nhiều hơn, ở mức vừa phải. Theo dõi mà **ghi lại** thì hiệu quả hơn hẳn nhẩm trong đầu, và **báo cáo cho người khác** mạnh hơn gấp đôi giữ riêng <a class="ev ev-high" href="#r-harkin2016" title="Harkin 2016 · Bằng chứng mạnh"></a>.

Theo dõi đúng thứ mình muốn đổi cũng quan trọng: theo dõi **hành vi** thì hành vi đổi, theo dõi **kết quả** thì kết quả đổi <a class="ev ev-mid" href="#r-harkin2016" title="Harkin 2016 · Bằng chứng vừa"></a>. Muốn nghe đều thì ghi số buổi nghe, đừng chỉ ghi điểm thi thử. Cuối tuần, kể cho người nhà hay một người bạn nghe tuần này được mấy buổi <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Đó vừa là một cách theo dõi hiệu quả, vừa là dịp để trò chuyện với nhau.

<details><summary>Đọc thêm: quy mô nghiên cứu và publication bias</summary><div class="inner">

Tổng hợp của Harkin gồm 138 thử nghiệm ngẫu nhiên với gần 20.000 người. Sau khi hiệu chỉnh publication bias, tác dụng chung nhỏ đi đáng kể nhưng vẫn còn <a class="ev ev-high" href="#r-harkin2016" title="Harkin 2016 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="review"><span class="num">11.4</span>Review đều đặn</h3>

Có cần mỗi tuần ngồi nhìn lại một lần không? Nên có. Nhìn lại sau mỗi đợt làm việc là một trong những thói quen có bằng chứng tốt nhất, miễn là xét cả việc suôn sẻ chứ không chỉ việc hỏng.

Đội bóng nào đá xong cũng ngồi xem lại trận: pha nào hay, pha nào hỏng, trận sau đổi gì <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Nghe có vẻ mất thời gian, nhưng những buổi nhìn lại như thế sau một đợt làm việc, gọi là debrief, nâng hiệu suất khoảng 25% <a class="ev ev-high" href="#r-tannenbaum2013" title="Tannenbaum &amp; Cerasoli 2013 · Bằng chứng mạnh"></a>.

Review **cả thành công lẫn thất bại** tốt hơn chỉ mổ xẻ thất bại <a class="ev ev-mid" href="#r-ellis2005" title="Ellis &amp; Davidi 2005 · Bằng chứng vừa"></a>. Chỉ nhìn vào lỗi thì ta học được điều cần tránh, nhưng không học được điều nên lặp lại.

Chưa có thử nghiệm nào đo trực tiếp chuyện một người tự review mỗi tuần cho mục tiêu của đời mình; áp bằng chứng trên vào đời riêng là suy luận của cuốn sách <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Một buổi review hai mươi phút tối Chủ nhật gồm ba câu hỏi: *Tuần này việc gì suôn sẻ, vì sao? Việc gì trục trặc, trong tình huống nào? Tuần tới đổi một điều gì?*

Một buổi nhìn lại thật <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. *Suôn sẻ:* bốn buổi nghe, cả bốn đều xong, vì tai nghe và tập podcast đã để sẵn trên bàn từ sáng. *Trục trặc:* thứ Sáu chỉ nghe được mười phút; hôm ấy kẹt xe gần một tiếng, về nhà muộn và đói. *Đổi một điều:* tối thứ Sáu chuyển sang mức tối thiểu, nghe lại một đoạn cũ trong mười phút, không chép. Để ý câu hỏi thứ hai hỏi "tình huống nào", chứ không hỏi "mình lười đến đâu". Thứ cần sửa thường là tình huống, không phải tính cách.

<details><summary>Đọc thêm: after-action review</summary><div class="inner">

Bằng chứng mạnh nhất về việc nhìn lại đến từ môi trường làm việc và huấn luyện. After-action review, tức một buổi nhìn lại có cấu trúc ngay sau mỗi đợt huấn luyện, cải thiện rõ các kết quả huấn luyện nói chung <a class="ev ev-high" href="#r-keiser2021" title="Keiser &amp; Arthur 2021 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="let-go"><span class="num">11.5</span>Buông bỏ, và gắn với mục tiêu mới</h3>

Bỏ một mục tiêu dở dang có phải là thất bại không? Không, nếu bạn dồn sức lực ấy sang một mục tiêu mới. Gắn với cái mới quan trọng hơn buông cái cũ.

Ai cũng có vài dự định nằm dở: cây đàn guitar mua về tập được ba bài, cuốn sách nấu ăn mới thử được hai món <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Cất cây đàn lên nóc tủ mới là nửa đầu; nửa sau, quan trọng hơn, là dồn sức lực ấy vào đâu. Buông một mục tiêu không còn khả thi (**disengagement**) và gắn với một mục tiêu mới (**re-engagement**) là hai kỹ năng khác nhau. Cả hai đều đi kèm chất lượng sống tốt hơn, nhưng **gắn với mục tiêu mới quan trọng hơn buông bỏ** <a class="ev ev-mid" href="#r-barlow2020" title="Barlow, Wrosch &amp; McGrath 2020 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-wrosch2003" title="Wrosch 2003 · Bằng chứng vừa"></a>. Buông mà không có gì thay vào thì để lại một khoảng trống.

Giả sử bạn từng mua cây đàn guitar, tập được vài tuần rồi để ở góc phòng nửa năm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Mỗi lần nhìn thấy, lại hơi áy náy. Chỉ buông thôi thì mới hết áy náy. Buông rồi gắn sang việc khác thì khác hẳn: hai tối mỗi tuần từng dành cho cây đàn giờ chuyển sang bài nghe tiếng Anh, mục tiêu trọng tâm của giai đoạn này. Sức lực không mất đi, chỉ đổi chỗ.

Một lưu ý thay đổi cách làm: ở những người có nguy cơ trầm cảm, buông nhiều lại đi kèm nhiều triệu chứng trầm cảm hơn. Vì thế, quyết định buông nên đưa ra ở buổi review, lúc đầu óc bình tĩnh, chứ không phải vào buổi tối tệ nhất của tuần <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: quy mô và độ mạnh của mối liên hệ</summary><div class="inner">

Meta-analysis của Barlow gộp 31 mẫu. Mối liên hệ giữa hai kỹ năng này và chất lượng sống không lớn. Mối liên hệ của re-engagement mạnh hơn gấp đôi của disengagement. Ở những mẫu có nguy cơ trầm cảm, mối liên hệ của disengagement bị **đảo ngược** <a class="ev ev-mid" href="#r-barlow2020" title="Barlow, Wrosch &amp; McGrath 2020 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-wrosch2003" title="Wrosch 2003 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="week"><span class="num">11.6</span>Xây một tuần từ các nguyên lý</h3>

Ghép tất cả lại thì xếp một tuần thế nào? Đặt những thứ quan trọng nhất vào lịch trước, rồi mới xếp mục tiêu cá nhân quanh chúng. Giống xếp vali về quê ăn Tết: nhét quần áo lặt vặt vào trước thì hộp quà biếu hết chỗ; đặt hộp quà vào trước thì đồ lặt vặt tự lấp vào các khe.

Đây là phương pháp của cuốn sách <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>, không phải một nghiên cứu; mỗi bước dựa trên một chương.

1. **Xếp những món to vào trước**: giấc ngủ (giờ thức cố định — [chương 9](#sleep)) và thời gian với người thân ([chương 6](#close-ties)). Đây là trụ cột; mục tiêu cá nhân xếp quanh chúng, không lấn chỗ của chúng.
2. **Chọn một mục tiêu trọng tâm** cho giai đoạn này, các mục tiêu khác ở mức duy trì ([§11.1](#choose-goals)).
3. **Xếp mỗi việc vào khung giờ hợp với nó**: việc khó vào lúc đầu óc còn tươi; lúc mệt chỉ để những việc nhỏ đã chuẩn bị sẵn ([chương 2](#cold-hot)).
4. **Đặt sẵn một mức tối thiểu** cho ngày tệ, nhỏ đến mức gần như không thể thất bại, như "mở sách ra đọc một trang", và thưởng cho việc quay lại sau ngày lỡ ([§2.3](#habits)).
5. **Ghi lại, chia sẻ, review mỗi tuần**, và chỉ đổi kế hoạch ở buổi review ([§11.3](#monitoring), [§11.4](#review)).

Khi cuộc sống thay đổi, như việc mới, nhà mới, một người mới bước vào đời mình, hãy làm lại năm bước này. Lịch sẽ đổi; nguyên lý thì không.

<div class="callout data"><div class="ct">Tự kiểm tra: mục tiêu nghe của bạn</div>

Lấy một trang ghi chú, viết ba dòng: vì sao mình muốn nghe giỏi (một câu, bằng lời của mình); mục tiêu ở tầng quy trình (giờ nào, làm gì, bao lâu); và mức tối thiểu cho ngày tệ. Mỗi tối sau buổi học, đánh một dấu tích; cuối tuần kể cho một người thân nghe tuần này được mấy dấu. Sau hai tuần, đếm lại <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Nếu tuần nào cũng được từ ba trên bốn buổi, cách làm đang ổn, cứ giữ nguyên. Nếu dưới hai buổi, đừng vội kết luận mình thiếu ý chí: việc mình đặt ra đang quá lớn hoặc nằm sai giờ, và buổi review Chủ nhật là lúc thu nhỏ nó lại.

</div>

<h2 id="decisions"><span class="num">12</span>Quyết định lớn</h2>

Người nấu cơm mỗi ngày nêm nếm cả nghìn bữa, bữa nào mặn nhạt cũng là một lần học. Nhưng chọn ngành, chọn chỗ làm, chọn người cùng sống, có nên rời đi hay không: những quyết định ấy cả đời chỉ gặp vài lần. Giống như cất nhà: đời người chỉ cất một hai lần, chẳng có lần nào để làm nháp <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Ta gần như không có dịp rút kinh nghiệm từ chính mình, nên đây là chỗ các thiên lệch ở [chương 2](#cold-hot) gây hại nhiều nhất. Chương này đi theo đúng trình tự của một quyết định.

```mermaid
flowchart TD
  A["① Lấy dữ liệu từ bên ngoài:<br/>những người đã làm điều này<br/>thường ra sao?"] --> B["② Lùi ra xa:<br/>mình sẽ khuyên một người bạn thế nào?"]
  B --> C["③ Ước lượng hai lần<br/>và lấy trung bình"]
  C --> D["④ Coi như nó chắc chắn<br/>đã thất bại: vì sao?"]
  D --> E{"⑤ Vẫn phân vân<br/>sau thời gian dài?"}
  E -->|"có"| F["Dám thay đổi thường<br/>không tệ như mình sợ"]
  E -->|"không"| G["Quyết, rồi cam kết"]
  F --> G
  G --> H["⑥ Đánh giá quyết định theo quá trình,<br/>không theo kết quả"]
```

<h3 id="outside-view"><span class="num">12.1</span>Nhìn từ bên ngoài</h3>

Vì sao lần nào ước lượng cũng trễ? Vì mình chỉ nghĩ về kế hoạch trước mặt. Nhìn vào những lần tương tự trước đây thì dự đoán sát hơn hẳn.

Cận Tết, bạn nhẩm việc dọn nhà: lau cửa một buổi, dọn bếp một buổi, giặt rèm nửa buổi, "khoảng hai ngày rưỡi" <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Đến 28 Tết, nhà vẫn chưa dọn xong. Năm nào cũng thế, vậy mà năm sau vẫn nhẩm y như cũ. Lối nghĩ chỉ nhìn vào các bước của kế hoạch thường cho ra dự đoán lạc quan quá mức, vì người ta bỏ qua số liệu của những trường hợp tương tự <a class="ev ev-mid" href="#r-kahneman1993" title="Kahneman &amp; Lovallo 1993 · Bằng chứng vừa"></a>. **Outside view** hỏi một câu khác: *những lần tương tự trước đây thường mất bao lâu, thường thành công tới đâu?*

Hiện tượng ước lượng quá lạc quan ấy gọi là **planning fallacy**, và ví dụ rõ nhất là chuyện sinh viên viết luận văn. Họ được hỏi hai câu: dự kiến bao lâu xong, và nếu mọi thứ tệ nhất thì bao lâu. Bạn đoán xem: thời gian thực tế rơi vào đâu?

```chart bar
thời gian hoàn thành luận văn,số ngày
Dự đoán của sinh viên,33.9
Dự đoán "nếu mọi thứ tệ nhất",48.6
Thực tế,55.5
```

<p class="src">Nguồn: Buehler, Griffin & Ross 1994, JPSP 67(3):366–381. Trung bình thực tế còn dài hơn cả dự đoán tệ nhất (dù chênh lệch này chưa đủ chắc để khẳng định), và chưa tới một nửa (48,7%) xong trước mốc tệ nhất ấy.</p>

Thực tế còn dài hơn cả kịch bản tệ nhất mà chính họ tưởng tượng ra <a class="ev ev-high" href="#r-buehler1994" title="Buehler 1994 · Bằng chứng mạnh"></a>. Cách chữa trong cùng nghiên cứu: khi được yêu cầu **nối dự đoán với những lần trước** của chính mình, sai lệch lạc quan biến mất. Trước khi tin vào kế hoạch, hãy tìm dữ liệu về những lần giống thế, và đặt dự đoán ngay cạnh dữ liệu ấy.

Áp vào một bữa giỗ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Chủ nhật này nhà có giỗ, bạn nhận nấu mâm cỗ, và cả nhà hỏi mấy giờ thì dọn được mâm. Đầu bạn nói: "hai tiếng". Trước khi trả lời, nhớ lại năm lần nấu cỗ gần đây: mỗi lần thật sự mất bao lâu từ lúc đi chợ về tới lúc dọn mâm. Giả sử năm con số là 2, 3, 2, 4 và 3 tiếng, trung bình gần ba tiếng. Câu trả lời trung thực là "khoảng ba tiếng", và bạn nói được vì sao: lần nào cũng thiếu một thứ phải chạy ra chợ, có một món phải làm lại, có khách đến sớm phải ra tiếp. Lần này cả nhà không phải ngồi chờ trong bụng đói.

<details><summary>Đọc thêm: inside view và chi tiết nghiên cứu luận văn</summary><div class="inner">

Lối nghĩ chỉ nhìn vào chính kế hoạch, các bước và các kịch bản của nó, được gọi là inside view <a class="ev ev-mid" href="#r-kahneman1993" title="Kahneman &amp; Lovallo 1993 · Bằng chứng vừa"></a>.

Trong nghiên cứu của Buehler, khi lập kế hoạch, 74% suy nghĩ của người ta xoay quanh kịch bản tương lai, chỉ 7% dành cho kinh nghiệm quá khứ. Chỉ nhớ lại quá khứ mà không gắn với dự đoán thì chưa đủ để sửa sai lệch <a class="ev ev-high" href="#r-buehler1994" title="Buehler 1994 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="distance-decide"><span class="num">12.2</span>Lùi ra xa, và hỏi lại chính mình</h3>

Phân vân một quyết định lớn thì làm gì cho đầu óc bớt rối? Ba việc: nghĩ về mình như một người ngoài, ước lượng hai lần rồi lấy trung bình, và tưởng tượng quyết định đã thất bại để tìm lý do.

**Nghĩ về mình như người ngoài.** Khi một người bạn kể "mình đang phân vân có nên chuyển sang chỗ làm kia không", ta thường thấy ngay vấn đề nằm ở đâu. Đến lượt mình thì đầu óc rối tung. Như [chương 3](#distance) đã nói, người ta suy xét chuyện người khác khôn ngoan hơn chuyện của mình, và nghĩ về mình như một người ngoài xoá được khoảng cách đó <a class="ev ev-mid" href="#r-grossmann2014" title="Grossmann &amp; Kross 2014 · Bằng chứng vừa"></a>. Cách làm đơn giản <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: viết về chuyện của mình ở ngôi thứ ba, gọi mình bằng tên, như "Minh đang phân vân vì…".

**Ước lượng hai lần.** Lần đoán thứ hai của chính mình chứa thông tin mới. Thử đoán đám cưới của một người bạn sẽ có bao nhiêu khách. Lần đầu bạn đoán 400. Coi như lần ấy đã sai và đoán lại, bạn nói 300. Trung bình hai lần, 350, thường gần đúng hơn từng lần riêng lẻ, vì hai lần đoán sai theo những kiểu hơi khác nhau nên sai số bù trừ một phần. Hiện tượng này gọi là **crowd within**, một đám đông nhỏ ngay trong đầu mình <a class="ev ev-mid" href="#r-vul2008" title="Vul &amp; Pashler 2008 · Bằng chứng vừa"></a>.

Thử với một con số thật <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Bạn đang cân nhắc chuyển sang một chỗ làm mới, và cần ước lượng mỗi chiều đi xe máy mất bao lâu. Lần đầu, nhìn quãng đường, bạn đoán 20 phút. Ba hôm sau, giả định lần đầu đã sai và nghĩ xem sai ở đâu, như giờ cao điểm, mấy ngã tư hay kẹt, hôm trời mưa, bạn đoán 40 phút. Trung bình là 30. Hỏi thêm một người quen ngày nào cũng đi tuyến đường đó, họ nói 45; lấy trung bình với 30 được khoảng 37. Mà 37 phút mỗi chiều, năm ngày một tuần là hơn sáu tiếng. Nếu bây giờ đường đi làm chỉ ngắn bằng nửa thế, chừng ấy đủ để đổi hẳn một quyết định.

**Coi như đã thất bại.** Giả sử một năm nữa, quyết định này **đã thất bại thảm hại**, chắc chắn rồi, không phải "có thể". Vì sao lại thất bại? Khi một kết cục được coi là *chắc chắn* đã xảy ra, người ta nghĩ ra những lời giải thích dài hơn và cụ thể hơn <a class="ev ev-mid" href="#r-mitchell1989" title="Mitchell, Russo &amp; Pennington 1989 · Bằng chứng vừa"></a>. Người xưa nói "lo trước khỏi hoạ"; cách này đi xa hơn một bước, tưởng tượng hẳn ra cái hoạ đã xảy ra rồi. Dùng cách này để ra quyết định là ứng dụng của cuốn sách <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Với chỗ làm mới ấy, ngồi xuống mười phút và viết: "Một năm sau, chuyển việc hoá ra là sai lầm, vì…". Có thể bạn sẽ viết: công việc không như lời giới thiệu; hay phải ở lại muộn, bữa cơm tối với gia đình không còn giữ được; đường đi ngốn mất buổi học tiếng Anh. Mỗi dòng biến thành một câu hỏi cho buổi phỏng vấn cuối, hoặc một điều kiện để thương lượng trước khi ký.

<details><summary>Đọc thêm: nhật ký ngôi thứ ba, các nghiên cứu lặp lại, và lấy trung bình với người khác</summary><div class="inner">

Trong một tháng viết nhật ký, những người được hướng dẫn nghĩ về các tình huống hằng ngày ở ngôi thứ ba ("Minh đang bực vì…") suy luận khôn ngoan hơn chính họ lúc đầu. Nhóm viết ở ngôi thứ nhất ("Tôi đang bực vì…") thì không đổi. Một thí nghiệm kéo dài một tuần lặp lại kết quả, lần này nhóm ngôi thứ ba vượt cả nhóm ngôi thứ nhất <a class="ev ev-mid" href="#r-grossmann2021" title="Grossmann 2021 · Bằng chứng vừa"></a>.

Hiện tượng crowd within đã được lặp lại trong một nghiên cứu đăng ký trước, cả khi hai lần đoán liền nhau lẫn khi cách nhau ba tuần <a class="ev ev-mid" href="#r-steegen2014" title="Steegen 2014 · Bằng chứng vừa"></a>.

Khi sửa ước lượng của mình theo ý kiến một người khác, **lấy trung bình** tốt hơn chọn hẳn một bên trong rất nhiều hoàn cảnh <a class="ev ev-mid" href="#r-soll2009" title="Soll &amp; Larrick 2009 · Bằng chứng vừa"></a>. Đây là lý do ví dụ đi làm ở trên gộp cả con số của người quen.

Trong nghiên cứu của Mitchell và cộng sự, đặt sự việc ở quá khứ hay tương lai thì gần như không ảnh hưởng; điều quan trọng là coi kết cục là chắc chắn <a class="ev ev-mid" href="#r-mitchell1989" title="Mitchell, Russo &amp; Pennington 1989 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="intuition"><span class="num">12.3</span>Khi nào tin trực giác</h3>

Khi nào nên tin cảm giác "có gì đó không ổn"? Khi bạn đã gặp đúng loại tình huống ấy rất nhiều lần, và lần nào cũng sớm biết mình đúng hay sai. Với chuyện chọn nghề hay chuyển việc, gần như không ai có trực giác như vậy <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Một người lính cứu hoả lâu năm bước vào một căn nhà đang cháy, tự dưng thấy bất an và ra lệnh cả đội rút ra; vài giây sau sàn nhà sập. Một người khác "cảm thấy" mảnh đất ở vùng ven sắp lên giá gấp đôi và dốc hết tiền tiết kiệm vào <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Cả hai đều nghe theo trực giác, nhưng chỉ một người có lý do để tin.

Kahneman nghiên cứu những sai lầm của trực giác, còn Klein nghiên cứu trực giác của chuyên gia. Hai người từng đứng ở hai phía đối lập, nhưng cuối cùng thống nhất một tiêu chí. Trực giác đáng tin **chỉ khi** môi trường đủ đều đặn để có quy luật, và người đó đã có cơ hội học quy luật ấy qua phản hồi lặp lại <a class="ev ev-high" href="#r-kahneman2009" title="Kahneman &amp; Klein 2009 · Bằng chứng mạnh"></a>. Đám cháy có quy luật, và người lính cứu hoả đã gặp hàng trăm đám cháy. Một bác thợ sửa xe lâu năm nghe tiếng máy là đoán ra bệnh, vì đã nghe hàng nghìn chiếc xe. Cũng bác ấy, đứng trước câu hỏi có nên bán tiệm lên thành phố mở tiệm lớn hơn, chỉ là một người mới <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Với những quyết định như thế, hãy dùng các bước ở §12.1 và §12.2 thay vì chờ một cảm giác chắc chắn.

<details><summary>Đọc thêm: "để vô thức quyết định" có thật không?</summary><div class="inner">

Lời khuyên "để vô thức xử lý", tức đi làm việc khác rồi quyết theo cảm giác, không còn đúng khi được kiểm lại. Một nghiên cứu lặp lại với 399 người không thấy "unconscious thought" có lợi thế nào. Trong meta-analysis, hiệu ứng nhỏ từng được báo cáo biến mất sau khi hiệu chỉnh publication bias <a class="ev ev-high" href="#r-nieuwenstein2015" title="Nieuwenstein 2015 · Bằng chứng mạnh"></a>.

Ngủ một đêm trước một quyết định lớn vẫn có ích, nhưng là vì qua một đêm mình bình tĩnh hơn và có khoảng cách, không phải vì vô thức đã tính hộ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div></details>

<h3 id="regret"><span class="num">12.4</span>Hối tiếc, và can đảm để thay đổi</h3>

Sợ thay đổi rồi hối hận, vậy có nên đứng yên? Khi đã cân nhắc rất lâu mà hai bên vẫn ngang nhau, nỗi sợ thay đổi thường lớn hơn cái giá thật của việc thay đổi. Và đã chọn rồi thì nên cam kết trọn vẹn.

**Hối tiếc dai dẳng nhất là khoảng cách với con người mình từng muốn trở thành.** Khoảng cách với **con người lý tưởng** day dứt lâu hơn khoảng cách với con người mình "phải" là <a class="ev ev-mid" href="#r-davidai2018" title="Davidai &amp; Gilovich 2018 · Bằng chứng vừa"></a>. "Lẽ ra mình đã thử viết sách" day dứt lâu hơn "lẽ ra mình nên chăm đi họp lớp hơn".

**Thay đổi thường không tệ như mình sợ.** Một nghiên cứu giao quyền quyết định cho một đồng xu. Những người đang phân vân một chuyện lớn, như có bỏ việc không, có chia tay không, lên một trang web tung đồng xu ảo: một mặt là "thay đổi", mặt kia là "giữ nguyên". Bạn đoán xem: sáu tháng sau, nhóm nào hạnh phúc hơn? Ai được đồng xu bảo "thay đổi" thì có khả năng thay đổi cao hơn. Sáu tháng sau, những người đã thay đổi vì một chuyện lớn **hạnh phúc hơn** những người giữ nguyên <a class="ev ev-mid" href="#r-levitt2021" title="Levitt 2021 · Bằng chứng vừa"></a>. Đây không phải lời khuyên ai cũng nên bỏ việc. Kết quả chỉ cho thấy rằng khi đã cân nhắc rất lâu mà vẫn ngang nhau, người ta thường quá thận trọng.

**Đã chọn thì đóng đường lui.** Người được chọn một phương án có thể đổi lại về sau thì **ít thích** lựa chọn của mình hơn người chọn dứt khoát, dù ai cũng thích giữ một đường lui <a class="ev ev-mid" href="#r-gilbert2002" title="Gilbert &amp; Ebert 2002 · Bằng chứng vừa"></a>. Còn đường lui thì đầu óc cứ quay lại so sánh. Đã đóng cửa thì đầu óc bắt đầu tìm ra điểm tốt của thứ mình đang có. Ví dụ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: đã chốt mua chiếc xe máy rồi thì thôi lướt các nhóm rao bán xe, đừng mỗi tối mở ra xem "lỡ còn chiếc rẻ hơn".

<details><summary>Đọc thêm: hối tiếc vì điều đã làm hay điều đã không làm</summary><div class="inner">

Nghiên cứu kinh điển về hối tiếc cho rằng trong ngắn hạn, người ta hối tiếc vì **những gì đã làm** nhiều hơn, như lỡ nói một câu, lỡ mua một món. Về lâu dài, họ lại hối tiếc vì **những điều đã không làm** nhiều hơn: chuyến đi không đi, người không dám tỏ tình, ngành không dám theo <a class="ev ev-mid" href="#r-gilovich1995" title="Gilovich &amp; Medvec 1995 · Bằng chứng vừa"></a>.

Hai nghiên cứu lặp lại gần đây xác nhận rằng theo thời gian, hối tiếc dịch dần từ việc đã làm sang việc đã không làm, nhưng ở mức yếu hơn bản gốc. Trong mẫu lớn năm 2023, khi nhìn lại cả đời, số người day dứt nhất vì điều đã không làm chỉ ngang số người day dứt vì điều đã làm, 49% so với 51% <a class="ev ev-low" href="#r-yeung2022" title="Yeung &amp; Feldman 2022 · Bằng chứng yếu hoặc đang tranh cãi"></a><a class="ev ev-low" href="#r-richardson2023" title="Richardson &amp; Gilovich 2023 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

Người ta hối tiếc nhiều nhất về học hành, sự nghiệp, tình cảm, con cái. Đó chính là những lĩnh vực họ thấy mình **còn cơ hội** thay đổi và làm lại <a class="ev ev-mid" href="#r-roese2005" title="Roese &amp; Summerville 2005 · Bằng chứng vừa"></a>. Hối tiếc mạnh nhất ở nơi cánh cửa vẫn còn hé.

Nghiên cứu đồng xu chỉ là một nghiên cứu, trên những người tự tìm đến vì đã phân vân sẵn. Tác giả kết luận rằng người ta có thể quá thận trọng khi đứng trước những lựa chọn đổi đời <a class="ev ev-mid" href="#r-levitt2021" title="Levitt 2021 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="judge-process"><span class="num">12.5</span>Đánh giá quyết định theo quá trình</h3>

Quyết định có kết quả xấu thì có phải là quyết định tồi? Chưa chắc. Hãy chấm một quyết định theo cách mình đã đưa ra nó, với thông tin mình có lúc đó, chứ không theo may rủi về sau.

Một người lái xe về nhà sau khi uống năm lon bia và về tới nơi an toàn. Quyết định đó có tốt không? Rõ ràng là không, chỉ là gặp may. Một người khác cân nhắc kỹ, chọn một công ty có nền tài chính vững, rồi sáu tháng sau công ty bất ngờ cắt giảm cả mảng. Quyết định đó có tồi không? Không, chỉ là gặp xui.

Vậy mà cùng một quyết định, khi kết quả tốt, người ta chấm quyết định ấy **sáng suốt hơn** so với khi kết quả xấu. Hiện tượng này gọi là **outcome bias** <a class="ev ev-high" href="#r-baron1988" title="Baron &amp; Hershey 1988 · Bằng chứng mạnh"></a>. Chấm theo kết quả thì ta rút ra bài học sai từ cả hai trường hợp trên: người lái xe học được rằng uống rồi lái cũng không sao, người chọn việc học được rằng cân nhắc kỹ là vô ích. Câu hỏi đúng ở buổi review là <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: *với thông tin mình có lúc đó, quá trình ra quyết định có tốt không?*

Một bẫy nữa là **sunk cost**: tiếp tục chỉ vì đã bỏ vào quá nhiều. Xu hướng này có thật, mức độ tuỳ loại quyết định <a class="ev ev-mid" href="#r-roth2015" title="Roth, Robbert &amp; Straus 2015 · Bằng chứng vừa"></a>. Giả sử bạn đã đóng tiền một khoá luyện thi sáu tháng, học được hai tháng thì nhận ra cách dạy không hợp <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Lớp đông, gần như chỉ luyện đề, trong khi thứ bạn cần là nghe mỗi ngày. Số tiền đã đóng sẽ kéo bạn ở lại "cho khỏi phí". Câu hỏi đúng: nếu từ hôm nay khoá học này miễn phí, mình có chọn dành bốn buổi tối mỗi tuần cho nó không? Nếu không, số tiền đã đóng không phải lý do để trả thêm bằng thời gian của mình.

<details><summary>Đọc thêm: focusing illusion, vé xem phim, và choice overload</summary><div class="inner">

**Focusing illusion.** Sinh viên ở vùng Trung Tây nước Mỹ, nơi mùa đông lạnh cắt da, và sinh viên ở Nam California nắng ấm quanh năm hài lòng với cuộc sống như nhau. Vậy mà cả hai nhóm đều đoán người California hạnh phúc hơn. Khi so sánh, những khác biệt dễ thấy, trước hết là khí hậu, rồi đến cơ hội văn hoá, chiếm hết sự chú ý <a class="ev ev-mid" href="#r-schkade1998" title="Schkade &amp; Kahneman 1998 · Bằng chứng vừa"></a>. Trong lúc đang nghĩ về một điều gì, ta luôn thấy điều đó quan trọng hơn thực tế. Người định chuyển lên Đà Lạt "vì khí hậu mát" nên nhớ rằng phần lớn một ngày ở Đà Lạt vẫn là làm việc, nấu ăn, đi chợ, y hệt ở Sài Gòn.

**Sunk cost ở rạp phim.** Đã mua vé, xem được hai mươi phút thấy dở, nhưng vẫn ngồi đến hết "cho đáng tiền". Ở lại hay bỏ về thì tiền vé cũng đã mất. Câu hỏi đúng chỉ nhìn về phía trước: từ giờ trở đi, lựa chọn nào tốt hơn?

**Choice overload.** "Nhiều lựa chọn quá làm người ta tê liệt" nghe rất có lý, nhưng tính trung bình qua 50 thí nghiệm thì hiệu ứng gần như bằng không <a class="ev ev-high" href="#r-scheibehenne2010" title="Scheibehenne 2010 · Bằng chứng mạnh"></a>. Hiện tượng này chỉ mạnh lên trong những điều kiện cụ thể: các phương án phức tạp, việc chọn khó, mình chưa rõ mình muốn gì, hoặc mình chỉ muốn chọn nhanh cho xong <a class="ev ev-high" href="#r-chernev2015" title="Chernev 2015 · Bằng chứng mạnh"></a>. Một thực đơn dài chẳng làm khó được người biết mình đang thèm phở. Ngoài việc bớt lựa chọn, còn một cách chữa nữa: **biết rõ mình cần gì trước khi chọn** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: độ lệch ước lượng của bạn</div>

Trong năm việc tới ở nhà, như dọn tủ quần áo, nấu một bữa đãi khách hay làm xong một bộ hồ sơ, trước khi bắt tay thì ghi vào một cuốn sổ nhỏ con số mình ước lượng; làm xong, ghi con số thật. Sau năm việc, lấy tổng thời gian thật chia cho tổng thời gian ước lượng. Nếu tỷ số quanh 1, cảm giác ước lượng của bạn đã khá chuẩn, cứ tin vào đó. Nếu tỷ số quanh 1,5 hay 2, bạn đang mắc planning fallacy như phần lớn mọi người, và từ giờ có sẵn một hệ số để nhân vào trước khi trả lời <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Cứ ghi tiếp vào cuốn sổ ấy mãi: đó là outside view của riêng bạn.

</div>

<h2 id="adversity"><span class="num">13</span>Nghịch cảnh và những điều không kiểm soát được</h2>

Mất người thân, mất việc, bệnh tật, đổ vỡ: sống đủ lâu thì ai cũng sẽ gặp vài lần. Chương này nói về những gì thường diễn ra sau một biến cố, những gì giúp được mình, và những niềm tin phổ biến nào là sai.

<h3 id="resilience"><span class="num">13.1</span>Phần lớn con người vượt qua — với một lưu ý</h3>

Gặp biến cố lớn thì mình có suy sụp nhiều tháng không? Phần lớn người vẫn đau buồn nhưng giữ được nhịp sống. Tuy vậy, không ít người hồi phục chậm, và đó không phải lỗi của họ.

Trên phim, người gặp biến cố thường suy sụp nhiều tháng rồi mới từ từ gượng dậy. Ngoài đời cũng có người đi con đường ấy, nhưng đó không phải con đường phổ biến nhất.

```chart bar
quỹ đạo sau một biến cố có thể gây sang chấn,tỷ lệ trung bình (%)
Resilience — ổn định từ đầu,65.7
Recovery — sa sút rồi hồi phục,20.8
Chronic — kéo dài,10.6
Delayed — chậm xuất hiện,8.9
```

<p class="src">Nguồn: Galatzer-Levy, Huang & Bonanno 2018, Clin Psych Rev 63:41–55. Tỷ lệ phụ thuộc vào mô hình thống kê; xem phần Đọc thêm bên dưới.</p>

Quỹ đạo phổ biến nhất là **resilience**: đau buồn, nhưng vẫn giữ được nhịp sống ổn định suốt từ đầu <a class="ev ev-mid" href="#r-galatzerlevy2018" title="Galatzer-Levy, Huang &amp; Bonanno 2018 · Bằng chứng vừa"></a>. Con số chính xác còn tranh cãi, nhưng hướng chung thì chắc: hồi phục phổ biến hơn người ta tưởng, và **không ít người không hồi phục nhanh**. Nếu bạn hồi phục chậm, bạn không "yếu" hơn ai; bạn đang đi một con đường mà nhiều người khác cũng đi.

Đau buồn cũng không phải cái cầu thang để bước lần lượt từng bậc. Mô hình "năm giai đoạn" (chối bỏ, giận dữ, mặc cả, trầm cảm, chấp nhận) rất nổi tiếng. Nhưng theo dõi những người mất người thân, các nhà nghiên cứu thấy ngay từ đầu, **chấp nhận** đã là điều được ghi nhận nhiều nhất, còn **nhớ thương** mới là cảm xúc tiêu cực chính <a class="ev ev-mid" href="#r-maciejewski2007" title="Maciejewski 2007 · Bằng chứng vừa"></a>. Các cảm xúc có mặt cùng lúc, như nhiều sợi đan vào nhau, nên chẳng có chuyện ai đó đau buồn "sai thứ tự" <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: con số resilience và mô hình năm giai đoạn</summary><div class="inner">

Theo tổng hợp của Galatzer-Levy, trung bình khoảng hai phần ba số người đi theo quỹ đạo resilience <a class="ev ev-mid" href="#r-galatzerlevy2018" title="Galatzer-Levy, Huang &amp; Bonanno 2018 · Bằng chứng vừa"></a>.

Một nghiên cứu hiếm hoi theo dõi 205 người từ *trước* khi mất vợ hoặc chồng cho tới 18 tháng sau cũng thấy kiểu thích nghi resilient là phổ biến nhất <a class="ev ev-mid" href="#r-bonanno2002" title="Bonanno 2002 · Bằng chứng vừa"></a>.

Khi phân tích lại cùng loại dữ liệu với giả định thống kê nới lỏng hơn, nhóm "resilience" có khi lại thành nhóm **nhỏ nhất**. Vì thế đừng tin vào một "tỷ lệ resilience" chính xác nào <a class="ev ev-mid" href="#r-infurna2016" title="Infurna &amp; Luthar 2016 · Bằng chứng vừa"></a>.

Nghiên cứu của Maciejewski theo dõi 233 người mất người thân. Chối bỏ không nổi bật lúc đầu. Các cảm xúc tiêu cực đều lên đỉnh trong khoảng 6 tháng đầu, và thời điểm đỉnh trung bình của từng cảm xúc xếp đúng thứ tự mô hình dự đoán. Chính các tác giả coi kết quả là ủng hộ một phần cho mô hình năm giai đoạn <a class="ev ev-mid" href="#r-maciejewski2007" title="Maciejewski 2007 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="events-differ"><span class="num">13.2</span>Không phải biến cố nào cũng như nhau</h3>

"Rồi sẽ quen thôi" có đúng với mọi chuyện không? Không. Có những biến cố, như mất việc, để lại dấu ấn lâu dài, nên đáng lo liệu từ lúc mọi thứ còn yên ổn.

Theo dõi hơn 24.000 người Đức trong 15 năm, các nhà nghiên cứu thấy sau khi mất việc, mức hài lòng cuộc sống **không hồi phục hoàn toàn**, kể cả khi người ta đã có việc lại <a class="ev ev-high" href="#r-lucas2004" title="Lucas 2004 · Bằng chứng mạnh"></a>. Giống một vết sẹo không mờ hẳn.

Vì thế những rủi ro như mất việc nên được lo liệu từ trước <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: bằng quỹ dự phòng ở [chương 10](#saving), và bằng những kỹ năng không phụ thuộc vào một chỗ làm duy nhất. Nghề nào cũng vậy: tay nghề càng mang đi được nhiều nơi, mất một chỗ làm càng đỡ chao đảo.

<details><summary>Đọc thêm: biến cố khác nhau ra sao</summary><div class="inner">

Tổng hợp 313 mẫu với hơn 65.000 người cho thấy các biến cố trong đời khác nhau rất nhiều về mức tác động. Với phần lớn biến cố, tác động lên sự hài lòng cuộc sống mạnh hơn và đều hơn tác động lên cảm xúc <a class="ev ev-high" href="#r-luhmann2012" title="Luhmann 2012 · Bằng chứng mạnh"></a>.

Trong dữ liệu Đức, từng thất nghiệp trước đó không khiến lần sau nhẹ đi <a class="ev ev-high" href="#r-lucas2004" title="Lucas 2004 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="control"><span class="num">13.3</span>Đổi được hay không đổi được</h3>

Gặp chuyện không như ý, nên cố thay đổi hay chấp nhận? Tách ra trước: phần đổi được thì hành động, phần không đổi được thì chấp nhận. Dùng nhầm chỗ thì có hại.

Đang đi xe máy về thì trời đổ mưa, đường phía trước ngập. Cơn mưa thì không làm tạnh được; nhưng mặc áo mưa, rẽ sang đường khác, hay tạt vào quán cà phê ngồi chờ thì làm được. Người khôn không ngồi chửi trời, cũng không cắm đầu phi vào chỗ ngập; họ tách hai thứ ra và dồn sức vào phần mình làm được.

```mermaid
flowchart TD
  X["Biến cố"] --> Q{"Phần nào trong chuyện này<br/>mình đổi được?"}
  Q -->|"phần đổi được"| P["Primary control:<br/>hành động lên thế giới<br/>(tìm việc, chữa bệnh, sửa quan hệ)"]
  Q -->|"phần không đổi được"| S["Secondary control:<br/>đổi chính mình<br/>(chấp nhận, hiểu lại, chỉnh mục tiêu)"]
  P --> R["Thích nghi"]
  S --> R
  S -.->|"mục tiêu cũ không còn khả thi"| G["Buông và gắn với<br/>mục tiêu thay thế (§11.5)"]
  G --> R
```

Hai cách ấy có tên: **primary control** là thay đổi thế giới cho hợp với mình, còn **secondary control** là thay đổi chính mình, mục tiêu và cách nhìn của mình, cho hợp với thế giới <a class="ev ev-mid" href="#r-heckhausen2010" title="Heckhausen, Wrosch &amp; Schulz 2010 · Bằng chứng vừa"></a>. Đây là câu hỏi ở [chương 3](#flexibility), nhưng ở tầm cả một đời.

**Dùng nhầm chỗ thì có hại.** Người giỏi nhìn lại sự việc theo hướng khác thì ít trầm cảm hơn khi nguồn căng thẳng nằm ngoài tầm kiểm soát. Nhưng họ lại trầm cảm *nhiều* hơn khi nguồn căng thẳng là thứ mình kiểm soát được <a class="ev ev-mid" href="#r-troy2013" title="Troy 2013 · Bằng chứng vừa"></a>. Tự nhủ "sếp khó tính cũng là một bài học" có thể giúp nếu không đổi được sếp. Nhưng câu ấy lại khiến mình mắc kẹt nếu hoàn toàn có thể xin chuyển nhóm.

Một tin xấu <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Chiều thứ Hai, chủ nhà báo cuối tháng sau lấy lại nhà, bạn phải chuyển đi. Lấy một trang giấy, kẻ hai cột. Cột "không đổi được": quyết định của chủ nhà, việc phải rời căn phòng đã quen, việc mình không được báo sớm hơn. Cột "đổi được": hỏi lại chủ nhà chuyện tiền cọc, nhờ bạn bè để ý giúp phòng trống quanh đó, gom bớt đồ không dùng tới. Với cột thứ nhất, cho phép mình bực và tiếc, không cần tự thuyết phục rằng "thật ra đây là điều tốt". Với cột thứ hai, chọn một việc và làm ngay sáng mai. Nỗi bực vẫn còn, nhưng không còn tràn sang những phần mình đang cầm lái.

**Chấp nhận cảm xúc, không phải chấp nhận hoàn cảnh.** Người quen để nỗi buồn đến mà không tự trách "sao mình lại buồn thế này" ít bị cảm xúc tiêu cực đè nặng khi căng thẳng, và có sức khoẻ tâm lý tốt hơn về sau. Lợi ích này chỉ thấy khi chấp nhận cảm xúc và suy nghĩ, không thấy khi chấp nhận hoàn cảnh <a class="ev ev-mid" href="#r-ford2018" title="Ford 2018 · Bằng chứng vừa"></a>. Chấp nhận nỗi buồn không có nghĩa là chấp nhận mãi một tình thế tồi.

<details><summary>Đọc thêm: lý thuyết gốc, sự linh hoạt, self-compassion và learned helplessness</summary><div class="inner">

Hai khái niệm primary control và secondary control đến từ motivational theory of life-span development, một lý thuyết về động lực qua suốt một đời người <a class="ev ev-mid" href="#r-heckhausen2010" title="Heckhausen, Wrosch &amp; Schulz 2010 · Bằng chứng vừa"></a>.

Cách nhìn lại sự việc theo hướng khác trong nghiên cứu của Troy gọi là reappraisal <a class="ev ev-mid" href="#r-troy2013" title="Troy 2013 · Bằng chứng vừa"></a>. Người thích nghi tốt là người biết đổi cách ứng phó cho hợp với từng tình huống <a class="ev ev-high" href="#r-cheng2014" title="Cheng, Lau &amp; Chan 2014 · Bằng chứng mạnh"></a>. Hầu hết biến cố là một hỗn hợp: không đổi được việc đã mất, nhưng đổi được bước tiếp theo.

Self-compassion, tức đối xử với chính mình như với một người bạn đang gặp chuyện, đi kèm ít triệu chứng tâm lý hơn hẳn <a class="ev ev-mid" href="#r-macbeth2012" title="MacBeth &amp; Gumley 2012 · Bằng chứng vừa"></a>. Đây là dữ liệu tương quan, nhưng cùng hướng với thí nghiệm ở [§3.6](#avoidance).

Theo bản cập nhật của thuyết learned helplessness, thụ động là phản ứng **mặc định** của cơ thể trước điều tồi tệ kéo dài; cảm giác kiểm soát thì phải **học** mới có <a class="ev ev-mid" href="#r-maier2016" title="Maier &amp; Seligman 2016 · Bằng chứng vừa"></a>. Bằng chứng chủ yếu từ động vật. Những việc nhỏ mình làm được trong lúc khó khăn, như dọn lại căn phòng, gửi một lá đơn xin việc, đi bộ một vòng, chính là cách học lại cảm giác ấy <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div></details>

<h3 id="support"><span class="num">13.4</span>Người nâng đỡ mình</h3>

Lúc gặp chuyện chỉ muốn ở một mình, có nên chiều theo cảm giác ấy? Đừng rút lui. Người càng đau càng dễ thu mình, càng thu mình càng ít người đỡ, và vòng xoáy cứ thế kéo xuống.

Sau sang chấn, ai được nâng đỡ nhiều thì về sau ít triệu chứng hơn. Chiều ngược lại cũng đúng: ai triệu chứng nặng thì về sau ít được nâng đỡ hơn <a class="ev ev-mid" href="#r-wang2021ptsd" title="Wang 2021 · Bằng chứng vừa"></a>. Sự nâng đỡ giống một tấm đệm: cú ngã vẫn xảy ra, nhưng tiếp đất nhẹ hơn.

Hai điều rút ra <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Khi mình gặp chuyện, đừng rút lui khỏi những người thân, kể cả khi chỉ muốn đóng cửa nằm một mình; một tin nhắn "dạo này mình không ổn" là đủ để mở cửa. Khi người khác gặp chuyện, sự có mặt đều đặn, kín đáo ([§6.4](#ties-giving)), như một bữa cơm mang sang hay một cuộc gọi mỗi tuần, quý hơn một lời khuyên hay.

Một tuần đuối <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Ngày nào đi làm về bạn cũng chỉ muốn nằm im, và tới giữa tuần thì định nhắn hoãn bữa ăn tối đã hẹn với một người bạn thân. Đó chính là lúc vòng xoáy bắt đầu kéo xuống. Thay vì hoãn, nhắn: "Tuần này mình hơi đuối, tối nay ghé nhà mình ăn đơn giản thôi được không?". Buổi tối nhẹ hơn thường lệ, nhưng sợi dây vẫn còn nguyên.

<details><summary>Đọc thêm: stress-buffering và quy mô nghiên cứu</summary><div class="inner">

Hình ảnh tấm đệm có tên là stress-buffering <a class="ev ev-mid" href="#r-cohen1985" title="Cohen &amp; Wills 1985 · Bằng chứng vừa"></a>.

Kết quả về hai chiều của vòng xoáy đến từ việc gộp 75 mẫu theo dõi dọc với hơn 32.000 người sau sang chấn <a class="ev ev-mid" href="#r-wang2021ptsd" title="Wang 2021 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="growth-myth"><span class="num">13.5</span>"Khổ đau làm mình mạnh lên" — kiểm tra lại</h3>

Trải qua khổ đau thì mình có mạnh lên không? Không chắc. Khi đo thật, người ta thường không thay đổi như họ kể, nên không cần ép mình tìm "điều tốt" trong mất mát.

**Posttraumatic growth**, ý tưởng rằng người ta trưởng thành lên nhờ biến cố, thường được đo bằng cách hỏi người ta *cảm thấy* mình đã thay đổi bao nhiêu. Cách đo ấy giống như hỏi một người "bạn có cao lên không?" thay vì lấy thước ra đo. Một nhóm nghiên cứu tình cờ có dữ liệu về cùng những người đó từ **trước** biến cố, nên đo được thay đổi thật. Mức "phát triển" người ta tự kể không khớp với thay đổi thật, và những người kể mình phát triển nhiều lại đang đau khổ **nhiều hơn** <a class="ev ev-mid" href="#r-frazier2009" title="Frazier 2009 · Bằng chứng vừa"></a>.

Như vậy không có nghĩa là chẳng ai trưởng thành sau khổ đau. Chỉ là **không cần ép mình phải thấy "điều tốt" trong mất mát** thì mới được coi là đã vượt qua. Mất một người thân có thể chỉ đơn giản là một mất mát, và thế là đủ.

<details><summary>Đọc thêm: tổng hợp các nghiên cứu dọc</summary><div class="inner">

Tổng hợp 122 nghiên cứu dọc với gần 100.000 người không thấy sự phát triển thật về ý nghĩa sống hay đời sống tinh thần, và phần lớn nghiên cứu có nhóm đối chứng không thấy khác biệt <a class="ev ev-high" href="#r-mangelsdorf2019" title="Mangelsdorf, Eid &amp; Luhmann 2019 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="help"><span class="num">13.6</span>Những gì có bằng chứng giúp</h3>

Khi nào nên tìm chuyên gia, và cái gì thật sự giúp? Khi buồn bã, lo âu kéo dài và bắt đầu lan sang công việc, giấc ngủ, các mối quan hệ. Trị liệu tâm lý có hiệu quả thật, ở mức lớn.

Gộp hơn 400 thử nghiệm với người trầm cảm, **CBT** hiệu quả hơn hẳn nhóm đối chứng, và các liệu pháp tâm lý khác nhau hiệu quả gần như ngang nhau <a class="ev ev-high" href="#r-cuijpers2023" title="Cuijpers 2023 · Bằng chứng mạnh"></a>. Nghĩa là đừng mất quá nhiều công chọn trường phái; tìm được một người trị liệu phù hợp mới là việc chính <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Với người không bệnh, **mindfulness** giảm lo âu, trầm cảm và căng thẳng so với không làm gì, nhưng không hơn các hoạt động chủ động khác <a class="ev ev-mid" href="#r-galante2021" title="Galante 2021 · Bằng chứng vừa"></a>. Thiền có ích, nhưng một hoạt động chủ động khác mà bạn thích cũng có thể có ích chừng ấy <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Tìm đến chuyên gia khi cần là một quyết định primary control, tức ra tay với phần đổi được, chứ không phải dấu hiệu yếu đuối <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Không ai coi việc gọi thợ sửa điện là thừa nhận mình yếu.

<details><summary>Đọc thêm: các con số về trị liệu, mindfulness, chương trình resilience và viết ra cảm xúc</summary><div class="inner">

Tổng hợp của Cuijpers gộp 409 thử nghiệm với hơn 52.000 bệnh nhân trầm cảm <a class="ev ev-high" href="#r-cuijpers2023" title="Cuijpers 2023 · Bằng chứng mạnh"></a>.

Kết quả mindfulness ở người không bệnh đúng trong hầu hết các cách phân tích, nhưng độ chắc chắn của bằng chứng chỉ từ vừa tới rất thấp <a class="ev ev-mid" href="#r-galante2021" title="Galante 2021 · Bằng chứng vừa"></a>. Ở người đang được điều trị, mindfulness hiệu quả ngang các phương pháp điều trị có bằng chứng <a class="ev ev-high" href="#r-goldberg2018" title="Goldberg 2018 · Bằng chứng mạnh"></a>.

Các chương trình rèn luyện resilience có tác dụng vừa phải, nhưng khác nhau nhiều giữa các chương trình <a class="ev ev-mid" href="#r-joyce2018" title="Joyce 2018 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-liu2020" title="Liu 2020 · Bằng chứng vừa"></a>.

Viết ra cảm xúc về một biến cố, gọi là expressive writing, có tác dụng thật nhưng **rất nhỏ**, qua 146 nghiên cứu <a class="ev ev-high" href="#r-frattaroli2006" title="Frattaroli 2006 · Bằng chứng mạnh"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: hai cột khi gặp chuyện</div>

Lần tới khi một chuyện khiến bạn khó ngủ — một lời trách nặng, một tin phải chuyển nhà, một trận cãi — dành năm phút trước khi đi ngủ để viết hai cột "đổi được" và "không đổi được". Để ý xem mình đang nghĩ nhiều về cột nào. Nếu đầu óc cứ quẩn quanh cột "không đổi được", đó là lúc tập chấp nhận cảm xúc thay vì cố tìm lời giải; nếu cột "đổi được" có một việc mình cứ lần lữa, đó là lúc hành động <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Ghi thêm một dòng: tuần này mình có hoãn gặp ai vì đang mệt không. Nếu có, đó là tín hiệu nên nhắn cho một người.

</div>

<h2 id="learning"><span class="num">14</span>Học và nghĩ</h2>

<h3 id="learn"><span class="num">14.1</span>Học: tự kiểm tra và giãn cách</h3>

Học thế nào để nhớ lâu? Gấp sách lại và tự nhớ thay vì đọc lại, và chia ra nhiều lần cách quãng thay vì dồn một lần. Cả hai đều đi ngược cảm giác "mình nắm rồi" khi đọc lại.

**Tự nhớ thay vì đọc lại.** Trước kỳ thi, cách học phổ biến nhất là đọc đi đọc lại, gạch chân bằng bút dạ quang. Đọc tới lần thứ ba, mọi thứ trông thật quen, và cảm giác "mình nắm rồi" đến rất dễ chịu. **Retrieval practice** làm ngược lại: gấp sách lại và tự nhớ, không nhìn tài liệu. Sinh viên học một đoạn văn trong bốn phiên, theo ba cách khác nhau, rồi được kiểm tra sau một tuần <a class="ev ev-high" href="#r-roediger2006" title="Roediger &amp; Karpicke 2006 · Bằng chứng mạnh"></a>:

```chart bar
cách học (4 phiên),% nhớ được sau 1 tuần
Đọc cả 4 phiên,40
Đọc 3 phiên + tự kiểm tra 1,56
Đọc 1 phiên + tự kiểm tra 3,61
```

<p class="src">Nguồn: Roediger & Karpicke 2006, Psych Sci 17(3):249–255, thí nghiệm 2.</p>

Nhóm đọc nhiều nhất lại nhớ ít nhất. Cảm giác "trôi chảy" khi đọc lại chỉ cho biết mình *nhận ra* thông tin, không cho biết mình có tự *nhớ ra* được hay không. Giống như xem người khác nấu một món thấy dễ ợt, nhưng tự vào bếp thì không nhớ nổi bước nào trước, bước nào sau <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

**Chia nhỏ ra nhiều lần.** Tưới cây mỗi ngày một ít thì cây lớn; dồn nước cả tuần vào một lần thì phần lớn chảy mất. Cùng một lượng thời gian, chia ra nhiều lần cách quãng cho kết quả tốt hơn dồn một lần. Cách này gọi là **spacing** <a class="ev ev-high" href="#r-cepeda2006" title="Cepeda 2006 · Bằng chứng mạnh"></a>. Đây cũng là lý do mỗi phần của cuốn sách này kết thúc bằng câu hỏi.

Áp vào một buổi nghe tiếng Anh <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Cách cũ: nghe một tập podcast hai mươi phút, thấy hiểu khá nhiều, nghe lại lần nữa cho chắc. Lần nghe thứ hai trôi chảy hơn, nhưng đó là cảm giác *nhận ra*, không phải khả năng nghe được một câu mới. Cách mới: nghe một đoạn năm phút, dừng lại, không nhìn transcript, viết ra những gì nhớ được, rồi mới mở transcript đối chiếu. Những cụm từ lạ chép vào một danh sách, tự kiểm lại vào hôm sau, ba ngày sau và một tuần sau. Buổi học khó chịu hơn, nhưng một tuần sau bạn nhớ được nhiều hơn.

<details><summary>Đọc thêm: số lần đọc, con số về spacing, và xếp hạng các kỹ thuật học</summary><div class="inner">

Trong thí nghiệm của Roediger và Karpicke, nhóm đọc cả bốn phiên đã đọc đoạn văn trung bình 14,2 lần, nhóm tự kiểm tra nhiều chỉ đọc 3,4 lần <a class="ev ev-high" href="#r-roediger2006" title="Roediger &amp; Karpicke 2006 · Bằng chứng mạnh"></a>.

Qua các nghiên cứu về spacing, học cách quãng cho kết quả trung bình 47,3% so với 36,7% khi dồn một lần <a class="ev ev-high" href="#r-cepeda2006" title="Cepeda 2006 · Bằng chứng mạnh"></a>.

Các tổng quan xếp retrieval practice và spacing vào nhóm hiệu quả cao, còn đọc lại, gạch chân, tóm tắt vào nhóm hiệu quả thấp <a class="ev ev-high" href="#r-dunlosky2013" title="Dunlosky 2013 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="transfer"><span class="num">14.2</span>Kỹ năng không tự lan sang chỗ khác</h3>

Chơi game luyện não hay học cờ vua có làm mình thông minh hơn không? Gần như không. Kỹ năng ít lan sang việc khác, nên muốn giỏi việc gì thì phải luyện đúng việc ấy.

"Cho con học cờ vua để thông minh hơn", "chơi game luyện não để đầu óc nhạy bén": những lời quảng cáo ấy rất hấp dẫn. Nhưng khi nhóm đối chứng cũng được làm một hoạt động khác, phần lợi lan sang những khả năng xa như toán, đọc hiểu, trí nhớ nói chung gần như bằng không <a class="ev ev-high" href="#r-sala2017" title="Sala &amp; Gobet 2017 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-simons2016" title="Simons 2016 · Bằng chứng mạnh"></a>.

Lý do nằm ở bản chất của chuyên môn. Một kiện tướng cờ vua nhìn một thế cờ thật trong năm giây rồi bày lại được nhiều quân hơn hẳn người mới chơi. Bạn đoán xem: nếu xếp các quân cờ ngẫu nhiên, không theo một ván thật nào, kiện tướng còn hơn bao nhiêu? Gần như không hơn <a class="ev ev-mid" href="#r-chase1973" title="Chase &amp; Simon 1973 · Bằng chứng vừa"></a>. Kiện tướng không có trí nhớ tốt hơn. Họ nhìn thấy những *mẫu hình* quen thuộc, nên nhớ một cụm thay vì từng quân.

Người đọc tiếng Việt thạo cũng vậy: nhìn một câu, họ thấy ngay cả cụm "đi chợ mua rau", chứ không đánh vần từng chữ. Đưa họ một câu có các chữ bị xáo trộn vô nghĩa thì họ cũng phải dò từng chữ như người mới học <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Với chuyện nghe tiếng Anh, điều này nghĩa là nghe tiếng Anh mới luyện được nghe tiếng Anh; một app luyện trí nhớ chung chung không thay được <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: con số trong thí nghiệm cờ vua, và tư duy phản biện</summary><div class="inner">

Trong thí nghiệm của Chase và Simon, kiện tướng bày lại được khoảng 16 quân, người mới chơi chỉ được khoảng 4. Nghiên cứu gốc chỉ có ba người chơi <a class="ev ev-mid" href="#r-chase1973" title="Chase &amp; Simon 1973 · Bằng chứng vừa"></a>.

Ngay cả tư duy phản biện cũng dựa vào kiến thức của chính lĩnh vực đó <a class="ev ev-mid" href="#r-willingham2007" title="Willingham 2007 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="talent"><span class="num">14.3</span>Luyện tập, tư duy phát triển, và grit</h3>

Muốn giỏi lên thì có cần đam mê, hay niềm tin "mình làm được"? Không nhiều như người ta nói. Thứ quyết định là việc thật sự ngồi xuống luyện, đều đặn.

**"10.000 giờ luyện tập là đủ."** Luyện có chủ đích, nhắm vào điểm yếu và có phản hồi, quan trọng nhưng không phải tất cả <a class="ev ev-mid" href="#r-macnamara2014" title="Macnamara 2014 · Bằng chứng vừa"></a>. Ở những lĩnh vực có luật chơi rõ như cờ, luyện tập chiếm phần đáng kể. Trong công việc thật, nơi luật chơi mơ hồ, những yếu tố khác chiếm phần lớn hơn nhiều.

**"Chỉ cần tin rằng mình có thể tiến bộ."** **Growth mindset**, niềm tin rằng năng lực phát triển được, chỉ liên hệ yếu với thành tích, và các can thiệp dạy growth mindset cho hiệu ứng rất nhỏ <a class="ev ev-high" href="#r-sisk2018" title="Sisk 2018 · Bằng chứng mạnh"></a>.

**"Grit là chìa khoá."** **Grit** chỉ liên hệ vừa phải với thành tích. Trong hai phần của grit, phần **kiên trì nỗ lực** dự báo thành tích tốt hơn phần **giữ một đam mê** <a class="ev ev-high" href="#r-crede2017" title="Credé, Tynan &amp; Harms 2017 · Bằng chứng mạnh"></a>.

Gộp lại: một niềm tin đúng đắn về bản thân không thay được việc thật sự ngồi xuống làm. Với chuyện nghe tiếng Anh của bạn, thứ đáng giữ không phải ngọn lửa đam mê mỗi tối, mà là bốn dấu tích mỗi tuần <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: deliberate practice theo lĩnh vực, và các tổng hợp mới về growth mindset, grit</summary><div class="inner">

Luyện có chủ đích có tên tiếng Anh là deliberate practice. Theo bài tổng hợp gốc, deliberate practice giải thích 26% khác biệt thành tích trong các trò chơi như cờ, 21% trong âm nhạc, 18% trong thể thao, 4% trong giáo dục và dưới 1% trong các nghề nghiệp <a class="ev ev-mid" href="#r-macnamara2014" title="Macnamara 2014 · Bằng chứng vừa"></a>. Năm 2018 bài này có một bản đính chính mà cuốn sách chưa đọc được.

Gộp 63 nghiên cứu về can thiệp growth mindset, tác dụng chung gần như bằng không và biến mất sau khi hiệu chỉnh publication bias. Ở 6 nghiên cứu chất lượng cao nhất, tác dụng cũng không phân biệt được với con số không <a class="ev ev-high" href="#r-macnamara2023" title="Macnamara &amp; Burgoyne 2023 · Bằng chứng mạnh"></a>.

Grit gần như trùng với tính tận tâm (conscientiousness) <a class="ev ev-high" href="#r-crede2017" title="Credé, Tynan &amp; Harms 2017 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="think"><span class="num">14.4</span>Nghĩ cho đúng</h3>

Thông minh có giúp tránh bẫy tư duy không? Không nhiều. Thứ giúp là thói quen tự hỏi "nếu mình sai thì vì sao", và ghi lại dự đoán để sau này đối chiếu.

Nhiều thiên lệch tư duy **không tương quan với IQ** <a class="ev ev-high" href="#r-stanovich2008" title="Stanovich &amp; West 2008 · Bằng chứng mạnh"></a>. Một bộ não mạnh cũng như một chiếc xe mạnh: đi nhanh hơn, nhưng nếu sai đường thì cũng tới chỗ sai nhanh hơn.

**Hỏi điều ngược lại.** Tự hỏi vì sao điều ngược lại có thể đúng, gọi là **consider the opposite**, hiệu quả hơn lời dặn "hãy khách quan" <a class="ev ev-mid" href="#r-lord1984" title="Lord, Lepper &amp; Preston 1984 · Bằng chứng vừa"></a>. Lời dặn "hãy khách quan" không cho đầu óc biết phải làm gì; câu hỏi "nếu mình sai thì vì sao?" thì có.

**Ghi lại dự đoán.** Những người dự báo giỏi nhất cập nhật niềm tin thường xuyên, từng chút một, và coi dự báo là một kỹ năng cần luyện <a class="ev ev-mid" href="#r-mellers2015" title="Mellers 2015 · Bằng chứng vừa"></a>. Thói quen đơn giản nhất rút ra từ đây <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: với những dự đoán quan trọng, **viết ra** mình tin gì và chắc bao nhiêu phần trăm, rồi sau này đối chiếu. Như vậy là tự dựng lên đúng cái vòng phản hồi mà [§12.3](#intuition) nói là đang thiếu.

Một ví dụ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Đầu năm, bạn ghi: "Mình tin 70% rằng trước Tết sẽ để dành đủ tiền mua chiếc xe máy mới." Đến Tết, ghi lại chuyện gì đã xảy ra. Một lần thì chẳng nói lên điều gì. Nhưng sau hai mươi dự đoán, gom những câu mình ghi "70%" lại. Nếu chỉ khoảng một nửa thành sự thật, bạn đang tự tin quá mức, và mỗi khi trong đầu nghĩ "70%", con số thật nên là 50%.

<details><summary>Đọc thêm: các thiên lệch cụ thể, actively open-minded thinking, và trò chơi giảm thiên lệch</summary><div class="inner">

Các thiên lệch không tương quan với IQ gồm anchoring, framing, myside bias, sunk cost và bỏ qua base rate <a class="ev ev-high" href="#r-stanovich2008" title="Stanovich &amp; West 2008 · Bằng chứng mạnh"></a>.

Thứ có vẻ tạo ra khác biệt là thói quen tư duy <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Actively open-minded thinking, tức chủ động tìm bằng chứng đi ngược niềm tin của mình, giúp đoán đúng hơn, vì người có thói quen này chịu tìm thêm thông tin trước khi kết luận <a class="ev ev-mid" href="#r-haran2013" title="Haran, Ritov &amp; Mellers 2013 · Bằng chứng vừa"></a>.

Một trò chơi giảm thiên lệch có phản hồi riêng cho từng người vẫn còn tác dụng sau hai tháng <a class="ev ev-mid" href="#r-morewedge2015" title="Morewedge 2015 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="change"><span class="num">14.5</span>Con người thay đổi được — qua hành động</h3>

Người ta có thay đổi được tính cách không? Có, nhưng chậm và chưa chắc chắn như người ta muốn tin. Thứ dự báo thay đổi là hành động thật, không phải lời hứa.

Qua các chương trình can thiệp, tính cách thay đổi ở mức vừa phải trong khoảng 24 tuần, chủ yếu ở mẫu lâm sàng <a class="ev ev-mid" href="#r-roberts2017" title="Roberts 2017 · Bằng chứng vừa"></a>. Câu "người ta không đổi được đâu" nghe rất từng trải, nhưng không đúng.

Với chuyện *chủ động* muốn đổi tính cách, chẳng hạn một người hướng nội muốn cởi mở hơn, có một kết quả đáng nhớ. Hình dung một thử thách kiểu "tuần này chủ động bắt chuyện với một người lạ". **Nhận thử thách không dự báo thay đổi; hoàn thành thử thách thì có** <a class="ev ev-mid" href="#r-hudson2019" title="Hudson 2019 · Bằng chứng vừa"></a>. Ghi tên vào danh sách không làm ai đổi khác; bước tới bắt chuyện thật thì có.

Đó cũng là câu tóm tắt cả cuốn sách: ta trở thành những gì ta đã thực sự làm, không phải những gì ta đã định làm.

<details><summary>Đọc thêm: tính tận tâm và giới hạn của bằng chứng</summary><div class="inner">

Riêng tính tận tâm thay đổi ít hơn nhiều, và trong các thí nghiệm có nhóm đối chứng, thay đổi về tính tận tâm gần như bằng không. Khi hiệu chỉnh cho các nghiên cứu mẫu nhỏ, mức thay đổi chung so với nhóm đối chứng cũng co lại tới mức không phân biệt được với con số không. Các tác giả lưu ý phép hiệu chỉnh này kém chính xác <a class="ev ev-mid" href="#r-roberts2017" title="Roberts 2017 · Bằng chứng vừa"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: đọc lại hay tự kiểm tra</div>

Một thí nghiệm nhỏ trong tuần này. Chọn 20 cụm từ mới từ podcast, chia làm hai nhóm 10. Nhóm A: mỗi tối đọc lại danh sách. Nhóm B: mỗi tối che nghĩa đi, tự nhớ, rồi mới lật ra xem. Thời gian cho hai nhóm như nhau. Chủ nhật, che hết và tự kiểm cả 20 cụm. Nếu nhóm B nhớ nhiều hơn dù lúc học thấy khó chịu hơn, bạn vừa tận mắt thấy cảm giác "trôi chảy" đánh lừa mình thế nào <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Nếu hai nhóm ngang nhau, để thêm một tuần không ôn rồi kiểm lại lần nữa: thí nghiệm ở trên nói về chuyện nhớ lâu, nên càng để lâu càng dễ thấy khác biệt.

</div>

<div class="recall">

**Câu hỏi nhớ lại — Phần IV.**

<details><summary>Vì sao nên đặt mục tiêu ở tầng quy trình?</summary><div class="inner">

Vì quy trình là thứ mình kiểm soát ngay lúc này. Trong thể thao, tập trung vào quy trình khi đang thực hiện kỹ năng ("đặt chân trụ sát bóng") có tác dụng mạnh hơn hẳn mục tiêu mốc thành tích, còn mục tiêu kết quả ("thắng giải") gần như không giúp gì (Williamson 2022); áp dụng ý đó cho mục tiêu hằng tuần là suy luận của cuốn sách. Kết quả cho biết hướng đi, quy trình mới là thứ mình điều khiển được.

</div></details>

<details><summary>Theo dõi tiến độ thế nào thì hiệu quả nhất?</summary><div class="inner">

Ghi lại thay vì nhẩm trong đầu, và báo cáo cho người khác thay vì giữ riêng; theo dõi đúng thứ mình muốn đổi — hành vi hay kết quả (Harkin 2016).

</div></details>

<details><summary>Outside view là gì, và vì sao nó sửa được planning fallacy?</summary><div class="inner">

Là hỏi những trường hợp tương tự thường diễn ra thế nào, thay vì chỉ nghĩ về kế hoạch của mình. Sinh viên viết luận văn mất lâu hơn cả kịch bản tệ nhất họ tự đoán; khi người ta nối dự đoán với kinh nghiệm quá khứ của chính mình, sai lệch biến mất (Buehler 1994).

</div></details>

<details><summary>Khi nào trực giác đáng tin?</summary><div class="inner">

Khi môi trường đủ đều đặn để có quy luật và người đó đã có cơ hội học quy luật ấy qua phản hồi lặp lại, như người lính cứu hoả với đám cháy (Kahneman & Klein 2009). Những quyết định đời người hiếm khi thoả điều kiện này.

</div></details>

<details><summary>Câu hỏi đầu tiên trước một biến cố là gì?</summary><div class="inner">

Phần nào mình đổi được, phần nào không — như cơn mưa và chiếc áo mưa. Phần đổi được thì hành động (primary control); phần không đổi được thì chấp nhận và chỉnh mục tiêu (secondary control).

</div></details>

<details><summary>Học một bài thế nào thì nhớ lâu nhất?</summary><div class="inner">

Tự kiểm tra (retrieval practice) thay vì đọc lại, và chia ra nhiều lần cách quãng (spacing) thay vì dồn một lần. Cảm giác trôi chảy khi đọc lại là tín hiệu sai.

</div></details>

</div>


<h2 id="part-5" class="part">Phần V — Gốc rễ</h2>

Bốn phần trước trả lời câu hỏi *chuyện gì sẽ xảy ra*: con người vận hành ra sao, việc này thường kéo theo việc gì. Nhưng quyết định nào cũng còn câu hỏi thứ hai: *mình muốn chuyện gì xảy ra hơn*. Câu này khoa học không trả lời thay mình được.

Cứ nghĩ tới chuyện về quê ăn Tết là thấy ngay vì sao <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Người đi trước chỉ được cho mình đường nào nhanh, đường nào kẹt, đi xe khách hay chạy xe máy thì đằng nào đỡ mệt hơn. Nhưng không ai chỉ hộ được mình nên về quê với bố mẹ hay ở lại thành phố đón Tết với gia đình nhỏ. Câu ấy mình phải tự trả lời. Phần V nói về những câu như thế trong đời mình: **values** (điều mình coi trọng), **principles** (những luật mình tự đặt ra từ values), cách sống tử tế, và cách dùng tất cả những thứ ấy khi phải chọn.

Biết thế giới *đang* thế nào không cho ta biết mình *nên* làm gì. Đây là một lập luận triết học, không phải phát hiện từ thí nghiệm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Dù vậy dữ liệu vẫn giúp được nhiều: nhờ dữ liệu, ta biết values tác động lên hành vi ra sao, cách nào giữ được values, và đâu chỉ là ảo tưởng.

<h2 id="values"><span class="num">15</span>Values: thứ khoa học không chọn hộ mình</h2>

<h3 id="value-circle"><span class="num">15.1</span>Vòng tròn values: vì sao hai điều tốt lại giằng co nhau</h3>

Cả hai lựa chọn đều tốt, sao mình vẫn thấy giằng xé? Vì hai lựa chọn ấy phục vụ hai values kéo về hai hướng ngược nhau. Chuyện đó bình thường, chẳng phải dấu hiệu mình yếu đuối.

Hình dung mười người ngồi quanh một mâm cơm. Ai ngồi cạnh nhau thì hợp chuyện, hay về một phe. Hai người ngồi đối diện thì như hai đầu đòn gánh: bên này nặng thêm thì bên kia phải nhẹ bớt, chiều người này là phật lòng người kia. Lý thuyết values của Schwartz vẽ động cơ của con người đúng như mâm cơm ấy, với mười values cơ bản xếp trên **một vòng tròn**. Theo đuổi một value thường phải trả giá bằng value ngồi đối diện.

<p class="src">Sơ đồ vị trí, không phải số liệu: mười values của Schwartz theo thứ tự quanh vòng tròn. Xanh dương: openness to change. Cam: self-enhancement (Hedonism nằm giữa hai nhóm này). Tím: conservation. Xanh lá: self-transcendence. Hai nhóm đối diện nhau là hai cặp xung đột lớn. Conformity và Tradition vốn chung một ô; bản 2012 đặt Tradition sát Security.</p>

| Value | Theo đuổi điều gì |
|---|---|
| Self-direction | Tự quyết suy nghĩ và hành động của mình: tự chọn, tự tạo, tự khám phá |
| Stimulation | Mới lạ, thử thách, hứng khởi |
| Hedonism | Niềm vui và sự thoả mãn cho chính mình |
| Achievement | Thành công cá nhân, chứng tỏ năng lực theo chuẩn của xã hội |
| Power | Địa vị, uy thế, quyền kiểm soát người khác và tài nguyên |
| Security | An toàn, ổn định và hài hoà — cho bản thân, cho các mối quan hệ, cho xã hội |
| Conformity | Kiềm chế những việc có thể làm phật lòng hay gây hại cho người khác, hoặc đi ngược chuẩn mực chung |
| Tradition | Tôn trọng và gìn giữ phong tục, truyền thống của gia đình, văn hoá, tôn giáo |
| Benevolence | Chăm lo cho những người gần gũi mình |
| Universalism | Hiểu, bao dung, bảo vệ phúc lợi của mọi người và của thiên nhiên |

**Vòng tròn giúp mình gọi tên cảm giác giằng xé.** Có hai cặp đối diện lớn. Cặp thứ nhất: muốn tự quyết và tìm cái mới, đối với muốn an toàn, giữ nề nếp. Cặp thứ hai: muốn thành tích cho mình, đối với muốn chăm lo cho người khác. Lan muốn nghỉ việc nhà nước để mở quán cà phê, còn bố mẹ muốn cô giữ chỗ làm ổn định. Chẳng ai sai cả. Lan đứng về phía *self-direction*, bố mẹ đứng về phía *security*, hai phía đối diện trên vòng tròn. Gọi đúng tên rồi, câu chuyện trong nhà không còn là "con bướng" nữa, mà thành "mình đang phải chọn giữa hai thứ đều đáng quý".

**Thử một tối thứ Sáu** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Đây là ví dụ minh hoạ, đi từng bước.

1. *Tình huống.* Đi làm về, bạn định ngồi học tiếng Anh 45 phút, mục tiêu bạn đã đặt ra cho năm nay. Nhưng tối thứ Sáu nào nhóm bạn thân cũng hẹn nhau ở quán bún chả quen, và tin nhắn rủ vừa tới.
2. *Vòng tròn đoán trước điều gì.* Học để giỏi lên nằm ở phía *achievement*; ở bên bạn bè thân thiết nằm ở phía *benevolence*. Hai phía này đối diện nhau trên vòng tròn, nên bứt rứt là chuyện tất yếu, chẳng phải dấu hiệu bạn lười hay ích kỷ.
3. *Bạn làm gì.* Thay vì tuần nào cũng giằng co, bạn hỏi một lần cho xong: "Tối thứ Sáu mà buộc phải chọn một, mình chọn cái nào?" Bạn chọn bạn bè, rồi chia 45 phút học ấy sang tối thứ Hai, thứ Ba, thứ Năm.
4. *Kết quả.* Tối thứ Sáu thôi là cuộc kéo co tuần nào cũng diễn lại. Bạn vẫn học đủ, chỉ là vào hôm khác. Ngồi ăn bún chả, bạn không còn bị ý nghĩ "đáng ra giờ này mình phải đang học" gặm nhấm.

Bạn đoán xem: nếu hỏi người ở hàng chục nước, values nào thường được xếp quan trọng nhất, và values nào thấp nhất?

**Phần đầu bảng của ai cũng gần giống nhau.** Ở hàng chục nước, *benevolence*, *self-direction* và *universalism* luôn đứng đầu; *power*, *tradition* và *stimulation* đứng cuối <a class="ev ev-high" href="#r-schwartz2001" title="Schwartz &amp; Bardi 2001 · Bằng chứng mạnh"></a>. Vậy nên khi tự tìm values, nếu thấy "chăm lo cho người thân" đứng đầu, bạn giống phần đông nhân loại. Điều thật sự riêng của mỗi người nằm ở **khúc giữa** bảng xếp hạng, và ở chỗ **mình sẵn sàng bỏ cái gì để giữ cái gì** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: vòng tròn đã được kiểm chứng tới đâu</summary><div class="inner">

Bốn nhóm trên vòng tròn có tên riêng. *Openness to change* gồm tự quyết, mới lạ. *Conservation* gồm an toàn, theo chuẩn mực, truyền thống. *Self-enhancement* gồm thành tích, quyền lực. *Self-transcendence* là chăm lo người khác và thế giới. Trong ví dụ của Lan, phía cô còn có *stimulation*, phía bố mẹ còn có *tradition*.

Đây là một trong những bản đồ về values đã qua kiểm chứng kỹ nhất, làm nền cho hàng trăm nghiên cứu suốt hai thập kỷ. Bản tinh chỉnh năm 2012 chia mười values thành 19 values hẹp hơn và kiểm tra trên hơn sáu nghìn người ở 10 nước. Thứ tự quanh vòng tròn đúng ở phần lớn các mẫu, còn vị trí chính xác của từng cặp hàng xóm chỉ nên xem là gần đúng <a class="ev ev-high" href="#r-schwartz2012" title="Schwartz 2012 · Bằng chứng mạnh"></a>.

Dữ liệu từ 38 nước cũng cho cùng hình dạng chung, tuy khớp tốt hơn ở sinh viên và ở các nước phương Tây <a class="ev ev-high" href="#r-fontaine2008" title="Fontaine 2008 · Bằng chứng mạnh"></a>.

Bảng xếp hạng chung đến từ người dân 13 nước, giáo viên 56 nước và sinh viên 54 nước. Ở hơn bốn phần năm số mẫu, thứ tự của từng nhóm gần như trùng với thứ tự chung <a class="ev ev-high" href="#r-schwartz2001" title="Schwartz &amp; Bardi 2001 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="values-in-action"><span class="num">15.2</span>Values thật nằm ở việc mình làm khi không ai bắt</h3>

Muốn biết mình thật sự coi trọng gì thì nhìn vào đâu? Nhìn vào những việc mình làm khi không ai bắt, chứ không phải lời mình nói hay những phép lịch sự ai cũng làm.

**Việc ai cũng làm thì chẳng nói lên điều gì.** Gặp hàng xóm, ai cũng chào; đi đám cưới, ai cũng mừng phong bì <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Nhìn những việc ấy, bạn không biết được ai thật lòng quý người khác, ai chỉ làm cho phải phép. Nghiên cứu cũng thấy values lộ ra qua hành vi không đều. Các tác giả gợi ý một lời giải thích: việc xã hội đã mặc định ai cũng phải làm thì người ta làm bất kể mình coi trọng gì, nên chuẩn mực che mất một phần values thật <a class="ev ev-mid" href="#r-bardi2003" title="Bardi &amp; Schwartz 2003 · Bằng chứng vừa"></a>.

**Value càng quan trọng thì càng lộ rõ trong việc mình làm** <a class="ev ev-mid" href="#r-lee2022" title="Lee 2022 · Bằng chứng vừa"></a>. Hai người cùng nói "mình mê đọc sách". Chiều Chủ nhật rảnh, một người mở cuốn sách đang đọc dở; người kia mở Netflix, tuần nào cũng vậy. Câu nói giống nhau, nhưng chỉ một người đang kể về values của mình bây giờ. Người còn lại đang kể về con người mình muốn trở thành <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.
