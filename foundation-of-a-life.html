**Cách tự kiểm tra đơn giản mà trung thực** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: đừng hỏi "mình coi trọng gì", hãy mở lại **bốn tuần gần nhất**, gồm lịch, sao kê chi tiêu, những lúc rảnh mình làm gì. Danh sách values viết ra mà không khớp với bốn tuần ấy là danh sách của người mình muốn trở thành. Cả hai danh sách đều đáng biết, và khoảng cách giữa chúng chính là chỗ cần cố gắng. [Chương 12](#regret) đã cho thấy những hối tiếc dai dẳng nhất thường đến từ khoảng cách với con người lý tưởng của mình, hơn là với con người mình "phải là".

<details><summary>Đọc thêm: value nào lộ rõ, value nào khó thấy</summary><div class="inner">

*Stimulation* và *tradition* lộ ra rất rõ qua hành vi. *Hedonism*, *power*, *universalism*, *self-direction* ở mức vừa. Còn *security*, *conformity*, *achievement*, *benevolence* chỉ lộ ra mờ nhạt <a class="ev ev-mid" href="#r-bardi2003" title="Bardi &amp; Schwartz 2003 · Bằng chứng vừa"></a>.

Nghiên cứu về mức quan trọng của value làm trên hơn năm nghìn người Úc. Chẳng hạn, ở nhóm coi trọng bảo vệ động vật nhất, liên hệ giữa value này và việc họ làm mạnh hơn hẳn so với nhóm chỉ coi trọng ở mức trung bình <a class="ev ev-mid" href="#r-lee2022" title="Lee 2022 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="values-change"><span class="num">15.3</span>Values đổi chậm</h3>

Values viết ra hôm nay có còn đúng vài năm sau không? Phần lớn là còn. Values đổi như tóc bạc chứ không như tâm trạng: có đổi thật, nhưng tính bằng năm, chẳng ai soi gương mà thấy khác sau một tuần.

**Đến tuổi trưởng thành, values đã khá ổn định.** Một nghiên cứu theo dõi 270 người trẻ từ 20 đến 28 tuổi suốt tám năm. Thứ tự values của họ khá ổn định, và bốn năm sau còn ổn định hơn bốn năm đầu <a class="ev ev-mid" href="#r-vecchione2016" title="Vecchione 2016 · Bằng chứng vừa"></a>.

**Một công việc hiếm khi biến mình thành người khác.** Khi người ta tự chọn một con đường mới, như vào ngành cảnh sát hay chọn ngành học, values của họ **vốn đã hợp với con đường ấy từ đầu**. Họ chọn nó một phần *vì* values sẵn có. Values chỉ đổi rõ ở bước ngoặt đảo lộn nhiều mặt đời sống nhất, là di cư <a class="ev ev-mid" href="#r-bardi2014" title="Bardi 2014 · Bằng chứng vừa"></a>. Vậy nên câu bố mẹ hay khuyên "cứ vào ngân hàng làm đi, rồi sẽ thích" ít khi đúng.

**Viết một lần cho kỹ, đọc lại mỗi năm** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Values viết ra khi đã trưởng thành là một nền khá vững cho nhiều năm, không phải thứ tháng nào cũng đổi. Nhưng values vẫn có đổi, chỉ là đổi chậm, nên mỗi năm nên đọc lại một lần. Nếu càng lớn tuổi bạn càng coi trọng việc chăm lo người khác và sự ổn định, đó là chuyện bình thường, chẳng phải mình phản bội chính mình thời trẻ.

<details><summary>Đọc thêm: values đổi theo tuổi và theo bước ngoặt</summary><div class="inner">

Trong nghiên cứu tám năm ấy, khi một value tăng lên, các value hàng xóm trên vòng tròn thường tăng theo, còn value đối diện thường giảm <a class="ev ev-mid" href="#r-vecchione2016" title="Vecchione 2016 · Bằng chứng vừa"></a>. Đúng như hình mâm cơm ở [§15.1](#value-circle).

Trên gần bốn nghìn người 25–75 tuổi chọn ngẫu nhiên khắp một nước, values hầu như không đổi trong ba năm. Người lớn tuổi hơn và phụ nữ coi trọng việc chăm lo người khác và sự ổn định hơn; người trẻ hơn và nam giới coi trọng địa vị và sự độc lập hơn <a class="ev ev-mid" href="#r-milfont2016" title="Milfont 2016 · Bằng chứng vừa"></a>. Vì nghiên cứu so các nhóm tuổi với nhau trong ba năm, nó chưa tách được đâu là do tuổi tác, đâu là do khác biệt thế hệ.

Kết luận về bước ngoặt đến từ ba nghiên cứu: vào ngành cảnh sát, chọn ngành học, và di cư <a class="ev ev-mid" href="#r-bardi2014" title="Bardi 2014 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="values-fit"><span class="num">15.4</span>Chọn chỗ làm hợp values thì được gì</h3>

Chọn được chỗ làm hợp với values của mình thì được gì? Bạn làm việc dễ chịu hơn và muốn ở lâu hơn, nhưng không tự nhiên giỏi lên.

**Hợp thì dễ chịu, chứ không làm mình giỏi hơn.** Hợp chỗ làm thì như cá gặp nước; lạc chỗ thì như cá mắc cạn, bơi giỏi đến đâu cũng khổ. Mức hợp giữa một người và nơi họ làm được gọi là person–organization fit, và values là một khía cạnh hay được đo. Tổng hợp hơn một trăm nghiên cứu cho thấy người hợp với tổ chức của mình hài lòng và gắn bó với công việc hơn rõ. Còn với hiệu suất làm việc, liên hệ rất yếu <a class="ev ev-high" href="#r-arthur2006" title="Arthur 2006 · Bằng chứng mạnh"></a>.

**Ở Đông Á, hợp với nhóm và sếp trực tiếp quan trọng hơn cả.** Một tổng hợp so sánh các nghiên cứu ở Đông Á, châu Âu và Bắc Mỹ. Ở Bắc Mỹ, hợp với tổ chức và với công việc quan trọng hơn tương đối. Ở Đông Á, **hợp với nhóm làm việc và với sếp trực tiếp** mới quan trọng hơn tương đối <a class="ev ev-mid" href="#r-oh2014" title="Oh 2014 · Bằng chứng vừa"></a>. Nghiên cứu không đo riêng Việt Nam, nhưng gợi ý một việc cụ thể <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: trước khi nhận một lời mời làm việc, hãy hỏi về nhóm mình sẽ vào và người quản lý trực tiếp kỹ không kém khi hỏi về sứ mệnh của nơi ấy.

<details><summary>Đọc thêm: các con số về person–organization fit</summary><div class="inner">

Ở sinh viên hai khoa có văn hoá khác nhau, một value có đi cùng cảm giác dễ chịu hay không tuỳ vào việc value ấy có khớp với không khí chung của khoa không <a class="ev ev-low" href="#r-sagiv2000" title="Sagiv &amp; Schwartz 2000 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Đây chỉ là một nghiên cứu nhỏ với 82 sinh viên, nhưng các tổng hợp lớn về công việc cũng chỉ về cùng một hướng.

Tổng hợp về person–organization fit gồm hơn 108.000 người. Liên hệ với chuyện nghỉ việc yếu hơn liên hệ với thái độ. Liên hệ với nghỉ việc và với hiệu suất còn dao động nhiều giữa các nơi, có chỗ gần như không có <a class="ev ev-high" href="#r-arthur2006" title="Arthur 2006 · Bằng chứng mạnh"></a>.

Nghiên cứu so sánh các châu lục gộp 96 nghiên cứu, xét theo mức gắn bó, hài lòng và ý định nghỉ việc. Châu Âu giống Bắc Mỹ nhưng ở mức thấp hơn. Các tác giả giải thích khác biệt ở Đông Á bằng văn hoá tập thể và khoảng cách quyền lực cao <a class="ev ev-mid" href="#r-oh2014" title="Oh 2014 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="values-exercise"><span class="num">15.5</span>Viết ra values có giúp gì không</h3>

Ngồi viết ra values có thật sự giúp gì không? Có, nếu bạn viết để đem ra dùng mỗi khi phải chọn. Không, nếu bạn mong nó tự nâng thành tích như một phép màu.

**Viết để dùng: có tác dụng, ở mức vừa phải.** Bài tập chỉ đơn giản là gọi tên điều mình coi trọng. Gộp nhiều thí nghiệm ngắn, bài tập này có tác dụng đo được so với nhóm không làm gì. Phần người tham gia được tự làm, qua một bài tập hay một ẩn dụ, có tác dụng lớn hơn phần chỉ ngồi nghe giảng <a class="ev ev-mid" href="#r-levin2012" title="Levin 2012 · Bằng chứng vừa"></a>.

**Viết như phép màu: đã thất bại.** Bài viết "tự khẳng định" 15–20 phút từng được kỳ vọng sẽ thu hẹp khoảng cách điểm số. Làm lại thì không thấy tác dụng <a class="ev ev-mid" href="#r-hanselman2017" title="Hanselman 2017 · Bằng chứng vừa"></a>, như [chương 8](#intrinsic) và [Phụ lục A](#myths) đã kể.

**Tờ values chỉ có giá trị khi được mở ra lúc phải chọn.** Mục tiêu xuất phát từ values thật của mình thì mình theo đuổi bền hơn <a class="ev ev-mid" href="#r-sheldon1999" title="Sheldon &amp; Elliot 1999 · Bằng chứng vừa"></a>. Còn một tờ values dán trên tường mà lúc phải chọn chẳng bao giờ nhìn tới thì cũng như đơn thuốc bác sĩ kê rồi cất trong ngăn kéo, chẳng bao giờ mua <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: bằng chứng về bài tập values</summary><div class="inner">

Tổng hợp kia gộp 66 thí nghiệm ngắn trong phòng lab <a class="ev ev-mid" href="#r-levin2012" title="Levin 2012 · Bằng chứng vừa"></a>.

Trong một thử nghiệm ngẫu nhiên với 181 sinh viên đang căng thẳng, riêng phần "values và hành động cam kết" của một chương trình trị liệu trực tuyến đã hiệu quả gần bằng cả chương trình. Phần chỉ dạy chấp nhận cảm xúc thì kém hơn một chút <a class="ev ev-mid" href="#r-levin2020" title="Levin 2020 · Bằng chứng vừa"></a>.

Cả hai nghiên cứu đều đến từ cùng một nhóm tác giả, trên mẫu nhỏ.

</div></details>

<h3 id="find-values"><span class="num">15.6</span>Cách tìm và xếp hạng values của mình</h3>

Làm sao tìm ra values của chính mình? Đi qua bốn bước dưới đây. Cuối cùng, thứ bạn cầm trong tay là **một danh sách ngắn, có thứ tự**, không phải một danh sách dài những điều tốt đẹp. Đây là phương pháp của cuốn sách <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>, ghép từ các kết quả ở trên.

1. **Nhìn hành vi trước, ý muốn sau.** Từ bốn tuần gần nhất, ghi ra ba việc mình làm khi không ai bắt, và ba thứ mình tiêu tiền vào mà không tiếc ([§15.2](#values-in-action)).
2. **Đặt chúng lên vòng tròn.** Mỗi việc thể hiện value nào trong mười value? Rồi chọn thêm trên vòng tròn những value mình *muốn* sống theo nhiều hơn. Để ý các cặp đối diện: chọn cả hai phía nghĩa là sẽ có lúc giằng xé, nên cần một thứ tự rõ ràng ([§15.1](#value-circle)).
3. **Xếp hạng bằng cách so từng cặp.** Với hai value bất kỳ, tự hỏi: *"Nếu bị buộc phải chọn một, mình chọn cái nào?"* Chỉ thứ tự có được từ những câu hỏi khó như vậy mới dùng làm tie-breaker được, tức thứ để phân xử khi hai lựa chọn ngang nhau.
4. **Viết mỗi value thành một câu hành động.** "Gắn kết với gia đình" là một ý tưởng. "Tối Chủ nhật ăn cơm với bố mẹ, không cầm điện thoại" là value đã thành hành động. Từ câu hành động, ta bước thẳng sang [chương 16](#life-principles).

Ví dụ minh hoạ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: Minh, 27 tuổi, dạy tiếng Anh ở một trường cấp hai. Bốn tuần qua, tối nào Minh cũng tự tìm đọc thêm về cách dạy cho học sinh dễ nhớ, cuối tuần đi đá bóng với bạn cũ, mua sách không tiếc tiền. Đặt lên vòng tròn, Minh thấy *self-direction* (học theo ý mình), *benevolence* (bạn cũ) và *achievement* (muốn giỏi). Thứ Minh muốn có thêm là *security*: một quỹ dự phòng, vì mẹ hay ốm.

Khi so từng cặp, Minh thấy giữa "nhanh có tiếng trong nghề" (*achievement*) và "có mặt khi mẹ cần" (*benevolence*), mình chọn cái sau. Thứ tự cuối cùng: benevolence → self-direction → security → achievement. Ba tháng sau, một trường ở thành phố khác mời Minh với mức lương cao hơn nhiều. Minh không phải cân nhắc lại từ đầu, vì bảng thứ tự đã có câu trả lời từ trước: ở gần mẹ quan trọng hơn lương, trừ khi tìm được cách giữ cả hai.

<div class="callout data"><div class="ct">Tự kiểm tra: values thật trong bốn tuần của bạn</div>

Tối Chủ nhật này, mở lịch và sao kê tài khoản của bốn tuần vừa qua. Ghi vào ghi chú điện thoại hai danh sách ngắn: các buổi tối sau giờ làm thật ra đã dành cho việc gì (mỗi việc bao nhiêu tối), và ba khoản chi bạn không hề tiếc. Gắn mỗi dòng với một value trên vòng tròn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Rồi viết riêng ba values bạn *nghĩ* mình coi trọng nhất. Nếu hai bên khớp nhau, bạn đang sống đúng như mình nói. Nếu một value bạn tự nhận là quan trọng mà suốt bốn tuần không có nổi một tối, thì đó là value của con người bạn muốn trở thành. Value ấy đáng giữ, nhưng phải dành cho nó một chỗ trong lịch <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div>

<div class="recall">

**Câu hỏi nhớ lại — chương 15.**

<details><summary>Vì sao một người có thể thấy "giằng xé" dù cả hai lựa chọn đều tốt?</summary><div class="inner">

Vì hai lựa chọn phục vụ hai value ngồi đối diện nhau trên vòng tròn Schwartz — chiều value này thường phải trả giá bằng value kia (Schwartz 2012). Giằng xé là dấu hiệu mình cần một thứ tự, không phải dấu hiệu mình yếu đuối.

</div></details>

<details><summary>Muốn biết mình thật sự coi trọng gì, nhìn vào đâu? Vì sao không nhìn vào chuyện mình có chào hàng xóm, có đi mừng cưới?</summary><div class="inner">

Nhìn vào những việc mình làm khi không ai bắt. Những việc xã hội mặc định ai cũng phải làm thì ai cũng làm, bất kể values, nên chúng ít nói lên điều gì (Bardi & Schwartz 2003 gợi ý như vậy); value càng quan trọng với mình thì càng lộ ra trong hành vi (Lee 2022).

</div></details>

<details><summary>(Nhớ lại chương 8 và chương 2.) Mục tiêu ngoại tại và "hành vi đến từ tình huống" liên quan gì tới việc viết ra values?</summary><div class="inner">

Mục tiêu nội tại đi cùng well-being cao hơn mục tiêu ngoại tại (Kasser & Ryan 1996), nên khi xếp hạng values, hãy để ý xem mình có đang đặt hình ảnh, tiền, danh tiếng lên trên những thứ nội tại không. Và vì hành vi đi theo tình huống, một value chỉ thành hiện thực khi mình viết nó thành câu hành động gắn với một tình huống cụ thể.

</div></details>

<details><summary>Ở Đông Á, khi chọn chỗ làm, kiểu "hợp" nào quan trọng tương đối hơn?</summary><div class="inner">

Hợp với nhóm làm việc và sếp trực tiếp (Oh 2014). Và nhìn chung, hợp với tổ chức (person–organization fit) liên quan tới mức hài lòng, gắn bó nhiều hơn là tới hiệu suất (Arthur 2006).

</div></details>

</div>

<h2 id="life-principles"><span class="num">16</span>Principles: biến values thành luật sống</h2>

Values cho biết hướng đi; principles là những luật cụ thể rút ra từ hướng ấy. Mấu chốt nằm ở chỗ principles được quyết **từ trước**, lúc đầu óc bình tĩnh, để dùng vào những lúc không bình tĩnh. Đây chính là lời giải cho hot–cold empathy gap ở [chương 2](#cold-hot): con người lúc "cold" đặt luật cho con người lúc "hot". Giống như bố mẹ dặn con từ trước: "người lạ cho kẹo thì không lấy". Tới lúc có người chìa kẹo ra, đứa trẻ không phải nghĩ nữa <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="three-levels"><span class="num">16.1</span>Ba tầng: value, principle, bright line</h3>

Một luật sống khác một value ở đâu, và khi nào cần một luật tuyệt đối? Value là hướng đi, principle là luật cụ thể có thể có ngoại lệ, còn bright line là lằn ranh không bao giờ bàn lại. Bright line chỉ dành cho vài điều mà sai một lần là trả giá nặng.

| Tầng | Là gì | Chuyện ăn ở | Chuyện tiền bạc |
|---|---|---|---|
| Value | Điều mình coi trọng, một hướng đi | Trung thực | Sống không nợ nần |
| Principle | Luật dùng cho nhiều tình huống, có thể có ngoại lệ nếu đã cân nhắc kỹ | Không nói điều mình biết là sai để kiếm lợi | Món nào trên hai triệu thì để qua một đêm rồi mới mua <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span> |
| Bright line | Lằn ranh tuyệt đối, quyết một lần, không bàn lại lúc nóng | Không bao giờ ký giấy tờ mình chưa đọc | Không bao giờ đứng tên vay hộ người khác <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span> |

Bright line quý ở chỗ **không tốn sức quyết định**. Mình không phải cân nhắc lại "lần này có nên không", nên lúc mệt hay lúc bị cám dỗ cũng chẳng còn kẽ hở nào để tự thuyết phục mình <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Người đã đặt luật "đã uống rượu bia thì không lái xe" không phải tính lại mỗi lần cụng ly xem "mới hai lon thì chắc không sao" <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Đổi lại, bright line rất cứng nhắc. Vì vậy chỉ nên dành nó cho vài điều mà sai một lần là trả giá nặng: mất lòng tin, mất món tiền lớn, mất sức khoẻ.

<h3 id="structure-not-reminders"><span class="num">16.2</span>Luật phải nằm trong tình huống, không nằm trên khẩu hiệu</h3>

Bạn đoán xem: trước một bài kiểm tra có thể gian lận, nếu người ta được yêu cầu nhớ lại Mười Điều Răn, họ có gian lận ít hơn không? Gần như không. Lời nhắc đạo đức yếu hơn ta tưởng nhiều; luật chỉ giữ được khi nó nằm ngay trong tình huống.

**Lời nhắc và chữ ký cam kết đều không qua được kiểm tra lại.** Một nghiên cứu năm 2008 từng trả lời câu hỏi trên là có. Rồi 25 phòng thí nghiệm cùng làm lại theo đúng một quy trình, và thấy tác dụng gần như bằng không <a class="ev ev-high" href="#r-verschuere2018" title="Verschuere 2018 · Bằng chứng mạnh"></a>. Ký cam kết trung thực ở **đầu** tờ khai thay vì ở cuối cũng không khiến người ta trung thực hơn <a class="ev ev-high" href="#r-kristal2020" title="Kristal 2020 · Bằng chứng mạnh"></a>. Bài báo gốc về cách ký này sau đó đã bị rút <a class="ev ev-high" href="#r-shu2012retraction" title="PNAS 2021 · Bằng chứng mạnh"></a>.

**Lời dặn và ổ khoá.** Có một hình ảnh trong nhà khớp đúng với kết quả này <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Muốn đứa nhỏ không mở tủ thuốc, có hai cách: dặn "con không được mở tủ thuốc", hoặc lắp khoá vào tủ. Lời dặn giống lời nhắc đạo đức: muốn có tác dụng thì đứa nhỏ phải nhớ ra, và phải muốn nghe lời, đúng vào lúc ấy. Ổ khoá là thiết kế tình huống: muốn mở cũng không mở được.

**Principles của đời mình cũng cần ở dạng ổ khoá.** Hãy gắn chúng vào lịch, vào tài khoản ngân hàng, vào cách sắp xếp nhà cửa, vào những người mình đã nói ra ([chương 2](#situation)). Đừng để chúng nằm trên một tờ giấy chờ mình nhớ ra.

<details><summary>Đọc thêm: hai lần kiểm tra lại</summary><div class="inner">

Nghiên cứu năm 2008 thấy tác dụng khá rõ. Lần làm lại của 25 phòng thí nghiệm theo một quy trình đã công bố trước, trên gần sáu nghìn người: tác dụng gần như bằng không, thậm chí hơi ngược chiều <a class="ev ev-high" href="#r-verschuere2018" title="Verschuere 2018 · Bằng chứng mạnh"></a>.

Ký ở đầu tờ khai là một ý tưởng từng được cơ quan nhà nước đem ra dùng thật. Sáu nghiên cứu với gần 5.800 người không thấy nó khiến người ta trung thực hơn <a class="ev ev-high" href="#r-kristal2020" title="Kristal 2020 · Bằng chứng mạnh"></a>. Bài báo gốc năm 2012 bị rút vào năm 2021 <a class="ev ev-high" href="#r-shu2012retraction" title="PNAS 2021 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="commitment-cost"><span class="num">16.3</span>Tự trói tay mình có tác dụng, nhưng buộc lỏng thì hại thêm</h3>

Tự đặt ra một hình phạt cho mình có giúp giữ luật không? Có, nhưng chỉ khi dây trói đủ chắc. Buộc lỏng thì bạn vẫn phá luật, mà còn mất thêm tiền phạt.

Trước khi đi nhậu, đưa chìa khoá xe cho một người bạn không uống giữ: lúc đã ngà ngà, có muốn tự lái về cũng không được. Đó là **commitment device** — quyết từ lúc tỉnh táo, rồi khoá lựa chọn lại để lúc bị cám dỗ không còn gì để quyết lại; mạnh hơn nữa là tự đặt ra một hệ quả thật nếu mình phá luật. Đây là cách mạnh nhất để biến một principle từ lời dặn thành ổ khoá.

**Có tác dụng thật.** Người hút thuốc được mời gửi tiền vào một tài khoản: sáu tháng sau mà sạch nicotine thì nhận lại, không thì số tiền ấy đem đi làm từ thiện. Rất ít người nhận lời. Dù vậy, tính trên tất cả những người được mời, tỷ lệ bỏ thuốc thành công vẫn tăng, và kết quả vẫn còn sau một năm <a class="ev ev-mid" href="#r-gine2010" title="Giné, Karlan &amp; Zinman 2010 · Bằng chứng vừa"></a>.

**Buộc lỏng thì hại thêm.** Ở một tài khoản tiết kiệm có cam kết, người dùng tự chọn kế hoạch và tự chọn mức phạt. Trung bình số tiền tiết kiệm tăng mạnh, nhưng **55%** người tham gia vỡ kế hoạch và mất tiền phạt. Có lẽ họ đã chọn mức phạt quá nhẹ, không đủ sức ngăn chính mình <a class="ev ev-mid" href="#r-john2020" title="John 2020 · Bằng chứng vừa"></a>.

**Hoặc thật nhỏ, hoặc thật chắc** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Một luật có hệ quả thật thì mạnh hơn một lời hứa suông. Nhưng luật phải đủ nhỏ để chắc chắn giữ được, hoặc đủ mạnh để không phá nổi; lửng lơ ở giữa là tệ nhất. Giống rào vườn rau: rào thấp lưng chừng thì gà vẫn nhảy vào, mình chỉ tốn thêm công rào.

**Ví dụ minh hoạ: biến "tối nào cũng luyện nghe" từ lời dặn thành ổ khoá** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

1. *Tình huống.* Bạn tự hứa tối nào về nhà cũng nghe 30 phút podcast tiếng Anh. Tuần đầu ổn. Sang tuần thứ hai, ba tối liền bạn về tới nhà mệt rã, mở YouTube "nghỉ năm phút", ngẩng lên đã 22:00.
2. *Cơ chế đoán trước điều gì.* Lời hứa đặt ra lúc "cold" (Chủ nhật, thong thả) nhưng phải thực hiện lúc "hot" (vừa về tới nhà, vừa đói vừa mệt). Đó mới là lời dặn, chưa phải ổ khoá: muốn có tác dụng, nó cần đúng lúc ấy bạn còn nhớ và còn muốn.
3. *Bạn làm gì.* Bạn dời việc nghe sang chỗ không cần quyết. Tối hôm trước tải sẵn một tập, tai nghe để luôn trong túi. Sáng bước ra khỏi nhà là bấm nghe, chiều tan làm là bấm nghe tiếp. Hai quãng đi bộ mười phút đã thành hai mươi phút luyện nghe; mười phút còn lại bạn nghe nốt ngay khi vừa vào nhà, lúc tai nghe vẫn còn trên tai. Thêm một hệ quả nhỏ mà chắc chắn giữ được: hẹn với một người bạn cùng học rằng cuối tuần hai người sẽ kể cho nhau một chuyện nghe được trong tuần.
4. *Kết quả.* Tối về tới nhà, câu hỏi "có nghe không" gần như không còn, vì hai phần ba đã xong trên đường. Luật đủ nhỏ để giữ, và hệ quả đủ thật: một buổi hẹn mà bạn không muốn tới tay không.

<details><summary>Đọc thêm: các con số về commitment device, và mẹo "tôi không làm"</summary><div class="inner">

Trong nghiên cứu về thuốc lá, chỉ **11%** người được mời nhận lời. Tính trên tất cả những người được đề nghị, tỷ lệ bỏ thuốc thành công sau sáu tháng tăng 3 điểm phần trăm, và kết quả vẫn còn khi kiểm tra bất ngờ sau 12 tháng <a class="ev ev-mid" href="#r-gine2010" title="Giné, Karlan &amp; Zinman 2010 · Bằng chứng vừa"></a>.

Tài khoản tiết kiệm có khoá ở [chương 10](#saving) là một ví dụ thành công <a class="ev ev-mid" href="#r-ashraf2006" title="Ashraf, Karlan &amp; Yin 2006 · Bằng chứng vừa"></a>.

Còn mẹo nói "tôi không làm X" thay vì "tôi không thể làm X": câu trước nghe như nói về con người mình, câu sau như một lệnh cấm từ bên ngoài. Mẹo này chỉ dựa trên một bài báo gồm bốn nghiên cứu nhỏ của cùng hai tác giả, và chưa ai làm lại độc lập <a class="ev ev-low" href="#r-patrick2012" title="Patrick &amp; Hagtvedt 2012 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Thấy hợp thì cứ thử, nhưng đừng trông vào một câu nói để giữ luật thay mình.

</div></details>

<h3 id="write-principles"><span class="num">16.4</span>Viết một principle tốt</h3>

Một principle tốt trông thế nào? Nó gắn với một value, có tình huống kích hoạt rõ ràng, và bạn chỉ có vài cái. Bạn sửa nó ở buổi xem lại định kỳ, không sửa giữa lúc đang muốn phá. Đây là phương pháp <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>, ghép từ các chương trước:

1. **Mỗi principle gắn với một value** đã xếp hạng ở [§15.6](#find-values). Principle nào không có value đứng sau thì là luật của người khác.
2. **Có tình huống kích hoạt rõ ràng**, như implementation intention ở [§2.4](#situation): "Khi ai đó nhờ mình ký xác nhận, mình đọc hết rồi mới ký."
3. **Ít thôi.** Theo đuổi quá nhiều thay đổi hành vi cùng lúc thì hiệu quả kém đi <a class="ev ev-high" href="#r-wilson2015" title="Wilson 2015 · Bằng chứng mạnh"></a>. Năm đến bảy principles và một hai bright lines là đủ cho một cuộc sống bận rộn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.
4. **Chỉ sửa luật ở buổi xem lại, không sửa giữa cơn cám dỗ.** Đây cũng là nguyên tắc của chuyện buông mục tiêu ở [§11.5](#let-go): quyết đổi luật lúc bình tĩnh, không phải lúc đang muốn phá luật.

Ví dụ minh hoạ: Minh ở chương 15 có value đứng đầu là benevolence (có mặt cho gia đình) và value thứ ba là security.

- Principle 1: *"Tối Chủ nhật ăn cơm với bố mẹ; nếu phải làm thêm, làm vào sáng thứ Bảy."*
- Principle 2: *"Mỗi lần nhận lương, chuyển 15% vào tài khoản dự phòng trước khi tiêu"*, một default tự động như ở [§10.3](#saving).
- Bright line: *"Không vay tiêu dùng để mua thứ không cần cho sức khoẻ hay công việc."*

Một hôm, một người bạn rủ Minh vay tiền góp vốn vào một dự án "chắc ăn". Minh không phải đắn đo giữa lúc đang hào hứng, vì bright line đã quyết từ trước.

<div class="callout data"><div class="ct">Tự kiểm tra: luật của bạn là lời dặn hay ổ khoá?</div>

Chọn một principle bạn đang cố giữ, ví dụ "không lướt điện thoại sau 23:00" hay "mỗi ngày nghe tiếng Anh 30 phút". Trong một tuần, mỗi lần gặp đúng tình huống đó, ghi một dòng vào điện thoại: mấy giờ, giữ hay phá, lúc ấy mình đang thế nào (mệt, đói, chán, bình thường) <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Cuối tuần nhìn lại. Nếu phần lớn các lần phá rơi vào lúc mệt vừa đi làm về, luật của bạn vẫn đang là lời dặn: nó đòi bạn nhớ và muốn đúng vào lúc khó nhất. Hãy đưa luật vào tình huống, như để sạc điện thoại ngoài phòng ngủ hay cài sẵn bài nghe, thay vì tự hứa quyết tâm hơn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div>

<div class="recall">

**Câu hỏi nhớ lại — chương 16.**

<details><summary>Principle khác bright line ở điểm nào, và khi nào nên dùng bright line?</summary><div class="inner">

Principle dùng cho nhiều tình huống và có thể có ngoại lệ nếu đã cân nhắc kỹ; bright line là lằn ranh tuyệt đối, không bàn lại lúc nóng. Dùng bright line cho vài điều mà sai một lần là trả giá nặng.

</div></details>

<details><summary>Vì sao một khẩu hiệu đạo đức hay một chữ ký cam kết không đủ để giữ principle?</summary><div class="inner">

Vì khi kiểm tra nghiêm ngặt, những lời nhắc như vậy không có tác dụng: nhớ lại Mười Điều Răn gần như không đổi được gì khi 25 phòng thí nghiệm làm lại (Verschuere 2018); ký ở đầu tờ khai cũng không (Kristal 2020), và bài gốc đã bị rút năm 2021. Luật cần nằm ngay trong tình huống, như ổ khoá chứ không như lời dặn.

</div></details>

<details><summary>(Nhớ lại chương 2.) Principles giải quyết vấn đề nào trong hot–cold empathy gap?</summary><div class="inner">

Lúc "cold", ta đánh giá thấp sức chi phối của trạng thái "hot". Principle là quyết định đưa ra lúc cold, để con người lúc hot khỏi phải quyết lại.

</div></details>

<details><summary>Một commitment device có thể làm hại mình thế nào?</summary><div class="inner">

Khi ràng buộc quá lỏng, mình vẫn phá luật mà còn chịu thêm phạt — 55% người tham gia một tài khoản tiết kiệm cam kết đã vỡ kế hoạch và mất tiền (John 2020).

</div></details>

</div>

<h2 id="ethics"><span class="num">17</span>Đạo đức và nhân cách</h2>

[Chương 4 và 5](#impressions) nói về lòng tin giữa người với người và cách hàn gắn khi lòng tin bị tổn hại. Chương này đi sâu thêm một bước. Vì sao người bình thường lúc trung thực lúc không? Điều gì khiến một người tốt không giữ được mình? Niềm tin nào chỉ là niềm tin suông? Và nên làm gì sau khi mình sai?

<h3 id="mostly-honest"><span class="num">17.1</span>Con người trung thực hơn ta nghĩ</h3>

Bạn đoán xem: một chiếc ví đánh rơi có nhiều tiền hơn thì dễ được trả lại hơn, hay khó hơn? Dễ hơn. Phần lớn con người trung thực hơn những gì người hay hoài nghi vẫn nghĩ.

**Ví càng nhiều tiền càng dễ được trả lại.** Các nhà nghiên cứu đem hơn 17.000 chiếc ví giả làm "nhặt được" tới quầy lễ tân ở 40 nước. Gần như ở nước nào, ví **càng nhiều tiền càng dễ được trả lại**, ngược hẳn với dự đoán của cả người thường lẫn các nhà kinh tế <a class="ev ev-high" href="#r-cohn2019" title="Cohn 2019 · Bằng chứng mạnh"></a>. Các tác giả giải thích bằng lòng vị tha và mong muốn không phải tự thấy mình là kẻ trộm: tiền càng nhiều, giữ lại càng rõ là ăn cắp.

**Có nói dối cũng không ai biết, mà phần đông vẫn không nói dối.** Trong một kiểu thí nghiệm khác, người tham gia tự gieo xúc xắc ở chỗ không ai thấy rồi tự báo kết quả. Số càng cao, tiền nhận càng nhiều. Gộp các nghiên cứu kiểu này, con người nói dối "ít đến bất ngờ". Nhiều người có cơ hội gian lận cũng không gian lận hết mức có thể <a class="ev ev-high" href="#r-abeler2019" title="Abeler, Nosenzo &amp; Raymond 2019 · Bằng chứng mạnh"></a>.

**Hệ quả** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: phần lớn chúng ta không cần ai "cải tạo". Chỉ cần vài thói quen nhỏ che chắn cho sự trung thực sẵn có vào những lúc dễ lỡ bước, và chương này nói về đúng những lúc ấy.

<details><summary>Đọc thêm: các con số về ví và xúc xắc</summary><div class="inner">

Thí nghiệm ví trải trên 355 thành phố thuộc 40 nước <a class="ev ev-high" href="#r-cohn2019" title="Cohn 2019 · Bằng chứng mạnh"></a>. Bảng xếp hạng giữa các nước thì còn tranh cãi: ở Trung Quốc, đếm số ví thật sự được trả lại cho thấy mức trung thực cao hơn nhiều so với đếm số email trả lời <a class="ev ev-mid" href="#r-yang2023" title="Yang 2023 · Bằng chứng vừa"></a>.

Tổng hợp về xúc xắc gộp 90 nghiên cứu <a class="ev ev-high" href="#r-abeler2019" title="Abeler, Nosenzo &amp; Raymond 2019 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="slipping"><span class="num">17.2</span>Khi nào người tốt không giữ được mình</h3>

Khi nào một người vốn tử tế lại làm điều sai? Thường là khi nạn nhân không có khuôn mặt, và khi trong đầu có sẵn một câu tự bào chữa. Nhận ra hai thứ này đúng lúc là đủ để dừng lại.

**Nạn nhân không có khuôn mặt.** Khi lời nói dối chỉ hại một thứ trừu tượng, như ngân sách của người làm thí nghiệm hay một công ty, người phải quyết vội dưới áp lực thời gian nói dối nhiều hơn. Khi nạn nhân là một người cụ thể, khác biệt này biến mất <a class="ev ev-mid" href="#r-kobis2019" title="Köbis 2019 · Bằng chứng vừa"></a>. Khai bớt tuổi con để mua vé trẻ em ở khu vui chơi, hay đi xe buýt mà lờ đi không mua vé, nghe vô hại, vì "khu vui chơi", "công ty xe buýt" không có khuôn mặt. Trước khi quyết vội, hãy hình dung người cụ thể sẽ gánh hậu quả: cô bán vé cuối ca phải bù tiền thiếu, đứa con đang đứng cạnh nghe bố mẹ khai gian <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

**Những câu tự bào chữa.** Bandura gọi chúng là moral disengagement: những cơ chế giúp người tử tế làm điều có hại mà vẫn thấy lòng mình yên <a class="ev ev-mid" href="#r-bandura1999" title="Bandura 1999 · Bằng chứng vừa"></a>. Trong đầu, chúng vang lên thành những câu rất quen: *"ai cũng làm thế"*, *"có tí thôi mà"*, *"người ta bảo làm thế"*, *"đáng đời họ"* <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Những câu này không vô hại. Ở trẻ và thiếu niên, moral disengagement đi cùng hành vi gây hấn ở mức vừa phải <a class="ev ev-mid" href="#r-gini2014" title="Gini 2014 · Bằng chứng vừa"></a>. Cách dùng thực tế <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: tập nhận ra chính những câu ấy khi chúng vừa vang lên. Chính chúng giúp mình lờ đi tiếng lương tâm trước một việc sai.

**Ví dụ minh hoạ: bán chiếc xe máy cũ** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

1. *Tình huống.* Bạn đăng bán chiếc xe máy cũ lên một hội mua bán trên mạng. Mùa mưa năm ngoái xe từng bị ngập nước một lần, đã sửa xong, giờ chạy vẫn êm. Tới dòng "xe đã từng ngập nước chưa?", chỉ cần gõ "chưa".
2. *Cơ chế đoán trước điều gì.* Ba thứ đang cùng đẩy về một phía: thời gian gấp (đã có người hỏi mua, bạn muốn bán cho xong trước Tết), nạn nhân không có khuôn mặt ("người mua nào đó trên mạng"), và một câu tự bào chữa sắp vang lên: *"ai bán xe chẳng giấu, mà sửa rồi thì có sao đâu"*.
3. *Bạn làm gì.* Bạn nhận ra đúng câu ấy khi nó vừa xuất hiện, và đặt một khuôn mặt vào chỗ "người mua nào đó": một cậu sinh viên gom góp mãi mới đủ tiền mua xe đi học, đến mùa mưa xe chết máy giữa đoạn đường ngập. Bạn ghi thẳng: "Xe từng ngập nước một lần, đã sửa ở tiệm, chạy bình thường."
4. *Kết quả.* Có thể bạn phải bớt giá một chút, và hơi tiếc. Đổi lại, sẽ không có cuộc gọi trách móc nào giữa mùa mưa, và những gì bạn nói về chiếc xe, người mua tin ngay.

**Lún dần qua từng bước nhỏ.** Có bằng chứng rằng những lời nói dối vì lợi cho mình lớn dần khi lặp lại <a class="ev ev-low" href="#r-garrett2016" title="Garrett 2016 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Đúng là mưa dầm thấm lâu: mỗi lần một chút, áy náy nhạt dần, đến lúc nhìn lại mới giật mình. Vậy nên hãy coi lời nói dối nhỏ đầu tiên là một quyết định thật <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>, vì lặp lại nhiều lần thì áy náy cũng nhạt dần.

**Hay sa chân một lần.** Một loạt thí nghiệm khác lại thấy người ta *dễ nhận* một khoản hối lộ lớn khi được đề nghị thẳng một lần hơn là khi bị dắt qua nhiều bước nhỏ <a class="ev ev-low" href="#r-kobis2017" title="Köbis 2017 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Cả hai hướng đều dựa trên nghiên cứu nhỏ. Cách hiểu an toàn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: đừng nghĩ mình an toàn chỉ vì chưa từng sai một bước nhỏ nào. Một cám dỗ lớn ập tới bất ngờ cũng cần dừng lại cân nhắc y như vậy.

<details><summary>Đọc thêm: gian lận phụ thuộc vào đâu, và các câu tự bào chữa</summary><div class="inner">

Gộp 565 thí nghiệm với hơn 44.000 lựa chọn, người ta thấy gian lận phụ thuộc cả tình huống, như phần thưởng lớn cỡ nào hay lời nói dối có hại ai không, lẫn con người. Trong phòng lab, người ta gian lận nhiều hơn ngoài đời thật <a class="ev ev-high" href="#r-gerlach2019" title="Gerlach 2019 · Bằng chứng mạnh"></a>.

Với nạn nhân không có khuôn mặt, người quyết vội nói dối nhiều hơn cả về số người lẫn mức độ <a class="ev ev-mid" href="#r-kobis2019" title="Köbis 2019 · Bằng chứng vừa"></a>. Nghiên cứu nổi tiếng "trung thực cần thời gian" thì không lặp lại được <a class="ev ev-mid" href="#r-vandercruyssen2020" title="Van der Cruyssen 2020 · Bằng chứng vừa"></a>.

Đi siêu thị cũng vậy <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: siêu thị tính nhầm, thối thừa cho mình năm mươi nghìn, im lặng cầm về dễ hơn nhiều so với rút năm mươi nghìn từ ví người bán hàng, dù bản chất y như nhau.

Bandura liệt kê các cơ chế moral disengagement: biện minh rằng việc ấy phục vụ mục đích tốt, nói giảm nói tránh, so mình với người còn tệ hơn, đẩy trách nhiệm cho người ra lệnh hay cho tập thể, coi nhẹ hậu quả, đổ lỗi cho nạn nhân, và coi nạn nhân như không phải con người (dehumanization) <a class="ev ev-mid" href="#r-bandura1999" title="Bandura 1999 · Bằng chứng vừa"></a>.

Kết quả về hành vi gây hấn đến từ trẻ 8–18 tuổi, qua 27 mẫu với gần mười tám nghìn em <a class="ev ev-mid" href="#r-gini2014" title="Gini 2014 · Bằng chứng vừa"></a>. Ở nơi làm việc, moral disengagement đi kèm hành vi sai trái. Theo một phân tích trên dữ liệu tương quan, chuyện ấy diễn ra qua ba bước: người ta kém nhận ra sự việc có dính tới đạo đức, phán xét đúng sai dễ dãi hơn, và ít lường trước cảm giác tội lỗi hơn <a class="ev ev-mid" href="#r-ogunfowora2022" title="Ogunfowora 2022 · Bằng chứng vừa"></a>.

Trong nghiên cứu về nói dối lớn dần, amygdala phản ứng ngày càng yếu trước chính lời nói dối ấy <a class="ev ev-low" href="#r-garrett2016" title="Garrett 2016 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Một nghiên cứu khác thấy những vi phạm nhỏ mở đường cho vi phạm lớn hơn <a class="ev ev-low" href="#r-welsh2015" title="Welsh 2015 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Nhóm nghiên cứu hối lộ tóm lại kết quả của họ: "a steep cliff rather than a slippery slope" <a class="ev ev-low" href="#r-kobis2017" title="Köbis 2017 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

</div></details>

<h3 id="no-charms"><span class="num">17.3</span>Những cách tưởng có tác dụng mà không</h3>

Có cách nào gột sạch một việc sai, hay tự nhắc mình để tốt hơn không? Ba niềm tin phổ biến về chuyện này đều không còn đúng khi đem kiểm tra lại.

- **Lời nhắc và chữ ký cam kết.** Đã nói ở [§16.2](#structure-not-reminders) <a class="ev ev-high" href="#r-verschuere2018" title="Verschuere 2018 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-kristal2020" title="Kristal 2020 · Bằng chứng mạnh"></a>.
- **"Rửa tay là rửa được tội lỗi."** Ý tưởng làm điều sai xong thì muốn rửa tay, rửa xong thì nhẹ lòng, không lặp lại được ở các phòng thí nghiệm độc lập <a class="ev ev-high" href="#r-siev2018" title="Siev 2018 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-earp2014" title="Earp 2014 · Bằng chứng mạnh"></a>. Chương này không tìm thấy bằng chứng vững nào cho thấy một nghi thức như tắm rửa, quyên góp hay một lời cầu nguyện gột được một việc sai khỏi lương tâm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. [§17.5](#after-wrong) gợi ý một hướng khác: sửa chính tác hại mình gây ra.
- **"Làm việc tốt rồi thì được phép buông."** Ý tưởng này gọi là moral licensing. Khi trừ đi phần thổi phồng do publication bias (nghiên cứu có kết quả "đẹp" thì dễ được đăng hơn), tác dụng chỉ còn rất nhỏ hoặc biến mất <a class="ev ev-low" href="#r-kuper2019" title="Kuper &amp; Bott 2019 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Không cần ngại làm việc tốt, và cũng đừng lấy việc tốt làm cái cớ.

<details><summary>Đọc thêm: chi tiết các lần kiểm tra lại</summary><div class="inner">

Kết quả gốc về rửa tay công bố năm 2006. Gộp 15 nghiên cứu, tác dụng chung chỉ nhỏ, và ở các phòng thí nghiệm độc lập thì gần như bằng không <a class="ev ev-high" href="#r-siev2018" title="Siev 2018 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-earp2014" title="Earp 2014 · Bằng chứng mạnh"></a>.

Các tổng hợp cũ về moral licensing thấy tác dụng ở mức vừa phải. Mức còn lại sau khi trừ phần thổi phồng tuỳ vào cách tính <a class="ev ev-low" href="#r-kuper2019" title="Kuper &amp; Bott 2019 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Một lần làm lại đã công bố quy trình trước, với 932 người, không thấy gì <a class="ev ev-mid" href="#r-xiao2024" title="Xiao 2024 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="character-real"><span class="num">17.4</span>Nhân cách có thật</h3>

Ngoài tình huống, bản thân con người có khác nhau không? Có. Đặt hai người khác nhau vào cùng một chỗ dễ gian lận, họ vẫn không làm giống nhau.

**Honesty-Humility.** Đặc điểm tính cách này gồm chân thành, công bằng, khiêm tốn, không tham. Người có Honesty-Humility cao ít gian lận hơn hẳn, kể cả khi đã tính đến các đặc điểm tính cách khác và đến tình huống <a class="ev ev-high" href="#r-heck2018" title="Heck 2018 · Bằng chứng mạnh"></a>.

**Nhìn chuyện nhỏ để đoán chuyện lớn** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Người sòng phẳng trong chuyện nhỏ, như chia hoá đơn rõ ràng hay trả lại tiền thừa, nhiều khả năng cũng ít lợi dụng người khác khi có cơ hội. Cách một người xử lý lỗi nhỏ của chính họ, như đến trễ một buổi hẹn rồi nhận là mình đi muộn hay đổ hết cho kẹt xe, nói lên nhiều điều hơn những lời hay ý đẹp. Điều này đáng để ý khi chọn bạn đời, bạn thân và bạn làm ăn.

<details><summary>Đọc thêm: nhân cách, lòng tốt và well-being</summary><div class="inner">

Kết quả về Honesty-Humility đến từ phân tích lại 16 nghiên cứu với hơn năm nghìn người, và vẫn đúng khi đã tính đến tuổi, giới tính <a class="ev ev-high" href="#r-heck2018" title="Heck 2018 · Bằng chứng mạnh"></a>.

Gộp 770 nghiên cứu, những đặc điểm tính cách đoán được ai hay giúp người khác phần lớn là những đặc điểm liên quan tới chuyện *có lợi dụng người khác khi có cơ hội hay không*, dù mức đoán trúng đều khiêm tốn <a class="ev ev-high" href="#r-thielmann2020" title="Thielmann 2020 · Bằng chứng mạnh"></a>.

Nhân cách cũng gắn với việc sống tốt. Qua 130 nghiên cứu với hơn 275.000 người, những phẩm chất đi cùng well-being rõ nhất là hope (hy vọng), zest (sự hăng hái sống), gratitude (biết ơn), love (khả năng yêu thương và được yêu thương) và curiosity (tò mò). Humility là phẩm chất duy nhất không có liên hệ đáng kể <a class="ev ev-mid" href="#r-casali2025" title="Casali &amp; Feraco 2025 · Bằng chứng vừa"></a>. Nên hiểu dè dặt: đây là dữ liệu tương quan, và hope, zest phần nào trùng nghĩa với chính well-being.

</div></details>

<h3 id="after-wrong"><span class="num">17.5</span>Sau khi làm sai: guilt và shame</h3>

Sau khi làm sai, nên nghĩ gì cho đúng? Hãy nghĩ về việc mình vừa làm và việc còn sửa được, đừng nghĩ về việc mình là người tệ đến đâu.

**Guilt nhắm vào việc, shame nhắm vào người.** Hai người cùng lỡ tay làm vỡ cái bát khi rửa bát giúp ở nhà bạn. Người thứ nhất nghĩ "mình vừa làm vỡ cái bát" và đi lấy chổi quét, hỏi xem đền thế nào. Người thứ hai nghĩ "mình đúng là đồ hậu đậu, vô dụng" và chỉ muốn chui xuống đất. Đó là khác biệt giữa **guilt** và **shame**: guilt nhắm vào hành động ("mình đã làm một việc sai"), shame nhắm vào cả con người ("mình là người tệ").

**Shame nặng nề hơn.** Shame gắn với trầm cảm chặt hơn guilt <a class="ev ev-mid" href="#r-kim2011" title="Kim 2011 · Bằng chứng vừa"></a>.

**Câu hỏi quyết định là "còn sửa được gì".** Shame không phải lúc nào cũng xấu. Khi thất bại **còn sửa được**, shame đi kèm những hành động tích cực như giúp đỡ, tự sửa mình. Khi khó sửa, shame lại đi kèm ít hành động tích cực hơn <a class="ev ev-mid" href="#r-leach2015" title="Leach &amp; Cidam 2015 · Bằng chứng vừa"></a>. Vậy điều quyết định không nằm ở chỗ mình cảm thấy gì, mà ở chỗ mình có thấy một việc cụ thể để làm hay không.

**Ví dụ minh hoạ: làm đổ chiếc xe mượn** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

1. *Tình huống.* Bạn mượn xe máy của đứa em họ đi công chuyện. Lúc dắt xe ra khỏi chỗ gửi, xe đổ, vỡ một bên gương, xước một mảng yếm.
2. *Cơ chế đoán trước điều gì.* Ý nghĩ đầu tiên thường là shame: "mình đúng là hậu đậu, rồi cả nhà sẽ biết". Nếu dừng ở đó và thấy như không còn sửa được gì, bạn sẽ muốn im lặng trả xe, mong không ai để ý. Còn nếu chuyển được sang câu hỏi "còn sửa được gì", chính cảm giác khó chịu ấy lại thành động lực để sửa.
3. *Bạn làm gì.* Bạn nhắn ngay cho em: "Xe đổ lúc mình dắt ra, vỡ gương, xước yếm. Để mình mang ra tiệm làm lại rồi trả em nhé." Chiều đó bạn dắt xe ra tiệm thay gương, đánh lại vết xước, rồi mới mang xe về trả.
4. *Kết quả.* Chuyện khép lại trong một buổi chiều, thay vì thành một mối khó chịu âm ỉ giữa hai người. Điều em bạn nhớ là một người nhận lỗi nhanh, sửa gọn, chứ không phải một người làm đổ xe.

Cách xin lỗi cho đúng đã có ở [§5.3](#apology).

<details><summary>Đọc thêm: guilt, shame và trầm cảm</summary><div class="inner">

Người dễ thấy guilt có xu hướng giúp người khác nhiều hơn một chút. Với người dễ thấy shame thì gần như không có liên hệ nào, và cả hai kết quả đều phụ thuộc nhiều vào cách đo <a class="ev ev-mid" href="#r-tignor2017" title="Tignor &amp; Colvin 2017 · Bằng chứng vừa"></a>.

Kết quả về trầm cảm đến từ 108 nghiên cứu với hơn 22.000 người. Có hai kiểu guilt không lành mạnh gắn với trầm cảm nặng ngang shame: ôm trách nhiệm quá mức cho chuyện mình không kiểm soát được, và cảm giác tội lỗi lơ lửng không gắn với việc gì cụ thể <a class="ev ev-mid" href="#r-kim2011" title="Kim 2011 · Bằng chứng vừa"></a>.

Giữa bạn bè cũng vậy <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Lỡ lời làm bạn mình buồn: "mình đã nói một câu làm bạn tổn thương, mình sẽ xin lỗi" là guilt có ích. "Mình đúng là đứa tồi" là shame, và nếu kèm cảm giác không còn sửa được gì, mình dễ đâm ra né mặt bạn.

</div></details>

<h3 id="promises"><span class="num">17.6</span>Lời hứa</h3>

Lời hứa có thật sự giữ người ta lại không? Có, nếu đó là lời hứa tự nguyện, nói thành lời, với một người cụ thể.

**Người ta giữ lời vì chính lời hứa.** Trong một trò chơi kinh tế được thiết kế để tách hai động cơ, người ta giữ lời *vì chính lời hứa*, không chỉ vì ngại làm người kia thất vọng <a class="ev ev-mid" href="#r-vanberg2008" title="Vanberg 2008 · Bằng chứng vừa"></a>.

**Lời hứa tự nguyện có tác dụng, chữ ký in sẵn thì không.** Ở học sinh 10–14 tuổi tại Ấn Độ, một lời hứa tự nguyện sẽ trung thực làm gian lận giảm rõ rệt <a class="ev ev-mid" href="#r-kanngiesser2021" title="Kanngiesser 2021 · Bằng chứng vừa"></a>. Còn dòng chữ ký in sẵn trên tờ khai ở [§16.2](#structure-not-reminders) thì không. Có một điều đáng để ý <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: bằng chứng chưa chỉ ra chính xác yếu tố nào tạo nên khác biệt. Có thể là tự miệng mình nói ra, có thể là có một người cụ thể đứng trước mặt.

**Hứa ít, hứa thành lời, hứa với người cụ thể, rồi giữ.** Mỗi lời hứa giữ được khiến lời hứa sau của mình đáng tin hơn, với người khác lẫn với chính mình. Ví dụ minh hoạ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: thay vì hứa chung chung với bố mẹ "dạo này con sẽ về thăm nhiều hơn", bạn nói một câu nhỏ và cụ thể: "Chiều Chủ nhật này con về ăn cơm, ở với bố mẹ đến tối." Lời hứa ấy nhỏ, nói thành lời, với những người cụ thể, và giữ được ngay trong tuần. Vài tuần như vậy gây dựng lòng tin nhiều hơn mười lời hứa lớn chưa bao giờ thành hình.

<details><summary>Đọc thêm: thêm về lời hứa và hợp tác</summary><div class="inner">

Trước khi bắt tay vào một việc chung, chỉ cần ngồi nói chuyện với nhau là mọi người đã hợp tác tốt hơn rất nhiều. Nói chuyện trực tiếp còn hiệu quả hơn hẳn nhắn tin bằng chữ <a class="ev ev-high" href="#r-balliet2010" title="Balliet 2010 · Bằng chứng mạnh"></a>.

Một thí nghiệm dựa trên tình huống giả định gợi ý rằng lời hứa và niềm tin có thể bồi đắp cho nhau thành một vòng. Lời hứa tạo ra kỳ vọng, và biết người kia đang kỳ vọng, người hứa càng muốn giữ lời <a class="ev ev-mid" href="#r-mischkowski2019" title="Mischkowski, Stone &amp; Stremitzer 2019 · Bằng chứng vừa"></a>.

Nghiên cứu ở Ấn Độ làm với 640 học sinh <a class="ev ev-mid" href="#r-kanngiesser2021" title="Kanngiesser 2021 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="humility"><span class="num">17.7</span>Biết mình có thể sai</h3>

Đổi ý có phải là thiếu lập trường không? Không. Biết mình có thể sai đi cùng việc hành xử dựa trên bằng chứng nhiều hơn.

Người thợ sửa xe đáng tin thường là người hay nói "để tôi kiểm tra lại đã", chứ không phải người mới nhìn qua đã phán chắc nịch <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. **Intellectual humility** là nhận ra hiểu biết của chính mình có giới hạn. Người có intellectual humility ít tin vào thông tin sai hơn một chút, và hành xử dựa trên bằng chứng nhiều hơn rõ rệt <a class="ev ev-mid" href="#r-bowes2024" title="Bowes &amp; Fazio 2024 · Bằng chứng vừa"></a>.

Đây là mặt đạo đức của actively open-minded thinking ở [§14.4](#think). Đổi ý khi bằng chứng đổi là dấu hiệu của người chính trực, không phải của người thiếu lập trường <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: intellectual humility</summary><div class="inner">

Kết quả về thông tin sai và hành xử dựa trên bằng chứng đến từ các nghiên cứu với tổng cộng hơn 33.000 người <a class="ev ev-mid" href="#r-bowes2024" title="Bowes &amp; Fazio 2024 · Bằng chứng vừa"></a>. Người có intellectual humility cởi mở hơn với quan điểm trái ngược <a class="ev ev-mid" href="#r-porter2018" title="Porter &amp; Schumann 2018 · Bằng chứng vừa"></a>, và ít gọi một chính trị gia đổi ý là "kẻ lật lọng" hơn <a class="ev ev-mid" href="#r-leary2017" title="Leary 2017 · Bằng chứng vừa"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: những câu tự bào chữa và những lời hứa</div>

Trong một tuần, mỗi khi trong đầu vang lên một trong bốn câu *"ai cũng làm thế"*, *"có tí thôi mà"*, *"người ta bảo làm thế"*, *"đáng đời họ"*, ghi một dấu vào ghi chú điện thoại kèm hai chữ về tình huống <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Song song, đếm những lời hứa nhỏ bạn nói ra, với người nhà ("Chủ nhật con về") hay với bạn bè ("mai mình gọi lại"), và đánh dấu cái nào đã giữ. Nếu các câu tự bào chữa cứ tụ lại quanh một kiểu việc (tiền bạc, giờ giấc, chuyện mua bán), đó là chỗ bạn dễ lỡ bước nhất, nên đặt một luật riêng cho chỗ ấy. Nếu bạn giữ được chưa tới một nửa số lời hứa, cách sửa thường không phải cố hơn mà là hứa ít đi <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div>

<div class="recall">

**Câu hỏi nhớ lại — chương 17.**

<details><summary>Vì sao im lặng cầm về số tiền siêu thị thối thừa dễ hơn rút tiền từ ví người bán hàng, dù cùng bản chất?</summary><div class="inner">

Vì nạn nhân không có khuôn mặt: khi lời nói dối chỉ hại một thứ trừu tượng, phải quyết vội khiến người ta nghiêng về phía tư lợi; với nạn nhân cụ thể thì không (Köbis 2019). Cách chặn: hình dung người cụ thể sẽ gánh hậu quả.

</div></details>

<details><summary>Kể bốn câu tự bào chữa thường gặp, và chúng làm gì?</summary><div class="inner">

"Ai cũng làm thế", "có tí thôi mà", "người ta bảo làm thế", "đáng đời họ". Chúng là các cơ chế moral disengagement — giúp mình lờ đi tiếng lương tâm trước một việc sai (Bandura 1999; Gini 2014).

</div></details>

<details><summary>Sau khi làm sai, câu hỏi nào có ích hơn "mình tệ đến mức nào"?</summary><div class="inner">

"Còn sửa được gì?" — shame đi kèm hành động tích cực khi thất bại còn sửa được, và ít hành động tích cực hơn khi không (Leach & Cidam 2015). Hướng cảm xúc vào hành động (guilt) thay vì vào cả con người (shame) là cách hiểu của sách.

</div></details>

<details><summary>(Nhớ lại chương 5 và chương 16.) Vì sao một lời hứa tự nguyện có tác dụng mà chữ ký in sẵn trên tờ khai thì không?</summary><div class="inner">

Bằng chứng chưa tách được yếu tố nào; lời hứa tự nguyện làm gian lận giảm (Kanngiesser 2021), còn chữ ký in sẵn thì không (Kristal 2020). Và như chương 5, lòng tin mất vì thiếu chính trực thì khó lấy lại hơn — nên hứa ít và giữ lời là cách giữ lòng tin ngay từ đầu.

</div></details>

</div>

<h2 id="decide-values"><span class="num">18</span>Quyết định theo values</h2>

[Chương 12](#decisions) trả lời câu hỏi *làm sao đoán cho đúng*: nhìn từ bên ngoài, lùi ra xa, ước lượng hai lần. Chương này trả lời câu hỏi còn lại: *làm sao chọn cho đúng với điều mình coi trọng*. Nhất là khi các values giằng co nhau, và khi mình sống trong một gia đình Việt Nam với những kỳ vọng riêng.

<h3 id="decide-early"><span class="num">18.1</span>Quyết định sớm, khi đầu óc còn tỉnh táo</h3>

Có nên quyết từ trước, thay vì tới lúc mới quyết? Có. Hãy quyết lúc đầu óc còn tỉnh táo, rồi làm cho việc đổi ý tại chỗ trở nên phiền phức.

**Chọn trước thì chọn tốt hơn, ở mức vừa phải.** Đi siêu thị lúc no thì giỏ hàng toàn rau; đi lúc đói thì giỏ đầy bánh kẹo. [Chương 2](#cold-hot) đã có thí nghiệm món ăn vặt: chọn trước một tuần thì nghiêng về món lành mạnh, chọn ngay tại chỗ thì đổi sang món kia. Thí nghiệm ngoài đời thật với bữa trưa cũng cho kết quả cùng hướng: sinh viên được chia ngẫu nhiên đặt món từ trước hoặc ngay lúc sắp ăn, và nhóm đặt trước ăn ít hơn khoảng 10% <a class="ev ev-mid" href="#r-vanepps2016" title="VanEpps, Downs &amp; Loewenstein 2016 · Bằng chứng vừa"></a>.

**Lý do vững là hot–cold empathy gap, không phải "nghĩ xa thì tự nhiên có nguyên tắc".** Lời giải thích sau nghe rất xuôi tai, nhưng vừa thất bại trong một lần kiểm tra lớn ở nhiều nước <a class="ev ev-high" href="#r-calderon2026" title="Calderon 2026 · Bằng chứng mạnh"></a>. Cách hiểu an toàn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: **quyết sớm vẫn đáng làm**, vì hot–cold empathy gap và present bias ở [chương 2](#cold-hot). Và vì tới lúc làm thật mình dễ chiều theo cái tiện, hãy **làm cho việc đổi ý tại chỗ trở nên phiền phức**, đúng như principles ở [chương 16](#structure-not-reminders).

**Ví dụ minh hoạ: quyết từ tối Chủ nhật** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

1. *Tình huống.* Tối nào trong tuần, vừa đi làm về, bạn cũng tự hỏi "tối nay làm gì": luyện nghe, tập thể dục, hay nằm nghỉ.
2. *Cơ chế đoán trước điều gì.* Hỏi vào lúc ấy là hỏi đúng con người mệt nhất trong ngày. Present bias và hot–cold empathy gap gần như chắc chắn sẽ chọn hộ bạn việc dễ nhất.
3. *Bạn làm gì.* Tối Chủ nhật, lúc thảnh thơi, bạn xếp sẵn cả tuần: thứ Hai và thứ Năm luyện nghe, thứ Ba tập thể dục ở nhà, thứ Tư sang ăn cơm với bố mẹ, thứ Sáu nghỉ hẳn. Bạn đặt nhắc lịch, và trải sẵn tấm thảm tập cạnh giường từ tối thứ Hai.
4. *Kết quả.* Tối thứ Ba về tới nhà, câu hỏi không còn là "có tập không" mà chỉ là "tập lúc mấy giờ". Muốn đổi ý thì phải tự tay xoá một dòng lịch đã đặt từ Chủ nhật, rồi cuộn tấm thảm cất đi. Chừng ấy đủ phiền để phần lớn các tối bạn cứ thế làm theo.

<details><summary>Đọc thêm: các con số về bữa trưa, và lý thuyết "khoảng cách"</summary><div class="inner">

Trong thí nghiệm bữa trưa, nhóm đặt trước ăn ít hơn khoảng 100 calo. Ở một nghiên cứu khác với nhân viên văn phòng, nơi nhóm "đặt lúc trưa" vẫn phải chờ một lúc mới có đồ ăn, mức giảm chỉ khoảng 5% và chưa đủ chắc chắn <a class="ev ev-mid" href="#r-vanepps2016" title="VanEpps, Downs &amp; Loewenstein 2016 · Bằng chứng vừa"></a>. Hiệu ứng có thật, nhưng vừa phải.

Lời giải thích "nghĩ xa thì có nguyên tắc" dựa trên ý: nghĩ về tương lai xa thì ta nghĩ trừu tượng hơn, nên values có dịp lên tiếng. Một nghiên cứu với sinh viên thấy values đoán khá tốt người ta định làm gì trong một tình huống vài tháng nữa, nhưng gần như không đoán được gì cho một tình huống ngay trong tuần <a class="ev ev-low" href="#r-eyal2009" title="Eyal 2009 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

Lý thuyết đứng sau là construal-level theory: khoảng cách làm tâm trí trừu tượng hơn. Lần kiểm tra đã công bố quy trình trước ở 27 nước, với gần 12.000 người. Nghiên cứu gốc thấy hiệu ứng rất lớn của khoảng cách thời gian, lần kiểm tra này thấy gần như bằng không <a class="ev ev-high" href="#r-calderon2026" title="Calderon 2026 · Bằng chứng mạnh"></a>. Các tác giả gốc phản bác về phương pháp <a class="ev ev-mid" href="#r-liberman2026" title="Liberman &amp; Levit-Mor 2026 · Bằng chứng vừa"></a>, nên cuộc tranh luận chưa khép lại.

</div></details>

<h3 id="score-values"><span class="num">18.2</span>Viết values ra trước một quyết định lớn</h3>

Trước một quyết định lớn, ngồi chấm điểm từng phương án theo values có đáng công không? Có, dù tác dụng nhỏ: lựa chọn khớp với values hơn, và về sau bớt hối tiếc một chút.

**Bằng chứng đến từ bệnh viện.** Ở đó, bệnh nhân phải chọn giữa các cách điều trị: mổ hay không mổ, sống lâu hơn hay sống nhẹ nhõm hơn. Gộp các thử nghiệm ngẫu nhiên, người ta thấy: khi bệnh nhân nói rõ values của mình trước khi chọn, họ ít chọn ngược với chính values vừa nói hơn. Hối tiếc về sau cũng giảm một chút. Phương pháp có cấu trúc nhất cho nhiều lựa chọn khớp values nhất: chấm điểm từng phương án theo từng value, rồi nhân với mức quan trọng <a class="ev ev-high" href="#r-witteman2021" title="Witteman 2021 · Bằng chứng mạnh"></a>. Đem sang chuyện nghề nghiệp, gia đình là một suy luận <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>, nhưng thử thì chẳng mất bao nhiêu công.

Ví dụ minh hoạ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: Minh ở [chương 15](#find-values) đang cân nhắc hai hướng mới, bên cạnh việc ở lại trường cũ. Thứ tự values của Minh là benevolence → self-direction → security → achievement; Minh cho trọng số lần lượt 4, 3, 2, 1. Điểm 1–5 dưới đây là Minh tự chấm, chỉ để minh hoạ cách tính: mỗi ô là điểm × trọng số.

| Phương án | Benevolence ×4 (gần mẹ) | Self-direction ×3 (tự chọn cách dạy) | Security ×2 (thu nhập ổn định) | Achievement ×1 (có tiếng trong nghề) | Tổng |
|---|---|---|---|---|---|
| Ở lại trường hiện tại | 5 → 20 | 2 → 6 | 4 → 8 | 2 → 2 | **36** |
| Trường ở thành phố khác, lương cao | 1 → 4 | 3 → 9 | 5 → 10 | 5 → 5 | **28** |
| Mở lớp dạy thêm tại nhà | 5 → 20 | 4 → 12 | 3 → 6 | 4 → 4 | **42** |

**Bảng là một tấm gương, không phải câu trả lời** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Phương án lương cao nhất lại xếp cuối, vì nó lấy đi đúng value Minh đặt lên đầu. Nếu nhìn bảng mà thấy *khó chịu* với kết quả, thì cảm giác ấy cũng là dữ liệu: hoặc trọng số chưa đúng với mình, hoặc có một value Minh chưa viết ra. Cái lợi thật của bảng là buộc mình nói rõ mình đang bỏ gì để lấy gì.

<details><summary>Đọc thêm: các con số của tổng hợp y khoa</summary><div class="inner">

Tổng hợp gồm các thử nghiệm ngẫu nhiên từ 33 bài báo về 43 phương pháp. Số lựa chọn đi ngược values giảm 4 điểm phần trăm <a class="ev ev-high" href="#r-witteman2021" title="Witteman 2021 · Bằng chứng mạnh"></a>. Hiệu ứng nhỏ, và mới chỉ được chứng minh với quyết định y khoa.

</div></details>

<h3 id="sacred"><span class="num">18.3</span>Khi các values xung đột</h3>

Bạn đoán xem: với một người coi một điều là thiêng liêng, đề nghị bồi thường bằng tiền để họ nhượng bộ điều đó sẽ khiến họ dễ đồng ý hơn, hay ngược lại? Ngược lại. Tiền khiến họ giận thêm, còn một cử chỉ biểu tượng lại làm họ dịu đi.

**Đem điều thiêng liêng ra đổi lấy tiền là xúc phạm.** Thử hình dung có người trả giá gấp đôi để mua chiếc nhẫn cưới của mẹ bạn. Bạn không thấy mình được lợi; bạn thấy bị xúc phạm. Các khảo sát thực nghiệm ở Trung Đông ghi lại đúng phản ứng ấy, ở quy mô một cuộc xung đột thật. Có những người coi một vấn đề là không thể đánh đổi "dù lợi ích lớn đến đâu". Khi một thoả thuận có thêm tiền, họ lại giận dữ hơn và ủng hộ bạo lực nhiều hơn. Một cử chỉ nhượng bộ mang tính biểu tượng, không thêm chút lợi ích vật chất nào, lại làm dịu họ <a class="ev ev-mid" href="#r-ginges2007" title="Ginges 2007 · Bằng chứng vừa"></a>. Các nhà nghiên cứu gọi những điều như vậy là sacred value.

**Trong nhà cũng thế** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Nếu với bố mẹ, "con có mặt" là điều thiêng liêng, thì gửi thêm tiền thay cho việc về thăm có thể khiến họ buồn hơn chứ không vui hơn. Một cuộc gọi đều đặn, một bữa cơm, tức những cử chỉ biểu tượng, có thể làm họ ấm lòng hơn nhiều.

**Ví dụ minh hoạ: lời mời làm thêm vào thứ Bảy** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

1. *Tình huống.* Một người quen mời bạn nhận một việc làm thêm trả khá, nhưng phải làm vào mọi ngày Chủ nhật, suốt hai tháng. Chủ nhật là ngày cả nhà bạn được ở bên nhau trọn vẹn, cùng đi chợ, cùng nấu bữa trưa.
2. *Cơ chế đoán trước điều gì.* Nếu với người bạn đời, "Chủ nhật cả nhà có nhau" là điều thiêng liêng, thì câu "làm hai tháng thôi, có tiền rồi cả nhà đi du lịch bù" rất dễ nghe như đem chuyện ấy ra đổi lấy tiền. Câu ấy làm người kia tổn thương chứ chẳng thuyết phục được ai.
3. *Bạn làm gì.* Trước khi trả lời người quen, bạn nói chuyện với người bạn đời, bắt đầu từ điều cả hai cùng giữ: "Chủ nhật là của cả nhà, mình không muốn mất." Rồi bày rõ từng phương án và hệ quả: nhận việc nhưng xin làm vào các tối trong tuần, gác việc học tiếng Anh hai tháng; hoặc từ chối. Bạn để người bạn đời cùng chọn.
4. *Kết quả.* Dù chọn phương án nào, người bạn đời cũng thấy ngày Chủ nhật của cả nhà được tôn trọng, chứ không bị đem ra định giá. Đó chính là một cử chỉ biểu tượng. Cuộc nói chuyện xoay quanh hệ quả, chứ không xoay quanh câu "nhà mình không quan trọng bằng tiền à".

**Với người có nguyên tắc cứng, bày rõ hệ quả thay vì cãi về nguyên tắc.** Người giữ values không chịu đánh đổi không hẳn là không quan tâm tới hậu quả. Khi được hỏi lần lượt ở từng mức hậu quả cụ thể, họ lại nhạy với hậu quả *hơn cả* người khác <a class="ev ev-low" href="#r-bartels2007" title="Bartels &amp; Medin 2007 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Vậy với người thân có nguyên tắc cứng, bày rõ hệ quả của từng phương án có thể hiệu quả hơn là cãi nhau về nguyên tắc <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: sacred values, protected values và chuyện trì hoãn</summary><div class="inner">

Khảo sát ở Trung Đông làm với hơn hai nghìn người: người định cư Israel, người tị nạn Palestine, sinh viên Palestine. Ở người định cư, cử chỉ biểu tượng làm khả năng ủng hộ bạo lực ở mức mạnh giảm còn khoảng một phần tư <a class="ev ev-mid" href="#r-ginges2007" title="Ginges 2007 · Bằng chứng vừa"></a>.

Các thí nghiệm khác cũng thấy người ta phẫn nộ khi chứng kiến ai đó đem một sacred value ra cân đo với tiền. Ai càng đắn đo lâu thì càng bị phán xét nặng <a class="ev ev-mid" href="#r-tetlock2000" title="Tetlock 2000 · Bằng chứng vừa"></a>.

Trong nghiên cứu về hậu quả, những values không chịu đánh đổi được gọi là "protected values". Câu hỏi được đặt ở từng mức hậu quả cụ thể thay vì một câu "chấp nhận hay không", và đây chỉ là một nghiên cứu nhỏ <a class="ev ev-low" href="#r-bartels2007" title="Bartels &amp; Medin 2007 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

Niềm tin rằng cứ hai phương án ngang ngửa nhau là ta sẽ trì hoãn quyết định thì hoá ra không đúng. 40 lần làm lại với hơn 26.000 người không tái hiện được hiệu ứng này một cách ổn định <a class="ev ev-high" href="#r-evangelidis2023" title="Evangelidis, Levav &amp; Simonson 2023 · Bằng chứng mạnh"></a>. Nếu bạn cứ dời một quyết định mãi, hãy tìm nguyên nhân ở chỗ khác: sợ, thiếu thông tin, hay không có hạn chót <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div></details>

<h3 id="future-self"><span class="num">18.4</span>Mình của mười năm sau</h3>

Khi cân nhắc một quyết định lớn, nên nghĩ về mình của mười năm sau thế nào? Như nghĩ về chính mình, chỉ già hơn một chút, chứ không phải một người lạ sẽ "lo chuyện ấy sau".

**Thấy mình của tương lai vẫn là mình thì về sau hài lòng hơn một chút.** Có người nghĩ về mình của mười năm sau như nghĩ về một người lạ: "để ông ấy lo". Có người thấy đó vẫn là mình. Theo dõi gần năm nghìn người Mỹ suốt mười năm, nhóm thứ hai hài lòng với cuộc sống hơn khi mười năm trôi qua, dù mối liên hệ rất nhỏ <a class="ev ev-mid" href="#r-reiff2020" title="Reiff, Hershfield &amp; Quoidbach 2020 · Bằng chứng vừa"></a>.

**Cách dùng** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Câu hỏi "Minh 37 tuổi sẽ cảm ơn hay trách Minh 27 tuổi vì lựa chọn này?" chính là cách lùi ra xa ở [§12.2](#distance-decide), chỉ là lùi về phía tương lai. Ông bà ta trồng cây ăn quả trong vườn cũng nghĩ như vậy: mười năm sau, người ngồi hái quả dưới gốc nhiều khi chính là mình.

<details><summary>Đọc thêm: future-self continuity</summary><div class="inner">

Trong nghiên cứu mười năm, kết quả vẫn đúng khi đã tính đến mức hài lòng ban đầu. Điều thú vị là cả người nghĩ mình sẽ tệ đi lẫn người nghĩ mình sẽ tốt lên hẳn đều hài lòng ít hơn <a class="ev ev-mid" href="#r-reiff2020" title="Reiff, Hershfield &amp; Quoidbach 2020 · Bằng chứng vừa"></a>.

Còn những bài tập cho người ta nhìn khuôn mặt già đi của mình để khuyến khích tiết kiệm thì bằng chứng còn mỏng. Bài báo nổi tiếng gồm bốn thí nghiệm nhỏ, mỗi thí nghiệm vài chục người, phần lớn đo bằng lựa chọn với tiền giả định <a class="ev ev-low" href="#r-hershfield2011" title="Hershfield 2011 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

</div></details>

<h3 id="family-culture"><span class="num">18.5</span>Sống theo values trong một gia đình Việt</h3>

Sống theo values của mình có phải là cãi lời bố mẹ không? Không. Điều quyết định không phải mình theo truyền thống nhiều hay ít, mà là mình làm vì tán thành, hay vì bị ép và sợ mang cảm giác có lỗi.

**Tự chủ không phải là chủ nghĩa cá nhân.** Hai người con cùng về quê ăn Tết. Một người về vì nhớ nhà, muốn ngồi với ông bà; người kia về vì "không về thì bị nói". Việc làm giống hệt nhau, nhưng cảm giác bên trong thì khác hẳn. Một nghiên cứu hỏi sinh viên ở Mỹ, Nga, Thổ Nhĩ Kỳ và Hàn Quốc về những tập tục tập thể như trung thành với nhóm hay tôn trọng thứ bậc. Ai làm theo các tập tục ấy *một cách tự nguyện* thì có well-being cao hơn, và điều này đúng như nhau ở cả bốn nước <a class="ev ev-mid" href="#r-chirkov2003" title="Chirkov 2003 · Bằng chứng vừa"></a>. Ba nhu cầu ở [chương 7](#needs) không phải thứ chỉ dành cho người phương Tây.

**Chữ hiếu có hai phần.** Một phần là biết ơn và chăm sóc cha mẹ vì tình cảm, gọi là *reciprocal filial piety*. Phần kia là vâng lời và làm tròn bổn phận theo vai vế, gọi là *authoritarian filial piety*. Sinh viên Việt Nam chấm phần thứ nhất 6,14 trên thang 7, phần thứ hai chỉ 3,95 <a class="ev ev-low" href="#r-rozyckatran2021" title="Różycka-Tran 2021 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Nghĩa là, ít nhất trong nhóm sinh viên này, hiếu trước hết là biết ơn và chăm sóc, còn vâng lời theo vai vế chỉ được coi trọng ở mức lưng chừng. Khi cân nhắc bổn phận của mình với cha mẹ, có thể tách hai phần này ra mà xét <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

**Khi phải nói không, tình cảm giữ cho bất đồng không lớn thêm.** Ở học sinh Đài Loan, kiểu hiếu biết ơn – chăm sóc đi cùng ít xung đột với cha mẹ hơn kiểu hiếu vâng lời <a class="ev ev-low" href="#r-yeh2004" title="Yeh &amp; Bedford 2004 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Nhóm coi trọng kiểu hiếu này cũng thường biết kìm lại, không để bất đồng bùng lên.

Ghép lại thành một cách làm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>, không phải một công thức:

1. **Tách phần mình tán thành khỏi phần mình chỉ đang chịu đựng.** Thường thì phần biết ơn và chăm sóc mình tán thành trọn vẹn; phần vâng lời theo vai thì cần xét từng việc.
2. **Tìm trong mong muốn của bố mẹ phần mình thật sự đồng ý.** Bố mẹ muốn con ổn định, và mình cũng muốn cuộc sống của mình an toàn; hai bên chỉ khác nhau ở cách đi. Bắt đầu từ mục tiêu chung ấy.
3. **Bày rõ hệ quả thay vì cãi về nguyên tắc** ([§18.3](#sacred)), và tỏ sự tôn trọng bằng những cử chỉ biểu tượng: nói riêng, chọn đúng lúc, giữ giọng của người con.
4. **Giữ tình cảm khi bất đồng.** Lòng biết ơn và sự chăm sóc là thứ giữ cho bất đồng không lớn thêm.

Ví dụ minh hoạ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: Minh chọn mở lớp dạy thêm tại nhà ở [§18.2](#score-values). Bố mẹ lo vì "nghỉ trường thì mất biên chế, không ổn định". Thay vì cãi về chuyện biên chế, Minh nói từ mục tiêu chung: "Con cũng muốn ổn định như bố mẹ muốn. Con đã để sẵn quỹ dự phòng sáu tháng lương, mà dạy ở nhà thì con ở ngay cạnh bố mẹ, mẹ ốm là có con." Minh không làm theo ý bố mẹ. Nhưng Minh cũng không làm tổn thương phần chữ hiếu mà cả Minh lẫn bố mẹ đều coi trọng.

<details><summary>Đọc thêm: các nghiên cứu về văn hoá, chữ hiếu và gia đình</summary><div class="inner">

Nghiên cứu bốn nước của Chirkov làm với 559 sinh viên <a class="ev ev-mid" href="#r-chirkov2003" title="Chirkov 2003 · Bằng chứng vừa"></a>.

Ở sinh viên tám nước, trong đó có Philippines, Malaysia, Trung Quốc, Nhật Bản, người châu Á thấy mình ít được tự chủ hơn. Nhưng ba nhu cầu nền có được đáp ứng hay không thì quan trọng với well-being *như nhau ở mọi nền văn hoá* <a class="ev ev-mid" href="#r-church2013" title="Church 2013 · Bằng chứng vừa"></a>.

Số liệu chữ hiếu đến từ thang đo dual filial piety, trên 297 sinh viên Việt Nam. Đây là một mẫu tiện lợi ở một trường đại học tại Hà Nội, nhưng là dữ liệu Việt Nam hiếm hoi <a class="ev ev-low" href="#r-rozyckatran2021" title="Różycka-Tran 2021 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

Giúp gia đình có thể là nguồn ý nghĩa. Ở 752 thiếu niên Mỹ gốc Mỹ Latin, gốc châu Á và gốc châu Âu viết nhật ký mỗi ngày, những ngày giúp đỡ gia đình không căng thẳng hơn mà lại vui hơn, phần lớn nhờ cảm giác mình đã làm tròn vai của mình <a class="ev ev-mid" href="#r-telzer2009" title="Telzer &amp; Fuligni 2009 · Bằng chứng vừa"></a>. Ở người con chăm cha mẹ già, ai thật lòng coi trọng chữ hiếu thì thấy gánh chăm sóc nhẹ hơn, còn cảm giác "bắt buộc phải làm" đơn thuần thì không giúp gì <a class="ev ev-low" href="#r-pan2022" title="Pan, Chen &amp; Yang 2022 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Cùng một hướng với Chirkov: việc mình làm vì tán thành thì đi cùng một cuộc sống tốt hơn, còn việc làm chỉ vì bổn phận thì không.

Người châu Á ít chủ động nhờ giúp đỡ hơn vì sợ ảnh hưởng tới tình cảm, và được lợi nhiều hơn từ kiểu hỗ trợ không cần mở lời, như một bát cháo mang sang lúc ốm, chẳng cần hỏi han <a class="ev ev-mid" href="#r-taylor2004" title="Taylor 2004 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-taylor2007" title="Taylor 2007 · Bằng chứng vừa"></a>.

Nghiên cứu Đài Loan làm với 773 học sinh, chia thành bốn nhóm. Cả bốn nhóm, kể cả nhóm hiếu thảo nhất, đều ít khi chọn cách đơn giản là bỏ luôn mong muốn của mình khi bất đồng với cha mẹ <a class="ev ev-low" href="#r-yeh2004" title="Yeh &amp; Bedford 2004 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

Khi người thân quyết định thay, trẻ em ít mất hứng hơn nếu thấy gần gũi với người đó, có lẽ vì gần gũi thì trẻ dễ coi lựa chọn của người kia là lựa chọn của mình. Nhưng cảm giác tự chủ vẫn quan trọng ở mọi mức gần gũi <a class="ev ev-low" href="#r-bao2008" title="Bao &amp; Lam 2008 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

</div></details>

<h3 id="decision-protocol"><span class="num">18.6</span>Một quyết định lớn, từ đầu đến cuối</h3>

Ghép lại, một quyết định lớn đi qua những bước nào? Bảy bước dưới đây, nối Phần V với [chương 12](#decisions) thành một quy trình <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>:

```mermaid
flowchart TD
  A["① Đối chiếu bright lines<br/>phương án nào vi phạm thì loại"] -->|"còn lại"| B["② Chấm điểm theo values đã xếp hạng<br/>(§18.2)"]
  B --> C["③ Kiểm tra độ chính xác<br/>outside view, lùi ra xa, ước lượng hai lần<br/>(chương 12)"]
  C --> D["④ Hỏi người của mười năm sau<br/>(§18.4)"]
  D --> E["⑤ Bàn với người thân<br/>từ mục tiêu chung (§18.5)"]
  E --> F["⑥ Quyết định,<br/>rồi cam kết"]
  F --> G["⑦ Nhìn lại: chấm theo quá trình,<br/>không theo kết quả (§12.5)"]
  G -.->|"phát hiện value chưa viết ra"| H["Sửa bảng values<br/>ở buổi xem lại hằng năm"]
```

1. **Bright lines trước.** Phương án nào vượt lằn ranh thì loại ngay, không chấm điểm. Đây là lý do bright line giúp đỡ tốn sức quyết định ([§16.1](#three-levels)). Giống nhặt rau ngoài chợ: bó nào héo thì gạt ra trước, rồi mới ngồi chọn bó nào ngon nhất <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.
2. **Chấm điểm theo values** đã xếp hạng, và để ý cảm giác của mình trước kết quả.
3. **Kiểm tra độ chính xác** của những gì mình đang tin về từng phương án: những người đã chọn như vậy thường ra sao, mình sẽ khuyên một người bạn thế nào, ước lượng hai lần ([§12.1](#outside-view), [§12.2](#distance-decide)).
4. **Hỏi người của mười năm sau.**
5. **Bàn với người thân** từ mục tiêu chung, bày rõ hệ quả.
6. **Quyết định, rồi cam kết.** Người chọn dứt khoát hài lòng với lựa chọn hơn người cứ để ngỏ ([§12.4](#regret)).
7. **Nhìn lại và đánh giá theo quá trình.** Nếu phát hiện một value mình chưa từng viết ra, sửa bảng values ở buổi xem lại hằng năm, không sửa giữa lúc đang bực.

<div class="callout data"><div class="ct">Tự kiểm tra: chấm điểm một quyết định đang treo</div>

Chọn một quyết định bạn còn lưỡng lự trong tháng này: đổi việc, mua một món lớn, đăng ký một khoá học, hay chuyển nhà <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Lấy bốn values đứng đầu của bạn, cho trọng số 4–3–2–1, rồi chấm từng phương án từ 1 đến 5 như bảng của Minh ở [§18.2](#score-values). Để ý cảm giác của mình khi nhìn tổng điểm. Nếu thấy nhẹ nhõm, bảng vừa nói ra điều bạn vốn đã biết. Nếu thấy khó chịu, hãy tìm xem value nào còn thiếu trong bảng hoặc trọng số nào đang sai; đó là phát hiện quý nhất của bài tập <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Ghi kết quả lại và mở ra xem ở buổi xem lại cuối năm.

</div>

<div class="recall">

**Câu hỏi nhớ lại — chương 18.**

<details><summary>Quyết định sớm có ích vì "nghĩ xa thì trừu tượng hơn" không? Vậy vì sao vẫn nên quyết sớm?</summary><div class="inner">

Lời giải thích "khoảng cách làm tâm trí trừu tượng hơn" vừa thất bại trong một lần kiểm tra ở 27 nước: nghiên cứu gốc thấy hiệu ứng rất lớn, lần kiểm tra thấy gần như bằng không (Calderon 2026; chi tiết trong phần "Đọc thêm" của §18.1). Lý do vững để quyết sớm là hot–cold empathy gap và present bias (chương 2); và nên làm cho việc đổi ý tại chỗ trở nên phiền phức.

</div></details>

<details><summary>Vì sao gửi thêm tiền có thể không thay được việc về thăm bố mẹ?</summary><div class="inner">

Khi một điều là sacred value, đem nó ra cân với tiền có thể gây phẫn nộ, còn cử chỉ biểu tượng lại có tác dụng (Ginges 2007; Tetlock 2000). Áp dụng vào gia đình là suy luận, nhưng dựa trên cùng một cơ chế.

</div></details>

<details><summary>Tự chủ có nghĩa là không nghe lời bố mẹ không?</summary><div class="inner">

Không. Làm theo tập tục tập thể một cách tự nguyện đi kèm well-being cao hơn, như nhau ở bốn nước (Chirkov 2003); điều quan trọng là làm vì tán thành hay vì bị ép.

</div></details>

<details><summary>(Nhớ lại chương 12 và chương 16.) Trong quy trình một quyết định lớn, vì sao đối chiếu bright lines đứng trước chấm điểm, và chấm điểm đứng trước kiểm tra độ chính xác?</summary><div class="inner">

Bright lines loại ngay những phương án không cần bàn tới, nên đỡ tốn sức. Chấm điểm theo values trả lời "mình muốn gì"; kiểm tra độ chính xác (outside view, lùi ra xa, ước lượng hai lần ở chương 12) trả lời "điều mình tin về từng phương án có đúng không". Biết mình muốn gì trước, rồi mới kiểm tra.

</div></details>

</div>

<h2 id="closing"><span class="num">19</span>Lời kết: một đời được xây từ những ngày bình thường</h2>

Đọc xong cả cuốn, rốt cuộc nên bắt đầu từ đâu? Hãy viết một trang của riêng bạn, rồi sống những ngày bình thường cho đều. Không việc nào cần làm cho hoàn hảo.

**Bốn câu hỏi, một chỗ gặp nhau.** Cuốn sách mở đầu bằng bốn câu hỏi, và hoá ra cả bốn câu trả lời gặp nhau ở cùng một chỗ. Ta hiểu mình kém hơn ta tưởng, nên thay vì tin vào ý định, ta sắp xếp tình huống và học từ dữ liệu của chính mình. Ta hay đoán sai về người khác, và sai theo một chiều quen thuộc, nên thay vì đoán, ta hỏi, ta chủ động, ta nói thật mà vẫn tử tế. Ta dễ để những thước đo bên ngoài quyết định thay mình, nên ta chọn lại thước đo theo ba nhu cầu nền và những gì mình thật sự coi trọng. Còn phần lớn những gì xảy đến thì nằm ngoài tầm tay ta. Vậy nên ta tách phần đổi được khỏi phần không đổi được, bắt tay vào phần thứ nhất, chấp nhận phần thứ hai, và không đi một mình.

**Một ngày lỡ không làm hỏng gì cả.** Habit không mất đi vì một ngày lỡ; tình cảm không tan vì một lần cãi nhau; một quyết định tốt không hoá thành quyết định tồi chỉ vì gặp vận xui. Ông bà ta nói "nước chảy đá mòn": chẳng giọt nước nào làm mòn được hòn đá, nhưng nước cứ chảy mãi thì đá phải mòn. Một đời người cũng làm nên từ **những gì lặp lại qua hàng nghìn ngày bình thường**: những đêm ngủ đúng giờ, những bữa tối cùng người thân, những khoản tiết kiệm tự động, những buổi học ngắn mà đều, những lần quay lại sau khi lỡ. Từng việc nhỏ tới mức chẳng ai để ý, nhưng năm này qua năm khác, chính chúng cộng dồn thành một đời.

**Trang của riêng bạn.** Phần V dừng ở chỗ khoa học dừng lại, và trao phần còn lại cho bạn. Phần đó là **một trang của riêng bạn**, không có trong cuốn sách này vì không ai viết hộ được. Trang ấy gồm values của bạn đã xếp hạng, mỗi value kèm một câu hành động ([§15.6](#find-values)); năm đến bảy principles và một hai bright lines ([§16.4](#write-principles)); và quy trình cho một quyết định lớn ([§18.6](#decision-protocol)). Hãy viết trang đó một lần cho thật kỹ, mỗi năm đọc lại một lần, và chỉ sửa vào buổi đọc lại ấy. Values đổi chậm ([§15.3](#values-change)), nên một trang viết cẩn thận thường dùng được nhiều năm. Mỗi khi đứng trước một lựa chọn khó, đó là trang để bạn mở ra đối chiếu.

**Ví dụ minh hoạ: buổi đọc lại cuối năm** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

1. *Tình huống.* Một sáng Chủ nhật cuối tháng Mười Hai, bạn mở lại trang mình viết hồi đầu năm: bốn values có thứ tự, sáu principles, một bright line.
2. *Điều sách đoán trước.* Values đổi chậm, nên phần lớn trang vẫn đúng. Chỗ lệch thường nằm ở principles: có luật bạn giữ đều tới mức đã thành habit, có luật tuần nào cũng phá.
3. *Bạn làm gì.* Đặt trang cạnh lịch và sao kê của cả năm. Luật "nghe tiếng Anh trên quãng đi bộ buổi sáng" gần như ngày nào cũng giữ, nên để nguyên. Luật "tối nào về cũng tập thể dục ở nhà" thì cứ tuần nào bận là bỏ. Bạn không tự trách, mà rút lại thành hai buổi ngắn: tối thứ Hai và sáng Chủ nhật, lúc ít việc chen vào nhất. Bạn còn nhận ra một điều trang chưa hề ghi. Cả năm, kể cả những tuần bận tối mắt, bạn vẫn giữ gần như trọn bữa cơm Chủ nhật với bố mẹ. Hành vi đã nói rõ một value mà bạn chưa viết ra, nên bạn viết thêm vào.
4. *Kết quả.* Trang mới chỉ khác trang cũ vài dòng, nhưng dòng nào cũng đã qua một năm sống thật của bạn. Một năm chỉ cần chừng ấy: sửa ít, sửa đúng lúc, và sửa dựa trên dữ liệu.

<div class="callout data"><div class="ct">Tự kiểm tra: trang của riêng bạn có đang được dùng không</div>

Một tháng sau khi viết trang values và principles, hãy đếm hai con số. Một: trong tháng ấy bạn đã mở trang ra bao nhiêu lần. Hai: bao nhiêu lần một dòng trên trang thật sự khiến bạn chọn khác đi, như từ chối một lời rủ, dời một buổi học, giữ một buổi tối cho gia đình <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Nếu con số là không, trang mới chỉ là khẩu hiệu dán tường, chưa đi vào tình huống nào. Hãy đặt nó vào chỗ bạn nhìn hằng ngày, như màn hình khoá điện thoại hay trang đầu sổ ghi chú. Nếu bạn mở ra vài lần và có ít nhất một lựa chọn đổi theo, trang đã bắt đầu làm đúng việc của mình <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div>

Hãy dùng cuốn sách như lời chỉ đường của người đi trước, đừng coi nó là bản án. Người đi trước chỉ được hướng chung; còn đoạn nào đang ngập, đoạn nào đang rào đào đường thì người đang chạy xe thấy rõ nhất <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Khi điều gì trong sách không đúng với bạn, hãy tin dữ liệu của chính mình hơn. Đó cũng là điều cuốn sách này muốn dạy.
