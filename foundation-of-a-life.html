<p class="src">Sơ đồ vị trí, không phải số liệu: mười values của Schwartz theo thứ tự quanh vòng tròn. Xanh dương: openness to change. Cam: self-enhancement (Hedonism nằm giữa hai nhóm này). Tím: conservation. Xanh lá: self-transcendence. Hai nhóm đối diện nhau là hai cặp xung đột lớn. Conformity và Tradition vốn chung một ô; bản 2012 đặt Tradition sát Security.</p>

| Value | Theo đuổi điều gì |
|---|---|
| Self-direction | Tự quyết suy nghĩ và hành động của mình: tự chọn, tự tạo, tự khám phá |
| Stimulation | Mới lạ, thử thách, hứng khởi |
| Hedonism | Niềm vui và sự thoả mãn cho chính mình |
| Achievement | Thành công cá nhân, chứng minh năng lực theo chuẩn mực xã hội |
| Power | Địa vị, uy thế, quyền kiểm soát người khác và tài nguyên |
| Security | An toàn, hài hoà và ổn định của xã hội, của các mối quan hệ và của bản thân |
| Conformity | Kiềm chế hành động, khuynh hướng và thôi thúc có thể làm phật lòng hay gây hại cho người khác, hoặc trái kỳ vọng và chuẩn mực xã hội |
| Tradition | Tôn trọng và gìn giữ phong tục, truyền thống của gia đình, văn hoá, tôn giáo |
| Benevolence | Chăm lo cho những người gần gũi mình |
| Universalism | Hiểu, bao dung, bảo vệ phúc lợi của mọi người và của thiên nhiên |

Vòng tròn này có ích nhất ở chỗ giúp mình **gọi tên được cảm giác giằng xé**. Hai cặp đối diện lớn là: *openness to change* (tự quyết, mới lạ) đối với *conservation* (an toàn, theo chuẩn mực, truyền thống), và *self-enhancement* (thành tích, quyền lực) đối với *self-transcendence* (chăm lo người khác và thế giới).

- **Ví dụ đời thường.** Lan muốn nghỉ việc nhà nước để mở một quán cà phê; bố mẹ muốn cô giữ chỗ làm ổn định. Đây không phải chuyện ai đúng ai sai: Lan đang đứng ở phía *self-direction* và *stimulation*, bố mẹ ở phía *security* và *tradition* — hai phía đối diện trên vòng tròn. Gọi đúng tên giúp cuộc nói chuyện chuyển từ "con bướng" sang "mình đang đánh đổi hai thứ đều đáng giá".
- **Ví dụ trong công việc.** Một developer phân vân giữa lời mời từ một startup (thử thách, cơ hội thể hiện — *stimulation*, *achievement*) và việc ở lại một công ty lớn (ổn định — *security*). Cảm giác "muốn cả hai" là bình thường, vì hai thứ nằm ở hai phía vòng tròn; không có lựa chọn nào lấy được trọn cả hai <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Bạn đoán xem: nếu hỏi người ở hàng chục nước, values nào thường được xếp quan trọng nhất, và values nào thấp nhất?

Câu trả lời giống nhau đến bất ngờ. Trên các mẫu đại diện ở 13 nước, cùng mẫu giáo viên ở 56 nước và mẫu sinh viên ở 54 nước, *benevolence*, *self-direction* và *universalism* luôn đứng đầu; *power*, *tradition* và *stimulation* đứng cuối; ở 83% số mẫu, thứ tự của nhóm tương quan từ 0,80 trở lên với thứ tự chung này ([Schwartz & Bardi 2001](#r-schwartz2001)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Hệ quả cho việc tự tìm values: nếu "chăm lo cho người thân" đứng đầu danh sách của bạn, bạn giống phần đông nhân loại. Điều thật sự riêng của mỗi người nằm ở **phần giữa** của bảng xếp hạng, và ở việc **mình sẵn sàng đánh đổi cái gì lấy cái gì** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="values-in-action"><span class="num">15.2</span>Values thật thể hiện qua hành vi</h3>

Nói mình coi trọng điều gì thì dễ; câu hỏi là values có thật sự dẫn dắt hành vi không. Câu trả lời: có, nhưng không đều. *Stimulation* và *tradition* liên hệ mạnh với những hành vi thể hiện chúng; *hedonism*, *power*, *universalism*, *self-direction* ở mức vừa; còn *security*, *conformity*, *achievement*, *benevolence* chỉ liên hệ yếu với hành vi tương ứng ([Bardi & Schwartz 2003](#r-bardi2003)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cách giải thích các tác giả đưa ra (dưới dạng gợi ý): những hành vi được xã hội chờ đợi — lịch sự, theo quy định — thì nhiều người vẫn làm bất kể values của họ, nên chúng khó phân biệt được ai coi trọng điều gì; chuẩn mực xã hội che mờ một phần mối liên hệ giữa value và hành vi.

Một nghiên cứu trên 5.348 người Úc thêm một điều quan trọng: mối liên hệ giữa value và hành vi **mạnh lên rõ rệt khi value đó thật sự quan trọng với người đó**. Ví dụ với value bảo vệ động vật, tương quan là 0,475 ở người có mức coi trọng trung bình, nhưng 0,738 ở nhóm coi trọng nhất ([Lee 2022](#r-lee2022)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

- **Đời thường.** Bạn dùng một buổi chiều Chủ nhật rảnh rỗi thế nào nói lên values của bạn nhiều hơn việc bạn có lịch sự ở chỗ làm hay không — vì ở chỗ làm ai cũng lịch sự.
- **Công việc.** Một team nói "chúng tôi coi trọng chất lượng". Điều cho biết câu đó có thật hay không là việc họ làm khi deadline dí sát: có bỏ test để kịp ngày không.

Từ đây có một cách tự kiểm tra đơn giản và trung thực <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: thay vì hỏi "mình coi trọng gì", hãy xem **bốn tuần gần nhất** — lịch, sao kê chi tiêu, những lúc rảnh mình làm gì. Danh sách values viết ra mà không khớp với bốn tuần đó là danh sách của người mình muốn trở thành, chưa phải của mình hiện tại. Cả hai đều đáng biết, và khoảng cách giữa chúng chính là chỗ cần cố gắng — [chương 12](#regret) đã cho thấy những hối tiếc dai dẳng nhất thường đến từ khoảng cách với con người lý tưởng hơn là với con người mình "phải là".

<h3 id="values-change"><span class="num">15.3</span>Values đổi chậm</h3>

Values khá ổn định, và càng lớn tuổi càng ổn định. Theo dõi 270 người trẻ 20–28 tuổi trong 8 năm, độ ổn định thứ hạng của values trung bình là 0,69 trong bốn năm đầu và 0,77 trong bốn năm sau; khi một value tăng, các value hàng xóm trên vòng tròn thường tăng theo còn value đối diện thường giảm ([Vecchione 2016](#r-vecchione2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Trên mẫu ngẫu nhiên toàn quốc 3.962 người 25–75 tuổi, values rất ổn định trong ba năm; người lớn tuổi hơn và phụ nữ coi trọng chăm lo người khác và sự ổn định hơn, người trẻ hơn và nam giới coi trọng địa vị và sự độc lập hơn ([Milfont 2016](#r-milfont2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — so sánh giữa các nhóm tuổi trong ba năm, nên chưa tách được tuổi tác với khác biệt thế hệ.

Một kết quả đáng nhớ về các bước ngoặt: khi người ta tự chọn một con đường mới — vào ngành cảnh sát, chọn ngành học, di cư — values của họ **đã hợp với con đường đó ngay từ đầu**; họ chọn nó một phần *vì* values của mình. Trong ba nghiên cứu này, values chỉ thay đổi rõ để hợp với môi trường mới ở bước ngoặt làm thay đổi nhiều mặt đời sống nhất — di cư ([Bardi 2014](#r-bardi2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

- **Đời thường.** "Cứ vào làm ngân hàng đi, rồi sẽ thích" ít khi đúng: người ta thường chọn nơi hợp với mình sẵn, chứ một công việc ít khi biến mình thành người khác.
- **Công việc.** Chuyển từ outsource sang product không tự làm bạn coi trọng sản phẩm hơn; nếu bạn đã coi trọng điều đó, bạn sẽ thấy hợp ngay từ đầu.

Hệ quả <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: values viết ra ở tuổi 26 là một nền khá vững cho nhiều năm, không phải thứ đổi theo tháng. Nhưng nên đọc lại mỗi năm, vì values vẫn thay đổi chậm — và việc dần coi trọng chăm lo người khác và sự ổn định hơn khi lớn tuổi là bình thường, không phải là phản bội con người trẻ của mình.

<h3 id="values-fit"><span class="num">15.4</span>Hợp với môi trường</h3>

Cùng một value có thể làm người ta vui ở nơi này và khổ ở nơi khác. Ở sinh viên hai khoa có văn hoá khác nhau, value nào đi cùng cảm giác dễ chịu phụ thuộc vào việc nó có khớp với value chủ đạo của môi trường không ([Sagiv & Schwartz 2000](#r-sagiv2000)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span> — một nghiên cứu nhỏ (82 sinh viên), nhưng các tổng hợp lớn về công việc cũng chỉ về cùng một hướng. Mức hợp giữa một người và tổ chức (person–organization fit; values là một trong những chiều hay được đo) tương quan ρ = 0,31 với thái độ với công việc (hài lòng, gắn bó) qua 109 nghiên cứu với hơn 108.000 người; với việc nghỉ việc là 0,24 (chỉ 8 nghiên cứu); với hiệu suất làm việc chỉ 0,15 — và hai mối liên hệ sau dao động nhiều giữa các bối cảnh, đến mức ở một số nơi có thể bằng không ([Arthur 2006](#r-arthur2006)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Nghĩa là: chọn nơi hợp values chủ yếu giúp mình có một công việc dễ chịu hơn và muốn gắn bó lâu hơn, chứ không tự khiến mình giỏi hơn.

Một chi tiết riêng cho người làm việc ở Đông Á: so sánh 96 nghiên cứu ở Đông Á, châu Âu và Bắc Mỹ cho thấy, xét theo thái độ với công việc (gắn bó, hài lòng, ý định nghỉ), ở Bắc Mỹ và ở mức thấp hơn là châu Âu, hợp với tổ chức và với công việc quan trọng hơn tương đối; còn ở Đông Á, **hợp với nhóm làm việc và với sếp trực tiếp** quan trọng hơn tương đối. Các tác giả giải thích bằng văn hoá tập thể và khoảng cách quyền lực cao; nghiên cứu không đo riêng Việt Nam ([Oh 2014](#r-oh2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

- **Đời thường.** Người coi trọng sự yên tĩnh và truyền thống có thể sống rất hạnh phúc ở một thị trấn nhỏ mà một người mê mới lạ sẽ thấy ngột ngạt — không ai trong hai người "sai".
- **Công việc.** Trước khi nhận một offer, hãy hỏi về nhóm bạn sẽ làm cùng và người quản lý trực tiếp kỹ như hỏi về sứ mệnh công ty <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="values-exercise"><span class="num">15.5</span>Viết ra values có giúp gì không</h3>

Bằng chứng ở đây vừa phải và cần đọc cẩn thận. Trong tổng hợp 66 thí nghiệm ngắn trong phòng thí nghiệm, một bài tập ngắn về values — gọi tên điều mình coi trọng — có tác dụng đo được so với nhóm đối chứng không can thiệp; và nói chung, các thành phần được làm thành trải nghiệm (ẩn dụ, bài tập) có hiệu ứng lớn hơn so với chỉ nghe giải thích ([Levin 2012](#r-levin2012)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Trong một thử nghiệm ngẫu nhiên với 181 sinh viên đang căng thẳng, phần "values và hành động cam kết" của một chương trình trị liệu trực tuyến hiệu quả gần như cả chương trình, còn phần chỉ dạy chấp nhận cảm xúc thì kém hơn một chút ([Levin 2020](#r-levin2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cả hai đều do cùng một cộng đồng nghiên cứu thực hiện, trên mẫu nhỏ.

Cần phân biệt điều này với một kết quả thất bại đã nói ở [chương 8](#intrinsic) và [Phụ lục A](#myths): bài viết "tự khẳng định" 15–20 phút để thu hẹp khoảng cách điểm số không lặp lại được ([Hanselman 2017](#r-hanselman2017)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Viết về values như một phép màu nâng thành tích thì không có cơ sở; viết ra values để **dùng nó khi chọn và khi hành động** thì có bằng chứng vừa phải, và khớp với những gì đã biết: mục tiêu xuất phát từ values thật của mình được theo đuổi bền hơn ([Sheldon & Elliot 1999](#r-sheldon1999)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

<h3 id="find-values"><span class="num">15.6</span>Cách tìm và xếp hạng values của mình</h3>

Phần này là phương pháp của cuốn sách <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>, ghép từ các kết quả trên. Nó có bốn bước, và kết quả cuối cùng là **một danh sách ngắn, có thứ tự**, chứ không phải một danh sách dài những điều tốt đẹp.

1. **Nhìn hành vi trước, ý muốn sau.** Từ bốn tuần gần nhất, ghi ra ba việc mình làm khi không ai bắt, và ba thứ mình tiêu tiền vào mà không tiếc ([§15.2](#values-in-action)).
2. **Đặt chúng lên vòng tròn.** Mỗi việc thể hiện value nào trong mười value? Rồi chọn thêm từ vòng tròn những value mình *muốn* sống theo nhiều hơn. Chú ý cặp đối diện: chọn cả hai phía đối diện là dấu hiệu sẽ có giằng xé, cần thứ tự rõ ([§15.1](#value-circle)).
3. **Xếp hạng bằng so sánh từng cặp.** Với hai value bất kỳ, tự hỏi: *"Nếu tình huống bắt chọn một, mình chọn cái nào?"* Một thứ tự sinh ra từ những câu hỏi khó như vậy mới dùng được làm tie-breaker — thứ để phân xử khi hai lựa chọn ngang nhau.
4. **Viết mỗi value thành một câu hành động.** "Gắn kết với gia đình" là một ý tưởng; "tối Chủ nhật ăn cơm với bố mẹ, không mở laptop" là value đã thành hành động. Câu hành động là cầu nối sang [chương 16](#life-principles).

Ví dụ minh hoạ — một người tên Minh, developer 27 tuổi. Bốn tuần của Minh: tối nào cũng đọc thêm về hệ thống phân tán, cuối tuần đi đá bóng với bạn cũ, chi tiền không tiếc cho sách và khoá học. Đặt lên vòng tròn: *self-direction* (học theo ý mình), *benevolence* (bạn cũ), *achievement* (muốn giỏi). Thứ Minh muốn thêm: *security* — một quỹ dự phòng, vì mẹ hay ốm. Khi so từng cặp, Minh thấy giữa "lên senior nhanh" (*achievement*) và "có mặt khi mẹ cần" (*benevolence*), mình chọn cái sau. Thứ tự cuối cùng của Minh: benevolence → self-direction → security → achievement. Ba tháng sau, khi một công ty ở xa mời với lương cao hơn nhiều, Minh không phải cân nhắc lại từ đầu: bảng thứ tự đã trả lời từ trước — ở gần mẹ quan trọng hơn lương, trừ khi có cách giữ được cả hai.

<div class="recall">

**Câu hỏi nhớ lại — chương 15.**

<details><summary>Vì sao một người có thể thấy "giằng xé" dù cả hai lựa chọn đều tốt?</summary><div class="inner">

Vì hai lựa chọn phục vụ hai value nằm đối diện nhau trên vòng tròn Schwartz — theo đuổi cái này thường phải trả giá bằng cái kia (Schwartz 2012). Giằng xé là dấu hiệu cần một thứ tự, không phải dấu hiệu mình yếu đuối.

</div></details>

<details><summary>Muốn biết mình thật sự coi trọng gì, nhìn vào đâu? Vì sao không nhìn vào việc mình có lịch sự ở chỗ làm?</summary><div class="inner">

Nhìn vào những việc mình làm khi không ai bắt buộc. Những hành vi xã hội chờ đợi thì nhiều người vẫn làm bất kể values, nên chúng ít nói lên values (Bardi & Schwartz 2003 gợi ý như vậy); value càng quan trọng thì càng lộ ra trong hành vi (Lee 2022).

</div></details>

<details><summary>(Nhớ lại chương 8 và chương 2.) Mục tiêu ngoại tại và "hành vi đến từ tình huống" liên quan gì tới việc viết ra values?</summary><div class="inner">

Mục tiêu nội tại gắn với well-being cao hơn mục tiêu ngoại tại (Kasser & Ryan 1996), nên khi xếp hạng values, nên để ý mình có đang đặt hình ảnh, tiền, danh tiếng lên trên những thứ nội tại không. Và vì hành vi đi theo tình huống, một value chỉ trở thành thật khi được viết thành câu hành động gắn vào tình huống cụ thể.

</div></details>

<details><summary>Ở Đông Á, khi chọn chỗ làm, loại "hợp" nào quan trọng tương đối hơn?</summary><div class="inner">

Hợp với nhóm làm việc và sếp trực tiếp (Oh 2014). Và nhìn chung, hợp với tổ chức (person–organization fit) dự báo thái độ với công việc nhiều hơn hiệu suất (Arthur 2006).

</div></details>

</div>

<h2 id="life-principles"><span class="num">16</span>Principles: biến values thành luật sống</h2>

Values cho biết hướng; principles là những luật cụ thể rút ra từ hướng đó, được quyết định **từ trước**, lúc đầu óc bình tĩnh, để dùng trong những lúc không bình tĩnh. Đây chính là lời giải cho hot–cold empathy gap ở [chương 2](#cold-hot): con người lúc "cold" đặt luật cho con người lúc "hot".

<h3 id="three-levels"><span class="num">16.1</span>Ba tầng: value, principle, bright line</h3>

| Tầng | Là gì | Đời thường | Công việc |
|---|---|---|---|
| Value | Điều mình coi trọng, một hướng đi | Trung thực | Chất lượng |
| Principle | Luật áp dụng cho nhiều tình huống, có thể có ngoại lệ được cân nhắc | Không nói điều mình biết là sai để có lợi | Code nào lên production cũng phải có người review |
| Bright line | Lằn ranh tuyệt đối, quyết một lần, không bàn lại trong lúc nóng | Không bao giờ ký giấy tờ mình chưa đọc | Không bao giờ chạy lệnh xoá trên database production khi chưa có backup |

Bright line có giá trị đặc biệt vì nó **không tốn sức quyết định**: không phải cân nhắc lại "lần này có nên không", nên trạng thái mệt hay cám dỗ không có chỗ để chen vào <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Cái giá là bright line cứng nhắc; vì vậy chỉ nên dành cho vài điều mà sai một lần đã phải trả giá đắt — mất lòng tin, mất tiền lớn, mất sức khoẻ.

<h3 id="structure-not-reminders"><span class="num">16.2</span>Luật phải nằm trong tình huống, không nằm trên poster</h3>

Bạn đoán xem: trước một bài kiểm tra có thể gian lận, nếu người ta được yêu cầu nhớ lại Mười Điều Răn, họ có gian lận ít hơn không?

Một nghiên cứu năm 2008 nói có, với hiệu ứng mức trung bình (d = 0,48). Khi 25 phòng thí nghiệm lặp lại với cùng một quy trình đăng ký trước, trên tổng cộng 5.786 người, phân tích chính (19 phòng thí nghiệm, 4.674 người) cho hiệu ứng d = −0,04 — gần như bằng không, còn hơi ngược chiều ([Verschuere 2018](#r-verschuere2018)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Tương tự, ký cam kết trung thực ở **đầu** tờ khai thay vì cuối — một ý tưởng từng được cơ quan nhà nước áp dụng — không làm người ta trung thực hơn qua sáu nghiên cứu với gần 5.800 người ([Kristal 2020](#r-kristal2020)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; bài báo gốc năm 2012 sau đó bị rút vào năm 2021 ([PNAS 2021](#r-shu2012retraction)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

Một phép so sánh trong phần mềm khớp đúng với kết quả này <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Muốn một cột trong database không bao giờ rỗng, có hai cách: viết comment "làm ơn đừng để rỗng", hoặc đặt constraint NOT NULL. Comment là lời nhắc đạo đức — nó dựa vào việc người viết code nhớ và muốn tuân theo đúng lúc đó. Constraint là thiết kế tình huống — nó làm cho việc vi phạm không xảy ra được. Principles của đời mình cũng cần ở dạng constraint: gắn vào lịch, vào tài khoản, vào cách sắp xếp nhà cửa, vào người mình chia sẻ ([chương 2](#situation)).

<h3 id="commitment-cost"><span class="num">16.3</span>Tự ràng buộc mình có hiệu quả, nhưng có cái giá của nó</h3>

Cách mạnh nhất để biến một principle thành constraint là **commitment device** — tự đặt ra một hệ quả thật nếu mình phá luật. Bằng chứng cho thấy cách này có tác dụng, nhưng không phải phép màu:

- Những người hút thuốc được đề nghị gửi tiền vào một tài khoản trong sáu tháng, sạch nicotine thì được nhận lại, không thì tiền đi làm từ thiện. Chỉ **11%** nhận lời; nhưng tính trên tất cả những người được đề nghị, khả năng bỏ thuốc thành công sau sáu tháng tăng 3 điểm phần trăm, và hiệu ứng còn khi kiểm tra bất ngờ sau 12 tháng ([Giné, Karlan & Zinman 2010](#r-gine2010)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.
- Ở một tài khoản tiết kiệm có cam kết, người dùng tự chọn kế hoạch và tự chọn mức phạt. Trung bình tiền tiết kiệm tăng mạnh, nhưng **55%** người tham gia vỡ kế hoạch và mất tiền phạt — có lẽ vì họ chọn mức phạt quá nhẹ để thắng được chính mình ([John 2020](#r-john2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.
- Tài khoản tiết kiệm có khoá ở [chương 10](#saving) là một ví dụ thành công ([Ashraf, Karlan & Yin 2006](#r-ashraf2006)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Hai bài học <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: một luật có hệ quả thật thì mạnh hơn một lời hứa suông; nhưng một luật **quá yếu để giữ** thì chỉ cộng thêm một khoản phạt vào thất bại. Vì vậy luật nên vừa đủ nhỏ để giữ được, hoặc đủ mạnh để không phá được — cái ở giữa là cái đắt nhất.

Còn mẹo nói "tôi không làm X" thay vì "tôi không thể làm X" — nghe như tuyên bố về con người mình thay vì một lệnh cấm bên ngoài — chỉ dựa trên một bài báo (bốn nghiên cứu nhỏ của cùng hai tác giả), và chưa thấy bản lặp lại độc lập nào ([Patrick & Hagtvedt 2012](#r-patrick2012)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Cứ thử nếu thấy hợp, nhưng đừng trông chờ một câu nói tự giữ được luật cho mình.

<h3 id="write-principles"><span class="num">16.4</span>Viết một principle tốt</h3>

Phương pháp <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>, ghép từ các chương trước:

1. **Mỗi principle gắn với một value** đã xếp hạng ở [§15.6](#find-values). Principle không có value đứng sau là luật của người khác.
2. **Có tình huống kích hoạt rõ ràng**, như implementation intention ở [§2.4](#situation): "Khi ai đó nhờ mình ký xác nhận, mình đọc hết trước khi ký."
3. **Ít thôi.** Theo đuổi quá nhiều hành vi cùng lúc làm giảm hiệu quả ([Wilson 2015](#r-wilson2015)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; năm đến bảy principles và một hai bright lines là đủ cho một đời bận rộn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.
4. **Chỉ sửa luật ở buổi review, không sửa giữa cơn cám dỗ.** Đây là cùng một nguyên tắc với việc buông mục tiêu ở [§11.5](#let-go): quyết định đổi luật lúc bình tĩnh, không lúc đang muốn phá luật.

Ví dụ minh hoạ — Minh ở chương 15 có value đứng đầu là benevolence (có mặt cho gia đình) và value thứ ba là security.

- Principle 1: *"Tối Chủ nhật ăn cơm với bố mẹ; nếu phải làm thêm, làm vào sáng thứ Bảy."*
- Principle 2: *"Mỗi lần nhận lương, chuyển 15% vào tài khoản dự phòng trước khi tiêu"* — một default tự động, như [§10.3](#saving).
- Bright line: *"Không vay tiêu dùng để mua thứ không cần cho sức khoẻ hay công việc."*

Khi một người bạn rủ góp vốn vào một dự án "chắc thắng" bằng tiền vay, Minh không phải cân nhắc lại lúc đang hào hứng: bright line đã quyết từ trước.

<div class="recall">

**Câu hỏi nhớ lại — chương 16.**

<details><summary>Principle khác bright line ở điểm nào, và khi nào nên dùng bright line?</summary><div class="inner">

Principle áp dụng rộng và có thể có ngoại lệ được cân nhắc; bright line là lằn ranh tuyệt đối, không bàn lại lúc nóng. Dùng bright line cho vài điều mà sai một lần đã rất đắt.

</div></details>

<details><summary>Vì sao một poster đạo đức hay một chữ ký cam kết không đủ để giữ principle?</summary><div class="inner">

Vì những lời nhắc như vậy không có tác dụng khi được kiểm tra nghiêm ngặt: nhớ lại Mười Điều Răn, d = −0,04 trong phân tích chính của bản lặp lại 25 phòng thí nghiệm (Verschuere 2018); ký ở đầu tờ khai không có tác dụng (Kristal 2020), và bài gốc đã bị rút năm 2021. Luật cần được đặt vào chính tình huống, như constraint chứ không phải comment.

</div></details>

<details><summary>(Nhớ lại chương 2.) Principles giải quyết vấn đề nào trong hot–cold empathy gap?</summary><div class="inner">

Lúc "cold", ta đánh giá thấp sức chi phối của trạng thái "hot". Principle là quyết định được đưa ra lúc cold để con người lúc hot không phải quyết lại.

</div></details>

<details><summary>Một commitment device có thể làm hại mình thế nào?</summary><div class="inner">

Khi mức ràng buộc quá yếu để giữ, mình vẫn phá luật và còn chịu thêm phạt — 55% người tham gia một tài khoản tiết kiệm cam kết đã vỡ kế hoạch và mất tiền (John 2020).

</div></details>

</div>

<h2 id="ethics"><span class="num">17</span>Đạo đức và nhân cách</h2>

[Chương 4 và 5](#impressions) nói về lòng tin giữa người với người và cách hàn gắn khi lòng tin bị tổn hại. Chương này đi sâu thêm một bước: vì sao người bình thường lúc trung thực lúc không, điều gì khiến một người tốt không giữ được mình, những gì chỉ là niềm tin suông, và nên làm gì sau khi mình sai.

<h3 id="mostly-honest"><span class="num">17.1</span>Con người trung thực hơn ta nghĩ</h3>

Bạn đoán xem: một chiếc ví đánh rơi có nhiều tiền hơn thì dễ được trả lại hơn, hay khó hơn?

Hơn 17.000 chiếc ví "đánh rơi" được mang tới quầy lễ tân ở 355 thành phố thuộc 40 nước. Gần như ở mọi nước, ví **càng nhiều tiền càng dễ được trả lại** — ngược với dự đoán của cả người thường lẫn các nhà kinh tế ([Cohn 2019](#r-cohn2019)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Các tác giả giải thích bằng lòng vị tha và cảm giác không muốn thấy mình là kẻ trộm — tiền càng nhiều, việc giữ lại càng rõ là ăn cắp. (Thứ hạng giữa các nước thì bị tranh cãi: ở Trung Quốc, đo bằng việc ví thật sự được trả lại cho thấy trung thực cao hơn nhiều so với đo bằng việc trả lời email ([Yang 2023](#r-yang2023)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.) Tổng hợp 90 nghiên cứu trong đó người ta tự gieo xúc xắc rồi tự báo kết quả để nhận tiền — nói dối không ai phát hiện được — cho thấy con người nói dối "ít đến bất ngờ" ([Abeler, Nosenzo & Raymond 2019](#r-abeler2019)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

Hệ quả <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: con người vốn gần với sự trung thực hơn những gì người hay hoài nghi vẫn nghĩ. Nhiều người có cơ hội gian lận cũng không gian lận hết mức có thể ([Abeler, Nosenzo & Raymond 2019](#r-abeler2019)) — nghĩa là những thói quen nhỏ bảo vệ sự trung thực có rất nhiều chỗ để phát huy.

<h3 id="slipping"><span class="num">17.2</span>Khi nào người tốt không giữ được mình</h3>

Tổng hợp 565 thí nghiệm với 44.050 lựa chọn cho thấy gian lận phụ thuộc cả tình huống — phần thưởng lớn cỡ nào, lời nói dối có hại ai không — lẫn con người, và các thí nghiệm trong phòng lab ghi nhận nhiều gian lận hơn các thí nghiệm thực địa ([Gerlach 2019](#r-gerlach2019)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Ba điều đáng biết nhất:

**Nạn nhân vô hình.** Khi lời nói dối chỉ hại một đối tượng trừu tượng — ngân sách của người làm thí nghiệm, một công ty — việc phải quyết định nhanh, dưới áp lực thời gian, khiến nhiều người nói dối hơn và nói dối nhiều hơn; khi nạn nhân là một người cụ thể, hiệu ứng này không còn ([Köbis 2019](#r-kobis2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. (Nghiên cứu nổi tiếng "trung thực cần thời gian" thì không lặp lại được ([Van der Cruyssen 2020](#r-vandercruyssen2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.)

- **Đời thường.** Khai thêm vài nghìn tiền taxi vào phiếu thanh toán công tác dễ hơn nhiều so với lấy vài nghìn từ ví một đồng nghiệp — dù về bản chất là như nhau.
- **Công việc.** Làm tròn số giờ trong worklog, hay báo "xong" một task còn thiếu test, cảm thấy vô hại vì "công ty" không có khuôn mặt. Trước khi quyết nhanh, hãy hình dung người cụ thể sẽ trả giá: đồng nghiệp nhận task tiếp theo, người dùng gặp lỗi <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

**Những câu tự bào chữa.** Bandura gọi là moral disengagement — các cơ chế giúp người tử tế làm điều có hại mà vẫn thấy mình ổn: biện minh rằng việc đó phục vụ mục đích tốt, nói giảm nói tránh, so mình với người còn tệ hơn, đẩy trách nhiệm cho người ra lệnh hoặc cho tập thể, coi nhẹ hậu quả, đổ lỗi cho nạn nhân và coi nạn nhân như không phải con người (dehumanization) ([Bandura 1999](#r-bandura1999)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Ở người trẻ 8–18 tuổi, moral disengagement tương quan r = 0,28 với hành vi gây hấn qua 27 mẫu với 17.776 người ([Gini 2014](#r-gini2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; ở nơi làm việc, moral disengagement đi kèm hành vi sai trái, và mối liên hệ này đi qua sự nhận biết đạo đức, phán đoán đạo đức và cảm giác tội lỗi dự kiến thấp hơn — một phân tích trung gian trên dữ liệu tương quan ([Ogunfowora 2022](#r-ogunfowora2022)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cách dùng thực tế <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: tập nhận ra chính những câu này khi chúng vang lên trong đầu mình — *"ai cũng làm thế"*, *"có tí thôi mà"*, *"sếp bảo thế"*, *"đáng đời họ"* — vì chính những câu đó giúp mình lờ đi tiếng nói của lương tâm trước một việc sai.

**Sa ngã dần dần, hay sa ngã một lần.** Có bằng chứng rằng những lời nói dối vì lợi cho bản thân lớn dần khi lặp lại, kèm phản ứng của amygdala trước chính lời nói dối của mình giảm dần ([Garrett 2016](#r-garrett2016)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>, và những vi phạm nhỏ mở đường cho vi phạm lớn hơn ([Welsh 2015](#r-welsh2015)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Nhưng một loạt thí nghiệm khác thấy hối lộ nặng *dễ xảy ra hơn* khi được đề nghị thẳng một lần so với qua nhiều bước nhỏ — nguyên văn các tác giả: "a steep cliff rather than a slippery slope" ([Köbis 2017](#r-kobis2017)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Cả hai hướng đều dựa trên nghiên cứu nhỏ. Cách đọc an toàn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: coi lời nói dối nhỏ đầu tiên là một quyết định thật, vì lặp lại nhiều lần thì cảm giác áy náy cũng nhạt dần; và đừng nghĩ mình an toàn chỉ vì chưa từng sai một bước nhỏ nào — một cám dỗ lớn đến bất ngờ cũng cần được dừng lại cân nhắc như vậy.

<h3 id="no-charms"><span class="num">17.3</span>Những cách tưởng có tác dụng mà không</h3>

Ba niềm tin phổ biến về đạo đức không còn đúng khi được kiểm tra lại:

- **Lời nhắc và chữ ký cam kết** — đã nói ở [§16.2](#structure-not-reminders) ([Verschuere 2018](#r-verschuere2018); [Kristal 2020](#r-kristal2020)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.
- **"Rửa tay là rửa được tội lỗi"** — kết quả gốc năm 2006 không lặp lại được trong các thí nghiệm độc lập; tổng hợp 15 nghiên cứu cho hiệu ứng nhỏ chung g = 0,17, và gần bằng không, g = 0,07, ở các phòng thí nghiệm độc lập ([Siev 2018](#r-siev2018); [Earp 2014](#r-earp2014)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Chương này không tìm thấy bằng chứng vững rằng một nghi thức — tắm rửa, quyên góp, một lời cầu nguyện — xoá được một việc sai khỏi lương tâm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>; hướng mà [§17.5](#after-wrong) gợi ý là sửa chính tác hại đó.
- **"Làm việc tốt rồi thì được phép buông"** (moral licensing) — tổng hợp cũ cho d > 0,30, nhưng sau khi hiệu chỉnh publication bias ước lượng còn d = −0,05 hoặc 0,18 tuỳ phương pháp ([Kuper & Bott 2019](#r-kuper2019)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>, và một bản lặp lại đăng ký trước với 932 người không thấy hiệu ứng ([Xiao 2024](#r-xiao2024)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Không cần e ngại việc tốt của mình — và cũng đừng lấy việc tốt làm cái cớ.

<h3 id="character-real"><span class="num">17.4</span>Nhân cách có thật</h3>

Tình huống quan trọng, nhưng con người cũng quan trọng. Phân tích lại 16 nghiên cứu với 5.002 người cho thấy đặc điểm **Honesty-Humility** — chân thành, công bằng, khiêm tốn, không tham — đi kèm khả năng gian lận thấp hơn rõ (odds ratio = 0,53), độc lập với các đặc điểm tính cách khác, với tình huống và với nhân khẩu học ([Heck 2018](#r-heck2018)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Tổng hợp 770 nghiên cứu cho thấy những đặc điểm tính cách dự báo được hành vi vì người khác phần lớn là những đặc điểm gắn với việc có cơ hội lợi dụng người khác hay không, dù các tương quan đều khiêm tốn, từ −0,18 đến 0,26 ([Thielmann 2020](#r-thielmann2020)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

- **Đời thường.** Người công bằng và khiêm tốn trong những chuyện nhỏ — chia hoá đơn, trả lại tiền thừa — có lẽ cũng mang Honesty-Humility cao, đặc điểm đi kèm ít lợi dụng người khác hơn khi có cơ hội <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Điều này đáng cân nhắc khi chọn bạn đời và bạn làm ăn.
- **Công việc.** Khi chọn người cùng làm một dự án, cách một người xử lý một lỗi nhỏ của chính họ — nhận hay đổ — nói lên nhiều điều hơn một buổi phỏng vấn trơn tru <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Nhân cách cũng gắn với việc sống tốt. Qua 130 nghiên cứu với 275.007 người, những phẩm chất đi cùng well-being mạnh nhất là hope (hy vọng), zest (sự hăng hái sống), gratitude (biết ơn), love (khả năng yêu thương và được yêu thương) và curiosity (tò mò), đều quanh r = 0,38–0,52; humility là phẩm chất duy nhất không có liên hệ đáng kể ([Casali & Feraco 2025](#r-casali2025)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — dữ liệu tương quan, và hope, zest phần nào trùng nghĩa với chính well-being.

<h3 id="after-wrong"><span class="num">17.5</span>Sau khi làm sai: guilt và shame</h3>

Hai cảm xúc sau một việc sai khác nhau ở **đối tượng**: guilt nhắm vào hành động ("mình đã làm một việc sai"), shame nhắm vào cả con người ("mình là người tệ"). Người dễ cảm thấy guilt có khuynh hướng vì người khác hơn một chút (r = 0,13, 63 nghiên cứu), còn với người dễ cảm thấy shame thì gần như không có liên hệ (r = −0,05, 47 nghiên cứu, không có ý nghĩa thống kê); cả hai con số phụ thuộc nhiều vào cách đo ([Tignor & Colvin 2017](#r-tignor2017)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Qua 108 nghiên cứu với 22.411 người, shame liên hệ với trầm cảm mạnh hơn (r = 0,43) so với guilt (r = 0,28) — nhưng hai kiểu guilt không lành mạnh, tự nhận trách nhiệm quá mức cho điều mình không kiểm soát được (r = 0,39) và cảm giác tội lỗi lơ lửng không gắn với việc gì (r = 0,42), cũng nặng như shame ([Kim 2011](#r-kim2011)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Và shame không phải lúc nào cũng xấu: khi thất bại **còn sửa được**, shame đi kèm hành động tích cực như giúp đỡ, tự sửa mình (g = 0,47); khi khó sửa, nó đi kèm ít hành động tích cực hơn (g = −0,34) ([Leach & Cidam 2015](#r-leach2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

- **Đời thường.** Lỡ lời làm bạn buồn: "mình đã nói một câu làm bạn tổn thương, mình sẽ xin lỗi" là guilt có ích; "mình đúng là đứa tồi" là shame — nếu kèm cảm giác không còn sửa được gì, nó dễ dẫn tới né mặt bạn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.
- **Công việc.** Deploy làm sập hệ thống: câu hỏi có ích không phải "mình tệ đến mức nào" mà là "còn sửa được gì": rollback, viết postmortem, thêm test. Tìm ra một việc cụ thể để sửa chính là thứ biến cảm giác khó chịu thành hành động thay vì trốn tránh <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Cách xin lỗi cho đúng đã có ở [§5.3](#apology).

<h3 id="promises"><span class="num">17.6</span>Lời hứa</h3>

Trò chuyện với nhau trước khi phải hợp tác làm mức hợp tác tăng mạnh, d = 1,01; trò chuyện trực tiếp còn mạnh hơn (d = 1,21) so với nhắn bằng chữ (d = 0,46) ([Balliet 2010](#r-balliet2010)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Trong một trò chơi kinh tế được thiết kế để tách hai động cơ, người ta giữ lời hứa *vì chính lời hứa*, không chỉ vì không muốn làm người khác thất vọng ([Vanberg 2008](#r-vanberg2008)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; và một thí nghiệm dựa trên tình huống giả định gợi ý rằng giữ lời với niềm tin có thể nuôi nhau thành một vòng: lời hứa tạo ra kỳ vọng, kỳ vọng làm việc giữ lời mạnh thêm ([Mischkowski, Stone & Stremitzer 2019](#r-mischkowski2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Ở 640 học sinh 10–14 tuổi tại Ấn Độ, một lời hứa tự nguyện sẽ trung thực làm giảm gian lận rõ rệt ([Kanngiesser 2021](#r-kanngiesser2021)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Một điều đáng chú ý <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: một lời hứa tự nguyện có tác dụng; còn dòng chữ ký in sẵn trên tờ khai ở [§16.2](#structure-not-reminders) thì không. Bằng chứng chưa chỉ ra chính xác thành phần nào tạo khác biệt. Cách dùng: **hứa ít, hứa thành lời, hứa với người cụ thể, rồi giữ** — mỗi lời hứa được giữ làm lời hứa tiếp theo của mình đáng tin hơn, với người khác và với chính mình.

<h3 id="humility"><span class="num">17.7</span>Biết mình có thể sai</h3>

**Intellectual humility** — nhận ra giới hạn hiểu biết của chính mình — đi kèm việc ít tin vào thông tin sai hơn (r = −0,15) và hành xử dựa trên bằng chứng nhiều hơn (r = 0,30), qua các nghiên cứu với tổng cộng 33.814 người ([Bowes & Fazio 2024](#r-bowes2024)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Người có intellectual humility cởi mở hơn với quan điểm đối lập ([Porter & Schumann 2018](#r-porter2018)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, và ít gọi một chính trị gia đổi ý là "kẻ lật lọng" hơn ([Leary 2017](#r-leary2017)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Đây là mặt đạo đức của actively open-minded thinking ở [§14.4](#think): đổi ý khi bằng chứng đổi là một dấu hiệu của sự chính trực, không phải của sự thiếu lập trường <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<div class="recall">

**Câu hỏi nhớ lại — chương 17.**

<details><summary>Vì sao làm tròn giờ trong worklog dễ hơn lấy tiền từ ví đồng nghiệp, dù cùng bản chất?</summary><div class="inner">

Vì nạn nhân trừu tượng: khi lời nói dối chỉ hại một đối tượng không có khuôn mặt, việc nghĩ nhanh đẩy người ta về phía tư lợi; với nạn nhân cụ thể thì không (Köbis 2019). Cách sửa: hình dung người cụ thể sẽ trả giá.

</div></details>

<details><summary>Kể bốn câu tự bào chữa thường gặp, và chúng làm gì?</summary><div class="inner">

"Ai cũng làm thế", "có tí thôi mà", "sếp bảo thế", "đáng đời họ". Chúng là các cơ chế moral disengagement — giúp mình lờ đi tiếng nói của lương tâm trước một việc sai (Bandura 1999; Gini 2014).

</div></details>

<details><summary>Sau khi làm sai, câu hỏi nào có ích hơn "mình tệ đến mức nào"?</summary><div class="inner">

"Còn sửa được gì?" — shame đi kèm hành động tích cực khi thất bại còn sửa được, và ít hành động tích cực hơn khi không (Leach & Cidam 2015). Hướng cảm xúc vào hành động (guilt) thay vì vào cả con người (shame) là cách đọc của sách.

</div></details>

<details><summary>(Nhớ lại chương 5 và chương 16.) Vì sao một lời hứa tự nguyện có tác dụng mà chữ ký in sẵn trên tờ khai thì không?</summary><div class="inner">

Bằng chứng chưa tách được thành phần nào; lời hứa tự nguyện làm giảm gian lận (Kanngiesser 2021), còn chữ ký in sẵn thì không (Kristal 2020). Và như chương 5, mất lòng tin vì thiếu chính trực thì khó lấy lại hơn — nên hứa ít và giữ lời là cách giữ lòng tin ngay từ đầu.

</div></details>

</div>

<h2 id="decide-values"><span class="num">18</span>Quyết định theo values</h2>

[Chương 12](#decisions) trả lời câu hỏi *làm sao đoán đúng* — nhìn từ bên ngoài, lùi ra xa, ước lượng hai lần. Chương này trả lời câu hỏi còn lại: *làm sao chọn đúng với điều mình coi trọng*, nhất là khi các values xung đột với nhau, và khi mình sống giữa một gia đình Việt Nam có những kỳ vọng riêng.

<h3 id="decide-early"><span class="num">18.1</span>Quyết định sớm, khi đầu óc còn tỉnh táo</h3>

[Chương 2](#cold-hot) đã có thí nghiệm món ăn vặt: chọn trước một tuần thì nghiêng về món lành mạnh, chọn ngay tại chỗ thì đổi sang món kia. Một loạt thí nghiệm thực địa sau này cho cùng hướng với bữa trưa: khi sinh viên được phân ngẫu nhiên đặt món từ trước hay ngay lúc sắp ăn, đặt trước thì bữa ăn ít hơn khoảng 100 calo, tức khoảng 10% — dù ở một nghiên cứu khác với nhân viên văn phòng, nơi nhóm "đặt lúc trưa" vẫn phải chờ một lúc mới được ăn, mức giảm chỉ khoảng 5% và chỉ gần đạt ý nghĩa thống kê ([VanEpps, Downs & Loewenstein 2016](#r-vanepps2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Hiệu ứng có thật nhưng vừa phải.

Có một lời giải thích hấp dẫn cho chuyện này: tương lai xa khiến ta nghĩ trừu tượng hơn, nên values lên tiếng nhiều hơn. Một nghiên cứu với sinh viên thấy values dự báo dự định cho một tình huống vài tháng nữa (r = 0,27) tốt hơn hẳn cho một tình huống ngay trong tuần (r = 0,07) ([Eyal 2009](#r-eyal2009)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Nhưng lý thuyết đứng sau nó — construal-level theory, "khoảng cách làm tâm trí trừu tượng hơn" — vừa thất bại trong một kiểm tra đăng ký trước ở 27 nước với 11.775 người: hiệu ứng của khoảng cách thời gian là d = 0,08, so với d = 0,92 trong nghiên cứu gốc ([Calderon 2026](#r-calderon2026)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; các tác giả gốc phản bác về phương pháp ([Liberman & Levit-Mor 2026](#r-liberman2026)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, nên cuộc tranh luận chưa khép lại.

Cách đọc an toàn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: **quyết sớm vẫn đáng làm**, nhưng lý do vững là hot–cold empathy gap và present bias ở [chương 2](#cold-hot), không phải chuyện "nghĩ xa thì tự nhiên có nguyên tắc". Và vì đến lúc hành động, mình dễ bị sự tiện lợi cuốn đi, hãy **làm cho việc đổi ý tại chỗ trở nên bất tiện** — đúng như principles ở [chương 16](#structure-not-reminders).

<h3 id="score-values"><span class="num">18.2</span>Viết values ra trước một quyết định lớn</h3>

Bằng chứng tốt nhất về việc này đến từ y khoa, nơi bệnh nhân phải chọn giữa các cách điều trị. Gộp các thử nghiệm ngẫu nhiên từ 33 bài báo về 43 phương pháp: việc yêu cầu người ta nói rõ values của mình trước khi chọn làm giảm 4 điểm phần trăm những lựa chọn trái với chính values họ đã nói, và giảm hối tiếc về sau một chút (SMD = −0,20); phương pháp có cấu trúc nhất — chấm điểm từng phương án theo từng value, nhân với mức quan trọng — cho nhiều lựa chọn khớp values nhất ([Witteman 2021](#r-witteman2021)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Hiệu ứng nhỏ, và mới được chứng minh cho quyết định y khoa; áp dụng cho chuyện nghề nghiệp, gia đình là một suy luận <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span> — nhưng là một suy luận ít tốn kém để thử.

Ví dụ minh hoạ — Minh ở [chương 15](#find-values) nhận được hai lời mời làm việc, bên cạnh công việc hiện tại. Thứ tự values của Minh là benevolence → self-direction → security → achievement; Minh cho trọng số 4, 3, 2, 1. Điểm 1–5 dưới đây là Minh tự chấm, chỉ để minh hoạ cách tính:

| Phương án | Benevolence ×4 (gần mẹ) | Self-direction ×3 (tự chọn việc học, việc làm) | Security ×2 (thu nhập ổn định) | Achievement ×1 (lên senior) | Tổng |
|---|---|---|---|---|---|
| Ở lại công ty hiện tại | 5 → 20 | 2 → 6 | 4 → 8 | 2 → 2 | **36** |
| Công ty ở thành phố khác, lương cao | 1 → 4 | 3 → 9 | 5 → 10 | 5 → 5 | **28** |
| Việc remote cho công ty nước ngoài | 5 → 20 | 4 → 12 | 3 → 6 | 4 → 4 | **42** |

Con số cuối cùng không phải là câu trả lời; nó giống một tấm gương <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Nếu Minh nhìn bảng và thấy *khó chịu* với kết quả, đó là dữ liệu: hoặc trọng số chưa đúng với mình, hoặc có một value chưa được viết ra. Giá trị thật của bảng là buộc mình nói rõ mình đang đánh đổi cái gì.

<h3 id="sacred"><span class="num">18.3</span>Khi các values xung đột</h3>

Bạn đoán xem: với một người coi một điều là thiêng liêng, đề nghị bồi thường bằng tiền để họ nhượng bộ điều đó sẽ làm họ dễ đồng ý hơn, hay ngược lại?

Trong các khảo sát thực nghiệm với 601 người định cư Israel, 535 người tị nạn Palestine và 719 sinh viên Palestine, ở những người coi một vấn đề là không thể đánh đổi "dù lợi ích lớn đến đâu", thêm tiền vào một thoả thuận lại làm tăng giận dữ và tăng ủng hộ bạo lực; còn một cử chỉ nhượng bộ mang tính biểu tượng, không thêm chút lợi ích vật chất nào, lại làm giảm — ở người định cư, odds ủng hộ bạo lực ở mức mạnh giảm còn khoảng một phần tư ([Ginges 2007](#r-ginges2007)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Các thí nghiệm khác cũng thấy người ta phẫn nộ khi thấy người khác đem một sacred value ra cân với tiền — càng cân nhắc lâu, càng bị phán xét nặng ([Tetlock 2000](#r-tetlock2000)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

- **Đời thường.** Nếu với bố mẹ, "con có mặt" là điều thiêng liêng, thì gửi thêm tiền thay cho việc về thăm có thể làm họ buồn hơn chứ không vui hơn; một cuộc gọi đều đặn, một bữa cơm — những cử chỉ biểu tượng — có thể chạm tới họ nhiều hơn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.
- **Công việc.** Với một team coi chất lượng là nguyên tắc, đề nghị thưởng thêm để "ship nhanh, bỏ qua review lần này" có thể làm họ mất động lực hơn là có thêm động lực <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Có hai điều nữa đáng biết. Người giữ "protected values" — values không chịu đánh đổi — không hẳn là không quan tâm tới hậu quả: khi được hỏi lần lượt ở từng mức hậu quả cụ thể, thay vì một câu "chấp nhận hay không", họ lại nhạy với mức hậu quả *hơn cả* người không giữ protected values ([Bartels & Medin 2007](#r-bartels2007)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>, một nghiên cứu nhỏ; nên với người thân có nguyên tắc cứng, bày rõ hệ quả của từng phương án có thể hiệu quả hơn tranh cãi về nguyên tắc <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Và niềm tin rằng hai phương án ngang ngửa nhau tự khiến ta trì hoãn quyết định thì không còn đúng: 40 bản lặp lại với 26.703 người không tái hiện được hiệu ứng này một cách ổn định ([Evangelidis, Levav & Simonson 2023](#r-evangelidis2023)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Nếu bạn cứ dời một quyết định mãi, hãy tìm nguyên nhân khác: sợ, thiếu thông tin, hay không có hạn chót <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="future-self"><span class="num">18.4</span>Mình của mười năm sau</h3>

Trên 4.963 người Mỹ được theo dõi mười năm, những người thấy mình của mười năm sau **giống** mình hiện tại hơn có mức hài lòng cuộc sống cao hơn mười năm sau, kể cả khi đã tính mức hài lòng ban đầu — mối liên hệ nhỏ (β = 0,066), và cả việc kỳ vọng mình tệ đi lẫn kỳ vọng mình tốt lên đều đi kèm hài lòng thấp hơn ([Reiff, Hershfield & Quoidbach 2020](#r-reiff2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Còn các bài tập cho người ta thấy khuôn mặt già đi của mình để khuyến khích tiết kiệm thì bằng chứng còn mỏng: bài báo nổi tiếng gồm bốn thí nghiệm nhỏ, mỗi thí nghiệm 21–50 người, phần lớn đo bằng lựa chọn với tiền giả định ([Hershfield 2011](#r-hershfield2011)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>.

Cách dùng <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: khi cân nhắc một quyết định lớn, hãy coi con người mình của mười năm sau là **chính mình**, chứ không phải một người lạ nào đó sẽ "lo chuyện đó sau". Câu hỏi "Minh 37 tuổi sẽ biết ơn hay trách Minh 27 tuổi về lựa chọn này?" là cách lùi ra xa của [§12.2](#distance-decide), hướng về phía tương lai.

<h3 id="family-culture"><span class="num">18.5</span>Sống theo values trong một gia đình Việt</h3>

Đây là chỗ nhiều người trẻ Việt Nam thấy khó xử nhất: tự chủ có phải là cãi lời bố mẹ không? Bằng chứng trả lời khá rõ: **không**.

**Tự chủ không phải là chủ nghĩa cá nhân.** Ở 559 sinh viên tại Mỹ, Nga, Thổ Nhĩ Kỳ và Hàn Quốc, việc làm theo các tập tục tập thể — kể cả trung thành với nhóm và tôn trọng thứ bậc — *một cách tự nguyện* đi kèm well-being cao hơn (β = 0,27), và mối liên hệ này giống nhau ở cả bốn nước ([Chirkov 2003](#r-chirkov2003)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Điều đi kèm well-being rõ hơn không phải là mình làm theo truyền thống nhiều hay ít, mà là mình làm vì tán thành hay vì bị ép và sợ cảm giác tội lỗi. Ở sinh viên tám nước, kể cả Philippines, Malaysia, Trung Quốc, Nhật Bản, người châu Á báo cáo được tự chủ ít hơn, nhưng việc ba nhu cầu nền được đáp ứng dự báo well-being *mạnh như nhau ở mọi nền văn hoá* ([Church 2013](#r-church2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Ba nhu cầu ở [chương 7](#needs) không phải là thứ chỉ dành cho người phương Tây.

**Chữ hiếu có hai phần.** Thang đo dual filial piety tách hiếu thành hai loại: *reciprocal filial piety* — biết ơn và chăm sóc cha mẹ vì tình cảm, và *authoritarian filial piety* — vâng lời và làm tròn bổn phận theo vai vế. Ở 297 sinh viên Việt Nam, mức coi trọng trung bình với loại thứ nhất là 6,14 trên thang 7, với loại thứ hai là 3,95 ([Różycka-Tran 2021](#r-rozyckatran2021)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span> — một mẫu tiện lợi ở một trường đại học tại Hà Nội, nhưng là dữ liệu Việt Nam hiếm hoi. Nghĩa là ít nhất trong mẫu sinh viên này, hiếu trước hết là biết ơn và chăm sóc — thứ họ coi là rất quan trọng — còn vâng lời theo vai vế chỉ được coi trọng ở mức lưng chừng. Có thể tách hai phần này ra khi cân nhắc bổn phận của mình với cha mẹ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

**Giúp gia đình có thể là nguồn ý nghĩa.** Ở 752 thiếu niên Mỹ gốc Mỹ Latin, châu Á và châu Âu viết nhật ký hằng ngày, những ngày giúp gia đình không phải là ngày căng thẳng hơn mà là ngày vui hơn, phần lớn nhờ cảm giác làm tròn vai trò của mình ([Telzer & Fuligni 2009](#r-telzer2009)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Ở người con chăm cha mẹ già, người thật sự coi trọng chữ hiếu cảm thấy gánh nặng chăm sóc nhẹ hơn, còn cảm giác "bắt buộc phải làm" đơn thuần thì không giúp gì ([Pan, Chen & Yang 2022](#r-pan2022)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Cùng một hướng với Chirkov: điều mình làm vì tán thành đi kèm sống tốt hơn, còn điều mình làm chỉ vì bổn phận thì không thấy mang lại lợi ích ấy.

**Khi phải nói không.** Người châu Á ít chủ động xin hỗ trợ hơn vì sợ ảnh hưởng tới quan hệ, và được lợi nhiều hơn từ kiểu hỗ trợ không cần mở lời ([Taylor 2004](#r-taylor2004); [Taylor 2007](#r-taylor2007)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Ở 773 học sinh Đài Loan, cả bốn nhóm — kể cả nhóm hiếu thảo nhất — đều ít dùng nhất cách đơn giản là từ bỏ mong muốn của mình khi bất đồng với cha mẹ; nhóm coi trọng hiếu kiểu biết ơn — chăm sóc kìm lại, không để bất đồng bùng lên, nhiều hơn các nhóm khác, và loại hiếu này đi kèm ít xung đột hơn loại hiếu vâng lời ([Yeh & Bedford 2004](#r-yeh2004)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Và khi người thân thiết quyết định thay, trẻ em ít mất động lực hơn nếu thấy gần gũi với người đó — có lẽ vì sự gần gũi giúp trẻ biến lựa chọn của người khác thành lựa chọn của mình; nhưng cảm giác tự chủ vẫn quan trọng ở mọi mức gần gũi ([Bao & Lam 2008](#r-bao2008)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>.

Ghép lại thành một cách làm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>, không phải một công thức:

1. **Tách phần mình tán thành khỏi phần mình chỉ đang chịu đựng.** Thường phần biết ơn và chăm sóc mình tán thành trọn vẹn; phần vâng lời theo vai thì cần xét từng việc.
2. **Tìm phần trong mong muốn của bố mẹ mà mình thật sự đồng ý.** Bố mẹ muốn con ổn định — mình cũng muốn mình an toàn; khác nhau ở cách. Bắt đầu từ mục tiêu chung.
3. **Bày rõ hệ quả thay vì tranh cãi nguyên tắc** ([§18.3](#sacred)), và dùng những cử chỉ biểu tượng của sự tôn trọng — nói riêng, đúng lúc, bằng giọng của người con.
4. **Giữ tình cảm khi bất đồng.** Lòng biết ơn và sự chăm sóc là thứ giữ cho bất đồng không lớn thêm.

Ví dụ minh hoạ — Minh chọn việc remote ở [§18.2](#score-values). Bố mẹ lo vì "làm cho công ty nước ngoài thì không có biên chế, không ổn định". Thay vì cãi về chuyện biên chế, Minh nói từ mục tiêu chung: "Con cũng muốn ổn định như bố mẹ muốn. Con đã để sẵn quỹ dự phòng sáu tháng lương, và việc này cho con ở gần nhà, tối nào cũng ăn cơm với bố mẹ được." Minh không làm theo ý bố mẹ; nhưng cũng không làm tổn thương phần chữ hiếu mà cả Minh lẫn bố mẹ cùng coi trọng.

<h3 id="decision-protocol"><span class="num">18.6</span>Một quyết định lớn, từ đầu đến cuối</h3>

Ghép Phần V với [chương 12](#decisions) thành một quy trình <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Hình dưới giúp nối hai chương lại với nhau:

```mermaid
flowchart TD
  A["① Đối chiếu bright lines<br/>phương án nào vi phạm thì loại"] --> B["② Chấm điểm theo values đã xếp hạng<br/>(§18.2)"]
  B --> C["③ Kiểm tra độ chính xác<br/>outside view, lùi ra xa, ước lượng hai lần<br/>(chương 12)"]
  C --> D["④ Hỏi người của mười năm sau<br/>(§18.4)"]
  D --> E["⑤ Bàn với người thân<br/>từ mục tiêu chung (§18.5)"]
  E --> F["⑥ Quyết định,<br/>rồi cam kết"]
  F --> G["⑦ Nhìn lại: chấm theo quá trình,<br/>không theo kết quả (§12.5)"]
  G -.->|"phát hiện value chưa viết ra"| H["Sửa bảng values<br/>ở buổi review hằng năm"]
```

1. **Bright lines trước.** Phương án nào vượt lằn ranh thì loại luôn, không chấm điểm. Đây là lý do bright line tiết kiệm sức quyết định ([§16.1](#three-levels)).
2. **Chấm điểm theo values** đã xếp hạng, và để ý cảm giác của mình với kết quả.
3. **Kiểm tra độ chính xác** của những gì mình đang tin về từng phương án: những người đã chọn như vậy thường ra sao, mình sẽ khuyên một người bạn thế nào, ước lượng hai lần ([§12.1](#outside-view), [§12.2](#distance-decide)).
4. **Hỏi người của mười năm sau.**
5. **Bàn với người thân** từ mục tiêu chung, bày rõ hệ quả.
6. **Quyết định, rồi cam kết** — người chọn dứt khoát hài lòng với lựa chọn hơn người cứ để ngỏ ([§12.4](#regret)).
7. **Nhìn lại và đánh giá theo quá trình**, và nếu phát hiện một value mình chưa từng viết ra, sửa bảng values ở buổi review hằng năm — không sửa giữa lúc đang bực.

<div class="recall">

**Câu hỏi nhớ lại — chương 18.**

<details><summary>Quyết định sớm có ích vì "nghĩ xa thì trừu tượng hơn" không? Vậy vì sao vẫn nên quyết sớm?</summary><div class="inner">

Lý do "khoảng cách làm tâm trí trừu tượng hơn" vừa thất bại trong một kiểm tra 27 nước (d = 0,08 so với 0,92 của bản gốc; Calderon 2026). Lý do vững để quyết sớm là hot–cold empathy gap và present bias (chương 2); và nên làm cho việc đổi ý tại chỗ trở nên bất tiện.

</div></details>

<details><summary>Vì sao gửi thêm tiền có thể không thay được việc về thăm bố mẹ?</summary><div class="inner">

Khi một điều là sacred value, đem nó ra cân với tiền có thể gây phẫn nộ, còn cử chỉ biểu tượng lại có tác dụng (Ginges 2007; Tetlock 2000). Áp dụng vào gia đình là suy luận, nhưng cùng cơ chế.

</div></details>

<details><summary>Tự chủ có nghĩa là không nghe lời bố mẹ không?</summary><div class="inner">

Không. Làm theo tập tục tập thể một cách tự nguyện đi kèm well-being cao hơn, như nhau ở bốn nước (Chirkov 2003); điều quan trọng là làm vì tán thành hay vì bị ép.

</div></details>

<details><summary>(Nhớ lại chương 12 và chương 16.) Trong quy trình một quyết định lớn, vì sao đối chiếu bright lines đứng trước chấm điểm, và chấm điểm đứng trước kiểm tra độ chính xác?</summary><div class="inner">

Bright lines loại ngay những phương án không bàn tới, nên đỡ tốn sức. Chấm điểm theo values trả lời "mình muốn gì"; kiểm tra độ chính xác (outside view, lùi ra xa, ước lượng hai lần ở chương 12) trả lời "điều mình tin về từng phương án có đúng không". Biết mình muốn gì trước, rồi mới kiểm tra.

</div></details>

</div>


<h2 id="closing"><span class="num">19</span>Lời kết: một đời được xây từ những ngày bình thường</h2>

Cuốn sách bắt đầu bằng bốn câu hỏi, và câu trả lời cho cả bốn hoá ra có chung một điểm. Ta hiểu mình kém hơn ta tưởng — nên thay vì tin vào ý định, ta sắp xếp tình huống và học từ dữ liệu của chính mình. Ta đoán sai về người khác theo một chiều nhất định — nên thay vì đoán, ta hỏi, ta chủ động, ta nói thật mà vẫn tử tế. Ta dễ để những thước đo bên ngoài quyết định thay mình — nên ta chọn lại thước đo theo ba nhu cầu nền và những gì mình thật sự coi trọng. Và ta không kiểm soát được phần lớn những gì xảy đến — nên ta tách phần đổi được khỏi phần không đổi được, hành động với phần thứ nhất, chấp nhận phần thứ hai, và không đi một mình.

Không điều nào ở đây cần làm hoàn hảo. Habit không hỏng vì một ngày lỡ; quan hệ không hỏng vì một lần cãi nhau; một quyết định tốt không thành tồi vì gặp vận xui. Điều làm nên một đời là **những gì lặp lại qua hàng nghìn ngày bình thường**: những giờ ngủ đều, những bữa tối cùng người thân, những khoản tiết kiệm tự động, những buổi học ngắn mà đều, những lần quay lại sau khi lỡ. Chúng nhỏ đến mức trông như không đáng kể, nhưng chính chúng cộng dồn lại qua năm tháng.

Phần V dừng ở chỗ khoa học dừng lại, và trao phần còn lại cho bạn. Phần đó là **một trang của riêng bạn** — không nằm trong cuốn sách này, vì không ai viết hộ được: values của bạn đã xếp hạng, mỗi value kèm một câu hành động ([§15.6](#find-values)); năm đến bảy principles và một hai bright lines ([§16.4](#write-principles)); và quy trình cho một quyết định lớn ([§18.6](#decision-protocol)). Hãy viết trang đó một lần cho thật kỹ, đọc lại mỗi năm một lần, và chỉ sửa ở buổi đọc lại ấy — values đổi chậm ([§15.3](#values-change)), nên một trang viết cẩn thận thường sẽ dùng được nhiều năm. Khi đứng trước một lựa chọn khó, đó là trang để bạn quay về đối chiếu.

Hãy dùng cuốn sách như một bản đồ, không phải một bản án. Khi một điều trong đây không đúng với bạn, hãy tin dữ liệu của chính bạn hơn — đó cũng là điều cuốn sách này dạy.

<h2 id="glossary"><span class="num">B</span>Phụ lục: glossary</h2>

**Đọc con số.** Phần lớn con số trong sách là effect size — độ lớn của một tác động. **d** và **g** đo khoảng cách giữa hai nhóm theo đơn vị độ lệch chuẩn: khoảng 0,2 là nhỏ, 0,5 là vừa, 0,8 là lớn. **r** là hệ số tương quan, từ −1 đến 1: 0,1 là nhỏ, 0,3 là vừa. **RR** và **HR** so nguy cơ giữa hai nhóm: 1 là ngang nhau, 0,83 là thấp hơn 17%, 1,35 là cao hơn 35%. **OR** so odds (tỷ lệ có/không) chứ không phải nguy cơ; chỉ khi biến cố hiếm thì OR mới đọc gần như RR. Δ và δ cùng họ với d; β là hệ số hồi quy chuẩn hoá, đọc gần như r. Tương quan không cho biết điều gì gây ra điều gì; thử nghiệm ngẫu nhiên thì có.

<dl class="gloss">
<dt>Active-constructive responding</dt><dd>Đáp lại tin vui của người khác bằng sự hào hứng và câu hỏi thêm; kiểu đáp lại gắn với quan hệ tốt hơn (chương 6).</dd>
<dt>Actively open-minded thinking</dt><dd>Thói quen chủ động tìm bằng chứng đi ngược niềm tin của mình (chương 14).</dd>
<dt>Affect labeling</dt><dd>Gọi tên cảm xúc thành lời, làm giảm phản ứng cảm xúc (chương 3).</dd>
<dt>Authoritarian / reciprocal filial piety</dt><dd>Hai phần của chữ hiếu theo thang đo dual filial piety: vâng lời và làm tròn bổn phận theo vai vế, so với biết ơn và chăm sóc cha mẹ vì tình cảm (chương 18).</dd>
<dt>Bright line</dt><dd>Lằn ranh tuyệt đối, quyết một lần lúc bình tĩnh, không bàn lại lúc nóng (chương 16).</dd>
<dt>Choice overload</dt><dd>Giả thuyết rằng nhiều lựa chọn làm tê liệt; trung bình gần như không có (chương 12).</dd>
<dt>Commitment device</dt><dd>Cách tự ràng buộc mình bằng một hệ quả thật nếu phá luật, như tài khoản tiết kiệm có khoá (chương 16).</dd>
<dt>Construal-level theory</dt><dd>Lý thuyết cho rằng khoảng cách (thời gian, không gian, xã hội) khiến tâm trí nghĩ trừu tượng hơn; vừa thất bại trong một kiểm tra lớn (chương 18).</dd>
<dt>Coping flexibility</dt><dd>Khả năng đổi cách đối phó cho hợp với tình huống (chương 3, 13).</dd>
<dt>Crowd within</dt><dd>Trung bình hai lần ước lượng của chính mình chính xác hơn từng lần (chương 12).</dd>
<dt>Default</dt><dd>Lựa chọn được cài sẵn, xảy ra nếu mình không làm gì (chương 10).</dd>
<dt>Deliberate practice</dt><dd>Luyện tập có chủ đích, có phản hồi, nhắm vào điểm yếu (chương 14).</dd>
<dt>Doormat effect</dt><dd>Tha thứ cho người không sửa sai làm giảm lòng tự trọng của người tha thứ (chương 5).</dd>
<dt>Dual concern</dt><dd>Mô hình hai trục trong xung đột: quan tâm đến người kia và giữ vững điều mình cần (chương 5).</dd>
<dt>Ego depletion</dt><dd>Giả thuyết ý chí là nguồn lực cạn dần; không lặp lại được khi kiểm tra lại (chương 2).</dd>
<dt>Emotional well-being</dt><dd>Chất lượng cảm xúc của những giờ đã sống (chương 7).</dd>
<dt>Exponential growth bias</dt><dd>Xu hướng ước lượng tăng trưởng kép như thể nó chỉ tăng đều, nên đánh giá thấp lãi kép và phí (chương 10).</dd>
<dt>Focusing illusion</dt><dd>Một yếu tố có vẻ quan trọng hơn thực tế khi ta đang nghĩ về nó (chương 12).</dd>
<dt>Future-self continuity</dt><dd>Mức mình thấy con người tương lai của mình là cùng một người với mình hiện tại (chương 18).</dd>
<dt>Guilt / shame</dt><dd>Cảm xúc sau việc sai nhắm vào hành động ("mình đã làm sai"), so với nhắm vào cả con người ("mình là người tệ") (chương 17).</dd>
<dt>Habit</dt><dd>Liên kết được học giữa bối cảnh (cue) và phản ứng, tự diễn ra mà gần như không cần ý định (chương 2).</dd>
<dt>Honesty-Humility</dt><dd>Đặc điểm tính cách gồm chân thành, công bằng, khiêm tốn, không tham; dự báo ít gian lận (chương 17).</dd>
<dt>Hot–cold empathy gap</dt><dd>Lúc bình tĩnh, ta đánh giá thấp sức chi phối của trạng thái mệt, thèm, giận lên chính mình (chương 2).</dd>
<dt>Implementation intention</dt><dd>Kế hoạch dạng "Khi [tình huống] thì tôi [hành động]" (chương 2).</dd>
<dt>Inside view / outside view</dt><dd>Dự đoán từ chính kế hoạch của mình, so với từ thống kê của những trường hợp tương tự (chương 12).</dd>
<dt>Intellectual humility</dt><dd>Nhận ra giới hạn hiểu biết của chính mình và sẵn sàng đổi ý khi bằng chứng đổi (chương 17).</dd>
<dt>Intention–behaviour gap</dt><dd>Khoảng cách giữa ý định và hành vi thật (chương 2).</dd>
<dt>Intrinsic / extrinsic goals</dt><dd>Mục tiêu nội tại (gắn bó, phát triển, đóng góp, sức khoẻ) và ngoại tại (tiền, hình ảnh, danh tiếng) (chương 8).</dd>
<dt>Life evaluation</dt><dd>Mức đánh giá cuộc đời mình khi nhìn lại (chương 7).</dd>
<dt>Liking gap</dt><dd>Sau một cuộc trò chuyện, ta đánh giá thấp mức người kia thích mình (chương 4).</dd>
<dt>Maximizing / satisficing</dt><dd>Tìm phương án tốt nhất, so với chọn phương án đủ tốt (chương 8).</dd>
<dt>Meta-analysis</dt><dd>Phương pháp gộp kết quả của nhiều nghiên cứu để ước lượng một tác động chung.</dd>
<dt>Metacognition</dt><dd>Suy nghĩ về chính cách mình suy nghĩ (chương 7).</dd>
<dt>Mood repair</dt><dd>Hành vi nhằm sửa tâm trạng ngay lập tức, như trì hoãn để tránh cảm giác khó chịu (chương 3).</dd>
<dt>Moral disengagement</dt><dd>Các cơ chế tự bào chữa giúp người tử tế làm điều có hại mà vẫn thấy mình ổn (chương 17).</dd>
<dt>Moral licensing</dt><dd>Giả thuyết làm việc tốt rồi thì cho phép mình làm điều xấu; bằng chứng yếu sau khi kiểm tra lại (chương 17).</dd>
<dt>Outcome bias</dt><dd>Đánh giá một quyết định theo kết quả thay vì theo quá trình (chương 12).</dd>
<dt>Peak–end rule</dt><dd>Ký ức về một trải nghiệm bị chi phối bởi khoảnh khắc mạnh nhất (đỉnh) và khoảnh khắc cuối; với trải nghiệm khó chịu, đỉnh là lúc tệ nhất (chương 7).</dd>
<dt>Person–organization fit</dt><dd>Mức một người hợp với tổ chức, trong đó values là một chiều hay được đo; dự báo thái độ với công việc nhiều hơn hiệu suất (chương 15).</dd>
<dt>Perspective-taking / perspective-getting</dt><dd>Tưởng tượng góc nhìn người khác, so với hỏi để biết góc nhìn đó (chương 4).</dd>
<dt>Phubbing</dt><dd>Dùng điện thoại khi đang ở cùng người khác (chương 6).</dd>
<dt>Planning fallacy</dt><dd>Dự đoán thời gian và chi phí lạc quan hơn thực tế, kể cả khi đã từng sai (chương 12).</dd>
<dt>Positive psychology interventions</dt><dd>Các bài tập nâng hạnh phúc như nhật ký biết ơn; tác dụng nhỏ (chương 7).</dd>
<dt>Posttraumatic growth</dt><dd>Ý tưởng con người phát triển nhờ biến cố; phần tự báo cáo không khớp thay đổi thật (chương 13).</dd>
<dt>Present bias</dt><dd>Phóng đại giá trị của thứ có ngay so với thứ đến sau (chương 2).</dd>
<dt>Primary / secondary control</dt><dd>Thay đổi thế giới cho hợp với mình, so với thay đổi mình và mục tiêu cho hợp với thế giới (chương 13).</dd>
<dt>Principle</dt><dd>Luật cụ thể rút ra từ một value, áp dụng cho nhiều tình huống, có thể có ngoại lệ được cân nhắc (chương 16).</dd>
<dt>Process goal</dt><dd>Mục tiêu đặt vào hành vi mình kiểm soát, không vào kết quả cuối (chương 11).</dd>
<dt>Protected / sacred values</dt><dd>Values mà người ta không chịu đánh đổi, nhất là lấy tiền; đem chúng ra cân với tiền thường gây phẫn nộ (chương 18).</dd>
<dt>Psychological inoculation</dt><dd>"Tiêm phòng" bằng cách cho thấy trước các kỹ thuật thao túng ở liều nhỏ (chương 8).</dd>
<dt>Publication bias</dt><dd>Nghiên cứu có kết quả "đẹp" dễ được đăng hơn, làm hiệu ứng trong các tổng hợp bị thổi phồng.</dd>
<dt>RCT</dt><dd>Thử nghiệm ngẫu nhiên có đối chứng: cách tốt nhất để biết điều gì gây ra điều gì.</dd>
<dt>Reappraisal</dt><dd>Đổi cách hiểu một tình huống để đổi cảm xúc của mình (chương 3).</dd>
<dt>Replication crisis</dt><dd>Việc nhiều kết quả nổi tiếng không lặp lại được khi kiểm tra cẩn thận (chương 0).</dd>
<dt>Resilience</dt><dd>Quỹ đạo giữ được mức hoạt động ổn định sau biến cố (chương 13).</dd>
<dt>Retrieval practice</dt><dd>Tự nhớ lại mà không nhìn tài liệu (chương 14).</dd>
<dt>Reward prediction error</dt><dd>Chênh lệch giữa phần thưởng nhận được và phần thưởng dự đoán, được dopamine mã hoá (chương 8).</dd>
<dt>Self-compassion</dt><dd>Đối xử với chính mình như với một người bạn khi thất bại (chương 3, 13).</dd>
<dt>Self-concordant goals</dt><dd>Mục tiêu xuất phát từ giá trị và quan tâm thật của mình (chương 11).</dd>
<dt>Self-determination theory</dt><dd>Lý thuyết về ba nhu cầu nền: tự chủ, năng lực, gắn kết (chương 7).</dd>
<dt>Self-distancing</dt><dd>Nhìn chuyện của mình như người ngoài, ví dụ tự gọi mình bằng tên (chương 3, 12).</dd>
<dt>Self-efficacy</dt><dd>Niềm tin rằng mình làm được một việc cụ thể (chương 2).</dd>
<dt>Social comparison</dt><dd>So sánh mình với người khác; so với người hơn mình thường làm mình thấy kém đi (chương 8).</dd>
<dt>Spacing</dt><dd>Chia việc học ra nhiều lần cách quãng (chương 14).</dd>
<dt>Stress-buffering</dt><dd>Hỗ trợ xã hội làm đệm cho tác động của căng thẳng (chương 13).</dd>
<dt>Sunk cost</dt><dd>Tiếp tục vì đã bỏ vào nhiều, thay vì nhìn về phía trước (chương 12).</dd>
<dt>Temptation bundling</dt><dd>Chỉ cho mình hưởng một thứ yêu thích khi đang làm việc nên làm (chương 2).</dd>
<dt>Transfer</dt><dd>Kỹ năng luyện ở chỗ này lan sang chỗ khác; với khả năng xa, gần như không có (chương 14).</dd>
<dt>Values</dt><dd>Những điều mình coi trọng, đóng vai trò hướng đi cho lựa chọn; theo Schwartz gồm mười values cơ bản xếp trên một vòng tròn (chương 15).</dd>
<dt>Values clarification</dt><dd>Nói rõ values của mình trước khi chọn, ví dụ chấm điểm từng phương án theo từng value (chương 18).</dd>
<dt>Wanting / liking</dt><dd>Động lực muốn, so với khoái cảm thích; hai hệ thống khác nhau trong não (chương 8).</dd>
<dt>Wise reasoning</dt><dd>Cách suy xét chuyện đời: biết giới hạn của mình, xét nhiều góc nhìn, tìm cách dung hoà (chương 7).</dd>
</dl>
