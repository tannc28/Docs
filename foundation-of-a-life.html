Nhưng tha thứ có một điều kiện ít ai nhắc tới. Theo dõi các cặp đôi, người ta thấy lòng tự trọng của người tha thứ **tăng lên** nếu người có lỗi đã sửa sai. Nếu người đó không hề sửa, lòng tự trọng ấy **giảm xuống**. Nhóm tác giả gọi đây là **doormat effect**, hiệu ứng tấm thảm chùi chân <a class="ev ev-mid" href="#r-luchies2010" title="Luchies 2010 · Bằng chứng vừa"></a>. Tấm thảm thì ai bước qua cũng được. Cứ mỗi lần bị bước qua mà vẫn nằm yên, tấm thảm lại tin thêm một chút rằng chỗ của mình là ở dưới chân người khác.

```mermaid
flowchart TD
  O["Bị tổn thương"] --> Q{"Người kia có nhận lỗi<br/>và sửa sai không?"}
  Q -->|"Có"| F["Tha thứ và hàn gắn<br/>→ lòng tự trọng tăng"]
  Q -->|"Không"| G["Buông hận thù trong lòng,<br/>nhưng giữ ranh giới:<br/>không tự đặt mình vào<br/>chỗ bị tổn thương lần nữa"]
  Q -.->|"Tha thứ trong quan hệ đang tiếp diễn<br/>dù họ không sửa gì"| D["Doormat effect<br/>→ lòng tự trọng giảm"]
```

Nhánh giữa ở hình trên là một suy luận <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Buông bỏ thù hận là việc diễn ra trong lòng mình. Còn **tin lại và quay lại** là một quyết định riêng, nên dựa trên hành vi thật của người kia. Hai việc này tách được. Bạn có thể thôi giận một người bạn từng vay tiền rồi lờ đi không trả, mà vẫn không cho người ấy vay thêm lần nào nữa. Giữ ranh giới cũng gồm cả quyền nói "không": như bảng ở [chương 4](#expectation-gap) cho thấy, từ chối một lời mời để lại hậu quả nhẹ hơn nhiều so với mình lo.

<div class="callout data"><div class="ct">Tự kiểm tra: lần bất đồng gần nhất</div>

Nhớ lại lần bất đồng gần nhất, với người yêu, với bạn bè hay với gia đình, và trả lời có hoặc không cho ba câu. Mình có đợi cả hai nguội rồi mới nói không? Mình có nhắc lại được điều người kia cần trước khi nói điều mình cần không? Mình có nói rõ điều mình cần không, hay im lặng cho qua? Thiếu câu thứ hai, bạn đang nghiêng về góc "áp đảo"; thiếu câu thứ ba, bạn đang nghiêng về góc "nhượng bộ". Lần tới, chỉ cần sửa đúng câu còn thiếu. Nếu chuyện ấy cần tha thứ, hỏi thêm: người kia đã làm gì khác đi chưa? Nếu chưa, hãy tách việc buông giận và việc tin lại thành hai quyết định riêng <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div>

<details><summary>Đọc thêm: quy mô nghiên cứu về tha thứ, và điều gì giảm theo lòng tự trọng</summary><div class="inner">

Tổng hợp về các chương trình giúp tha thứ gồm 53 kết quả với 2.323 người. Các chương trình này hơn cả các phương pháp khác, và chương trình càng dài thì tác dụng càng lớn <a class="ev ev-high" href="#r-wade2014" title="Wade 2014 · Bằng chứng mạnh"></a>.

Trong doormat effect, cùng giảm với lòng tự trọng còn có cảm giác hiểu rõ mình là ai <a class="ev ev-mid" href="#r-luchies2010" title="Luchies 2010 · Bằng chứng vừa"></a>.

</div></details>

<h2 id="close-ties"><span class="num">6</span>Những người thân</h2>

<h3 id="ties-health"><span class="num">6.1</span>Các mối quan hệ là trụ cột</h3>

Các mối quan hệ có phải chỉ là chuyện tinh thần, để dành cho lúc rảnh? Không. Chúng ảnh hưởng tới sức khoẻ ngang với những thứ ta vẫn coi là sống còn, và mang lại những giờ dễ chịu nhất trong ngày.

Người ta hay xếp các mối quan hệ vào mục "đời sống tinh thần", như thể đó là phần trang trí sau khi đã lo xong sức khoẻ và công việc. Dữ liệu cho thấy điều ngược lại. Người có quan hệ xã hội mạnh có khả năng sống sót cao hơn khoảng 50% <a class="ev ev-high" href="#r-holtlunstad2010" title="Holt-Lunstad 2010 · Bằng chứng mạnh"></a>. Các tác giả xếp độ lớn này ngang với những yếu tố nguy cơ tử vong đã được công nhận như hút thuốc và rượu bia <a class="ev ev-high" href="#r-holtlunstad2010" title="Holt-Lunstad 2010 · Bằng chứng mạnh"></a>. Không ai coi bỏ thuốc lá là việc "để khi nào rảnh". Vậy mà một cuộc gọi về nhà thì hay bị dời như thế.

Các mối quan hệ còn mang lại những giờ dễ chịu nhất trong ngày. Khi 909 phụ nữ đi làm kể lại ngày hôm trước và chấm cảm xúc tích cực cho từng hoạt động:

```chart hbar
hoạt động,cảm xúc tích cực (thang 0–6)
Gần gũi người yêu,5.10
Gặp gỡ trò chuyện,4.59
Thư giãn,4.42
Làm việc,3.62
Đi lại,3.45
```

<p class="src">5 trong 16 hoạt động. Nguồn: Kahneman et al. 2004, Science, Day Reconstruction Method. Theo người cùng hoạt động: bạn bè 4,36, họ hàng 4,17, vợ/chồng 4,11, sếp 3,52. Mẫu thuận tiện, chỉ gồm phụ nữ.</p>

Làm việc và đi lại nằm ở cuối bảng <a class="ev ev-mid" href="#r-kahneman2004" title="Kahneman 2004 · Bằng chứng vừa"></a>. Những giờ tốt nhất trong ngày thường nằm ngoài giờ làm, và ở cùng người khác. Bữa tối cùng ai đó, một cuộc trò chuyện dài cuối tuần, những thứ ta hay coi là phần thưởng sau giờ làm, thật ra là chính những giờ đáng sống nhất.

<details><summary>Đọc thêm: các con số về quan hệ và tuổi thọ</summary><div class="inner">

Meta-analysis của Holt-Lunstad gồm 148 nghiên cứu với hơn 300.000 người. Khi đo các mối quan hệ bằng thước đo tổng hợp nhiều mặt, như tình trạng hôn nhân, quy mô mạng lưới, mức tham gia nhóm, khả năng sống sót cao gần gấp đôi <a class="ev ev-high" href="#r-holtlunstad2010" title="Holt-Lunstad 2010 · Bằng chứng mạnh"></a>.

Một tổng hợp khác cho thấy cô lập xã hội, cảm giác cô đơn và sống một mình đều đi cùng nguy cơ tử vong cao hơn, lần lượt khoảng 29%, 26% và 32%, rõ hơn ở người dưới 65 tuổi <a class="ev ev-high" href="#r-holtlunstad2015" title="Holt-Lunstad 2015 · Bằng chứng mạnh"></a>.

Đây là dữ liệu quan sát, nên chưa tách hết được đâu là nhân, đâu là quả.

Trong nghiên cứu của Kahneman, làm việc là phần chiếm nhiều giờ nhất trong ngày, 6,9 giờ <a class="ev ev-mid" href="#r-kahneman2004" title="Kahneman 2004 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="ties-daily"><span class="num">6.2</span>Những điều nhỏ giữ gìn một mối quan hệ</h3>

Điều gì lặng lẽ khiến hai người xa nhau, và điều nhỏ nào giữ hai người gần lại? Thường là stress từ bên ngoài bị mang về nhà. Giữ gần lại bằng ba thói quen nhỏ: một khoảng đệm sau giờ làm, đón tin vui cho đúng, và cất điện thoại khi ở bên nhau.

Một tối đi làm về, bạn vừa kẹt xe cả tiếng dưới mưa, lại bị một chiếc xe khác quẹt vào rồi còn bị chửi ngược <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Về tới nhà, người bạn đời hỏi "hôm nay thế nào?", bạn đáp cụt lủn "bình thường", rồi cắm mặt vào điện thoại. Người ấy kể một chuyện vui trong ngày, bạn "ừ" mà không nghe. Không ai cãi nhau, nhưng tối hôm ấy hai người xa nhau thêm một chút, vì một chuyện chẳng liên quan gì đến cả hai.

```mermaid
flowchart LR
  S["Stress từ bên ngoài<br/>(công việc, tiền, kế hoạch quá tải)"] -->|"① mang tâm trạng xấu<br/>về nhà"| M["Ít kiên nhẫn,<br/>ít chú ý"]
  M -->|"② cùng tối đó"| B["Giận, thu mình<br/>với người thân"]
  S -->|"③ lấy mất thời gian<br/>và sự chú ý"| T["Ít khoảnh khắc<br/>gần gũi bên nhau"]
  B --> Q["Chất lượng<br/>quan hệ giảm"]
  T --> Q
```

1. **Bực bội ở công ty dễ bị mang về nhà ngay tối đó (① ②).** Những ngày có va chạm ở chỗ làm, cả hai vợ chồng đều giận dữ và thu mình hơn với nhau. Một phần là do tâm trạng xấu mang theo về <a class="ev ev-mid" href="#r-story2006" title="Story &amp; Repetti 2006 · Bằng chứng vừa"></a>. Buổi tối kẹt xe ở trên cũng đi đúng đường ấy, chỉ khác là cơn bực đến từ ngoài đường. Chèn một khoảng đệm ngắn trước khi bước vào nhà, như tắm, thay đồ, mười phút yên tĩnh, là một cách chặn bước ① <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Hoặc chỉ cần nói thẳng: "Hôm nay gặp chuyện bực ngoài đường, cho mình mười phút rồi mình nói chuyện nhé."
2. **Stress còn lấy mất thời gian bên nhau (③).** Stress chiếm mất thời gian và sự chú ý lẽ ra dành để vun đắp sự gần gũi <a class="ev ev-mid" href="#r-neff2017" title="Neff &amp; Karney 2017 · Bằng chứng vừa"></a>. Vì thế những thói quen nhỏ lại có giá trị lớn.

**Cách đáp lại tin vui quan trọng hơn cách đáp lại tin buồn.** Người bạn đời nhắn tin khoe: "Thi đỗ bằng lái ô tô rồi!" Hào hứng và hỏi thêm, kiểu "Thật à! Kể nghe xem, lúc thi có run không?", gọi là **active-constructive**. Chỉ kiểu đáp này gắn với quan hệ tốt hơn <a class="ev ev-mid" href="#r-gable2004" title="Gable 2004 · Bằng chứng vừa"></a>. Những kiểu còn lại là khen nhạt ("Ừ, tốt đấy"), dội nước lạnh ("Rồi lấy tiền đâu mua xe?"), hoặc lờ đi mà kể chuyện mình ("Hôm nay mệt lắm"). Khi người thân gặp chuyện buồn, gần như ai cũng biết phải an ủi. Còn lúc họ vui, ta hay lơ đễnh mà không biết mình vừa bỏ lỡ một cơ hội.

**Cất điện thoại khi ở bên nhau.** Dùng điện thoại khi đang ở với người kia, gọi là phubbing, đi kèm mức hài lòng thấp hơn và xung đột nhiều hơn <a class="ev ev-mid" href="#r-ni2025" title="Ni 2025 · Bằng chứng vừa"></a>.

**Ví dụ đi từng bước: viết lại buổi tối kẹt xe** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

- *Tình huống.* Lại một tối kẹt xe dưới mưa, lại bị một chiếc xe khác quẹt vào. Về tới đầu ngõ, bạn biết ở nhà người kia đang chờ cơm.
- *Cơ chế dự đoán gì.* Cơn bực ngoài đường sẽ theo bạn vào bữa tối (bước ① và ② ở hình trên), và điện thoại sẽ chiếm nốt phần chú ý còn lại.
- *Làm gì.* Mười phút đầu về nhà: tắm, thay đồ, chưa mở điện thoại. Lúc ngồi vào mâm, nói một câu: "Hôm nay gặp chuyện bực ngoài đường, nhưng giờ mình muốn nghe chuyện ở nhà." Điện thoại úp trên nóc tủ lạnh, để chế độ im lặng. Khi người kia kể vừa nấu được món cá kho đúng vị của bà, hỏi tiếp: "Bà mách bí quyết gì thế? Kho mất bao lâu?"
- *Kết quả.* Chuyện ngoài đường vẫn còn đó, nhưng không len được vào bữa tối. Một tin vui được đón theo kiểu active-constructive, đúng kiểu đáp lại mà nghiên cứu thấy gắn với quan hệ tốt hơn. Buổi tối ở đầu mục và buổi tối này có cùng một trận kẹt xe; chỉ khác ở mười phút đệm và một chiếc điện thoại nằm yên trên nóc tủ lạnh.

<details><summary>Đọc thêm: stress trong hôn nhân, bốn kiểu đáp lại, và hai thói quen nhỏ khác</summary><div class="inner">

Tổng quan 115 nghiên cứu dọc về hôn nhân cho thấy stress báo trước một cuộc hôn nhân kém hạnh phúc và kém bền hơn về sau. Các tác giả cho rằng stress gây hại thông qua chính cách hai người đối xử với nhau, theo mô hình vulnerability–stress–adaptation <a class="ev ev-mid" href="#r-karney1995" title="Karney &amp; Bradbury 1995 · Bằng chứng vừa"></a>.

Nghiên cứu mang bực bội về nhà theo dõi nhật ký của 43 cặp vợ chồng <a class="ev ev-mid" href="#r-story2006" title="Story &amp; Repetti 2006 · Bằng chứng vừa"></a>.

Bốn kiểu đáp lại tin vui có tên riêng: hào hứng và hỏi thêm là active-constructive; khen nhạt là passive-constructive; dội nước lạnh là active-destructive; lờ đi, chuyển sang chuyện mình là passive-destructive <a class="ev ev-mid" href="#r-gable2004" title="Gable 2004 · Bằng chứng vừa"></a>. Cách đáp lại tin vui báo trước chất lượng quan hệ và khả năng chia tay hai tháng sau rõ hơn cách đáp lại tin buồn <a class="ev ev-mid" href="#r-gable2006" title="Gable 2006 · Bằng chứng vừa"></a>.

Kết quả về phubbing gộp 52 nghiên cứu với gần 20.000 người. Phần lớn là dữ liệu thu tại một thời điểm nên chưa rõ đâu là nguyên nhân <a class="ev ev-mid" href="#r-ni2025" title="Ni 2025 · Bằng chứng vừa"></a>.

**Để ý và biết ơn những điều nhỏ.** Trong nhật ký hằng ngày của các cặp sống chung, lòng biết ơn hôm nay báo trước cảm giác gắn kết và hài lòng tăng lên vào ngày hôm sau, ở cả hai người <a class="ev ev-mid" href="#r-algoe2010" title="Algoe, Gable &amp; Maisel 2010 · Bằng chứng vừa"></a>. Một câu "cảm ơn em đã chọn quán tối nay, ngon thật" chỉ mất ba giây.

**Làm điều mới lạ cùng nhau.** Trong phòng thí nghiệm, chỉ bảy phút cùng làm một việc mới lạ, hơi thử thách đã nâng chất lượng quan hệ lên so với nhóm làm một việc quen thuộc <a class="ev ev-mid" href="#r-aron2000" title="Aron 2000 · Bằng chứng vừa"></a>. Một quán ăn chưa thử, một con đường chưa đi, một lớp học nấu ăn có thể thay cho bộ phim thứ một trăm trên ghế sofa.

</div></details>

<h3 id="ties-friends"><span class="num">6.3</span>Tình bạn cần được vun đắp</h3>

Vì sao nhóm bạn thân thời đại học cứ thưa dần, dù chẳng ai giận ai? Vì tình bạn phai nhanh hơn quan hệ họ hàng khi không còn gặp nhau. Muốn giữ, phải có người chủ động.

Hồi đại học, bạn có một nhóm bạn thân gặp nhau gần như mỗi ngày. Ra trường, mỗi người một ngả, một thành phố. Năm đầu còn hẹn cà phê mỗi tháng; năm thứ ba chỉ còn chúc mừng sinh nhật trên Facebook. Trong khi đó, người anh họ cả năm mới gặp một lần vào dịp Tết vẫn thấy thân như cũ.

Ông bà mình nói "xa mặt cách lòng", và nghiên cứu thấy câu ấy đúng với tình bạn hơn với họ hàng: tình bạn **phai nhanh hơn quan hệ họ hàng** khi liên lạc và hoạt động chung giảm đi <a class="ev ev-mid" href="#r-roberts2011" title="Roberts &amp; Dunbar 2011 · Bằng chứng vừa"></a>. Quan hệ gia đình giống một cây có rễ sâu, chịu được mùa khô. Tình bạn giống bếp củi ở quê: không thêm củi đều thì lửa lụi dần.

Điều quan trọng không phải có bao nhiêu bạn, mà là mình có gặp đều những người quan trọng hay không <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Một lịch cà phê cố định mỗi tháng với hai, ba người bạn thân có giá trị hơn một danh sách năm trăm bạn bè trên mạng.

<details><summary>Đọc thêm: con số 150 của Dunbar</summary><div class="inner">

Con số "150 người" nổi tiếng của Dunbar, nếu coi là giới hạn cứng về số bạn một người có thể có, thì không có cơ sở vững. Phân tích lại cùng loại dữ liệu ra con số có thể nằm ở bất cứ đâu từ 4 tới 520, và các tác giả kết luận rằng chỉ ra một con số cụ thể là vô ích <a class="ev ev-low" href="#r-lindenfors2021" title="Lindenfors 2021 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

</div></details>

<h3 id="ties-giving"><span class="num">6.4</span>Cho đi, và cách nâng đỡ người đang gặp khó khăn</h3>

Giúp người khác thì mình được gì, và giúp thế nào cho đúng? Mình được vui hơn một chút. Còn với người đang gặp khó, cách giúp tốt nhất thường là lặng lẽ làm đỡ một việc, không phải giảng giải.

Người hay giúp đỡ người khác có well-being cao hơn một chút, nhất là khi **giúp trực tiếp, không qua tổ chức**, như chở hàng xóm đi khám hay dạy em họ ôn thi <a class="ev ev-high" href="#r-hui2020" title="Hui 2020 · Bằng chứng mạnh"></a>. Mối liên hệ nhỏ, nhưng có thật.

Có một kết quả lạ mà đáng nhớ với người luôn thấy thiếu thời gian. **Cho đi thời gian khiến người ta thấy mình có nhiều thời gian hơn**, hơn cả khi dùng chính khoảng thời gian đó cho bản thân <a class="ev ev-mid" href="#r-mogilner2012" title="Mogilner 2012 · Bằng chứng vừa"></a>. Một buổi chiều Chủ nhật giúp bạn chuyển nhà có thể để lại cảm giác thư thả hơn một buổi chiều nằm lướt điện thoại.

Khi người thân đang gặp chuyện, cách mình giúp cũng quan trọng. Người ta theo dõi các cặp đôi khi một người đang ôn cho một kỳ thi căng thẳng. Kiểu hỗ trợ giúp người đó trụ vững nhất là hỗ trợ **kín đáo**: người kia có làm, nhưng người nhận không nhận ra mình đang "được giúp" <a class="ev ev-mid" href="#r-bolger2000" title="Bolger, Zuckerman &amp; Kessler 2000 · Bằng chứng vừa"></a>. Hình dung tuần đứa em ruột ôn thi đại học. Một người trong nhà cứ nhắc đi nhắc lại "phải lập kế hoạch ôn cho khoa học vào". Một người khác lặng lẽ nấu sẵn đồ ăn, làm thay phần việc nhà của em, và giữ cho nhà yên tĩnh vào giờ em học. Người thứ nhất vô tình nhắc rằng em đang chật vật; người thứ hai chỉ khiến gánh nặng nhẹ đi <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Và hỗ trợ là đường hai chiều. Sau sang chấn, người được hỗ trợ nhiều thường có triệu chứng PTSD nhẹ hơn về sau. Nhưng chiều ngược lại cũng đúng, và mạnh ngang như thế: người có triệu chứng nặng thì về sau lại ít được hỗ trợ hơn <a class="ev ev-mid" href="#r-wang2021ptsd" title="Wang 2021 · Bằng chứng vừa"></a>. Người đang khổ thường cáu gắt hơn, thu mình hơn, và người xung quanh lùi dần ra, đúng lúc họ cần người ở lại nhất. Vậy khi một người bạn đang khó khăn mà trở nên khó chịu, đừng vội rút lui. Sự khó chịu ấy thường là một phần của nỗi khổ, không phải lời từ chối dành cho mình <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<div class="callout data"><div class="ct">Tự kiểm tra: những người thân trong tuần của bạn</div>

Tuần này, sau mỗi bữa tối hay buổi cuối tuần bên người thân, ghi hai thứ. Thứ nhất, xem mục thời gian sử dụng trên điện thoại để biết chừng bao nhiêu phút mình cầm máy khi đang ở cạnh nhau. Thứ hai, lần gần nhất người ấy kể một tin vui thì mình đáp lại theo kiểu nào ở [§6.2](#ties-daily). Rồi viết tên ba người bạn quan trọng nhất và ngày gần nhất mình thật sự nói chuyện với từng người. Nếu số phút điện thoại cao, hoặc có người bạn đã hơn ba tháng không liên lạc, đó là hai chỗ dễ sửa nhất. Hãy chọn một chỗ cố định để cất điện thoại khi ở bên nhau, và gửi ngay hôm nay một tin nhắn hẹn cà phê <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div>

<details><summary>Đọc thêm: các con số và nghiên cứu khác về cho đi</summary><div class="inner">

Kết quả về giúp đỡ đến từ 201 nghiên cứu với gần 200.000 người. Giúp trực tiếp, không qua tổ chức, có tên là informal helping <a class="ev ev-high" href="#r-hui2020" title="Hui 2020 · Bằng chứng mạnh"></a>.

Làm một việc tử tế nâng nhẹ well-being của chính người làm, dù các nghiên cứu còn nhỏ và chỉ đo ngắn hạn <a class="ev ev-mid" href="#r-curry2018" title="Curry 2018 · Bằng chứng vừa"></a>.

Tiêu tiền cho người khác làm mình vui hơn, nhưng lần làm lại có đăng ký trước cho kết quả nhỏ và không nhất quán <a class="ev ev-mid" href="#r-aknin2020" title="Aknin 2020 · Bằng chứng vừa"></a>.

</div></details>

<div class="recall">

**Câu hỏi nhớ lại — Phần II.**

<details><summary>"Đặt mình vào vị trí người khác" có làm mình hiểu họ đúng hơn không? Điều gì thì có?</summary><div class="inner">

Không. Tưởng tượng góc nhìn của họ không giúp đoán đúng hơn (nhìn chung còn kém đi), dù đôi lúc làm mình tự tin hơn. Hỏi và lắng nghe thì có (Eyal, Steffel & Epley 2018).

</div></details>

<details><summary>Vì sao nỗi ngại giao tiếp không tự mất đi theo thời gian?</summary><div class="inner">

Vì né tránh khiến mình không bao giờ thấy được chính điều có thể sửa dự đoán bi quan, như đứa trẻ sợ ma không dám bật đèn xem góc nhà tối. Thực tế, người khác thích mình hơn, sẵn lòng giúp hơn, và đón nhận lời cảm ơn, lời khen, sự thật lòng tốt hơn mình nghĩ.

</div></details>

<details><summary>Trong thương lượng, tốt bụng đã đủ chưa?</summary><div class="inner">

Chưa. Động cơ vì cả hai bên chỉ đem lại kết quả tốt khi đi kèm việc không dễ nhượng bộ (De Dreu 2000): mềm với người, vững với điều mình cần.

</div></details>

<details><summary>Khi nào tha thứ làm mình mạnh lên, khi nào làm mình mất dần lòng tự trọng?</summary><div class="inner">

Mạnh lên khi người kia đã sửa sai. Mất dần lòng tự trọng khi họ không sửa gì mà mình vẫn tha thứ, trong một quan hệ vẫn đang tiếp diễn: doormat effect (Luchies 2010). Buông thù hận và tin lại là hai quyết định tách riêng.

</div></details>

<details><summary>Người thân kể một tin vui. Kiểu đáp lại nào vun đắp quan hệ?</summary><div class="inner">

Active-constructive: hào hứng, hỏi thêm, vui cùng. "Thật à! Kể nghe xem nào" chứ không phải "Ừ, tốt đấy" (Gable 2004, 2006).

</div></details>

</div>


<h2 id="part-3" class="part">Phần III — Một đời đáng sống</h2>

<h2 id="good-life"><span class="num">7</span>Thế nào là một đời đáng sống</h2>

Hỏi hai người "dạo này sống thế nào?". Người thứ nhất kể một tuần mệt nhoài, sếp gắt, kẹt xe mỗi tối, nhưng cuối câu lại bảo "nhìn chung thì đời mình ổn, đang đi đúng hướng". Người thứ hai có một tuần thong thả, ngày nào cũng vui, nhưng hỏi về cả cuộc đời thì ngập ngừng. Chẳng ai tự mâu thuẫn cả. Họ đang trả lời hai câu hỏi khác nhau.

Chương này không đưa ra một định nghĩa duy nhất. Một đời tốt có **nhiều tầng**, mỗi tầng cần được bồi đắp bằng những thứ khác nhau. Rất nhiều lựa chọn sai bắt đầu từ chỗ lấy thứ của tầng này đem vá cho tầng kia.

```mermaid
flowchart TB
  subgraph DAY["Từng ngày"]
    E["① Trải nghiệm<br/>vui, buồn, căng thẳng<br/>trong từng giờ"]
  end
  subgraph LIFE["Cả đời"]
    V["② Đánh giá cuộc sống<br/>khi nhìn lại"]
    M["③ Ý nghĩa<br/>mạch lạc · có hướng đi · đáng sống"]
  end
  N["④ Ba nhu cầu nền<br/>tự chủ · năng lực · gắn kết"] --> E
  N --> V
  N --> M
  W["⑤ Trí tuệ<br/>cách suy xét chuyện đời"] --> V
```

<h3 id="two-wellbeing"><span class="num">7.1</span>Hai thước đo: tăng lương có làm mình vui hơn?</h3>

Lương tăng thì bạn có vui hơn không? Có, nhưng chủ yếu là lúc bạn nhìn lại cả đời mình. Còn một buổi tối bình thường có dễ chịu hơn hay không thì phụ thuộc vào những thứ khác.

**Hạnh phúc có hai thước đo.** Nghĩ tới chuyện cuối năm ngồi nhìn lại. Có năm ngày nào cũng vất vả, mà đến Tết tổng kết vẫn thấy một năm được mùa. Có năm ngày nào cũng nhàn, mà tổng kết lại chẳng thấy gì. Thước đo thứ nhất là **emotional well-being**, chuyện từng ngày: những giờ vừa qua vui, buồn hay căng thẳng. Thước đo thứ hai là **life evaluation**, bản tổng kết cuối năm: khi được hỏi, bạn chấm đời mình ở bậc nào <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Thu nhập gắn chặt với bản tổng kết. Sức khoẻ và sự cô đơn thì gắn mạnh hơn với chuyện từng ngày <a class="ev ev-high" href="#r-kahneman2010" title="Kahneman &amp; Deaton 2010 · Bằng chứng mạnh"></a>.

**Tiền vẫn có ích, nhưng mỗi nấc tốn nhiều tiền hơn nấc trước.** Với phần lớn mọi người, muốn hạnh phúc thêm một nấc thì thu nhập phải *gấp đôi*, chứ không phải cộng thêm một khoản cố định <a class="ev ev-high" href="#r-killingsworth2023" title="Killingsworth, Kahneman &amp; Mellers 2023 · Bằng chứng mạnh"></a>. Từ 10 lên 20 triệu một tháng là một nấc. Từ 20 lên 40 triệu là nấc tiếp theo.

Thử áp vào một lời mời đổi chỗ làm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Lương tăng từ 20 lên 25 triệu là chưa được nửa nấc, vì phải tới 40 triệu mới trọn một nấc. Bạn sẽ vui thật, nhưng ít hơn mình tưởng, và chủ yếu ở cảm giác "đời mình đang đi lên". Nếu đổi lại chỗ làm mới xa hơn, tối nào cũng về muộn hơn một tiếng, rất có thể bạn lỗ: mỗi tối mất một tiếng bên gia đình, còn bản tổng kết chỉ nhích lên một chút. Trước khi nhận lời, hỏi cả hai câu: nhìn lại thì đời mình có khá hơn không, và một buổi tối bình thường có dễ chịu hơn không?

**Chuyện từng ngày còn tuỳ vào chỗ tâm trí đang ở.** Khi được nhắn tin hỏi vào những lúc ngẫu nhiên trong ngày, người ta nghĩ về chuyện khác gần nhiều bằng nghĩ về việc đang làm. Những lúc tâm trí lang thang như thế, họ thường kém vui hơn <a class="ev ev-mid" href="#r-killingsworth2010" title="Killingsworth &amp; Gilbert 2010 · Bằng chứng vừa"></a>.

Một buổi tối <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Bạn về tới nhà, cả nhà đã dọn mâm, nhưng trong đầu cứ lởn vởn chuyện tiền học kỳ tới của đứa em, chưa biết xoay thế nào. Nếu để vậy, bữa cơm sẽ kém vui, dù món ăn và những người ngồi quanh mâm vẫn y như mọi khi. Trước khi ngồi vào mâm, mở ghi chú và viết hai dòng: chuyện ấy là gì, sáng mai làm việc gì trước. Đầu óc không phải giữ hộ chuyện ấy nữa, nên bữa cơm trọn vẹn hơn, và sáng hôm sau bạn bắt tay vào lo liệu nhanh hơn.

<details><summary>Đọc thêm: dữ liệu gốc và chuyện mốc 75.000 USD</summary><div class="inner">

Kahneman và Deaton phân tích hơn 450.000 câu trả lời khảo sát. Ngoài sức khoẻ và sự cô đơn, việc phải chăm sóc người khác và hút thuốc cũng gắn mạnh hơn với chuyện từng ngày. Học vấn, cũng như thu nhập, gắn chặt với bản tổng kết <a class="ev ev-high" href="#r-kahneman2010" title="Kahneman &amp; Deaton 2010 · Bằng chứng mạnh"></a>.

Năm 2010, dữ liệu cho thấy cảm xúc hằng ngày ngừng tăng khi thu nhập vượt quanh 75.000 USD một năm <a class="ev ev-high" href="#r-kahneman2010" title="Kahneman &amp; Deaton 2010 · Bằng chứng mạnh"></a>. Một nghiên cứu sau đó hỏi cảm xúc ngay trong lúc người ta đang sống, chứ không bắt họ nhớ lại, và thấy hạnh phúc vẫn tiếp tục tăng. Thay vì cãi nhau, hai bên, trong đó có chính Kahneman, ngồi lại phân tích chung. Kết luận chung: với phần lớn mọi người, hạnh phúc tăng đều theo logarit của thu nhập. Hiện tượng chững lại quanh 100.000 USD chỉ xuất hiện ở khoảng 15–20% người kém hạnh phúc nhất. Các tác giả đoán đó là những nỗi khổ mà thu nhập cao không xoá được <a class="ev ev-high" href="#r-killingsworth2023" title="Killingsworth, Kahneman &amp; Mellers 2023 · Bằng chứng mạnh"></a>.

"Theo logarit" chính là cái thang gấp đôi ở trên. Vì thế 10 triệu thêm vào thu nhập 10 triệu có tác dụng ngang 40 triệu thêm vào thu nhập 40 triệu.

</div></details>

<h3 id="needs"><span class="num">7.2</span>Ba nhu cầu nền: có đủ cả mà sao vẫn trống rỗng?</h3>

Có việc, có người thương, có kế hoạch, mà sao vẫn thấy trống rỗng? Thường là vì một trong ba nhu cầu nền đang bị hụt. Cái kiềng đứng vững nhờ ba chân; thiếu một chân là đổ, dù hai chân kia có to đến đâu.

Self-determination theory nói ai cũng có ba nhu cầu tâm lý cơ bản <a class="ev ev-mid" href="#r-ryan2000" title="Ryan &amp; Deci 2000 · Bằng chứng vừa"></a>:

- **Tự chủ**: việc mình làm là do mình chọn, không phải bị đẩy vào.
- **Năng lực**: mình làm tốt được việc mình làm, và đang khá lên.
- **Gắn kết**: mình có người thân thiết, có ai đó quan tâm tới mình.

Đủ cả ba thì động lực tự thân và well-being cùng tăng; thiếu thì cả hai cùng đi xuống. Một công việc lương cao mà mọi quyết định đều do người khác đưa ra là hụt chân tự chủ. Một mối quan hệ yên ổn mà không ai thật sự hiểu mình là hụt chân gắn kết. Lần tới khi thấy trống rỗng, thử hỏi: chân nào đang hụt <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>?

Thử với chuyện học tiếng Anh <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Giả sử tối nào bạn cũng nghe podcast nửa tiếng, vậy mà dạo này cứ ngồi vào bàn là thấy chán. Tự chủ thì có, vì chẳng ai ép. Gắn kết không phải vấn đề ở đây. Còn năng lực: lần cuối bạn *thấy* mình nghe tốt hơn là khi nào? Nếu không nhớ nổi, chân hụt chính là chân đó. Cách kê lại: chọn một đoạn podcast dài năm phút, nghe một lần, chép lại những gì nghe được, rồi cất bản chép đi. Một tháng sau nghe lại đúng đoạn ấy và chép lần nữa. Đặt hai bản cạnh nhau là thấy tiến bộ tận mắt, và cái chán thường dịu đi.

<details><summary>Đọc thêm: ba nhu cầu ở 123 quốc gia</summary><div class="inner">

Ba nhu cầu này không chỉ đúng ở phương Tây. Dữ liệu từ 123 quốc gia cho thấy ở mọi vùng, nhu cầu được đáp ứng thì well-being cao hơn. Mỗi loại nhu cầu bồi đắp cho một tầng khác nhau. Đánh giá cuộc sống gắn nhiều nhất với nhu cầu cơ bản như ăn, ở. Cảm xúc tích cực gắn nhiều nhất với nhu cầu xã hội và được tôn trọng. Cảm xúc tiêu cực đi kèm việc thiếu nhu cầu cơ bản, thiếu tôn trọng và thiếu tự chủ, kể cả khi đã tính đến thu nhập <a class="ev ev-high" href="#r-tay2011" title="Tay &amp; Diener 2011 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="meaning"><span class="num">7.3</span>Ý nghĩa: một đời "có ý nghĩa" gồm những gì?</h3>

Một đời có ý nghĩa gồm ba thứ: hiểu được đời mình, có hướng đi, và thấy đời mình đáng giá. Ba thứ này không phải lúc nào cũng đi cùng nhau, nên thiếu thứ nào thì bồi đắp đúng thứ ấy.

Thử nghĩ về cuộc đời mình như một cuốn tiểu thuyết đang viết dở. Cuốn tiểu thuyết hay cần các chương nối với nhau thành một mạch đọc hiểu được. Câu chuyện cần có hướng đi, khiến người đọc muốn lật trang tiếp. Và câu chuyện ấy phải đáng để kể. Ý nghĩa cuộc sống cũng gồm đúng ba phần như thế <a class="ev ev-mid" href="#r-martela2016" title="Martela &amp; Steger 2016 · Bằng chứng vừa"></a>. Phần "có hướng đi" thường được gọi là **purpose**: những mục tiêu cốt lõi dẫn đường cho mình.

Ba phần ấy có thể lệch nhau. Một người có hướng đi rất rõ, hai năm nữa mua được nhà, mà vẫn thấy đời mình chẳng có gì đáng kể. Một người khác thấy đời mình quý giá mà chưa biết sẽ đi đâu. Người thứ nhất không cần thêm mục tiêu; người thứ hai thì cần <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Ý nghĩa còn đến từ công việc. Ai thấy công việc của mình có ý nghĩa thì thường gắn bó và hài lòng với công việc hơn hẳn, và cũng hài lòng hơn với cuộc sống <a class="ev ev-mid" href="#r-allan2019" title="Allan 2019 · Bằng chứng vừa"></a>. Với người nấu bếp ở một trường mầm non, cùng một tuần đứng bếp có thể là "nấu cho xong mấy chục suất", cũng có thể là "lo cho mấy chục đứa trẻ bữa trưa đủ chất". Câu chuyện bạn tự kể về công việc của mình cũng là một phần của ý nghĩa <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: purpose và sức khoẻ, ý nghĩa trong công việc</summary><div class="inner">

Ba phần của ý nghĩa có tên tiếng Anh là coherence (các mảnh ghép của đời mình khớp với nhau), purpose (có mục tiêu cốt lõi và hướng đi) và significance (thấy đời mình có giá trị, đáng sống) <a class="ev ev-mid" href="#r-martela2016" title="Martela &amp; Steger 2016 · Bằng chứng vừa"></a>.

Gộp 10 nghiên cứu theo dõi với hơn 136.000 người, người có purpose cao hơn có nguy cơ tử vong thấp hơn khoảng 17%, và nguy cơ biến cố tim mạch cũng thấp hơn chừng ấy <a class="ev ev-mid" href="#r-cohen2016" title="Cohen, Bavishi &amp; Rozanski 2016 · Bằng chứng vừa"></a>. Đây là dữ liệu quan sát, nên một phần có thể đi theo chiều ngược lại: người khoẻ thì dễ có mục đích hơn.

Tổng hợp về ý nghĩa công việc gồm 44 bài với hơn 23.000 người. Ngoài gắn bó và hài lòng, người thấy công việc có ý nghĩa còn thấy đời mình có ý nghĩa hơn, khoẻ hơn, và ít muốn nghỉ việc hơn <a class="ev ev-mid" href="#r-allan2019" title="Allan 2019 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="wisdom"><span class="num">7.4</span>Trí tuệ khác trí thông minh</h3>

Thông minh có giúp mình sống tốt hơn không? Gần như không. Thứ gắn với một đời sống tốt là cách mình suy xét những va chạm trong đời thật, và cách ấy học được.

Ai cũng quen một người rất sáng dạ, giải đề nhanh, nói chuyện sắc, mà các mối quan hệ cứ rối tung. Và ai cũng quen một người bà, một người chú, học không nhiều nhưng gỡ được những chuyện khó nhất trong nhà. Nghiên cứu xác nhận đó là hai kiểu khôn khác nhau. Trên một mẫu ngẫu nhiên người Mỹ, **trí thông minh không liên quan tới well-being**. Còn **wise reasoning** thì khác. Đó là cách người ta suy xét một xung đột, như cuộc cãi nhau giữa hai người bạn, và cách suy xét ấy gắn với hài lòng cuộc sống cao hơn và quan hệ tốt hơn <a class="ev ev-mid" href="#r-grossmann2013" title="Grossmann 2013 · Bằng chứng vừa"></a>.

Ngoài đời, wise reasoning lộ ra ở ba việc cụ thể. Biết mình có thể đang thiếu thông tin. Chịu nhìn chuyện từ phía người kia. Tìm cách dung hoà thay vì phân thắng thua. Như [chương 3](#distance) đã cho thấy, cả ba việc dễ hơn hẳn khi mình đứng ra ngoài chuyện của chính mình.

Thử với một trận cãi nhỏ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Bữa cơm Chủ nhật, mẹ trách bạn cả bữa cứ cầm điện thoại. Phản xạ đầu tiên là cãi: "Con đang trả lời tin nhắn có việc mà." Một người sắc sảo có thể thắng bằng lý lẽ, nhưng bữa cơm thì hỏng. Wise reasoning đi ba bước khác. Có khi mẹ đã mong cả tuần để có bữa cơm đủ mặt con cháu. Nhìn từ phía mẹ, bữa cơm Chủ nhật là dịp hiếm hoi cả nhà ngồi đủ. Cách dung hoà: úp điện thoại xuống mâm, ăn xong mới xem tin nhắn một lượt. Không ai phải thắng, và bữa cơm vẫn còn.

<details><summary>Đọc thêm: wise reasoning đo được gì, trí tuệ được định nghĩa ra sao</summary><div class="inner">

Trong nghiên cứu của Grossmann, wise reasoning còn gắn với ít cảm xúc tiêu cực hơn, ít nghĩ quẩn hơn, và thậm chí sống thọ hơn. Các mối liên hệ này vẫn còn khi đã tính đến điều kiện kinh tế, khả năng ngôn ngữ và tính cách <a class="ev ev-mid" href="#r-grossmann2013" title="Grossmann 2013 · Bằng chứng vừa"></a>.

Các nhà nghiên cứu đã thống nhất một định nghĩa chung: trí tuệ là dùng metacognition, tức suy nghĩ về chính cách mình đang suy nghĩ, trên một nền tảng đạo đức, khi suy luận và giải quyết vấn đề <a class="ev ev-mid" href="#r-grossmann2020" title="Grossmann 2020 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="remembered"><span class="num">7.5</span>Cuộc đời mình sống và cuộc đời mình nhớ</h3>

Vì sao một ngày vui có thể được nhớ thành một ngày mệt? Vì ký ức không cộng dồn từng phút. Ký ức chỉ giữ lại lúc tệ nhất và lúc cuối cùng.

Một thí nghiệm nổi tiếng bắt người tham gia nhúng tay vào nước lạnh buốt hai lần, theo hai cách khác nhau. Bạn đoán xem: khi được chọn lặp lại một lần, đa số chọn lần nào — lần ngắn hơn, hay lần dài hơn?

```mermaid
flowchart LR
  subgraph SHORT["Lần ngắn"]
    A1["60 giây<br/>nước 14 °C"] --> A2["Kết thúc<br/>lúc đang đau nhất"]
  end
  subgraph LONG["Lần dài"]
    B1["Cùng 60 giây<br/>nước 14 °C"] --> B2["Thêm 30 giây, nước ấm dần<br/>lên 15 °C: vẫn đau, nhưng đỡ hơn"]
    B2 --> B3["Kết thúc<br/>lúc đã đỡ"]
  end
  A2 -->|"① tổng đau ít hơn"| Q{"Lặp lại lần nào?"}
  B3 -->|"② tổng đau nhiều hơn,<br/>kết thúc nhẹ hơn"| Q
  Q -->|"③ đa số chọn"| L["Lần dài"]
```

<p class="src">Thiết kế thí nghiệm theo Kahneman, Fredrickson, Schreiber & Redelmeier 1993, Psych Sci 4(6):401–405.</p>

Đa số chọn **lần dài**, tức tự nguyện chịu đau nhiều hơn, chỉ vì lần đó kết thúc nhẹ hơn. Ký ức giống như chỉ chụp lại hai khoảnh khắc, lúc tệ nhất và lúc cuối cùng, còn độ dài thì gần như bị bỏ qua <a class="ev ev-mid" href="#r-kahneman1993b" title="Kahneman 1993 · Bằng chứng vừa"></a>. Hiện tượng này gọi là **peak–end rule**.

Vậy là có hai "cái tôi" cùng chấm điểm cuộc đời: cái tôi đang sống qua từng giây, và cái tôi giữ lại những tấm ảnh. Khi ra quyết định, ta thường nghe theo cái tôi thứ hai. Từ đó có hai việc nên làm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Một, chăm chút phần kết: một chuyến về quê ăn Tết, đường đi kẹt xe mệt nhoài, mà khép lại bằng bữa cơm chia tay ấm cúng sẽ được nhớ như một chuyến đi vui. Hai, đừng để ký ức một mình quyết định: một công việc có vài khoảnh khắc đáng nhớ mà ngày nào cũng khổ thì vẫn là một công việc ngày nào cũng khổ.

Một thứ Bảy <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Bạn và người yêu đi chơi cả ngày: sáng cà phê, trưa ăn một món ngon, chiều xem phim, rồi tối về cãi nhau vì chuyện ai quên đặt chỗ cho tuần sau. Một tuần sau, cả hai sẽ nhớ "hôm ấy mệt", vì lúc tệ nhất và lúc cuối cùng rơi đúng vào trận cãi. Thấy không khí bắt đầu căng lúc cuối ngày thì gác chuyện đặt chỗ lại để mai nói, rồi khép buổi tối bằng một việc nhẹ nhàng như đi bộ một vòng hay đi ăn chè. Chuyện đặt chỗ vẫn phải nói, nhưng ngày hôm ấy được nhớ đúng như phần lớn thời gian của nó: một ngày vui.

<h3 id="happiness-exercises"><span class="num">7.6</span>Bài tập hạnh phúc: có tác dụng, nhưng nhỏ</h3>

Mỗi tối viết ba điều biết ơn có đáng không? Có tác dụng thật, nhưng nhỏ hơn nhiều so với lời quảng cáo. Chúng là gia vị, không phải món chính.

Những bài tập như viết nhật ký biết ơn, làm một việc tốt, viết về "phiên bản tốt nhất của mình" có tên chung là **positive psychology interventions**. Tổng hợp các thử nghiệm cho thấy chúng nâng well-being lên một chút, và một phần tác dụng còn lại sau vài tháng <a class="ev ev-mid" href="#r-bolier2013" title="Bolier 2013 · Bằng chứng vừa"></a>.

Món chính vẫn là những thứ ở hình đầu chương: các mối quan hệ, sự tự chủ, một việc mình làm tốt và thấy có ý nghĩa, một cơ thể khoẻ. Viết nhật ký biết ơn thì cứ viết nếu thích, nhưng đừng viết thay cho việc gọi điện về nhà <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: các con số và vấn đề publication bias</summary><div class="inner">

Tổng hợp của Bolier gồm 39 thử nghiệm ngẫu nhiên với hơn 6.000 người. Một phần tác dụng còn lại sau 3–6 tháng. Nhưng có dấu hiệu publication bias: những nghiên cứu không thấy gì thường không được đăng, nên bức tranh chung có thể đẹp hơn thực tế <a class="ev ev-mid" href="#r-bolier2013" title="Bolier 2013 · Bằng chứng vừa"></a>.

Khi phân tích lại và hiệu chỉnh cho các nghiên cứu mẫu nhỏ, tác dụng lên well-being còn rất nhỏ, và tác dụng lên trầm cảm thường không phân biệt được với con số không <a class="ev ev-mid" href="#r-white2019" title="White, Uttl &amp; Holder 2019 · Bằng chứng vừa"></a>.

Riêng bài tập biết ơn, khi so với một hoạt động khác thay vì so với việc không làm gì, tác dụng lên well-being cũng chỉ rất nhỏ <a class="ev ev-mid" href="#r-davis2016" title="Davis 2016 · Bằng chứng vừa"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: hai thước đo của bạn</div>

Trong một tuần, đặt ba báo thức ngẫu nhiên mỗi ngày — một lần ban ngày, hai lần vào buổi tối sau khi đi làm hay đi học về. Mỗi lần chuông reo, ghi vào điện thoại hai thứ: tâm trạng lúc đó từ 1 đến 5, và tâm trí mình đang ở việc đang làm hay ở chỗ khác. Chủ nhật, xếp các dòng thành hai nhóm "đang ở đây" và "ở chỗ khác", rồi so điểm trung bình. Nếu nhóm "ở chỗ khác" thấp hơn rõ, chuyện từng ngày của bạn đang tụt điểm vì tâm trí lang thang, chứ không phải vì những gì đang xảy ra quanh mình <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Cuối tuần, trả lời thêm một câu: tuần này chân kiềng nào hụt nhất — tự chủ, năng lực hay gắn kết?

</div>

<h2 id="autonomy"><span class="num">8</span>Không bị chi phối</h2>

Hãy nghĩ tới chuyện đi siêu thị với danh sách năm món mà về nhà với mười lăm món. Không ai bắt bạn mua, nhưng cách bày hàng, chị nhân viên mời ăn thử xúc xích, tấm bảng "giảm 50%" đã chọn thay bạn. Bị chi phối, ở đây, là khi những tác động mình **không hề chọn** quyết định thay mình, mà nếu dừng lại nghĩ kỹ, **mình cũng không tán thành**. Có năm tác động như vậy đã có bằng chứng rõ ràng, và tác động nào cũng có một lá chắn tương ứng.

```mermaid
flowchart LR
  F1["① Mục tiêu ngoại tại<br/>tiền, hình ảnh, danh tiếng"] -.- S1["Mục tiêu nội tại"]
  F2["② So sánh với người hơn mình"] -.- S2["Thước đo của chính mình"]
  F3["③ Đám đông và quyền uy"] -.- S3["Biết cơ chế,<br/>có người phản biện"]
  F4["④ Kỹ thuật thao túng"] -.- S4["Gọi tên được kỹ thuật"]
  F5["⑤ Thiết kế giành sự chú ý"] -.- S5["Friction và default"]
```

<h3 id="intrinsic"><span class="num">8.1</span>Mục tiêu nội tại và ngoại tại: muốn giàu có sai không?</h3>

Muốn giàu có sai không? Không. Vấn đề chỉ đến khi tiền, hình ảnh và sự nể phục của người khác chiếm chỗ của những thứ mình thật sự quý.

Hai người bạn cùng khoá, ra trường cùng năm. Người thứ nhất cố kiếm tiền vì muốn mua căn hộ ở quận trung tâm và để bạn bè cũ phải nể. Người thứ hai làm vì thích cái nghề của mình và hay kèm cặp người mới vào. Năm năm sau, có thể cả hai giàu như nhau, nhưng người thứ hai nhiều khả năng sống dễ chịu hơn.

**Mục tiêu ngoại tại** là tiền, ngoại hình, được người khác công nhận. Người trưởng thành nào đặt nặng những thứ này thường kém sức sống hơn và có nhiều triệu chứng cơ thể hơn. Ai đặt nặng **mục tiêu nội tại**, như gắn bó với người khác, đóng góp cho cộng đồng, giữ sức khoẻ, thì well-being cao hơn <a class="ev ev-mid" href="#r-kasser1996" title="Kasser &amp; Ryan 1996 · Bằng chứng vừa"></a>.

Mối liên hệ này lặp lại rất đều qua hàng trăm mẫu, dù chỉ ở mức nhỏ đến vừa <a class="ev ev-high" href="#r-dittmar2014" title="Dittmar 2014 · Bằng chứng mạnh"></a>. Kết quả này khớp với [chương 7](#needs): mục tiêu ngoại tại ít bồi đắp cho ba nhu cầu nền, lại còn trao thước đo giá trị của mình vào tay người khác. [Chương 10](#money) sẽ cho thấy tiền có ích thật. Thứ cần tránh là để tiền **chiếm chỗ** của những thứ nội tại.

Một câu hỏi để soát lại mục tiêu của mình <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: nếu không ai biết mình đạt được điều này, mình có còn muốn điều đó không? Muốn chạy được 10 km vì thích cảm giác cơ thể khoẻ lên thì vẫn muốn. Muốn chạy 10 km chỉ để đăng lên Facebook thì không.

<details><summary>Đọc thêm: chi tiết các nghiên cứu về mục tiêu ngoại tại</summary><div class="inner">

Trong nghiên cứu của Kasser và Ryan, người đặt nặng mục tiêu ngoại tại hơn các mục tiêu khác còn ít thấy mình đang lớn lên hơn. Mục tiêu nội tại gồm cả chấp nhận bản thân <a class="ev ev-mid" href="#r-kasser1996" title="Kasser &amp; Ryan 1996 · Bằng chứng vừa"></a>.

Tổng hợp của Dittmar gồm 753 kết quả từ 259 mẫu: người càng coi trọng của cải vật chất thì well-being càng thấp <a class="ev ev-high" href="#r-dittmar2014" title="Dittmar 2014 · Bằng chứng mạnh"></a>. Mối liên hệ yếu nhất khi chỉ hỏi người ta coi trọng tiền đến đâu, và rõ hơn khi đo cả một hệ niềm tin xoay quanh của cải. Liên hệ mạnh nhất là với hành vi có hại cho sức khoẻ, thói tiêu tiền liều lĩnh và cái nhìn tiêu cực về bản thân. Yếu nhất là với hài lòng cuộc sống và cảm xúc tiêu cực. Đây là dữ liệu tương quan.

</div></details>

<h3 id="comparison"><span class="num">8.2</span>So sánh: vì sao lướt Facebook xong thấy đời mình kém đi?</h3>

Vì sao lướt Facebook xong lại thấy đời mình kém đi? Vì mình thường so với người hơn mình, và đứng cạnh người hơn thì mình thấy mình nhỏ lại, dù đời mình chẳng có gì thay đổi.

Tối Chủ nhật, mở Facebook: một bạn cùng lớp vừa sang Singapore làm, một người khác khoe nhà mới, một đứa em khoá dưới vừa mua ô tô. Mười phút trước bạn thấy tuần của mình khá ổn; giờ thì không chắc nữa. Hơn 60 năm nghiên cứu cho thấy khi không thấy bị đe doạ, người ta **thích so với người hơn mình**. Phản ứng phổ biến nhất là **contrast**: đứng cạnh người hơn thì mình thấy mình kém đi <a class="ev ev-high" href="#r-gerber2018" title="Gerber, Wheeler &amp; Suls 2018 · Bằng chứng mạnh"></a>. Mà feed toàn bản đã qua chọn lọc: ai cũng đăng ngày nhận nhà mới, ít ai đăng tháng phải chạy vạy trả góp <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Một dạng so sánh ngầm là **maximizing**: lúc nào cũng tìm phương án tốt nhất thay vì một phương án đủ tốt. Người mua điện thoại sau ba tuần đọc review mà vẫn băn khoăn "hay con kia tốt hơn" là một maximizer. Khi đi tìm việc, maximizer kiếm được lương khởi điểm cao hơn 20%, nhưng lại kém hài lòng hơn với chính công việc đó <a class="ev ev-mid" href="#r-iyengar2006" title="Iyengar, Wells &amp; Schwartz 2006 · Bằng chứng vừa"></a>. Lý do: họ dựa nhiều vào thước đo bên ngoài, như người khác lương bao nhiêu, công ty kia thế nào. Thước đo nằm ngoài mình thì chẳng bao giờ thấy đủ, vì lúc nào cũng còn một người hơn và một phương án chưa xem <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Lá chắn là đặt thước đo của chính mình *trước* khi nhìn sang người khác <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Tối Chủ nhật, bạn thấy một người cùng khoá vừa mua ô tô. Trước khi đóng app, đổi sang thước đo của mình: ba tháng trước mình nghe được bao nhiêu phần một đoạn podcast, bây giờ được bao nhiêu? Ba tháng trước mỗi tháng mình để dành được bao nhiêu, bây giờ thì sao? So với chính mình ba tháng trước, bạn thường thấy một bước tiến có thật. So với một người trên feed, bạn chỉ đang nhìn một bản tin đã qua chọn lọc.

<details><summary>Đọc thêm: contrast, và maximizing có thật sự khiến người ta bất hạnh?</summary><div class="inner">

Hiệu ứng contrast khi so với người hơn mình thấy rõ nhất ở chuyện năng lực và cảm xúc <a class="ev ev-high" href="#r-gerber2018" title="Gerber, Wheeler &amp; Suls 2018 · Bằng chứng mạnh"></a>.

Trong nghiên cứu của Iyengar và cộng sự, maximizer còn thấy tệ hơn trong suốt quá trình tìm việc <a class="ev ev-mid" href="#r-iyengar2006" title="Iyengar, Wells &amp; Schwartz 2006 · Bằng chứng vừa"></a>.

Maximizer cũng thường kém hạnh phúc hơn, hay hối tiếc hơn, và dễ chạnh lòng hơn khi so với người hơn mình <a class="ev ev-low" href="#r-schwartz2002" title="Schwartz 2002 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Tuy vậy, một thang đo được thiết kế tốt hơn lại không thấy maximizing gắn với bất mãn cuộc sống. Câu "maximizer thì bất hạnh" có thể một phần là do cách đo <a class="ev ev-low" href="#r-diab2008" title="Diab, Gillespie &amp; Highhouse 2008 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

</div></details>

<h3 id="conformity"><span class="num">8.3</span>Đám đông và quyền uy</h3>

Mình có dễ chạy theo số đông hơn mình tưởng không? Có thể có. Người lớn lên ở một nước đề cao tập thể thường chạy theo đám đông nhiều hơn, và quyền uy kéo mạnh không kém.

Hình dung bạn ngồi trong một phòng với sáu người lạ. Trên bảng có một đoạn thẳng mẫu và ba đoạn để so; rõ ràng đoạn C dài bằng đoạn mẫu. Lần lượt từng người trước bạn nói "đoạn A". Đến lượt bạn. Đó là thí nghiệm Asch kinh điển; những người kia thực ra là người của nhóm nghiên cứu, cố tình nói cùng một đáp án sai. Tổng hợp các thí nghiệm kiểu này ở nhiều nước cho thấy **ở những nước đề cao tập thể, người ta chạy theo đám đông nhiều hơn** <a class="ev ev-high" href="#r-bond1996" title="Bond &amp; Smith 1996 · Bằng chứng mạnh"></a>. Với một người lớn lên ở Việt Nam, áp lực "ai cũng thế" có lẽ nặng hơn mình tưởng <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Quyền uy cũng vậy. Trong thí nghiệm của Milgram, người tham gia được một "nhà nghiên cứu" yêu cầu bấm nút gây sốc điện ngày càng mạnh cho một người khác. Khi thí nghiệm được lặp lại một phần năm 2006, tỷ lệ vâng lời chỉ thấp hơn một chút so với 45 năm trước <a class="ev ev-mid" href="#r-burger2009" title="Burger 2009 · Bằng chứng vừa"></a>.

Biết những kết quả này chưa chắc đã đủ để miễn nhiễm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Hai thói quen đáng giữ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Một, **tách câu hỏi "điều này có đúng không" khỏi câu hỏi "ai đang nói"**, như chấm thi phải rọc phách để người chấm chỉ thấy bài làm, không thấy tên ai viết. Hai, luôn có ít nhất một người mình tin và dám nói điều trái ý mình.

Một buổi họp gia đình <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Bác cả, người có tiếng nói nhất họ, đề xuất anh em góp tiền mua chung một mảnh đất ở quê; hai người nói trước đều gật đầu, đến lượt bạn. Cả đám đông lẫn quyền uy đều đang kéo về phía "đồng ý". Tự hỏi riêng một câu: nếu đứa em út đề xuất đúng ý này, mình có đồng ý không? Nếu không, nêu một câu hỏi cụ thể, như "sau này nhà nào cần tiền gấp thì phần của nhà ấy rút ra thế nào?", thay vì phản đối cả ý tưởng. Bạn góp đúng góc nhìn mà cả nhà đang thiếu, và một người bác biết lo cho con cháu thường sẽ ghi nhận câu hỏi ấy.

<details><summary>Đọc thêm: số liệu về Asch và Milgram</summary><div class="inner">

Tổng hợp của Bond và Smith gồm 133 nghiên cứu kiểu Asch từ 17 nước. Mức chạy theo đám đông ở Mỹ đã giảm dần từ thập niên 1950 <a class="ev ev-high" href="#r-bond1996" title="Bond &amp; Smith 1996 · Bằng chứng mạnh"></a>.

Bản lặp lại năm 2006 của Burger có 70 người tham gia và dừng ở mốc 150 volt để bảo vệ họ. Việc thấy một người khác từ chối **không** khiến người ta vâng lời ít đi <a class="ev ev-mid" href="#r-burger2009" title="Burger 2009 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="manipulation"><span class="num">8.4</span>Gọi tên được kỹ thuật thao túng</h3>

Làm sao để không bị tin giật gân dắt mũi? Không cần kiểm chứng từng tin, vì chẳng ai làm nổi việc đó. Chỉ cần nhận ra vài kỹ thuật thao túng quen thuộc để biết lúc nào nên chậm lại.

Vaccine cho cơ thể làm quen trước với một phiên bản yếu của virus, để khi gặp virus thật thì nhận ra ngay. **Psychological inoculation** làm điều tương tự với đầu óc: cho người ta xem trước, ở liều nhỏ, những kỹ thuật thao túng hay gặp. Sau khi xem năm video ngắn, mỗi video giải thích một kỹ thuật, người ta nhận ra thao túng tốt hơn và phân biệt được nội dung đáng tin tốt hơn. Kết quả lặp lại cả trong một thí nghiệm thật trên YouTube <a class="ev ev-high" href="#r-roozenbeek2022" title="Roozenbeek 2022 · Bằng chứng mạnh"></a>.

Cũng như người bán hàng lâu năm chỉ sờ qua là biết tờ tiền giả nhờ vài dấu hiệu, bạn chỉ cần thuộc ba dấu hiệu sau <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Bài viết khiến mình nổi giận ngay lập tức. Bài viết chỉ chừa cho mình hai lựa chọn, như thể không còn đường nào khác. Bài viết đổ hết lỗi lên một nhóm người. Gặp một trong ba thứ ấy, ví dụ một bài "rút hết tiền khỏi ngân hàng X ngay hôm nay, không thì mất trắng", thì đó là lúc dừng tay trước khi chia sẻ hay làm theo.

<details><summary>Đọc thêm: năm kỹ thuật trong thí nghiệm và quy mô nghiên cứu</summary><div class="inner">

Năm video trong thí nghiệm của Roozenbeek giải thích năm kỹ thuật: ngôn ngữ đánh vào cảm xúc ("kinh hoàng", "phẫn nộ"); lập luận rời rạc, tự mâu thuẫn; ép chọn một trong hai (false dichotomy); đổ hết lỗi cho một nhóm người (scapegoating); công kích con người thay vì lập luận (ad hominem).

Kết quả lặp lại qua sáu thử nghiệm ngẫu nhiên với hơn 6.000 người, và trong thí nghiệm trên YouTube với hơn 22.000 người <a class="ev ev-high" href="#r-roozenbeek2022" title="Roozenbeek 2022 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="attention"><span class="num">8.5</span>Sự chú ý là thứ bị tranh giành</h3>

Vì sao lướt TikTok bốn mươi phút xong chẳng vui hơn chút nào, mà vẫn lướt? Vì feed nuôi cảm giác *muốn*, không phải cảm giác *thích*. Cách bớt hiệu quả nhất là làm cho feed khó với tới hơn, chứ không phải gồng ý chí.

**"Muốn" và "thích" là hai hệ khác nhau trong não.** Dopamine không phải "chất hạnh phúc"; chất này nuôi cảm giác *muốn*, không phải khoái cảm *thích* <a class="ev ev-high" href="#r-schultz1997" title="Schultz 1997 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-berridge1998" title="Berridge &amp; Robinson 1998 · Bằng chứng mạnh"></a>. Một feed vô tận và không đoán trước được thì liên tục tạo bất ngờ: video tiếp theo có thể chán, cũng có thể cực hay. Chính sự không chắc ấy giữ cho cái *muốn* lúc nào cũng còn, kể cả khi cái *thích* đã nguội từ lâu <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

**Khoảng một phần ba thời gian lướt là thời gian chính mình không muốn bỏ ra.** Các nhà nghiên cứu ước tính **31%** thời gian dùng mạng xã hội đến từ vấn đề tự kiểm soát <a class="ev ev-high" href="#r-allcott2022" title="Allcott, Gentzkow &amp; Song 2022 · Bằng chứng mạnh"></a>. Feed không phải chất độc. Vấn đề là feed **chiếm mất thời gian** dành cho những thứ ở [chương 6](#close-ties) và [chương 7](#needs), mà chiếm trái với ý mình.

**Lá chắn là friction**, tức thêm một chút bất tiện trước khi mở. Một ứng dụng chèn một bước chờ vài giây trước khi mở mạng xã hội, kèm một nút "thôi" dễ bấm, đã làm tổng số lần mở giảm 57%. Còn một dòng nhắc "hãy nghĩ lại" suông thì không có tác dụng <a class="ev ev-mid" href="#r-gruning2023" title="Grüning 2023 · Bằng chứng vừa"></a>. Đây chính là nguyên lý ở [chương 2](#situation): đổi tình huống trước, đừng chờ tới lúc phải chọn mới cố thắng.

Một buổi tối <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Đi làm về, mệt, bạn ngồi xuống ghế và mở TikTok "năm phút thôi"; ngẩng lên đã gần một tiếng, buổi nghe tiếng Anh trôi mất. Sau cả một ngày dài, sức tự chủ đang ở mức thấp nhất trong ngày, còn feed thì đã chờ sẵn. Định thắng bằng ý chí vào lúc ấy là tự chọn một trận thua từ trước. Hãy dời trận đấu sang lúc đầu óc còn tỉnh. Một chiều Chủ nhật thong thả, đăng xuất TikTok và chuyển app vào một thư mục ở trang cuối. Mỗi sáng trước khi ra khỏi nhà, để sẵn tai nghe và một tập podcast đã tải trên bàn. Tối về, mở feed tốn thêm mấy bước, còn nghe podcast chỉ cần một bước. Không cần thắng cám dỗ; chỉ cần cám dỗ khó với tới hơn một chút.

<details><summary>Đọc thêm: dopamine, các thí nghiệm tắt mạng xã hội, và mức độ thật của tác hại</summary><div class="inner">

Dopamine báo hiệu độ chênh giữa phần thưởng nhận được và phần thưởng đã dự đoán, gọi là reward prediction error <a class="ev ev-high" href="#r-schultz1997" title="Schultz 1997 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-berridge1998" title="Berridge &amp; Robinson 1998 · Bằng chứng mạnh"></a>.

Khi được cho cơ hội tự đặt giới hạn thời gian dùng, 78% người dùng chọn một giới hạn ràng buộc, và giới hạn đó giảm thời gian dùng 22 phút mỗi ngày <a class="ev ev-high" href="#r-allcott2022" title="Allcott, Gentzkow &amp; Song 2022 · Bằng chứng mạnh"></a>.

Một thí nghiệm khác trả tiền cho người ta tắt Facebook bốn tuần. Họ có thêm 60 phút mỗi ngày, well-being tăng một chút nhưng đo được, và sau thí nghiệm họ vẫn dùng ít hơn trước <a class="ev ev-high" href="#r-allcott2020" title="Allcott 2020 · Bằng chứng mạnh"></a>.

Một nghiên cứu tương quan trên hơn 355.000 thanh thiếu niên cho thấy việc dùng công nghệ chỉ giải thích tối đa 0,4% khác biệt về well-being giữa các em <a class="ev ev-high" href="#r-orben2019" title="Orben &amp; Przybylski 2019 · Bằng chứng mạnh"></a>.

Trong nghiên cứu của Grüning, 36% lần định mở bị bỏ ngay ở bước chờ <a class="ev ev-mid" href="#r-gruning2023" title="Grüning 2023 · Bằng chứng vừa"></a>. Trong đời thường, friction có thể đơn giản là đăng xuất app sau mỗi lần dùng, hoặc để điện thoại sạc ngoài phòng ngủ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: thời gian của mình đi đâu</div>

Mở phần thống kê thời gian dùng máy trên điện thoại (Screen Time trên iPhone, Digital Wellbeing trên Android) và ghi lại hai con số của tuần trước: tổng giờ dùng mạng xã hội, và số lần mở app bạn dùng nhiều nhất. Tuần này, thêm friction cho đúng app đó — đăng xuất sau mỗi lần dùng, hoặc chuyển vào trang cuối — rồi Chủ nhật so lại. Nếu số lần mở giảm mạnh mà bạn chẳng thấy thiếu gì, phần thời gian vừa cắt đi là thói quen chứ không phải nhu cầu <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Nếu bạn thấy thiếu thật — chẳng hạn mất liên lạc với bạn bè — thì giữ phần đó và chỉ cắt phần lướt.

</div>

<h2 id="body"><span class="num">9</span>Cơ thể</h2>

Cơ thể như chiếc xe máy mình đi hằng ngày: người lái giỏi đến đâu mà xe lâu không thay nhớt, lốp non hơi thì cũng chẳng đi xa được. Chương này ngắn, vì các khuyến nghị về sức khoẻ đã khá thống nhất. Điều đáng giá là **biết con số thật** và **biết những niềm tin sai phổ biến**.

<h3 id="sleep"><span class="num">9.1</span>Ngủ: sáu tiếng mà vẫn thấy ổn thì có sao không?</h3>

Ngủ sáu tiếng mà vẫn thấy ổn thì có sao không? Có. Thiếu ngủ kéo dài làm đầu óc sa sút như vừa thức trắng, mà chính người thiếu ngủ không nhận ra.

**Cần bao nhiêu.** Người trưởng thành nên ngủ **7 tiếng trở lên** mỗi đêm, đều đặn <a class="ev ev-high" href="#r-watson2015" title="Watson 2015 · Bằng chứng mạnh"></a>. Đó là thời gian *ngủ thật*, nên thời gian nằm trên giường phải dài hơn thế.

**Thiếu mà không biết mình thiếu.** Trong một thí nghiệm, những người chỉ được nằm giường sáu tiếng mỗi đêm trong hai tuần có độ tỉnh táo và trí nhớ làm việc sa sút ngang sau một đêm thức trắng. Vậy mà phần lớn họ không thấy mình buồn ngủ đến thế <a class="ev ev-mid" href="#r-vandongen2003" title="Van Dongen 2003 · Bằng chứng vừa"></a>. Một tuần ôn thi ngủ sáu tiếng mỗi đêm là một tuần học bài với cái đầu của người vừa thức trắng, mà chẳng ai biết, kể cả chính mình.

**Đều đặn quan trọng không kém.** Sinh viên ngủ thất thường có đồng hồ sinh học muộn hơn khoảng hai tiếng rưỡi so với người ngủ đều, như thể lúc nào cũng sống lệch giờ với mọi người <a class="ev ev-mid" href="#r-phillips2017" title="Phillips 2017 · Bằng chứng vừa"></a>. Giả sử ngày thường bạn dậy lúc 8:00, còn cuối tuần ngủ tới 11:00 <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Đồng hồ sinh học bị kéo lùi ba tiếng hai ngày liền, giống học sinh nghỉ Tết ngủ nướng cả tuần, ra Giêng đi học lại thấy người ê ẩm. Chỉ khác là bạn "nghỉ Tết" mỗi cuối tuần, và sáng thứ Hai nào cũng là ngày đi học lại. Không cần dậy đúng 8:00 vào Chủ nhật; chỉ cần giờ thức cuối tuần đừng lệch quá xa ngày thường.

**Cà phê cuối ngày.** Ly cà phê nên uống cách giờ ngủ ít nhất 8,8 tiếng <a class="ev ev-high" href="#r-gardiner2023" title="Gardiner 2023 · Bằng chứng mạnh"></a>. Nếu thường ngủ lúc 0 giờ, ly cuối nên uống trước khoảng 15:00 <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Một ly lúc 16:00 vì buổi chiều uể oải sẽ khiến đêm đó ngủ ngắn hơn, sáng hôm sau mệt hơn, và chiều hôm sau lại cần thêm một ly. Muốn kiểm, thử hai tuần: một tuần giữ thói quen cũ, một tuần dời ly cuối về trước 15:00 và thay buổi chiều bằng nước hoặc năm phút ra ngoài đi bộ một vòng. Mỗi sáng ghi giờ ngủ và cảm giác lúc thức dậy, chấm từ 1 đến 5.

<details><summary>Đọc thêm: các con số về thiếu ngủ, cà phê và rượu</summary><div class="inner">

Trong thí nghiệm của Van Dongen, nằm giường bốn tiếng mỗi đêm trong hai tuần làm đầu óc sa sút ngang hai đêm thức trắng <a class="ev ev-mid" href="#r-vandongen2003" title="Van Dongen 2003 · Bằng chứng vừa"></a>.

Trên gần 61.000 người, nhóm ngủ đều đặn có nguy cơ tử vong thấp hơn 20–48% so với nhóm thất thường nhất <a class="ev ev-mid" href="#r-windred2024" title="Windred 2024 · Bằng chứng vừa"></a>. Đây là kết quả quan sát.

Ngưỡng 8,8 tiếng tính cho một ly khoảng 107 mg caffeine. Caffeine làm tổng thời gian ngủ giảm trung bình 45 phút <a class="ev ev-high" href="#r-gardiner2023" title="Gardiner 2023 · Bằng chứng mạnh"></a>.

Rượu, kể cả liều thấp tới 0,5 g mỗi kg cân nặng, cũng làm rối giấc REM <a class="ev ev-high" href="#r-gardiner2025" title="Gardiner 2025 · Bằng chứng mạnh"></a>. Với người nặng 64 kg, mức ấy là khoảng 32 g, tức gần hai lon rưỡi bia 330 ml loại 5%.

</div></details>

<h3 id="movement"><span class="num">9.2</span>Vận động: không có thời gian đi gym thì sao?</h3>

Đi làm cả ngày, không có thời gian đi gym thì sao? Không cần gym. Mọi phút vận động đều được tính, và đi bộ nhanh mỗi ngày cộng hai buổi tập ngắn cuối tuần đã đủ chuẩn.

Hướng dẫn của WHO cho người trưởng thành là 150–300 phút vận động vừa mỗi tuần, cộng với tập sức mạnh cho các nhóm cơ chính từ hai ngày mỗi tuần. Hai ý trong hướng dẫn đáng nhớ hơn cả: vận động **bao lâu cũng được tính**, và có vận động vẫn hơn không <a class="ev ev-high" href="#r-bull2020" title="Bull 2020 · Bằng chứng mạnh"></a>. Mười phút đi bộ ra chợ mỗi sáng cũng được tính.

Lợi ích tăng nhanh ở đoạn đầu rồi chững lại, nên người ngồi cả ngày được lợi nhiều nhất khi bắt đầu đi lại. Với tập sức mạnh, lợi ích lớn nhất ở quanh 30–60 phút mỗi tuần, tức là hai buổi ngắn là đủ <a class="ev ev-mid" href="#r-momma2022" title="Momma 2022 · Bằng chứng vừa"></a>.

Một tuần minh hoạ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Giả sử mỗi ngày bạn vốn đã đi bộ mười phút ra bến xe buýt và mười phút về. Chỉ cần bước nhanh hơn thường lệ một chút, năm ngày đã là 100 phút. Thêm một buổi đi bộ năm mươi phút với người nhà vào Chủ nhật là đủ 150 phút. Phần sức mạnh: hai buổi hai mươi lăm phút ở nhà vào thứ Bảy và Chủ nhật, gồm chống đẩy, squat, các bài với sức nặng cơ thể, sau này thêm tạ đơn. Thế là 50 phút, nằm gọn trong khoảng có lợi nhất. Không cần thêm buổi gym nào vào tối ngày thường.

Vận động còn giúp tâm trạng: tập luyện giảm triệu chứng trầm cảm và lo âu <a class="ev ev-mid" href="#r-singh2023b" title="Singh 2023 · Bằng chứng vừa"></a>. Nếu đang điều trị trầm cảm thì bàn với bác sĩ, đừng tự bỏ thuốc để thay bằng chạy bộ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: vận động mạnh, số bước, và bằng chứng về trầm cảm</summary><div class="inner">

WHO cũng chấp nhận 75–150 phút vận động mạnh mỗi tuần thay cho vận động vừa. Nguyên văn hai câu trong hướng dẫn: "bouts of any duration now count" và "some physical activity is better than none" <a class="ev ev-high" href="#r-bull2020" title="Bull 2020 · Bằng chứng mạnh"></a>.

Nguy cơ tử vong giảm dần cho tới khoảng 8.000–10.000 bước mỗi ngày ở người dưới 60 tuổi <a class="ev ev-mid" href="#r-paluch2022" title="Paluch 2022 · Bằng chứng vừa"></a>.

Tập sức mạnh gắn với nguy cơ tử vong thấp hơn 10–17% <a class="ev ev-mid" href="#r-momma2022" title="Momma 2022 · Bằng chứng vừa"></a>.

Phần lớn các bài tổng quan về vận động và tâm trạng có chất lượng thấp <a class="ev ev-mid" href="#r-singh2023b" title="Singh 2023 · Bằng chứng vừa"></a>. Với người đã được chẩn đoán trầm cảm (major depressive disorder), đi bộ hoặc chạy, yoga và tập sức mạnh đều có tác dụng, dù độ tin cậy của bằng chứng còn thấp. Các tác giả đề xuất cân nhắc vận động như một cách điều trị chính, bên cạnh tâm lý trị liệu và thuốc <a class="ev ev-mid" href="#r-noetel2024" title="Noetel 2024 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="food"><span class="num">9.3</span>Ăn: nên để ý điều gì nhất?</h3>

Không muốn đếm calo thì nên để ý điều gì khi ăn? Ba con số của WHO, và cẩn thận với đồ ăn siêu chế biến, vì loại đồ ăn này khiến mình ăn nhiều hơn mà không biết.

Khuyến nghị của WHO cho người trưởng thành <a class="ev ev-high" href="#r-whodiet" title="WHO 2026 · Bằng chứng mạnh"></a>:

- ít nhất **400 g rau và trái cây** mỗi ngày, cỡ một đĩa rau luộc to và hai quả chuối;
- đường tự do dưới **10%** tổng năng lượng;
- muối **dưới 5 g mỗi ngày**, khoảng một thìa cà phê, tính cả muối đã có sẵn trong nước mắm, mì gói, đồ chế biến.

Đồ ăn siêu chế biến khiến người ta ăn nhiều hơn mà không biết. Hai mươi người ở hẳn trong khu nghiên cứu, hai tuần ăn đồ siêu chế biến và hai tuần ăn đồ chưa chế biến, muốn ăn bao nhiêu tuỳ thích. Với đồ siêu chế biến, họ ăn thêm **508 kcal mỗi ngày**, gần bằng một bữa phụ, và tăng 0,9 kg <a class="ev ev-mid" href="#r-hall2019upf" title="Hall 2019 · Bằng chứng vừa"></a>. Không ai trong số họ cố ăn nhiều. Chính loại đồ ăn đã quyết định giúp họ.

Một cách dễ làm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: khi gọi cơm trưa, thêm một đĩa rau, và để dành mì gói, xúc xích cho những hôm thật sự không còn lựa chọn khác.

<details><summary>Đọc thêm: chất béo, chế độ Địa Trung Hải và thịt chế biến sẵn</summary><div class="inner">

WHO còn khuyến nghị: giảm đường tự do xuống 5% trở xuống có thể có thêm lợi ích; tổng chất béo không quá 30% năng lượng, chất béo trans không quá 1% <a class="ev ev-high" href="#r-whodiet" title="WHO 2026 · Bằng chứng mạnh"></a>. Trong nghiên cứu đồ siêu chế biến, giai đoạn ăn đồ chưa chế biến làm người tham gia giảm 0,9 kg <a class="ev ev-mid" href="#r-hall2019upf" title="Hall 2019 · Bằng chứng vừa"></a>.

Ở người có nguy cơ tim mạch cao, chế độ Địa Trung Hải kèm dầu ô liu nguyên chất hoặc các loại hạt giảm biến cố tim mạch lớn khoảng 30% so với nhóm được khuyên ăn ít chất béo <a class="ev ev-mid" href="#r-estruch2018" title="Estruch 2018 · Bằng chứng vừa"></a>. Bản công bố đầu tiên năm 2013 đã bị rút vì lỗi chia nhóm ngẫu nhiên. Con số trên là của bản phân tích lại năm 2018, và kết quả gần như không đổi khi loại 1.588 người bị lệch quy trình.

IARC xếp thịt chế biến sẵn (xúc xích, giăm bông, thịt hộp) vào nhóm 1, gây ung thư cho người, và thịt đỏ vào nhóm 2A, nhiều khả năng gây ung thư cho người (probably carcinogenic) <a class="ev ev-high" href="#r-bouvard2015" title="Bouvard 2015 · Bằng chứng mạnh"></a>. Nhóm phân loại nói về **độ chắc chắn** của bằng chứng, không nói về mức nguy hiểm. Xúc xích cùng nhóm 1 với thuốc lá nghĩa là các nhà khoa học chắc chắn như nhau rằng cả hai gây ung thư. Điều đó không có nghĩa một cây xúc xích nguy hiểm ngang một điếu thuốc.

</div></details>

<h3 id="alcohol"><span class="num">9.4</span>Rượu bia: uống ít có tốt cho tim không?</h3>

Uống ít có tốt cho tim không? Không. Niềm tin ấy đến từ một phép so sánh lệch, và khi so cho đúng, uống ít không giúp gì cả.

Những nghiên cứu cũ so người uống ít với nhóm "không uống". Cái sai nằm ở nhóm "không uống": trong đó có cả những người đã phải bỏ rượu *vì bệnh*. Đặt cạnh một nhóm có sẵn người ốm, người uống ít đương nhiên trông khoẻ hơn. Khi hiệu chỉnh thiên lệch đó, uống ít **không** giảm nguy cơ tử vong so với người chưa từng uống <a class="ev ev-high" href="#r-zhao2023" title="Zhao 2023 · Bằng chứng mạnh"></a>:

```chart bar
lượng ethanol mỗi ngày,nguy cơ tử vong tương đối (người chưa từng uống = 1)
Thỉnh thoảng (dưới 1.3 g),0.96
1.3–24 g,0.93
25–44 g,1.05
45–64 g,1.19
Từ 65 g,1.35
```

<p class="src">Nguồn: Zhao et al. 2023, JAMA Netw Open. Ba mức đầu không khác người chưa từng uống một cách đáng tin cậy; hai mức cuối tăng rõ. Một lon bia 330 ml loại 5% chứa khoảng 13 g ethanol (330 × 0,05 × 0,789).</p>

Cột bằng 1 nghĩa là nguy cơ ngang người chưa từng uống. Ba cột đầu lệch khỏi 1 ít đến mức không phân biệt được với may rủi. Từ khoảng 45 g mỗi ngày, chừng ba lon rưỡi bia, các cột vượt lên rõ. Từ 65 g, tức năm lon, nguy cơ cao thêm hơn một phần ba.

Nên hiểu thế này <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: uống ít không phải thuốc bổ. Nếu uống thì càng ít càng tốt, và đừng uống vì nghĩ rượu có lợi.

<details><summary>Đọc thêm: quy mô nghiên cứu và quan điểm của WHO</summary><div class="inner">

Phân tích của Zhao gộp 107 nghiên cứu cohort với 4,8 triệu người <a class="ev ev-high" href="#r-zhao2023" title="Zhao 2023 · Bằng chứng mạnh"></a>.

WHO châu Âu tuyên bố "không có mức uống rượu nào là an toàn cho sức khoẻ" <a class="ev ev-mid" href="#r-whoalcohol" title="WHO châu Âu 2023 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-anderson2023" title="Anderson 2023 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="tobacco"><span class="num">9.5</span>Thuốc lá</h3>

Hút thuốc mất bao nhiêu, và bỏ thì lấy lại được bao nhiêu? Người đang hút có tỷ lệ tử vong khoảng **gấp ba** người chưa từng hút và **mất hơn 10 năm tuổi thọ**. Bỏ ở tuổi 25–34 thì lấy lại gần trọn mười năm ấy <a class="ev ev-high" href="#r-jha2013" title="Jha 2013 · Bằng chứng mạnh"></a>:

```chart bar
tuổi bỏ thuốc,số năm sống thêm so với tiếp tục hút (xấp xỉ)
25–34,10
35–44,9
45–54,6
```

<p class="src">Nguồn: Jha et al. 2013, NEJM 368(4):341–350. Tác giả ghi "about 10, 9, and 6 years".</p>

Mỗi năm chần chừ thêm, một phần trong số đó mất hẳn.

<details><summary>Đọc thêm: quy mô nghiên cứu</summary><div class="inner">

Nghiên cứu của Jha theo dõi hơn 200.000 người Mỹ <a class="ev ev-high" href="#r-jha2013" title="Jha 2013 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="checkups"><span class="num">9.6</span>Khám định kỳ</h3>

Còn trẻ thì có cần đo huyết áp không? Có, từ 18 tuổi. Huyết áp cao giống mối ăn trong chân tủ: bên ngoài trông vẫn chắc, không có dấu hiệu gì, cho tới ngày chân tủ gãy.

U.S. Preventive Services Task Force (USPSTF), nhóm chuyên gia ra khuyến nghị về y tế dự phòng ở Mỹ, khuyến nghị **sàng lọc tăng huyết áp cho mọi người từ 18 tuổi**. Đo tại cơ sở y tế, và xác nhận lại bằng cách đo bên ngoài trước khi điều trị <a class="ev ev-high" href="#r-uspstf2021" title="USPSTF · Bằng chứng mạnh"></a>. Bao lâu khám một lần thì để bác sĩ quyết định theo tuổi và tiền sử. Cuốn sách chỉ muốn nhắc một điều: **đo, đừng đoán** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<div class="callout data"><div class="ct">Tự kiểm tra: một tuần ngủ và cà phê</div>

Bảy ngày liền, mỗi sáng ghi ba thứ vào điện thoại: giờ lên giường, giờ thức dậy, và giờ uống ly cà phê cuối của hôm trước. Chủ nhật, nhìn lại hai điều. Nếu thời gian ngủ thật (trừ lúc nằm lướt điện thoại) dưới 7 tiếng ở hơn hai đêm, bạn đang thiếu ngủ mà rất có thể không tự nhận ra — đừng tin vào cảm giác "mình vẫn ổn". Nếu giờ thức cuối tuần lệch ngày thường hơn hai tiếng, giấc ngủ của bạn đang lệch nhịp <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Nhân tiện, lần tới ghé hiệu thuốc, đo huyết áp một lần và ghi lại con số.

</div>

<h2 id="money"><span class="num">10</span>Tiền</h2>

Tiền là con dao hai lưỡi: dùng đúng thì thái được thức ăn, dùng sai thì đứt tay. Mà tiền lại có những quy luật mà trực giác hay hiểu sai. Chương này gồm năm phần: tiền có khiến người ta hạnh phúc hơn không, nợ, tiết kiệm, đầu tư, và học về tiền.

<h3 id="money-happiness"><span class="num">10.1</span>Tiền có ích thật — nhưng mất thì đau hơn được</h3>

Kiếm thêm hay giữ cho khỏi mất, cái nào quan trọng hơn? Tiền làm đời mình tốt hơn thật. Nhưng mất một khoản đau hơn được thêm đúng khoản đó, nên giữ cho khỏi hụt thu nhập đáng giá hơn.

**Tiền gây ra hài lòng thật, không chỉ đi cùng.** Như [chương 7](#two-wellbeing) đã nói, mỗi lần thu nhập gấp đôi thì hạnh phúc thêm một nấc <a class="ev ev-high" href="#r-killingsworth2023" title="Killingsworth, Kahneman &amp; Mellers 2023 · Bằng chứng mạnh"></a>. Muốn biết tiền có *gây ra* hạnh phúc không, cần một thí nghiệm phát tiền ngẫu nhiên, và xổ số chính là thí nghiệm ấy. Người trúng giải lớn ở Thuỵ Điển có mức **hài lòng cuộc sống cao hơn, kéo dài hơn một thập kỷ**. Tác động lên cảm giác hạnh phúc hằng ngày thì nhỏ hơn rõ rệt <a class="ev ev-high" href="#r-lindqvist2020" title="Lindqvist, Östling &amp; Cesarini 2020 · Bằng chứng mạnh"></a>. Lại gặp hai thước đo ở [§7.1](#two-wellbeing): tiền nâng bản tổng kết nhiều hơn là nâng chuyện từng ngày.

**Mất đau hơn được.** Mất một khoản thu nhập làm well-being giảm nhiều hơn mức tăng khi được thêm đúng khoản đó <a class="ev ev-mid" href="#r-boyce2013" title="Boyce 2013 · Bằng chứng vừa"></a>. Bị cắt 5 triệu lương đau hơn niềm vui được tăng 5 triệu. Vì thế, giữ cho mình khỏi bị hụt thu nhập đáng giá hơn cố kiếm thêm đúng chừng ấy <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Với tiền, giữ thành quan trọng hơn tấn công, và quỹ dự phòng chính là cách giữ thành.

<details><summary>Đọc thêm: chi tiết nghiên cứu xổ số và dữ liệu Đức, Anh</summary><div class="inner">

Tương quan giữa thu nhập và hạnh phúc chưa phải nhân quả: có thể người vui vẻ thì kiếm ra nhiều tiền hơn. Vì thế mới cần nghiên cứu xổ số.

Người trúng giải ở Thuỵ Điển được khảo sát 5–22 năm sau. Tác động lên sức khoẻ tâm thần cũng nhỏ hơn rõ rệt so với tác động lên hài lòng cuộc sống. Mức hài lòng tăng lên phần lớn là nhờ họ yên tâm hơn về tài chính <a class="ev ev-high" href="#r-lindqvist2020" title="Lindqvist, Östling &amp; Cesarini 2020 · Bằng chứng mạnh"></a>.

Kết quả "mất đau hơn được" dựa trên dữ liệu từ Đức (hơn 28.000 người) và Anh (hơn 20.000 người) <a class="ev ev-mid" href="#r-boyce2013" title="Boyce 2013 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="debt"><span class="num">10.2</span>Nợ: vài khoản trả góp nhỏ thì có sao?</h3>

Có vài khoản trả góp nhỏ thì có sao không? Có, vì mỗi khoản nợ riêng chiếm một phần sự chú ý, kể cả khi tổng số tiền không lớn. Đóng hẳn từng khoản giúp đầu óc nhẹ đi nhiều hơn ta tưởng.

Nợ không có tài sản bảo đảm, như thẻ tín dụng, vay tiêu dùng, mua trả góp qua app, đi cùng sức khoẻ tâm thần kém hơn. Người mắc loại nợ này có tỷ lệ trầm cảm gần gấp ba <a class="ev ev-mid" href="#r-richardson2013" title="Richardson, Elliott &amp; Roberts 2013 · Bằng chứng vừa"></a>.

**Số khoản nợ quan trọng hơn ta nghĩ.** Một chương trình xoá nợ ở Singapore cho thấy điều bất ngờ. Cùng một tổng số tiền được xoá, ai được xoá dứt điểm **thêm một khoản nợ riêng** thì làm bài kiểm tra nhận thức tốt hơn rõ rệt và ít lo âu hơn. Còn tổng số tiền được xoá thì không ảnh hưởng tới lo âu <a class="ev ev-mid" href="#r-ong2019" title="Ong, Theseira &amp; Ng 2019 · Bằng chứng vừa"></a>. Theo các tác giả, mỗi khoản nợ riêng lẻ chiếm mất một phần sự chú ý. Ai từng nấu cỗ ngày Tết đều biết cảm giác này: bếp có ba nồi đang sôi thì đầu óc phải canh cả ba, dù nồi nào cũng nhỏ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Thẻ tín dụng nhắc hạn ngày 5, trả góp điện thoại nhắc ngày 15, khoản vay qua app nhắn tin mỗi tuần.

Giả sử bạn đang có ba khoản <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: trả góp điện thoại còn 3 triệu, trả góp laptop còn 12 triệu, và 4 triệu trên thẻ tín dụng. Mỗi tháng bạn dư ra 3 triệu để trả nợ. Trả mức tối thiểu cho mọi khoản, dồn phần dư vào khoản điện thoại để đóng hẳn trong tháng này, rồi chuyển sang khoản tiếp theo. Sau một tháng, tổng nợ giảm đúng bằng số tiền bạn trả, trả kiểu nào cũng vậy. Nhưng trong đầu chỉ còn hai lời nhắc thay vì ba: một nồi đã được bắc xuống. Một lưu ý: nếu một khoản có lãi suất cao hơn hẳn, thường là thẻ tín dụng, thì xét riêng về tiền, trả khoản ấy trước vẫn lợi hơn. Khi hai cách tính ngược nhau, hãy cân cả hai.

<details><summary>Đọc thêm: các con số về nợ và tranh cãi quanh "cái nghèo kéo trí tuệ xuống"</summary><div class="inner">

Người mắc nợ không có tài sản bảo đảm có tỷ lệ rối loạn tâm thần cao hơn hẳn (tính theo odds là gấp hơn ba lần), và mối liên hệ với tự tử rất mạnh, gần gấp tám <a class="ev ev-mid" href="#r-richardson2013" title="Richardson, Elliott &amp; Roberts 2013 · Bằng chứng vừa"></a>. Đây là dữ liệu quan sát, nên chiều ngược lại cũng có thể đúng một phần: người đang khó khăn tâm lý dễ vay nợ hơn.

Nghiên cứu ở Singapore là bán thực nghiệm, trên những người thu nhập thấp. Xoá dứt thêm một khoản nợ làm khả năng bị lo âu giảm 11%, và present bias, tức xu hướng ưu tiên cái lợi trước mắt, giảm 10%. Tổng số tiền được xoá cũng không ảnh hưởng tới cách họ ra quyết định <a class="ev ev-mid" href="#r-ong2019" title="Ong, Theseira &amp; Ng 2019 · Bằng chứng vừa"></a>.

Ý tưởng rộng hơn, rằng bản thân cái nghèo đã kéo năng lực nhận thức đi xuống <a class="ev ev-low" href="#r-mani2013" title="Mani 2013 · Bằng chứng yếu hoặc đang tranh cãi"></a>, vẫn còn đang tranh cãi. Khi phân tích lại dữ liệu các thí nghiệm trong phòng lab mà không chia thu nhập thành hai nhóm giàu–nghèo, người ta không xác nhận được kết quả. Dữ liệu còn gợi ý rằng lo lắng chuyện tiền ảnh hưởng cả người không nghèo <a class="ev ev-low" href="#r-wicherts2013" title="Wicherts &amp; Scholten 2013 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

</div></details>

<h3 id="saving"><span class="num">10.3</span>Tiết kiệm nhờ default</h3>

Làm sao để dành được tiền mà không cần ý chí? Đặt **default** cho mình: tự động chuyển một phần lương sang tài khoản tiết kiệm ngay ngày nhận lương, và đặt mức ấy đủ cao.

Ra quán gọi một ly cà phê sữa, phần lớn người ta uống đúng độ ngọt quán pha sẵn, ít ai dặn thêm bớt đường <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Với tiền cũng vậy. Ở Đan Mạch, 85% người là "passive savers": họ không phản ứng với ưu đãi thuế, còn khoản đóng góp tự động được cài sẵn thì quyết định gần hết số tiền họ tiết kiệm <a class="ev ev-high" href="#r-chetty2014" title="Chetty 2014 · Bằng chứng mạnh"></a>.

Default vừa là sàn vừa là trần. Khi tham gia quỹ hưu trí là mặc định, tỷ lệ tham gia tăng vọt, nhưng phần lớn người tham gia ở lại đúng mức đóng mặc định thấp <a class="ev ev-high" href="#r-madrian2001" title="Madrian &amp; Shea 2001 · Bằng chứng mạnh"></a>. Bài học là tự đặt default cho mình, và đặt đủ cao.

Có ba cách:

1. **Tự động chuyển tiền tiết kiệm ngay ngày nhận lương**, trước khi kịp tiêu <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.
2. **Tách tài khoản, và khoá khoản dài hạn.** Một tài khoản có khoá, khó rút, giúp số dư tăng rõ so với nhóm đối chứng <a class="ev ev-high" href="#r-ashraf2006" title="Ashraf, Karlan &amp; Yin 2006 · Bằng chứng mạnh"></a>. Đây là friction của [§8.5](#attention), dùng theo chiều có lợi.
3. **Cam kết trước cho lần tăng lương sau.** Chương trình Save More Tomorrow mời người ta cam kết trước: mỗi lần tăng lương, một phần khoản tăng tự chuyển vào tiết kiệm. Vì không phải bớt số tiền đang cầm trong tay, người ta dễ đồng ý hơn <a class="ev ev-mid" href="#r-thaler2004" title="Thaler &amp; Benartzi 2004 · Bằng chứng vừa"></a>.

Một ngày nhận lương <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Giả sử lương về ngày 5. Cách cũ: tiêu trong tháng, cuối tháng còn bao nhiêu thì để dành, mà hầu như chẳng còn bao nhiêu. Với một passive saver, mọi thứ đi theo default, mà default của cách cũ là "tiêu trước, dư đâu để dành đó". Cách mới: lập lệnh chuyển tiền tự động trong app ngân hàng, cứ ngày 5 chuyển một phần cố định của lương, ví dụ 20%, sang một tài khoản tiết kiệm phải chờ mới rút được. Phần còn lại trở thành "lương" của bạn, và bạn sẽ xoay xở trong mức đó, như người ta vẫn xoay xở được với mọi mức lương. Lần tăng lương tới, nâng tỷ lệ ấy lên trước khi tiền về.

<details><summary>Đọc thêm: các con số về default và quỹ dự phòng</summary><div class="inner">

Kết quả của Chetty dựa trên 41 triệu quan sát ở Đan Mạch <a class="ev ev-high" href="#r-chetty2014" title="Chetty 2014 · Bằng chứng mạnh"></a>.

Khi tham gia quỹ hưu trí là mặc định, tỷ lệ tham gia tăng từ 37% lên 86%, nhưng 76% người tham gia ở lại đúng mức đóng mặc định 3% <a class="ev ev-high" href="#r-madrian2001" title="Madrian &amp; Shea 2001 · Bằng chứng mạnh"></a>.

Trong thử nghiệm ngẫu nhiên của Ashraf, tài khoản có khoá giúp số dư tăng 81 điểm phần trăm so với nhóm đối chứng sau 12 tháng <a class="ev ev-high" href="#r-ashraf2006" title="Ashraf, Karlan &amp; Yin 2006 · Bằng chứng mạnh"></a>.

Với Save More Tomorrow, tỷ lệ tiết kiệm tăng từ 3,5% lên 13,6% sau 40 tháng <a class="ev ev-mid" href="#r-thaler2004" title="Thaler &amp; Benartzi 2004 · Bằng chứng vừa"></a>.

Quỹ dự phòng không chỉ để an toàn. Lượng tiền sẵn có trong tài khoản gắn với cảm giác vững vàng về tài chính, và qua đó với mức hài lòng cuộc sống, bất kể thu nhập cao hay thấp <a class="ev ev-mid" href="#r-ruberton2016" title="Ruberton 2016 · Bằng chứng vừa"></a>. Hai người cùng lương, người có sẵn ba tháng chi tiêu trong tài khoản thường thấy vững lòng hơn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div></details>

<h3 id="investing"><span class="num">10.4</span>Đầu tư: chi phí và sự tự tin thái quá là kẻ thù</h3>

Có nên tự chọn cổ phiếu và mua bán thường xuyên không? Với phần lớn người không làm nghề đầu tư, không nên. Chi phí và sự tự tin thái quá ăn mất lợi nhuận, nên một quỹ chỉ số phí thấp, mua đều đặn và ít động tới, là lựa chọn được bằng chứng ủng hộ nhất <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Cuốn sách này không khuyên mua sản phẩm cụ thể nào.

**Giao dịch càng nhiều càng thiệt.**

```chart bar
nhóm,lợi nhuận mỗi năm (%)
Thị trường,17.9
Hộ gia đình trung bình,16.4
Nhóm giao dịch nhiều nhất,11.4
```

<p class="src">Nguồn: Barber & Odean 2000, J Finance 55(2):773–806. 66.465 hộ gia đình, 1991–1996. Hộ trung bình xoay vòng 75% danh mục mỗi năm.</p>

Nhóm mua bán liên tục, tưởng mình nhanh tay hơn thị trường, mỗi năm lại thua thị trường tới 6,5 điểm phần trăm. Các tác giả giải thích bằng **sự tự tin thái quá** <a class="ev ev-high" href="#r-barber2000" title="Barber &amp; Odean 2000 · Bằng chứng mạnh"></a>: ai cũng nghĩ mình đọc biểu đồ giỏi hơn người bán cổ phiếu cho mình.

**Phí nhỏ mà không nhỏ.** Ta thường ước lượng tăng trưởng kép như thể chỉ tăng đều theo một đường thẳng. Thiên lệch này gọi là **exponential growth bias**, và người mắc nặng hơn thì vay nhiều hơn, tiết kiệm ít hơn <a class="ev ev-mid" href="#r-stango2009" title="Stango &amp; Zinman 2009 · Bằng chứng vừa"></a>. Người Việt gọi lãi kép là "lãi mẹ đẻ lãi con": tiền lãi năm nay lại sinh lãi cho năm sau, nên càng về sau, mỗi năm càng đẻ ra nhiều hơn. Trực giác của ta chỉ thấy mấy năm đầu, lúc đàn "con" còn ít.

Một phép tính minh hoạ, với giả định nêu rõ và **không phải dự báo lợi nhuận**: góp 5 triệu đồng mỗi tháng trong 30 năm (tổng góp 1,8 tỷ), lợi nhuận trước phí 8% mỗi năm, lãi gộp hằng tháng.

| Cách tính | Kết quả sau 30 năm |
|---|---|
| Tổng tiền tự góp | 1,8 tỷ |
| Trực giác tuyến tính (tính như lãi đơn 8%/năm) | khoảng 3,95 tỷ |
| Lãi kép, phí 1,5%/năm | khoảng 5,53 tỷ |
| Lãi kép, phí 0,1%/năm | khoảng 7,30 tỷ |

Trực giác tuyến tính đánh giá thấp gần một nửa sức mạnh của lãi kép: 3,95 tỷ so với 7,30 tỷ. Cũng vì thế mà ta xem nhẹ cái giá của phí. Chênh lệch phí 1,4 điểm phần trăm mỗi năm làm mất khoảng 1,77 tỷ, tức khoảng 24% kết quả cuối cùng. Phí không lấy 1,4% một lần, mà lấy *mỗi năm*, cùng cả phần lãi số tiền ấy lẽ ra còn sinh ra về sau.
