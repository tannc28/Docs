Huyết áp cao thường không có triệu chứng, nên chỉ đo mới biết. U.S. Preventive Services Task Force (USPSTF) — nhóm chuyên gia ra khuyến nghị về y tế dự phòng ở Mỹ — khuyến nghị **sàng lọc tăng huyết áp cho mọi người từ 18 tuổi**, đo tại cơ sở y tế, và xác nhận bằng đo ngoài cơ sở y tế trước khi điều trị ([USPSTF](#r-uspstf2021)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Lịch khám cụ thể nên do bác sĩ quyết định theo tuổi và tiền sử; điều cuốn sách này muốn nói chỉ là: **đo, đừng đoán** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h2 id="money"><span class="num">10</span>Tiền</h2>

Tiền là một công cụ, và như mọi công cụ, tiền có những quy luật mà người ta hay hiểu sai. Chương này gồm năm phần: tiền có làm hạnh phúc không, nợ, tiết kiệm, đầu tư, và học về tiền.

<h3 id="money-happiness"><span class="num">10.1</span>Tiền có ích thật — nhưng mất thì đau hơn được</h3>

Như [chương 7](#two-wellbeing) đã nói, với phần lớn mọi người, hạnh phúc tăng theo logarit của thu nhập ([Killingsworth, Kahneman & Mellers 2023](#r-killingsworth2023)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Bằng chứng nhân quả rõ nhất đến từ xổ số: người trúng giải lớn ở Thuỵ Điển, được khảo sát 5–22 năm sau, có mức **hài lòng cuộc sống cao hơn kéo dài hơn một thập kỷ** so với nhóm đối chứng; tác động lên mức hạnh phúc và sức khoẻ tâm thần thì nhỏ hơn rõ rệt; và mức hài lòng cuộc sống tăng lên một phần quan trọng là nhờ họ hài lòng hơn về tài chính ([Lindqvist, Östling & Cesarini 2020](#r-lindqvist2020)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Nhưng có một bất đối xứng: dữ liệu từ Đức (28.723 người) và Anh (20.570 người) cho thấy **mất thu nhập ảnh hưởng tới well-being nhiều hơn được thêm một khoản tương đương** ([Boyce 2013](#r-boyce2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Hệ quả <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: một khoản dự phòng để không bị hụt thu nhập đáng giá hơn niềm vui khi được thêm đúng khoản đó.

<h3 id="debt"><span class="num">10.2</span>Nợ</h3>

Nợ không có tài sản bảo đảm — thẻ tín dụng, vay tiêu dùng — đi kèm sức khoẻ tâm thần kém hơn (rối loạn tâm thần OR = 3,24, trầm cảm OR = 2,77), và có mối liên hệ mạnh với tự tử (OR = 7,9) ([Richardson, Elliott & Roberts 2013](#r-richardson2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; đây là dữ liệu quan sát. Một nghiên cứu bán thực nghiệm cho thấy **số khoản nợ** quan trọng hơn ta nghĩ: những người thu nhập thấp được xoá nợ, cùng một tổng số tiền nhưng được xoá **thêm một khoản nợ riêng**, có khả năng nhận thức tốt hơn khoảng một phần tư độ lệch chuẩn, khả năng lo âu giảm 11%, và present bias giảm 10%; còn tổng số tiền được xoá thì không ảnh hưởng tới lo âu và quyết định ([Ong, Theseira & Ng 2019](#r-ong2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Theo tác giả, mỗi khoản nợ riêng lẻ chiếm mất một phần sự chú ý của mình. Ý tưởng rộng hơn rằng nghèo khó tự nó làm giảm năng lực nhận thức ([Mani 2013](#r-mani2013)) vẫn đang bị tranh cãi: phân tích lại dữ liệu các thí nghiệm trong phòng lab, không chia thu nhập thành hai nhóm giàu–nghèo, không xác nhận được kết quả, và gợi ý rằng lo lắng tiền bạc ảnh hưởng cả người không nghèo ([Wicherts & Scholten 2013](#r-wicherts2013)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Hệ quả thực tế <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: tránh để nợ rải rác; nếu đã có nhiều khoản, gom lại và trả dứt từng khoản một.

<h3 id="saving"><span class="num">10.3</span>Tiết kiệm nhờ default</h3>

Phần lớn con người tiết kiệm một cách thụ động: trong 41 triệu quan sát ở Đan Mạch, 85% là "passive savers" — không phản ứng với ưu đãi thuế, nhưng bị chi phối mạnh bởi khoản đóng góp tự động được cài sẵn cho họ ([Chetty 2014](#r-chetty2014)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Khi việc tham gia quỹ hưu trí là mặc định, tỷ lệ tham gia tăng từ 37% lên 86% — nhưng 76% ở lại đúng mức đóng mặc định 3% ([Madrian & Shea 2001](#r-madrian2001)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Default vừa là sàn vừa là trần. Ba cách tận dụng default cho mình:

1. **Tự động chuyển tiền tiết kiệm ngay ngày nhận lương**, trước khi kịp tiêu — biến tiết kiệm thành default <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.
2. **Tách tài khoản, và khoá khoản dài hạn.** Một tài khoản có khoá, khó rút, làm số dư tăng 81 điểm phần trăm so với nhóm đối chứng sau 12 tháng trong một thử nghiệm ngẫu nhiên ([Ashraf, Karlan & Yin 2006](#r-ashraf2006)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.
3. **Cam kết trước cho lần tăng lương sau.** Chương trình Save More Tomorrow đưa tỷ lệ tiết kiệm từ 3,5% lên 13,6% sau 40 tháng ([Thaler & Benartzi 2004](#r-thaler2004)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Một quỹ dự phòng không chỉ để an toàn: lượng tiền sẵn có trong tài khoản gắn với cảm giác ổn định tài chính và qua đó với mức hài lòng cuộc sống, độc lập với thu nhập ([Ruberton 2016](#r-ruberton2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

<h3 id="investing"><span class="num">10.4</span>Đầu tư: chi phí và sự tự tin thái quá là kẻ thù</h3>

Ba kết quả lớn cùng chỉ một hướng. Tổng các quỹ cổ phiếu quản lý chủ động ở Mỹ gần như chính là thị trường, nhưng chi phí cao của việc quản lý chủ động làm lợi nhuận của nhà đầu tư thấp đi đúng bằng chừng ấy; rất ít quỹ kiếm đủ để bù chi phí ([Fama & French 2010](#r-fama2010)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Giai đoạn 1980–2006, nhà đầu tư Mỹ mỗi năm tốn 0,67% giá trị thị trường cho việc tìm lợi nhuận vượt trội, và một nhà đầu tư điển hình sẽ được thêm 0,67 điểm phần trăm mỗi năm nếu chuyển sang danh mục thụ động bám thị trường ([French 2008](#r-french2008)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Và giao dịch càng nhiều càng thiệt:

```chart bar
nhóm,lợi nhuận mỗi năm (%)
Thị trường,17.9
Hộ gia đình trung bình,16.4
Nhóm giao dịch nhiều nhất,11.4
```

<p class="src">Nguồn: Barber & Odean 2000, J Finance 55(2):773–806. 66.465 hộ gia đình, 1991–1996. Hộ trung bình xoay vòng 75% danh mục mỗi năm.</p>

Tác giả giải thích kết quả bằng **sự tự tin thái quá** ([Barber & Odean 2000](#r-barber2000)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Bài học chung <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: với phần lớn người không làm nghề đầu tư, một quỹ chỉ số phí thấp, mua đều đặn và ít động tới, là lựa chọn mà bằng chứng ủng hộ nhất. Cuốn sách này không khuyên mua sản phẩm cụ thể nào.

Vì sao một khác biệt phí nhỏ lại quan trọng? Vì con người có **exponential growth bias** — xu hướng ước lượng tăng trưởng kép như thể nó chỉ tăng đều; những hộ gia đình bị thiên lệch này nhiều hơn thì vay nhiều hơn và tiết kiệm ít hơn ([Stango & Zinman 2009](#r-stango2009)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Một phép tính minh hoạ, với giả định nêu rõ — **không phải dự báo lợi nhuận**:

| Giả định: góp 5 triệu đồng mỗi tháng trong 30 năm (tổng góp 1,8 tỷ), lợi nhuận trước phí 8%/năm, lãi gộp hằng tháng | Kết quả sau 30 năm |
|---|---|
| Trực giác tuyến tính (tính như lãi đơn 8%/năm) | khoảng 3,95 tỷ |
| Lãi kép, phí 0,1%/năm | khoảng 7,30 tỷ |
| Lãi kép, phí 1,5%/năm | khoảng 5,53 tỷ |

Trực giác tuyến tính đánh giá thấp gần một nửa sức mạnh của lãi kép, và cũng vì thế đánh giá thấp cái giá của phí: chênh lệch phí 1,4 điểm phần trăm mỗi năm — nghe rất nhỏ — làm mất khoảng 1,77 tỷ, tức khoảng 24% kết quả cuối cùng.

<h3 id="money-learning"><span class="num">10.5</span>Học về tiền có ích</h3>

Một thời gian dài người ta tin giáo dục tài chính gần như vô dụng, dựa trên một meta-analysis cho kết luận bi quan ([Fernandes, Lynch & Netemeyer 2014](#r-fernandes2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Tổng hợp mới hơn, gồm 76 thí nghiệm ngẫu nhiên với hơn 160.000 người, cho thấy các chương trình giáo dục tài chính có tác động nhân quả tích cực lên cả hiểu biết lẫn hành vi tài chính, với độ lớn "có ý nghĩa kinh tế", tương đương các can thiệp giáo dục ở lĩnh vực khác, và kết quả vững sau khi hiệu chỉnh publication bias ([Kaiser 2022](#r-kaiser2022)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Chương này cũng là một phần nhỏ của việc học ấy.

<div class="recall">

**Câu hỏi nhớ lại — Phần III.**

<details><summary>Hai loại well-being là gì, và mỗi loại gắn với những gì?</summary><div class="inner">

Emotional well-being (chất lượng cảm xúc từng giờ) gắn mạnh với sức khoẻ, sự cô đơn, việc chăm sóc người khác; life evaluation (đánh giá cuộc sống khi nhìn lại) gắn chặt với thu nhập và học vấn (Kahneman & Deaton 2010).

</div></details>

<details><summary>"Tiền không mua được hạnh phúc quá một mức" — đúng không?</summary><div class="inner">

Với phần lớn mọi người là không: hạnh phúc tăng theo logarit của thu nhập; chững lại chỉ ở nhóm kém hạnh phúc nhất (Killingsworth, Kahneman & Mellers 2023). Nhưng mất thu nhập đau hơn được thêm (Boyce 2013).

</div></details>

<details><summary>Ba nhu cầu nền theo self-determination theory?</summary><div class="inner">

Tự chủ, năng lực, gắn kết (Ryan & Deci 2000).

</div></details>

<details><summary>Năm tác động chi phối và lá chắn tương ứng?</summary><div class="inner">

Mục tiêu ngoại tại → mục tiêu nội tại; so sánh lên → thước đo của chính mình; đám đông và quyền uy → tách "đúng hay sai" khỏi "ai nói", có người phản biện; kỹ thuật thao túng → nhận ra kiểu thao túng (inoculation); thiết kế giành chú ý → friction và default.

</div></details>

<details><summary>Uống ít rượu có tốt cho sức khoẻ không?</summary><div class="inner">

Không có bằng chứng: sau khi hiệu chỉnh thiên lệch, uống ít không giảm nguy cơ tử vong so với người chưa từng uống, và uống nhiều làm tăng (Zhao 2023).

</div></details>

<details><summary>Vì sao một khác biệt phí khoảng 1–1,5 điểm phần trăm mỗi năm lại lớn?</summary><div class="inner">

Vì lãi kép, mà trực giác của ta lại ước lượng tăng trưởng kép như tăng đều (exponential growth bias, Stango & Zinman 2009). Qua vài chục năm, phí nhỏ ăn mất một phần lớn kết quả.

</div></details>

</div>


<h2 id="part-4" class="part">Phần IV — Hướng đi</h2>

<h2 id="goals"><span class="num">11</span>Mục tiêu</h2>

Một mục tiêu không tự biến thành hành vi; mục tiêu cần một hệ thống đi kèm. Hệ thống dưới đây được ghép từ những phát hiện vững nhất về việc đặt, giữ và buông mục tiêu. Từng bước có bằng chứng riêng; còn việc ghép chúng thành một vòng là lựa chọn thiết kế của cuốn sách <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

```mermaid
flowchart LR
  A["① Chọn: vì sao<br/>mình muốn điều này?"] --> B["② Ít mục tiêu cùng lúc,<br/>một mục tiêu trọng tâm"]
  B --> C["③ Đặt ở tầng quy trình:<br/>hành vi mình kiểm soát"]
  C --> D["④ Gắn vào tình huống:<br/>if-then, chuẩn bị sẵn"]
  D --> E["⑤ Ghi lại và<br/>chia sẻ tiến độ"]
  E --> F["⑥ Review đều đặn:<br/>cả thành công lẫn thất bại"]
  F -->|"còn hợp"| C
  F -->|"không còn khả thi"| G["⑦ Buông, và<br/>gắn với mục tiêu thay thế"]
  G --> A
```

<h3 id="choose-goals"><span class="num">11.1</span>Chọn mục tiêu nào</h3>

Câu hỏi đầu tiên không phải "làm thế nào" mà là "**vì sao**". Những mục tiêu xuất phát từ giá trị và sự quan tâm thật của mình — self-concordant goals — được theo đuổi bền bỉ hơn, đạt được nhiều hơn, và khi đạt thì làm tăng well-being nhiều hơn ([Sheldon & Elliot 1999](#r-sheldon1999)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; qua các học kỳ, chúng tạo thành một vòng xoáy tích cực ([Sheldon & Houser-Marko 2001](#r-sheldon2001)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Mục tiêu dạng "muốn làm" đi kèm ít cảm giác bị cám dỗ hơn, còn mục tiêu dạng "phải làm" đi kèm cảm giác cám dỗ và trở ngại nhiều hơn ([Milyavskaya 2015](#r-milyavskaya2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; động lực tự thân liên quan tới tiến bộ, động lực từ áp lực thì không ([Koestner 2008](#r-koestner2008)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Đây chính là ba nhu cầu nền ở [chương 7](#needs) — nhất là tự chủ — thể hiện ra ở từng mục tiêu.

Câu hỏi thứ hai là **bao nhiêu**. Số hành vi được khuyến nghị thay đổi cùng lúc ở mức **vừa phải** tạo ra nhiều thay đổi nhất, và khi động lực thấp, ôm nhiều càng hại ([Wilson 2015](#r-wilson2015)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Xung đột giữa các mục tiêu đi kèm well-being thấp hơn, còn các mục tiêu hỗ trợ nhau thì đi kèm sự dấn thân nhiều hơn ([Riediger & Freund 2004](#r-riediger2004)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Một quy tắc dùng được <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: mỗi giai đoạn vài tháng chọn **một mục tiêu trọng tâm** nhận phần lớn sức lực, các mục tiêu còn lại giữ ở "mức duy trì" — mức tối thiểu để không thụt lùi.

<h3 id="process-goals"><span class="num">11.2</span>Đặt mục tiêu ở tầng quy trình</h3>

Mục tiêu cụ thể và đủ khó cho kết quả tốt hơn lời dặn chung chung "cố gắng hết sức", còn với nhiệm vụ phức tạp, mới mẻ, mục tiêu **học** — tìm ra cách làm — tốt hơn mục tiêu thành tích ([Locke & Latham 2002](#r-locke2002)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Đặt mục tiêu ở tầng nào cũng quan trọng. Trong thể thao:

```chart bar
loại mục tiêu,hiệu ứng (d)
Kết quả cuối cùng (thắng giải),0.09
Mốc thành tích (đạt thời gian X),0.44
Quy trình (điều tập trung khi đang thực hiện),1.36
```

<p class="src">Nguồn: Williamson et al. 2022. Meta-analysis gồm 27 nghiên cứu, toàn bộ trong thể thao, phần lớn trong phòng thí nghiệm; mục tiêu kết quả chỉ có 2 nghiên cứu và không có ý nghĩa thống kê.</p>

Mục tiêu đặt ở tầng **quy trình** — điều mình tập trung làm ngay khi đang thực hiện kỹ năng, như "giữ khuỷu tay thẳng khi ném" — tạo hiệu ứng lớn hơn nhiều so với mục tiêu ở tầng kết quả ([Williamson 2022](#r-williamson2022)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Mở rộng ý đó sang những mục tiêu như "bốn buổi tập mỗi tuần" hay "mỗi sáng 20 phút ôn bài" là suy luận của cuốn sách <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>, với một lý do dễ hiểu: kết quả phụ thuộc nhiều thứ ngoài tầm tay, còn quy trình là thứ mình làm được hôm nay. Kết quả cho biết hướng đi; quy trình mới là thứ mình điều khiển được <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="monitoring"><span class="num">11.3</span>Ghi lại và chia sẻ</h3>

Tổng hợp 138 thử nghiệm ngẫu nhiên với 19.951 người cho thấy theo dõi tiến độ làm tăng khả năng đạt mục tiêu, d = 0,40, và hiệu ứng mạnh hơn hẳn khi kết quả được ghi lại và được chia sẻ ([Harkin 2016](#r-harkin2016)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>:

```chart bar
cách theo dõi,hiệu ứng (d)
Không ghi lại,0.29
Ghi lại,0.43
Giữ riêng cho mình,0.19
Báo cáo cho người khác,0.47
```

<p class="src">Nguồn: Harkin et al. 2016, Psych Bull. Hai phép so sánh riêng: ghi lại hay không, và giữ riêng hay báo cáo cho người khác. Mức "công khai" (0,55) chỉ dựa trên 3 nghiên cứu nên không đưa vào. Sau khi hiệu chỉnh publication bias, hiệu ứng chung còn khoảng 0,19 — vẫn dương.</p>

Theo dõi đúng thứ mình muốn đổi cũng quan trọng: theo dõi **hành vi** thì đổi hành vi, theo dõi **kết quả** thì đổi kết quả ([Harkin 2016](#r-harkin2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Có một người để kể tiến độ — bạn đời, một người bạn — vừa là một cách theo dõi hiệu quả, vừa là dịp để gần nhau hơn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="review"><span class="num">11.4</span>Review đều đặn</h3>

Bằng chứng mạnh nhất về việc nhìn lại đến từ công việc và huấn luyện: buổi debrief sau công việc nâng hiệu suất khoảng 25%, d = 0,67 ([Tannenbaum & Cerasoli 2013](#r-tannenbaum2013)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; after-action review cải thiện các tiêu chí đánh giá huấn luyện nói chung, d = 0,79 ([Keiser & Arthur 2021](#r-keiser2021)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; và review **cả thành công lẫn thất bại** tốt hơn chỉ review thất bại ([Ellis & Davidi 2005](#r-ellis2005)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cuốn sách chưa tìm thấy thử nghiệm nào đo trực tiếp việc một người tự review mỗi tuần cho mục tiêu cuộc sống; áp dụng bằng chứng trên vào đời riêng là một suy luận <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Một buổi review hai mươi phút mỗi tuần có thể gồm ba câu hỏi: *Tuần này việc gì suôn sẻ, vì sao? Việc gì trục trặc, tình huống nào làm hỏng nó? Tuần tới đổi một điều gì?*

<h3 id="let-go"><span class="num">11.5</span>Buông bỏ, và gắn với mục tiêu mới</h3>

```chart bar
khả năng,tương quan với chất lượng sống (r)
Disengagement — buông mục tiêu không còn khả thi,0.08
Re-engagement — gắn với mục tiêu mới thay thế,0.19
```

<p class="src">Nguồn: Barlow, Wrosch & McGrath 2020, meta-analysis 31 mẫu; tương quan, hiệu ứng nhỏ.</p>

Buông một mục tiêu không còn khả thi và gắn với một mục tiêu mới là hai kỹ năng khác nhau, và **gắn với mục tiêu mới quan trọng hơn buông bỏ** ([Barlow, Wrosch & McGrath 2020](#r-barlow2020); [Wrosch 2003](#r-wrosch2003)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cùng meta-analysis có một chi tiết cần nhớ: ở những mẫu có nguy cơ trầm cảm, mối liên hệ bị **đảo ngược**: buông nhiều lại đi kèm nhiều triệu chứng trầm cảm hơn, chứ không ít hơn. Một suy luận thận trọng từ đó: quyết định buông nên được đưa ra ở buổi review, lúc bình tĩnh, chứ không phải vào buổi tối tệ nhất <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="week"><span class="num">11.6</span>Xây một tuần từ các nguyên lý</h3>

Ghép các chương lại, có thể xây một tuần theo năm bước. Đây là phương pháp của cuốn sách <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>, không phải một nghiên cứu; mỗi bước dựa trên một chương.

1. **Xếp những việc cố định trước**: giấc ngủ (giờ thức cố định — [chương 9](#sleep)) và thời gian với người thân ([chương 6](#close-ties)). Đây là phần trụ cột; mục tiêu cá nhân xếp quanh chúng, không chiếm chỗ của chúng.
2. **Chọn một mục tiêu trọng tâm** cho giai đoạn này, các mục tiêu khác ở mức duy trì ([§11.1](#choose-goals)).
3. **Xếp mỗi việc vào khung giờ hợp với nó**: việc khó vào lúc còn sức; lúc mệt chỉ để những việc nhỏ đã chuẩn bị sẵn ([chương 2](#cold-hot)).
4. **Đặt sẵn một mức tối thiểu** cho ngày tệ — nhỏ đến mức gần như không thể thất bại — và thưởng cho việc quay lại sau ngày lỡ ([§2.3](#habits)).
5. **Ghi lại, chia sẻ, review mỗi tuần**, và chỉ đổi kế hoạch ở buổi review ([§11.3](#monitoring), [§11.4](#review)).

Khi cuộc sống đổi — việc mới, nhà mới, một người mới — làm lại năm bước này. Lịch sẽ đổi; nguyên lý thì không.

<h2 id="decisions"><span class="num">12</span>Quyết định lớn</h2>

Những quyết định lớn — học gì, làm ở đâu, sống với ai, có rời đi không — hiếm khi lặp lại, nên ta gần như không có cơ hội học từ kinh nghiệm của chính mình. Vì thế chúng là nơi các thiên lệch của [chương 2](#cold-hot) gây hại nhiều nhất. Chương này đi theo trình tự của một quyết định.

```mermaid
flowchart TD
  A["① Lấy dữ liệu từ bên ngoài:<br/>những người đã làm điều này<br/>thường ra sao?"] --> B["② Lùi ra xa:<br/>mình sẽ khuyên một người bạn thế nào?"]
  B --> C["③ Ước lượng hai lần<br/>và lấy trung bình"]
  C --> D["④ Coi như nó chắc chắn<br/>đã thất bại: vì sao?"]
  D --> E{"⑤ Vẫn phân vân<br/>sau thời gian dài?"}
  E -->|"có"| F["Dám thay đổi thường<br/>không tệ như mình sợ"]
  E -->|"không"| G["Quyết, rồi cam kết"]
  F --> G
  G --> H["⑥ Đánh giá quyết định theo quá trình,<br/>không theo kết quả"]
```

<h3 id="outside-view"><span class="num">12.1</span>Nhìn từ bên ngoài</h3>

Khi đánh giá một kế hoạch, người ta tự nhiên dùng **inside view**: nghĩ về chính kế hoạch đó, các bước, các kịch bản — và kết quả là dự đoán lạc quan quá mức, vì bỏ qua thống kê của những trường hợp tương tự ([Kahneman & Lovallo 1993](#r-kahneman1993)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. **Outside view** hỏi một câu khác: *những người đã làm điều tương tự thường mất bao lâu, thường thành công tới đâu?* Ví dụ rõ nhất là planning fallacy ở sinh viên viết luận văn ([Buehler 1994](#r-buehler1994)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>:

```chart bar
thời gian hoàn thành luận văn,số ngày
Dự đoán của sinh viên,33.9
Dự đoán "nếu mọi thứ tệ nhất",48.6
Thực tế,55.5
```

<p class="src">Nguồn: Buehler, Griffin & Ross 1994, JPSP 67(3):366–381. Trung bình thực tế còn dài hơn cả dự đoán tệ nhất (chênh lệch này không có ý nghĩa thống kê), và chưa tới một nửa (48,7%) xong trước mốc tệ nhất ấy.</p>

Khi lập kế hoạch, 74% suy nghĩ của người ta là về kịch bản tương lai, chỉ 7% về kinh nghiệm quá khứ; và khi được yêu cầu **nối dự đoán với những lần trước** của chính mình, sai lệch lạc quan biến mất; chỉ nhớ lại quá khứ mà không nối nó với dự đoán thì không đủ ([Buehler 1994](#r-buehler1994)). Đó là toàn bộ bí quyết của bước ①: trước khi tin vào kế hoạch, hãy tìm dữ liệu về những trường hợp giống kế hoạch của mình.

<h3 id="distance-decide"><span class="num">12.2</span>Lùi ra xa, và hỏi lại chính mình</h3>

Như [chương 3](#distance) đã nói, người ta suy luận khôn ngoan hơn về vấn đề của người khác, và lùi ra xa — nghĩ về mình như người ngoài — xoá được khoảng cách đó ([Grossmann & Kross 2014](#r-grossmann2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Hiệu ứng này còn ở ngoài phòng thí nghiệm: trong một tháng viết nhật ký, những người được hướng dẫn suy ngẫm về các tình huống hằng ngày ở ngôi thứ ba suy luận khôn ngoan hơn so với chính họ trước đó, còn nhóm viết ở ngôi thứ nhất thì không đổi; một thí nghiệm kéo dài một tuần lặp lại kết quả, lần này nhóm ngôi thứ ba vượt cả nhóm ngôi thứ nhất ([Grossmann 2021](#r-grossmann2021)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Bước ③ dựa trên một phát hiện lạ: **ước lượng lần thứ hai của chính mình** chứa thông tin mới. Trung bình của hai lần ước lượng tốt hơn từng lần riêng lẻ — "crowd within" ([Vul & Pashler 2008](#r-vul2008)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, và hiệu ứng này đã được lặp lại trong một nghiên cứu đăng ký trước, cả khi hai lần cách nhau ngay lập tức lẫn ba tuần ([Steegen 2014](#r-steegen2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Với ý kiến của người khác cũng vậy: khi sửa ước lượng của mình theo một người khác, **lấy trung bình** tốt hơn chọn một trong hai trong rất nhiều hoàn cảnh ([Soll & Larrick 2009](#r-soll2009)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Ứng dụng <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: với một con số quan trọng — chi phí, thời gian, khả năng thành công — ước lượng một lần, để vài ngày, ước lượng lại như thể mình đã sai lần đầu, rồi lấy trung bình; hỏi thêm một người hiểu chuyện và gộp vào.

Bước ④ — coi như quyết định đã **chắc chắn** thất bại rồi giải thích vì sao — dựa trên quan sát rằng khi một kết cục được coi là *chắc chắn* đã xảy ra, chứ không chỉ có thể xảy ra, người ta nghĩ ra những lời giải thích dài hơn và cụ thể hơn; còn đặt sự kiện ở quá khứ hay tương lai thì gần như không ảnh hưởng ([Mitchell, Russo & Pennington 1989](#r-mitchell1989)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Dùng cách này làm công cụ ra quyết định là một ứng dụng <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="intuition"><span class="num">12.3</span>Khi nào tin trực giác</h3>

Hai nhà nghiên cứu từng đứng ở hai phía đối lập — một người nghiên cứu sai lầm của trực giác, một người nghiên cứu trực giác của chuyên gia — đã thống nhất một tiêu chí: trực giác đáng tin **chỉ khi** môi trường đủ đều đặn để có quy luật, và người đó đã có cơ hội học quy luật ấy ([Kahneman & Klein 2009](#r-kahneman2009)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Một người lính cứu hoả lâu năm có trực giác đáng tin về đám cháy; hầu như không ai có trực giác đáng tin về việc nên chọn nghề nào, vì quyết định ấy không lặp lại đủ để học <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Còn lời khuyên "để vô thức xử lý" — đi làm việc khác rồi quyết theo cảm giác — không đứng vững: bản lặp lại với 399 người không tìm thấy lợi thế nào của "unconscious thought", và trong meta-analysis, hiệu ứng nhỏ từng được báo cáo biến mất sau khi hiệu chỉnh publication bias ([Nieuwenstein 2015](#r-nieuwenstein2015)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Ngủ một đêm trước một quyết định lớn vẫn có ích, nhưng là vì một đêm giúp mình bình tĩnh và có khoảng cách, không phải vì vô thức đã tính hộ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="regret"><span class="num">12.4</span>Hối tiếc, và can đảm để thay đổi</h3>

Nghiên cứu kinh điển về hối tiếc cho rằng người ta hối tiếc vì **hành động** nhiều hơn trong ngắn hạn, nhưng về lâu dài lại hối tiếc vì **những điều đã không làm** nhiều hơn ([Gilovich & Medvec 1995](#r-gilovich1995)). Hai bản lặp lại gần đây xác nhận rằng hối tiếc dịch dần từ việc đã làm sang việc đã không làm theo thời gian, nhưng yếu hơn; trong mẫu lớn năm 2023, khi nhìn lại cả đời, số người day dứt nhất vì điều đã không làm chỉ ngang số người day dứt vì điều đã làm, 49% so với 51% ([Yeung & Feldman 2022](#r-yeung2022); [Richardson & Gilovich 2023](#r-richardson2023)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Những hối tiếc dai dẳng nhất đến từ khoảng cách giữa con người hiện tại và **con người lý tưởng** mình muốn trở thành, hơn là con người mình "phải" là ([Davidai & Gilovich 2018](#r-davidai2018)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Và người ta hối tiếc nhiều nhất về học hành, sự nghiệp, tình cảm, con cái — những lĩnh vực mà họ thấy mình **còn cơ hội** thay đổi và làm lại ([Roese & Summerville 2005](#r-roese2005)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Nghiên cứu táo bạo nhất về đề tài này để một đồng xu quyết định. Những người đang phân vân một quyết định lớn — bỏ việc, chia tay — lên mạng tung một đồng xu ảo. Ai được đồng xu bảo "thay đổi" thì có khả năng thay đổi cao hơn, và sáu tháng sau, những người đã thay đổi vì một quyết định lớn **hạnh phúc hơn** những người giữ nguyên; tác giả kết luận người ta có thể quá thận trọng khi đứng trước những lựa chọn đổi đời ([Levitt 2021](#r-levitt2021)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Đây là một nghiên cứu, trên những người tự tìm đến vì đã phân vân sẵn; nghiên cứu này không khuyên mọi người bỏ việc. Nó chỉ nói: **khi đã cân nhắc rất lâu mà hai bên vẫn ngang nhau, nỗi sợ thay đổi thường lớn hơn cái giá thật của việc thay đổi**.

Thêm một điều sau khi đã chọn: người được chọn một phương án có thể đổi lại về sau thì **ít thích** lựa chọn của mình hơn người chọn dứt khoát, dù người ta vẫn thích giữ đường lui ([Gilbert & Ebert 2002](#r-gilbert2002)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Khi đã quyết, cam kết trọn vẹn thường làm mình hài lòng hơn là cứ để ngỏ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="judge-process"><span class="num">12.5</span>Đánh giá quyết định theo quá trình</h3>

Cùng một quyết định, khi kết quả tốt thì người ta đánh giá nó **sáng suốt hơn** so với khi kết quả xấu — outcome bias ([Baron & Hershey 1988](#r-baron1988)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Nhưng một quyết định tốt vẫn có thể gặp vận xui, và một quyết định tồi vẫn có thể gặp may. Nếu đánh giá theo kết quả, ta sẽ rút ra bài học sai từ cả hai. Câu hỏi đúng ở buổi review là <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: *với thông tin mình có lúc đó, quá trình ra quyết định có tốt không?*

Ba bẫy nữa đáng biết. **Focusing illusion**: sinh viên ở vùng Trung Tây và ở Nam California hài lòng với cuộc sống như nhau, nhưng cả hai nhóm đều đoán người California hạnh phúc hơn — vì khi so sánh, những khác biệt dễ thấy, trước hết là khí hậu, rồi đến cơ hội văn hoá, chiếm hết sự chú ý ([Schkade & Kahneman 1998](#r-schkade1998)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; không thứ gì trong đời quan trọng như ta nghĩ trong lúc đang nghĩ về nó. **Sunk cost**: xu hướng tiếp tục vì đã bỏ vào quá nhiều là có thật, mức độ tuỳ loại quyết định ([Roth, Robbert & Straus 2015](#r-roth2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; câu hỏi đúng chỉ nhìn về phía trước. Và **choice overload** — "nhiều lựa chọn quá làm tê liệt" — trung bình gần như bằng không qua 50 thí nghiệm ([Scheibehenne 2010](#r-scheibehenne2010)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; hiện tượng này mạnh lên khi các phương án phức tạp, việc chọn khó, mình chưa rõ mình muốn gì, hoặc mình chỉ muốn chọn nhanh cho xong ([Chernev 2015](#r-chernev2015)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Nghĩa là ngoài việc bớt lựa chọn, một thuốc chữa là **rõ tiêu chí của mình trước** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h2 id="adversity"><span class="num">13</span>Nghịch cảnh và những điều không kiểm soát được</h2>

Mất người thân, mất việc, bệnh tật, đổ vỡ — sống đủ lâu thì ai cũng sẽ gặp vài lần. Chương này nói điều gì thường xảy ra sau một biến cố, điều gì giúp, và những niềm tin phổ biến nào là sai.

<h3 id="resilience"><span class="num">13.1</span>Phần lớn con người vượt qua — với một lưu ý</h3>

```chart bar
quỹ đạo sau một biến cố có thể gây sang chấn,tỷ lệ trung bình (%)
Resilience — ổn định từ đầu,65.7
Recovery — sa sút rồi hồi phục,20.8
Chronic — kéo dài,10.6
Delayed — chậm xuất hiện,8.9
```

<p class="src">Nguồn: Galatzer-Levy, Huang & Bonanno 2018, Clin Psych Rev 63:41–55. Tỷ lệ phụ thuộc vào mô hình thống kê; xem lưu ý bên dưới.</p>

Tổng hợp các nghiên cứu theo dõi người sau biến cố cho thấy quỹ đạo phổ biến nhất là **resilience** — mức hoạt động ổn định suốt từ đầu — trung bình 65,7% ([Galatzer-Levy, Huang & Bonanno 2018](#r-galatzerlevy2018)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Theo dõi 205 người từ trước khi mất vợ hoặc chồng tới 18 tháng sau, kiểu thích nghi resilient là phổ biến nhất ([Bonanno 2002](#r-bonanno2002)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Lưu ý quan trọng: khi phân tích lại cùng loại dữ liệu với giả định thống kê nới lỏng hơn, nhóm "resilience" có khi lại là nhóm **ít nhất**, nên các "tỷ lệ resilience" chính xác không đáng tin ([Infurna & Luthar 2016](#r-infurna2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Điều chắc chắn là hướng chung: phục hồi phổ biến hơn người ta tưởng, nhưng **một phần đáng kể không hồi phục nhanh**, và đó không phải lỗi của họ.

"Năm giai đoạn đau buồn" — chối bỏ, giận dữ, mặc cả, trầm cảm, chấp nhận — là một mô hình nổi tiếng, nhưng không phải những bậc thang người ta bước lần lượt. Theo dõi 233 người mất người thân, **chấp nhận** là điều được ghi nhận nhiều nhất ngay từ đầu, **nhớ thương** mới là cảm xúc tiêu cực chính, và chối bỏ không phải điều nổi bật lúc đầu; các chỉ số tiêu cực đều đạt đỉnh trong khoảng 6 tháng đầu, và đỉnh trung bình của chúng xếp theo đúng thứ tự mô hình dự đoán, nên chính các tác giả coi kết quả là ủng hộ một phần cho mô hình ([Maciejewski 2007](#r-maciejewski2007)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Các cảm xúc ấy có mặt cùng lúc chứ không lần lượt thay nhau, nên không có chuyện đau buồn "sai thứ tự" <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="events-differ"><span class="num">13.2</span>Không phải biến cố nào cũng như nhau</h3>

Tổng hợp 313 mẫu với 65.911 người cho thấy các biến cố trong đời khác nhau rất nhiều về mức tác động, và với phần lớn biến cố, tác động lên sự hài lòng cuộc sống mạnh hơn và đều hơn tác động lên cảm xúc ([Luhmann 2012](#r-luhmann2012)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Một số biến cố để lại dấu ấn lâu dài. Theo dõi hơn 24.000 người Đức trong 15 năm: sau khi mất việc, mức hài lòng cuộc sống **không hồi phục hoàn toàn** kể cả khi đã có việc lại, và từng thất nghiệp trước đó không làm lần sau nhẹ đi ([Lucas 2004](#r-lucas2004)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Câu "rồi sẽ quen thôi" đúng với nhiều chuyện, nhưng không với mọi chuyện — nên những rủi ro như mất việc đáng được phòng từ trước, bằng quỹ dự phòng ở [chương 10](#saving) và bằng kỹ năng không phụ thuộc một chỗ làm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="control"><span class="num">13.3</span>Đổi được hay không đổi được</h3>

```mermaid
flowchart TD
  X["Biến cố"] --> Q{"Phần nào trong chuyện này<br/>mình đổi được?"}
  Q -->|"phần đổi được"| P["Primary control:<br/>hành động lên thế giới<br/>(tìm việc, chữa bệnh, sửa quan hệ)"]
  Q -->|"phần không đổi được"| S["Secondary control:<br/>đổi chính mình<br/>(chấp nhận, hiểu lại, chỉnh mục tiêu)"]
  P --> R["Thích nghi"]
  S --> R
  S -.->|"mục tiêu cũ không còn khả thi"| G["Buông và gắn với<br/>mục tiêu thay thế (§11.5)"]
  G --> R
```

Thuyết phát triển động cơ suốt đời chia cách con người thích nghi thành hai loại: **primary control** — thay đổi thế giới cho hợp với mình — và **secondary control** — thay đổi chính mình, mục tiêu và cách nhìn của mình, cho hợp với thế giới ([Heckhausen, Wrosch & Schulz 2010](#r-heckhausen2010)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Đây là câu hỏi ở [chương 3](#flexibility), nhưng ở tầm cả một đời: khả năng reappraisal đi kèm ít trầm cảm hơn khi căng thẳng không kiểm soát được, nhưng đi kèm trầm cảm nhiều hơn khi căng thẳng kiểm soát được ([Troy 2013](#r-troy2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, và khả năng đổi chiến lược cho hợp tình huống gắn với thích nghi tốt hơn ([Cheng, Lau & Chan 2014](#r-cheng2014)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Hầu hết biến cố là một hỗn hợp: không đổi được việc đã mất, nhưng đổi được bước tiếp theo. Tách hai phần đó ra là việc đầu tiên.

Ở phần không đổi được, **chấp nhận cảm xúc của mình** trước chuyện đó giúp: người thường chấp nhận cảm xúc và suy nghĩ tiêu cực của mình có ít cảm xúc tiêu cực hơn trước căng thẳng và sức khoẻ tâm lý tốt hơn về sau, và lợi ích này chỉ thấy khi chấp nhận cảm xúc và suy nghĩ, không thấy khi chấp nhận hoàn cảnh ([Ford 2018](#r-ford2018)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Self-compassion tương quan mạnh với ít triệu chứng tâm lý hơn, r = −0,54 ([MacBeth & Gumley 2012](#r-macbeth2012)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — dữ liệu tương quan, nhưng cùng hướng với thí nghiệm ở [§3.6](#avoidance). Và cái cảm giác "mình làm được gì đó" không phải bẩm sinh: theo bản cập nhật của thuyết learned helplessness, thụ động là phản ứng **mặc định** của cơ thể trước điều tồi tệ kéo dài, còn cảm giác kiểm soát là thứ được **học** ([Maier & Seligman 2016](#r-maier2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — bằng chứng chủ yếu từ động vật. Những việc nhỏ mà mình làm được trong lúc khó khăn chính là cách học lại cảm giác ấy <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="support"><span class="num">13.4</span>Người nâng đỡ mình</h3>

Hỗ trợ xã hội được cho là làm **đệm** cho tác động của căng thẳng — stress-buffering ([Cohen & Wills 1985](#r-cohen1985)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Gộp 75 mẫu theo dõi dọc với 32.402 người sau sang chấn, hỗ trợ xã hội dự báo ít triệu chứng hơn về sau, và triệu chứng nặng lại dự báo ít hỗ trợ hơn về sau ([Wang 2021](#r-wang2021ptsd)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Hai điều rút ra <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: khi gặp chuyện, **đừng rút lui** khỏi những người thân dù mình muốn; và khi người khác gặp chuyện, sự có mặt đều đặn, kín đáo ([§6.4](#ties-giving)) giá trị hơn một lời khuyên hay.

<h3 id="growth-myth"><span class="num">13.5</span>"Khổ đau làm mình mạnh lên" — kiểm tra lại</h3>

Posttraumatic growth — ý tưởng rằng người ta lớn lên nhờ biến cố — thường được đo bằng cách hỏi người ta *cảm thấy* mình đã thay đổi bao nhiêu. Khi một nhóm nghiên cứu có dữ liệu về cùng những người đó **trước** biến cố, mức "phát triển" tự báo cáo không khớp với thay đổi thật đo được, và người báo cáo phát triển nhiều lại đau khổ **nhiều hơn** ([Frazier 2009](#r-frazier2009)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Tổng hợp 122 nghiên cứu dọc với 98.436 người không thấy sự phát triển thật về ý nghĩa sống hay đời sống tinh thần, và phần lớn nghiên cứu có nhóm đối chứng không thấy khác biệt ([Mangelsdorf, Eid & Luhmann 2019](#r-mangelsdorf2019)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Điều này không có nghĩa là không ai lớn lên sau khổ đau; điều đó có nghĩa là **không cần ép mình phải thấy "điều tốt" trong mất mát** để được coi là vượt qua tốt.

<h3 id="help"><span class="num">13.6</span>Những gì có bằng chứng giúp</h3>

Khi buồn bã, lo âu kéo dài và làm hỏng cuộc sống, trị liệu có hiệu quả thật. Gộp 409 thử nghiệm với 52.702 bệnh nhân trầm cảm, CBT hiệu quả hơn nhóm đối chứng g = 0,79, và các liệu pháp tâm lý khác nhau hiệu quả gần như ngang nhau ([Cuijpers 2023](#r-cuijpers2023)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Với người không bệnh, mindfulness giảm lo âu, trầm cảm và căng thẳng so với không làm gì, trong hầu hết các kịch bản phân tích, nhưng không hơn các hoạt động chủ động khác, và độ chắc chắn của bằng chứng theo GRADE chỉ từ vừa tới rất thấp ([Galante 2021](#r-galante2021)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; ở mẫu lâm sàng, mindfulness hiệu quả ngang các phương pháp điều trị có bằng chứng ([Goldberg 2018](#r-goldberg2018)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Các chương trình rèn luyện resilience có tác dụng vừa phải, nhưng khác nhau nhiều giữa các chương trình ([Joyce 2018](#r-joyce2018); [Liu 2020](#r-liu2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Viết ra cảm xúc về một biến cố — expressive writing — có hiệu ứng thật nhưng **nhỏ**, r = 0,075 qua 146 nghiên cứu ([Frattaroli 2006](#r-frattaroli2006)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Và tìm đến chuyên gia khi cần là một quyết định primary control, không phải dấu hiệu yếu đuối <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h2 id="learning"><span class="num">14</span>Học và nghĩ</h2>

<h3 id="learn"><span class="num">14.1</span>Học: tự kiểm tra và giãn cách</h3>

Hai kỹ thuật học có bằng chứng mạnh nhất đều ngược với cảm giác. Thứ nhất, **retrieval practice** — tự nhớ lại mà không nhìn tài liệu. Sinh viên học một đoạn văn theo ba cách, rồi được kiểm tra sau một tuần ([Roediger & Karpicke 2006](#r-roediger2006)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>:

```chart bar
cách học (4 phiên),% nhớ được sau 1 tuần
Đọc cả 4 phiên,40
Đọc 3 phiên + tự kiểm tra 1,56
Đọc 1 phiên + tự kiểm tra 3,61
```

<p class="src">Nguồn: Roediger & Karpicke 2006, Psych Sci 17(3):249–255, thí nghiệm 2.</p>

Nhóm đọc bốn lần đã đọc đoạn văn trung bình 14,2 lần, nhóm tự kiểm tra chỉ 3,4 lần — vậy mà nhóm đọc nhớ ít nhất. Cảm giác "trôi chảy" khi đọc lại là một tín hiệu sai về việc mình đã học được bao nhiêu. Thứ hai, **spacing**: cùng một lượng thời gian, chia ra nhiều lần cách quãng cho kết quả tốt hơn dồn một lần — 47,3% so với 36,7% trung bình qua các so sánh ([Cepeda 2006](#r-cepeda2006)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Các tổng quan xếp hai kỹ thuật này vào nhóm hiệu quả cao, còn đọc lại, gạch chân, tóm tắt vào nhóm hiệu quả thấp ([Dunlosky 2013](#r-dunlosky2013)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Đây cũng là lý do mỗi phần của cuốn sách này kết thúc bằng câu hỏi.

<h3 id="transfer"><span class="num">14.2</span>Kỹ năng không tự lan sang chỗ khác</h3>

"Học cờ vua cho thông minh", "chơi game luyện não cho nhạy bén" — khi nhóm đối chứng cũng được làm một hoạt động khác, hiệu ứng lan sang các khả năng xa gần như bằng không ([Sala & Gobet 2017](#r-sala2017); [Simons 2016](#r-simons2016)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Lý do nằm ở bản chất của chuyên môn: kiện tướng cờ vua nhớ được khoảng 16 quân sau năm giây nhìn một thế cờ thật, người mới chơi khoảng 4 (nghiên cứu gốc chỉ có ba người chơi) — nhưng với thế cờ xếp ngẫu nhiên thì khác biệt gần như biến mất ([Chase & Simon 1973](#r-chase1973)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Chuyên gia không có trí nhớ tốt hơn; họ có **kiến thức của lĩnh vực** để nhận ra hình mẫu. Vì vậy tư duy phản biện phụ thuộc vào kiến thức của chính lĩnh vực đó ([Willingham 2007](#r-willingham2007)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Muốn giỏi điều gì, hãy luyện chính điều đó.

<h3 id="talent"><span class="num">14.3</span>Luyện tập, tư duy phát triển, và grit</h3>

Ba niềm tin phổ biến cần được chỉnh lại. Deliberate practice quan trọng, nhưng không phải tất cả: theo bài gốc, deliberate practice giải thích 26% khác biệt thành tích trong các trò chơi như cờ, 21% trong âm nhạc, 18% trong thể thao, 4% trong giáo dục và dưới 1% trong các nghề nghiệp ([Macnamara 2014](#r-macnamara2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; năm 2018 bài này có một bản đính chính mà cuốn sách chưa đọc được. Growth mindset — tin rằng năng lực phát triển được — có liên hệ yếu với thành tích, và các can thiệp dạy growth mindset cho hiệu ứng rất nhỏ ([Sisk 2018](#r-sisk2018)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; gộp 63 nghiên cứu, hiệu ứng chung chỉ d = 0,05 và mất ý nghĩa thống kê sau khi hiệu chỉnh publication bias; ở 6 nghiên cứu chất lượng cao nhất, d = 0,02, không có ý nghĩa thống kê ([Macnamara & Burgoyne 2023](#r-macnamara2023)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Grit chỉ liên hệ vừa phải với thành tích, gần như trùng với tính tận tâm (conscientiousness), và phần **kiên trì nỗ lực** dự báo tốt hơn phần **giữ một đam mê** ([Credé, Tynan & Harms 2017](#r-crede2017)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Gộp lại: thành tích đến từ nhiều thứ, và niềm tin đúng đắn về bản thân không thay được việc thật sự làm.

<h3 id="think"><span class="num">14.4</span>Nghĩ cho đúng</h3>

Thông minh không bảo vệ khỏi thiên lệch: nhiều thiên lệch — anchoring, framing, myside bias, sunk cost, bỏ qua base rate — **không tương quan với IQ** ([Stanovich & West 2008](#r-stanovich2008)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Thứ có vẻ tạo khác biệt là **thói quen tư duy** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Actively open-minded thinking — chủ động tìm bằng chứng đi ngược niềm tin của mình — dự báo độ chính xác, vì thói quen này khiến người ta chịu tìm thêm thông tin ([Haran, Ritov & Mellers 2013](#r-haran2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. "Consider the opposite" — tự hỏi vì sao điều ngược lại có thể đúng — hiệu quả hơn lời dặn "hãy khách quan" ([Lord, Lepper & Preston 1984](#r-lord1984)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Và những thói quen này luyện được: những người dự báo giỏi nhất cập nhật niềm tin thường xuyên và coi dự báo là một kỹ năng cần luyện có chủ đích ([Mellers 2015](#r-mellers2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; một trò chơi giảm thiên lệch có phản hồi cá nhân vẫn còn tác dụng sau hai tháng ([Morewedge 2015](#r-morewedge2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Thói quen đơn giản nhất rút ra từ đây <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: với những dự đoán quan trọng, **viết ra** mình tin gì và chắc bao nhiêu phần trăm, rồi sau này đối chiếu với điều đã xảy ra.

<h3 id="change"><span class="num">14.5</span>Con người thay đổi được — qua hành động</h3>

Tính cách không cố định. Các can thiệp làm thay đổi đặc điểm tính cách trung bình d = 0,37 trong khoảng 24 tuần, chủ yếu ở mẫu lâm sàng; nhưng riêng tính tận tâm chỉ d = 0,19, và trong các thí nghiệm có nhóm đối chứng, thay đổi về tính tận tâm chỉ d = 0,06, không có ý nghĩa thống kê; hiệu chỉnh small-study bias còn kéo hiệu ứng chung so với nhóm đối chứng từ 0,43 xuống 0,13, không có ý nghĩa thống kê, dù các tác giả lưu ý ước lượng hiệu chỉnh này kém chính xác ([Roberts 2017](#r-roberts2017)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Với việc *chủ động* thay đổi tính cách, một kết quả đáng nhớ: **nhận thử thách không dự báo thay đổi; hoàn thành thử thách thì có** ([Hudson 2019](#r-hudson2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Đó cũng là câu tóm tắt cả cuốn sách: ta trở thành những gì ta đã thực sự làm, không phải những gì ta đã định làm.

<div class="recall">

**Câu hỏi nhớ lại — Phần IV.**

<details><summary>Vì sao nên đặt mục tiêu ở tầng quy trình?</summary><div class="inner">

Vì quy trình là thứ mình kiểm soát ngay lúc này. Trong thể thao, tập trung vào quy trình khi đang thực hiện kỹ năng có hiệu ứng d = 1,36, so với 0,09 của mục tiêu kết quả (Williamson 2022); áp dụng ý đó cho mục tiêu hằng tuần là suy luận của cuốn sách. Kết quả cho biết hướng đi, quy trình mới là thứ mình điều khiển được.

</div></details>

<details><summary>Outside view là gì, và vì sao nó sửa được planning fallacy?</summary><div class="inner">

Là hỏi những trường hợp tương tự thường diễn ra thế nào, thay vì chỉ nghĩ về kế hoạch của mình. Khi người ta nối dự đoán với kinh nghiệm quá khứ, sai lệch biến mất (Buehler 1994).

</div></details>

<details><summary>Khi nào trực giác đáng tin?</summary><div class="inner">

Khi môi trường đủ đều đặn để có quy luật và người đó đã có cơ hội học quy luật ấy (Kahneman & Klein 2009). Những quyết định đời người hiếm khi thoả điều kiện này.

</div></details>

<details><summary>Câu hỏi đầu tiên trước một biến cố là gì?</summary><div class="inner">

Phần nào mình đổi được, phần nào không. Phần đổi được thì hành động (primary control); phần không đổi được thì chấp nhận và chỉnh mục tiêu (secondary control).

</div></details>

<details><summary>Học một bài thế nào thì nhớ lâu nhất?</summary><div class="inner">

Tự kiểm tra (retrieval practice) thay vì đọc lại, và chia ra nhiều lần cách quãng (spacing) thay vì dồn một lần.

</div></details>

</div>


<h2 id="part-5" class="part">Phần V — Gốc rễ</h2>

Bốn phần trước trả lời câu hỏi *chuyện gì sẽ xảy ra*: con người vận hành thế nào, điều gì thường dẫn tới điều gì. Nhưng mỗi quyết định thật còn một câu hỏi thứ hai: *mình muốn điều gì xảy ra hơn*. Câu hỏi này khoa học không trả lời thay được. Một phép so sánh với phần mềm cho thấy vì sao: test cho biết hệ thống chạy thế nào, nhưng không test nào tự sinh ra requirement — requirement do người làm sản phẩm quyết định. Phần V nói về requirement của chính cuộc đời mình: **values** (điều mình coi trọng), **principles** (những luật mình tự đặt ra từ đó), cách sống tử tế, và cách dùng tất cả những thứ này khi phải chọn. Không thể chỉ dựa vào dữ liệu để suy ra điều "nên làm" từ điều "đang là" — đây là một lập luận triết học, không phải phát hiện thực nghiệm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>; nhưng dữ liệu vẫn giúp được rất nhiều: nó cho biết values vận hành thế nào, điều gì giữ được chúng, điều gì chỉ là ảo tưởng.

<h2 id="values"><span class="num">15</span>Values: thứ khoa học không chọn hộ mình</h2>

<h3 id="value-circle"><span class="num">15.1</span>Mười values và vòng tròn của chúng</h3>

Một bản đồ về values được kiểm chứng rộng rãi là lý thuyết của Schwartz, nền của hàng trăm nghiên cứu trong hai thập kỷ. Lý thuyết này gom động cơ của con người thành mười values cơ bản, xếp trên **một vòng tròn**: hai values nằm cạnh nhau có động cơ gần nhau nên thường đi cùng nhau; hai values nằm đối diện có động cơ ngược nhau, nên theo đuổi cái này thường phải trả giá bằng cái kia. Bản tinh chỉnh năm 2012 tách mười values thành 19 values hẹp hơn, và kiểm tra trên 15 mẫu ở 10 nước với 6.059 người: thứ tự quanh vòng tròn được ủng hộ "phần lớn", còn vị trí chính xác của từng cặp hàng xóm chỉ nên xem là gần đúng ([Schwartz 2012](#r-schwartz2012)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Trên dữ liệu từ 38 nước, hình dạng chung của vòng tròn vẫn đúng, dù khớp tốt hơn ở mẫu sinh viên và mẫu phương Tây so với mẫu giáo viên và mẫu ngoài phương Tây ([Fontaine 2008](#r-fontaine2008)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.
