<details><summary>Đọc thêm: chi tiết của từng dòng</summary><div class="inner">

**Ý chí bình xăng.** Hai đợt làm lại ở 23 và 36 phòng thí nghiệm <a class="ev ev-high" href="#r-hagger2016" title="Hagger 2016 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-vohs2021" title="Vohs 2021 · Bằng chứng mạnh"></a>.

**Xả giận.** Đấm gối, hét to có khi như đổ thêm dầu vào lửa. Điều giúp nguôi giận là hạ nhiệt cơ thể <a class="ev ev-high" href="#r-bushman2002" title="Bushman 2002 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-kjaervik2024" title="Kjærvik &amp; Bushman 2024 · Bằng chứng mạnh"></a>.

**Năm giai đoạn đau buồn.** Ngay tháng đầu, chấp nhận đã là phản ứng phổ biến nhất, còn nỗi nhớ thương là cảm giác nặng nề chính <a class="ev ev-mid" href="#r-maciejewski2007" title="Maciejewski 2007 · Bằng chứng vừa"></a>.

**Khổ đau làm mạnh lên.** Điều được so là thay đổi đo thật trước và sau biến cố, với lời người ta tự kể <a class="ev ev-high" href="#r-frazier2009" title="Frazier 2009 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-mangelsdorf2019" title="Mangelsdorf 2019 · Bằng chứng mạnh"></a>.

**Growth mindset.** Phần thổi phồng ở đây là do publication bias <a class="ev ev-high" href="#r-macnamara2023" title="Macnamara &amp; Burgoyne 2023 · Bằng chứng mạnh"></a>.

**Luyện tập có chủ đích.** Nó giải thích khoảng một phần năm đến một phần tư khác biệt thành tích ở trò chơi, âm nhạc, thể thao. Bài gốc công bố năm 2014, có đính chính năm 2018 <a class="ev ev-mid" href="#r-macnamara2014" title="Macnamara 2014 · Bằng chứng vừa"></a>.

**Để vô thức quyết định.** Chút hiệu ứng trong các nghiên cứu cũ biến mất khi trừ đi phần thổi phồng <a class="ev ev-high" href="#r-nieuwenstein2015" title="Nieuwenstein 2015 · Bằng chứng mạnh"></a>.

**Tiền và hạnh phúc.** Hạnh phúc tăng chậm dần theo thu nhập: muốn vui thêm một nấc, lần sau cần nhiều tiền hơn lần trước <a class="ev ev-high" href="#r-killingsworth2023" title="Killingsworth 2023 · Bằng chứng mạnh"></a>.

**Lời răn và chữ ký.** 25 phòng thí nghiệm làm lại thí nghiệm nhớ lời răn. Ký ở đầu tờ khai cũng không có tác dụng, và bài gốc đã bị rút năm 2021 <a class="ev ev-high" href="#r-verschuere2018" title="Verschuere 2018 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-kristal2020" title="Kristal 2020 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-shu2012retraction" title="PNAS 2021 · Bằng chứng mạnh"></a>.

**Rửa tay.** Tổng hợp gộp 15 nghiên cứu về vế đầu, tức muốn rửa tay sau khi làm sai. Vế sau, rửa xong thì vơi tội lỗi, không được kiểm tra trong tổng hợp này <a class="ev ev-high" href="#r-siev2018" title="Siev 2018 · Bằng chứng mạnh"></a>.

**Làm việc tốt rồi buông.** "Rất nhỏ hoặc không còn" là kết quả sau khi trừ đi phần thổi phồng <a class="ev ev-mid" href="#r-kuper2019" title="Kuper &amp; Bott 2019 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-xiao2024" title="Xiao 2024 · Bằng chứng vừa"></a>.

**Hai phương án ngang ngửa.** 40 lần làm lại gồm hơn 26.000 người <a class="ev ev-high" href="#r-evangelidis2023" title="Evangelidis 2023 · Bằng chứng mạnh"></a>.

**Tương lai xa.** Bài gốc thấy hiệu ứng rất lớn; tác giả gốc vẫn phản bác lần kiểm tra <a class="ev ev-high" href="#r-calderon2026" title="Calderon 2026 · Bằng chứng mạnh"></a>.

**Bài viết tự khẳng định.** Phân tích lại bài gốc thấy kết quả mong manh <a class="ev ev-mid" href="#r-hanselman2017" title="Hanselman 2017 · Bằng chứng vừa"></a><a class="ev ev-mid" href="#r-serragarcia2020" title="Serra-Garcia 2020 · Bằng chứng vừa"></a>.

</div></details>

<div class="callout data"><div class="ct">Tự kiểm tra: niềm tin nào bạn vẫn đang dùng</div>

Đọc lướt cột "Niềm tin" và đánh dấu những dòng bạn từng tin, hoặc vẫn đang tin <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Với mỗi dòng đã đánh dấu, tự hỏi: trong tuần này, niềm tin ấy có đang quyết định thay mình điều gì không? Chẳng hạn "ý chí cạn vào buổi tối nên tối không học được", hay "21 ngày là phải thành thói quen, không thành là mình kém". Nếu có, hãy thử một tuần làm ngược lại với niềm tin ấy và ghi kết quả vào điện thoại. Dữ liệu một tuần của riêng bạn chưa chứng minh được gì cho ai khác, nhưng đủ để bạn thôi bị một niềm tin sai âm thầm dắt mũi <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div>

<h2 id="glossary"><span class="num">B</span>Phụ lục: glossary</h2>

**Đọc kết quả nghiên cứu.** Sách nói một tác động lớn hay nhỏ bằng lời, như "rất nhỏ", "vừa phải", "gần như không có", thay vì bằng ký hiệu. Nếu mở bài gốc, bạn sẽ gặp những ký hiệu như d, g, r, OR, HR. Tất cả chỉ là những cách khác nhau để trả lời cùng một câu hỏi: khác biệt này lớn cỡ nào.

Có hai điều nên nhớ. Một: hai thứ hay đi cùng nhau (tương quan) chưa chắc thứ này gây ra thứ kia. Hôm nào nhiều người cầm ô thì đường cũng ướt, nhưng ô đâu làm ra mưa. Hai: chỉ thử nghiệm ngẫu nhiên, tức chia người ngẫu nhiên vào hai nhóm rồi so, mới cho biết cái gì gây ra cái gì.

<dl class="gloss">
<dt>Active-constructive responding</dt><dd>Bạn khoe vừa thi đỗ bằng lái xe, mình hào hứng hỏi "kể đi, thi có khó không?" thay vì "ừ, tốt". Ai hay đáp lại tin vui theo kiểu này thường có những mối quan hệ tốt hơn (chương 6).</dd>
<dt>Actively open-minded thinking</dt><dd>Thói quen chủ động đi tìm bằng chứng chống lại chính niềm tin của mình, như trước khi chốt một việc lớn thì cố tìm người nghĩ ngược lại để hỏi (chương 14).</dd>
<dt>Affect labeling</dt><dd>Gọi tên cảm xúc thành lời — "mình đang lo" — và nhờ vậy thấy dịu bớt (chương 3).</dd>
<dt>Authoritarian / reciprocal filial piety</dt><dd>Hai phần của chữ hiếu: vâng lời và làm tròn bổn phận theo vai vế, so với biết ơn và chăm sóc cha mẹ vì tình cảm (chương 18).</dd>
<dt>Bright line</dt><dd>Lằn ranh tuyệt đối, quyết một lần lúc bình tĩnh, không bàn lại lúc nóng — như "đã uống rượu bia thì không lái xe" (chương 16).</dd>
<dt>Choice overload</dt><dd>Giả thuyết cho rằng quá nhiều lựa chọn khiến người ta tê liệt; trung bình gần như không có (chương 12).</dd>
<dt>Commitment device</dt><dd>Tự trói mình bằng một hệ quả thật nếu phá luật, như đưa chìa khoá xe cho bạn giữ trước khi đi nhậu, hay tài khoản tiết kiệm có khoá (chương 16).</dd>
<dt>Construal-level theory</dt><dd>Lý thuyết cho rằng thứ càng xa (về thời gian, không gian, quan hệ) thì ta càng nghĩ về nó trừu tượng; vừa thất bại trong một lần kiểm tra lớn (chương 18).</dd>
<dt>Coping flexibility</dt><dd>Biết đổi cách đối phó cho hợp với từng tình huống, thay vì chỉ có một chiêu cho mọi chuyện (chương 3, 13).</dd>
<dt>Crowd within</dt><dd>Ước lượng hai lần, cách nhau một lúc, rồi lấy trung bình — thường trúng hơn từng lần riêng lẻ (chương 12).</dd>
<dt>Default</dt><dd>Lựa chọn cài sẵn, tự xảy ra nếu mình không làm gì (chương 10).</dd>
<dt>Deliberate practice</dt><dd>Luyện tập có chủ đích: nhắm thẳng vào điểm yếu, có người hoặc công cụ chỉ ra chỗ sai ngay (chương 14).</dd>
<dt>Doormat effect</dt><dd>Cứ tha thứ cho người không chịu sửa sai, dần dần thấy bản thân như tấm thảm chùi chân (chương 5).</dd>
<dt>Dual concern</dt><dd>Trong xung đột có hai trục cùng lúc: quan tâm đến người kia, và giữ vững điều mình cần (chương 5).</dd>
<dt>Ego depletion</dt><dd>Giả thuyết ý chí là bình xăng, dùng nhiều thì cạn; không lặp lại được khi kiểm tra lại (chương 2).</dd>
<dt>Emotional well-being</dt><dd>Những giờ mình đã sống có dễ chịu hay không — vui, buồn, căng thẳng trong từng ngày (chương 7).</dd>
<dt>Exponential growth bias</dt><dd>Nhìn lãi kép như thể nó chỉ tăng đều, nên đánh giá thấp cả tiền lãi lẫn tiền phí sau nhiều năm (chương 10).</dd>
<dt>Focusing illusion</dt><dd>Thứ gì đang được nghĩ tới thì trông quan trọng hơn thực tế — "chuyển lên Đà Lạt mát mẻ chắc sẽ vui hơn hẳn" (chương 12).</dd>
<dt>Future-self continuity</dt><dd>Mức mình thấy mình của mười năm sau vẫn là chính mình, không phải một người lạ (chương 18).</dd>
<dt>Guilt / shame</dt><dd>Sau một việc sai: "mình vừa làm vỡ cái bát" (guilt, nhắm vào hành động) so với "mình là đồ vô dụng" (shame, nhắm vào cả con người) (chương 17).</dd>
<dt>Habit</dt><dd>Liên kết đã học giữa bối cảnh (cue) và phản ứng. Khi đủ mạnh thì tự diễn ra, như tay tự với lấy điện thoại khi vừa ngồi xuống (chương 2).</dd>
<dt>Honesty-Humility</dt><dd>Đặc điểm tính cách gồm chân thành, công bằng, khiêm tốn, không tham; ai có đặc điểm này cao thì ít gian lận hơn (chương 17).</dd>
<dt>Hot–cold empathy gap</dt><dd>Lúc bình tĩnh, ta đánh giá thấp sức chi phối của lúc mệt, thèm, giận; như lúc no thì không tưởng tượng nổi cơn đói (chương 2).</dd>
<dt>Implementation intention</dt><dd>Kế hoạch dạng "Khi [tình huống] thì tôi [hành động]", như "Khi ăn tối xong thì mình đi bộ quanh xóm 15 phút" (chương 2).</dd>
<dt>Inside view / outside view</dt><dd>Dự đoán từ chính kế hoạch của mình, so với nhìn xem những trường hợp tương tự thường ra sao (chương 12).</dd>
<dt>Intellectual humility</dt><dd>Biết hiểu biết của mình có giới hạn, và sẵn sàng đổi ý khi bằng chứng đổi (chương 17).</dd>
<dt>Intention–behaviour gap</dt><dd>Khoảng cách giữa "mai mình sẽ dậy sớm" và lúc chuông báo thức reo thật (chương 2).</dd>
<dt>Intrinsic / extrinsic goals</dt><dd>Mục tiêu nội tại (gắn bó, phát triển, đóng góp, sức khoẻ) so với ngoại tại (tiền, hình ảnh, danh tiếng) (chương 8).</dd>
<dt>Life evaluation</dt><dd>Khi nhìn lại toàn bộ, mình chấm cuộc đời mình mấy điểm (chương 7).</dd>
<dt>Liking gap</dt><dd>Sau một cuộc trò chuyện, ta tưởng người kia thích mình ít hơn thực tế (chương 4).</dd>
<dt>Maximizing / satisficing</dt><dd>Lùng cho bằng được phương án tốt nhất, so với chọn phương án đủ tốt rồi dừng (chương 8).</dd>
<dt>Meta-analysis</dt><dd>Gộp kết quả của nhiều nghiên cứu lại để ước lượng một tác động chung, thay vì tin vào một nghiên cứu lẻ.</dd>
<dt>Metacognition</dt><dd>Suy nghĩ về chính cách mình đang suy nghĩ (chương 7).</dd>
<dt>Mood repair</dt><dd>Làm gì đó để dễ chịu ngay, như lướt điện thoại để khỏi đối mặt với việc khó. Gốc rễ của nhiều lần trì hoãn (chương 3).</dd>
<dt>Moral disengagement</dt><dd>Những câu tự bào chữa như "ai cũng làm thế", "người ta bảo làm thế", giúp người tử tế làm điều có hại mà vẫn thấy mình ổn (chương 17).</dd>
<dt>Moral licensing</dt><dd>Giả thuyết làm việc tốt xong thì cho phép mình làm điều xấu; bằng chứng yếu sau khi kiểm tra lại (chương 17).</dd>
<dt>Outcome bias</dt><dd>Chấm một quyết định theo kết quả thay vì theo cách mình đã quyết — thắng nhờ may thì khen, thua vì xui thì chê (chương 12).</dd>
<dt>Peak–end rule</dt><dd>Ta nhớ một trải nghiệm chủ yếu qua khoảnh khắc mạnh nhất và khoảnh khắc cuối. Kỳ nghỉ kết thúc bằng chuyến bay trễ dễ đọng lại thành kỳ nghỉ tệ (chương 7).</dd>
<dt>Person–organization fit</dt><dd>Một người hợp với tổ chức tới đâu, trong đó values hay được đo. Liên quan tới mức hài lòng, gắn bó nhiều hơn tới hiệu suất (chương 15).</dd>
<dt>Perspective-taking / perspective-getting</dt><dd>Tự tưởng tượng người khác nghĩ gì, so với hỏi thẳng họ (chương 4).</dd>
<dt>Phubbing</dt><dd>Cắm mặt vào điện thoại khi đang ngồi cùng người khác (chương 6).</dd>
<dt>Planning fallacy</dt><dd>Lần nào sửa nhà cũng nghĩ một tháng là xong, và lần nào cũng thành ba tháng, kể cả khi đã từng sai y như vậy (chương 12).</dd>
<dt>Positive psychology interventions</dt><dd>Các bài tập nâng hạnh phúc như nhật ký biết ơn; tác dụng có nhưng nhỏ (chương 7).</dd>
<dt>Posttraumatic growth</dt><dd>Ý tưởng con người lớn lên nhờ biến cố; lời kể "mình đã lớn lên" không khớp với thay đổi đo được (chương 13).</dd>
<dt>Present bias</dt><dd>Thứ có ngay luôn được thổi phồng so với thứ phải chờ: một đồng hôm nay to hơn hẳn một đồng tuần sau trong mắt mình (chương 2).</dd>
<dt>Primary / secondary control</dt><dd>Đổi thế giới cho hợp với mình, so với đổi mình và mục tiêu của mình cho hợp với thế giới (chương 13).</dd>
<dt>Principle</dt><dd>Luật cụ thể rút ra từ một value, dùng cho nhiều tình huống, có thể có ngoại lệ nếu đã cân nhắc kỹ (chương 16).</dd>
<dt>Process goal</dt><dd>Mục tiêu đặt vào việc mình làm được — "viết 30 phút mỗi sáng" — thay vì vào kết quả cuối — "xuất bản một cuốn sách" (chương 11).</dd>
<dt>Protected / sacred values</dt><dd>Những thứ người ta không chịu đem ra đổi chác, nhất là lấy tiền; đề nghị mua chúng thường bị coi là xúc phạm (chương 18).</dd>
<dt>Psychological inoculation</dt><dd>"Tiêm vắc-xin" cho tâm trí: cho thấy trước các chiêu thao túng ở liều nhỏ để lần sau nhận ra ngay (chương 8).</dd>
<dt>Publication bias</dt><dd>Nghiên cứu có kết quả "đẹp" dễ được đăng hơn, còn kết quả bằng không nằm trong ngăn kéo. Vì thế các tổng hợp dễ thấy tác dụng to hơn thực tế.</dd>
<dt>RCT</dt><dd>Thử nghiệm ngẫu nhiên có đối chứng: chia người ngẫu nhiên vào hai nhóm rồi so. Đây là cách tốt nhất để biết cái gì gây ra cái gì.</dd>
<dt>Reappraisal</dt><dd>Hiểu lại một tình huống để cảm xúc đổi theo: tim đập nhanh trước giờ thi là cơ thể đang sẵn sàng, không phải đang hoảng (chương 3).</dd>
<dt>Replication crisis</dt><dd>Nhiều kết quả nổi tiếng đem ra làm lại cẩn thận thì không còn thấy (chương 0).</dd>
<dt>Resilience</dt><dd>Sau biến cố vẫn giữ được nhịp sống gần như cũ; chuyện này phổ biến hơn ta nghĩ (chương 13).</dd>
<dt>Retrieval practice</dt><dd>Gập sách lại và tự nhớ ra, thay vì đọc lại lần nữa (chương 14).</dd>
<dt>Reward prediction error</dt><dd>Chênh lệch giữa phần thưởng nhận được và phần thưởng mình đã chờ đợi; dopamine báo đúng phần chênh lệch ấy (chương 8).</dd>
<dt>Self-compassion</dt><dd>Khi thất bại, nói với chính mình như nói với một người bạn đang gặp chuyện tương tự (chương 3, 13).</dd>
<dt>Self-concordant goals</dt><dd>Mục tiêu mọc lên từ giá trị và mối quan tâm thật của mình, không phải từ kỳ vọng của người khác (chương 11).</dd>
<dt>Self-determination theory</dt><dd>Lý thuyết về ba nhu cầu nền: tự chủ, năng lực, gắn kết (chương 7).</dd>
<dt>Self-distancing</dt><dd>Nhìn chuyện của mình như người ngoài, chẳng hạn tự hỏi "Lan nên làm gì đây?" thay vì "mình nên làm gì" (chương 3, 12).</dd>
<dt>Self-efficacy</dt><dd>Niềm tin rằng mình làm được một việc cụ thể (chương 2).</dd>
<dt>Social comparison</dt><dd>So mình với người khác. So với người hơn mình, nhất là trên mạng xã hội, thường khiến mình thấy kém đi (chương 8).</dd>
<dt>Spacing</dt><dd>Chia việc học thành nhiều lần cách quãng thay vì nhồi một lần (chương 14).</dd>
<dt>Stress-buffering</dt><dd>Có người bên cạnh như có một tấm đệm: cú sốc vẫn đến, nhưng mình ngã đỡ đau hơn (chương 13).</dd>
<dt>Sunk cost</dt><dd>Cố ngồi hết bộ phim dở chỉ vì đã trả tiền vé: tiếp tục vì những gì đã bỏ vào, thay vì nhìn về phía trước (chương 12).</dd>
<dt>Temptation bundling</dt><dd>Gói thứ thích với thứ nên làm, như chỉ cho mình nghe podcast yêu thích khi đang chạy bộ (chương 2).</dd>
<dt>Transfer</dt><dd>Kỹ năng luyện ở việc này lan sang việc khác; sang những khả năng xa hẳn thì gần như không lan (chương 14).</dd>
<dt>Values</dt><dd>Những điều mình coi trọng, là kim chỉ nam cho lựa chọn. Schwartz xếp mười values cơ bản trên một vòng tròn (chương 15).</dd>
<dt>Values clarification</dt><dd>Nói rõ values của mình trước khi chọn, ví dụ chấm điểm từng phương án theo từng value (chương 18).</dd>
<dt>Wanting / liking</dt><dd>Muốn và thích là hai hệ thống khác nhau trong não: có thể thèm lướt điện thoại mà lướt xong chẳng thấy vui (chương 8).</dd>
<dt>Wise reasoning</dt><dd>Cách suy xét chuyện đời: biết giới hạn của mình, xét nhiều góc nhìn, tìm cách dung hoà (chương 7).</dd>
