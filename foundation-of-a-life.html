# Nền móng một đời người

Thử nhớ lại một tối Chủ nhật bạn tự hứa: tuần này dậy sớm, tập thể dục, bớt lướt điện thoại, gọi về nhà nhiều hơn. Chưa tới tối thứ Tư, mọi thứ đã đâu lại vào đấy. Lời hứa không sai, bạn cũng chẳng phải người kém cỏi. Chỉ là người hứa hôm Chủ nhật và người phải làm hôm thứ Tư sống trong hai hoàn cảnh rất khác nhau, mà hầu như chẳng ai dạy ta phải tính đến chuyện đó.

Cuốn sách này gom lại những gì khoa học hành vi biết chắc nhất về bốn câu hỏi mà ai cũng phải tự trả lời. Vì sao mình hành động và cảm thấy như vậy? Nên đối xử với người khác ra sao? Thế nào là một cuộc đời đáng sống mà không bị ai giật dây? Và làm sao đi tới mục tiêu khi đời không chiều theo kế hoạch? Cuối cùng, sách dừng lại ở câu hỏi gốc mà khoa học không trả lời thay ai được: mình coi trọng điều gì, và sống theo điều đó ra sao.

Đây không phải một cuốn sách mẹo vặt. Mẹo giống một công thức nấu ăn chép trên mạng về: nhà người ta nấu thì ngon, về bếp nhà mình khác nồi, khác lửa, khác loại nước mắm, món ăn hỏng mà không biết vì đâu. Vì thế chương nào cũng bắt đầu từ **cơ chế** — vì sao con người hành xử như vậy — rồi mới bàn tới cách sống cho thuận với cơ chế ấy. Đã hiểu cơ chế thì gặp hoàn cảnh mới, bạn vẫn tự suy ra được nên làm gì.

<p class="legend">Chấm màu nhỏ sau một câu là đường dẫn tới nguồn — bấm vào để xem: <span class="ev ev-high" title="Bằng chứng mạnh"></span> chắc chắn (nhiều nghiên cứu lớn hoặc hướng dẫn chính thức) · <span class="ev ev-mid" title="Bằng chứng vừa"></span> khá chắc (ít nghiên cứu hơn, hoặc chỉ là tương quan) · <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span> còn tranh cãi · <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span> suy luận hoặc lời khuyên của chính cuốn sách. Mỗi chương có một ô "Tự kiểm tra" để bạn thấy cơ chế ấy trong tuần của chính mình.</p>

<h2 id="how-to-read"><span class="num">0</span>Cách đọc cuốn sách này</h2>

Đọc cuốn này thế nào cho có ích? Lần đầu, đọc lần lượt từ Phần I tới Phần V. Về sau, khi gặp một chuyện cụ thể như một trận cãi nhau, một quyết định lớn, một mất mát, hãy mở đúng chương bàn về chuyện đó.

Sách đi từ trong ra ngoài rồi quay về gốc:

- **Phần I — Hiểu mình**: hai cơ chế nằm sau mọi lựa chọn, là hành vi và cảm xúc.
- **Phần II — Sống với người khác**: người khác nhìn mình ra sao, xử lý xung đột thế nào, vun đắp tình thân bằng cách nào.
- **Phần III — Một đời đáng sống**: một đời tốt gồm những gì, điều gì đang lặng lẽ chi phối mình, và hai nền móng vật chất là cơ thể và tiền bạc.
- **Phần IV — Hướng đi**: đặt và giữ mục tiêu, ra quyết định lớn, đứng dậy sau biến cố, học và nghĩ cho đúng.
- **Phần V — Gốc rễ**: nơi mọi phần khác quy về. Values của chính mình, những principles rút ra từ đó, cách sống tử tế, và cách quyết định theo values, kể cả khi sống giữa kỳ vọng của gia đình.

```mermaid
flowchart LR
  P1["Phần I<br/>Hiểu mình"] -->|"① hiểu cơ chế<br/>của chính mình"| P2["Phần II<br/>Sống với người khác"]
  P2 -->|"② người khác chiếm<br/>phần lớn cuộc đời mình"| P3["Phần III<br/>Một đời đáng sống"]
  P3 -->|"③ biết mình muốn gì<br/>và điều gì đang chi phối mình"| P4["Phần IV<br/>Hướng đi"]
  P4 -->|"④ mọi lựa chọn đều cần<br/>một gốc để quy chiếu"| P5["Phần V<br/>Gốc rễ"]
  P5 -.->|"⑤ thành bại giúp mình<br/>hiểu thêm về chính mình"| P1
```

Mũi tên ⑤ là lý do cuốn sách này dùng được lâu. Mọi chuyện xảy ra khi bạn bắt tay vào làm, dù là thành công, thất bại, xung đột hay biến cố, đều giúp bạn hiểu mình rõ hơn. Từ hiểu biết mới ấy, cả vòng lại bắt đầu một lượt nữa.

Cuối mỗi phần có vài câu hỏi nhớ lại. Hãy tự trả lời trong đầu rồi mới mở đáp án. Cố nhớ lại như thế chính là **retrieval practice** ở [chương 14](#learning), dùng ngay trên cuốn sách này.

Một điều cần nói trước về bằng chứng. Khoa học hành vi từng trải qua **replication crisis**: nhiều kết quả nổi tiếng, khi các nhóm khác làm lại cẩn thận, không còn đúng nữa. Giống một học trò được điểm cao nhờ trúng tủ, gặp đề khác thì lộ ra chưa thuộc bài. Vì vậy cuốn sách **nói rõ cả những kết quả đã sụp đổ**, và gom chúng lại ở [Phụ lục A](#myths). Biết điều gì sai cũng quý như biết điều gì đúng.

<details><summary>Đọc thêm: những kết quả nổi tiếng đã sụp đổ</summary><div class="inner">

Những kết quả sách nói rõ là đã sụp đổ gồm: ego depletion, xả giận cho nguôi, năm giai đoạn đau buồn như những bậc thang lần lượt, posttraumatic growth như thường được kể, và growth mindset như một can thiệp đại trà. Tất cả được gom lại ở [Phụ lục A](#myths).

</div></details>

<h2 id="principles"><span class="num">1</span>Mười hai nguyên lý</h2>

Nếu chỉ nhớ được một trang, nên nhớ trang nào? Trang này: mười hai nguyên lý, mỗi nguyên lý có chương riêng giải thích kỹ.

```mermaid
mindmap
  root((Một đời<br/>vững))
    Hiểu mình
      1 Tình huống hơn ý chí
      2 Lập kế hoạch cho lúc mệt
      3 Cảm xúc là tín hiệu
    Người khác
      4 Hỏi thay vì đoán
      5 Họ quý mình hơn mình tưởng
      6 Mềm với người, vững với điều mình cần
    Một đời đáng sống
      7 Quan hệ là trụ cột
      8 Mục tiêu nội tại
      9 Hiểu cơ chế là lá chắn
      10 Cơ thể và tiền là nền
    Hướng đi
      11 Values trước, rồi nhìn từ bên ngoài
      12 Đổi được thì làm, không đổi được thì chỉnh mình
```

1. **Hành vi phụ thuộc vào tình huống lúc chọn nhiều hơn vào ý định lúc lập kế hoạch.** Người có self-control tốt không gồng giỏi hơn ai. Họ chỉ ít phải đối mặt với cám dỗ hơn. Muốn đổi hành vi, hãy đổi tình huống trước ([chương 2](#behavior)).
2. **Người lập kế hoạch và người thực hiện ở hai trạng thái khác nhau.** Hãy lập kế hoạch cho chính mình lúc đang mệt, dựa vào những lần trước, đừng dựa vào "đáng lẽ mình phải làm được" ([chương 2](#behavior)).
3. **Cảm xúc là tín hiệu, không phải mệnh lệnh.** Hãy gọi đúng tên cảm xúc và chấp nhận là mình đang có cảm xúc ấy. Rồi chọn cách điều tiết hợp với hoàn cảnh, vì không cách nào tốt cho mọi lúc ([chương 3](#emotions)).
4. **Đừng đoán người khác nghĩ gì — hỏi.** Tự đặt mình vào vị trí người kia không giúp mình hiểu họ đúng hơn; hỏi và lắng nghe thì có ([chương 4](#impressions)).
5. **Người khác quý mình, sẵn lòng giúp mình, và đón nhận lời nói thật lòng tốt hơn mình tưởng.** Phần lớn nỗi ngại khi giao tiếp bắt nguồn từ những dự đoán sai; hãy chủ động hơn ([chương 4](#impressions)).
6. **Trong xung đột, quan tâm thật đến người kia và giữ vững điều mình cần — cùng một lúc.** Tha thứ khi người kia sửa sai. Còn tha thứ mãi cho người không hề sửa sai thì mình sẽ mất dần lòng tự trọng ([chương 5](#conflict)).
7. **Những người thân là trụ cột của cuộc đời**, không phải việc để dành cho lúc rảnh ([chương 6](#close-ties)).
8. **Sống theo mục tiêu nội tại — gắn bó, trưởng thành, đóng góp, sức khoẻ — hơn là tiền, hình ảnh, danh tiếng.** Một đời tốt thoả ba nhu cầu: tự chủ, năng lực, gắn kết ([chương 7](#good-life)).
9. **Thói so sánh, đám đông, quyền uy và những thiết kế chuyên giành giật sự chú ý chi phối ta nhiều hơn ta nghĩ.** Hiểu cơ chế là lá chắn tốt nhất ([chương 8](#autonomy)).
10. **Cơ thể và tiền bạc là nền móng, và cả hai phụ thuộc nhiều vào default — những gì đã sắp đặt sẵn.** Với cơ thể: ngủ đều, vận động, không thuốc lá, càng ít rượu càng tốt. Với tiền: tiết kiệm tự động, đầu tư phí thấp, ít giao dịch, không để nợ rải rác ([chương 9](#body), [chương 10](#money)).
11. **Quyết định lớn: đối chiếu values và bright lines của mình trước, rồi mới nhìn từ bên ngoài.** Nhìn mình như nhìn một người bạn, và đánh giá quyết định theo quá trình chứ không theo kết quả ([chương 18](#decide-values)). Khi đã phân vân rất lâu, dám thay đổi thường không tệ như mình sợ ([chương 12](#decisions)).
12. **Trước biến cố: cái gì đổi được thì hành động, cái gì không đổi được thì chấp nhận và chỉnh lại mục tiêu của mình.** Phần lớn mọi người vượt qua được nhiều hơn họ tưởng, nhất là khi có người bên cạnh nâng đỡ ([chương 13](#adversity)).

<div class="callout data"><div class="ct">Tự kiểm tra: nguyên lý nào đang vắng mặt</div>

Tối Chủ nhật này, mở ghi chú trên điện thoại và viết ra ba chuyện tuần qua không như ý: một buổi tập thể dục bị bỏ, một lần cáu với người thân, một khoản tiền tiêu ngoài dự tính. Với mỗi chuyện, dò lại mười hai nguyên lý ở trên và chọn đúng một nguyên lý giải thích chuyện ấy rõ nhất. Nếu cả ba đều rơi vào nguyên lý 1 và 2, thứ cần sửa lúc này là cách sắp xếp tình huống và kế hoạch cho lúc mệt, không phải ý chí. Hãy đọc kỹ chương 2 trước. Nếu chúng rơi vào nguyên lý 4 đến 6, hãy bắt đầu từ Phần II <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div>

<div class="callout why"><div class="ct">Bản chất, trong một đoạn</div>

Con người không cứ lên kế hoạch xong là làm đúng như thế. Ở mỗi khoảnh khắc, não chọn thứ có lợi nhất *trong tình huống trước mặt*, với trạng thái cơ thể và cảm xúc lúc đó. Não cũng đoán rất kém, cả về chính mình lẫn về người khác. Gần như mọi lời khuyên trong cuốn sách này quy về ba việc. Một là **sắp xếp tình huống** từ trước khi phải chọn. Hai là **sửa những dự đoán sai** bằng dữ liệu thật thay vì cảm giác. Ba là **chăm chút những trụ cột** như các mối quan hệ, cơ thể, tiền, kỹ năng, vì giá trị của chúng dồn lại qua nhiều năm.

</div>


<h2 id="part-1" class="part">Phần I — Hiểu mình</h2>

<h2 id="behavior"><span class="num">2</span>Hành vi do tình huống quyết định</h2>

Biết rõ nên làm gì, vì sao tới lúc làm thật mình lại không làm? Vì ở khoảnh khắc phải chọn, hành vi đi theo tình huống trước mặt chứ không theo kế hoạch đã viết. Muốn đổi hành vi, hãy đổi tình huống trước.

Ta hay hình dung con người như người chạy xe máy: lý trí cầm lái, ý chí là tay ga, thất bại nghĩa là lái kém. Sát hơn là nước mưa trong một con hẻm. Nước không "quyết định" đi lối nào, nước chảy chỗ trũng. Rất nhiều hành vi hằng ngày cũng thế. Chúng bật ra theo bối cảnh và bị trạng thái cơ thể kéo đi. Rồi chúng ngã ngũ bằng một phép so sánh chớp nhoáng giữa công sức và phần thưởng **ngay ở khoảnh khắc chọn**. Muốn nước chảy hướng khác, người ta không đứng đó quát nước mà khơi lại rãnh. Chương này nhìn kỹ khoảnh khắc chọn ấy.

```mermaid
flowchart LR
  S["Tình huống<br/>(cue, cám dỗ trước mặt,<br/>thứ gì dễ với tới)"] -->|"①"| C(("Khoảnh khắc<br/>chọn"))
  B["Trạng thái<br/>(mệt, đói, buồn,<br/>căng thẳng)"] -->|"②"| C
  K["Công sức phải bỏ ra<br/>để bắt đầu"] -->|"③"| C
  R["Phần thưởng có ngay<br/>hay phải chờ rất lâu"] -->|"④"| C
  P["Kế hoạch<br/>viết từ trước"] -.->|"⑤ chỉ thắng nếu đã đổi<br/>được ① ③ ④ từ trước"| C
  C --> A["Hành vi thực tế"]
```

1. **Tình huống**: thứ gì ở trước mặt, thứ gì trong tầm tay, bối cảnh nào đang đánh thức habit nào.
2. **Trạng thái**: cùng một người mà lúc mệt chọn khác hẳn lúc khoẻ. Lúc khoẻ thì lại không tin mình sẽ như vậy.
3. **Công sức** để bắt đầu: càng nhiều bước, càng mơ hồ, càng khó chịu thì càng ngại bắt tay vào.
4. **Phần thưởng**: thứ có ngay thường nặng ký hơn thứ đến sau, nhất là khi cái giá phải trả là công sức.
5. **Kế hoạch** chỉ là một mũi tên đứt nét. Tới khoảnh khắc chọn, tự kế hoạch không thắng nổi. Kế hoạch chỉ thắng khi *từ trước đó* đã kịp đổi tình huống, công sức hoặc phần thưởng.

<h3 id="cold-hot"><span class="num">2.1</span>Người lập kế hoạch và người thực hiện</h3>

Vì sao kế hoạch viết tối Chủ nhật hay đổ vỡ giữa tuần? Vì người viết kế hoạch đang no, khoẻ, thảnh thơi, còn người phải làm theo thì mệt và có cám dỗ trước mặt. Hãy lập kế hoạch cho chính mình lúc đang mệt, dựa vào những lần trước.

Hãy hình dung hai nhân vật cùng mang tên bạn. Nhân vật thứ nhất ngồi lên kế hoạch lúc chín giờ sáng Chủ nhật: ngủ đủ giấc, ăn sáng xong, ly cà phê trên bàn. Nhân vật thứ hai phải làm theo kế hoạch ấy vào tối thứ Ba: vừa đi làm về, kẹt xe gần một tiếng dưới mưa, bụng đói, điện thoại cứ sáng lên thông báo. Người thứ nhất lập kế hoạch như thể người thứ hai cũng thảnh thơi y như mình. Sai lầm nằm ở đó.

Khi đang "cold", tức là no, khoẻ, không có gì cám dỗ, người ta xem nhẹ sức chi phối của những lúc "hot": mệt, đói, thèm, giận, cám dỗ ngay trước mắt. Người ta cũng quên luôn những lần mình từng bị cuốn đi ra sao. Hiện tượng này có tên là **hot–cold empathy gap** <a class="ev ev-high" href="#r-loewenstein1996" title="Loewenstein 1996 · Bằng chứng mạnh"></a><a class="ev ev-high" href="#r-loewenstein2005" title="Loewenstein 2005 · Bằng chứng mạnh"></a>.

Bạn đoán xem: nếu một tuần trước bạn đã chọn sẵn trái cây cho bữa xế, thì tới lúc ăn thật, khả năng bạn đổi sang bánh ngọt là bao nhiêu?

Một thí nghiệm ở Amsterdam đã hỏi đúng câu ấy với 200 nhân viên. Trong số người chọn trước món lành mạnh, **62–82% đổi sang món không lành mạnh** khi đến lúc ăn thật <a class="ev ev-mid" href="#r-read1998" title="Read &amp; van Leeuwen 1998 · Bằng chứng vừa"></a>. Họ không nói dối. Lúc chọn, họ no, và họ thật lòng tin mình sẽ muốn trái cây.

Cùng gốc với hiện tượng này là **present bias**: một phần thưởng có ngay nặng ký hơn hẳn chính phần thưởng ấy nếu phải chờ. Thiên lệch này mạnh với *công sức* hơn với tiền bạc <a class="ev ev-mid" href="#r-augenblick2015" title="Augenblick 2015 · Bằng chứng vừa"></a>. Ta khá kiên nhẫn khi chờ nhận tiền, nhưng rất muốn đẩy việc nặng nhọc sang "mai".

Cái nguy nhất lại đến *sau* thất bại. Sáng thứ Tư, đã hết mệt, bạn nhìn lại tối hôm qua và kết luận "mình lười", "mình không có kỷ luật". Tức là bạn đổ hết cho tính cách mà quên mất cơn mệt <a class="ev ev-mid" href="#r-nordgren2006" title="Nordgren 2006 · Bằng chứng vừa"></a>.

Lặp lại vài lần, niềm tin rằng mình làm được việc ấy tụt xuống <a class="ev ev-high" href="#r-bandura1977" title="Bandura 1977 · Bằng chứng mạnh"></a>. Một lỗi *dự đoán* đã biến thành một kết luận sai về *bản thân*, rồi kết luận sai ấy lại sinh thêm thất bại.

Từ đây rút ra hai quy tắc cho mọi kế hoạch <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Thứ nhất, **lập kế hoạch theo dữ liệu những lần gần nhất**, không theo "đáng lẽ mình phải làm được". Ba tuần qua bạn chỉ tập được một buổi mỗi tuần thì kế hoạch tuần này là hai buổi, không phải năm. [Chương 12](#decisions) sẽ cho thấy chỉ riêng việc buộc dự đoán bám vào kinh nghiệm cũ đã xoá được sai lệch. Thứ hai, **thiết kế cho trạng thái hot**: việc dành cho lúc mệt phải nhỏ, rõ, và chuẩn bị sẵn từ lúc còn tỉnh. Bộ đồ tập để sẵn trên ghế, danh sách ba việc viết từ tối hôm trước là những ví dụ như thế.

**Ví dụ đi từng bước: ngày lương** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

- *Tình huống.* Tối ngày lương về, 21:00, bạn ngồi vào bàn và quyết: tháng này để dành 30%, phần còn lại tiêu thoải mái.
- *Cơ chế dự đoán gì.* Người ra quyết định đang "cold": vừa nhận tiền, chưa có món gì đang thèm trước mặt. Người phải giữ lời là những "bạn" khác suốt ba mươi ngày tới: tối thứ Sáu mệt mỏi mở app mua sắm, trưa thứ Bảy đi ăn với bạn bè. Mỗi lần như thế, khoản để dành ở tận cuối tháng, còn món đồ ở ngay trong màn hình. Present bias đứng về phía món đồ.
- *Nếu chỉ dựa vào quyết tâm.* Gần cuối tháng nhìn lại, khoản để dành chẳng còn bao nhiêu, và câu quen thuộc lại hiện lên: "mình tiêu hoang quá".
- *Làm khác đi.* Đừng cố thắng ở ngày cuối tháng; hãy thắng ngay ở ngày lương. Ngay tối hôm ấy, cài lệnh tự động chuyển 30% vào đúng ngày lương hằng tháng sang một tài khoản khác, không gắn thẻ, không hiện trên app hằng ngày. Từ đó, số tiền bạn nhìn thấy để tiêu đã là phần còn lại. Mỗi lần mở app mua sắm không còn là một trận giằng co với khoản để dành. [Chương 10](#money) bàn kỹ chuyện default trong tiền bạc.

<div class="callout data"><div class="ct">Tự kiểm tra: kế hoạch Chủ nhật so với thực tế</div>

Chọn một việc tốt cho mình mà bạn hay tự hứa, như tập thể dục hay đọc sách. Tối Chủ nhật, ghi vào điện thoại số buổi bạn định làm việc ấy trong tuần, mỗi buổi bao nhiêu phút. Mỗi tối trước khi ngủ, ghi một dòng: có làm không, làm bao nhiêu phút, và lúc đi làm về tới nhà mình mệt cỡ nào trên thang 1–5. Chủ nhật sau, đặt hai con số cạnh nhau. Nếu số phút thực tế chỉ bằng chừng một nửa số dự định, và các buổi bị bỏ dồn vào những ngày mệt 4–5, đó chính là hot–cold empathy gap trong tuần của bạn. Kế hoạch tuần tới nên lấy số thực tế làm mốc, không lấy số dự định <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div>

<details><summary>Đọc thêm: chi tiết thí nghiệm và những mô hình liên quan</summary><div class="inner">

Thí nghiệm ở Amsterdam làm với nhân viên ở các công ty, bệnh viện và cửa hàng. Chiều ngược lại, từ món không lành mạnh sang món lành mạnh, chỉ 0–8% người đổi ý <a class="ev ev-mid" href="#r-read1998" title="Read &amp; van Leeuwen 1998 · Bằng chứng vừa"></a>.

Kinh tế học có một mô hình chia người ta làm hai kiểu khi đứng trước chữ "mai". Người "naive" tin rằng ngày mai mình sẽ làm, nên cứ dời mãi. Người "sophisticated" biết trước rằng ngày mai mình cũng sẽ lại muốn dời, nên làm sớm hơn, và nhờ đó trì hoãn ít hơn <a class="ev ev-mid" href="#r-odonoghue1999" title="O&#x27;Donoghue &amp; Rabin 1999 · Bằng chứng vừa"></a>. Đây là một mô hình lý thuyết, chưa phải kết quả đo được. Ai từng ôn thi sẽ thấy quen: đứa tối nào cũng hứa "mai mới học" thường là đứa phải thức trắng đêm trước ngày thi <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Người quá tin vào khả năng kiềm chế của mình lại hay để mình ở gần cám dỗ hơn, nên hay sa ngã hơn. Ví dụ: tự tin "mình chỉ xem một tập thôi" nên chẳng buồn tắt autoplay. Hiện tượng này gọi là restraint bias <a class="ev ev-mid" href="#r-nordgren2009" title="Nordgren 2009 · Bằng chứng vừa"></a>.

Khoảng cách giữa điều mình định làm và điều mình làm thật gọi là intention–behaviour gap. Tổng hợp các thí nghiệm tìm cách thay đổi ý định cho thấy: ngay cả khi ý định đổi khá nhiều, hành vi cũng chỉ đổi theo chừng một nửa <a class="ev ev-high" href="#r-webb2006" title="Webb &amp; Sheeran 2006 · Bằng chứng mạnh"></a>. Ý định là cần, nhưng mới đi được nửa đường.

Niềm tin rằng mình làm được một việc có tên là self-efficacy. Self-efficacy thấp là một trong những thứ đi cùng trì hoãn rõ nhất <a class="ev ev-high" href="#r-steel2007" title="Steel 2007 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="effort"><span class="num">2.2</span>Gắng sức có cái giá của nó, nhưng ý chí không phải bình xăng</h3>

Cuối ngày thấy cạn sức, có phải ý chí đã dùng hết? Không hẳn. Cảm giác "hết sức" là não báo rằng việc đang làm không còn đáng công, chứ không phải một bình xăng đã cạn.

Hình ảnh phổ biến về ý chí là một bình xăng: sáng đầy, cưỡng lại vài cám dỗ là vơi dần, chiều tối thì cạn. Ý tưởng này, ego depletion, từng rất nổi tiếng. Nhưng khi nhiều phòng thí nghiệm cùng làm lại thật nghiêm ngặt, hiệu ứng gần như bằng không <a class="ev ev-high" href="#r-vohs2021" title="Vohs 2021 · Bằng chứng mạnh"></a>. Bình xăng không hề vơi.

Vậy cảm giác "hết sức" cuối ngày là gì? Hãy nghĩ tới chủ một quán cà phê đông khách đang xếp người: để một bạn nhân viên đứng mãi ở quầy pha chế nghĩa là ngoài bàn không ai chạy order. Theo **opportunity cost model**, cảm giác "tốn sức" là lời nhắc của một người chủ quán như thế trong não. Dồn sự tập trung cho việc này nghĩa là không dùng được cho việc khác. Khi cái giá ấy lớn hơn phần thưởng, não phát tín hiệu "mệt rồi, đổi việc đi" <a class="ev ev-mid" href="#r-kurzban2013" title="Kurzban 2013 · Bằng chứng vừa"></a>.

Vì tín hiệu ấy nói về *giá trị* của việc đang làm, nên khi một việc bỗng trở nên hấp dẫn, "năng lượng" tự dưng quay lại. Mười giờ đêm, ngồi trước cuốn sách mà mắt díp lại. Vậy mà nghe cả nhà reo lên vì đội tuyển vừa gỡ hoà phút cuối là chạy ra phòng khách, tỉnh như sáo <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Mệt thật sự cũng có, nhưng phải làm lâu hơn người ta tưởng mới tới mức ấy. Sau hơn sáu tiếng làm việc đòi hỏi tập trung cao, người ta chọn bốc đồng hơn, và vùng não lo việc cân nhắc hoạt động yếu hơn <a class="ev ev-mid" href="#r-blain2016" title="Blain 2016 · Bằng chứng vừa"></a>. Một ngày đi làm, cộng thêm quãng đường đi về, thường dài hơn thế nhiều. Nên lúc vừa về tới nhà sau một ngày căng thẳng không phải lúc tốt để quyết một chuyện lớn hay chốt đơn một món đồ đắt tiền.

Vậy thay vì ngồi chờ "có năng lượng", hãy **khiến việc bắt đầu bớt tốn sức** và **cho phần thưởng đến sớm hơn**. Hai thứ này mình chủ động được; năng lượng cuối ngày thì không.

<details><summary>Đọc thêm: hai lần kiểm tra lại ego depletion, và thí nghiệm sáu tiếng</summary><div class="inner">

Cả hai lần kiểm tra lại đều cho nhiều phòng thí nghiệm cùng làm một thí nghiệm, cách phân tích đăng ký từ trước để không ai "nắn" được kết quả. Lần thứ nhất có 23 phòng thí nghiệm với hơn 2.000 người <a class="ev ev-high" href="#r-hagger2016" title="Hagger 2016 · Bằng chứng mạnh"></a>. Lần thứ hai, nghiên cứu Vohs 2021 ở trên, có 36 phòng thí nghiệm với hơn 3.500 người.

Trong thí nghiệm sáu tiếng, vùng não yếu đi là lateral prefrontal cortex. Hiện tượng chỉ thấy ở nhóm làm việc khó, không thấy ở nhóm làm việc dễ <a class="ev ev-mid" href="#r-blain2016" title="Blain 2016 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="habits"><span class="num">2.3</span>Habit: khi bối cảnh quyết định thay mình</h3>

Vì sao có những việc mình làm mà không hề định làm? Vì đó là habit: bối cảnh bấm nút, hành vi tự diễn ra, lý trí chỉ hay biết khi mọi chuyện đã rồi.

Bạn có bao giờ mở khoá điện thoại, rồi thấy mình đang lướt Facebook mà không nhớ đã định mở app nào? Hay đi bộ từ chỗ làm về, tới cửa nhà mới giật mình vì chẳng nhớ gì về quãng đường vừa qua? Đó là habit đang làm việc.

```mermaid
flowchart LR
  C["Cue<br/>(nơi chốn, giờ giấc,<br/>việc vừa làm xong)"] -->|"① kích hoạt"| R["Response<br/>hành vi tự diễn ra"]
  R -->|"② lặp lại trong<br/>cùng bối cảnh"| L["Liên kết cue → response<br/>mạnh dần"]
  L -->|"③ lần sau nhanh hơn,<br/>ít cần quyết định hơn"| C
```

Habit là mối liên kết não học được giữa bối cảnh và phản ứng, hình thành qua lặp đi lặp lại. Khi đã đủ mạnh, habit tự diễn ra, gần như không cần ý định <a class="ev ev-high" href="#r-wood2016" title="Wood &amp; Rünger 2016 · Bằng chứng mạnh"></a>. Giống một lối mòn trên bãi cỏ: lúc đầu phải chọn hướng đi, đi mãi một đường thì chân tự theo lối có sẵn.

Thí nghiệm minh hoạ rõ nhất là chuyện bỏng ngô. Những người quen ăn bỏng ngô ở rạp **ăn bỏng ngô ôi, để từ tuần trước, nhiều y như bỏng ngô mới**, nhưng chỉ khi ở trong rạp <a class="ev ev-mid" href="#r-neal2011" title="Neal 2011 · Bằng chứng vừa"></a>. Họ không hề thích bỏng ôi. Đèn tắt, màn hình sáng, tay cầm hộp: bối cảnh đã quyết định thay họ, còn vị giác chẳng được hỏi ý kiến.

Khi tập một habit mới, đừng tin mốc "21 ngày". Thời gian để một hành vi trở nên tự động dao động từ **18 đến 254 ngày** tuỳ người, và lỡ một lần không làm hỏng quá trình ấy <a class="ev ev-mid" href="#r-lally2010" title="Lally 2010 · Bằng chứng vừa"></a>. Nếu sau một tháng mà buổi tập bodyweight ở nhà vẫn phải cố mới làm được, bạn chẳng có vấn đề gì, chỉ là đang ở giữa đường. Lối mòn cũng không biến mất chỉ vì một hôm bạn đi đường khác.

Đáng thưởng nhất là việc quay lại. Một nghiên cứu cực lớn ở phòng gym thử cùng lúc hàng chục chương trình khuyến khích đi tập. Chương trình đứng đầu là thưởng nhỏ cho việc *quay lại sau một buổi bị lỡ* <a class="ev ev-high" href="#r-milkman2021" title="Milkman 2021 · Bằng chứng mạnh"></a>. Áp vào tuần của bạn: lỡ buổi tập tối thứ Hai thì đừng tự trách. Hãy biến tối thứ Ba thành một buổi thật dễ, mười cái squat cũng được, và tự thưởng chính vì đã quay lại <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Thời điểm dễ tạo habit mới nhất là lúc bối cảnh sống thay đổi, như chuyển nhà hay đổi việc, vì khi ấy những lối mòn cũ không còn chỗ dựa. Một can thiệp thay đổi hành vi có tác dụng rõ hơn ở người vừa chuyển nhà, trong khoảng ba tháng đầu <a class="ev ev-mid" href="#r-verplanken2016" title="Verplanken &amp; Roy 2016 · Bằng chứng vừa"></a>. Mấy tuần đầu dọn về nhà mới là một tờ giấy trắng hiếm hoi; những gì bạn làm trong quãng ấy sẽ dễ thành nếp nhất.

<details><summary>Đọc thêm: habit chiếm bao nhiêu phần đời sống, và các con số về thời gian hình thành</summary><div class="inner">

Trong hai nghiên cứu ghi nhật ký theo từng giờ của sinh viên đại học, khoảng một phần ba đến một nửa số hành vi (35% và 43%) là những việc làm gần như mỗi ngày, thường ở cùng một chỗ <a class="ev ev-mid" href="#r-wood2002" title="Wood 2002 · Bằng chứng vừa"></a>.

Mốc "21 ngày" chỉ là con số truyền miệng. Habit đi tập gym mất hàng tháng, còn habit rửa tay của nhân viên bệnh viện chỉ mất vài tuần <a class="ev ev-mid" href="#r-buyalskaya2023" title="Buyalskaya 2023 · Bằng chứng vừa"></a>.

Nguyên văn từ nghiên cứu của Lally: *"Missing one opportunity to perform the behaviour did not materially affect the habit formation process"* <a class="ev ev-mid" href="#r-lally2010" title="Lally 2010 · Bằng chứng vừa"></a>.

Nghiên cứu ở phòng gym là một megastudy với 61.293 hội viên, thử cùng lúc 54 chương trình bốn tuần. Khi các chương trình kết thúc, chỉ 8% trong số đó còn để lại khác biệt đo được <a class="ev ev-high" href="#r-milkman2021" title="Milkman 2021 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="situation"><span class="num">2.4</span>Self-control là khéo sắp xếp tình huống</h3>

Người có self-control tốt có phải gồng giỏi hơn mình? Không. Họ ít phải gồng hơn, vì họ khéo sắp xếp để cám dỗ ít xuất hiện trước mặt.

Hai người cùng muốn bớt ăn vặt. Người thứ nhất để một hộp bánh trên bàn ăn và tự nhủ "không được ăn" mỗi lần nhìn thấy, mấy chục lần một ngày. Người thứ hai thì không mua bánh về. Đến cuối tháng, người thứ hai thắng, và trông như thể người ấy "có ý chí hơn". Thật ra người ấy chỉ phải thắng một trận ở siêu thị, còn người kia phải thắng mấy chục trận mỗi ngày.

Nghiên cứu cho thấy đúng như vậy. Khi người ta ghi lại ham muốn ngay trong đời sống hằng ngày, người có self-control cao **báo cáo ít xung đột giữa ham muốn và mục tiêu hơn** <a class="ev ev-mid" href="#r-hofmann2012" title="Hofmann 2012 · Bằng chứng vừa"></a>. Tức là họ ít phải đấu tranh với bản thân hơn. Người giỏi tự chủ không phải người gồng giỏi, mà là người khéo sắp xếp để khỏi phải gồng.

Công cụ đơn giản nhất để gắn hành động vào tình huống là **implementation intention**, một kế hoạch dạng if-then kiểu "Khi [tình huống] thì tôi [hành động]". Giống như ở nhiều nhà, cứ nghe tiếng chuông chùa buổi chiều là bà thắp nén nhang, chẳng cần ai nhắc: tình huống tới là việc tự diễn ra. "Tôi sẽ đọc sách nhiều hơn" là một mong muốn. "Trước khi lên giường, tôi cắm sạc điện thoại ngoài phòng khách rồi đọc mười trang" là một implementation intention. Tổng hợp rất nhiều phép thử cho thấy cách viết này giúp thật, từ mức nhỏ tới khá rõ <a class="ev ev-high" href="#r-sheeran2025" title="Sheeran 2025 · Bằng chứng mạnh"></a>.

Nhưng if-then không phải đũa thần. Kế hoạch if-then giúp giảm hút thuốc ở người có habit hút yếu hoặc vừa, nhưng không giúp được người có habit mạnh <a class="ev ev-mid" href="#r-webb2009" title="Webb, Sheeran &amp; Luszczynska 2009 · Bằng chứng vừa"></a>. Một lối mòn đã sâu thì cắm biển "Cấm giẫm lên cỏ" không đủ.

Với habit mạnh, cách duy nhất thấy hiệu quả là chủ động canh chừng: để ý đúng khoảnh khắc tay mình bắt đầu làm, và chặn lại ngay lúc ấy <a class="ev ev-mid" href="#r-quinn2010" title="Quinn 2010 · Bằng chứng vừa"></a>.

**Ví dụ đi từng bước: buổi nghe tiếng Anh sau giờ đi làm** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

- *Tình huống.* Bạn muốn luyện nghe tiếng Anh. Kế hoạch cũ ghi "tối nào cũng nghe 30 phút". Đi làm về tới nhà, việc đầu tiên tay làm là rút điện thoại, nằm xuống sofa. Habit đã ra tay trước khi kế hoạch kịp lên tiếng.
- *Cơ chế dự đoán gì.* "Tối nào cũng nghe" không gắn với tình huống nào, nên phải trông vào trí nhớ và ý chí đúng lúc mệt nhất. Lướt điện thoại thì có cue rõ ràng: sofa, điện thoại trong túi, cảm giác vừa xong một ngày. Một bên có cue, một bên không, nên bên có cue thắng.
- *Viết lại thành if-then.* "Khi bước vào nhà và treo cặp lên móc, tôi đeo tai nghe và bật tập podcast đã chọn sẵn, rồi mới thay đồ." Tai nghe để ngay cạnh móc treo cặp. Các tập nghe đã chọn sẵn từ Chủ nhật, để lúc về tới nhà không còn gì phải quyết.
- *Đọc kết quả.* Sau hai tuần, đếm số tối đã nghe. Nếu phần lớn các tối đều nghe được, if-then đã đủ. Nếu vẫn thường thấy mình nằm lướt điện thoại trước khi kịp đeo tai nghe, habit lướt điện thoại đã quá mạnh, riêng if-then chưa đủ. Lúc ấy cần thêm việc canh chừng ở đoạn trên: canh đúng khoảnh khắc tay thò vào túi lấy điện thoại, và chặn ngay khoảnh khắc ấy.

<div class="callout data"><div class="ct">Tự kiểm tra: đếm cám dỗ, không đếm ý chí</div>

Trong một tuần, mỗi lần thấy mình phải cố cưỡng lại một thứ, như mở mạng xã hội khi đang dở tay việc nhà, đặt trà sữa, xem thêm một tập phim, hãy gạch một vạch vào ghi chú điện thoại. Kèm vài chữ ghi nơi và giờ. Cuối tuần, xem các vạch dồn vào đâu. Có thể phần lớn rơi vào cùng hai, ba chỗ, như trên giường trước khi ngủ hay trên sofa sau bữa tối. Khi ấy việc cần làm không phải là gồng giỏi hơn ở đó, mà là đổi chính chỗ ấy: tắt thông báo, để điện thoại sạc ngoài phòng khách, xoá thẻ đã lưu trong app giao đồ ăn. Tuần sau đếm lại; số vạch giảm nghĩa là bạn đã chuyển từ gồng sang sắp xếp <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div>

<details><summary>Đọc thêm: các nghiên cứu khác về self-control và if-then</summary><div class="inner">

Nghiên cứu của Hofmann theo dõi 205 người qua gần 8.000 lần báo cáo ham muốn trong ngày <a class="ev ev-mid" href="#r-hofmann2012" title="Hofmann 2012 · Bằng chứng vừa"></a>.

Ở sinh viên, nỗ lực tự kiềm chế trong khoảnh khắc **không liên quan** tới việc đạt mục tiêu cuối học kỳ. Thứ báo trước thất bại là *họ gặp cám dỗ thường xuyên đến đâu* <a class="ev ev-mid" href="#r-milyavskaya2017" title="Milyavskaya &amp; Inzlicht 2017 · Bằng chứng vừa"></a>.

Tổng hợp 102 nghiên cứu với hơn 32.000 người cho thấy self-control gắn với hành vi **tự động** rõ hơn là với hành vi phải gồng <a class="ev ev-high" href="#r-deridder2012" title="de Ridder 2012 · Bằng chứng mạnh"></a>. Self-control phát huy tác dụng thông qua habit <a class="ev ev-mid" href="#r-galla2015" title="Galla &amp; Duckworth 2015 · Bằng chứng vừa"></a>.

Khi thử ngoài đời, sinh viên dùng chiến lược **thay đổi tình huống** đạt mục tiêu tốt hơn sinh viên cố kìm phản ứng <a class="ev ev-mid" href="#r-duckworth2016" title="Duckworth 2016 · Bằng chứng vừa"></a>.

Tổng hợp về implementation intention gồm 642 phép thử. Cách viết này giúp nhiều hơn khi viết đúng dạng if-then, khi động lực cao, và khi mình nhẩm lại kế hoạch vài lần <a class="ev ev-high" href="#r-sheeran2025" title="Sheeran 2025 · Bằng chứng mạnh"></a>.

Cách canh chừng ở trên có tên là vigilant monitoring. Né tác nhân kích hoạt ngay lúc đó, gọi là stimulus control, giúp được với cám dỗ nhưng không giúp với habit mạnh <a class="ev ev-mid" href="#r-quinn2010" title="Quinn 2010 · Bằng chứng vừa"></a>.

Cơ hội thật để đổi một habit mạnh là lúc cả bối cảnh sống thay đổi, như chuyển nhà hay đổi việc ở [§2.3](#habits) <a class="ev ev-mid" href="#r-verplanken2016" title="Verplanken &amp; Roy 2016 · Bằng chứng vừa"></a>. Lúc ấy bãi cỏ cũ không còn, và bạn được đi lại từ đầu.

</div></details>

<h3 id="levers"><span class="num">2.5</span>Ví dụ tính tay: ba đòn bẩy</h3>

Lúc mệt, làm sao để việc nên làm thắng được chiếc điện thoại? Thu nhỏ việc lại, đặt việc vào đúng tình huống, và đưa phần thưởng vào ngay bên trong việc.

Steel gom nghiên cứu về trì hoãn thành **Temporal Motivation Theory** <a class="ev ev-mid" href="#r-steel2007" title="Steel 2007 · Bằng chứng vừa"></a>. Ý chính rất đời thường: một việc càng **chắc làm được** và càng **đáng giá** thì càng hút mình; phần thưởng càng **phải chờ lâu** thì sức hút càng yếu. Khi so các lựa chọn của cùng một người, có thể viết gọn thành:

$$\text{Sức hút của một việc} \approx \frac{E \times V}{D}$$

E là expectancy, mình tin làm được đến đâu. V là value, việc ấy đáng giá với mình bao nhiêu. D là delay, bao lâu nữa mới thấy phần thưởng. Công thức chỉ để thấy hướng: tăng E, tăng V hoặc giảm D đều làm việc ấy hấp dẫn hơn.

Thử áp vào một buổi tối trong tuần, vừa đi làm về. Các con số dưới đây là **minh hoạ**, đặt ra để thấy hướng tác động của từng đòn bẩy, không phải số đo:

| Lựa chọn lúc mệt | E | V | D | E × V / D |
|---|---|---|---|---|
| "Tập gym một tiếng rưỡi" | 0,3 — mệt, phải đi xa | 9 — rất quan trọng | 60 — thấy khác sau nhiều tuần | **0,045** |
| Nằm lướt điện thoại | 1,0 — chắc chắn làm được | 3 — vui vừa | 1 — vui ngay | **3** |
| "Đi bộ 15 phút với một podcast mình thích, giày để sẵn ở cửa" | 0,95 — quá nhỏ để thất bại | 4 — vui ngay, có ích | 1 — vui ngay khi bước ra | **3,8** |

Buổi gym quan trọng nhất mà lại thua xa, vì vừa khó bắt đầu vừa quá lâu mới thấy thành quả. Đi bộ thắng không phải vì quan trọng hơn. Việc này nhỏ tới mức gần như chắc chắn làm được (E tăng), có phần thưởng ngay trong lúc làm (D giảm), và đôi giày để sẵn ở cửa khiến việc bắt đầu đỡ tốn sức. Đi bộ còn thắng được cả điện thoại, vì podcast mình thích đưa niềm vui vào ngay bên trong việc, đẩy V nhỉnh hơn.

Cách ghép một thứ mình thích với một việc nên làm gọi là **temptation bundling**. Khi người ta chỉ được nghe một cuốn truyện hấp dẫn lúc ở phòng gym, số lần đi tập tăng lên lúc đầu rồi giảm dần <a class="ev ev-mid" href="#r-milkman2014" title="Milkman 2014 · Bằng chứng vừa"></a>. Ở nhà, cùng một ý: chỉ bật bộ phim mình đang mê khi ngồi gấp đống quần áo hay là đồ cả tuần <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Công thức này dùng được cho mọi mục tiêu, từ tập luyện, tiết kiệm tới học hành: **thu nhỏ việc lại, đặt việc vào đúng tình huống, và đưa phần thưởng vào ngay bên trong việc** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: công thức đầy đủ và thử nghiệm sách nói</summary><div class="inner">

Temporal Motivation Theory là một khung để suy nghĩ hơn là một định luật đo được <a class="ev ev-mid" href="#r-steel2007" title="Steel 2007 · Bằng chứng vừa"></a>. Công thức đầy đủ là:

$$\text{Sức hút của một việc} = \frac{E \times V}{\Gamma \times D}$$

Γ là mức sốt ruột khi phải chờ của từng người. Γ gần như cố định ở mỗi người, nên khi so các lựa chọn của cùng một người thì có thể bỏ qua, chỉ cần so E × V / D.

Trong một thử nghiệm lớn hơn với 6.792 người, những người được tặng sách nói kèm lời khuyên chỉ nghe khi tập có khả năng đi tập mỗi tuần cao hơn 10–14% so với nhóm không được gì. Riêng lời khuyên chỉ nhích thêm được một chút so với chỉ tặng sách nói <a class="ev ev-mid" href="#r-kirgios2020" title="Kirgios 2020 · Bằng chứng vừa"></a>.

</div></details>

<h2 id="emotions"><span class="num">3</span>Cảm xúc là tín hiệu, không phải mệnh lệnh</h2>

Cảm xúc mạnh lên thì nên nghe theo hay dập đi? Không phải cả hai. Cảm xúc là một tín hiệu đáng nghe, và việc của mình là quyết định làm gì tiếp theo với tín hiệu ấy.

Hãy nghĩ tới con chó giữ nhà. Có người lạ tới cổng là chó sủa ầm lên. Chó chỉ làm đúng phận sự: có động thì báo. Nhưng không ai nghe chó sủa là hô hoán cả xóm bắt trộm. Người ta ra cổng xem ai tới, nhiều khi chỉ là anh shipper giao hàng.

Cảm xúc cũng giống tiếng chó sủa ấy: cách cơ thể báo rằng có điều gì quan trọng với mình đang xảy ra. Sợ báo nguy hiểm, giận báo mình bị xâm phạm, buồn báo một mất mát. Rắc rối chỉ đến theo hai kiểu. Hoặc ta để tiếng sủa quyết định thay mình, hô hoán cả xóm chỉ vì anh shipper. Hoặc ta bịt mõm con chó cho yên, tức là cố dập cảm xúc bằng những cách không hiệu quả. Vì vậy điều tiết cảm xúc không phải là dập tắt cảm xúc, mà là tác động lên **diễn biến tiếp theo** sau khi cảm xúc đã nổi lên.

Mô hình được dùng rộng rãi nhất chia việc điều tiết thành năm điểm can thiệp, theo đúng trình tự một cảm xúc hình thành <a class="ev ev-mid" href="#r-gross1998" title="Gross 1998 · Bằng chứng vừa"></a>:

```mermaid
flowchart LR
  S1["① Chọn tình huống<br/>(tránh hay bước vào)"] --> S2["② Sửa tình huống<br/>(đổi một chi tiết)"]
  S2 --> S3["③ Hướng chú ý<br/>(nhìn đi chỗ khác<br/>hoặc nhìn sâu vào)"]
  S3 --> S4["④ Đổi cách hiểu<br/>(reappraisal)"]
  S4 --> E(("Cảm xúc"))
  E --> S5["⑤ Điều chỉnh phản ứng<br/>(kìm nét mặt, thở,<br/>vận động)"]
```

Lấy một ví dụ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: bữa cơm giỗ ở quê, có một bác họ lần nào gặp cũng hỏi xoáy "bao giờ lấy vợ lấy chồng", "lương tháng được bao nhiêu". ① là chọn ở lại ăn cả bữa đông họ hàng, hay chỉ về thắp hương rồi ngồi với ông bà buổi sáng. ② là xuống bếp phụ một tay, hoặc ngồi mâm cuối với mấy đứa em, xa chỗ bác ngồi. ③ là để tâm vào ông bà và câu chuyện của cả nhà thay vì từng câu hỏi của bác. ④ là hiểu lại: "bác hỏi vì quan tâm theo kiểu người lớn ngày xưa, không phải để làm mình bẽ mặt". ⑤ là khi đã nóng mặt rồi thì hít một hơi chậm, cười trước rồi mới đáp.

Điểm ① và ② nằm *trước* khi cảm xúc kịp nổi lên. Đây chính là ý "sắp xếp tình huống" của [chương 2](#situation), áp dụng cho cảm xúc. Điểm ③ và ④ diễn ra trong đầu. Điểm ⑤ đến sau cùng, khi cảm xúc đã bùng lên.

Vậy cách nào thực sự đổi được cảm xúc? Một meta-analysis đã gom các thí nghiệm lại để đo xem từng cách thay đổi cảm xúc được đến đâu <a class="ev ev-high" href="#r-webb2012" title="Webb, Miles &amp; Sheeran 2012 · Bằng chứng mạnh"></a>:

```chart hbar
chiến lược,mức thay đổi cảm xúc
Perspective taking — nhìn từ góc người khác,0.45
Reappraisal tình huống — hiểu lại sự việc,0.36
Kìm biểu hiện ra ngoài,0.32
Distraction — chuyển chú ý,0.27
Reappraisal phản ứng — hiểu lại cảm xúc của mình,0.23
Kìm trải nghiệm bên trong,-0.04
Kìm suy nghĩ,-0.12
Tập trung vào chính cảm xúc,-0.26
```

<p class="src">Nguồn: Webb, Miles & Sheeran 2012, Psych Bull 138(4):775–808. Thanh dương = cảm xúc đổi theo hướng mong muốn, thanh âm = ngược lại. Để dễ hình dung: 0,2 là tác dụng nhỏ, 0,5 là tác dụng vừa.</p>

Biểu đồ cho thấy ba điều. Thứ nhất, **reappraisal**, tức đổi cách hiểu, nhất là nhìn sự việc từ góc của người khác, là nhóm hiệu quả nhất. Câu "bác hỏi vì quan tâm theo kiểu người lớn ngày xưa" ở ví dụ trên thuộc nhóm này. Thứ hai, cố **không cảm thấy** hoặc **không nghĩ tới** gần như vô dụng, thậm chí phản tác dụng. Ai từng nằm tự nhủ "thôi, đừng nghĩ chuyện ấy nữa, ngủ đi" đều biết kết quả. Thứ ba, cứ xoáy mãi vào cảm xúc của mình thì cảm xúc càng nặng thêm, như gãi vào vết muỗi đốt.

Riêng thanh "kìm biểu hiện" trông có vẻ ổn, nhưng cách này chỉ nhắm tới nét mặt bên ngoài: một nụ cười gượng trong khi bên trong vẫn sôi sục. Về lâu dài, người *quen* kìm nén lại cảm thấy ít cảm xúc tích cực hơn và **nhiều** cảm xúc tiêu cực hơn. Người quen reappraisal thì ngược lại: nhiều cảm xúc tích cực hơn và quan hệ tốt hơn <a class="ev ev-mid" href="#r-gross2003" title="Gross &amp; John 2003 · Bằng chứng vừa"></a>.

<details><summary>Đọc thêm: can thiệp sớm, và quy mô của meta-analysis</summary><div class="inner">

Học sinh tự đánh giá các cách can thiệp sớm (① và ②) hiệu quả hơn hẳn các cách đến sau, và khi được giao dùng thử thì đạt mục tiêu tốt hơn <a class="ev ev-mid" href="#r-duckworth2016" title="Duckworth 2016 · Bằng chứng vừa"></a>.

Meta-analysis ở biểu đồ gom 306 phép so sánh từ các thí nghiệm <a class="ev ev-high" href="#r-webb2012" title="Webb, Miles &amp; Sheeran 2012 · Bằng chứng mạnh"></a>.

Trong nghiên cứu về thói quen kìm nén, người quen reappraisal còn có well-being cao hơn <a class="ev ev-mid" href="#r-gross2003" title="Gross &amp; John 2003 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="naming"><span class="num">3.1</span>Gọi tên cảm xúc</h3>

Đặt tên cho cảm xúc thì được gì? Được hai thứ: cơ thể dịu xuống, và một cái tên chính xác chỉ ra việc cần làm.

Bác sĩ không chữa được cho một bệnh nhân chỉ nói mỗi câu "tôi thấy khó chịu". Phải hỏi: đau ở đâu, đau nhói hay âm ỉ, từ lúc nào. Cảm xúc cũng vậy. "Bực" là một lời than. "Mình thấy bị coi thường vì cả nhà bàn chuyện sửa nhà mà không ai hỏi ý mình" là một chẩn đoán, và từ chẩn đoán mới biết phải làm gì.

Chỉ cần đặt cảm xúc thành lời, gọi là **affect labeling**, cơ thể đã bớt căng. Trong một thí nghiệm, người sợ nhện được tiếp xúc với nhện, và một nhóm được hướng dẫn nói thành lời cảm xúc của mình. Sau một tuần, nhóm này có phản ứng sinh lý thấp hơn, dù mức sợ tự báo cáo không khác <a class="ev ev-mid" href="#r-kircanski2012" title="Kircanski 2012 · Bằng chứng vừa"></a>. Cơ thể bớt căng, dù trong đầu vẫn thấy sợ.

Gọi tên càng **chính xác** càng tốt. Người phân biệt được "thất vọng" khác "bị xúc phạm" khác "lo" ít rơi vào những cách đối phó có hại như uống say hay gây hấn khi căng thẳng <a class="ev ev-mid" href="#r-kashdan2015" title="Kashdan, Barrett &amp; McKnight 2015 · Bằng chứng vừa"></a>. Lý do dễ hiểu. "Thất vọng" cần mình chỉnh lại kỳ vọng, "bị xúc phạm" cần một cuộc nói chuyện, "lo" cần một kế hoạch. Còn một chữ "khó chịu" chung chung thì chỉ gợi ra một lối thoát chung chung: ly bia, màn hình điện thoại. Một câu hỏi để luyện <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: *"Chính xác thì mình đang cảm thấy gì, và cảm xúc ấy đang báo cho mình điều gì?"*

**Ví dụ đi từng bước: ngồi chờ bạn ở quán** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

- *Tình huống.* Bạn và một người bạn thân hẹn nhau mỗi tháng một bữa tối. Đi làm về, bạn vội chạy xe tới quán; người bạn tới trễ bốn mươi phút, chỉ kịp nhắn "kẹt việc".
- *Nếu chỉ dừng ở "bực".* Một chữ "bực" chỉ gợi ra một phản ứng chung chung: mặt nặng suốt bữa ăn, trả lời cộc lốc. Buổi tối hỏng, mà người kia cũng chẳng biết mình đã chạm vào chỗ nào.
- *Gọi tên chính xác.* Trong lúc chờ, tự hỏi câu ở trên. Có thể câu trả lời là "lo": dạo này bạn ấy làm thêm nhiều, mình sợ bạn ấy kiệt sức. Có thể là "thấy mình không được coi trọng": đây là lần thứ ba liền, trong khi lần nào mình cũng cố đến đúng giờ. Hai cái tên dẫn tới hai việc rất khác nhau. "Lo" thì hỏi han. "Không được coi trọng" thì cần một câu nói thẳng mà bình tĩnh: "Mình hơi buồn vì đây là lần thứ ba rồi. Mình tìm cách nào để giữ được buổi hẹn này không?"
- *Kết quả.* Gọi tên xong, cơ thể đã dịu bớt, giống nhóm người sợ nhện ở trên. Bạn bước vào bữa ăn với một câu nói cụ thể, thay vì một khuôn mặt nặng trịch.

<div class="callout data"><div class="ct">Tự kiểm tra: một tuần gọi tên cảm xúc</div>

Mỗi lần trong ngày thấy khó chịu rõ rệt, như khi bị chen ngang lúc xếp hàng, khi đọc một bình luận khó nghe trên mạng, khi người thân nói một câu chạm tự ái, hãy ghi vào điện thoại một dòng. Dòng ấy gồm giờ, chuyện gì, và **một từ chính xác** cho cảm xúc (thất vọng, xấu hổ, lo, bị coi thường, ghen tị, kiệt sức…). Tránh những từ chung chung như "bực", "chán". Cuối tuần đọc lại. Nếu cùng một từ lặp lại nhiều lần quanh cùng một chuyện, đó là tín hiệu đáng nghe: con chó cứ sủa về cùng một phía, nghĩa là ở đó có chuyện cụ thể cần xử lý. Nếu bạn khó tìm được từ nào khác ngoài "bực", thì đó chính là kỹ năng cần luyện thêm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div>

<details><summary>Đọc thêm: affect labeling trong não, và chi tiết thí nghiệm nhện</summary><div class="inner">

Khi đặt cảm xúc thành lời, phản ứng của amygdala và vùng limbic trong não dịu xuống <a class="ev ev-mid" href="#r-lieberman2007" title="Lieberman 2007 · Bằng chứng vừa"></a>.

Trong thí nghiệm với người sợ nhện, phản ứng sinh lý được đo qua mồ hôi trên da. Ai dùng càng nhiều từ chỉ nỗi sợ thì phản ứng càng giảm <a class="ev ev-mid" href="#r-kircanski2012" title="Kircanski 2012 · Bằng chứng vừa"></a>.

Những cách đối phó có hại mà người phân biệt cảm xúc tinh tế ít rơi vào còn gồm cả tự làm đau mình <a class="ev ev-mid" href="#r-kashdan2015" title="Kashdan, Barrett &amp; McKnight 2015 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="flexibility"><span class="num">3.2</span>Không có chiến lược tốt cho mọi lúc</h3>

Lúc nào cũng "nghĩ thoáng" có tốt không? Không. Hiểu lại sự việc giúp mình với chuyện không đổi được, nhưng với chuyện đổi được thì nghĩ thoáng chỉ là né việc phải làm.

```mermaid
flowchart TD
  Q{"Tình huống này<br/>mình có đổi được không?"}
  Q -->|"Đổi được"| A["Hành động lên chính tình huống<br/>① ② ở mô hình trên"]
  Q -->|"Không đổi được"| B["Đổi cách hiểu, chấp nhận,<br/>chuyển chú ý"]
  A --> R["Kết quả tốt hơn"]
  B --> R
  X["Làm ngược lại"] -.->|"reappraise điều đổi được<br/>→ cam chịu điều lẽ ra phải sửa"| W["Trầm cảm hơn"]
```

Trời mưa thì mặc áo mưa là đúng, vì chẳng ai cản được mưa. Nhưng nhà dột mà cứ đặt xô hứng mãi, không chịu gọi thợ lên sửa mái, thì chỉ là né việc. Reappraisal cũng thế. Với căng thẳng **không kiểm soát được**, người giỏi reappraisal ít trầm cảm hơn. Với căng thẳng **kiểm soát được**, cũng khả năng ấy lại đi kèm trầm cảm **nhiều** hơn <a class="ev ev-mid" href="#r-troy2013" title="Troy 2013 · Bằng chứng vừa"></a>. Có thể vì "nghĩ khác đi" đã chiếm chỗ của việc lẽ ra phải làm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Hai ví dụ cho thấy ranh giới ấy. Chủ nhà báo tăng tiền trọ vô lý: đây là chuyện *đổi được*. Hãy hỏi giá vài phòng quanh đó rồi quay lại nói chuyện, hoặc tính chuyện chuyển chỗ. Tự nhủ "thôi, coi như xui" lúc này là đặt xô hứng nước dột. Còn chuyến xe về quê ăn Tết bị huỷ vì bão, hay trận mưa lớn làm ngập cả con đường về nhà: đây là chuyện *không đổi được* <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Lúc ấy hiểu lại, chấp nhận, chuyển sự chú ý sang việc tiếp theo mới là cách đúng.

Cường độ cũng quan trọng. Người ta tự nhiên chọn reappraisal khi cảm xúc tiêu cực ở mức nhẹ, và chuyển sang distraction, tức chuyển sự chú ý đi chỗ khác, khi cảm xúc mạnh <a class="ev ev-mid" href="#r-sheppes2011" title="Sheppes 2011 · Bằng chứng vừa"></a>. Giữa cơn hoảng thì khó mà ngồi phân tích; đi ra ngoài một vòng trước đã.

Vì vậy câu hỏi then chốt luôn là câu ở đầu sơ đồ trên: *cái này mình có đổi được không?* [Chương 13](#adversity) dùng lại đúng câu hỏi ấy cho những biến cố lớn.

<div class="callout data"><div class="ct">Tự kiểm tra: đổi được hay không đổi được</div>

Chọn ba chuyện đang khiến bạn căng thẳng nhất tuần này, chẳng hạn một khoản tiền phải lo, chuyện sức khoẻ, một chuyện trong nhà. Viết cạnh mỗi chuyện: "đổi được", "đổi được một phần" hay "không đổi được", rồi viết cách bạn đang đối phó. Nếu ở một chuyện "đổi được" mà cách đối phó chỉ là "cố nghĩ thoáng", đó là chiếc xô hứng nước dột: hãy viết ra một hành động cụ thể sẽ làm trong tuần. Nếu ở một chuyện "không đổi được" mà bạn vẫn nghĩ đi nghĩ lại cách xoay chuyển, đó là lúc chuyển sang chấp nhận và đặt sự chú ý vào việc khác <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div>

<details><summary>Đọc thêm: nghiên cứu nhật ký và coping flexibility</summary><div class="inner">

Một nghiên cứu hỏi người tham gia mười lần mỗi ngày trong một tuần cũng ra cùng kết luận. Well-being cao hơn ở người dùng reappraisal **nhiều trong tình huống ít kiểm soát** và **ít trong tình huống kiểm soát được**. Còn chỉ nhìn tần suất reappraisal trung bình thì không nói lên gì <a class="ev ev-mid" href="#r-haines2016" title="Haines 2016 · Bằng chứng vừa"></a>.

Khả năng đổi chiến lược cho hợp tình huống có tên là coping flexibility. Gộp 329 mẫu với gần 59.000 người, coping flexibility đi cùng khả năng thích nghi tốt hơn. Mối liên hệ không lớn nhưng rõ ràng, và rõ hơn ở các nghiên cứu đo coping flexibility như "chiến lược khớp với tình huống" hoặc như niềm tin rằng mình ứng phó được <a class="ev ev-high" href="#r-cheng2014" title="Cheng, Lau &amp; Chan 2014 · Bằng chứng mạnh"></a>.

</div></details>

<h3 id="anger"><span class="num">3.3</span>Xả giận không làm nguôi giận</h3>

Xả giận ra có làm mình nguôi? Không, thường còn giận hơn. Thứ làm nguôi là hạ nhiệt cơ thể trước, nói chuyện sau.

Lời khuyên "cứ xả ra cho nhẹ" dựa trên hình ảnh nồi áp suất: hơi nén trong người, mở van ra thì hết. Hình ảnh ấy dễ tin, và là một trong những niềm tin sai dai dẳng nhất.

Bạn đoán xem: đang bị một người khiêu khích, được cho đấm bao cát thật mạnh trong khi nghĩ về người đó, sau đó bạn sẽ bớt giận hay giận hơn?

Giận hơn. Người vừa đấm bao cát vừa nghĩ về kẻ khiêu khích mình trở nên **giận hơn và hung hăng hơn**. Họ giận hơn cả người đấm bao cát mà nghĩ về chuyện tập cho khoẻ, và hơn người ngồi yên <a class="ev ev-mid" href="#r-bushman2002" title="Bushman 2002 · Bằng chứng vừa"></a>. Cơn giận không phải hơi nước trong nồi. Cơn giận giống một bài tập: mỗi lần sống lại cơn giận là một lần luyện cho mình giỏi giận hơn.

Hướng ngược lại mới hiệu quả. Các hoạt động **hạ mức kích động** như thở chậm, mindfulness, thư giãn giảm giận dữ và hung hăng khá rõ <a class="ev ev-high" href="#r-kjaervik2024" title="Kjærvik &amp; Bushman 2024 · Bằng chứng mạnh"></a>.

Áp vào đời thường: đọc một tin nhắn gay gắt trong nhóm chat gia đình lúc mười giờ đêm, đừng gõ trả lời ngay. Cũng đừng kể lể lại cả câu chuyện cho người khác nghe ba lần. Đi rót cốc nước, thở chậm vài phút, sáng mai hãy trả lời <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: quy mô các tổng hợp về hạ nhiệt và breathwork</summary><div class="inner">

Tổng hợp về các hoạt động hạ mức kích động gồm 154 nghiên cứu với hơn 10.000 người <a class="ev ev-high" href="#r-kjaervik2024" title="Kjærvik &amp; Bushman 2024 · Bằng chứng mạnh"></a>.

Riêng breathwork, tổng hợp 12 thử nghiệm ngẫu nhiên với 785 người cho thấy stress tự báo cáo giảm ở mức vừa phải. Phần lớn các nghiên cứu này có nguy cơ thiên lệch ở mức vừa <a class="ev ev-mid" href="#r-fincham2023" title="Fincham 2023 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="acceptance"><span class="num">3.4</span>Chấp nhận cảm xúc, và đừng đuổi theo hạnh phúc</h3>

Có nên cố đẩy cảm xúc xấu đi, hay cố bắt mình phải vui? Không nên. Người chấp nhận cảm xúc khó chịu của mình lại ít bị cảm xúc ấy dày vò hơn, còn người cố đuổi theo hạnh phúc dễ thất vọng hơn.

Người sa xuống vũng bùn ngoài ruộng hay được dặn một điều ngược bản năng: đừng giãy, càng giãy càng lún. Với cảm xúc tiêu cực, điều ngược bản năng ấy cũng đúng.

Có những người **chấp nhận** cảm xúc và suy nghĩ tiêu cực của mình: không phán xét chúng là xấu, không cố đuổi chúng đi. Họ lại có ít cảm xúc tiêu cực hơn khi gặp căng thẳng. Sáu tháng sau, sức khoẻ tâm lý của họ cũng tốt hơn <a class="ev ev-mid" href="#r-ford2018" title="Ford 2018 · Bằng chứng vừa"></a>. Khác biệt nằm ở lớp thứ hai. Lo lắng trước buổi phỏng vấn là một lớp. Lo lắng *vì thấy mình lo lắng*, kiểu "sao mình yếu thế", là lớp thứ hai, và chính lớp ấy mới kéo mình lún sâu.

Ngược lại, coi hạnh phúc là thứ phải đạt bằng được có thể phản tác dụng. Trong một thí nghiệm, người được dẫn dắt để đề cao hạnh phúc lại vui *ít hơn* khi xem một đoạn phim vui, vì thất vọng khi thấy mình không vui như kỳ vọng <a class="ev ev-mid" href="#r-mauss2011" title="Mauss 2011 · Bằng chứng vừa"></a>. Ai từng chuẩn bị cả tháng cho một chuyến du lịch "phải thật vui" rồi thấy hụt hẫng giữa chuyến thì hiểu cơ chế ấy. Gộp lại <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: cảm xúc khó chịu là một phần bình thường của đời sống, không phải bằng chứng rằng mình đang sống sai.

<details><summary>Đọc thêm: các nghiên cứu về chấp nhận và về việc đề cao hạnh phúc</summary><div class="inner">

Kết quả về chấp nhận lặp lại qua ba nghiên cứu: một khảo sát 1.003 người, một nghiên cứu trong phòng thí nghiệm với cùng một tình huống gây căng thẳng cho mọi người, và một nghiên cứu theo dõi dọc. Cả ba đều đo thói quen chấp nhận sẵn có của mỗi người, không can thiệp vào <a class="ev ev-mid" href="#r-ford2018" title="Ford 2018 · Bằng chứng vừa"></a>.

Nghiên cứu về đề cao hạnh phúc chỉ làm với phụ nữ. Ngoài thí nghiệm phim vui, nghiên cứu còn thấy người đề cao hạnh phúc nhiều hơn lại kém hạnh phúc hơn khi cuộc sống ít căng thẳng <a class="ev ev-mid" href="#r-mauss2011" title="Mauss 2011 · Bằng chứng vừa"></a>. Đây là hai nghiên cứu nhỏ, chỉ có nữ, nên chỉ nên xem là một lời cảnh báo.

</div></details>

<h3 id="distance"><span class="num">3.5</span>Nhìn mình như nhìn một người bạn</h3>

Vì sao khuyên người khác thì sáng suốt, mà tới chuyện mình thì rối như tơ vò? Vì mình đứng quá gần. Lùi ra một bước, nghĩ về chuyện của mình như người ngoài nhìn vào, là lấy lại được sự sáng suốt ấy.

Một người bạn kể rằng bố vừa chê mâm cỗ bạn ấy nấu ngay trước mặt họ hàng. Bạn bình tĩnh khuyên: "Chắc bố không có ý gì đâu, cậu hỏi lại xem bố chê món nào." Tháng sau chuyện y hệt xảy ra với chính bạn, và cả buổi tối bạn trằn trọc nghĩ mình chẳng bao giờ làm vừa lòng ai <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Nghiên cứu xác nhận nghịch lý ấy. Người ta suy luận khôn ngoan hơn khi nghĩ về vấn đề của người khác: thừa nhận giới hạn hiểu biết của mình, xét nhiều góc nhìn, tìm cách dung hoà. Khi được hướng dẫn **lùi ra xa**, nghĩ về chuyện của mình như người ngoài nhìn vào, khoảng cách ấy biến mất <a class="ev ev-mid" href="#r-grossmann2014" title="Grossmann &amp; Kross 2014 · Bằng chứng vừa"></a>. Ông bà mình gọi đúng tên chuyện này: chuyện người thì sáng, chuyện mình thì quáng. Sự khôn ngoan không mất đi; chỉ là đứng quá gần thì không nhìn thấy, như dí tờ giấy sát mắt thì chẳng đọc được chữ nào.

Cách đơn giản nhất để lùi ra là đổi cách xưng hô với chính mình. Khi tự nói với mình bằng **tên mình** hoặc ngôi thứ hai thay vì "tôi", người ta bớt lo hơn và làm tốt hơn trong những lúc căng thẳng, như nói trước đám đông <a class="ev ev-mid" href="#r-kross2014" title="Kross 2014 · Bằng chứng vừa"></a>. Ví dụ: thay vì "Sao mình lại làm hỏng chuyện này?", hãy gọi chính tên mình ra mà hỏi, chẳng hạn với một người tên Minh: "Minh, chuyện gì đã thật sự xảy ra? Nếu đứa bạn thân gặp đúng chuyện này, Minh sẽ khuyên nó thế nào?".

<details><summary>Đọc thêm: chi tiết hai nghiên cứu</summary><div class="inner">

Nghiên cứu của Grossmann & Kross gồm ba thí nghiệm với 693 người. Hiệu quả của việc lùi ra thấy ở cả nhóm 20–40 tuổi lẫn nhóm 60–80 tuổi <a class="ev ev-mid" href="#r-grossmann2014" title="Grossmann &amp; Kross 2014 · Bằng chứng vừa"></a>.

Trong nghiên cứu về cách xưng hô, các tình huống căng thẳng gồm lần đầu ra mắt người lạ và nói trước đám đông. Người tự gọi tên mình còn nhìn tình huống như một thử thách chứ không phải một mối đe doạ <a class="ev ev-mid" href="#r-kross2014" title="Kross 2014 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="avoidance"><span class="num">3.6</span>Nhiều hành vi né tránh thực ra là điều tiết cảm xúc</h3>

Mình né một việc có phải vì lười? Thường là không. Thứ mình né là cảm giác khó chịu mà việc ấy gợi ra, nên cách gỡ là khiến bước đầu tiên bớt khó chịu, không phải tự trách.

Mẹ nhờ bạn lo giúp thủ tục làm lại giấy tờ nhà, việc bạn chưa làm bao giờ và chẳng biết bắt đầu từ đâu <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Bạn mở tờ giấy mẹ ghi ra, đọc hai dòng, rồi thấy mình đang dọn lại tủ quần áo, sau đó xem một video ngắn, rồi pha thêm ly trà. Trông như lười. Nhưng thứ bạn tránh không phải là thủ tục, mà là cảm giác mơ hồ, lo lắng mà việc ấy gợi ra. Mỗi lần né, cảm giác ấy dịu đi một chút. Chính chút dễ chịu tức thời ấy khiến mình né thêm lần nữa.

Đặt hai chương cạnh nhau sẽ thấy rõ: rất nhiều hành vi trông như "lười" thực ra là một cách để mình dễ chịu hơn ngay lúc đó. Trì hoãn là đặt cảm giác dễ chịu trước mắt lên trên mục tiêu dài hạn, gọi là **mood repair** <a class="ev ev-mid" href="#r-sirois2013" title="Sirois &amp; Pychyl 2013 · Bằng chứng vừa"></a>. Người ta không trốn việc; người ta trốn **cảm giác** mà việc gợi ra.

Vậy muốn bắt đầu một việc mình ngại, hãy khiến **bước đầu tiên** nhỏ hơn, rõ hơn, dễ chịu hơn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Với thủ tục kia, bước đầu có thể chỉ là gọi cho một người quen từng làm việc này, hỏi xem cần mang những giấy gì. Sự mơ hồ tan đi khá nhiều khi đã có một thứ cụ thể trước mắt.

Sau thất bại, tử tế với chính mình không khiến mình buông thả, mà còn *tăng* động lực sửa sai. Sau một bài kiểm tra trượt, người được hướng dẫn **self-compassion** đã dành nhiều thời gian ôn hơn <a class="ev ev-mid" href="#r-breines2012" title="Breines &amp; Chen 2012 · Bằng chứng vừa"></a>. Lời tự trách nghe có vẻ nghiêm khắc, nhưng lại khiến việc kia càng đáng sợ hơn, thêm một lý do để né.

<details><summary>Đọc thêm: thí nghiệm "tâm trạng đóng băng"</summary><div class="inner">

Người đang buồn mà được dẫn dắt tin rằng tâm trạng của mình đã bị "đóng băng", có làm gì cũng không đổi được, thì không còn trì hoãn kiểu tìm vui trước một việc khó chịu nữa <a class="ev ev-mid" href="#r-tice2001" title="Tice, Bratslavsky &amp; Baumeister 2001 · Bằng chứng vừa"></a>. Khi việc né không còn mang lại chút dễ chịu nào, người ta thôi né.

</div></details>

<div class="recall">

**Câu hỏi nhớ lại — Phần I.** Trả lời trong đầu trước, rồi mới mở đáp án.

<details><summary>Người có self-control tốt khác người khác ở điểm nào?</summary><div class="inner">

Họ gặp ít cám dỗ hơn và ít phải cưỡng lại hơn (Hofmann 2012; thêm Milyavskaya & Inzlicht 2017, de Ridder 2012, Galla & Duckworth 2015 ở phần Đọc thêm của §2.4). Giống người không mua bánh về nhà thay vì người để hộp bánh trên bàn rồi cố nhịn. Vì vậy đòn bẩy chính là sắp xếp tình huống, không phải gồng ý chí.

</div></details>

<details><summary>Vì sao kế hoạch viết lúc tỉnh táo hay thất bại, và sửa thế nào?</summary><div class="inner">

Hot–cold empathy gap: lúc "cold" ta đánh giá thấp sức chi phối của trạng thái "hot" (Loewenstein; Read & van Leeuwen: 62–82% đổi sang món không lành mạnh). Sửa bằng cách lập kế hoạch theo dữ liệu những lần trước và thiết kế việc cho lúc mệt: nhỏ, rõ, chuẩn bị sẵn.

</div></details>

<details><summary>Lỡ một ngày có làm hỏng habit không? Nên thưởng cho cái gì?</summary><div class="inner">

Không (Lally 2010). Trong nghiên cứu ở phòng gym thử cùng lúc hàng chục chương trình, cách hiệu quả nhất là thưởng nhỏ cho việc quay lại sau một buổi lỡ (Milkman 2021).

</div></details>

<details><summary>Khi nào reappraisal đi kèm kết quả tốt, khi nào thì ngược lại?</summary><div class="inner">

Khả năng reappraisal đi kèm ít trầm cảm hơn khi tình huống không kiểm soát được, nhưng nhiều hơn khi tình huống kiểm soát được. Có thể vì "nghĩ khác đi" đã thay cho hành động, như đặt xô hứng nước dột thay vì sửa mái (Troy 2013; Haines 2016). Câu hỏi gốc: cái này mình có đổi được không?

</div></details>

<details><summary>Đang rất giận, nên làm gì trước?</summary><div class="inner">

Hạ mức kích động trước (thở chậm, thư giãn, mindfulness), nói chuyện sau. Trút giận bằng cách sống lại cơn giận chỉ làm giận thêm (Bushman 2002; Kjærvik & Bushman 2024).

</div></details>

</div>


<h2 id="part-2" class="part">Phần II — Sống với người khác</h2>

<h2 id="impressions"><span class="num">4</span>Người khác nhìn mình thế nào</h2>

Đối nhân xử thế có phải là một bộ kỹ năng khéo léo phải học cho thuộc? Phần lớn là không. Phần lớn là sửa hai sai lầm mà ai cũng mắc đi mắc lại: ta **tưởng mình đọc được** người khác nghĩ gì, và ta **dự đoán quá bi quan** về cách người khác phản ứng với mình.

Ta giống người chạy xe máy trong một khu lạ mà không chịu hỏi đường: đoán hướng thì lệch, lại còn tự doạ mình rằng đường phía trước đang ngập, đang kẹt. Sửa được hai chỗ sai ấy là gỡ được rất nhiều chuyện <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="character"><span class="num">4.1</span>Điều người ta để ý nhất là tính cách</h3>

Người khác nhớ gì về mình lâu nhất? Không phải mình khéo hay vui tính, mà là mình **có đáng tin hay không**.

Thử nghĩ về một người bạn học cũ mà bạn đã năm năm không gặp. Điều đầu tiên hiện lên trong đầu thường không phải người ấy kể chuyện có duyên hay không. Mà là "người ấy nói gì làm nấy", hoặc "cẩn thận, người ấy hay nhận công của người khác".

Nghiên cứu xác nhận cảm giác ấy. Khi hình thành ấn tượng về một người, ta xem người ấy có trung thực, công bằng, đáng tin không. Thông tin về **tính cách đạo đức** này nặng ký hơn thông tin về việc người ấy dễ mến hay ấm áp <a class="ev ev-mid" href="#r-goodwin2014" title="Goodwin, Piazza &amp; Rozin 2014 · Bằng chứng vừa"></a>. Một lần lặng lẽ trả lại tiền khi người bán thối nhầm, một lần giữ lời dù không ai kiểm tra: những chuyện ấy đọng lại lâu hơn mọi câu đùa. [Chương 5](#apology) sẽ cho thấy mặt còn lại: lòng tin mất vì thiếu chính trực thì khó lấy lại hơn lòng tin mất vì thiếu năng lực.

<details><summary>Đọc thêm: cáo phó</summary><div class="inner">

Ngay cả trong các bài cáo phó, phẩm chất đạo đức vẫn chiếm ưu thế <a class="ev ev-mid" href="#r-goodwin2014" title="Goodwin, Piazza &amp; Rozin 2014 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="ask"><span class="num">4.2</span>Đừng đoán, hãy hỏi</h3>

Muốn biết người khác nghĩ gì, "đặt mình vào vị trí họ" có đủ không? Không. Tưởng tượng không giúp đoán đúng hơn; hỏi và nghe thì có.

Sắp tới sinh nhật mẹ, bạn ngồi cả buổi tối "đặt mình vào vị trí mẹ" để đoán xem mẹ thích quà gì, rồi chọn một chiếc áo len, khá tự tin. Hôm sau, hỏi bâng quơ đứa em mới biết điều mẹ mong là cả nhà về ăn một bữa cơm đông đủ. Cả buổi tối tưởng tượng thua một câu hỏi.

Qua nhiều thí nghiệm, người ta được hướng dẫn **tưởng tượng** góc nhìn của người khác, gọi là **perspective-taking**. Kết quả là họ không đoán đúng hơn suy nghĩ, cảm xúc, sở thích của người kia; nhìn chung còn đoán kém đi. Điều giúp đoán đúng hơn là **hỏi và nghe**, gọi là **perspective-getting** <a class="ev ev-mid" href="#r-eyal2018" title="Eyal, Steffel &amp; Epley 2018 · Bằng chứng vừa"></a>. Lý do khá dễ thấy: khi tưởng tượng, ta chỉ có thể ghép hình người kia từ những mảnh của chính mình. Giống nêm nồi canh cho cả nhà theo đúng khẩu vị của mình: mình thấy vừa, người khác lại thấy mặn.

Hỏi còn khiến mình được quý mến hơn. Trong các cuộc trò chuyện thật, người hỏi nhiều hơn được người kia quý hơn, nhất là khi **hỏi tiếp** về điều người kia vừa nói, kiểu "rồi sao nữa?", "lúc đó anh thấy thế nào?". Câu hỏi tiếp cho thấy mình đang thật sự nghe <a class="ev ev-mid" href="#r-huang2017" title="Huang 2017 · Bằng chứng vừa"></a>. Ở nhà cũng vậy: trước khi đoán "chắc bố mẹ giục về quê sớm chỉ để khoe với họ hàng", hãy hỏi thẳng: "Bố mẹ muốn con về sớm là để lo việc gì ạ?" <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: quy mô nghiên cứu, và lợi ích của lắng nghe</summary><div class="inner">

Kết quả về perspective-taking đến từ 25 thí nghiệm. Người tưởng tượng góc nhìn đôi lúc lại tự tin hơn, dù không đoán đúng hơn <a class="ev ev-mid" href="#r-eyal2018" title="Eyal, Steffel &amp; Epley 2018 · Bằng chứng vừa"></a>.

Lắng nghe thật chú tâm gắn với hiệu quả công việc, khả năng lãnh đạo, niềm tin và well-being <a class="ev ev-mid" href="#r-kluger2022" title="Kluger &amp; Itzchakov 2022 · Bằng chứng vừa"></a>. Như [chương 5](#disagree) sẽ cho thấy, lắng nghe còn làm dịu cả bất đồng.

</div></details>

<h3 id="expectation-gap"><span class="num">4.3</span>Người khác quý mình hơn mình tưởng</h3>

Ngại nhắn tin, ngại nhờ vả, có phải vì người ta thấy phiền thật? Thường là không. Ta đoán người khác sẽ khó chịu nhiều hơn hẳn so với thực tế, nên cứ chủ động thêm một chút.

Bạn muốn nhắn hỏi thăm một người bạn đại học lâu không liên lạc, rồi lại thôi: "Giờ nhắn đột ngột, chắc nó thấy lạ." Bạn muốn nhờ anh hàng xóm rành xe máy xem giúp chiếc xe đề mãi không nổ, rồi lại tự loay hoay thêm một tiếng: "Anh ấy bận, nhờ thì phiền." Những cuộc trò chuyện chưa bao giờ diễn ra ấy đều bắt nguồn từ cùng một dự đoán.

Một chuỗi nghiên cứu, mỗi nghiên cứu một tình huống, cho cùng một kết quả: ta tưởng chủ động với người khác sẽ ngượng ngùng, phiền phức **hơn nhiều** so với thực tế.

| Việc mình ngại | Điều mình dự đoán | Điều thật sự xảy ra | Nguồn |
|---|---|---|---|
| Nhờ giúp đỡ | Bị từ chối | Ta đánh giá thấp khả năng người khác đồng ý, có khi tới 50% | <a class="ev ev-mid" href="#r-flynn2008" title="Flynn &amp; Lake 2008 · Bằng chứng vừa"></a> |
| Viết thư cảm ơn | Người nhận thấy ngượng | Người nhận bất ngờ và vui hơn, ít ngượng hơn so với dự đoán | <a class="ev ev-mid" href="#r-kumar2018" title="Kumar &amp; Epley 2018 · Bằng chứng vừa"></a> |
| Khen một người | Họ sẽ thấy ngượng, không vui bằng thực tế | Họ vui hơn và ít ngượng hơn mình nghĩ | <a class="ev ev-mid" href="#r-zhao2021" title="Zhao &amp; Epley 2021 · Bằng chứng vừa"></a> |
| Từ chối một lời mời | Người mời giận, nghĩ mình không quan tâm | Hậu quả nhẹ hơn nhiều so với mình lo | <a class="ev ev-mid" href="#r-givi2024" title="Givi 2024 · Bằng chứng vừa"></a> |
| Nói thật lòng một điều khó nói | Người kia phản ứng tệ | Dễ chịu hơn, gắn kết hơn, ít tổn hại hơn dự đoán | <a class="ev ev-mid" href="#r-levine2018" title="Levine &amp; Cohen 2018 · Bằng chứng vừa"></a> |

Vì sao năm tháng trôi qua mà sai lầm này vẫn không tự sửa? Sơ đồ dưới là một cách giải thích <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>, ghép từ các nghiên cứu trên:

```mermaid
flowchart LR
  A["① Dự đoán bi quan<br/>'họ sẽ thấy phiền'"] --> B["② Né tránh<br/>không hỏi, không nhờ,<br/>không nói thật"]
  B --> C["③ Không bao giờ thấy<br/>phản ứng thật của họ"]
  C --> D["④ Dự đoán bi quan<br/>được giữ nguyên"]
  D --> A
  B -.->|"⑤ thử một lần"| E["Phản ứng thật<br/>thường tốt hơn dự đoán"]
  E -.->|"⑥ thực tế sửa lại dự đoán"| A
```

Vòng ①–④ cứ thế lặp mãi, như đứa trẻ sợ ma không bao giờ dám bật đèn lên xem góc nhà tối có gì. Chính việc né tránh đã giấu đi thứ bằng chứng có thể xoá tan nỗi sợ. Chỉ cần thử một lần (⑤) là thấy được phản ứng thật, và phản ứng ấy sửa lại dự đoán (⑥). Tin nhắn hỏi thăm người bạn cũ thường nhận về một câu "Trời, lâu quá! Dạo này sao rồi?", và lần sau nhắn sẽ dễ hơn.

**Ví dụ đi từng bước: nhờ anh hàng xóm xem chiếc xe** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

- *Tình huống.* Sáng Chủ nhật, chiếc xe máy đề mãi không nổ, bạn đã loay hoay một tiếng. Anh hàng xóm rành xe đang tưới cây trước cửa, trông đang bận.
- *Cơ chế dự đoán gì.* Trong đầu vang lên: "nhờ thì phiền, anh ấy sẽ khó chịu hoặc từ chối". Bảng trên cho thấy dự đoán kiểu này thường bi quan quá mức. Mà vì ngại nên bạn chưa từng nhờ, cũng chưa có dữ liệu nào để sửa dự đoán ấy, đúng vòng ①–④.
- *Làm gì.* Thu nhỏ lời nhờ cho dễ gật đầu: "Anh ơi, lúc nào anh rảnh năm phút xem giúp em chiếc xe được không? Em đã thử đạp nổ và xem xăng rồi." Trước khi gửi, ghi nhanh vào điện thoại: mình đoán khả năng anh ấy đồng ý là bao nhiêu phần trăm.
- *Đọc kết quả.* Dù anh ấy đồng ý ngay, hẹn lúc khác hay từ chối, bạn đã có một điểm dữ liệu thật thay cho một nỗi sợ. Lặp lại vài lần với vài người, con số mình đoán sẽ tự dịch lại gần thực tế. Đó chính là bước ⑥.

Hai lưu ý để không hiểu lầm. Đây là xu hướng trung bình, nên đừng bỏ qua tín hiệu thật từ một người cụ thể. Và "thật lòng" ở đây là chia sẻ, góp ý chân thành, không phải nói thẳng một cách tàn nhẫn; [chương 5](#conflict) bàn chuyện nói thế nào.

<div class="callout data"><div class="ct">Tự kiểm tra: dự đoán so với thực tế</div>

Trong một tuần, chọn ba việc nhỏ mình hay ngại ở bảng trên: nhờ một người quen giúp một việc nhỏ, nhắn cảm ơn cụ thể một người, khen thật lòng một người trong nhà một điều ít khi nói ra. Trước mỗi việc, ghi điểm dự đoán từ 1 (họ sẽ khó chịu) tới 5 (họ sẽ rất vui); làm xong, ghi điểm cho phản ứng thật. Nếu điểm thật cao hơn điểm dự đoán ở hầu hết các lần, nỗi ngại của bạn đang dựa trên một lời đoán sai, như con đường tưởng ngập mà hoá ra khô ráo, và tuần sau có thể chủ động hơn. Nếu với một người cụ thể mà điểm thật lần nào cũng thấp, đó là tín hiệu thật về riêng người ấy, không phải về mọi người <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

</div>

<details><summary>Đọc thêm: ba nghiên cứu nữa, và chuyện cô đơn</summary><div class="inner">

| Việc mình ngại | Điều mình dự đoán | Điều thật sự xảy ra | Nguồn |
|---|---|---|---|
| Bắt chuyện với người lạ trên tàu, xe | Chuyến đi khó chịu hơn | Chuyến đi dễ chịu hơn, không kém năng suất | <a class="ev ev-mid" href="#r-epley2014" title="Epley &amp; Schroeder 2014 · Bằng chứng vừa"></a> |
| Một cuộc trò chuyện vừa xong | Người kia không thích mình nhiều đến thế | Người kia thích mình hơn mình nghĩ — "liking gap" | <a class="ev ev-mid" href="#r-boothby2018" title="Boothby 2018 · Bằng chứng vừa"></a> |
| Hỏi chuyện sâu thay vì chuyện xã giao | Sẽ ngượng | Bớt ngượng hơn dự đoán, gắn kết và vui hơn | <a class="ev ev-mid" href="#r-kardas2022" title="Kardas, Kumar &amp; Epley 2022 · Bằng chứng vừa"></a> |

Vòng ①–④ cũng giải thích một phát hiện về cô đơn. Trong các thử nghiệm ngẫu nhiên, can thiệp hiệu quả nhất không phải tạo thêm cơ hội gặp gỡ, mà là **sửa những lối nghĩ sai về các mối quan hệ**, kiểu "người ta không muốn gặp mình" <a class="ev ev-mid" href="#r-masi2011" title="Masi 2011 · Bằng chứng vừa"></a>. Người cô đơn thường không thiếu chỗ để đến; họ tin rằng mình có đến thì cũng chẳng ai muốn tiếp.
</div></details>

<h2 id="conflict"><span class="num">5</span>Xung đột, xin lỗi, tha thứ và ranh giới</h2>

Xung đột có phải dấu hiệu một mối quan hệ đang hỏng? Không. Hai người sống chung một nhà hay chơi thân với nhau thì sớm muộn cũng có lúc muốn hai thứ khác nhau. Người muốn về quê ăn Tết, người muốn đi du lịch; người muốn lấy tiền thưởng cuối năm sửa nhà, người muốn gửi tiết kiệm. Điều quyết định là **hai người đi qua xung đột ra sao**.

Chương này gồm bốn phần: thái độ khi bất đồng, cách nói và nghe, cách sửa sai khi mình có lỗi, và cách tha thứ mà không đánh mất mình.

<h3 id="dual-concern"><span class="num">5.1</span>Mềm với người, vững với điều mình cần</h3>

Trong bất đồng, nên nhường hay nên giữ? Cả hai cùng lúc: quan tâm thật đến người kia, và giữ vững điều mình cần.

```mermaid
quadrantChart
  title Hai trục trong một cuộc bất đồng
  x-axis "Ít quan tâm đến người kia" --> "Quan tâm thật đến người kia"
  y-axis "Dễ buông điều mình cần" --> "Giữ vững điều mình cần"
  quadrant-1 "Cùng giải quyết vấn đề"
  quadrant-2 "Áp đảo"
  quadrant-3 "Né tránh"
  quadrant-4 "Nhượng bộ"
```

Hình trên là mô hình **dual concern**: một trục là mức mình quan tâm đến người kia, trục còn lại là mức mình giữ vững điều mình cần. Lấy một cảnh quen <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: người bạn thân hỏi vay một khoản lớn để mở quán ăn, trong khi đó là khoản bạn dành dụm mấy năm cho một việc riêng.

- **Nhượng bộ** (dưới, phải): "Ừ, để mình lo." Không khí êm, nhưng mấy tháng sau việc riêng của bạn phải gác lại, và cứ gặp bạn ấy là thấy ấm ức.
- **Áp đảo** (trên, trái): "Không, mở quán kiểu đó thì sớm muộn cũng lỗ." Bạn giữ được tiền, nhưng mất lòng bạn.
- **Né tránh** (dưới, trái): im lặng, không trả lời tin nhắn, để mọi chuyện tự trôi.
- **Cùng giải quyết vấn đề** (trên, phải): "Mình muốn cậu mở được quán. Khoản ấy mình đã để dành cho một việc riêng nên không đưa hết được. Mình cho vay một phần, rồi hai đứa ngồi tính lại xem có cách nào bớt vốn không?"

Người có động cơ **vì cả hai bên** ít gây hấn hơn, giải quyết vấn đề nhiều hơn và đạt kết quả chung tốt hơn, **nhưng chỉ khi họ đồng thời không dễ nhượng bộ** <a class="ev ev-high" href="#r-dedreu2000" title="De Dreu, Weingart &amp; Kwon 2000 · Bằng chứng mạnh"></a>. Tốt bụng mà dễ buông thì rơi vào góc "nhượng bộ": người kia được, mình mất, và vấn đề thật vẫn nằm nguyên đó. Giữ vững mà không quan tâm thì rơi vào góc "áp đảo". Góc tốt nhất đòi hỏi cả hai cùng lúc, như câu cuối ở trên: *"Mình muốn chuyện này ổn cho cả hai, và đây là điều mình thật sự cần."*

Cảm giác **công bằng** cũng chi phối xung đột. Người ta xét công bằng không chỉ ở kết quả, mà cả ở cách đi tới kết quả, ở việc mình có được tôn trọng và được giải thích đầy đủ hay không <a class="ev ev-high" href="#r-colquitt2001" title="Colquitt 2001 · Bằng chứng mạnh"></a>. Thử hình dung hai lần cùng xin bố mẹ một khoản để đi học thêm, và cùng bị từ chối <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Lần thứ nhất, bố gạt đi một câu "không là không". Lần thứ hai, bố mẹ ngồi xuống, nghe bạn trình bày, nói rõ năm nay nhà đang phải lo khoản gì, và hẹn sang năm tính lại. Kết quả như nhau, nhưng cảm giác khác hẳn. Vậy khi phải đưa ra một quyết định chẳng ai vui, **cách** đưa ra vẫn ảnh hưởng rõ tới việc người kia có chấp nhận hay không. Hãy cho người kia được nói, giải thích lý do, và giữ tôn trọng <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<details><summary>Đọc thêm: quy mô nghiên cứu, và bốn loại công bằng</summary><div class="inner">

Kết quả về động cơ vì cả hai bên đến từ tổng hợp 28 nghiên cứu về thương lượng <a class="ev ev-high" href="#r-dedreu2000" title="De Dreu, Weingart &amp; Kwon 2000 · Bằng chứng mạnh"></a>.

Tổng hợp 183 nghiên cứu (Colquitt 2001, nguồn ở trên) cho thấy con người phân biệt bốn loại công bằng, và mỗi loại tác động riêng: kết quả có công bằng không (distributive), cách đi đến kết quả có công bằng không (procedural), mình có được đối xử tôn trọng không (interpersonal), và mình có được giải thích đầy đủ không (informational).

</div></details>

<h3 id="disagree"><span class="num">5.2</span>Khi bất đồng: hạ nhiệt, rồi lắng nghe</h3>

Đang bất đồng thì làm gì trước? Hạ nhiệt trước, rồi để người kia nói hết, sau đó mới nói điều mình cần.

Xả giận không làm nguôi, có khi còn khiến giận thêm; hạ mức kích động mới làm dịu được ([chương 3](#anger)). Vì vậy những cuộc nói chuyện khó nên để **sau** khi cả hai đã nguôi. Ông bà mình nói "giận quá mất khôn": chuyện với người thân nên nói lúc đã nguội.

Khi người nói được lắng nghe thật chú tâm trong lúc bất đồng, họ bớt phòng thủ, thấy gắn kết hơn, và quan điểm của họ bớt cực đoan <a class="ev ev-mid" href="#r-itzchakov2024" title="Itzchakov 2024 · Bằng chứng vừa"></a>. Khi được lắng nghe, người ta bớt cần phải thắng. Có thể hình dung như hai người kéo co: khi một bên nới tay để nghe, bên kia cũng không còn gì để giật.

Một trình tự gợi ý <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: hạ nhiệt → để người kia nói hết và nhắc lại điều mình hiểu → nói điều mình cần → cùng tìm cách đáp ứng cả hai.

**Ví dụ đi từng bước: sáng thứ Bảy** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

- *Tình huống.* Hai người sống chung, ngày thường ai cũng đi làm tới tối mới về, nên cuối tuần là lúc hiếm hoi được ở bên nhau. Giờ bạn muốn đăng ký một lớp học bơi vào sáng thứ Bảy, ba tiếng mỗi buổi. Vừa nhắc tới, người kia nói: "Vậy là thứ Bảy nào cũng mất buổi sáng à? Cả tuần mình chỉ có cuối tuần với nhau thôi mà." Giọng cả hai bắt đầu cao lên.
- *Hạ nhiệt.* "Mình để tối nay bàn tiếp nhé, giờ cả hai đang mệt." Câu này không phải né tránh, vì đã hẹn giờ quay lại.
- *Nghe và nhắc lại.* Tối đó, để người kia nói hết, rồi nhắc lại: "Tức là sợ cuối tuần bị cắt mất, trong khi ngày thường hai đứa đã ít gặp nhau, đúng không?" Khi người kia gật đầu, cuộc nói chuyện đã nhẹ đi một nửa. Người ấy không còn phải cố giành lấy sự thấu hiểu nữa.
- *Nói điều mình cần.* "Mình thật sự muốn biết bơi cho đàng hoàng, và mình chỉ học đều khi có lớp cố định."
- *Cùng tìm cách.* Có thể là một lớp vào một buổi tối trong tuần thay vì sáng thứ Bảy. Hoặc giữ lớp thứ Bảy nhưng buổi chiều hai người đi một chỗ chưa từng đến. Không ai thắng trọn, nhưng điều cả hai cần đều có chỗ. Đây là góc "cùng giải quyết vấn đề" ở [§5.1](#dual-concern).

<details><summary>Đọc thêm: chi tiết nghiên cứu về lắng nghe</summary><div class="inner">

Kết quả về lắng nghe đến từ bốn thí nghiệm. Người được lắng nghe còn tự hiểu mình hơn. Quan điểm bớt cực đoan cả theo tự cảm nhận lẫn theo cách đo <a class="ev ev-mid" href="#r-itzchakov2024" title="Itzchakov 2024 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="apology"><span class="num">5.3</span>Khi mình sai: xin lỗi thế nào</h3>

Làm sai rồi, xin lỗi thế nào để lấy lại lòng tin? Nói rõ mình đã làm gì, nhận trách nhiệm không kèm "nhưng", thừa nhận tác động lên người kia, và nói mình sẽ sửa thế nào.

Hai chuyện cùng làm mất lòng tin, nhưng không giống nhau. Chuyện thứ nhất: bạn nhận nấu nồi canh cho mâm cỗ giỗ, lỡ tay nêm mặn quá, phải đổ đi. Chuyện thứ hai: mẹ hỏi đã đóng tiền điện chưa, bạn bảo rồi, trong khi thật ra quên chưa đóng, tới lúc bị cắt điện mới lộ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Chuyện đầu cho thấy bạn còn thiếu kỹ năng. Chuyện sau cho thấy lời bạn nói không đáng tin.

Lòng tin mất vì thiếu năng lực thì xin lỗi có thể lấy lại. Lòng tin mất vì thiếu chính trực thì **rất khó lấy lại**, vì nhận lỗi lúc ấy là thừa nhận một khiếm khuyết đạo đức <a class="ev ev-mid" href="#r-kim2004" title="Kim 2004 · Bằng chứng vừa"></a>. Ngoài chợ, lỡ bán cho khách một mớ rau héo thì đổi mớ khác là xong, khách vẫn quay lại. Còn bị phát hiện bán hàng giả thì mất khách luôn. Nên hãy giữ gìn lòng tin ngay từ đầu.

Khi đã sai, lời xin lỗi càng đầy đủ các thành phần thì càng hiệu quả <a class="ev ev-mid" href="#r-lewicki2016" title="Lewicki, Polin &amp; Lount 2016 · Bằng chứng vừa"></a>. Bốn thành phần <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span> là bốn việc ở đầu mục. Với nồi canh mặn: "Con nêm tay quá nên hỏng cả nồi canh, mâm cỗ thiếu món mà mẹ phải chạy ra chợ mua đồ nấu lại. Lỗi là của con. Lần sau con nêm từng chút một, nếm xong nhờ mẹ nếm lại rồi mới tắt bếp." Hãy so với câu "Con xin lỗi, nhưng hôm đó bếp đông người quá": câu này đẩy một nửa lỗi sang hoàn cảnh, và người nghe nhận ra ngay.

<details><summary>Đọc thêm: thí nghiệm xin lỗi và phủ nhận</summary><div class="inner">

Hai thí nghiệm kinh điển so sánh xin lỗi với phủ nhận sau hai loại **cáo buộc** vi phạm, khi người quan sát chưa biết người kia có lỗi thật hay không <a class="ev ev-mid" href="#r-kim2004" title="Kim 2004 · Bằng chứng vừa"></a>:

| | Vi phạm về **năng lực** (làm hỏng vì thiếu kỹ năng) | Vi phạm về **chính trực** (làm sai vì không trung thực) |
|---|---|---|
| Lấy lại lòng tin tốt hơn bằng | Xin lỗi, nhận trách nhiệm | Phủ nhận — nhưng **chỉ khi thật sự vô can** |
| Vì sao | Nhận lỗi năng lực không nói lên mình là người xấu | Nhận lỗi chính trực là thừa nhận một khiếm khuyết đạo đức |
| Nếu bằng chứng sau đó cho thấy ngược lại | Cách đó mất tác dụng: chỉ có lợi khi lời nói khớp với sự thật — có lỗi thì xin lỗi, vô can mới phủ nhận | |

Bài học không phải "lỗi chính trực thì cứ chối". Bài học là lòng tin đã mất vì thiếu chính trực thì rất khó lấy lại.

Xin lỗi có tác dụng sau vi phạm năng lực tốt hơn sau vi phạm chính trực <a class="ev ev-mid" href="#r-lewicki2016" title="Lewicki, Polin &amp; Lount 2016 · Bằng chứng vừa"></a>.

</div></details>

<h3 id="forgive"><span class="num">5.4</span>Tha thứ, và giới hạn của tha thứ</h3>

Tha thứ có phải lúc nào cũng tốt cho mình? Tốt khi người kia đã sửa sai. Còn nếu họ không sửa gì mà mình vẫn tha thứ và ở lại như cũ, lòng tự trọng của mình mòn dần.

Ôm hận giống nuốt một cục tức vào bụng rồi để đó: người kia vẫn ăn ngon ngủ yên, chỉ mình là ấm ức mất ngủ. Tha thứ, tức buông bỏ mong muốn trả đũa và lòng thù hằn, là điều có thể học được, và người được lợi trước hết là chính người tha thứ. Các chương trình giúp tha thứ có tác dụng rõ, và người tham gia cũng bớt trầm cảm, bớt lo âu, thêm hy vọng <a class="ev ev-high" href="#r-wade2014" title="Wade 2014 · Bằng chứng mạnh"></a>.
