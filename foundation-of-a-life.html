# Nền móng một đời người

Cuốn sách này gom lại những gì khoa học hành vi biết chắc nhất về bốn câu hỏi mà ai cũng phải tự trả lời: mình vận hành thế nào, nên đối xử với người khác ra sao, thế nào là một cuộc đời đáng sống mà không bị ai chi phối, và làm sao đi tới mục tiêu khi cuộc đời không diễn ra như kế hoạch — rồi dừng ở câu hỏi gốc mà khoa học không trả lời thay được: mình coi trọng điều gì, và sống theo điều đó ra sao. Đây không phải một cuốn sách mẹo vặt. Mỗi chương bắt đầu từ **cơ chế** — vì sao con người hành xử như vậy — rồi mới tới cách sống sao cho hợp với cơ chế đó, vì lời khuyên mà không hiểu cơ chế thì gặp hoàn cảnh mới là không dùng được nữa.

<h2 id="how-to-read"><span class="num">0</span>Cách đọc cuốn sách này</h2>

Sách có năm phần. **Phần I — Hiểu mình** giải thích hai cơ chế nằm sau mọi lựa chọn: hành vi và cảm xúc. **Phần II — Sống với người khác** là đối nhân xử thế: người khác nhìn mình thế nào, xử lý xung đột ra sao, giữ những người thân như thế nào. **Phần III — Một đời đáng sống** hỏi một đời tốt gồm những gì, điều gì đang lặng lẽ chi phối mình, và hai nền móng vật chất là cơ thể và tiền bạc. **Phần IV — Hướng đi** là phần hành động: đặt và giữ mục tiêu, ra quyết định lớn, đứng dậy sau biến cố, và cách học, cách nghĩ cho đúng. **Phần V — Gốc rễ** là nơi mọi phần khác quy về: values của chính mình, những principles rút ra từ đó, cách sống tử tế, và cách quyết định theo values — kể cả khi sống giữa kỳ vọng của gia đình.

```mermaid
flowchart LR
  P1["Phần I<br/>Hiểu mình"] -->|"① hiểu cơ chế<br/>của chính mình"| P2["Phần II<br/>Sống với người khác"]
  P2 -->|"② người khác chiếm<br/>phần lớn cuộc đời mình"| P3["Phần III<br/>Một đời đáng sống"]
  P3 -->|"③ biết mình muốn gì<br/>và điều gì đang chi phối mình"| P4["Phần IV<br/>Hướng đi"]
  P4 -->|"④ mọi lựa chọn đều cần<br/>một gốc để quy chiếu"| P5["Phần V<br/>Gốc rễ"]
  P5 -.->|"⑤ thành bại giúp mình<br/>hiểu thêm về chính mình"| P1
```

Mũi tên ⑤ là lý do cuốn sách này dùng được lâu: những gì xảy ra khi bạn hành động — thành công, thất bại, xung đột, biến cố — là dữ liệu để hiểu mình rõ hơn, và vòng ấy cứ thế tiếp tục. Lần đầu nên đọc tuần tự. Về sau, khi gặp một chuyện cụ thể — một cuộc cãi vã, một quyết định lớn, một mất mát — hãy mở đúng chương nói về chuyện đó. Cuối mỗi phần có vài câu hỏi nhớ lại; trả lời trong đầu trước khi mở đáp án — đó chính là retrieval practice ở [chương 14](#learning), áp dụng cho chính cuốn sách.

Một điều cần nói trước về bằng chứng. Khoa học hành vi đã trải qua replication crisis — một giai đoạn mà nhiều kết quả nổi tiếng không lặp lại được khi được kiểm tra lại cẩn thận. Cuốn sách này vì vậy **nói rõ cả những gì đã sụp đổ** — ego depletion, xả giận cho nguôi, năm giai đoạn đau buồn như những bậc thang lần lượt, posttraumatic growth như thường được kể, growth mindset như một can thiệp đại trà — và gom chúng lại ở [Phụ lục A](#myths). Biết một niềm tin sai cũng có giá trị như biết một điều đúng.

<h2 id="principles"><span class="num">1</span>Mười hai nguyên lý</h2>

Nếu chỉ nhớ một trang, hãy nhớ trang này. Mỗi nguyên lý được giải thích kỹ ở chương tương ứng.

```mermaid
mindmap
  root((Một đời<br/>vững))
    Hiểu mình
      1 Tình huống hơn ý chí
      2 Lập kế hoạch cho lúc mệt
      3 Cảm xúc là tín hiệu
    Người khác
      4 Hỏi thay vì đoán
      5 Họ quý mình hơn mình tưởng
      6 Mềm với người, vững với điều mình cần
    Một đời đáng sống
      7 Quan hệ là trụ cột
      8 Mục tiêu nội tại
      9 Hiểu cơ chế là lá chắn
      10 Cơ thể và tiền là nền
    Hướng đi
      11 Values trước, rồi nhìn từ bên ngoài
      12 Đổi được thì làm, không đổi được thì chỉnh mình
```

1. **Hành vi phụ thuộc vào tình huống lúc chọn nhiều hơn vào ý định lúc lập kế hoạch.** Người có self-control tốt ít phải cưỡng lại hơn — họ gặp ít cám dỗ hơn. Muốn đổi hành vi, đổi tình huống trước ([chương 2](#behavior)).
2. **Người lập kế hoạch và người thực hiện ở hai trạng thái khác nhau.** Hãy lập kế hoạch cho chính mình lúc đang mệt, dựa trên những lần trước, không dựa trên "mình nên làm được gì" ([chương 2](#behavior)).
3. **Cảm xúc là tín hiệu, không phải mệnh lệnh.** Hãy gọi tên cảm xúc, chấp nhận rằng nó đang có mặt, rồi chọn cách điều tiết hợp với hoàn cảnh; không có chiến lược nào tốt cho mọi lúc ([chương 3](#emotions)).
4. **Đừng đoán người khác nghĩ gì — hỏi.** Tưởng tượng mình ở vị trí người kia không làm mình hiểu họ đúng hơn; hỏi và lắng nghe thì có ([chương 4](#impressions)).
5. **Người khác quý mình, sẵn lòng giúp mình, và đón nhận lời nói thật lòng tốt hơn mình tưởng.** Phần lớn nỗi ngại trong giao tiếp đến từ dự đoán sai; hãy chủ động hơn ([chương 4](#impressions)).
6. **Trong xung đột, quan tâm thật đến người kia và giữ vững điều mình cần — cùng một lúc.** Tha thứ khi người kia sửa sai; tha thứ cho người không hề sửa sai thì làm mình mất dần lòng tự trọng ([chương 5](#conflict)).
7. **Những người thân là trụ cột của cuộc đời**, không phải thứ chỉ dành cho thời gian còn dư ([chương 6](#close-ties)).
8. **Sống theo mục tiêu nội tại — gắn bó, trưởng thành, đóng góp, sức khoẻ — hơn là tiền, hình ảnh, danh tiếng.** Một đời tốt thoả ba nhu cầu: tự chủ, năng lực, gắn kết ([chương 7](#good-life)).
9. **So sánh, đám đông, quyền uy và các thiết kế giành sự chú ý chi phối con người nhiều hơn ta nghĩ.** Hiểu cơ chế là lá chắn tốt nhất ([chương 8](#autonomy)).
10. **Cơ thể và tiền bạc là nền móng, và cả hai phụ thuộc nhiều vào default — những gì được cài sẵn.** Ngủ đều, vận động, không thuốc lá, càng ít rượu càng tốt; tiết kiệm tự động, đầu tư phí thấp, ít giao dịch, không để nợ rải rác ([chương 9](#body), [chương 10](#money)).
11. **Quyết định lớn: đối chiếu values và bright lines của mình trước, rồi nhìn từ bên ngoài, nhìn mình như nhìn một người bạn, và đánh giá quyết định theo quá trình chứ không theo kết quả** ([chương 18](#decide-values)). Khi đã phân vân rất lâu, dám thay đổi thường không tệ như mình sợ ([chương 12](#decisions)).
12. **Trước biến cố: cái gì đổi được thì hành động, cái gì không đổi được thì chấp nhận và chỉnh lại mục tiêu của mình.** Phần lớn con người vượt qua được nhiều hơn họ nghĩ, nhất là khi có người bên cạnh nâng đỡ ([chương 13](#adversity)).

<div class="callout why"><div class="ct">Bản chất, trong một đoạn</div>

Con người không phải cỗ máy lý trí cứ thế làm đúng theo kế hoạch. Ở mỗi khoảnh khắc, não chọn thứ có lợi nhất *trong tình huống trước mặt*, với trạng thái cơ thể và cảm xúc lúc đó, và não dự đoán rất kém cả về chính mình lẫn về người khác. Gần như mọi lời khuyên trong cuốn sách này quy về ba việc: **sắp xếp tình huống** trước khi phải chọn, **sửa dự đoán sai** bằng dữ liệu thật thay vì cảm giác, và **đầu tư vào những trụ cột** — quan hệ, cơ thể, tiền, kỹ năng — vì chúng tích luỹ qua nhiều năm.

</div>


<h2 id="part-1" class="part">Phần I — Hiểu mình</h2>

<h2 id="behavior"><span class="num">2</span>Hành vi do tình huống quyết định</h2>

Ta thường hình dung con người như một người lái xe: lý trí cầm lái, ý chí là chân ga, và thất bại nghĩa là lái kém. Hình dung này sai ở đúng chỗ quan trọng nhất. Rất nhiều hành vi hằng ngày không hề được lý trí cân nhắc: chúng bật lên theo bối cảnh, bị trạng thái cơ thể chi phối, và được quyết định bởi phép so sánh chi phí – phần thưởng **ngay ở khoảnh khắc chọn**. Chương này mổ xẻ khoảnh khắc đó.

```mermaid
flowchart LR
  S["Tình huống<br/>(cue, cám dỗ trước mặt,<br/>thứ gì dễ với tới)"] -->|"①"| C(("Khoảnh khắc<br/>chọn"))
  B["Trạng thái<br/>(mệt, đói, buồn,<br/>căng thẳng)"] -->|"②"| C
  K["Chi phí cảm nhận<br/>của việc bắt đầu"] -->|"③"| C
  R["Phần thưởng có ngay<br/>hay phải chờ rất lâu"] -->|"④"| C
  P["Kế hoạch<br/>viết từ trước"] -.->|"⑤ chỉ thắng nếu đã đổi<br/>được ① ③ ④ từ trước"| C
  C --> A["Hành vi thực tế"]
```

1. **Tình huống**: thứ gì ở trước mặt, thứ gì trong tầm tay, bối cảnh nào đang kích hoạt habit nào.
2. **Trạng thái**: cùng một người, lúc mệt và lúc khoẻ chọn khác nhau — và lúc khoẻ thì không tin điều đó.
3. **Chi phí** của việc bắt đầu: càng nhiều bước, càng mơ hồ, càng khó chịu thì càng ngại bắt đầu.
4. **Phần thưởng**: thứ có ngay thường được phóng đại so với thứ đến sau — nhất là khi cái giá phải trả là công sức.
5. **Kế hoạch** chỉ là một mũi tên đứt nét. Kế hoạch không tự nó thắng được ở khoảnh khắc chọn; nó chỉ thắng khi đã kịp thay đổi tình huống, chi phí hoặc phần thưởng *trước đó*.

<h3 id="cold-hot"><span class="num">2.1</span>Người lập kế hoạch và người thực hiện</h3>

Khi đang ở trạng thái "cold" — no, khoẻ, không có cám dỗ trước mặt — người ta đánh giá thấp việc trạng thái "hot" — mệt, đói, thèm, giận, cám dỗ ngay trước mắt — sẽ chi phối hành vi của mình đến mức nào, và còn quên luôn mình từng bị chi phối ra sao. Hiện tượng này có tên là **hot–cold empathy gap** ([Loewenstein 1996](#r-loewenstein1996); [Loewenstein 2005](#r-loewenstein2005)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Bằng chứng đời thường nhất: 200 nhân viên ở các công ty, bệnh viện và cửa hàng tại Amsterdam chọn trước món ăn vặt cho một tuần sau. Trong số người chọn trước món lành mạnh, **62–82% đổi sang món không lành mạnh** khi đến lúc ăn thật; chiều ngược lại chỉ 0–8% ([Read & van Leeuwen 1998](#r-read1998)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Cùng gốc với hiện tượng này là **present bias**: phần thưởng có ngay được phóng đại so với phần thưởng đến sau, và thiên lệch này mạnh với *công sức* hơn là với tiền bạc ([Augenblick 2015](#r-augenblick2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Theo mô hình kinh tế học của O'Donoghue & Rabin, người "naive" — tin rằng ngày mai mình sẽ làm — cứ dời mãi; người "sophisticated" biết trước rằng ngày mai mình cũng sẽ lại dời, nên làm sớm hơn, và nhờ đó trì hoãn ít hơn ([O'Donoghue & Rabin 1999](#r-odonoghue1999)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Đây là một mô hình lý thuyết, chưa phải kết quả đo được. Người quá tin vào khả năng kiềm chế của mình lại hay để mình ở gần cám dỗ hơn, nên thua nhiều hơn — gọi là restraint bias ([Nordgren 2009](#r-nordgren2009)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Kết quả cuối cùng là **intention–behaviour gap**: một thay đổi ý định cỡ d = 0,66 chỉ kéo theo thay đổi hành vi cỡ d = 0,36 ([Webb & Sheeran 2006](#r-webb2006)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

Hệ quả nguy hiểm nhất xảy ra *sau* thất bại. Khi đã hết mệt, người ta giải thích hành vi hôm qua bằng tính cách và bỏ qua trạng thái mệt ([Nordgren 2006](#r-nordgren2006)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>: "mình lười", "mình không có kỷ luật". Thất bại lặp lại làm giảm self-efficacy — niềm tin rằng mình làm được việc đó ([Bandura 1977](#r-bandura1977)) <span class="ev ev-high" title="Bằng chứng mạnh"></span> — và self-efficacy thấp lại là một trong những yếu tố đi cùng trì hoãn mạnh nhất, r = −0,38 ([Steel 2007](#r-steel2007)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Một sai lầm về *dự đoán* biến thành một kết luận sai về *bản thân*.

Hai quy tắc rút ra, dùng cho mọi kế hoạch trong đời <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Thứ nhất, **lập kế hoạch theo dữ liệu những lần gần nhất**, không theo "mình nên làm được gì" — [chương 12](#decisions) sẽ cho thấy chỉ riêng việc gắn dự đoán với kinh nghiệm cũ đã xoá được sai lệch. Thứ hai, **thiết kế cho trạng thái hot**: việc dành cho lúc mệt phải nhỏ, rõ, và chuẩn bị sẵn từ lúc còn tỉnh.

<h3 id="effort"><span class="num">2.2</span>Nỗ lực có chi phí, nhưng ý chí không phải bình xăng</h3>

Hình ảnh phổ biến về ý chí là một bình xăng: dùng nhiều thì cạn. Ý tưởng này — ego depletion — từng rất nổi tiếng, nhưng khi được kiểm tra lại nghiêm ngặt ở nhiều phòng thí nghiệm với kế hoạch phân tích đăng ký trước, hiệu ứng gần như bằng không: 23 phòng thí nghiệm, N = 2.141, d = 0,04 ([Hagger 2016](#r-hagger2016)); 36 phòng thí nghiệm, N = 3.531, d = 0,06 ([Vohs 2021](#r-vohs2021)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

Cảm giác "tốn sức" vẫn là thật, nhưng cơ chế khác. Theo opportunity cost model, cảm giác ấy là kết quả của một phép tính trong não: dồn sự tập trung cho việc này nghĩa là không dùng được cho việc khác, và khi chi phí cảm nhận vượt phần thưởng, cảm giác "mệt, muốn đổi việc" xuất hiện ([Kurzban 2013](#r-kurzban2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Mệt mỏi thật sự cũng có: sau hơn sáu tiếng làm việc đòi hỏi kiểm soát nhận thức, người ta chọn bốc đồng hơn, và vùng lateral prefrontal cortex hoạt động yếu hơn — chỉ ở nhóm làm việc khó ([Blain 2016](#r-blain2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Hệ quả thực tế: thay vì chờ "có năng lượng", hãy **làm cho việc bắt đầu bớt tốn sức** và **để phần thưởng đến sớm hơn** — hai thứ này mình chủ động được, còn năng lượng cuối ngày thì không.

<h3 id="habits"><span class="num">2.3</span>Habit: khi bối cảnh quyết định thay mình</h3>

```mermaid
flowchart LR
  C["Cue<br/>(nơi chốn, giờ giấc,<br/>việc vừa làm xong)"] -->|"① kích hoạt"| R["Response<br/>hành vi tự diễn ra"]
  R -->|"② lặp lại trong<br/>cùng bối cảnh"| L["Liên kết cue → response<br/>mạnh dần"]
  L -->|"③ lần sau nhanh hơn,<br/>ít cần quyết định hơn"| C
```

Habit là một liên kết được học giữa bối cảnh và phản ứng, hình thành qua lặp lại, và khi đã mạnh thì tự diễn ra mà gần như không cần ý định ([Wood & Rünger 2016](#r-wood2016)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Trong hai nghiên cứu nhật ký theo giờ với sinh viên đại học, khoảng một phần ba đến một nửa số hành vi được ghi lại (35% và 43%) là những việc làm gần như mỗi ngày, thường ở cùng một chỗ ([Wood 2002](#r-wood2002)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Thí nghiệm minh hoạ rõ nhất: những người quen ăn bỏng ngô ở rạp **ăn bỏng ngô ôi nhiều như bỏng ngô mới** — nhưng chỉ khi ở trong rạp ([Neal 2011](#r-neal2011)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Họ không thích bỏng ôi; bối cảnh đã quyết định thay họ.

Ba điều đáng nhớ về việc tạo habit. Con số "21 ngày" chỉ là con số truyền miệng: thời gian để một hành vi trở nên tự động dao động từ **18 đến 254 ngày** tuỳ người ([Lally 2010](#r-lally2010)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; habit tập gym mất hàng tháng, còn habit rửa tay của nhân viên bệnh viện mất vài tuần ([Buyalskaya 2023](#r-buyalskaya2023)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Lỡ một lần không làm hỏng gì cả — nguyên văn: *"Missing one opportunity to perform the behaviour did not materially affect the habit formation process"* ([Lally 2010](#r-lally2010)). Và một thứ rất đáng thưởng là **sự quay lại**: trong một megastudy với 61.293 hội viên phòng gym thử 54 chương trình bốn tuần khuyến khích đi tập, chương trình đứng đầu là thưởng nhỏ cho việc quay lại sau một buổi bị lỡ — dù chỉ 8% chương trình còn tạo khác biệt đo được sau khi kết thúc ([Milkman 2021](#r-milkman2021)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Những lúc bối cảnh sống đổi — chuyển nhà, đổi việc — là cơ hội tốt để tạo habit mới: can thiệp hiệu quả hơn ở người vừa chuyển nhà, trong khoảng ba tháng đầu ([Verplanken & Roy 2016](#r-verplanken2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

<h3 id="situation"><span class="num">2.4</span>Self-control là thiết kế tình huống</h3>

Phát hiện quan trọng nhất về self-control đi ngược trực giác. Theo dõi 205 người qua 7.827 lần báo cáo ham muốn trong ngày, những người có self-control cao **báo cáo ít xung đột giữa ham muốn và mục tiêu hơn** ([Hofmann 2012](#r-hofmann2012)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Nói cách khác, họ ít phải đấu tranh với bản thân hơn. Nỗ lực tự kiềm chế trong khoảnh khắc **không liên quan** tới việc đạt mục tiêu cuối học kỳ; cái dự báo thất bại là *tần suất gặp cám dỗ* ([Milyavskaya & Inzlicht 2017](#r-milyavskaya2017)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Tổng hợp 102 nghiên cứu với 32.648 người cho thấy self-control gắn mạnh với hành vi **tự động** hơn là hành vi phải gồng ([de Ridder 2012](#r-deridder2012)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>, và self-control phát huy tác dụng thông qua habit ([Galla & Duckworth 2015](#r-galla2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Khi thử ngoài đời, chiến lược **thay đổi tình huống** giúp sinh viên đạt mục tiêu tốt hơn chiến lược cố kìm phản ứng ([Duckworth 2016](#r-duckworth2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Công cụ đơn giản nhất để gắn hành động vào tình huống là **implementation intention** — một kế hoạch viết dưới dạng "Khi [tình huống] thì tôi [hành động]". Tổng hợp 642 phép thử cho hiệu ứng từ d = 0,27 tới 0,66, mạnh hơn khi viết đúng dạng if-then, khi động lực cao, và khi kế hoạch được nhẩm lại ([Sheeran 2025](#r-sheeran2025)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Đây không phải đũa thần: kế hoạch if-then giúp giảm hút thuốc ở người có habit hút yếu hoặc vừa, nhưng không ở người có habit mạnh ([Webb, Sheeran & Luszczynska 2009](#r-webb2009)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Với habit mạnh, chiến lược duy nhất thấy hiệu quả là vigilant monitoring — chủ động để ý và chặn lại ngay khi thấy mình bắt đầu; né tác nhân kích hoạt ngay lúc đó (stimulus control) giúp với cám dỗ nhưng không giúp với habit mạnh ([Quinn 2010](#r-quinn2010)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cơ hội thật để đổi một habit mạnh là lúc cả bối cảnh sống thay đổi, như chuyển nhà hay đổi việc ở [§2.3](#habits) ([Verplanken & Roy 2016](#r-verplanken2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

<h3 id="levers"><span class="num">2.5</span>Ví dụ tính tay: ba đòn bẩy</h3>

Steel tổng hợp nghiên cứu về trì hoãn thành Temporal Motivation Theory ([Steel 2007](#r-steel2007)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — một khung để suy nghĩ hơn là một định luật đo được:

$$\text{Sức hút của một việc} = \frac{E \times V}{\Gamma \times D}$$

E là expectancy (mình tin làm được đến đâu), V là value (giá trị cảm nhận), Γ là mức nhạy với trì hoãn (gần như cố định ở mỗi người) và D là delay (bao lâu nữa mới thấy phần thưởng). Vì Γ giống nhau ở mọi lựa chọn của cùng một người, chỉ cần so E × V / D. Ví dụ: 19:30 một tối thứ Ba, vừa đi làm về. Các con số dưới đây là **minh hoạ**, đặt ra để thấy hướng tác động của từng đòn bẩy, không phải số đo:

| Lựa chọn lúc mệt | E | V | D | E × V / D |
|---|---|---|---|---|
| "Tập gym một tiếng rưỡi" | 0,3 — mệt, phải đi xa | 9 — rất quan trọng | 60 — thấy khác sau nhiều tuần | **0,045** |
| Nằm lướt điện thoại | 1,0 — chắc chắn làm được | 3 — vui vừa | 1 — vui ngay | **3** |
| "Đi bộ 15 phút với một podcast mình thích, giày để sẵn ở cửa" | 0,95 — quá nhỏ để thất bại | 4 — vui ngay, có ích | 1 — vui ngay khi bước ra | **3,8** |

Lựa chọn thứ ba thắng buổi gym không phải vì quan trọng hơn — giá trị của việc đi bộ thấp hơn nhiều — mà vì việc này nhỏ tới mức gần như chắc chắn làm được (E tăng), có phần thưởng ngay trong lúc làm (D giảm), và đôi giày để sẵn ở cửa khiến việc bắt đầu đỡ tốn sức hơn. Đi bộ còn thắng được cả điện thoại vì podcast mình thích đưa phần thưởng vào ngay bên trong việc, khiến V nhỉnh hơn lướt điện thoại. Ghép một thứ mình thích với một việc nên làm — temptation bundling — đã được thử nghiệm: chỉ cho nghe một câu chuyện hấp dẫn khi ở phòng gym làm tăng số lần đi tập lúc đầu rồi giảm dần ([Milkman 2014](#r-milkman2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; một thử nghiệm lớn hơn (6.792 người) cho thấy tặng sách nói kèm lời khuyên chỉ nghe khi tập làm khả năng đi tập mỗi tuần tăng 10–14% so với nhóm không được gì, dù riêng lời khuyên chỉ thêm được một chút so với chỉ tặng sách nói ([Kirgios 2020](#r-kirgios2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Công thức này dùng cho mọi mục tiêu, từ tập luyện tới tiết kiệm tới học: **thu nhỏ việc lại, đặt việc vào đúng tình huống, và đưa phần thưởng vào ngay bên trong việc** <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h2 id="emotions"><span class="num">3</span>Cảm xúc là tín hiệu, không phải mệnh lệnh</h2>

Cảm xúc là cách cơ thể báo rằng có điều gì quan trọng với mình đang xảy ra: sợ báo nguy hiểm, giận báo bị xâm phạm, buồn báo mất mát. Tín hiệu ấy có ích. Vấn đề chỉ nảy sinh khi ta để tín hiệu ấy quyết định thay mình, hoặc cố dập nó đi bằng những cách không hiệu quả. Điều tiết cảm xúc không phải là dập tắt cảm xúc, mà là tác động lên **cách cảm xúc diễn ra tiếp** sau khi nó đã nảy sinh.

Mô hình được dùng rộng rãi nhất chia việc điều tiết thành năm điểm can thiệp theo trình tự một cảm xúc hình thành ([Gross 1998](#r-gross1998)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>:

```mermaid
flowchart LR
  S1["① Chọn tình huống<br/>(tránh hay bước vào)"] --> S2["② Sửa tình huống<br/>(đổi một chi tiết)"]
  S2 --> S3["③ Hướng chú ý<br/>(nhìn đi chỗ khác<br/>hoặc nhìn sâu vào)"]
  S3 --> S4["④ Đổi cách hiểu<br/>(reappraisal)"]
  S4 --> E(("Cảm xúc"))
  E --> S5["⑤ Điều chỉnh phản ứng<br/>(kìm nét mặt, thở,<br/>vận động)"]
```

Điểm ① và ② nằm *trước* khi cảm xúc kịp nổi lên — đây chính là ý "thiết kế tình huống" của [chương 2](#situation), áp dụng cho cảm xúc; học sinh tự đánh giá các cách can thiệp sớm này hiệu quả hơn hẳn các cách đến sau, và khi được giao dùng thử thì đạt mục tiêu tốt hơn ([Duckworth 2016](#r-duckworth2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Điểm ③ và ④ diễn ra trong đầu. Điểm ⑤ đến sau cùng, khi cảm xúc đã bùng lên. Một meta-analysis gồm 306 so sánh thực nghiệm đã đo xem từng cách cụ thể thay đổi được cảm xúc đến đâu ([Webb, Miles & Sheeran 2012](#r-webb2012)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>:

```chart hbar
chiến lược,effect size (d)
Perspective taking — nhìn từ góc người khác,0.45
Reappraisal tình huống — hiểu lại sự việc,0.36
Kìm biểu hiện ra ngoài,0.32
Distraction — chuyển chú ý,0.27
Reappraisal phản ứng — hiểu lại cảm xúc của mình,0.23
Kìm trải nghiệm bên trong,-0.04
Kìm suy nghĩ,-0.12
Tập trung vào chính cảm xúc,-0.26
```

<p class="src">Nguồn: Webb, Miles & Sheeran 2012, Psych Bull 138(4):775–808. d dương = cảm xúc thay đổi theo hướng mong muốn; 0,2 là nhỏ, 0,5 là vừa.</p>

Biểu đồ cho thấy ba điều. Thứ nhất, **đổi cách hiểu** — nhất là nhìn sự việc từ góc của người khác — là nhóm hiệu quả nhất. Thứ hai, cố **không cảm thấy** hoặc **không nghĩ tới** gần như vô dụng, thậm chí phản tác dụng. Thứ ba, cứ xoáy vào cảm xúc của mình thì cảm xúc nặng thêm. Riêng thanh "kìm biểu hiện" trông có vẻ tốt, nhưng cách này chỉ nhắm tới nét mặt và hành vi bên ngoài; người *có thói quen* kìm nén lại cảm thấy ít cảm xúc tích cực hơn mà **nhiều** cảm xúc tiêu cực hơn, trong khi người quen reappraisal có nhiều cảm xúc tích cực hơn, quan hệ tốt hơn và well-being cao hơn ([Gross & John 2003](#r-gross2003)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

<h3 id="naming"><span class="num">3.1</span>Gọi tên cảm xúc</h3>

Việc đơn giản nhất lại có bằng chứng thú vị nhất. Chỉ cần đặt cảm xúc thành lời — affect labeling — đã làm giảm phản ứng của amygdala và vùng limbic trong não ([Lieberman 2007](#r-lieberman2007)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Trong một thí nghiệm với người sợ nhện, nhóm được hướng dẫn nói thành lời cảm xúc của mình khi tiếp xúc với nhện có phản ứng sinh lý (độ dẫn điện của da) thấp hơn sau một tuần, dù mức sợ tự báo cáo không khác; ai dùng càng nhiều từ chỉ nỗi sợ thì phản ứng càng giảm ([Kircanski 2012](#r-kircanski2012)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Gọi tên càng **chính xác** càng tốt: người phân biệt được cảm xúc của mình tinh tế — "thất vọng" khác "bị xúc phạm" khác "lo" — ít rơi vào những cách đối phó có hại như uống say, gây hấn hay tự làm đau mình khi căng thẳng ([Kashdan, Barrett & McKnight 2015](#r-kashdan2015)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Một câu hỏi để luyện <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: *"Chính xác thì mình đang cảm thấy gì, và cảm xúc ấy đang báo cho mình điều gì?"*

<h3 id="flexibility"><span class="num">3.2</span>Không có chiến lược tốt cho mọi lúc</h3>

```mermaid
flowchart TD
  Q{"Tình huống này<br/>mình có đổi được không?"}
  Q -->|"Đổi được"| A["Hành động lên chính tình huống<br/>① ② ở mô hình trên"]
  Q -->|"Không đổi được"| B["Đổi cách hiểu, chấp nhận,<br/>chuyển chú ý"]
  A --> R["Kết quả tốt hơn"]
  B --> R
  X["Làm ngược lại"] -.->|"reappraise điều đổi được<br/>→ cam chịu điều lẽ ra phải sửa"| W["Trầm cảm hơn"]
```

Cùng một chiến lược có thể tốt hay xấu tuỳ tình huống. Với căng thẳng **không kiểm soát được**, người có khả năng reappraisal cao ít trầm cảm hơn; với căng thẳng **kiểm soát được**, cũng khả năng ấy lại đi kèm trầm cảm **nhiều** hơn ([Troy 2013](#r-troy2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — có thể vì "nghĩ khác đi" thay cho việc lẽ ra phải hành động <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Khảo sát người tham gia mười lần mỗi ngày trong một tuần cũng cho cùng kết luận: well-being cao hơn ở người dùng reappraisal **nhiều trong tình huống ít kiểm soát** và **ít trong tình huống kiểm soát được**; tần suất reappraisal trung bình tự nó không nói lên gì ([Haines 2016](#r-haines2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cường độ cũng quan trọng: người ta tự nhiên chọn reappraisal khi cảm xúc tiêu cực ở mức nhẹ và chuyển sang distraction khi cảm xúc mạnh ([Sheppes 2011](#r-sheppes2011)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Gộp 329 mẫu với 58.946 người, coping flexibility — khả năng đổi chiến lược cho hợp tình huống — tương quan r = 0,23 với mức thích nghi tốt, rõ hơn ở các nghiên cứu đo coping flexibility như "chiến lược khớp với tình huống" hoặc như niềm tin rằng mình ứng phó được ([Cheng, Lau & Chan 2014](#r-cheng2014)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Câu hỏi then chốt vì vậy luôn là câu hỏi ở đỉnh hình trên: *cái này mình có đổi được không?* [Chương 13](#adversity) dùng lại đúng câu hỏi ấy cho những biến cố lớn.

<h3 id="anger"><span class="num">3.3</span>Xả giận không làm nguôi giận</h3>

Lời khuyên "cứ xả ra cho nhẹ" là một trong những niềm tin sai dai dẳng nhất. Người được cho đấm bao cát trong khi nghĩ về kẻ vừa khiêu khích mình trở nên **giận hơn và hung hăng hơn** so với người cũng đấm bao cát nhưng nghĩ về chuyện tập cho khoẻ, và so với người ngồi yên không làm gì ([Bushman 2002](#r-bushman2002)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Tổng hợp 154 nghiên cứu với 10.189 người chỉ ra hướng ngược lại: các hoạt động **hạ mức kích động** — thở chậm, mindfulness, thư giãn — giảm giận dữ và hung hăng, g = −0,63 ([Kjærvik & Bushman 2024](#r-kjaervik2024)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Riêng breathwork, tổng hợp 12 thử nghiệm ngẫu nhiên với 785 người cho thấy breathwork giảm stress tự báo cáo, g = −0,35, dù phần lớn nghiên cứu có nguy cơ thiên lệch ở mức vừa ([Fincham 2023](#r-fincham2023)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Bản chất: cơn giận cần **hạ nhiệt trước**, nói chuyện sau; trút giận bằng cách sống lại cơn giận chỉ khiến mình quen giận hơn <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="acceptance"><span class="num">3.4</span>Chấp nhận, và đừng săn hạnh phúc</h3>

Nghe ngược đời, nhưng người **chấp nhận** cảm xúc và suy nghĩ tiêu cực của mình — không phán xét chúng là xấu, không cố đuổi chúng đi — lại có ít cảm xúc tiêu cực hơn trước căng thẳng, và sức khoẻ tâm lý tốt hơn sáu tháng sau. Kết quả này lặp lại qua một khảo sát 1.003 người, một nghiên cứu trong phòng thí nghiệm với tác nhân gây căng thẳng chuẩn, và một nghiên cứu theo dõi dọc — cả ba đều đo thói quen chấp nhận sẵn có của mỗi người, không can thiệp vào nó ([Ford 2018](#r-ford2018)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Ngược lại, coi hạnh phúc là thứ phải đạt bằng được có thể phản tác dụng: phụ nữ đề cao hạnh phúc nhiều hơn lại kém hạnh phúc hơn khi cuộc sống ít căng thẳng, và khi được dẫn dắt để đề cao hạnh phúc, họ vui *ít hơn* trước một đoạn phim vui — vì thất vọng khi thấy mình không vui như kỳ vọng ([Mauss 2011](#r-mauss2011)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; hai nghiên cứu nhỏ, mẫu nữ, nên chỉ nên xem là một lời cảnh báo. Gộp lại <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: cảm xúc khó chịu là một phần bình thường của đời sống, không phải bằng chứng rằng mình đang sống sai.

<h3 id="distance"><span class="num">3.5</span>Nhìn mình như nhìn một người bạn</h3>

Một nghịch lý quen thuộc: ta khuyên người khác rất sáng suốt, nhưng rối trí với chính chuyện của mình. Ba thí nghiệm với 693 người xác nhận: người ta suy luận khôn ngoan hơn — thừa nhận giới hạn hiểu biết của mình, xét nhiều góc nhìn, tìm cách dung hoà — khi nghĩ về vấn đề của người khác so với vấn đề của chính mình; và khi được hướng dẫn **lùi ra xa**, nghĩ về chuyện của mình như người ngoài, khoảng cách ấy biến mất — ở cả nhóm 20–40 tuổi lẫn 60–80 tuổi ([Grossmann & Kross 2014](#r-grossmann2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cách đơn giản nhất để lùi ra là đổi cách xưng hô với chính mình: tự nói với mình bằng **tên mình** hoặc ngôi thứ hai thay vì "tôi" giúp người ta làm tốt hơn trong các tình huống căng thẳng như gây ấn tượng ban đầu hay nói trước đám đông, bớt căng thẳng, và nhìn tình huống như thử thách thay vì đe doạ ([Kross 2014](#r-kross2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Ví dụ: thay vì "Sao mình lại làm hỏng chuyện này?", hãy hỏi "Tân, chuyện gì thật sự đã xảy ra, và bạn sẽ khuyên một người bạn trong tình huống này làm gì?".

<h3 id="avoidance"><span class="num">3.6</span>Nhiều hành vi né tránh thực ra là điều tiết cảm xúc</h3>

Gộp hai chương lại sẽ thấy một điều quan trọng: rất nhiều hành vi trông như "lười" thực ra là một cách để mình dễ chịu hơn ngay lúc đó. Trì hoãn là ưu tiên cảm giác dễ chịu ngắn hạn hơn mục tiêu dài hạn — mood repair ([Sirois & Pychyl 2013](#r-sirois2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Bằng chứng gọn nhất: người đang buồn mà được dẫn dắt tin rằng tâm trạng của mình đã bị "đóng băng", không thay đổi được, thì không còn trì hoãn kiểu tìm vui trước một việc khó chịu nữa ([Tice, Bratslavsky & Baumeister 2001](#r-tice2001)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Người ta không trốn việc; người ta trốn **cảm giác** mà việc gợi ra. Hệ quả thực tế: muốn bắt đầu một việc mình ngại, hãy làm **bước đầu tiên** bớt khó chịu — nhỏ hơn, rõ hơn, dễ chịu hơn — thay vì tự trách mình lười <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Và đối xử tử tế với chính mình sau một thất bại làm *tăng* động lực sửa sai chứ không làm mình buông thả: người được hướng dẫn self-compassion sau một bài kiểm tra trượt đã dành nhiều thời gian ôn hơn ([Breines & Chen 2012](#r-breines2012)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

<div class="recall">

**Câu hỏi nhớ lại — Phần I.** Trả lời trong đầu trước, rồi mới mở đáp án.

<details><summary>Người có self-control tốt khác người khác ở điểm nào?</summary><div class="inner">

Họ gặp ít cám dỗ hơn, ít phải cưỡng lại hơn, và dựa nhiều vào habit (Hofmann 2012; Milyavskaya & Inzlicht 2017; de Ridder 2012; Galla & Duckworth 2015). Vì vậy đòn bẩy chính là thiết kế tình huống, không phải gồng ý chí.

</div></details>

<details><summary>Vì sao kế hoạch viết lúc tỉnh táo hay thất bại, và sửa thế nào?</summary><div class="inner">

Hot–cold empathy gap: lúc "cold" ta đánh giá thấp sức chi phối của trạng thái "hot" (Loewenstein; Read & van Leeuwen: 62–82% đổi sang món không lành mạnh). Sửa bằng cách lập kế hoạch theo dữ liệu những lần trước và thiết kế việc cho lúc mệt: nhỏ, rõ, chuẩn bị sẵn.

</div></details>

<details><summary>Lỡ một ngày có làm hỏng habit không? Nên thưởng cho cái gì?</summary><div class="inner">

Không (Lally 2010). Trong megastudy 54 chương trình, cách hiệu quả nhất là thưởng nhỏ cho việc quay lại sau một buổi lỡ (Milkman 2021).

</div></details>

<details><summary>Khi nào reappraisal đi kèm kết quả tốt, khi nào thì ngược lại?</summary><div class="inner">

Khả năng reappraisal đi kèm ít trầm cảm hơn khi tình huống không kiểm soát được, nhưng nhiều hơn khi tình huống kiểm soát được — có thể vì "nghĩ khác đi" đã thay cho hành động (Troy 2013; Haines 2016). Câu hỏi gốc: cái này mình có đổi được không?

</div></details>

<details><summary>Đang rất giận, nên làm gì trước?</summary><div class="inner">

Hạ mức kích động trước (thở chậm, thư giãn, mindfulness), nói chuyện sau. Trút giận bằng cách sống lại cơn giận chỉ làm giận thêm (Bushman 2002; Kjærvik & Bushman 2024).

</div></details>

</div>


<h2 id="part-2" class="part">Phần II — Sống với người khác</h2>

<h2 id="impressions"><span class="num">4</span>Người khác nhìn mình thế nào</h2>

Đối nhân xử thế hay được hiểu như những kỹ năng khéo léo: nói gì cho vừa lòng, giữ ý ra sao. Nghiên cứu lại cho thấy một điều khác, và đơn giản hơn. Có hai sai lầm rất phổ biến, và người ta mắc lặp đi lặp lại: ta **tưởng mình đọc được** người khác nghĩ gì, và ta **dự đoán quá bi quan** về cách người khác phản ứng với mình. Sửa hai sai lầm ấy giải quyết được nhiều chuyện <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="character"><span class="num">4.1</span>Điều người ta để ý nhất là tính cách</h3>

Khi hình thành ấn tượng về một người, thông tin về **tính cách đạo đức** — người này có trung thực, công bằng, đáng tin không — có sức nặng hơn thông tin về việc người ấy dễ mến hay ấm áp; ngay cả trong các bài cáo phó, phẩm chất đạo đức vẫn chiếm ưu thế ([Goodwin, Piazza & Rozin 2014](#r-goodwin2014)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Nói cách khác, cái người ta nhớ về mình lâu nhất không phải mình khéo hay vui tính, mà là mình **có đáng tin hay không**. [Chương 5](#apology) sẽ cho thấy mặt còn lại: mất lòng tin vì thiếu chính trực thì khó lấy lại hơn mất lòng tin vì thiếu năng lực.

<h3 id="ask"><span class="num">4.2</span>Đừng đoán, hãy hỏi</h3>

Lời khuyên kinh điển "hãy đặt mình vào vị trí người khác" hoá ra không làm ta hiểu họ đúng hơn. Qua 25 thí nghiệm, việc được hướng dẫn **tưởng tượng** góc nhìn của người khác — perspective-*taking* — không làm tăng độ chính xác khi đoán suy nghĩ, cảm xúc, sở thích của họ — nếu có thì nhìn chung còn làm giảm — trong khi đôi lúc lại làm người ta tự tin hơn. Điều làm tăng độ chính xác trong nghiên cứu là **hỏi và nghe** — perspective-*getting* ([Eyal, Steffel & Epley 2018](#r-eyal2018)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Hỏi còn khiến mình được quý mến hơn: trong các cuộc trò chuyện thật, người hỏi nhiều hơn, nhất là **hỏi tiếp** về điều người kia vừa nói, được thích hơn, vì họ cho thấy mình đang thật sự lắng nghe ([Huang 2017](#r-huang2017)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Lắng nghe chất lượng cao gắn với hiệu quả công việc, khả năng lãnh đạo, niềm tin và well-being ([Kluger & Itzchakov 2022](#r-kluger2022)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, và như [chương 5](#disagree) sẽ cho thấy, lắng nghe còn làm dịu cả bất đồng.

<h3 id="expectation-gap"><span class="num">4.3</span>Người khác quý mình hơn mình tưởng</h3>

Một chuỗi nghiên cứu, mỗi nghiên cứu một tình huống, cho cùng một kết quả: ta tưởng chủ động với người khác sẽ phải trả giá **đắt hơn nhiều** so với thực tế.

| Việc mình ngại | Điều mình dự đoán | Điều thật sự xảy ra | Nguồn |
|---|---|---|---|
| Bắt chuyện với người lạ trên tàu, xe | Chuyến đi khó chịu hơn | Chuyến đi dễ chịu hơn, không kém năng suất | [Epley & Schroeder 2014](#r-epley2014) <span class="ev ev-mid" title="Bằng chứng vừa"></span> |
| Một cuộc trò chuyện vừa xong | Người kia không thích mình nhiều đến thế | Người kia thích mình hơn mình nghĩ — "liking gap" | [Boothby 2018](#r-boothby2018) <span class="ev ev-mid" title="Bằng chứng vừa"></span> |
| Hỏi chuyện sâu thay vì chuyện xã giao | Sẽ ngượng | Bớt ngượng hơn dự đoán, gắn kết và vui hơn | [Kardas, Kumar & Epley 2022](#r-kardas2022) <span class="ev ev-mid" title="Bằng chứng vừa"></span> |
| Viết thư cảm ơn | Người nhận thấy ngượng | Người nhận bất ngờ và vui hơn, ít ngượng hơn so với dự đoán | [Kumar & Epley 2018](#r-kumar2018) <span class="ev ev-mid" title="Bằng chứng vừa"></span> |
| Khen một người | Họ sẽ thấy ngượng, không vui bằng thực tế | Họ vui hơn và ít ngượng hơn mình nghĩ | [Zhao & Epley 2021](#r-zhao2021) <span class="ev ev-mid" title="Bằng chứng vừa"></span> |
| Nhờ giúp đỡ | Bị từ chối | Ta đánh giá thấp khả năng người khác đồng ý, có khi tới 50% | [Flynn & Lake 2008](#r-flynn2008) <span class="ev ev-mid" title="Bằng chứng vừa"></span> |
| Từ chối một lời mời | Người mời giận, nghĩ mình không quan tâm | Hậu quả nhẹ hơn nhiều so với mình lo | [Givi 2024](#r-givi2024) <span class="ev ev-mid" title="Bằng chứng vừa"></span> |
| Nói thật lòng một điều khó nói | Người kia phản ứng tệ | Dễ chịu hơn, gắn kết hơn, ít tổn hại hơn dự đoán | [Levine & Cohen 2018](#r-levine2018) <span class="ev ev-mid" title="Bằng chứng vừa"></span> |

Vì sao sai lầm này không tự sửa được qua năm tháng? Hình dưới là một lời giải thích <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>, ghép từ các nghiên cứu trên:

```mermaid
flowchart LR
  A["① Dự đoán bi quan<br/>'họ sẽ thấy phiền'"] --> B["② Né tránh<br/>không hỏi, không nhờ,<br/>không nói thật"]
  B --> C["③ Không bao giờ thấy<br/>phản ứng thật của họ"]
  C --> D["④ Dự đoán bi quan<br/>được giữ nguyên"]
  D --> A
  B -.->|"⑤ thử một lần"| E["Phản ứng thật<br/>thường tốt hơn dự đoán"]
  E -.->|"⑥ thực tế sửa lại dự đoán"| A
```

Vòng ①–④ cứ thế tự duy trì: né tránh khiến mình không bao giờ thấy được chính điều có thể xoá nỗi sợ. Chỉ cần thử một lần (⑤) là thấy được phản ứng thật (⑥). Điều này cũng giải thích một phát hiện về cô đơn: trong các thử nghiệm ngẫu nhiên, can thiệp hiệu quả nhất không phải tạo thêm cơ hội gặp gỡ mà là **sửa những lối nghĩ sai về các mối quan hệ** — kiểu "người ta không muốn gặp mình" ([Masi 2011](#r-masi2011)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Hai lưu ý để không hiểu lầm. Thứ nhất, đây là xu hướng trung bình, không phải lần nào cũng vậy; bảng trên không bảo bạn bỏ qua tín hiệu thật từ một người cụ thể. Thứ hai, "thật lòng" trong nghiên cứu của Levine & Cohen là chia sẻ và góp ý chân thành, không phải nói thẳng một cách tàn nhẫn — [chương 5](#conflict) bàn chuyện nói thế nào.

<h2 id="conflict"><span class="num">5</span>Xung đột, xin lỗi, tha thứ và ranh giới</h2>

Xung đột không phải dấu hiệu một mối quan hệ đang hỏng; đó là chuyện tất yếu khi hai người có lợi ích riêng. Điều quyết định là **cách hai người vượt qua** nó. Chương này gồm bốn phần: thái độ khi bất đồng, cách nói và nghe, cách sửa sai khi mình có lỗi, và cách tha thứ mà không đánh mất mình.

<h3 id="dual-concern"><span class="num">5.1</span>Mềm với người, vững với điều mình cần</h3>

```mermaid
quadrantChart
  title Hai trục trong một cuộc bất đồng
  x-axis "Ít quan tâm đến người kia" --> "Quan tâm thật đến người kia"
  y-axis "Dễ buông điều mình cần" --> "Giữ vững điều mình cần"
  quadrant-1 "Cùng giải quyết vấn đề"
  quadrant-2 "Áp đảo"
  quadrant-3 "Né tránh"
  quadrant-4 "Nhượng bộ"
```

Hình trên là mô hình dual concern: một trục là mức mình quan tâm đến người kia, trục còn lại là mức mình giữ vững điều mình cần. Tổng hợp 28 nghiên cứu về thương lượng cho thấy người có động cơ **vì cả hai bên** ít gây hấn hơn, giải quyết vấn đề nhiều hơn và đạt kết quả chung tốt hơn — **nhưng chỉ khi họ đồng thời không dễ nhượng bộ** ([De Dreu, Weingart & Kwon 2000](#r-dedreu2000)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Tốt bụng mà dễ buông thì rơi vào góc "nhượng bộ": người kia được, mình mất, và vấn đề thật vẫn chưa được giải quyết. Giữ vững mà không quan tâm thì rơi vào góc "áp đảo". Góc tốt nhất đòi hỏi cả hai cùng lúc: *"Mình muốn chuyện này ổn cho cả hai, và đây là điều mình thật sự cần."*

Một yếu tố nữa ảnh hưởng tới xung đột: cảm giác **công bằng**. Tổng hợp 183 nghiên cứu cho thấy con người phân biệt bốn loại công bằng, và mỗi loại tác động riêng: kết quả có công bằng không (distributive), cách đi đến kết quả có công bằng không (procedural), mình có được đối xử tôn trọng không (interpersonal), và mình có được giải thích đầy đủ không (informational) ([Colquitt 2001](#r-colquitt2001)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Hệ quả thực tế: khi phải đưa ra một quyết định không làm ai vui, **cách** đưa ra — cho người kia được nói, giải thích lý do, giữ tôn trọng — vẫn ảnh hưởng rõ tới việc họ có chấp nhận quyết định ấy hay không <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="disagree"><span class="num">5.2</span>Khi bất đồng: hạ nhiệt, rồi lắng nghe</h3>

Hai điều ở các chương trước áp dụng ngay được ở đây. Xả giận không làm dịu, có khi còn làm giận thêm, còn hạ mức kích động thì làm dịu ([chương 3](#anger)) — vì vậy những cuộc nói chuyện khó nên diễn ra **sau** khi cả hai đã nguội. Và lắng nghe có tác dụng cụ thể: qua bốn thí nghiệm, khi người nói được lắng nghe chất lượng cao trong lúc bất đồng, họ thấy gắn kết hơn, bớt phòng thủ, tự hiểu mình hơn, và quan điểm của họ bớt cực đoan — cả quan điểm tự cảm nhận lẫn quan điểm đo được ([Itzchakov 2024](#r-itzchakov2024)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Khi được lắng nghe, người ta bớt cần phải thắng. Một trình tự gợi ý <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: hạ nhiệt → để người kia nói hết và nhắc lại điều mình hiểu → nói điều mình cần → cùng tìm cách đáp ứng cả hai.

<h3 id="apology"><span class="num">5.3</span>Khi mình sai: xin lỗi thế nào</h3>

Lòng tin có thể mất theo hai kiểu khác nhau, và cách lấy lại cũng khác. Hai thí nghiệm kinh điển so sánh xin lỗi với phủ nhận sau hai loại **cáo buộc** vi phạm, khi người quan sát chưa biết người kia có lỗi thật hay không ([Kim 2004](#r-kim2004)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>:

| | Vi phạm về **năng lực** (làm hỏng vì thiếu kỹ năng) | Vi phạm về **chính trực** (làm sai vì không trung thực) |
|---|---|---|
| Lấy lại lòng tin tốt hơn bằng | Xin lỗi, nhận trách nhiệm | Phủ nhận — nhưng **chỉ khi thật sự vô can** |
| Vì sao | Nhận lỗi năng lực không nói lên mình là người xấu | Nhận lỗi chính trực là thừa nhận một khiếm khuyết đạo đức |
| Nếu bằng chứng sau đó cho thấy ngược lại | Cách đó mất tác dụng: chỉ có lợi khi lời nói khớp với sự thật — có lỗi thì xin lỗi, vô can mới phủ nhận | |

Bài học không phải "chối khi lỗi chính trực". Bài học là: **đã mất lòng tin vì thiếu chính trực thì rất khó lấy lại**, nên hãy giữ nó ngay từ đầu. Khi đã sai, lời xin lỗi càng đầy đủ các thành phần thì càng hiệu quả, và xin lỗi có tác dụng sau vi phạm năng lực tốt hơn sau vi phạm chính trực ([Lewicki, Polin & Lount 2016](#r-lewicki2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Một lời xin lỗi đầy đủ thường gồm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: nói rõ mình đã làm gì, nhận trách nhiệm không kèm "nhưng", thừa nhận tác động lên người kia, và nói mình sẽ sửa thế nào.

<h3 id="forgive"><span class="num">5.4</span>Tha thứ, và giới hạn của tha thứ</h3>

Tha thứ — buông bỏ mong muốn trả đũa và lòng thù hằn — là điều học được, và có lợi cho chính người tha thứ. Tổng hợp 53 kết quả với 2.323 người: các chương trình hỗ trợ tha thứ hiệu quả hơn hẳn không làm gì (Δ = 0,56) và hơn các phương pháp khác (Δ = 0,45), đồng thời giảm trầm cảm, lo âu và tăng hy vọng; chương trình càng dài càng hiệu quả ([Wade 2014](#r-wade2014)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

Nhưng tha thứ có một điều kiện ít được nói tới. Theo dõi các cặp đôi, tha thứ **làm tăng** lòng tự trọng khi người có lỗi đã sửa sai, và **làm giảm** lòng tự trọng cùng sự rõ ràng về bản thân khi người đó không hề sửa — nhóm tác giả gọi là "doormat effect", hiệu ứng tấm thảm chùi chân ([Luchies 2010](#r-luchies2010)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

```mermaid
flowchart TD
  O["Bị tổn thương"] --> Q{"Người kia có nhận lỗi<br/>và sửa sai không?"}
  Q -->|"Có"| F["Tha thứ và hàn gắn<br/>→ lòng tự trọng tăng"]
  Q -->|"Không"| G["Buông hận thù trong lòng,<br/>nhưng giữ ranh giới:<br/>không tự đặt mình vào<br/>chỗ bị tổn thương lần nữa"]
  Q -.->|"Tha thứ trong quan hệ đang tiếp diễn<br/>dù họ không sửa gì"| D["Doormat effect<br/>→ lòng tự trọng giảm"]
```

Nhánh giữa ở hình trên là một suy luận <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: buông bỏ thù hận là việc diễn ra trong mình, còn **tin lại và quay lại** là một quyết định riêng, nên dựa trên hành vi thật của người kia. Hai việc này tách được. Ranh giới cũng bao gồm quyền nói "không": như bảng ở [chương 4](#expectation-gap), từ chối một lời mời gây hậu quả nhẹ hơn nhiều so với mình lo.

<h2 id="close-ties"><span class="num">6</span>Những người thân</h2>

<h3 id="ties-health"><span class="num">6.1</span>Các mối quan hệ là trụ cột</h3>

Một meta-analysis gồm 148 nghiên cứu với 308.849 người cho thấy người có quan hệ xã hội mạnh có khả năng sống sót cao hơn rõ rệt (OR = 1,50); khi quan hệ được đo bằng các thước đo tổng hợp nhiều mặt — tình trạng hôn nhân, quy mô mạng lưới, mức tham gia nhóm — con số là OR = 1,91 ([Holt-Lunstad 2010](#r-holtlunstad2010)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Một tổng hợp khác cho thấy cô lập xã hội, cảm giác cô đơn và sống một mình đều gắn với nguy cơ tử vong cao hơn (OR lần lượt 1,29, 1,26 và 1,32), rõ hơn ở người dưới 65 tuổi ([Holt-Lunstad 2015](#r-holtlunstad2015)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Đây là dữ liệu quan sát, nên chưa tách hết được nhân quả; nhưng các tác giả xếp độ lớn này ngang với những yếu tố nguy cơ tử vong đã được công nhận như hút thuốc và rượu bia ([Holt-Lunstad 2010](#r-holtlunstad2010)).

Các mối quan hệ còn mang lại những giờ dễ chịu nhất trong ngày. Khi 909 phụ nữ đi làm kể lại ngày hôm trước và chấm cảm xúc tích cực cho từng hoạt động:

```chart hbar
hoạt động,cảm xúc tích cực (thang 0–6)
Gần gũi người yêu,5.10
Gặp gỡ trò chuyện,4.59
Thư giãn,4.42
Làm việc,3.62
Đi lại,3.45
```

<p class="src">5 trong 16 hoạt động. Nguồn: Kahneman et al. 2004, Science, Day Reconstruction Method. Theo người cùng hoạt động: bạn bè 4,36, họ hàng 4,17, vợ/chồng 4,11, sếp 3,52. Mẫu thuận tiện, chỉ gồm phụ nữ.</p>

Làm việc — phần chiếm nhiều giờ nhất trong ngày (6,9 giờ) — và đi lại nằm ở cuối bảng ([Kahneman 2004](#r-kahneman2004)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Những giờ tốt nhất trong ngày thường nằm ngoài giờ làm, và ở cùng người khác.

<h3 id="ties-daily"><span class="num">6.2</span>Những điều nhỏ giữ gìn một mối quan hệ</h3>

```mermaid
flowchart LR
  S["Stress từ bên ngoài<br/>(công việc, tiền, kế hoạch quá tải)"] -->|"① mang tâm trạng xấu<br/>về nhà"| M["Ít kiên nhẫn,<br/>ít chú ý"]
  M -->|"② cùng tối đó"| B["Giận, thu mình<br/>với người thân"]
  S -->|"③ lấy mất thời gian<br/>và sự chú ý"| T["Ít khoảnh khắc<br/>gần gũi bên nhau"]
  B --> Q["Chất lượng<br/>quan hệ giảm"]
  T --> Q
```

1. **Stress từ bên ngoài ảnh hưởng tới chuyện hai người.** Tổng quan 115 nghiên cứu dọc về hôn nhân cho thấy stress dự báo hôn nhân kém hài lòng và kém bền hơn theo thời gian, và đề xuất rằng stress tác động qua chính cách hai người đối xử với nhau — mô hình vulnerability–stress–adaptation ([Karney & Bradbury 1995](#r-karney1995)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; stress lấy mất thời gian và sự chú ý vốn dành cho những việc vun đắp sự gần gũi ([Neff & Karney 2017](#r-neff2017)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.
2. **Bực bội ở công ty dễ bị mang về nhà ngay tối đó.** Theo dõi nhật ký 43 cặp vợ chồng: những ngày có tương tác tiêu cực ở chỗ làm, cả hai đều giận dữ và thu mình hơn với nhau, một phần qua trung gian là tâm trạng xấu ([Story & Repetti 2006](#r-story2006)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Một khoảng đệm ngắn sau giờ làm — đi bộ, tắm, mười phút yên tĩnh — trước khi bước vào cuộc trò chuyện là một cách chặn bước ① <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.
3. **Thứ bị ảnh hưởng nhiều nhất là thời gian bên nhau ③.** Vì thế những thói quen nhỏ có giá trị lớn.

Bốn thói quen nhỏ có bằng chứng:

- **Cách đáp lại tin vui quan trọng hơn cách đáp lại tin buồn.** Có bốn kiểu đáp lại khi người thân khoe một tin vui: hào hứng, hỏi thêm (active-constructive); khen nhạt "ừ, tốt đấy" (passive-constructive); dội nước lạnh "rồi lo được không?" (active-destructive); lờ đi, chuyển sang chuyện mình (passive-destructive). Chỉ kiểu đầu gắn với quan hệ tốt hơn ([Gable 2004](#r-gable2004)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, và cách đáp lại tin vui dự báo chất lượng quan hệ và khả năng chia tay hai tháng sau rõ hơn cách đáp lại tin buồn ([Gable 2006](#r-gable2006)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.
- **Để ý và biết ơn những điều nhỏ.** Trong nhật ký hằng ngày của các cặp sống chung, lòng biết ơn hôm nay dự báo cảm giác gắn kết và hài lòng tăng lên vào ngày hôm sau — ở cả hai người ([Algoe, Gable & Maisel 2010](#r-algoe2010)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.
- **Cất điện thoại khi ở bên nhau.** "Phubbing" — dùng điện thoại khi đang ở với người kia — đi kèm mức hài lòng thấp hơn và xung đột cao hơn qua 52 nghiên cứu với 19.698 người ([Ni 2025](#r-ni2025)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>, dù phần lớn là dữ liệu cắt ngang.
- **Làm điều mới lạ cùng nhau.** Chỉ bảy phút cùng làm một việc mới lạ, hơi thử thách trong phòng thí nghiệm đã tăng chất lượng quan hệ so với làm việc quen thuộc ([Aron 2000](#r-aron2000)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

<h3 id="ties-friends"><span class="num">6.3</span>Tình bạn cần được vun đắp</h3>

Tình bạn **phai nhanh hơn quan hệ họ hàng** khi liên lạc và hoạt động chung giảm đi ([Roberts & Dunbar 2011](#r-roberts2011)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>: gia đình chịu được thời gian xa cách, bạn bè thì cần liên lạc đều. Con số "150 người" của Dunbar, nếu coi là một giới hạn cứng, cũng không có cơ sở vững — phân tích lại cho khoảng tin cậy từ 4 tới 520, và các tác giả kết luận chỉ ra một con số cụ thể là vô ích ([Lindenfors 2021](#r-lindenfors2021)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Điều quan trọng không phải có bao nhiêu bạn, mà là những người quan trọng có được gặp đều hay không <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="ties-giving"><span class="num">6.4</span>Cho đi, và cách nâng đỡ người đang gặp khó khăn</h3>

Chăm sóc người khác cũng là chăm sóc chính mình, ở mức vừa phải. Hành vi giúp đỡ tương quan với well-being r = 0,13 qua 201 nghiên cứu với 198.213 người, và **giúp trực tiếp, không qua tổ chức** (informal helping) gắn với lợi ích nhiều hơn giúp qua tổ chức ([Hui 2020](#r-hui2020)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Hành động tử tế làm tăng well-being của chính người làm, δ = 0,28, dù các nghiên cứu còn nhỏ và chỉ đo ngắn hạn ([Curry 2018](#r-curry2018)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Tiêu tiền cho người khác làm mình vui hơn — nhưng bản lặp lại đăng ký trước cho kết quả lẫn lộn và nhỏ ([Aknin 2020](#r-aknin2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Và một kết quả lạ mà đáng nhớ: **cho đi thời gian làm người ta thấy mình có nhiều thời gian hơn**, hơn cả dùng thời gian đó cho bản thân ([Mogilner 2012](#r-mogilner2012)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Khi người thân đang gặp chuyện, cách mình giúp cũng quan trọng. Theo dõi các cặp đôi khi một người đang chuẩn bị cho một kỳ thi căng thẳng, kiểu hỗ trợ giúp người đó thích nghi tốt nhất là hỗ trợ **kín đáo** — người kia có làm, nhưng người nhận không nhận ra mình đang "được giúp" ([Bolger, Zuckerman & Kessler 2000](#r-bolger2000)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Nghĩa là: làm giúp một việc, ở bên, lắng nghe, thường tốt hơn một bài giảng về cách vượt qua <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Và hỗ trợ là đường hai chiều: sau sang chấn, được hỗ trợ dự báo triệu chứng PTSD nhẹ hơn về sau, và triệu chứng nặng cũng dự báo ít được hỗ trợ hơn về sau, với độ lớn tương đương nhau ([Wang 2021](#r-wang2021ptsd)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — người đang khổ lại dễ nhận được ít hỗ trợ hơn, đúng lúc cần nhất.

<div class="recall">

**Câu hỏi nhớ lại — Phần II.**

<details><summary>"Đặt mình vào vị trí người khác" có làm mình hiểu họ đúng hơn không? Điều gì thì có?</summary><div class="inner">

Không — tưởng tượng góc nhìn của họ không tăng độ chính xác (nhìn chung còn giảm), dù đôi lúc làm mình tự tin hơn. Hỏi và lắng nghe thì có (Eyal, Steffel & Epley 2018).

</div></details>

<details><summary>Vì sao nỗi ngại giao tiếp không tự mất đi theo thời gian?</summary><div class="inner">

Vì né tránh khiến mình không bao giờ thấy được chính điều có thể sửa dự đoán bi quan. Thực tế, người khác thích mình hơn, sẵn lòng giúp hơn, và đón nhận lời cảm ơn, lời khen, sự thật lòng tốt hơn mình nghĩ.

</div></details>

<details><summary>Trong thương lượng, tốt bụng đã đủ chưa?</summary><div class="inner">

Chưa. Động cơ vì cả hai bên chỉ đem lại kết quả tốt khi đi kèm việc không dễ nhượng bộ (De Dreu 2000): mềm với người, vững với điều mình cần.

</div></details>

<details><summary>Khi nào tha thứ làm mình mạnh lên, khi nào làm mình mất dần lòng tự trọng?</summary><div class="inner">

Mạnh lên khi người kia đã sửa sai; mất dần lòng tự trọng khi họ không sửa gì mà mình vẫn tha thứ, trong một quan hệ vẫn đang tiếp diễn — doormat effect (Luchies 2010). Buông thù hận và tin lại là hai quyết định tách riêng.

</div></details>

<details><summary>Người thân kể một tin vui. Kiểu đáp lại nào vun đắp quan hệ?</summary><div class="inner">

Active-constructive: hào hứng, hỏi thêm, vui cùng (Gable 2004, 2006).

</div></details>

</div>


<h2 id="part-3" class="part">Phần III — Một đời đáng sống</h2>

<h2 id="good-life"><span class="num">7</span>Thế nào là một đời đáng sống</h2>

Câu hỏi này nghe như chuyện triết học, nhưng có những phần đo được. Chương này không đưa ra một định nghĩa duy nhất, mà cho thấy một đời tốt có **nhiều tầng**, và mỗi tầng được bồi đắp bởi những thứ khác nhau. Nhầm tầng này với tầng kia là nguồn gốc của rất nhiều lựa chọn sai.

```mermaid
flowchart TB
  subgraph DAY["Từng ngày"]
    E["① Trải nghiệm<br/>vui, buồn, căng thẳng<br/>trong từng giờ"]
  end
  subgraph LIFE["Cả đời"]
    V["② Đánh giá cuộc sống<br/>khi nhìn lại"]
    M["③ Ý nghĩa<br/>mạch lạc · có hướng đi · đáng sống"]
  end
  N["④ Ba nhu cầu nền<br/>tự chủ · năng lực · gắn kết"] --> E
  N --> V
  N --> M
  W["⑤ Trí tuệ<br/>cách suy xét chuyện đời"] --> V
```

<h3 id="two-wellbeing"><span class="num">7.1</span>Hai thước đo: sống từng giờ và nhìn lại cả đời</h3>

Phân tích hơn 450.000 câu trả lời khảo sát cho thấy hai loại well-being có những nguồn khác nhau ([Kahneman & Deaton 2010](#r-kahneman2010)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. **Emotional well-being** (① trong hình) là chất lượng cảm xúc của những giờ đã sống: vui, căng thẳng, buồn, giận, trìu mến. **Life evaluation** (②) là điều người ta nghĩ khi được hỏi cuộc đời mình đang ở bậc nào. Thu nhập và học vấn gắn chặt với life evaluation; còn sức khoẻ, việc chăm sóc người khác, sự cô đơn và hút thuốc gắn mạnh hơn với cảm xúc hằng ngày.

Chuyện tiền và hạnh phúc là một ví dụ hay về cách khoa học tự sửa sai. Năm 2010, dữ liệu cho thấy cảm xúc hằng ngày ngừng tăng quanh mức thu nhập 75.000 USD một năm ([Kahneman & Deaton 2010](#r-kahneman2010)). Một nghiên cứu sau đó, đo cảm xúc ngay trong lúc người ta đang sống, lại thấy hạnh phúc vẫn tăng. Hai bên — kể cả Kahneman — cùng phân tích lại và đi đến kết luận chung: với phần lớn mọi người, hạnh phúc tăng đều theo logarit của thu nhập; hiện tượng "chững lại" (quanh 100.000 USD) chỉ xuất hiện ở **khoảng 15–20% người kém hạnh phúc nhất** — các tác giả đoán rằng đó là những nỗi khổ mà thu nhập cao không xoá được ([Killingsworth, Kahneman & Mellers 2023](#r-killingsworth2023)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. "Theo logarit" nghĩa là: tăng từ 10 lên 20 triệu cũng có tác dụng như từ 50 lên 100 triệu — mỗi lần *gấp đôi* mới cho thêm một nấc tương đương.

Trải nghiệm từng giờ còn phụ thuộc vào một thứ không tốn đồng nào: **tâm trí mình có đang ở đây hay không**. Khi người ta được nhắn tin hỏi ngẫu nhiên trong ngày, họ nghĩ về những điều *không* đang diễn ra gần như thường xuyên như nghĩ về điều đang diễn ra, và điều đó thường làm họ kém vui hơn ([Killingsworth & Gilbert 2010](#r-killingsworth2010)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

<h3 id="needs"><span class="num">7.2</span>Ba nhu cầu nền</h3>

Self-determination theory cho rằng con người có ba nhu cầu tâm lý cơ bản: **tự chủ** — cảm giác hành động của mình là do mình chọn; **năng lực** — cảm giác mình làm tốt được việc mình làm; và **gắn kết** — cảm giác được kết nối, được quan tâm ([Ryan & Deci 2000](#r-ryan2000)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Khi ba nhu cầu này được đáp ứng, động lực tự thân và well-being phát triển; khi không được đáp ứng, cả hai suy giảm. Dữ liệu từ 123 quốc gia cho thấy việc đáp ứng nhu cầu gắn với well-being ở mọi vùng trên thế giới: life evaluation gắn nhiều nhất với nhu cầu cơ bản (ăn, ở); cảm xúc tích cực gắn nhiều nhất với nhu cầu xã hội và được tôn trọng; cảm xúc tiêu cực gắn với thiếu nhu cầu cơ bản, thiếu tôn trọng và thiếu tự chủ — kể cả sau khi đã tính thu nhập ([Tay & Diener 2011](#r-tay2011)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

Ba nhu cầu này là một kim chỉ nam dùng được hằng ngày <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Một công việc lương cao nhưng không có chút tự chủ, một mối quan hệ an toàn nhưng không ai thật sự hiểu mình, một kế hoạch học hành dày đặc nhưng không bao giờ thấy mình tiến bộ — mỗi thứ đều thiếu một trong ba, và cảm giác "có đủ mà vẫn thấy trống rỗng" thường bắt nguồn từ đó.

<h3 id="meaning"><span class="num">7.3</span>Ý nghĩa</h3>

"Ý nghĩa cuộc sống" gồm ba phần khác nhau ([Martela & Steger 2016](#r-martela2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>: **coherence** — cuộc đời mình có mạch lạc, các mảnh ghép khớp với nhau; **purpose** — có những mục tiêu cốt lõi và một hướng đi; **significance** — cảm giác cuộc đời mình có giá trị, đáng sống. Ba phần này không phải lúc nào cũng đi cùng nhau: một người có thể có hướng đi rõ mà vẫn thấy đời mình không đáng giá, hoặc ngược lại.

Purpose có một mối liên hệ đáng chú ý với sức khoẻ. Gộp 10 nghiên cứu tiến cứu với 136.265 người, người có purpose cao hơn có nguy cơ tử vong thấp hơn (RR = 0,83) và ít biến cố tim mạch hơn (RR = 0,83) ([Cohen, Bavishi & Rozanski 2016](#r-cohen2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — dữ liệu quan sát, nên một phần có thể do người khoẻ dễ có mục đích hơn. Ý nghĩa cũng đến từ công việc: tổng hợp 44 bài với 23.144 người cho thấy cảm giác công việc có ý nghĩa tương quan rất mạnh (r từ 0,70 trở lên) với sự gắn bó và hài lòng trong công việc, và ở mức vừa đến lớn (độ lớn r khoảng 0,44–0,49) với hài lòng cuộc sống, ý nghĩa cuộc sống, sức khoẻ, cùng tương quan âm với ý định nghỉ việc ([Allan 2019](#r-allan2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

<h3 id="wisdom"><span class="num">7.4</span>Trí tuệ khác trí thông minh</h3>

Người ta thường nghĩ ai suy luận giỏi hơn sẽ sống tốt hơn. Trên một mẫu ngẫu nhiên người Mỹ, **trí thông minh không liên quan tới well-being**; còn **wise reasoning** — cách người ta suy xét những xung đột xã hội trong đời — thì gắn với hài lòng cuộc sống cao hơn, ít cảm xúc tiêu cực hơn, quan hệ tốt hơn, ít nghĩ quẩn hơn, và sống thọ hơn, kể cả khi đã tính điều kiện kinh tế, khả năng ngôn ngữ và tính cách ([Grossmann 2013](#r-grossmann2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Các nhà nghiên cứu trí tuệ đã thống nhất một định nghĩa chung: trí tuệ là **dùng metacognition — suy nghĩ về chính cách mình suy nghĩ — một cách có nền tảng đạo đức** khi suy luận và giải quyết vấn đề ([Grossmann 2020](#r-grossmann2020)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Biết giới hạn hiểu biết của mình, xét nhiều góc nhìn, tìm cách dung hoà — và như [chương 3](#distance) đã cho thấy, những điều này dễ làm hơn khi mình đứng ra ngoài chuyện của chính mình.

<h3 id="remembered"><span class="num">7.5</span>Cuộc đời mình sống và cuộc đời mình nhớ</h3>

```mermaid
flowchart LR
  subgraph SHORT["Lần ngắn"]
    A1["60 giây<br/>nước 14 °C"] --> A2["Kết thúc<br/>lúc đang đau nhất"]
  end
  subgraph LONG["Lần dài"]
    B1["Cùng 60 giây<br/>nước 14 °C"] --> B2["Thêm 30 giây, nước ấm dần<br/>lên 15 °C: vẫn đau, nhưng đỡ hơn"]
    B2 --> B3["Kết thúc<br/>lúc đã đỡ"]
  end
  A2 -->|"① tổng đau ít hơn"| Q{"Lặp lại lần nào?"}
  B3 -->|"② tổng đau nhiều hơn,<br/>kết thúc nhẹ hơn"| Q
  Q -->|"③ đa số chọn"| L["Lần dài"]
```

<p class="src">Thiết kế thí nghiệm theo Kahneman, Fredrickson, Schreiber & Redelmeier 1993, Psych Sci 4(6):401–405.</p>

Người tham gia trải qua cả hai lần, rồi được chọn lặp lại một lần. Đa số chọn lặp lại **lần dài** — tức là chọn chịu nhiều đau hơn — vì lần đó **kết thúc** nhẹ hơn. Ký ức về một trải nghiệm khó chịu bị chi phối bởi khoảnh khắc tệ nhất và khoảnh khắc cuối cùng, còn độ dài gần như không được tính ([Kahneman 1993](#r-kahneman1993b)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Đây là peak–end rule.

Hệ quả là có hai "cái tôi" cùng chấm điểm cuộc đời: cái tôi đang trải nghiệm và cái tôi hồi tưởng, và ta thường ra quyết định theo cái tôi hồi tưởng. Có thể dùng điều này theo hai cách <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Một mặt, **kết thúc** của một ngày, một chuyến đi, một cuộc nói chuyện đáng được chăm chút, vì phần kết quyết định ta nhớ về cả trải nghiệm thế nào. Mặt khác, đừng để ký ức một mình quyết định thay cho những gì mình thật sự trải qua: một công việc có "điểm sáng" để kể nhưng làm mình khổ mỗi ngày vẫn là một công việc làm mình khổ mỗi ngày.

<h3 id="happiness-exercises"><span class="num">7.6</span>Bài tập hạnh phúc: có tác dụng, nhưng nhỏ</h3>

Các positive psychology interventions — viết nhật ký biết ơn, làm việc tốt, viết về "phiên bản tốt nhất của mình" — có tác dụng thật nhưng nhỏ. Tổng hợp 39 thử nghiệm ngẫu nhiên với 6.139 người cho hiệu ứng (standardized mean difference) 0,34 với subjective well-being và 0,20 với psychological well-being — quy ra r khoảng 0,17 và 0,10, còn lại một phần sau 3–6 tháng, kèm dấu hiệu publication bias ([Bolier 2013](#r-bolier2013)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Phân tích lại có hiệu chỉnh cho các nghiên cứu mẫu nhỏ thì hiệu ứng lên well-being còn khoảng r = 0,10, và hiệu ứng lên trầm cảm thường không có ý nghĩa thống kê ([White, Uttl & Holder 2019](#r-white2019)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Riêng bài tập biết ơn, so với một hoạt động khác thì hiệu ứng lên well-being chỉ d = 0,17 ([Davis 2016](#r-davis2016)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Kết luận thẳng thắn: những bài tập này là gia vị, không phải món chính. Món chính vẫn là những thứ ở hình đầu chương — quan hệ, sự tự chủ, việc mình làm tốt và thấy có ý nghĩa, một cơ thể khoẻ.

<h2 id="autonomy"><span class="num">8</span>Không bị chi phối</h2>

"Bị chi phối" ở đây không có nghĩa là bị ai ép, mà là khi lựa chọn của mình bị những tác động mình **không hề chọn** quyết định thay, và nếu dừng lại nghĩ kỹ, **mình cũng không tán thành**. Năm tác động như vậy có bằng chứng rõ ràng, và mỗi tác động có một lá chắn tương ứng.

```mermaid
flowchart LR
  F1["① Mục tiêu ngoại tại<br/>tiền, hình ảnh, danh tiếng"] -.- S1["Mục tiêu nội tại"]
  F2["② So sánh với người hơn mình"] -.- S2["Thước đo của chính mình"]
  F3["③ Đám đông và quyền uy"] -.- S3["Biết cơ chế,<br/>có người phản biện"]
  F4["④ Kỹ thuật thao túng"] -.- S4["Gọi tên được kỹ thuật"]
  F5["⑤ Thiết kế giành sự chú ý"] -.- S5["Friction và default"]
```

<h3 id="intrinsic"><span class="num">8.1</span>Mục tiêu nội tại và ngoại tại</h3>

Ở người trưởng thành, việc coi trọng **mục tiêu ngoại tại** — thành công tài chính, ngoại hình hấp dẫn, được xã hội công nhận — hơn các mục tiêu khác đi kèm sức sống thấp hơn, ít cảm giác phát triển bản thân hơn, nhiều triệu chứng cơ thể hơn; còn coi trọng **mục tiêu nội tại** — chấp nhận bản thân, gắn bó với người khác, đóng góp cho cộng đồng, sức khoẻ — đi kèm well-being cao hơn ([Kasser & Ryan 1996](#r-kasser1996)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Tổng hợp 753 kết quả từ 259 mẫu cho thấy mức độ nhất quán của mối liên hệ ([Dittmar 2014](#r-dittmar2014)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>:

| Cách đo chủ nghĩa vật chất | Tương quan với well-being (r) |
|---|---|
| Giá trị và niềm tin vật chất (đo nhiều mặt) | −0,19 |
| Tầm quan trọng tương đối của mục tiêu vật chất | −0,16 |
| Chỉ đo mức coi trọng tiền | −0,08 đến −0,11 |
| *Theo loại kết quả, mạnh nhất:* hành vi rủi ro cho sức khoẻ, tiêu dùng rủi ro, tự đánh giá tiêu cực | −0,28 đến −0,44 |
| *Theo loại kết quả, yếu nhất:* hài lòng cuộc sống, cảm xúc tiêu cực | −0,13 đến −0,15 |

Đây là tương quan, và cỡ nhỏ đến vừa. Nhưng chiều hướng ấy khớp với [chương 7](#needs): mục tiêu ngoại tại thường không đáp ứng ba nhu cầu nền, và chúng đặt thước đo giá trị bản thân vào tay người khác. Cần đọc đúng: vấn đề không phải là *có* tiền hay *muốn* có tiền — [chương 10](#money) cho thấy tiền có ích thật — mà là để tiền **chiếm chỗ** của những thứ nội tại.

<h3 id="comparison"><span class="num">8.2</span>So sánh</h3>

Tổng hợp hơn 60 năm nghiên cứu về so sánh xã hội cho thấy hai điều ([Gerber, Wheeler & Suls 2018](#r-gerber2018)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Khi không bị đe doạ, người ta **thích so sánh với người hơn mình** (so sánh lên). Và phản ứng phổ biến nhất trước một phép so sánh là **contrast**: thấy người hơn thì mình thấy mình kém đi, rõ nhất ở đánh giá năng lực và cảm xúc. Mạng xã hội bày ra trước mắt mình không ngớt những người hơn mình, mà toàn là phiên bản đã được chọn lọc <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

Một dạng so sánh ngầm là **maximizing** — luôn đi tìm phương án tốt nhất thay vì một phương án đủ tốt. Những người đạt điểm cao trên thang đo maximizing tìm được việc có lương khởi điểm cao hơn 20%, nhưng lại kém hài lòng hơn với công việc đó và cảm thấy tệ hơn trong suốt quá trình tìm việc ([Iyengar, Wells & Schwartz 2006](#r-iyengar2006)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; maximizing cũng tương quan với ít hạnh phúc hơn, nhiều hối tiếc hơn, và bị so sánh lên tác động nhiều hơn ([Schwartz 2002](#r-schwartz2002)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Tuy vậy, một thang đo được thiết kế tốt hơn lại không thấy maximizing gắn với bất mãn cuộc sống, nên phần "maximizer thì bất hạnh" có thể một phần do cách đo ([Diab, Gillespie & Highhouse 2008](#r-diab2008)) <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span>. Điều có thể rút ra là cơ chế — Iyengar và cộng sự thấy hiệu ứng đi qua việc maximizer dựa nhiều vào nguồn thông tin bên ngoài: khi thước đo nằm bên ngoài mình — "tốt nhất có thể", "hơn người kia" — thì không bao giờ thoả mãn trọn vẹn được <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="conformity"><span class="num">8.3</span>Đám đông và quyền uy</h3>

Trong thí nghiệm Asch kinh điển, người tham gia phải nói đoạn thẳng nào dài bằng đoạn mẫu, sau khi nghe cả nhóm — thực ra là người của nhóm nghiên cứu — lần lượt nói cùng một đáp án sai rõ ràng. Tổng hợp 133 nghiên cứu kiểu này từ 17 nước cho thấy mức chạy theo đám đông ở Mỹ đã giảm từ thập niên 1950, và **các nước đề cao tập thể có mức chạy theo cao hơn** các nước đề cao cá nhân ([Bond & Smith 1996](#r-bond1996)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Quyền uy là một tác động mạnh khác: khi thí nghiệm vâng lời của Milgram được lặp lại một phần năm 2006 với 70 người — dừng ở mốc 150 volt để bảo vệ người tham gia — tỷ lệ vâng lời chỉ thấp hơn một chút so với 45 năm trước, và việc thấy một người khác từ chối **không** làm người ta vâng lời ít đi ([Burger 2009](#r-burger2009)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.

Chưa có bằng chứng vững rằng chỉ cần biết những kết quả này là đủ miễn nhiễm <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Nhưng có hai thói quen hợp lý <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: khi thấy mình định làm một điều chỉ vì "ai cũng vậy" hay "người trên bảo vậy", **tách câu hỏi "điều này có đúng không" khỏi câu hỏi "ai đang nói"**; và có sẵn ít nhất một người mình tin, dám nói điều trái ý mình.

<h3 id="manipulation"><span class="num">8.4</span>Gọi tên được kỹ thuật thao túng</h3>

Một lá chắn có bằng chứng tốt là **psychological inoculation** — "tiêm phòng" bằng cách cho người ta thấy trước, ở liều nhỏ, các kỹ thuật thao túng thường gặp. Năm video ngắn, mỗi video giải thích một kỹ thuật — ngôn ngữ đánh vào cảm xúc, lập luận rời rạc mâu thuẫn, ép chọn một trong hai (false dichotomy), đổ lỗi cho một nhóm (scapegoating), công kích con người thay vì lập luận (ad hominem) — giúp người xem nhận ra kỹ thuật thao túng tốt hơn và phân biệt nội dung đáng tin tốt hơn, qua sáu thử nghiệm ngẫu nhiên với 6.464 người và một thí nghiệm thật trên YouTube với 22.632 người ([Roozenbeek 2022](#r-roozenbeek2022)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Cơ chế đáng nhớ: không cần kiểm tra từng tin; chỉ cần **nhận ra những dấu hiệu quen thuộc** của một lời thao túng. Khi một nội dung làm mình giận ngay lập tức, chỉ cho mình hai lựa chọn, hay đổ hết lỗi lên một nhóm người, đó là lúc nên chậm lại <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="attention"><span class="num">8.5</span>Sự chú ý là thứ bị tranh giành</h3>

Dopamine mã hoá sai lệch giữa phần thưởng nhận được và phần thưởng dự đoán — reward prediction error — và động lực *muốn*, chứ không phải khoái cảm *thích* ([Schultz 1997](#r-schultz1997); [Berridge & Robinson 1998](#r-berridge1998)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Một feed vô tận và không đoán trước được có thể khiến ta cứ muốn lướt tiếp mà không hề thấy thích: người ta có thể lướt rất lâu mà không thấy vui <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>. Phần đáng nói nhất là con số này: khi được cho cơ hội đặt giới hạn thời gian dùng, 78% người dùng chọn đặt giới hạn ràng buộc, giới hạn giảm thời gian dùng 22 phút mỗi ngày, và mô hình ước tính **31%** thời gian dùng mạng xã hội đến từ vấn đề tự kiểm soát — phần mà chính người dùng không muốn ([Allcott, Gentzkow & Song 2022](#r-allcott2022)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Tắt Facebook bốn tuần giải phóng 60 phút mỗi ngày, tăng well-being 0,09 độ lệch chuẩn, và sau thí nghiệm người ta vẫn dùng ít hơn ([Allcott 2020](#r-allcott2020)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

Cần giữ cân bằng: nghiên cứu tương quan trên 355.358 thanh thiếu niên cho thấy công nghệ chỉ giải thích tối đa 0,4% khác biệt về well-being ([Orben & Przybylski 2019](#r-orben2019)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Feed không phải chất độc; vấn đề là feed **lấy mất thời gian** của những thứ ở [chương 6](#close-ties) và [chương 7](#needs), và làm điều đó trái với ý mình. Lá chắn hiệu quả là **friction** — thêm một chút bất tiện trước khi mở — chứ không phải ý chí: một ứng dụng chèn thêm một bước chờ trước khi mở mạng xã hội, kèm nút "thôi" dễ bấm, làm 36% lần định mở bị bỏ và tổng số lần mở giảm 57% — còn một thông điệp "hãy nghĩ lại" đơn thuần thì không có tác dụng ([Grüning 2023](#r-gruning2023)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Đây chính là nguyên lý ở [chương 2](#situation): đổi tình huống trước, đừng chờ thắng ở khoảnh khắc chọn.

<h2 id="body"><span class="num">9</span>Cơ thể</h2>

Phần này ngắn vì các khuyến nghị về sức khoẻ có đồng thuận cao và ít bất ngờ. Điều có giá trị là **biết con số thật** và **biết những niềm tin sai phổ biến**.

<h3 id="sleep"><span class="num">9.1</span>Ngủ</h3>

Đồng thuận của các hiệp hội y học giấc ngủ Mỹ là người trưởng thành nên ngủ **7 tiếng trở lên** mỗi đêm, đều đặn ([Watson 2015](#r-watson2015)) <span class="ev ev-high" title="Bằng chứng mạnh"></span> — đó là thời gian *ngủ*, nên thời gian nằm trên giường phải dài hơn. Thiếu ngủ nguy hiểm vì người thiếu ngủ không nhận ra: chỉ cho nằm giường sáu tiếng mỗi đêm trong hai tuần làm suy giảm sự tỉnh táo và trí nhớ làm việc ngang với một đêm thức trắng, bốn tiếng thì ngang với hai đêm, trong khi người ngủ thiếu phần lớn không nhận ra ([Van Dongen 2003](#r-vandongen2003)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. **Đều đặn** quan trọng không kém: sinh viên ngủ thất thường có đồng hồ sinh học muộn hơn khoảng hai tiếng rưỡi so với người ngủ đều ([Phillips 2017](#r-phillips2017)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; trên 60.977 người, nhóm ngủ đều đặn có nguy cơ tử vong thấp hơn 20–48% so với nhóm thất thường nhất ([Windred 2024](#r-windred2024)) <span class="ev ev-mid" title="Bằng chứng vừa"></span> — kết quả quan sát. Hai chất ảnh hưởng mạnh: caffeine — một ly cà phê khoảng 107 mg nên cách giờ ngủ ít nhất 8,8 tiếng, và caffeine làm tổng thời gian ngủ giảm trung bình 45 phút ([Gardiner 2023](#r-gardiner2023)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>; và rượu — kể cả liều thấp, tới 0,5 g mỗi kg cân nặng (với người 60 kg là khoảng 30 g, tức hơn hai lon bia 330 ml loại 5%), cũng làm rối giấc REM ([Gardiner 2025](#r-gardiner2025)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>.

<h3 id="movement"><span class="num">9.2</span>Vận động</h3>

Hướng dẫn của WHO cho người trưởng thành là 150–300 phút vận động vừa hoặc 75–150 phút vận động mạnh mỗi tuần, cộng với tập sức mạnh cho các nhóm cơ chính từ hai ngày mỗi tuần; và hai câu đáng nhớ: vận động **bao lâu cũng được tính** ("bouts of any duration now count"), và "some physical activity is better than none" ([Bull 2020](#r-bull2020)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Lợi ích tăng nhanh ở đoạn đầu rồi chững lại: nguy cơ tử vong giảm dần tới khoảng 8.000–10.000 bước mỗi ngày ở người dưới 60 tuổi ([Paluch 2022](#r-paluch2022)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; tập sức mạnh gắn với nguy cơ thấp hơn 10–17%, lợi ích lớn nhất quanh 30–60 phút mỗi tuần ([Momma 2022](#r-momma2022)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Vận động còn có ích thật cho tâm trạng: tập luyện giảm triệu chứng trầm cảm và lo âu, dù phần lớn các bài tổng quan có chất lượng thấp ([Singh 2023](#r-singh2023b)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>; với người được chẩn đoán trầm cảm (major depressive disorder), đi bộ hoặc chạy, yoga và tập sức mạnh đều có tác dụng, dù độ tin cậy của bằng chứng còn thấp; tác giả đề xuất cân nhắc vận động như một cách điều trị chính, bên cạnh tâm lý trị liệu và thuốc ([Noetel 2024](#r-noetel2024)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Đang điều trị thì bàn với bác sĩ, đừng tự bỏ <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>.

<h3 id="food"><span class="num">9.3</span>Ăn</h3>

Khuyến nghị của WHO cho người trưởng thành ([WHO 2026](#r-whodiet)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>: ít nhất **400 g rau và trái cây** mỗi ngày; đường tự do dưới **10%** tổng năng lượng, và giảm xuống 5% trở xuống có thể có thêm lợi ích; tổng chất béo không quá 30% năng lượng, chất béo trans không quá 1%; muối **dưới 5 g mỗi ngày**. Ba nghiên cứu đáng biết thêm:

- **Đồ ăn siêu chế biến làm ăn nhiều hơn.** Hai mươi người sống nội trú hai tuần với chế độ siêu chế biến và hai tuần với chế độ chưa chế biến, được ăn tuỳ thích: chế độ siêu chế biến làm họ ăn thêm **508 kcal mỗi ngày** và tăng 0,9 kg; chế độ chưa chế biến thì giảm 0,9 kg ([Hall 2019](#r-hall2019upf)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>.
- **Chế độ Địa Trung Hải có bằng chứng thử nghiệm.** Ở người có nguy cơ tim mạch cao, chế độ Địa Trung Hải kèm dầu ô liu nguyên chất hoặc các loại hạt giảm biến cố tim mạch lớn (HR 0,69 và 0,72) so với nhóm đối chứng được khuyên ăn ít chất béo ([Estruch 2018](#r-estruch2018)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Bản công bố đầu tiên năm 2013 đã bị rút vì lỗi phân nhóm ngẫu nhiên; con số trên là của bản phân tích lại năm 2018, và kết quả gần như không đổi khi loại 1.588 người bị lệch quy trình.
- **Thịt chế biến sẵn.** IARC xếp thịt chế biến sẵn (xúc xích, giăm bông, thịt hộp) vào nhóm 1 — gây ung thư cho người — và thịt đỏ vào nhóm 2A — nhiều khả năng gây ung thư cho người (probably carcinogenic) ([Bouvard 2015](#r-bouvard2015)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>. Nhóm phân loại nói về **độ chắc chắn** của bằng chứng, không phải mức nguy hiểm: cùng nhóm 1 với thuốc lá không có nghĩa là nguy hiểm ngang thuốc lá.

<h3 id="alcohol"><span class="num">9.4</span>Rượu bia</h3>

Niềm tin "uống ít tốt cho sức khoẻ, giúp sống lâu hơn" dựa trên những nghiên cứu so người uống ít với nhóm "không uống" — một nhóm thường gồm cả người đã bỏ rượu vì bệnh. Gộp 107 nghiên cứu cohort với 4,8 triệu người và hiệu chỉnh các thiên lệch đó, uống ít **không** giảm nguy cơ tử vong so với người chưa từng uống ([Zhao 2023](#r-zhao2023)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>:

```chart bar
lượng ethanol mỗi ngày,nguy cơ tử vong tương đối (người chưa từng uống = 1)
Thỉnh thoảng (dưới 1.3 g),0.96
1.3–24 g,0.93
25–44 g,1.05
45–64 g,1.19
Từ 65 g,1.35
```

<p class="src">Nguồn: Zhao et al. 2023, JAMA Netw Open. Ba mức đầu không khác 1 có ý nghĩa thống kê; hai mức cuối tăng có ý nghĩa. Một lon bia 330 ml loại 5% chứa khoảng 13 g ethanol (330 × 0,05 × 0,789).</p>

WHO châu Âu tuyên bố "không có mức uống rượu nào là an toàn cho sức khoẻ" ([WHO châu Âu 2023](#r-whoalcohol); [Anderson 2023](#r-anderson2023)) <span class="ev ev-mid" title="Bằng chứng vừa"></span>. Cách đọc hợp lý <span class="ev ev-hyp" title="Suy luận hoặc lựa chọn thiết kế của cuốn sách"></span>: uống ít không phải thuốc bổ; nếu uống thì càng ít càng tốt, và đừng uống vì nghĩ rượu có lợi.

<h3 id="tobacco"><span class="num">9.5</span>Thuốc lá</h3>

Theo dõi hơn 200.000 người Mỹ, người đang hút thuốc có tỷ lệ tử vong khoảng **gấp ba** người chưa từng hút và **mất hơn 10 năm tuổi thọ**. Bỏ thuốc lấy lại phần lớn số năm đó, và bỏ càng sớm càng được nhiều ([Jha 2013](#r-jha2013)) <span class="ev ev-high" title="Bằng chứng mạnh"></span>:

```chart bar
tuổi bỏ thuốc,số năm sống thêm so với tiếp tục hút (xấp xỉ)
25–34,10
35–44,9
45–54,6
```

<p class="src">Nguồn: Jha et al. 2013, NEJM 368(4):341–350. Tác giả ghi "about 10, 9, and 6 years".</p>

<h3 id="checkups"><span class="num">9.6</span>Khám định kỳ</h3>
