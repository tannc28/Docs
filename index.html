<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs</title>
<style>
  :root { --bg:#fff; --panel:#f6f7f9; --ink:#1b1f24; --ink2:#59636e; --line:#d8dde3; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --panel:#1c2024; --ink:#e6e9ec; --ink2:#9aa4ae; --line:#2e353c; --accent:#6ea0ff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  nav { width: 20rem; max-width: 85vw; flex: none; display: flex; flex-direction: column;
        background: var(--panel); border-right: 1px solid var(--line); }
  nav header { padding: .8rem; border-bottom: 1px solid var(--line); }
  nav h1 { font-size: 1rem; margin: 0 0 .5rem; }
  nav input { width: 100%; padding: .45rem .6rem; border: 1px solid var(--line); border-radius: 6px;
              background: var(--bg); color: var(--ink); font: inherit; }
  #list { overflow-y: auto; padding: .4rem 0 1rem; flex: 1; }
  .grp { margin: .8rem .8rem .2rem; color: var(--ink2); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
  a.doc { display: block; padding: .4rem .8rem; color: var(--ink); text-decoration: none; border-left: 3px solid transparent; }
  a.doc:hover { background: var(--bg); }
  a.doc.on { background: var(--bg); border-left-color: var(--accent); }
  a.doc small { display: block; color: var(--ink2); font-size: .75rem; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bar { display: flex; gap: .6rem; align-items: center; padding: .4rem .8rem; border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar button, .bar a { font: inherit; color: var(--accent); background: none; border: 0; cursor: pointer; text-decoration: none; }
  .bar span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }
  #menu { display: none; }
  iframe { flex: 1; border: 0; width: 100%; background: #fff; }
  .empty { margin: auto; color: var(--ink2); }
  @media (max-width: 800px) {
    nav { position: fixed; inset: 0 auto 0 0; z-index: 5; transform: translateX(-100%); transition: transform .2s; }
    body.open nav { transform: none; }
    #menu { display: inline; }
  }
</style>
<nav>
  <header><h1>Docs</h1><input id="q" type="search" placeholder="Filter by title or file name"></header>
  <div id="list"></div>
</nav>
<main>
  <div class="bar"><button id="menu">&#9776; Docs</button><span id="cur"></span><a id="open" target="_blank" rel="noopener" hidden>Open in new tab &#8599;</a></div>
  <iframe id="view" title="Document" hidden></iframe>
  <p class="empty" id="none">Pick a document on the left.</p>
</main>
<script src="docs-index.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const docs = window.DOCS || [];
  const render = () => {
    const q = $("q").value.trim().toLowerCase();
    const cur = decodeURIComponent(location.hash.slice(1));
    const list = $("list"); list.replaceChildren();
    for (const d of docs) {
      if (q && !(d.title + " " + d.path).toLowerCase().includes(q)) continue;
      const a = document.createElement("a");
      a.className = "doc" + (d.path === cur ? " on" : ""); a.href = "#" + encodeURIComponent(d.path);
      const t = document.createElement("b"); t.textContent = d.title;
      const m = document.createElement("small"); m.textContent = d.date || d.path;
      a.append(t, m); list.append(a);
    }
  };
  const open = () => {
    const cur = decodeURIComponent(location.hash.slice(1));
    const d = docs.find(x => x.path === cur);
    $("view").hidden = $("open").hidden = !d; $("none").hidden = !!d;
    if (d) {
      if ($("view").getAttribute("src") !== d.path) $("view").src = d.path;
      $("cur").textContent = d.title; $("open").href = d.path; document.title = d.title + " - Docs";
    }
    document.body.classList.remove("open"); render();
  };
  $("q").addEventListener("input", render);
  $("menu").addEventListener("click", () => document.body.classList.toggle("open"));
  addEventListener("hashchange", open);
  if (!location.hash && docs.length) location.hash = "#" + encodeURIComponent(docs[0].path);
  open();
</script>
