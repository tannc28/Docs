# Các framework sống tốt

Một **framework** là một bộ khung giúp mình nhìn cuộc sống theo một cách nhất định — giống cái khung tranh: tranh thì vẫn là đời mình, nhưng khung quyết định mình nhìn vào phần nào. Có khung chia hạnh phúc thành năm phần, có khung chia giờ đầu tiên buổi sáng thành ba khối hai mươi phút, có khung chỉ là một câu dặn "ăn tới tám phần no thì dừng". Tài liệu này giới thiệu những framework hay được nhắc tới nhất, xếp theo bốn chủ đề, và với mỗi cái: nó là gì, gồm những phần nào, một ví dụ đời thường, và cách thử.

<p class="doc-meta">Viết ngày 26/10/2026 · Mỗi framework có một chấm màu nhỏ ở dòng cuối, cho biết đã được nghiên cứu kiểm chứng tới đâu: <span class="ev ev-high" title="Bằng chứng mạnh"></span> nhiều nghiên cứu ủng hộ · <span class="ev ev-mid" title="Bằng chứng vừa"></span> có bằng chứng nhưng chưa nhiều, hoặc chỉ đúng một phần · <span class="ev ev-low" title="Bằng chứng yếu hoặc đang tranh cãi"></span> chưa ai kiểm chứng, hoặc nghiên cứu không ủng hộ · <span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span> nhận xét của tài liệu này. Bấm vào chấm để xem nguồn.</p>

<h2 id="part-happiness" class="part">Phần I — Hạnh phúc và một cuộc sống tốt</h2>

<h2 id="hedonic-eudaimonic"><span class="num">1</span>Hai kiểu hạnh phúc: hedonic và eudaimonic</h2>

**Nó là gì.** Cách chia hạnh phúc thành hai loại, có từ thời Hy Lạp cổ. **Hedonic** là hạnh phúc của niềm vui và sự thoả mãn: thấy dễ chịu, hài lòng. **Eudaimonic** là hạnh phúc của ý nghĩa và sự trưởng thành: sống đúng với mình, phát huy được khả năng của mình<a class="ev ev-mid" href="#r-ryan2001" title="Ryan 2001 · Bằng chứng vừa"></a>.

**Ví dụ.** Một buổi tối ăn lẩu với bạn bè, cười nói vui vẻ — đó là hedonic. Một buổi chiều đạp xe chở mẹ đi khám bệnh, mệt nhưng thấy mình sống có ích — đó là eudaimonic. Một đời tốt thường cần cả hai.

**Cách thử.** Cuối tuần, viết ra một việc khiến mình *vui* và một việc khiến mình thấy *có ý nghĩa*. Tuần nào thiếu hẳn một loại, tuần sau bù vào<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Một cách phân biệt được dùng rộng rãi; khi đo thật, hai loại chồng lên nhau khá nhiều<a class="ev ev-mid" href="#r-ryan2001" title="Ryan 2001 · Bằng chứng vừa"></a>.

<h2 id="sdt"><span class="num">2</span>Ba nhu cầu nền (Self-Determination Theory)</h2>

**Nó là gì.** Lý thuyết của hai nhà tâm lý học Ryan và Deci: ai cũng có ba nhu cầu tâm lý nền, đáp ứng đủ thì khoẻ mạnh, thiếu thì héo dần<a class="ev ev-mid" href="#r-ryan2000" title="Ryan 2000 · Bằng chứng vừa"></a>.

- **Autonomy — tự chủ:** được tự chọn, làm việc vì mình muốn chứ không phải bị ép.
- **Competence — năng lực:** thấy mình làm được và tiến bộ.
- **Relatedness — gắn kết:** có người thân thiết, thấy mình thuộc về.

**Ví dụ.** Đứa trẻ tập ăn đòi tự cầm thìa (tự chủ), vui ra mặt khi xúc được miếng cơm không rơi (năng lực), và ngồi giữa mâm cơm cả nhà, được bố mẹ khen (gắn kết). Người lớn cũng vậy, chỉ là thìa cơm đổi thành công việc, sở thích, gia đình.

**Cách thử.** Cuối tuần chấm ba nhu cầu từ 1 tới 5. Chân kiềng nào ngắn nhất, tuần sau thêm đúng một việc cho chân ấy — một buổi cà phê với bạn cũ, một buổi tự chọn làm điều mình thích<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Gộp gần nửa triệu người, được đáp ứng ba nhu cầu đi kèm hài lòng với cuộc sống rõ rệt, ở cả phương Tây lẫn châu Á<a class="ev ev-high" href="#r-slemp2024" title="Slemp 2024 · Bằng chứng mạnh"></a>.

<h2 id="perma"><span class="num">3</span>PERMA</h2>

**Nó là gì.** Mô hình của Martin Seligman, người khởi xướng ngành tâm lý học tích cực: một cuộc sống tốt có năm thành phần, viết tắt là PERMA<a class="ev ev-mid" href="#r-butler2016" title="Butler 2016 · Bằng chứng vừa"></a>.

- **P — Positive emotion:** cảm xúc tích cực — vui, bình an, biết ơn.
- **E — Engagement:** đắm mình vào việc đang làm, quên cả thời gian.
- **R — Relationships:** các mối quan hệ tốt.
- **M — Meaning:** cảm giác mình thuộc về điều gì lớn hơn bản thân.
- **A — Accomplishment:** đạt được điều mình đặt ra.

**Ví dụ.** Một người thợ mộc: vui khi làm xong cái bàn đẹp (P), say sưa bào gỗ quên ăn (E), có bạn nghề để trò chuyện (R), thấy mình giữ một nghề truyền thống của làng (M), và tự hào khi khách quay lại đặt thêm (A).

**Cách thử.** Chấm năm chữ cái từ 1 tới 10 cho tháng vừa qua; chữ nào thấp nhất là chỗ nên để ý<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Có bộ câu hỏi đo riêng<a class="ev ev-mid" href="#r-butler2016" title="Butler 2016 · Bằng chứng vừa"></a>; nhưng khi đo thật, điểm PERMA gần như trùng với mức hài lòng cuộc sống thông thường<a class="ev ev-mid" href="#r-goodman2018" title="Goodman 2018 · Bằng chứng vừa"></a>.

<h2 id="ryff"><span class="num">4</span>Sáu chiều well-being của Ryff</h2>

**Nó là gì.** Mô hình của nhà tâm lý học Carol Ryff, coi sống tốt là "vận hành tốt" về tâm lý, gồm sáu chiều<a class="ev ev-mid" href="#r-ryff1989" title="Ryff 1989 · Bằng chứng vừa"></a>:

1. **Chấp nhận bản thân** — nhìn nhận cả điểm tốt lẫn điểm xấu của mình mà không ghét bỏ.
2. **Quan hệ tích cực** — có những mối quan hệ ấm áp, tin cậy.
3. **Tự chủ** — tự đánh giá mình theo chuẩn của mình, không chạy theo đám đông.
4. **Làm chủ hoàn cảnh** — sắp xếp được cuộc sống hằng ngày.
5. **Mục đích sống** — có hướng đi, thấy cuộc đời có ý nghĩa.
6. **Phát triển bản thân** — thấy mình vẫn đang lớn lên.

**Ví dụ.** Một bà cụ bán xôi đầu ngõ: biết mình không giỏi chữ nhưng chẳng tự ti (1), quý mến khách quen như người nhà (2), sống theo cách của mình dù con cái khuyên nghỉ (3), tự lo được gánh hàng (4), thấy nuôi các cháu ăn học là lẽ sống (5), và năm nào cũng học thêm một món mới (6).

**Bằng chứng.** Được một khảo sát quốc gia ủng hộ<a class="ev ev-mid" href="#r-ryff1995" title="Ryff 1995 · Bằng chứng vừa"></a>, nhưng có nghiên cứu thấy bốn trong sáu chiều gần như đo cùng một thứ<a class="ev ev-mid" href="#r-springer2006" title="Springer 2006 · Bằng chứng vừa"></a>.

<h2 id="maslow"><span class="num">5</span>Tháp nhu cầu Maslow</h2>

**Nó là gì.** Ý tưởng của Abraham Maslow năm 1943: con người có năm tầng nhu cầu, từ thấp tới cao<a class="ev ev-low" href="#r-maslow1943" title="Maslow 1943 · Bằng chứng yếu hoặc đang tranh cãi"></a>:

1. **Sinh lý** — ăn, uống, ngủ.
2. **An toàn** — chỗ ở, việc làm ổn định, sức khoẻ.
3. **Tình cảm và thuộc về** — gia đình, bạn bè, tình yêu.
4. **Được tôn trọng** — được ghi nhận, tự tin.
5. **Thể hiện bản thân** — sống hết khả năng của mình.

Hình kim tự tháp quen thuộc là do người đời sau vẽ; Maslow chưa từng vẽ nó<a class="ev ev-mid" href="#r-bridgman2019" title="Bridgman 2019 · Bằng chứng vừa"></a>.

**Ví dụ.** Một người vừa mất việc lo trước hết chuyện tiền nhà, tiền ăn (tầng 1–2), chưa nghĩ được tới chuyện học đàn cho vui (tầng 5).

**Bằng chứng.** Các nhu cầu là có thật, nhưng thứ tự thì không cứng: khảo sát ở 123 nước thấy nhu cầu "cao" như được tôn trọng, có bạn bè vẫn quan trọng dù nhu cầu "thấp" chưa đủ<a class="ev ev-mid" href="#r-tay2011" title="Tay 2011 · Bằng chứng vừa"></a>. Chính Maslow cũng viết thứ tự ấy "không cứng nhắc như nghe có vẻ"<a class="ev ev-low" href="#r-maslow1943" title="Maslow 1943 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

<h2 id="ikigai"><span class="num">6</span>Ikigai</h2>

**Nó là gì.** Có hai thứ cùng tên.

- **Ikigai gốc của Nhật**: "lẽ sống" — điều khiến mình muốn thức dậy mỗi sáng. Có thể rất nhỏ: chăm vườn rau, đón cháu đi học, pha ấm trà buổi sáng.
- **Sơ đồ bốn vòng tròn** lan khắp mạng: điều mình yêu thích, điều mình giỏi, điều thế giới cần, và điều được trả tiền — chỗ bốn vòng giao nhau gọi là "ikigai". Sơ đồ này do một blogger phương Tây vẽ năm 2014, chuyển thể từ một sơ đồ về "mục đích sống"<a class="ev ev-low" href="#r-winn2014" title="Winn 2014 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

**Ví dụ.** Ông cụ về hưu ngày nào cũng ra công viên tập dưỡng sinh với hội bạn già, rồi về tưới cây — ông có ikigai theo nghĩa Nhật, dù chẳng được ai trả tiền.

**Cách thử.** Hỏi mình: *sáng mai thức dậy, mình mong tới điều gì?* Nếu khó trả lời, đó là chỗ đáng chú ý<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Ikigai gốc: người Nhật nói mình không có ikigai có nguy cơ tử vong cao hơn khoảng 1,5 lần (nghiên cứu theo dõi)<a class="ev ev-mid" href="#r-sone2008" title="Sone 2008 · Bằng chứng vừa"></a>. Sơ đồ bốn vòng tròn: chưa ai kiểm chứng<a class="ev ev-low" href="#r-winn2014" title="Winn 2014 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

<h2 id="via"><span class="num">7</span>24 điểm mạnh tính cách (VIA)</h2>

**Nó là gì.** Bảng phân loại của Peterson và Seligman: 24 điểm mạnh tính cách, xếp vào sáu đức tính lớn — **trí tuệ, can đảm, nhân ái, công bằng, tiết chế, và siêu việt** (hướng tới điều lớn hơn bản thân)<a class="ev ev-mid" href="#r-peterson2004" title="Peterson 2004 · Bằng chứng vừa"></a>. Ví dụ điểm mạnh: tò mò, kiên trì, tử tế, biết ơn, hài hước, khiêm tốn.

**Ví dụ.** Một người có điểm mạnh là "tò mò" sẽ thấy vui khi được hỏi chuyện, đọc sách, thử món mới; một người mạnh về "tử tế" thấy vui khi chăm sóc người khác.

**Cách thử.** Làm bài trắc nghiệm VIA miễn phí trên mạng, chọn một điểm mạnh nổi bật, và mỗi ngày dùng nó theo một cách mới trong một tuần<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Cách xếp vào sáu đức tính chưa được xác nhận rõ<a class="ev ev-mid" href="#r-peterson2004" title="Peterson 2004 · Bằng chứng vừa"></a>; dùng điểm mạnh của mình giúp hài lòng hơn một chút<a class="ev ev-mid" href="#r-schutte2019" title="Schutte 2019 · Bằng chứng vừa"></a>.

<h2 id="happiness-pie"><span class="num">8</span>Bánh hạnh phúc 50/10/40</h2>

**Nó là gì.** Hình chiếc bánh chia hạnh phúc: khoảng 50% do gene, 10% do hoàn cảnh (giàu nghèo, ở đâu), và 40% do những gì mình chủ động làm hằng ngày<a class="ev ev-low" href="#r-lyubomirsky2005" title="Lyubomirsky 2005 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Thông điệp: phần lớn hạnh phúc nằm trong tay bạn.

**Ví dụ.** Theo chiếc bánh, trúng xổ số (hoàn cảnh) chỉ đổi được một chút, còn tập thói quen tốt (hành động) đổi được nhiều.

**Bằng chứng.** Con số 40% gần như không có cơ sở, và chính các tác giả đã thừa nhận nhiều điểm bị phê bình<a class="ev ev-mid" href="#r-brown2020" title="Brown 2020 · Bằng chứng vừa"></a>. Hành động hằng ngày vẫn giúp được, nhưng ít hơn chiếc bánh hứa<a class="ev ev-high" href="#r-white2019" title="White 2019 · Bằng chứng mạnh"></a>.

<h2 id="hedonic-treadmill"><span class="num">9</span>Hedonic treadmill — "sướng mấy rồi cũng quen"</h2>

**Nó là gì.** Ý tưởng rằng sau mỗi chuyện vui hay buồn lớn, con người dần quay về mức hạnh phúc cũ, như chạy trên máy chạy bộ: chạy mãi mà vẫn ở chỗ cũ<a class="ev ev-low" href="#r-brickman1978" title="Brickman 1978 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

**Ví dụ.** Mua chiếc xe máy mới, tuần đầu ngày nào cũng lau, tháng thứ ba thì nó chỉ còn là cái xe để đi làm.

**Bằng chứng.** Đúng một phần: người ta quen dần với nhiều thay đổi<a class="ev ev-mid" href="#r-diener2006" title="Diener 2006 · Bằng chứng vừa"></a>, nhưng không phải tất cả — những biến cố như khuyết tật lâu dài để lại mức hạnh phúc thấp hơn kéo dài<a class="ev ev-high" href="#r-lucas2007" title="Lucas 2007 · Bằng chứng mạnh"></a>, và mức độ quen khác nhau nhiều theo từng loại sự kiện<a class="ev ev-high" href="#r-luhmann2012" title="Luhmann 2012 · Bằng chứng mạnh"></a>.

<h2 id="whr"><span class="num">10</span>Sáu yếu tố của World Happiness Report</h2>

**Nó là gì.** Báo cáo hạnh phúc thế giới hằng năm xếp hạng các nước theo mức hài lòng với cuộc sống của người dân, rồi tìm xem điều gì đi kèm với nó. Sáu yếu tố: **có người để dựa vào lúc khó khăn, thu nhập, tuổi thọ khoẻ mạnh, tự do lựa chọn cuộc sống, lòng hào phóng, và ít tham nhũng**<a class="ev ev-high" href="#r-worldhappinessreport" title="World Happiness Report · Bằng chứng mạnh"></a>.

**Ví dụ.** Hai nước có thu nhập ngang nhau, nhưng nước nào người dân tin rằng "lúc hoạn nạn có người giúp" thì thường hạnh phúc hơn.

**Bằng chứng.** Sáu yếu tố giải thích phần lớn chênh lệch giữa các nước, nhưng đó là tương quan<a class="ev ev-high" href="#r-worldhappinessreport" title="World Happiness Report · Bằng chứng mạnh"></a>. Ở cấp từng người, những thứ như thu nhập hay tình trạng hôn nhân lại ảnh hưởng ít tới bất ngờ<a class="ev ev-mid" href="#r-diener1999" title="Diener 1999 · Bằng chứng vừa"></a>.

<h2 id="part-mind" class="part">Phần II — Cảm xúc và tâm trí</h2>

<h2 id="cbt"><span class="num">11</span>CBT — liệu pháp nhận thức – hành vi</h2>

**Nó là gì.** Một phương pháp trị liệu dựa trên ý tưởng: **suy nghĩ, cảm xúc và hành vi kéo nhau**. Không phải chuyện xảy ra làm mình buồn, mà cách mình *nghĩ* về chuyện ấy. Sửa được lối nghĩ méo mó thì cảm xúc và hành vi cũng đổi theo<a class="ev ev-high" href="#r-hofmann2012" title="Hofmann 2012 · Bằng chứng mạnh"></a>.

**Ví dụ.** Nhắn tin cho bạn thân cả ngày không thấy trả lời. Suy nghĩ: "chắc nó giận mình". Cảm xúc: lo, buồn. Hành vi: không dám nhắn tiếp. CBT dạy hỏi lại: *bằng chứng đâu? còn cách giải thích nào khác — bạn bận, bạn quên?*

**Cách thử.** Khi một suy nghĩ làm mình khó chịu cả buổi, viết nó ra giấy, rồi viết: bằng chứng ủng hộ, bằng chứng chống lại, và một người bạn sẽ nhìn chuyện này thế nào<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Một tổng quan gộp hơn 100 meta-analysis gọi bằng chứng cho CBT là "rất mạnh", nhất là với lo âu<a class="ev ev-high" href="#r-hofmann2012" title="Hofmann 2012 · Bằng chứng mạnh"></a>.

<h2 id="act"><span class="num">12</span>ACT — liệu pháp chấp nhận và cam kết</h2>

**Nó là gì.** Một phương pháp trị liệu không cố xoá cảm xúc khó chịu mà **dạy sống chung với nó**: để cảm xúc ở đó, không vật lộn, rồi vẫn làm điều mình coi trọng. Hai chữ chính là *Acceptance* (chấp nhận) và *Commitment* (cam kết làm theo giá trị của mình).

**Ví dụ.** Run khi phải phát biểu trong đám cưới bạn thân. Thay vì cố "hết run" rồi mới nói, ACT bảo: cứ run, tay cứ lạnh — vẫn cầm micro lên nói, vì mình quý bạn mình.

**Cách thử.** Khi một nỗi sợ cản mình, nói thầm "mình đang có cảm giác sợ", rồi hỏi "điều mình coi trọng ở đây là gì?" và làm một bước nhỏ theo hướng đó<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Hiệu quả rõ rệt, ngang CBT, trong các nghiên cứu lâm sàng<a class="ev ev-high" href="#r-atjak2015" title="A-Tjak 2015 · Bằng chứng mạnh"></a>.

<h2 id="mindfulness"><span class="num">13</span>Mindfulness — chánh niệm</h2>

**Nó là gì.** Tập trung chú ý vào hiện tại — hơi thở, cơ thể, việc đang làm — và nhận biết những gì đang diễn ra mà không vội phán xét. Có nguồn gốc từ thiền Phật giáo; các chương trình hiện đại thường kéo dài tám tuần.

**Ví dụ.** Rửa bát mà để ý cảm giác nước ấm trên tay, tiếng bát đĩa, thay vì vừa rửa vừa nghĩ chuyện ngày mai.

**Cách thử.** Mỗi ngày năm phút ngồi yên, đếm hơi thở từ 1 tới 10 rồi lặp lại; lạc đi thì nhẹ nhàng đếm lại từ 1<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Với người có rối loạn tâm lý, hiệu quả ngang các phương pháp điều trị đã được công nhận<a class="ev ev-high" href="#r-goldberg2018" title="Goldberg 2018 · Bằng chứng mạnh"></a>; với người khoẻ mạnh, tốt hơn không làm gì nhưng không hơn các hoạt động có chủ đích khác<a class="ev ev-high" href="#r-galante2021" title="Galante 2021 · Bằng chứng mạnh"></a>.

<h2 id="stoicism"><span class="num">14</span>Chủ nghĩa Khắc kỷ (Stoicism)</h2>

**Nó là gì.** Một trường phái triết học Hy Lạp – La Mã cổ đại. Ý chính, từ Epictetus: **chia mọi chuyện làm hai phần — phần mình kiểm soát được và phần không**. Dồn sức vào phần thứ nhất, bình thản với phần thứ hai.

**Ví dụ.** Chuyến xe về quê ăn Tết bị huỷ vì bão: chuyện thời tiết không đổi được, nên đừng bực mãi; chuyện tìm chuyến khác, báo cho bố mẹ, thì làm được ngay.

**Cách thử.** Gặp chuyện bực, kẻ hai cột trên giấy: "đổi được" và "không đổi được". Chỉ hành động ở cột đầu<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Mới có vài thử nghiệm nhỏ, kết quả trái chiều<a class="ev ev-low" href="#r-boostani2026" title="Boostani 2026 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Hiểu sai Khắc kỷ thành "kìm nén cảm xúc" thì còn đi kèm kém hạnh phúc hơn<a class="ev ev-mid" href="#r-karl2022" title="Karl 2022 · Bằng chứng vừa"></a>.

<h2 id="gratitude"><span class="num">15</span>Biết ơn (gratitude practice)</h2>

**Nó là gì.** Những bài tập để chủ động để ý điều tốt mình nhận được: viết ra ba điều biết ơn mỗi tối, hoặc viết thư cảm ơn một người.

**Ví dụ.** Tối nay ghi: mẹ gọi điện hỏi thăm; trời tạnh mưa đúng lúc đi về; bà bán xôi cho thêm muỗng ruốc.

**Cách thử.** Một tuần, mỗi tối ghi ba điều, rồi để ý tâm trạng cuối tuần<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Tốt hơn không làm gì, chỉ nhỉnh hơn một chút so với hoạt động trung tính<a class="ev ev-high" href="#r-davis2016" title="Davis 2016 · Bằng chứng mạnh"></a>, và không hơn các bài tập tích cực khác<a class="ev ev-high" href="#r-dickens2017" title="Dickens 2017 · Bằng chứng mạnh"></a>.

<h2 id="kindness"><span class="num">16</span>Làm việc tử tế</h2>

**Nó là gì.** Chủ động làm điều tốt cho người khác, và để ý rằng chính mình cũng vui hơn.

**Ví dụ.** Chở mẹ đi chợ, xách giúp bà cụ hàng xóm bao gạo lên tầng ba, nhường ghế trên xe buýt.

**Cách thử.** Một ngày trong tuần, làm năm việc tử tế nhỏ, và ghi lại cảm giác cuối ngày<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Giúp người khác làm chính người giúp vui hơn, hiệu ứng vừa phải và chắc chắn<a class="ev ev-high" href="#r-curry2018" title="Curry 2018 · Bằng chứng mạnh"></a>.

<h2 id="perfectionism"><span class="num">17</span>Cầu toàn (perfectionism)</h2>

**Nó là gì.** Không phải một phương pháp mà là một **nét tính cách** hay bị nhầm là điều tốt. Tâm lý học chia làm hai phần: **perfectionistic strivings** — đặt chuẩn rất cao cho mình, và **perfectionistic concerns** — sợ mắc lỗi, sợ bị đánh giá<a class="ev ev-high" href="#r-limburg2017" title="Limburg 2017 · Bằng chứng mạnh"></a>.

**Ví dụ.** Dọn nhà đón Tết mà lau đi lau lại một góc, tới ba mươi Tết vẫn chưa xong; viết lời chúc mừng sinh nhật mà sửa mãi không dám gửi.

**Cách thử.** Khi thấy mình sửa đi sửa lại, hỏi: *nếu dừng ở đây, có ai thật sự bị thiệt không?* Thử dừng ở mức "đủ tốt" một lần<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Gộp 284 nghiên cứu, cả hai phần đều gắn với nhiều vấn đề sức khoẻ tinh thần<a class="ev ev-high" href="#r-limburg2017" title="Limburg 2017 · Bằng chứng mạnh"></a>; mức cầu toàn ở sinh viên Mỹ, Canada, Anh tăng đều từ 1989 tới 2016<a class="ev ev-high" href="#r-curran2019" title="Curran 2019 · Bằng chứng mạnh"></a>.

<h2 id="part-goals" class="part">Phần III — Mục tiêu, thói quen và cách làm việc</h2>

<h2 id="woop"><span class="num">18</span>WOOP</h2>

**Nó là gì.** Phương pháp bốn bước của nhà tâm lý học Gabriele Oettingen, tên đầy đủ là *mental contrasting with implementation intentions*<a class="ev ev-high" href="#r-wang2021" title="Wang 2021 · Bằng chứng mạnh"></a>:

- **W — Wish:** điều mình mong muốn.
- **O — Outcome:** kết quả tốt nhất nếu đạt được — hình dung thật rõ.
- **O — Obstacle:** trở ngại **trong chính mình** — không phải ngoài kia.
- **P — Plan:** kế hoạch "nếu gặp trở ngại ấy, thì mình sẽ…".

**Ví dụ.** Mong: chạy bộ ba buổi mỗi tuần. Kết quả: người nhẹ nhõm, ngủ ngon. Trở ngại: tối về nằm xuống là lười. Kế hoạch: "nếu về tới nhà thấy muốn nằm, thì mình thay ngay đồ chạy trước khi ngồi xuống".

**Cách thử.** Áp dụng bốn bước cho một mong muốn của tuần này, mất chừng năm phút<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Giúp đạt mục tiêu tốt hơn, hiệu ứng nhỏ tới vừa<a class="ev ev-high" href="#r-wang2021" title="Wang 2021 · Bằng chứng mạnh"></a>.

<h2 id="grit"><span class="num">19</span>Grit — sự bền bỉ</h2>

**Nó là gì.** Khái niệm của Angela Duckworth: **đam mê và kiên trì với mục tiêu dài hạn**. Người có grit cao không bỏ cuộc giữa chừng và theo đuổi một mục tiêu nhiều năm<a class="ev ev-mid" href="#r-duckworth2007" title="Duckworth 2007 · Bằng chứng vừa"></a>.

**Ví dụ.** Một người học đàn tranh mười năm, có lúc chán, có lúc bận, nhưng chưa bao giờ bỏ hẳn.

**Bằng chứng.** Có giúp nhưng ít hơn quảng cáo, và gần như trùng với tính tận tâm, chu đáo vốn đã được đo từ lâu; phần có ích nhất là kiên trì, không phải đam mê<a class="ev ev-high" href="#r-cred2017" title="Credé 2017 · Bằng chứng mạnh"></a>.

<h2 id="law-of-attraction"><span class="num">20</span>Luật hấp dẫn (law of attraction)</h2>

**Nó là gì.** Niềm tin rằng suy nghĩ "hút" điều tương tự về phía mình: cứ tưởng tượng thật rõ mình đã giàu, đã khoẻ, đã đỗ, thì điều ấy sẽ đến. Nổi tiếng qua cuốn sách *The Secret*, còn gọi là "manifesting".

**Ví dụ.** Dán ảnh căn nhà mơ ước lên tường, mỗi sáng nhìn và tin rằng "mình đã có nó".

**Bằng chứng.** Phần "hút điều tốt" chưa ai kiểm chứng<a class="ev ev-low" href="#r-dixon2023" title="Dixon 2023 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Ngược lại, nghiên cứu thấy mơ mộng về đích khiến người ta *bớt* cố gắng<a class="ev ev-mid" href="#r-oettingen2002" title="Oettingen 2002 · Bằng chứng vừa"></a> và hụt năng lượng<a class="ev ev-mid" href="#r-kappes2011" title="Kappes 2011 · Bằng chứng vừa"></a> — vì não đã được "thưởng" trước.

<h2 id="power-posing"><span class="num">21</span>Power posing — tư thế quyền lực</h2>

**Nó là gì.** Ý tưởng rằng đứng hai phút trong tư thế dang rộng — chống nạnh, giơ hai tay — trước một tình huống căng thẳng sẽ làm mình tự tin hơn, thậm chí thay đổi hormone<a class="ev ev-low" href="#r-carney2010" title="Carney 2010 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

**Ví dụ.** Vào nhà vệ sinh đứng chống nạnh hai phút trước buổi thi vấn đáp.

**Bằng chứng.** Thử nghiệm lặp lại với mẫu lớn không thấy tác dụng lên hormone hay hành vi<a class="ev ev-mid" href="#r-ranehill2015" title="Ranehill 2015 · Bằng chứng vừa"></a>; chỉ còn lại cảm giác "thấy mạnh mẽ hơn" một chút, và chính tác giả đầu bài gốc không còn tin vào hiệu ứng<a class="ev ev-high" href="#r-carney2016" title="Carney 2016 · Bằng chứng mạnh"></a>.

<h2 id="atomic-habits"><span class="num">22</span>Atomic Habits</h2>

**Nó là gì.** Cuốn sách của James Clear về tạo thói quen, với **bốn quy tắc**: làm cho thói quen *dễ thấy*, *hấp dẫn*, *dễ làm*, và *thoả mãn*. Làm ngược lại để bỏ thói quen xấu: *khó thấy, kém hấp dẫn, khó làm, không thoả mãn*<a class="ev ev-low" href="#r-clear2018" title="Clear 2018 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

**Ví dụ.** Muốn uống nhiều nước: để bình nước ngay cạnh giường (dễ thấy), mua cái bình mình thích (hấp dẫn), rót sẵn từ tối (dễ làm), uống xong đánh dấu vào lịch (thoả mãn).

**Cách thử.** Chọn một thói quen, áp đủ bốn quy tắc, giữ trong một tháng<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Không tìm thấy nghiên cứu nào kiểm tra chính bộ bốn quy tắc<a class="ev ev-low" href="#r-clear2018" title="Clear 2018 · Bằng chứng yếu hoặc đang tranh cãi"></a>; còn khoa học về thói quen mà sách dựa vào thì có thật — một thói quen mất trung bình khoảng hai tháng mới thành nếp, và lỡ một ngày không sao<a class="ev ev-high" href="#r-lally2010" title="Lally 2010 · Bằng chứng mạnh"></a>.

<h2 id="seven-habits"><span class="num">23</span>7 thói quen để thành đạt</h2>

**Nó là gì.** Cuốn sách của Stephen Covey (1989), một trong những sách tự lực bán chạy nhất mọi thời<a class="ev ev-low" href="#r-covey1989" title="Covey 1989 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Bảy thói quen:

1. **Chủ động** — tự chịu trách nhiệm, không đổ lỗi hoàn cảnh.
2. **Bắt đầu với đích đến trong đầu** — biết mình muốn gì.
3. **Việc quan trọng làm trước.**
4. **Tư duy cùng thắng** — tìm cách để cả hai bên đều có lợi.
5. **Hiểu người trước, rồi mới mong được hiểu.**
6. **Hợp lực** — làm cùng nhau tốt hơn cộng từng người.
7. **Mài giũa cái cưa** — chăm sóc bản thân để còn sức đi tiếp.

**Ví dụ.** Thói quen thứ năm khi bố mẹ phàn nàn: nghe cho hết vì sao bố mẹ lo, trước khi giải thích ý mình.

**Bằng chứng.** Không tìm thấy nghiên cứu nào kiểm tra bộ bảy thói quen ở người lớn<a class="ev ev-low" href="#r-covey1989" title="Covey 1989 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

<h2 id="gtd"><span class="num">24</span>GTD — Getting Things Done</h2>

**Nó là gì.** Hệ thống sắp xếp việc của David Allen, gồm năm bước<a class="ev ev-low" href="#r-heylighen2008" title="Heylighen 2008 · Bằng chứng yếu hoặc đang tranh cãi"></a>:

1. **Gom** — ghi mọi việc đang lởn vởn trong đầu ra một chỗ.
2. **Làm rõ** — mỗi việc: có cần làm không, bước tiếp theo là gì.
3. **Sắp xếp** — xếp vào danh sách theo nơi chốn, thời gian.
4. **Xem lại** — mỗi tuần nhìn lại toàn bộ.
5. **Làm** — chọn việc theo hoàn cảnh lúc đó.

Kèm một quy tắc nổi tiếng: việc gì làm dưới hai phút thì làm ngay.

**Ví dụ.** Cuối tuần ghi ra giấy: sửa vòi nước, gọi điện cho bà, đóng tiền điện, mua quà sinh nhật em. "Gọi điện cho bà" — bước tiếp theo là gì? Tối Chủ nhật bấm máy.

**Bằng chứng.** Chưa được kiểm chứng như một hệ thống<a class="ev ev-low" href="#r-heylighen2008" title="Heylighen 2008 · Bằng chứng yếu hoặc đang tranh cãi"></a>. Một cơ chế bên trong có thật: viết ra kế hoạch cụ thể cho một việc còn dở giúp đầu óc thôi bị nó lởn vởn<a class="ev ev-mid" href="#r-masicampo2011" title="Masicampo 2011 · Bằng chứng vừa"></a>.

<h2 id="pomodoro"><span class="num">25</span>Pomodoro</h2>

**Nó là gì.** Cách chia thời gian: **làm tập trung 25 phút, nghỉ 5 phút**; sau bốn lượt thì nghỉ dài hơn. Tên lấy từ cái đồng hồ hẹn giờ hình quả cà chua.

**Ví dụ.** Ôn thi: hẹn giờ 25 phút, cất điện thoại, chỉ làm bài; chuông reo thì đứng dậy rót nước, vươn vai năm phút.

**Bằng chứng.** Hai nghiên cứu nhỏ cho kết quả khác nhau về độ mệt và tâm trạng<a class="ev ev-mid" href="#r-biwer2023" title="Biwer 2023 · Bằng chứng vừa"></a>; chưa thấy giúp làm được nhiều việc hơn<a class="ev ev-mid" href="#r-smits2025" title="Smits 2025 · Bằng chứng vừa"></a>.

<h2 id="wheel-of-life"><span class="num">26</span>Bánh xe cuộc đời (Wheel of Life)</h2>

**Nó là gì.** Một công cụ hay dùng trong coaching: vẽ một vòng tròn chia làm nhiều mảng — tuỳ phiên bản, thường là sức khoẻ, gia đình, bạn bè, tình yêu, công việc, tiền bạc, phát triển bản thân, giải trí — rồi chấm mỗi mảng từ 1 tới 10. Nối các điểm lại sẽ thấy "bánh xe" của mình méo ở đâu.

**Ví dụ.** Chấm xong thấy "tiền bạc" 8 điểm nhưng "bạn bè" chỉ 3 — bánh xe lệch hẳn một bên.

**Bằng chứng.** Chưa có nghiên cứu xác nhận cách đo này<a class="ev ev-low" href="#r-elrouby2026" title="Elrouby 2026 · Bằng chứng yếu hoặc đang tranh cãi"></a>.

<h2 id="five-am"><span class="num">27</span>Câu lạc bộ 5 giờ sáng (5 AM Club)</h2>

**Nó là gì.** Cuốn sách của Robin Sharma khuyên dậy lúc 5 giờ và dùng giờ đầu tiên theo công thức **20/20/20**: 20 phút vận động, 20 phút suy ngẫm, 20 phút học điều mới.

**Ví dụ.** Dậy 5 giờ, chạy bộ quanh hồ, ngồi viết nhật ký, rồi đọc sách trước khi cả nhà thức.

**Bằng chứng.** Chưa ai kiểm chứng chính con số 5 giờ<a class="ev ev-mid" href="#r-daghlas2021" title="Daghlas 2021 · Bằng chứng vừa"></a>. Điều có bằng chứng là ngủ đủ và đều: một thử nghiệm nhỏ dời lịch ngủ của người hay thức khuya sớm lên mà không cắt giấc ngủ thấy họ đỡ căng thẳng<a class="ev ev-mid" href="#r-facerchilds2019" title="Facer-Childs 2019 · Bằng chứng vừa"></a>, còn sống lệch đồng hồ sinh học của mình đi kèm cân nặng cao hơn<a class="ev ev-mid" href="#r-roenneberg2012" title="Roenneberg 2012 · Bằng chứng vừa"></a>.

<h2 id="part-health" class="part">Phần IV — Sức khoẻ và sống thọ</h2>

<h2 id="le8"><span class="num">28</span>Life's Essential 8</h2>

**Nó là gì.** Bộ tám chỉ số sức khoẻ tim mạch của Hiệp hội Tim mạch Hoa Kỳ, mỗi chỉ số chấm từ 0 tới 100 rồi lấy trung bình<a class="ev ev-high" href="#r-ahalifesessential82022" title="AHA Life&#x27;s Essential 8 (2022) · Bằng chứng mạnh"></a>:

| Bốn thói quen | Bốn chỉ số trong cơ thể |
|---|---|
| Ăn uống | Cân nặng (BMI) |
| Vận động | Mỡ máu |
| Không hút thuốc | Đường huyết |
| Giấc ngủ | Huyết áp |

**Ví dụ.** Một người ăn uống lành mạnh, ngủ đủ, không hút thuốc nhưng huyết áp cao — điểm chung bị kéo xuống, và chỗ cần lo là huyết áp.

**Cách thử.** Ở lần khám sức khoẻ tới, xin kết quả mỡ máu, đường huyết, huyết áp, rồi tự đối chiếu với tám ô<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Người có điểm cao ở tuổi 50 sống lâu hơn khoảng 9 năm<a class="ev ev-high" href="#r-ma2023" title="Ma 2023 · Bằng chứng mạnh"></a> và có thêm nhiều năm không mắc bệnh tim, tiểu đường hay ung thư<a class="ev ev-high" href="#r-wang2023" title="Wang 2023 · Bằng chứng mạnh"></a>.

<h2 id="five-habits"><span class="num">29</span>Năm thói quen sống thọ</h2>

**Nó là gì.** Năm thói quen mà một nghiên cứu lớn ở Mỹ dùng để đo lối sống lành mạnh: **không hút thuốc · cân nặng vừa phải · vận động mỗi ngày từ 30 phút · ăn uống lành mạnh · hạn chế rượu bia**<a class="ev ev-high" href="#r-li2018" title="Li 2018 · Bằng chứng mạnh"></a>.

**Ví dụ.** Hai anh em sinh đôi: người giữ đủ năm thói quen, người không giữ thói quen nào. Theo nghiên cứu, khoảng cách tuổi thọ của họ ở tuổi 50 có thể tới hơn một chục năm.

**Bằng chứng.** Người giữ đủ năm thói quen sống thêm 12–14 năm so với người không giữ thói quen nào<a class="ev ev-high" href="#r-li2018" title="Li 2018 · Bằng chứng mạnh"></a>, phần lớn là những năm khoẻ mạnh<a class="ev ev-high" href="#r-li2020" title="Li 2020 · Bằng chứng mạnh"></a>; gộp 142 nghiên cứu, lối sống lành mạnh nhất đi kèm nguy cơ tử vong thấp hơn khoảng 55%<a class="ev ev-high" href="#r-zhang2020" title="Zhang 2020 · Bằng chứng mạnh"></a>. Danh sách gốc tính "uống rượu vừa phải" là tốt, nhưng khi đã hiệu chỉnh sai lệch, rượu vừa phải không còn đi kèm lợi ích<a class="ev ev-high" href="#r-zhao2023" title="Zhao 2023 · Bằng chứng mạnh"></a>.

<h2 id="blue-zones"><span class="num">30</span>Blue Zones và Power 9</h2>

**Nó là gì.** "Blue Zones" là những vùng có nhiều người sống trên trăm tuổi một cách bất thường — ban đầu là một vùng núi ở Sardinia (Ý)<a class="ev ev-mid" href="#r-poulain2004" title="Poulain 2004 · Bằng chứng vừa"></a>, sau mở rộng thành bốn vùng: Sardinia, Okinawa (Nhật), Nicoya (Costa Rica), Ikaria (Hy Lạp)<a class="ev ev-mid" href="#r-poulain2013" title="Poulain 2013 · Bằng chứng vừa"></a>. Từ đó, nhà báo Dan Buettner rút ra **Power 9** — chín thói quen chung<a class="ev ev-low" href="#r-buettner2016" title="Buettner 2016 · Bằng chứng yếu hoặc đang tranh cãi"></a>:

1. Vận động tự nhiên trong ngày (làm vườn, đi bộ), không cần phòng tập.
2. Có mục đích sống.
3. Có cách xả căng thẳng mỗi ngày.
4. Ăn tới tám phần no thì dừng.
5. Ăn nhiều rau, đậu.
6. Uống một chút rượu vang cùng bạn bè.
7. Thuộc về một cộng đồng tín ngưỡng.
8. Đặt gia đình lên trước.
9. Chơi với những người có lối sống lành mạnh.

**Ví dụ.** Rất giống một làng quê Việt ngày xưa: ông bà làm vườn đến già, ăn cơm rau, chiều chiều ngồi chơi với hàng xóm, con cháu quây quần.

**Bằng chứng.** Một số vùng sống thọ có thật, nhưng chưa ai chứng minh vì sao<a class="ev ev-mid" href="#r-candalpedreira2025" title="Candal-Pedreira 2025 · Bằng chứng vừa"></a>. Danh sách Power 9 không đến từ một nghiên cứu được kiểm định<a class="ev ev-low" href="#r-buettner2016" title="Buettner 2016 · Bằng chứng yếu hoặc đang tranh cãi"></a>, và mục rượu vang không được ủng hộ khi đã hiệu chỉnh sai lệch<a class="ev ev-high" href="#r-zhao2023" title="Zhao 2023 · Bằng chứng mạnh"></a>.

<h2 id="hara-hachi-bu"><span class="num">31</span>Hara hachi bu — ăn tám phần no</h2>

**Nó là gì.** Một câu dặn truyền thống ở Okinawa: **ăn tới khi no khoảng 80% thì dừng đũa**.

**Ví dụ.** Bữa cỗ ngon, còn muốn ăn thêm một bát — nhưng dừng, uống cốc nước, mười lăm phút sau sẽ thấy vừa đủ.

**Bằng chứng.** Người Okinawa thế hệ trước ăn ít calo hơn nhu cầu một chút<a class="ev ev-mid" href="#r-willcox2007" title="Willcox 2007 · Bằng chứng vừa"></a>; còn bản thân câu dặn "tám phần no" chỉ được ghi nhận như một tập quán, chưa ai kiểm chứng riêng. Lợi thế tuổi thọ của Okinawa thuộc về thế hệ trước chiến tranh và đã mất dần<a class="ev ev-mid" href="#r-poulain2024" title="Poulain 2024 · Bằng chứng vừa"></a>.

<h2 id="mediterranean"><span class="num">32</span>Ăn kiểu Địa Trung Hải</h2>

**Nó là gì.** Cách ăn truyền thống của các nước quanh Địa Trung Hải: **nhiều rau, trái cây, đậu, ngũ cốc nguyên hạt, các loại hạt, cá; dầu ô liu là chất béo chính; ít thịt đỏ và đồ chế biến sẵn**.

**Ví dụ.** Phiên bản Việt dễ làm: mâm cơm nhiều rau luộc, đậu phụ, cá kho, ít thịt mỡ, ít xúc xích.

**Bằng chứng.** Thử nghiệm nổi tiếng nhất, PREDIMED, từng bị rút năm 2018 rồi đăng lại, vẫn cho thấy ít biến cố tim mạch hơn<a class="ev ev-mid" href="#r-estruch2018" title="Estruch 2018 · Bằng chứng vừa"></a>; tổng quan Cochrane đánh giá bằng chứng ở mức thấp tới trung bình<a class="ev ev-high" href="#r-rees2019" title="Rees 2019 · Bằng chứng mạnh"></a>; các nghiên cứu theo dõi thấy ăn đúng kiểu này đi kèm tử vong thấp hơn<a class="ev ev-high" href="#r-sofi2008" title="Sofi 2008 · Bằng chứng mạnh"></a>.

<h2 id="harvard"><span class="num">33</span>Nghiên cứu Harvard về đời người</h2>

**Nó là gì.** Một trong những nghiên cứu theo dõi dài nhất thế giới: bắt đầu từ cuối thập niên 1930 với hai nhóm đàn ông — sinh viên Harvard và thanh niên các khu nghèo ở Boston — theo dõi suốt cả đời họ<a class="ev ev-mid" href="#r-vaillant2001" title="Vaillant 2001 · Bằng chứng vừa"></a>.

**Ví dụ.** Hai người bạn cùng lớp năm 20 tuổi: người giữ được hôn nhân ấm êm và bạn bè thân thiết thường già đi khoẻ mạnh hơn người giàu hơn nhưng cô độc.

**Bằng chứng.** Cách một người già đi ở tuổi 70–80 được dự báo bằng những gì có từ trước tuổi 50, trong đó có các mối quan hệ<a class="ev ev-mid" href="#r-vaillant2001" title="Vaillant 2001 · Bằng chứng vừa"></a>; ở tuổi già, hôn nhân hạnh phúc giúp tâm trạng hằng ngày ít bị bệnh tật kéo xuống<a class="ev ev-mid" href="#r-waldinger2010" title="Waldinger 2010 · Bằng chứng vừa"></a>. Đây là nghiên cứu theo dõi, không phải thử nghiệm.

<h2 id="healthy-ageing"><span class="num">34</span>Già khoẻ theo WHO</h2>

**Nó là gì.** Tổ chức Y tế Thế giới định nghĩa "già khoẻ" (healthy ageing) không phải là không có bệnh, mà là **giữ được khả năng tự làm những việc mình coi trọng**<a class="ev ev-high" href="#r-who2015" title="WHO 2015 · Bằng chứng mạnh"></a>.

**Ví dụ.** Một cụ ông bị tiểu đường nhưng vẫn tự đi chợ, tự đạp xe sang nhà con, vẫn chơi cờ với hội bạn — theo WHO, cụ đang già khoẻ.

**Bằng chứng.** Một định nghĩa chính thức<a class="ev ev-high" href="#r-who2015" title="WHO 2015 · Bằng chứng mạnh"></a>.

<h2 id="social-connection"><span class="num">35</span>Kết nối xã hội như một yếu tố sức khoẻ</h2>

**Nó là gì.** Năm 2023, Tổng Y sĩ Hoa Kỳ ra hẳn một báo cáo coi **cô đơn và cô lập** là vấn đề sức khoẻ cộng đồng, ngang hàng với hút thuốc hay béo phì<a class="ev ev-high" href="#r-ussurgeongeneral2023" title="US Surgeon General 2023 · Bằng chứng mạnh"></a>.

**Ví dụ.** Ông bà ta nói "bán anh em xa, mua láng giềng gần". Một người sống một mình, không ai hỏi han, ốm một tuần cũng chẳng ai biết — đó là điều báo cáo này lo nhất.

**Cách thử.** Viết tên ba người thân nhất ngoài gia đình ruột thịt, ghi lần gần nhất thật sự nói chuyện; tên nào đã hơn một tháng, tuần này nhắn một tin<span class="ev ev-hyp" title="Suy luận, quy ước thực hành hoặc đề xuất của tài liệu này"></span>.

**Bằng chứng.** Thiếu kết nối làm tăng nguy cơ chết sớm ngang hút tới 15 điếu thuốc mỗi ngày<a class="ev ev-high" href="#r-ussurgeongeneral2023" title="US Surgeon General 2023 · Bằng chứng mạnh"></a>; gộp 148 nghiên cứu, người có quan hệ xã hội mạnh có khả năng sống sót cao hơn khoảng 50%<a class="ev ev-high" href="#r-holtlunstad2010" title="Holt-Lunstad 2010 · Bằng chứng mạnh"></a>.

<div class="recall">

**Câu hỏi nhớ lại**

<details><summary>Ba nhu cầu nền của Self-Determination Theory là gì?</summary><div class="inner">

Tự chủ (được tự chọn), năng lực (thấy mình làm được và tiến bộ), gắn kết (có người thân thiết).

</div></details>

<details><summary>Năm chữ cái của PERMA là gì?</summary><div class="inner">

Positive emotion, Engagement, Relationships, Meaning, Accomplishment.

</div></details>

<details><summary>WOOP gồm bốn bước nào, và vì sao bước thứ ba quan trọng?</summary><div class="inner">

Wish, Outcome, Obstacle, Plan. Bước Obstacle buộc mình nghĩ tới trở ngại trong chính mình — điều mà kiểu chỉ mơ về đích (luật hấp dẫn) bỏ qua.

</div></details>

<details><summary>Ikigai gốc của Nhật khác sơ đồ bốn vòng tròn ở đâu?</summary><div class="inner">

Ikigai gốc là "lẽ sống" — điều khiến mình muốn thức dậy mỗi sáng, có thể rất nhỏ. Sơ đồ bốn vòng tròn (yêu thích, giỏi, thế giới cần, được trả tiền) là một bản chuyển thể trên blog năm 2014.

</div></details>

<details><summary>Life's Essential 8 gồm những gì?</summary><div class="inner">

Bốn thói quen — ăn uống, vận động, không hút thuốc, giấc ngủ — và bốn chỉ số trong cơ thể — cân nặng, mỡ máu, đường huyết, huyết áp.

</div></details>

</div>
